:root{
--paper:#ece6da;--panel:#f1ebe1;--tint:#e7e0d2;--hover:#f7f2e9;--card:#f4efe6;--press-bg:#e6dfd1;
--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;--navy:#20263a;--amber:#e08a3e;--red:#c23a2b;--cat:#1f7f8f;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--sh-paper:12px 14px 28px rgba(120,100,70,.38),-5px -5px 12px rgba(255,255,255,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"BJ",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:20px;height:20px;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}


/* 앱 공통 */
.hd{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;flex-shrink:0}
.hd h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--up-s);display:grid;place-items:center;flex-shrink:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 110px}
.body::-webkit-scrollbar{width:0}
.srch{display:flex;align-items:center;gap:8px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:11px 14px;color:var(--ink3);font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy);color:var(--ink)}
.chips.tg .chip{font-weight:500;background:none;box-shadow:inset 0 0 0 1.5px #cfc5b2;padding:6px 11px;font-size:13.5px}
.chips.tg .chip.on{box-shadow:inset 0 0 0 2px var(--navy);color:var(--ink);font-weight:600}
.lbl{font-size:13px;font-weight:700;color:var(--ink3);margin:16px 2px 8px;letter-spacing:.02em;display:flex;justify-content:space-between}
.off{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:12px;box-shadow:4px 6px 14px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85);border:0;width:100%;text-align:left}
.off img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0}
.off b{display:block;font-size:15.5px}.off small{display:block;font-size:12.5px;color:#c9cbd6;margin-top:3px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{border:0;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:9px 9px 11px;text-align:left;min-width:0;position:relative}
.rc .ph{width:100%;aspect-ratio:4/3;border-radius:11px;object-fit:cover;display:block;background:var(--tint)}
.rc .ph.no{display:grid;place-items:center;color:var(--ink3);box-shadow:var(--in)}
.rc .ph.no svg{width:30px;height:30px;opacity:.55}
.rc b{display:block;font-size:15px;margin:9px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{display:block;font-size:12.5px;color:var(--ink3);margin:3px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .fv{position:absolute;right:15px;top:15px;width:26px;height:26px;border-radius:50%;background:rgba(31,33,37,.55);display:grid;place-items:center;color:#fff}
.rc .fv svg{width:14px;height:14px}
.fab{position:absolute;right:18px;bottom:88px;width:58px;height:58px;border-radius:18px;border:0;background:var(--amber);color:#fff;display:grid;place-items:center;box-shadow:4px 6px 14px rgba(170,110,55,.5),-3px -3px 8px rgba(255,255,255,.8);z-index:3}
.fab svg{width:26px;height:26px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--panel);box-shadow:0 -1px 0 rgba(160,140,108,.25),0 -8px 18px -10px rgba(120,100,70,.35);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 18px;z-index:2}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink3);border-radius:12px;position:relative}
.tabs button.on{color:var(--navy);background:var(--press-bg);box-shadow:var(--press)}
.tabs button .bd{position:absolute;top:2px;right:22%;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;line-height:17px;font-weight:700}
.btmbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);padding:12px 18px 20px;display:flex;gap:10px;box-shadow:0 -1px 0 rgba(160,140,108,.25),0 -8px 18px -10px rgba(120,100,70,.35);z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:0;font-size:15px;font-weight:600;padding:11px 16px;min-height:48px;border-radius:13px;box-shadow:var(--up-s);white-space:nowrap}
.btn.go{background:var(--amber);color:#fff;font-weight:700;flex:1;box-shadow:4px 6px 14px rgba(170,110,55,.45),-3px -3px 8px rgba(255,255,255,.85)}
.btn.nv{background:var(--navy);color:#fff;box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.w{width:100%}

/* 상세 */
.hero{position:relative;margin:0 -18px}
.hero img,.hero .no{width:100%;height:230px;object-fit:cover;display:block}
.hero .no{display:grid;place-items:center;background:var(--tint);color:var(--ink3);font-size:13.5px;text-align:center;line-height:1.6;box-shadow:var(--in)}
.thumbs{display:flex;gap:8px;padding:10px 0 0;overflow-x:auto}
.thumbs div{flex-shrink:0;width:64px;height:64px;border-radius:10px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;display:grid;place-items:center;font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.3}
.thumbs div img{width:100%;height:100%;object-fit:cover}
.thumbs div em{position:absolute;left:4px;bottom:4px;font-style:normal;background:rgba(31,33,37,.7);color:#fff;font-size:10.5px;border-radius:5px;padding:1px 5px}
.thumbs div.main{box-shadow:0 0 0 2px var(--navy)}
.ttl{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:14px 0 4px}
.meta{font-size:13.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:13px;color:var(--ink2);box-shadow:inset 0 0 0 1.5px #cfc5b2;border-radius:8px;padding:2px 8px}
.cat{font-size:13px;font-weight:700;color:#fff;background:var(--cat);border-radius:7px;padding:3px 8px}
.amt{display:flex;align-items:center;gap:10px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:8px;margin-top:14px}
.amt .stp{width:42px;height:42px;border-radius:11px;border:0;background:var(--card);box-shadow:var(--up-s);font-size:22px;font-weight:700}
.amt .v{flex:1;text-align:center}.amt .v b{font-size:21px;font-variant-numeric:tabular-nums}.amt .v small{display:block;font-size:12px;color:var(--ink3)}
.sec{margin-top:20px}
.sec h4{margin:0 0 6px;font-size:15px;font-weight:800;padding-bottom:7px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.sec h4 small{font-size:12.5px;color:var(--ink3);font-weight:600}
.ing{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #ddd4c3;font-size:15px}
.ing b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .gn{font-size:12.5px;color:var(--ink3);font-weight:700;padding-top:14px;border:0}
.stp-l{counter-reset:s;list-style:none;margin:0;padding:0}
.stp-l li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-bottom:1px solid #ddd4c3;font-size:14.5px;line-height:1.55}
.stp-l li:before{content:counter(s);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.log{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid #ddd4c3;font-size:14px}
.log .d{font-variant-numeric:tabular-nums;color:var(--ink3);width:84px;flex-shrink:0}

.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sr textarea{resize:vertical;min-height:46px;font-family:inherit}
.sr .mv button:last-child{color:var(--red)}
.btn.danger{color:var(--red)}
textarea.inp{resize:vertical;line-height:1.55;font-family:inherit}

.okb{font-size:11.5px;background:var(--cat);color:#fff;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.sm2{font-size:12.5px}
.warn .lk{color:#5e4520}
.sheet{position:absolute;inset:0;z-index:6}
.sheet .in{max-height:86%;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.sht{display:block;font-size:18px;margin-bottom:4px}
.opt{cursor:pointer}.opt.on{box-shadow:var(--press),0 0 0 2px var(--navy)}
.mrow{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--up-s);border-radius:12px;padding:6px 6px 6px 14px;margin-top:8px}
.mrow span{flex:1;font-weight:600}.mrow small{color:var(--ink3);font-weight:500}
.ib.s{width:34px;height:34px;border-radius:10px;border:0;background:var(--tint);display:grid;place-items:center}
.ib.s svg{width:16px;height:16px}
.pk .li{margin-top:8px}
.pv{position:fixed}
.pv .pb{overflow:hidden;touch-action:none;cursor:grab}
.pv .pb img{max-height:100%;max-width:100%;object-fit:contain;transition:none;user-select:none}

#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;background:rgba(31,33,37,.35);z-index:19;display:none;place-items:center}
#busy.on{display:grid}
#busy div{background:var(--panel);border-radius:16px;padding:18px 22px;font-weight:700;box-shadow:var(--up)}

body.pc .pcl{max-width:1400px;margin:0 auto;grid-template-columns:390px minmax(0,1fr)}
body.pc .pcp{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
body.pc .pcp .rows .li{margin-top:8px}
body.pc .pmain{background:var(--panel);border-radius:20px;box-shadow:var(--up);min-width:0;display:flex;flex-direction:column;position:relative}
body.pc .pmain .hd{padding:18px 26px 6px}
body.pc .pmain .body{overflow:visible;padding:6px 28px 28px;flex:none}
body.pc .pmain .btmbar{position:sticky;bottom:0;border-radius:0 0 20px 20px;padding:14px 26px;justify-content:flex-end}

body.pc .pmain .fab{display:none}
body.pc .pmain .hero{margin:0 -28px;}
body.pc .pmain .hero img,body.pc .pmain .hero .no{height:380px}
body.pc .pmain .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
body.pc .sheet{position:fixed;align-items:center;justify-content:center}

body.pc #toast{bottom:40px}
.pfoot{text-align:center;font-size:12.5px;color:var(--ink3);padding:4px 0 30px}

#print{display:none}

  .ppf{margin-top:8mm;font-size:8.5pt;color:#666;display:flex;justify-content:space-between;gap:10mm}
}

.opt small b{display:inline;font-size:inherit;color:var(--ink)}
[hidden]{display:none!important}

const DBN = "bj-recipe-note";
let db = null;
function idbOpen() {
  return new Promise((res, rej) => { try { const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => { const d = r.result; [["recipes", "id"], ["photos", "id"], ["shops", "id"], ["meta", "k"]].forEach(([n, k]) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: k }); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
}
function st(store, mode, fn) {
  if (!db) return Promise.resolve(null);
  return new Promise((res, rej) => { const t = db.transaction(store, mode); const q = fn(t.objectStore(store)); let out = null; if (q) q.onsuccess = () => out = q.result; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
}
const getAll = s => st(s, "readonly", o => o.getAll());
const putO = (s, v) => st(s, "readwrite", o => o.put(v));
const delO = (s, k) => st(s, "readwrite", o => o.delete(k));

  if (!gdCid()) throw new Error("클라이언트 ID가 없어요 — 설정에서 넣어 주세요");
  await gdLoad();
  return new Promise((res, rej) => {
    GD.tc = google.accounts.oauth2.initTokenClient({ client_id: gdCid(), scope: GD_SCOPE, hint: D.set.gdEmail || undefined,
      callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); GD.token = r.access_token; GD.exp = Date.now() + (r.expires_in || 3600) * 1000; res(GD.token); },
      error_callback: e => rej(new Error(e && e.type === "popup_closed" ? "구글 창을 닫았어요" : e && e.type === "popup_failed_to_open" ? "팝업이 막혔어요 — 주소창의 팝업 허용을 눌러 주세요" : "구글 연결이 취소됐어요")) });
    GD.tc.requestAccessToken({ prompt: interactive && !D.set.gdOn ? "consent" : "" });
  });
}
async function gdApi(url, opt = {}, retry = true) {
  const t = await gdToken(false);
  const r = await fetch(url.startsWith("http") ? url : "https://www.googleapis.com/drive/v3/" + url, { ...opt, headers: { ...(opt.headers || {}), Authorization: "Bearer " + t } });
  if (r.status === 401 && retry) { GD.token = null; return gdApi(url, opt, false); }
  if (!r.ok) { let m = r.status + ""; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) {} throw new Error("드라이브 응답 오류: " + m); }
  return r;
}
const gq = s => encodeURIComponent(s);
async function gdFolder() {
  if (GD.fid) return GD.fid;
  const r = await (await gdApi(`files?q=${gq(`name='${GDF}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id,name)&spaces=drive`)).json();
  if (r.files && r.files.length) return GD.fid = r.files[0].id;
  const c = await (await gdApi("files?fields=id", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: GDF, mimeType: "application/vnd.google-apps.folder" }) })).json();
  return GD.fid = c.id;
}
async function gdList() {
  const fid = await gdFolder(), map = {}; let pt = "";
  do { const r = await (await gdApi(`files?q=${gq(`'${fid}' in parents and trashed=false`)}&fields=nextPageToken,files(id,name,modifiedTime)&pageSize=1000${pt ? "&pageToken=" + pt : ""}`)).json();
    (r.files || []).forEach(f => map[f.name] = f); pt = r.nextPageToken; } while (pt);
  return GD.files = map;
}
async function gdUpload(name, blob, mime, id) {
  const meta = id ? {} : { name, parents: [await gdFolder()] };
  const fd = new FormData(); fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" })); fd.append("file", blob instanceof Blob ? blob : new Blob([blob], { type: mime }));
  const r = await (await gdApi(`https://www.googleapis.com/upload/drive/v3/files${id ? "/" + id : ""}?uploadType=multipart&fields=id,name,modifiedTime`, { method: id ? "PATCH" : "POST", body: fd })).json();
  if (GD.files) GD.files[name] = r; return r;
}
const gdGet = async id => (await gdApi(`files/${id}?alt=media`)).blob();
/* 맞추기: ① 드라이브 것을 받아 더 최근 것만 반영 ② 지금 것을 드라이브에 씀(사진은 없는 것만 올리고, 지운 사진은 휴지통으로) */
async function gdSync(opt = {}) {
  if (GD.busy) { GD.again = true; return; } GD.busy = true; GD.err = ""; GD.msg = "구글 드라이브와 맞추는 중…"; gdPaint();
  let got = { nr: 0, np: 0 };
  try {
    await gdToken(!!opt.interactive);
    const files = await gdList();
    if (files["레시피노트.json"] && !opt.pushOnly) {
      const o = JSON.parse(await (await gdGet(files["레시피노트.json"].id)).text());
      GD.importing = true; try { got = await importData(o, async id => files[id + ".jpg"] ? await gdGet(files[id + ".jpg"].id) : null); } finally { GD.importing = false; }
    }
    const want = new Set(); for (const r of D.recipes) for (const p of r.photos || []) want.add(p.id + ".jpg");
    let up = 0; for (const n of want) if (!files[n]) { const o = await st("photos", "readonly", s => s.get(n.replace(/\.jpg$/, ""))); if (o) { GD.msg = `사진 올리는 중 ${++up}…`; gdPaint(); await gdUpload(n, o.blob, "image/jpeg"); } }
    for (const n of Object.keys(files)) if (/^p.*\.jpg$/.test(n) && !want.has(n)) await gdApi(`files/${files[n].id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true }) }).catch(() => {});
    D.set.savedAt = Date.now();
    await gdUpload("레시피노트.json", new Blob([JSON.stringify(exportObj())], { type: "application/json" }), "application/json", files["레시피노트.json"] && files["레시피노트.json"].id);
    D.set.gdLast = Date.now(); D.set.gdOn = true; await setMeta("set", D.set);
    GD.msg = got.nr || got.np ? `맞췄어요 — 받은 레시피 ${got.nr}개 · 사진 ${got.np}장` : "맞췄어요";
    if (opt.toast !== false) toast(GD.msg);
    if (got.nr || got.np) render();
  } catch (e) { GD.err = e.message; GD.msg = ""; if (opt.toast !== false) toast("구글 드라이브: " + e.message); }
  GD.busy = false; gdPaint(); if (GD.again) { GD.again = false; setTimeout(() => gdSync({ toast: false }), 500); }
}
/* 고칠 때마다 자동으로 올리기 — 토큰이 살아 있을 때만(1시간), 없으면 다음 「맞추기」 때 */
let gdT; function gdAuto() { if (!gdOn() || !gdHttp() || !GD.token || Date.now() > GD.exp - 60000) { if (gdOn()) gdPaint(); return; } clearTimeout(gdT); gdT = setTimeout(() => gdSync({ toast: false }), 2500); }
function gdPaint() { const el = $("#gdbox"); if (el) el.outerHTML = gdBox(); const b = $("#gdbar"); if (b) b.outerHTML = gdBar(); }
const gdAgo = t => { if (!t) return "아직 없음"; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "방금" : m < 60 ? m + "분 전" : m < 1440 ? Math.round(m / 60) + "시간 전" : new Date(t).toLocaleDateString("ko-KR"); };
function gdBox() {
  if (!gdHttp()) return `<div class="row" id="gdbox">${IC.link}<div class="t"><b>구글 드라이브 연동 <span class="okb" style="background:var(--amber)">v1.1 시험</span></b><small>받은 파일(내 PC)로 연 화면에서는 구글 로그인이 막혀요. PC도 <b class="url">pegasus0710-arch.github.io/jesa_tools/recipe/</b> 주소로 열어서(주소창 오른쪽 「설치」로 앱처럼) 연결해 주세요.</small></div></div>`;
  const live = GD.token && Date.now() < GD.exp - 60000;
  return `<div class="row" id="gdbox">${IC.link}<div class="t"><b>구글 드라이브 연동 <span class="okb" style="background:${gdOn() ? "var(--cat)" : "var(--amber)"}">${gdOn() ? "연결됨" : "v1.1 시험"}</span></b>
    <small>${gdOn() ? `내 구글 드라이브 › <b class="url">${GDF}</b> 폴더와 맞춰요. 마지막으로 맞춘 때: ${gdAgo(D.set.gdLast)}${live ? " · 고칠 때마다 자동으로 올려요" : " · 「지금 맞추기」를 누르면 최신으로"}` : "휴대폰 · PC에서 같은 구글 계정으로 연결하면 같은 레시피를 함께 써요. 내 드라이브에 「레시피노트」 폴더가 생기고, 이 앱은 그 폴더 말고 다른 파일은 볼 수 없어요.<br>· 구글 창에 「Google에서 확인하지 않은 앱」이 뜨면 「고급」 → 「레시피노트(으)로 이동」을 눌러 주세요(지금은 시험 중이라 나오는 화면이에요)."}
    ${GD.msg ? `<br><b class="url">${esc(GD.msg)}</b>` : ""}${GD.err ? `<br><span style="color:var(--red)">${esc(GD.err)}</span>` : ""}</small>
    ${!gdCid() ? `<div class="addl"><input class="inp" id="gdcid" placeholder="시험용 OAuth 클라이언트 ID (….apps.googleusercontent.com)" value=""><button class="btn sm" data-gdcid>넣기</button></div>` : ""}
    <div class="row2">${gdOn() ? `<button class="btn sm nv" data-gdsync ${GD.busy ? "disabled" : ""}>지금 맞추기</button><button class="btn sm" data-gdoff>연결 끊기</button>` : `<button class="btn sm nv" data-gdon ${!gdCid() || GD.busy ? "disabled" : ""}>구글 드라이브 연결</button>`}</div></div></div>`;
}
/* 목록 위 띠: 연결돼 있는데 토큰이 없으면(앱을 새로 열면) 한 번 눌러 맞추기 */
function gdBar() { if (!gdOn() || !gdHttp()) return `<span id="gdbar"></span>`; const live = GD.token && Date.now() < GD.exp - 60000;
  return live && !GD.busy ? `<span id="gdbar"></span>` : `<div class="bn2 soft" id="gdbar"><div class="t"><b>${GD.busy ? "구글 드라이브와 맞추는 중…" : "구글 드라이브와 맞추기"}</b><br>${GD.busy ? esc(GD.msg) : `다른 기기에서 고친 레시피를 받아 와요 · 마지막: ${gdAgo(D.set.gdLast)}`}</div>${GD.busy ? "" : `<button data-gdsync>맞추기</button>`}</div>`; }

/* 누르기 */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-gdon],[data-gdsync],[data-gdoff],[data-gdcid]"); if (!t) return; const d = t.dataset;
  if (d.gdcid != null) { const v = ($("#gdcid").value || "").trim(); if (!/\.apps\.googleusercontent\.com$/.test(v)) return toast("…apps.googleusercontent.com 으로 끝나는 클라이언트 ID를 넣어 주세요."); D.set.gdCid = v; await setMeta("set", D.set); return render(); }
  if (d.gdon != null) { try { await gdToken(true); } catch (er) { GD.err = er.message; gdPaint(); return toast(er.message); } D.set.gdOn = true; await setMeta("set", D.set); return gdSync({ interactive: true }); }
  if (d.gdsync != null) { try { await gdToken(true); } catch (er) { GD.err = er.message; gdPaint(); return toast(er.message); } return gdSync({}); }
  if (d.gdoff != null) { D.set.gdOn = false; GD.token = null; GD.fid = null; await setMeta("set", D.set); try { google.accounts.oauth2.revoke && GD.token && google.accounts.oauth2.revoke(GD.token); } catch (er) {} toast("연결을 끊었어요. 드라이브의 레시피노트 폴더는 그대로 남아요."); return render(); }
});
/* 화면을 다시 보면(다른 기기에서 고쳤을 수 있으니) 토큰이 살아 있으면 조용히 맞춤 */
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && gdOn() && GD.token && Date.now() < GD.exp - 60000) gdSync({ toast: false }); });


if (/^https?:/.test(location.protocol) && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
