:root{--paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--ink:#1f2125;--sub:#5b5547;--sub2:#6f6857;--g:#195455;--gh:#12403f;--gl:#e3ecea;--or:#f56d03;--red:#c23a2b;--hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.22);
 --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);--up-s:0 0 0 1px rgba(90,74,50,.1),0 1px 2px rgba(90,74,50,.06);--in:inset 0 0 0 1px rgba(90,74,50,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"BJ","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#root{min-height:100%;display:flex;flex-direction:column}
/* 머리 */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);box-shadow:0 1px 0 var(--hair)}
.badge{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;flex-shrink:0;position:relative}
.badge svg{width:22px;height:22px}
.badge i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--panel)}
.tname{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.tname small{font-weight:600;font-size:12.5px;color:var(--sub2);margin-left:6px}
.ruler{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.rs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub2);font-weight:600;white-space:nowrap}
.rs b{width:10px;height:10px;border-radius:50%;background:var(--tint);box-shadow:var(--in)}
.rs.done b,.rs.on b{background:var(--or);box-shadow:none}
.rs.on{color:var(--ink);font-weight:800}
.rl{width:28px;height:2px;background:var(--tint);margin:0 6px}
.rl.done{background:var(--or)}
.tb{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card);box-shadow:var(--up-s)}
.ib svg{width:20px;height:20px}
.ib.off{opacity:.45}
.ib:hover{box-shadow:0 0 0 1px var(--g)}
@media (max-width:640px){.ruler .rs span{display:none}.rl{width:16px;margin:0 4px}.tname small{display:none}}
/* 본문 */
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px}
.wrap{width:100%;max-width:720px}
h2.st{font-size:22px;margin:4px 0 4px;letter-spacing:-.4px}
.lead{color:var(--sub);font-size:15px;margin:0 0 16px;line-height:1.6}
.card{background:var(--card);border-radius:14px;box-shadow:var(--up);padding:18px}
.lbl{font-weight:800;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.lbl em{font-style:normal;font-weight:600;font-size:13px;color:var(--sub2)}
.sec{margin-top:18px}
.stepper{display:inline-flex;align-items:center;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:9px;font-size:24px;font-weight:700}
.stepper button:hover{background:var(--card)}
.stepper b{min-width:64px;text-align:center;font-size:22px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.nm{display:flex;align-items:center;gap:8px;background:var(--tint);box-shadow:var(--in);border-radius:10px;padding:0 10px}
.nm span{font-size:13px;color:var(--sub2);font-weight:700;width:18px;text-align:right}
.nm input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;font-weight:600;outline:0}
.nm:focus-within{box-shadow:inset 0 0 0 1.5px var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);font-weight:600;font-size:15px}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g);font-weight:800;background:var(--card)}
.chip.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:7px;vertical-align:2px}
.pin{margin-top:10px;width:100%;border:0;border-radius:10px;background:var(--tint);box-shadow:var(--in);padding:12px;font-size:16px;outline:0}
.pin:focus{box-shadow:inset 0 0 0 1.5px var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;font-weight:800;font-size:16.5px;background:var(--card);box-shadow:var(--up-s)}
.btn:hover{box-shadow:0 0 0 1px var(--g)}
.btn.p{background:var(--g);color:#fff;box-shadow:0 1px 2px rgba(15,55,56,.25)}
.btn.p:hover{background:var(--gh)}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{min-height:64px;font-size:20px;width:100%}
.btn svg{width:20px;height:20px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn.p{flex:1}
.note{font-size:13.5px;color:var(--sub2);line-height:1.6;margin-top:12px}
/* 게임 고르기 */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gc{text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--up);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:box-shadow .12s}
.gc:hover{box-shadow:0 0 0 1.5px var(--g),var(--up)}
.gc .gi{width:46px;height:46px;border-radius:12px;background:var(--gl);display:grid;place-items:center}
.gc .gi svg{width:28px;height:28px}
.gc b{font-size:17.5px;letter-spacing:-.3px}
.gc p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.gc .tg{font-size:12.5px;color:var(--sub2);font-weight:700;margin-top:auto}
.gc.dim{opacity:.55}
/* 놀이 화면 */
.play{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:720px;gap:16px;text-align:center}
.who{font-size:15px;color:var(--sub);font-weight:700}
.who b{display:block;font-size:clamp(34px,9vw,58px);color:var(--ink);letter-spacing:-1px;line-height:1.15;margin-top:4px;word-break:keep-all}
.order{font-size:14px;color:var(--sub2);line-height:1.8}
.order b{color:var(--g)}
.order .cur{color:#fff;background:var(--g);padding:2px 8px;border-radius:6px}
.stage{width:min(78vw,330px);height:min(78vw,330px);display:grid;place-items:center;position:relative}
.ptop{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:720px;margin-bottom:6px}
.ptop .gnm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.ptop .gnm svg{width:22px;height:22px}
.quit{font-size:14px;color:var(--sub2);font-weight:700;padding:8px 10px;border-radius:8px}
.quit:hover{background:var(--card)}
.intro{background:var(--card);border-radius:18px;box-shadow:var(--up);padding:24px 20px;width:100%;max-width:520px;text-align:left}
.intro h3{margin:0 0 10px;font-size:21px;display:flex;align-items:center;gap:10px}
.intro h3 svg{width:30px;height:30px}
.intro ol{margin:0 0 14px;padding-left:20px;line-height:1.75;font-size:15.5px}
.hold{height:6px;border-radius:3px;background:var(--tint);overflow:hidden;width:100%;max-width:330px}
.hold i{display:block;height:100%;background:var(--g);width:0}
/* 폭탄 */
.bomb svg{width:100%;height:100%}
.spark{transform-origin:center;animation:sp .35s infinite alternate}
@keyframes sp{from{transform:scale(.8);opacity:.7}to{transform:scale(1.15);opacity:1}}
.shake{animation:sh .12s infinite}
@keyframes sh{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}

<script>

    </div></div>`;

    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {

})();

/* ── 소리 · 진동 ── */
let AC = null;
function ac() { if (!S.sound) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; } return AC; }

/* ── 공통: 게임 시작 안내 → 한 판 → 결과 ── */

function lose(name, note, delay) {

const orderLine = (order, cur) => `<div class="order">${order.map((p, i) => i === cur ? `<span class="cur">${esc(p)}</span>` : esc(p)).join(" → ")}</div>`;

const RUN = {

    const btn = $("#pass"), hb = $("#hb");

    setLock();

  /* 2) 풍선 터뜨리기 */

    pl.innerHTML = `<div class="who">바람 넣을 사람<b id="bw">${esc(order[0])}</b></div>
      <div class="stage"><svg viewBox="0 0 200 220" width="100%" height="100%"><g id="bl" class="bal" style="transform-origin:100px 176px;transform:scale(.45)"><path d="M100 22c40 0 66 30 66 68 0 42-34 80-66 80s-66-38-66-80c0-38 26-68 66-68z" fill="#195455"/><path d="M68 64a34 34 0 0 1 22-20" stroke="#fff" stroke-opacity=".45" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M92 170l-5 10h26l-5-10z" fill="#12403f"/></g><path d="M100 180c0 14-10 16-10 34" stroke="#6f6857" stroke-width="3" fill="none"/></svg></div>
      <div class="who" id="left">이번 차례 1~3번</div>
      <div class="acts" style="width:100%;max-width:420px;margin:0"><button class="btn p big" id="pump" style="flex:1">바람 넣기</button><button class="btn big" id="pass" style="flex:1" disabled>넘기기</button></div>${orderLine(order, 0)}`;
    const bl = $("#bl"), pumpB = $("#pump"), passB = $("#pass");
    const upd = () => { const sc = .45 + Math.min(.6, pumps / 30 * .6) + R(-.02, .02); bl.style.transform = `scale(${sc})`; $("#left").textContent = mine ? `${mine}번 넣었어요 · ${3 - mine}번 더 넣을 수 있어요` : "이번 차례 1~3번"; pumpB.disabled = mine >= 3; passB.disabled = mine < 1; };
    pumpB.onclick = () => { if (done || mine >= 3) return; pumps++; mine++; SND.pump(); vib(20);
      if (pumps >= limit) { done = true; SND.pop(); vib([300, 60, 300]); bl.style.transition = "transform .12s"; bl.style.transform = "scale(1.35)"; setTimeout(() => { bl.style.opacity = 0; }, 120);
        const b = document.createElement("div"); b.className = "boom"; b.innerHTML = `<b>빵!</b>`; setTimeout(() => document.body.appendChild(b), 150); lose(order[cur], "풍선이 " + limit + "번째 바람에 터졌어요", 1500); return; }

    const finish = (f, why) => { if (phase === 2) return; phase = 2; clearTimeout(timer); if (f) { f.el.className = "fg lose"; }

      setTimeout(() => { const ppl = people(); const box = document.createElement("div"); box.style.cssText = "position:absolute;left:12px;right:12px;bottom:70px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center";
        box.innerHTML = ppl.map((p, i) => `<button class="btn" data-i="${i}" style="min-height:46px">${esc(p)}</button>`).join(""); ov.appendChild(box);
        box.onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; ov.remove(); lose(ppl[+b.dataset.i], why ? "손가락을 먼저 뗐어요" : "마지막까지 남은 손가락"); }; }, 700); };
    const onStart = e => { e.preventDefault(); if (phase === 2) return;
      for (const t of e.changedTouches) { if (phase === 1) continue; const el = document.createElement("div"); el.className = "fg on"; place(t, el); ov.appendChild(el); F.set(t.identifier, { el, out: false }); SND.key(); }
      if (phase === 0) arm(); };
    const onMove = e => { e.preventDefault(); for (const t of e.changedTouches) { const f = F.get(t.identifier); if (f) place(t, f.el); } };
    const onEnd = e => { e.preventDefault(); for (const t of e.changedTouches) { const f = F.get(t.identifier); if (!f) continue;
        if (phase === 0) { f.el.remove(); F.delete(t.identifier); arm(); }
        else if (phase === 1 && !f.out) { finish(f, "통과 전에 손을 뗐어요 — 그 사람이 독박!"); } } };
    ov.addEventListener("touchstart", onStart, { passive: false }); ov.addEventListener("touchmove", onMove, { passive: false });
    ov.addEventListener("touchend", onEnd, { passive: false }); ov.addEventListener("touchcancel", onEnd, { passive: false });
    $("#fx").onclick = () => go(1);
    G_STOP = () => { stopped = true; clearTimeout(timer); ov.remove(); };
  },
  /* 4) 숫자 폭탄 */
  updown(pl, order) {
    const MAX = 100; const bomb = RI(1, MAX); let lo = 1, hi = MAX, cur = 0, v = "", done = false, last = "";
    const draw = () => {
      pl.innerHTML = `<div class="who">숫자를 넣을 사람<b>${esc(order[cur])}</b></div>
        <div class="range num">${lo}<span>~</span>${hi}</div><div class="hint${last === "DOWN" ? " dn" : ""}" id="ht">${last ? (last === "UP" ? "UP — 더 큰 숫자에 있어요" : "DOWN — 더 작은 숫자에 있어요") : "범위 안의 숫자 하나를 넣어요"}</div>
        <div class="disp num" id="dp">${v || "&nbsp;"}</div>
        <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="d">지우기</button><button data-k="0">0</button><button class="ok" data-k="ok">확인</button></div>${orderLine(order, cur)}`;
      pl.querySelector(".pad").onclick = e => { const b = e.target.closest("[data-k]"); if (!b || done) return; const k = b.dataset.k;
        if (k === "d") { v = v.slice(0, -1); SND.key(); }
        else if (k === "ok") { const n = +v; if (!v || n < lo || n > hi) { toast(`${lo}~${hi} 사이의 숫자를 넣어 주세요`); vib(60); return; }
          if (n === bomb) { done = true; SND.boom(); vib([400, 80, 400]); const bx = document.createElement("div"); bx.className = "boom"; bx.innerHTML = `<b>펑! ${n}</b>`; document.body.appendChild(bx); lose(order[cur], "숨은 숫자 " + bomb + "을(를) 맞혔어요", 1400); return; }
          if (n < bomb) { lo = n + 1; last = "UP"; } else { hi = n - 1; last = "DOWN"; }
          SND.safe(); vib(30); v = ""; cur = (cur + 1) % order.length; draw(); return; }
        else if (v.length < 3) { v = (v + k).replace(/^0+/, ""); SND.key(); }
        $("#dp").innerHTML = v || "&nbsp;"; };
    };
    draw(); G_STOP = () => { done = true; };
  },
  /* 5) 10초 맞히기 */
  watch(pl, order) {
    const res = []; let cur = 0, t0 = 0, run = false, raf, stopped = false;
    const draw = () => {
      pl.innerHTML = `<div class="who">${cur + 1} / ${order.length}번째<b>${esc(order[cur])}</b></div>
        <div class="watch num" id="wv">0.00</div><div class="who" id="wh">10.00초에 멈추면 완벽!</div>
        <button class="btn p big" id="wb" style="max-width:420px">시작</button>
        ${res.length ? `<div class="rk">${res.map(r => `<div><span>${esc(r.p)}</span><span class="num">${r.t.toFixed(2)}초</span></div>`).join("")}</div>` : ""}`;
      $("#wb").onclick = () => {
        if (!run) { run = true; t0 = performance.now(); $("#wb").textContent = "멈추기"; SND.safe();
          const loop = now => { if (!run || stopped) return; const s = (now - t0) / 1000; const w = $("#wv"); if (s < 3) w.textContent = s.toFixed(2); else { w.textContent = "?.??"; w.classList.add("hid"); $("#wh").textContent = "숫자는 가려졌어요 — 마음속으로 세어요"; } raf = requestAnimationFrame(loop); };
          raf = requestAnimationFrame(loop); }
        else { run = false; cancelAnimationFrame(raf); const s = (performance.now() - t0) / 1000; res.push({ p: order[cur], t: s, d: Math.abs(s - 10) }); SND.flip(); vib(30);
          const w = $("#wv"); w.classList.remove("hid"); w.textContent = s.toFixed(2); $("#wh").textContent = `10초에서 ${Math.abs(s - 10).toFixed(2)}초 ${s >= 10 ? "넘었어요" : "모자라요"}`;
          const b = $("#wb"); b.disabled = true;
          setTimeout(() => { if (stopped) return; cur++; if (cur < order.length) draw(); else end(); }, 1500); } };
    };
    const end = () => { const s = res.slice().sort((a, b) => b.d - a.d); const L = s[0];
      pl.innerHTML = `<div class="who">결과 — 10초에서 가장 먼 사람이 독박</div><div class="rk">${s.map((r, i) => `<div><span class="${i ? "" : "l"}">${esc(r.p)}</span><span class="num ${i ? "" : "l"}">${r.t.toFixed(2)}초 (${r.t >= 10 ? "+" : "−"}${r.d.toFixed(2)})</span></div>`).join("")}</div>`;
      SND.boom(); vib([300, 60, 300]); lose(L.p, `${L.t.toFixed(2)}초에 멈췄어요 (10초에서 ${L.d.toFixed(2)}초 차이)`, 2600); };
    draw(); G_STOP = () => { stopped = true; run = false; cancelAnimationFrame(raf); };
  },
  /* 6) 꽝 카드 */
  cards(pl, order) {
    const N = order.length, bad = RI(0, N - 1), open = new Set(); let cur = 0, done = false;
    const draw = () => {
      pl.innerHTML = `<div class="who">카드를 뒤집을 사람<b>${esc(order[cur])}</b></div>
        <div class="cards">${Array.from({ length: N }, (_, i) => `<div class="cd${open.has(i) ? " fl" : ""}" data-c="${i}"><div class="in"><div class="fa">${SV(G.logo, "#fff")}</div><div class="ba${i === bad ? " x" : ""}">${i === bad ? "꽝" : "통과"}</div></div></div>`).join("")}</div>${orderLine(order, cur)}`;
      pl.querySelector(".cards").onclick = e => { const c = e.target.closest("[data-c]"); if (!c || done) return; const i = +c.dataset.c; if (open.has(i)) return;
        open.add(i); c.classList.add("fl"); SND.flip(); vib(20);
        if (i === bad) { done = true; setTimeout(() => { SND.boom(); vib([400, 80, 400]); }, 450); lose(order[cur], "꽝 카드를 뒤집었어요", 1700); return; }
        done = true; setTimeout(() => { SND.safe(); done = false; cur = (cur + 1) % N; draw(); }, 800); };
    };
    draw(); G_STOP = () => { done = true; };
  },
};

/* ── 누르기 · 입력 ── */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a],[data-pen],[data-g]"); if (!b) return;
  if (b.dataset.pen) { S.pen = b.dataset.pen; save(); render(); if (S.pen === "직접") { const i = $(".pin"); if (i) i.focus(); } return; }
  if (b.dataset.g) { const g = GAMES.find(x => x.id === b.dataset.g); if (g.touch && !TOUCH) { toast("손가락 고르기는 휴대폰 · 태블릿에서 할 수 있어요"); return; } S.game = g; S.loser = null; go(2); return; }
  const a = b.dataset.a;
  if (a === "n-" || a === "n+") { S.n = Math.min(10, Math.max(2, S.n + (a === "n+" ? 1 : -1))); save(); render(); }
  else if (a === "tog") { if (S.pre) { S.game = S.pre; S.pre = null; S.loser = null; go(2); } else go(1); }
  else if (a === "to0") go(0);
  else if (a === "to1") go(1);
  else if (a === "again") { S.loser = null; go(2); }
  else if (a === "quit") go(1);
  else if (a === "snd") { S.sound = !S.sound; save(); render(); if (S.sound) SND.safe(); }
  else if (a === "vib") { S.vib = !S.vib; save(); render(); vib(60); }
  else if (a === "fs") { const d = document, el = d.documentElement; try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (err) { toast("이 브라우저는 꽉 채우기를 지원하지 않아요"); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.nm != null) { S.names[+t.dataset.nm] = t.value; save(); }
  else if (t.dataset.a === "penc") { S.penC = t.value; save(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.nm != null) { const n = document.querySelector(`[data-nm="${+e.target.dataset.nm + 1}"]`); if (n) n.focus(); else go(1); } });

const GATE_ON = false;   /* 대표 글 공개 시각에 맞춰 Date.now() >= Date.parse(...)로 바꿈 */
(async () => { const T = new URLSearchParams(location.search).get("tab") || "all"; if (GATE_ON && !(await BJ_GATE.check("game", T))) return;
  const g = GAMES.find(x => x.id === T); if (g && !(g.touch && !TOUCH)) S.pre = g; render(); })();
</script></body></html>
