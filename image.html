:root{--bg:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f1efe8;--line:#e7e5dc;--line2:#d7d4c8;--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--brand-ink:#20263a;--brand-accent:#e08a3e;--cat:#1f7f8f;--catbg:#e3f3f5;--success:#2e8a58;--danger:#b84a3c;
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.app{max-width:1200px;margin:0 auto;padding:20px 20px 40px;min-height:100vh}
.app.embed{padding:14px 14px 20px;min-height:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.4px}

.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:18px;align-items:start}
.lay>*{min-width:0}
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh1)}

.step h3,.res-h h3{font-family:var(--head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500;color:var(--ink3)}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:15px}
input[type=number]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip:hover{background:var(--hover)}.chip.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand-ink)}
input[type=range]{width:100%;accent-color:var(--brand-ink);margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}
.qv{font-family:var(--head);font-size:15px;color:var(--brand-ink);margin-left:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:10px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-ink);color:var(--ink2);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:12px}

.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--bg);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--ink2);transition:.12s}

.drop b{font-size:15px;color:var(--ink)}.drop span{font-size:12.5px;color:var(--ink3)}
.col-r{position:sticky;top:16px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.lnk{color:var(--ink3);font-size:12.5px;font-weight:700}.lnk:hover{color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0;color:var(--ink3);font-size:13.5px;border:1.5px dashed var(--line2);border-radius:12px;margin-bottom:14px}
.list{list-style:none;max-height:420px;overflow-y:auto;margin:0 -4px 14px;padding:0 4px}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.th{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--tint);flex-shrink:0;border:1px solid var(--line)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta>b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>span{font-size:12px;color:var(--ink3)}.meta .res{color:var(--ink);font-weight:700}.arr{color:var(--ink3);margin:0 2px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:2px}
.tag.g{background:#e7f4ec;color:var(--success)}.tag.n{background:var(--tint);color:var(--ink2)}.tag.e{background:#fbece8;color:var(--danger)}
.acts{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-btn);font-weight:700;border:1px solid transparent;white-space:nowrap}
.btn.s{padding:6px 9px;font-size:12.5px;border-radius:8px}

.btn.p{background:var(--brand-ink);color:#fff}.btn.p:hover{background:#343d5c}
.btn.accent{background:var(--brand-accent);color:#fff}.btn.accent:hover{background:#c9762f}
.btn:disabled{background:#eceae2;color:var(--ink3);cursor:default}
.btn.w{width:100%}.btn.big{padding:14px;font-size:15px;font-family:var(--head);border-radius:12px}
.sumr{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13.5px;color:var(--ink2)}
.sumr b{color:var(--ink)}.sumr b.g{color:var(--success);font-family:var(--head)}
.priv{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.priv svg{flex-shrink:0;margin-top:1px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92vw;box-shadow:var(--sh);z-index:50}
.foot{margin-top:22px;padding:16px 0 4px;text-align:center;font-size:11.5px;color:var(--ink3)}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}
@media(max-width:1000px){.lay{grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px}.step{padding:18px}.flow li{font-size:11px;padding:6px}.flow li span{width:16px;height:16px}}

@media(max-width:800px){.ed-guide-m{display:block;line-height:1.5}.ed-guide-m svg{vertical-align:-2px;margin-right:4px}}
/* 편집 화면 속 워터마크 겹쳐 보기 */
.wmov{position:absolute;pointer-events:none;display:block}
.pad-in canvas.wmov.pct{max-width:none}
/* 큰 편집 화면: 원본 ↔ 편집 후 좌우 비교 */
.edws-stage{position:relative}
.ecmp{position:absolute;inset:12px;cursor:ew-resize;touch-action:none;user-select:none;z-index:2}
.ecmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.ecmp-after{position:absolute;inset:0}
.ecmp-bar{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 12px rgba(0,0,0,.35);pointer-events:none}
.ecmp-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ecmp-lb{position:absolute;top:10px;font-family:var(--head);font-size:13px;color:#fff;background:rgba(32,38,58,.82);border-radius:8px;padding:4px 10px;pointer-events:none}
.ecmp-lb.l{left:10px}.ecmp-lb.r{right:10px;background:rgba(224,138,62,.92)}
.ecmp-load{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:700;color:#fff;background:rgba(32,38,58,.82);border-radius:8px;padding:5px 12px}
.cmpbtn{margin-bottom:12px}
.cmp-tip{font-size:12.5px;color:var(--ink2);background:#fff7ee;border-left:4px solid var(--brand-accent);border-radius:8px;padding:8px 10px;margin:-4px 0 12px;line-height:1.55}.cmp-tip b{color:var(--ink)}
.ecmp{display:flex;align-items:center;justify-content:center;cursor:default}
.ecmp-in{position:relative;cursor:ew-resize;touch-action:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.ecmp-in canvas{position:absolute;inset:0;display:block}
.ecmp-in .ecmp-after{position:absolute;inset:0}
/* 전체 화면: 제출용 규격 */
.pbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#faf9f5}
.pbox-h{display:flex;align-items:center;gap:6px;margin-bottom:10px;color:var(--brand-ink)}.pbox-h b{font-family:var(--head);font-size:14px}.pbox-h span{font-size:12px;color:var(--ink3);margin-left:auto}
.pbox .presets{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pbox .pr{padding:9px 11px}.pbox .pr b{font-size:13px}.pbox .pr span{font-size:12px}
.pbox .note{margin-top:10px}.pbox .hint{margin-top:8px}
@media(max-width:1000px){.flow li{white-space:normal;line-height:1.25;min-width:0}}
.flow li{min-width:0}
.step .pbox{margin:12px 0 0}
.note.lock{border-left-color:var(--ink3);background:#faf9f5;color:var(--ink2);margin-top:0}
/* 큰 화면 비교: 나란히 보기 */
.ecmp.side{display:flex;align-items:stretch;justify-content:center;gap:14px;cursor:default}
.ecmp.side figure{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;margin:0}
.ecmp.side .fig-in{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.ecmp.side canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.ecmp.side figcaption{text-align:center;font-size:13px;color:#cfd3df;padding-top:10px}
.ecmp.side figcaption b{font-family:var(--head);color:#fff;background:rgba(32,38,58,.9);border-radius:7px;padding:3px 9px;margin-right:6px}
.ecmp.side figcaption.r b{background:rgba(224,138,62,.95)}
.ecmp.side .side-arrow{align-self:center;flex-shrink:0;opacity:.7}
.cmp-mode{margin:-4px 0 10px}.cmp-mode .seg button{font-size:12.5px;padding:7px 4px}
@media(max-width:800px){.ecmp.side{flex-direction:column;gap:8px}.ecmp.side .side-arrow{transform:rotate(90deg)}}
.ecmp.side canvas.dragable{cursor:grab;touch-action:none}.ecmp.side canvas.dragable:active{cursor:grabbing}
.ecmp.side .side-hint{display:inline-flex;margin-left:8px;vertical-align:middle;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:rgba(32,38,58,.8);border-radius:999px;padding:4px 10px;pointer-events:none;white-space:nowrap}

.bj-vnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7ee;border:1px solid #f1e3cc;border-left:4px solid #e08a3e;border-radius:10px;padding:9px 12px;margin:10px auto 0;max-width:1200px;font-size:13.5px;color:#4d3a1f;box-sizing:border-box}
.bj-vnote .dot{width:8px;height:8px;border-radius:50%;background:#e08a3e;flex-shrink:0}
.bj-vnote .t{flex:1;min-width:180px}.bj-vnote b{color:#9a5a17}
.bj-vnote a{color:#20263a;font-weight:700;text-decoration:none;border:1px solid #d7d4c8;border-radius:8px;padding:4px 10px;background:#fff;white-space:nowrap}
.bj-vnote button{border:0;background:none;font-size:18px;line-height:1;color:#8a8f84;cursor:pointer;padding:0 4px}

<script>
/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev) { embedOK = inFrame; return true; }
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();

</script>

/* 자르는 네모 안에 워터마크를 결과 그대로 겹쳐 그리기 */

            ${(est.kept || est.scaled || est.over) && html`<p class="pv-note">${est.kept ? "이미 충분히 작아 원본을 그대로 씁니다." : ""}${est.scaled ? "목표 용량을 맞추려고 크기도 줄입니다." : ""}${est.over ? " 목표 용량까지는 줄이지 못했어요." : ""}</p>`}`}
          ${MODE !== "compress" && MODE !== "convert" && html`<button class="btn ghost w bigedit" onClick=${() => setEdit(sel)}>${h(Icon, { name: "maximize", size: 16 })} 큰 화면에서 편집하기 <span>${canPos ? "자르기 위치 · 회전 · 반전" : "회전 · 반전"}</span></button>`}
        </div>`}
        <div class="res-h"><h3>사진 ${items.length ? items.length + "장" : ""}</h3>${items.length ? html`<button class="lnk" onClick=${clearAll}>모두 지우기</button>` : null}</div>
        ${!items.length ? html`<div class="empty">${h(Icon, { name: "image", size: 34, color: "#b8b4a6" })}<p>사진을 올리면 여기에 미리보기가 나타납니다</p></div>` : html`
        <ul class="list">${items.map(it => html`<li class=${sel && sel.id === it.id ? "sel" : ""} onClick=${e => { if (!e.target.closest("button")) setSelId(it.id); }}>
          <button class="thb" title=${it.out ? "전후 비교" : ""} onClick=${() => it.out && setCmp(it)}><img class="th" src=${it.out ? it.out.url : it.url} alt="" />${it.out && html`<span class="eye">${h(Icon, { name: "eye", size: 13, color: "#fff" })}</span>`}</button>
          <div class="meta"><b title=${it.file.name}>${it.file.name}</b>
            <span>${it.w ? it.w + "×" + it.h + " · " : ""}${fmtBytes(it.file.size)}${it.out ? html` <span class="arr">›</span> <b class="res">${it.out.w}×${it.out.h} · ${fmtBytes(it.out.blob.size)}</b>` : ""}</span>
            ${it.out && html`<span class=${"tag " + (it.out.blob.size < it.file.size ? "g" : "n")}>${it.out.underTarget ? "이미 목표보다 작아 원본 유지" : it.out.keptOriginal ? "이미 충분히 작아 원본 유지" : it.out.blob.size < it.file.size ? "−" + Math.round((1 - it.out.blob.size / it.file.size) * 100) + "%" : "+" + Math.round((it.out.blob.size / it.file.size - 1) * 100) + "%"}${it.out.scaled ? " · 용량을 맞추려고 크기도 줄였어요" : ""}${it.out.over ? " · 목표 용량까지 못 줄였어요" : ""}</span>`}
            ${(it.rot || it.flip || it.crop) ? html`<span class="tag n">${[it.rot ? it.rot + "° 회전" : "", it.flip ? "반전" : "", it.crop ? "위치 조정" : ""].filter(Boolean).join(" · ")}</span>` : null}
            ${it.anim && html`<span class="tag n">움직이는 GIF · 첫 장면만 저장</span>`}${it.status === "busy" && html`<span class="tag n">변환 중…</span>`}${it.status === "err" && html`<span class="tag e">열 수 없는 파일</span>`}
          </div>
          <div class="acts">
            ${MODE !== "compress" && MODE !== "convert" && html`<button class="btn s ghost ic" title="자르기·회전" disabled=${!it.w} onClick=${() => setEdit(it)}>${h(Icon, { name: "crop", size: 16 })}</button>`}
            ${it.out && html`<button class="btn s ghost ic" title="내려받기" onClick=${() => downloadBlob(it.out.blob, it.out.name)}>${h(Icon, { name: "download", size: 16 })}</button>`}
            <button class="btn s ghost ic" title="빼기" onClick=${() => remove(it.id)}>${h(Icon, { name: "x", size: 16 })}</button></div>
        </li>`)}</ul>`}
        ${stale && html`<div class="note w">설정이 바뀌었어요. 다시 변환하세요.</div>`}
        <button class="btn accent w big" disabled=${!items.length || busy} onClick=${run}>${h(Icon, { name: RUN_ICON, size: 18 })} ${busy ? "변환 중…" : items.length ? items.length + "장 변환하기" : "사진을 먼저 올려 주세요"}</button>
        ${done.length > 0 && html`<div class="sumr"><span>${done.length}장 · ${fmtBytes(tIn)} <span class="arr">›</span> <b>${fmtBytes(tOut)}</b></span>${tOut < tIn ? html`<b class="g">−${Math.round((1 - tOut / tIn) * 100)}%</b>` : null}</div>
          <button class="btn p w" onClick=${zipAll}>${h(Icon, { name: "zip", size: 17 })} ${done.length > 1 ? "전체 내려받기 (zip)" : "zip으로 내려받기"}</button>
          <p class="hint c">썸네일을 누르면 원본과 화질을 비교할 수 있어요.</p>`}
        <p class="priv">${h(Icon, { name: "shield", size: 15, color: "#2e8a58" })} 변환은 이 브라우저 안에서만 이뤄지고, 위치정보 같은 사진 속 정보는 자동으로 빠집니다.</p>
      </div></div>
    </div>
    ${edit && html`<${Editor} item=${edit} s=${E} logo=${logo} onSave=${saveEdit} onClose=${() => setEdit(null)} />`}
    ${cmp && html`<${Compare} item=${cmp} onClose=${() => setCmp(null)} />`}
    ${zoom && html`<div class="ov zoomv" onClick=${() => setZoom(null)}><img src=${zoom} alt="크게 보기" /><button class="zx">${h(Icon, { name: "x", size: 20, color: "#fff" })}</button></div>`}
    ${toast && html`<div class="toast">${toast}</div>`}
    ${!EMBED && html`<div class="foot">Copyright © <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a> | All Rights Reserved</div>`}
  </div>`;
}

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알려 iframe 높이를 자동으로 맞춤 */
(function(){ if(!EMBED || window.parent===window) return;
  var last=0, t=null;
  function send(){ var r=document.getElementById("root"); if(!r) return;
    var h=Math.ceil(r.getBoundingClientRect().height)+8;
    if(document.querySelector(".edws")) h=Math.max(h,900);   /* 큰 화면 편집 중엔 넉넉하게 */
    if(Math.abs(h-last)<4) return; last=h;
    try{ window.parent.postMessage({blogj:"height",h:h},"https://luvbong.tistory.com"); }catch(e){} }
  function soon(){ clearTimeout(t); t=setTimeout(send,60); }
  if(window.ResizeObserver){ new ResizeObserver(soon).observe(document.getElementById("root")); }
  new MutationObserver(soon).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("load",send); setTimeout(send,300);
})();
window.BJ_TOOL_KEY="image";window.BJ_TOOL_VER=APP_VER;
/* 새 버전 알림: 같은 사이트의 versions.json을 확인해 더 새 버전이 있으면 맨 위에 안내 (없거나 실패하면 아무것도 안 함) */
(function () {
  if (location.protocol === "file:") return;   /* 다운로드판·로컬 파일은 확인하지 않음 */
  var KEY = window.BJ_TOOL_KEY, CUR = window.BJ_TOOL_VER; if (!KEY || !CUR) return;
  var newer = function (a, b) { var x = String(a).split("."), y = String(b).split("."); for (var i = 0; i < 3; i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d) return d > 0; } return false; };
  fetch("versions.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    var v = j && j[KEY]; if (!v || !v.latest || !newer(v.latest, CUR) || !/^https:\/\/luvbong\.tistory\.com\//.test(v.post || "")) return;
    try { if (sessionStorage.getItem("bjvn:" + KEY + v.latest)) return; } catch (e) {}
    var bar = document.createElement("div"); bar.className = "bj-vnote";
    bar.innerHTML = '<span class="dot"></span><span class="t"><b>새 버전 v' + String(v.latest).replace(/[^0-9.]/g, "") + '</b>이 나왔어요' + (v.note ? ' — ' + String(v.note).replace(/[<>&"]/g, "") : "") + '</span><a target="_blank" rel="noopener">새 글에서 쓰기 ›</a><button aria-label="닫기">×</button>';
    bar.querySelector("a").href = v.post;
    bar.querySelector("button").onclick = function () { bar.remove(); try { sessionStorage.setItem("bjvn:" + KEY + v.latest, "1"); } catch (e) {} };
    document.body.insertBefore(bar, document.body.firstChild);
  }).catch(function () {});
})();
