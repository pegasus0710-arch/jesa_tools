<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="only light"><meta name="theme-color" content="#0B3D4A">
<title>일정표 노트 | Blog J</title>
<meta name="description" content="프로젝트 일정을 간트 차트로 저장하고, 진행하며 고치고 늦은 작업 · 이번 주 할 일을 확인하는 무료 앱 — 휴대폰 · PC 설치, 구글 드라이브 동기화">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{--bg:#FAF6EE;--in:#F3EEE3;--desk:#F0EADF;--card:#fff;--line:#CDD3DC;--hair:rgba(20,32,43,.12);--ink:#14202B;--sub:#5F6B7A;--sea:#0C737D;--sea2:#0A5C66;--seal:#EEF6F7;--deep:#0B3D4A;--deeps:#CFE3E6;--sky:#2B5FA0;--sun:#E07A4F;--sunt:#B4532A;--red:#C23A2B;--up:0 1px 2px rgba(20,32,43,.06),0 0 0 1px rgba(20,32,43,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SUIT,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--sky)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* 머리띠 */
.hd{background:var(--deep);color:#fff;position:sticky;top:0;z-index:30}
.hd-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;min-height:64px}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo img{width:40px;height:40px;border-radius:10px;flex-shrink:0}
.logo small{display:block;font-size:11.5px;font-weight:700;color:var(--deeps);letter-spacing:.02em}
.logo b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.hd .sp{flex:1}
.hbtn{height:40px;min-width:40px;padding:0 12px;border-radius:10px;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14px;box-shadow:var(--up);white-space:nowrap}
.hbtn:hover{box-shadow:0 0 0 2px var(--deeps)}
.hbtn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.hbtn.ghost:hover{background:rgba(255,255,255,.2)}
.gdot{width:9px;height:9px;border-radius:50%;background:#9AA3AE;display:inline-block}
.gdot.ok{background:#2f8a57}.gdot.busy{background:var(--sun)}
/* 본문 */
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 80px}
.btn{height:42px;padding:0 16px;border-radius:11px;background:#fff;box-shadow:var(--up);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14.5px;white-space:nowrap}
.btn:hover{box-shadow:0 0 0 2px var(--sea)}
.btn.go{background:var(--sea);color:#fff;box-shadow:none}
.btn.go:hover{background:var(--sea2)}
.btn.sm{height:34px;padding:0 11px;font-size:13.5px;border-radius:9px}
.btn.red{color:var(--red)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.vh h2{font-size:21px;font-weight:900;letter-spacing:-.02em}
.vh p{font-size:13.5px;color:var(--sub)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--up);padding:18px}
.lead{color:var(--sub);font-size:13.5px}
/* 홈: 오늘 확인 */
.today{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-bottom:22px}
.today h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.today h3 .pip{width:9px;height:9px;border-radius:50%;background:var(--sun)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.ti2{display:flex;align-items:center;gap:10px;background:var(--in);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.ti2:hover{box-shadow:0 0 0 2px var(--sea)}
.ti2 .tx{flex:1;min-width:0}
.ti2 .tx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti2 .tx small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap;flex-shrink:0}
.tag.late{background:#FBE9E6;color:var(--red)}
.tag.soon{background:var(--seal);color:var(--sea2)}
.tag.done{background:#EAF3EC;color:#2b6b45}
.tag.wait{background:var(--in);color:var(--sub)}
.tag.run{background:#EAF0F8;color:var(--sky)}
/* 홈: 일정표 카드 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{background:#fff;border-radius:16px;box-shadow:var(--up);padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.pc:hover{box-shadow:0 0 0 2px var(--sea)}
.pc h4{font-size:17px;font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .per{font-size:13px;color:var(--sub)}
.bar{height:10px;border-radius:6px;background:var(--in);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sea);border-radius:6px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--sun)}
.pc .st{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.pc .st b{color:var(--ink)}
.pc .ms{display:flex;gap:6px;flex-wrap:wrap}
.mini{height:44px;border-radius:8px;background:var(--in);position:relative;overflow:hidden}
.mini i{position:absolute;height:5px;border-radius:3px;background:var(--sea);opacity:.85}
.mini i.l{background:var(--red)}
.mini u{position:absolute;top:0;bottom:0;width:2px;background:var(--sun)}
.newc{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--sea2);font-weight:900;min-height:150px}
.sec2{margin:26px 0 12px;font-size:15px;font-weight:900;color:var(--sub);display:flex;align-items:center;gap:8px}
.welcome{background:#fff;border-radius:18px;box-shadow:var(--up);padding:28px;max-width:860px;margin:10px auto}
.welcome h2{font-size:24px;font-weight:900;margin-bottom:6px}
.welcome p{color:var(--sub);margin-bottom:18px}
.wopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.wo{background:var(--in);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.wo:hover{box-shadow:0 0 0 2px var(--sea)}
.wo b{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.wo span{font-size:13.5px;color:var(--sub)}
/* 일정표 화면 */
.ph{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:23px;font-weight:900;letter-spacing:-.02em;word-break:keep-all}
.ph p{color:var(--sub);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border-radius:14px;box-shadow:var(--up);padding:12px 14px;text-align:left;min-width:0}
button.tile:hover{box-shadow:0 0 0 2px var(--sea)}
.tile small{display:block;font-size:12.5px;color:var(--sub);font-weight:700}
.tile b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b.r{color:var(--red)}
.tile span{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:var(--in);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:40px;padding:0 16px;border-radius:9px;font-weight:800;font-size:14.5px;color:var(--sub);white-space:nowrap;flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--up)}
.tabs .cnt{font-size:12px;background:var(--red);color:#fff;border-radius:9px;padding:1px 7px}
.tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar .lab{font-size:13px;color:var(--sub);font-weight:700;margin-right:2px}
.chip{height:34px;padding:0 12px;border-radius:9px;background:#fff;box-shadow:var(--up);font-size:13.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--sea);color:#fff;box-shadow:none}
.seg{display:inline-flex;background:var(--in);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--up)}
.desk{background:var(--desk);border-radius:16px;padding:12px;overflow:auto;box-shadow:inset 0 0 0 1px var(--hair)}
.desk .paper{background:#fff;border-radius:8px;display:inline-block;min-width:100%;box-shadow:0 10px 24px -16px rgba(20,32,43,.4)}
.desk svg{display:block}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
/* 작업 목록 */
.tl{display:flex;flex-direction:column;gap:6px}
.tg{font-size:13.5px;font-weight:900;color:var(--sub);margin:12px 2px 2px;display:flex;align-items:center;gap:8px}
.tg:first-child{margin-top:0}
.tr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr) minmax(0,1.5fr) 150px auto;gap:12px;align-items:center;background:#fff;border-radius:12px;box-shadow:var(--up);padding:10px 12px;text-align:left;width:100%}
.tr:hover{box-shadow:0 0 0 2px var(--sea)}
.tr .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--sub);margin-left:4px}
.tr .who,.tr .dt2{font-size:13.5px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .dt2 b{color:var(--red);font-weight:800}
.pb{display:flex;align-items:center;gap:8px}
.pb .bar{flex:1;height:8px}
.pb small{font-size:12.5px;font-weight:800;min-width:36px;text-align:right}
.mvs{display:flex;gap:4px}
.mvs span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--in)}
.mvs span:hover{box-shadow:0 0 0 2px var(--sea)}
.empty{padding:40px 16px;text-align:center;color:var(--sub);background:#fff;border-radius:14px;box-shadow:var(--up)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* 이번 주 */
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.wc{background:#fff;border-radius:14px;box-shadow:var(--up);padding:13px 14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.wc.late{box-shadow:0 0 0 2px #EBC3BD}
.wc .t1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.wc .t1 b{font-size:15.5px;font-weight:900;min-width:0;word-break:keep-all}
.wc .t1 small{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.qp{display:flex;gap:4px;flex-wrap:wrap}
.qp button{height:32px;min-width:46px;padding:0 8px;border-radius:8px;background:var(--in);font-size:13px;font-weight:800}
.qp button.on{background:var(--sea);color:#fff}
.qp button:hover{box-shadow:0 0 0 2px var(--sea)}
/* 기록 */
.lg{display:flex;flex-direction:column;gap:0;background:#fff;border-radius:14px;box-shadow:var(--up);padding:6px 16px}
.lgd{font-size:13px;font-weight:900;color:var(--sub);padding:12px 0 4px;border-bottom:1px solid var(--hair)}
.li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px;align-items:baseline}
.li:last-child{border-bottom:0}
.li time{font-size:12.5px;color:var(--sub);flex-shrink:0;min-width:42px}
.li .k{font-size:12px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--in);color:var(--sub);flex-shrink:0}
.li .k.d{background:#FBE9E6;color:var(--red)}.li .k.p{background:var(--seal);color:var(--sea2)}.li .k.m{background:#FFF3D6;color:#7a5a12}
.memo{display:flex;gap:8px;margin-bottom:12px}
.memo input{flex:1;min-width:0;height:44px;border-radius:11px;border:0;background:#fff;box-shadow:var(--up);padding:0 14px;font-size:15px;outline:0}
.memo input:focus{box-shadow:0 0 0 2px var(--sea)}
/* 저장 · 인쇄 */
.outg{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.og h4{font-size:14.5px;font-weight:900;margin:14px 0 8px}
.og h4:first-child{margin-top:0}
.og .row+.row{margin-top:6px}
/* 입력칸 */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f>label,.f>.lb{font-size:13px;font-weight:800;color:var(--sub)}
.inp{height:46px;border-radius:11px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);padding:0 13px;font-size:16px;outline:0;width:100%;min-width:0}
.inp:focus{box-shadow:0 0 0 2px var(--sea)}
textarea.inp{height:auto;min-height:90px;padding:11px 13px;line-height:1.6;resize:vertical}
.dt{position:relative;height:46px;border-radius:11px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;padding:0 13px;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;min-width:0}
.dt.no{color:var(--sub);font-weight:600}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dt:focus-within{box-shadow:0 0 0 2px var(--sea)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rng{width:100%;accent-color:var(--sea)}
.note{background:var(--in);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--sub);margin-bottom:12px}
.note b{color:var(--ink)}
.note .r{color:var(--red);font-weight:800}
.ck{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--sea)}
/* 창 */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(11,25,32,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#sheet[hidden]{display:none}
.shbox{background:var(--bg);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.shbox.wide{width:min(760px,100%)}
.edh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.edh b{font-size:18px;font-weight:900}
.shf{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px;position:sticky;bottom:-20px;background:var(--bg);padding:12px 0 2px}
.shf .row{gap:8px}
/* 설정 */
.setg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.sc{background:#fff;border-radius:16px;box-shadow:var(--up);padding:18px;display:flex;flex-direction:column;gap:10px}
.sh2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.sc p{font-size:14px;color:var(--sub)}
.stc{margin-left:auto;font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:7px;background:var(--in);color:var(--sub)}
.stc.ok{background:#EAF3EC;color:#2b6b45}
.qrw{display:flex;gap:14px;align-items:center}
.qr{width:120px;height:120px;flex-shrink:0;background:#fff;border-radius:10px;padding:6px;box-shadow:0 0 0 1px var(--line)}
.qr svg{width:100%;height:100%}
.links{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.apps a{display:flex;gap:8px;align-items:center;background:var(--in);border-radius:11px;padding:8px 10px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:800}
.apps img{width:30px;height:30px;border-radius:8px}
.iapp{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.iapp img{border-radius:12px}
.iapp b{display:block;font-size:16px}.iapp span{font-size:13px;color:var(--sub)}
.isteps{padding-left:20px;margin:12px 0;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#syband{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);padding:8px 10px 8px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#syband button{border-radius:8px;padding:6px 11px;background:var(--sea);color:#fff;font-weight:800;flex-shrink:0}
.ft{max-width:1320px;margin:0 auto;padding:0 20px 30px;font-size:12.5px;color:var(--sub)}
#prt{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  body>*:not(#prt){display:none!important}
  #prt{display:block!important}
  #prt .pg{page-break-after:always;break-after:page}
  #prt .pg:last-child{page-break-after:auto}
  #prt svg{width:100%;height:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .outg{grid-template-columns:minmax(0,1fr)}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .tr .who{display:none}
  .tr .dt2{grid-column:1}
  .tr .pb{grid-column:1/-1;grid-row:3}
  .tr .mvs{grid-row:1;grid-column:2}
}
@media (max-width:600px){
  .hd-in{padding:10px 14px;gap:8px;min-height:58px}
  .logo img{width:34px;height:34px}
  .logo b{font-size:17px}
  .logo small{display:none}
  .hbtn .tx{display:none}
  .wrap{padding:16px 14px 80px}
  .ph h2{font-size:20px}
  .tile b{font-size:19px}
  .tabs button{padding:0 12px;font-size:14px}
  #sheet{align-items:flex-end;padding:0}
  .shbox{border-radius:18px 18px 0 0;max-height:92vh;width:100%}
  .setg,.wk,.pgrid,.tlist{grid-template-columns:minmax(0,1fr)}
  .welcome{padding:20px}
  .two{grid-template-columns:1fr 1fr;gap:8px}
  .dt{font-size:14.5px;padding:0 10px}
  .hm{display:none}
}
</style></head><body>
<header class="hd"><div class="hd-in" id="hd"></div></header>
<main class="wrap" id="main"></main>
<footer class="ft" id="ft"></footer>
