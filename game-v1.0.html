:root{--paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--ink:#1f2125;--sub:#5b5547;--sub2:#6f6857;--g:#195455;--gh:#12403f;--gl:#e3ecea;--or:#f56d03;--red:#c23a2b;--hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.22);
 --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);--up-s:0 0 0 1px rgba(90,74,50,.1),0 1px 2px rgba(90,74,50,.06);--in:inset 0 0 0 1px rgba(90,74,50,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"BJ","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#root{min-height:100%;display:flex;flex-direction:column}
/* 머리 */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);box-shadow:0 1px 0 var(--hair)}
.badge{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;flex-shrink:0;position:relative}
.badge svg{width:22px;height:22px}
.badge i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--panel)}
.tname{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.tname small{font-weight:600;font-size:12.5px;color:var(--sub2);margin-left:6px}
.ruler{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.rs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub2);font-weight:600;white-space:nowrap}
.rs b{width:10px;height:10px;border-radius:50%;background:var(--tint);box-shadow:var(--in)}
.rs.done b,.rs.on b{background:var(--or);box-shadow:none}
.rs.on{color:var(--ink);font-weight:800}
.rl{width:28px;height:2px;background:var(--tint);margin:0 6px}
.rl.done{background:var(--or)}
.tb{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card);box-shadow:var(--up-s)}
.ib svg{width:20px;height:20px}
.ib.off{opacity:.45}
.ib:hover{box-shadow:0 0 0 1px var(--g)}
@media (max-width:640px){.ruler .rs span{display:none}.rl{width:16px;margin:0 4px}.tname small{display:none}}
/* 본문 */
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px}
.wrap{width:100%;max-width:720px}
h2.st{font-size:22px;margin:4px 0 4px;letter-spacing:-.4px}
.lead{color:var(--sub);font-size:15px;margin:0 0 16px;line-height:1.6}
.card{background:var(--card);border-radius:14px;box-shadow:var(--up);padding:18px}
.lbl{font-weight:800;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.lbl em{font-style:normal;font-weight:600;font-size:13px;color:var(--sub2)}
.sec{margin-top:18px}
.stepper{display:inline-flex;align-items:center;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:9px;font-size:24px;font-weight:700}
.stepper button:hover{background:var(--card)}
.stepper b{min-width:64px;text-align:center;font-size:22px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.nm{display:flex;align-items:center;gap:8px;background:var(--tint);box-shadow:var(--in);border-radius:10px;padding:0 10px}
.nm span{font-size:13px;color:var(--sub2);font-weight:700;width:18px;text-align:right}
.nm input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;font-weight:600;outline:0}
.nm:focus-within{box-shadow:inset 0 0 0 1.5px var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);font-weight:600;font-size:15px}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g);font-weight:800;background:var(--card)}
.chip.pk{background:var(--g);color:#fff;box-shadow:none;opacity:1}
.chip.pk b{background:#fff;color:var(--g);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px}
.chip.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:7px;vertical-align:2px}
.pin{margin-top:10px;width:100%;border:0;border-radius:10px;background:var(--tint);box-shadow:var(--in);padding:12px;font-size:16px;outline:0}
.pin:focus{box-shadow:inset 0 0 0 1.5px var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;font-weight:800;font-size:16.5px;background:var(--card);box-shadow:var(--up-s)}
.btn:hover{box-shadow:0 0 0 1px var(--g)}
.btn.p{background:var(--g);color:#fff;box-shadow:0 1px 2px rgba(15,55,56,.25)}
.btn.p:hover{background:var(--gh)}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{min-height:64px;font-size:20px;width:100%}
.btn svg{width:20px;height:20px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn.p{flex:1}
.note{font-size:13.5px;color:var(--sub2);line-height:1.6;margin-top:12px}
/* 게임 고르기 */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gc{text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--up);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:box-shadow .12s}
.gc:hover{box-shadow:0 0 0 1.5px var(--g),var(--up)}
.gc .gi{width:46px;height:46px;border-radius:12px;background:var(--gl);display:grid;place-items:center}
.gc .gi svg{width:28px;height:28px}
.gc b{font-size:17.5px;letter-spacing:-.3px}
.gc p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.gc .tg{font-size:12.5px;color:var(--sub2);font-weight:700;margin-top:auto}
.gc.dim{opacity:.55}
/* 놀이 화면 */
.play{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:720px;gap:16px;text-align:center}
.who{font-size:15px;color:var(--sub);font-weight:700}
.who b{display:block;font-size:clamp(34px,9vw,58px);color:var(--ink);letter-spacing:-1px;line-height:1.15;margin-top:4px;word-break:keep-all}
.order{font-size:14px;color:var(--sub2);line-height:1.8}
.order b{color:var(--g)}
.order .cur{color:#fff;background:var(--g);padding:2px 8px;border-radius:6px}
.stage{width:min(78vw,330px);height:min(78vw,330px);display:grid;place-items:center;position:relative}
.ptop{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:720px;margin-bottom:6px}
.ptop .gnm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.ptop .gnm svg{width:22px;height:22px}
.quit{font-size:14px;color:var(--sub2);font-weight:700;padding:8px 10px;border-radius:8px}
.quit:hover{background:var(--card)}
.intro{background:var(--card);border-radius:18px;box-shadow:var(--up);padding:24px 20px;width:100%;max-width:520px;text-align:left}
.intro h3{margin:0 0 10px;font-size:21px;display:flex;align-items:center;gap:10px}
.intro h3 svg{width:30px;height:30px}
.intro .lbl{display:block;line-height:1.5}
.intro .lbl em{margin-left:6px}
.intro .order{margin-bottom:14px}
.intro ol{margin:0 0 14px;padding-left:20px;line-height:1.75;font-size:15.5px}
.hold{height:6px;border-radius:3px;background:var(--tint);overflow:hidden;width:100%;max-width:330px}
.hold i{display:block;height:100%;background:var(--g);width:0}
/* 폭탄 */
.bomb svg{width:100%;height:100%}
.spark{transform-origin:center;animation:sp .35s infinite alternate}
@keyframes sp{from{transform:scale(.8);opacity:.7}to{transform:scale(1.15);opacity:1}}
.shake{animation:sh .12s infinite}
@keyframes sh{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.boom{position:fixed;inset:0;background:var(--red);display:grid;place-items:center;z-index:50;animation:bm .6s ease-out}
.boom b{color:#fff;font-size:clamp(48px,14vw,110px);font-weight:900;letter-spacing:-2px}
@keyframes bm{from{opacity:0;transform:scale(1.3)}to{opacity:1;transform:scale(1)}}
/* 풍선 */
.bal{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
/* 손가락 */
.touch{position:fixed;inset:0;z-index:40;background:#1d2a2a;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.touch .msg{position:absolute;left:0;right:0;top:max(18px,env(safe-area-inset-top));text-align:center;color:#fff;font-weight:800;font-size:19px;padding:0 16px;line-height:1.5;pointer-events:none}
.touch .msg small{display:block;font-weight:600;font-size:14px;opacity:.75}
.touch .x{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));color:#fff;opacity:.8;font-weight:700;font-size:14px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.12)}
.fg{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.12);transition:background .25s,border-color .25s,transform .25s;pointer-events:none}
.fg.on{border-color:var(--or);background:rgba(245,109,3,.25);animation:pl 1s infinite}
.fg{display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.fg.out{border-color:rgba(255,255,255,.3);background:transparent;transform:scale(.8);color:rgba(255,255,255,.85)}
.fg.lose{border-color:#fff;background:var(--red);transform:scale(1.25);animation:none}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* 숫자 폭탄 */
.range{font-size:clamp(40px,12vw,72px);font-weight:900;letter-spacing:-2px}
.range span{color:var(--sub2);font-weight:600;font-size:.5em;margin:0 .2em}
.hint{font-size:20px;font-weight:900;color:var(--g);min-height:28px}
.hint.dn{color:var(--red)}
.disp{font-size:44px;font-weight:900;min-width:150px;padding:6px 18px;border-radius:14px;background:var(--tint);box-shadow:var(--in);min-height:68px}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:min(94vw,560px)}
.nc{aspect-ratio:1;border-radius:8px;background:var(--card);box-shadow:var(--up-s);font-weight:800;font-size:clamp(12.5px,3.4vw,17px);padding:0}
.nc:hover{box-shadow:0 0 0 1.5px var(--g)}
.nc.ok{background:var(--g);color:#fff;transform:scale(.9);transition:.2s}
.nc.x{background:var(--red);color:#fff;transform:scale(1.3);transition:.2s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(86vw,330px)}
.pad button{height:60px;border-radius:12px;background:var(--card);box-shadow:var(--up-s);font-size:24px;font-weight:800}
.pad button:active{box-shadow:inset 0 0 0 1.5px var(--g)}
.pad .ok{background:var(--g);color:#fff;font-size:18px}
.pad .del{font-size:16px}
/* 10초 */
.watch{font-size:clamp(64px,20vw,120px);font-weight:900;letter-spacing:-3px}
.watch.hid{color:var(--sub2)}
.rk{width:100%;max-width:420px;text-align:left;border-radius:14px;background:var(--card);box-shadow:var(--up);padding:6px 14px}
.rk div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair);font-size:16px}
.rk div:last-child{border:0}
.rk .l{color:var(--red);font-weight:900}
/* 카드 */
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%;max-width:600px}
.cards.many .cd{width:clamp(54px,15vw,86px)}
.cards.many .ba{font-size:15px}
.cd{width:clamp(78px,24vw,124px);aspect-ratio:3/4;perspective:600px}
.cd .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.cd.fl .in{transform:rotateY(180deg)}
.cd .fa,.cd .ba{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font-weight:900}
.cd .fa{background:var(--g);box-shadow:var(--up);color:rgba(255,255,255,.85)}
.cd .fa svg{width:40%;height:40%}
.cd .ba{transform:rotateY(180deg);background:var(--card);box-shadow:var(--up);font-size:18px;color:var(--sub);flex-direction:column}
.cd .ba.x{background:var(--red);color:#fff;font-size:24px}
.cd .ba small{font-size:12.5px;font-weight:700;margin-top:4px}
/* 결과 */
.res{background:var(--card);border-radius:20px;box-shadow:var(--up);padding:26px 20px 22px;width:100%;max-width:520px;text-align:center;position:relative;overflow:hidden}
.res::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--red)}
.res .k{font-size:15px;font-weight:800;color:var(--red);letter-spacing:2px}
.res .n{font-size:clamp(44px,13vw,76px);font-weight:900;letter-spacing:-2px;line-height:1.15;margin:8px 0 6px;word-break:keep-all}
.res .p{font-size:20px;font-weight:800}
.res .m{font-size:13.5px;color:var(--sub2);margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.res .m b{color:var(--g)}
.tally{width:100%;max-width:520px;margin-top:14px}
.tally .row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.tally .row span{width:72px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally .bar{flex:1;height:10px;border-radius:5px;background:var(--tint);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--g)}
.tally .row em{font-style:normal;width:40px;text-align:right;font-weight:800}
.foot{text-align:center;font-size:12.5px;color:var(--sub2);padding:10px 0 18px}
.foot a{color:var(--g);font-weight:700;text-decoration:none}

/* ══ 게임 무대(한 판 · 결과) — 초록 판 + 크림 카드, 주황은 빛만 ══ */
body.gm{background:radial-gradient(120% 80% at 50% 30%,#21686a 0%,#195455 45%,#123f40 100%) fixed}
body.gm::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);background-size:22px 22px;pointer-events:none}
body.gm .top{background:rgba(10,40,41,.35);box-shadow:none}
body.gm .tname{color:#fff}body.gm .tname small{color:rgba(255,255,255,.6)}
body.gm .rs{color:rgba(255,255,255,.55)}body.gm .rs.on{color:#fff}body.gm .rs b{background:rgba(255,255,255,.18);box-shadow:none}body.gm .rs.done b,body.gm .rs.on b{background:var(--or)}
body.gm .rl{background:rgba(255,255,255,.18)}body.gm .rl.done{background:var(--or)}
body.gm .ib{background:rgba(255,255,255,.1);box-shadow:none;color:#fff}
body.gm .badge i{border-color:#195455}
body.gm .ptop .gnm{color:#fff}body.gm .quit{color:rgba(255,255,255,.75)}body.gm .quit:hover{background:rgba(255,255,255,.1)}
body.gm .who{color:rgba(255,255,255,.75)}body.gm .who b{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
body.gm .order{color:rgba(255,255,255,.65)}body.gm .order b{color:#fff}body.gm .order .cur{background:#fcf9f4;color:var(--g)}
body.gm .hold{background:rgba(255,255,255,.15)}body.gm .hold i{background:var(--or)}
body.gm .range{color:#fff}body.gm .range span{color:rgba(255,255,255,.6)}body.gm .hint{color:#fff}body.gm .hint.dn{color:#ffd2c8}
body.gm .watch{color:#fff}body.gm .watch.hid{color:rgba(255,255,255,.5)}
body.gm .play .btn.p{background:#fcf9f4;color:var(--g);box-shadow:0 5px 0 #0c3233;transform:translateY(-2px)}
body.gm .play .btn.p:active{transform:translateY(2px);box-shadow:0 1px 0 #0c3233}
body.gm .play .btn.p:disabled{opacity:.5;transform:none;box-shadow:0 2px 0 #0c3233}
body.gm .play .btn:not(.p){background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
body.gm .play .btn:not(.p):disabled{opacity:.4}
body.gm .cd .fa{background:#fcf9f4;color:var(--g);box-shadow:0 6px 0 #0c3233}body.gm .cd .ba{box-shadow:0 6px 0 #0c3233}
.cd .q{font-size:clamp(30px,9vw,48px);font-weight:900;opacity:.85}
body.gm .nc{box-shadow:0 3px 0 #0c3233}body.gm .nc.ok{background:#0f3a3b}
/* 장면 공통 */
.scn{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff;animation:scIn .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes scIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.gt{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1.1;text-shadow:0 4px 0 rgba(0,0,0,.18);animation:zoomIn .6s .1s cubic-bezier(.2,1.6,.4,1) both}
.gt.sm{font-size:clamp(26px,7.5vw,36px)}
@keyframes zoomIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.gd{margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,.85);max-width:420px;word-break:keep-all}
.gtag{font-size:13.5px;font-weight:800;color:#fff;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
.warn{margin:0;color:#ffd2c8;font-weight:700;font-size:14.5px}
.gbtns{display:flex;gap:10px;width:100%;margin-top:8px}
.gb{flex:1;min-height:60px;border-radius:16px;background:#fcf9f4;color:var(--g);font-weight:900;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 #0c3233;transform:translateY(-3px);transition:transform .08s,box-shadow .08s}
.gb svg{width:20px;height:20px}
.gb:active{transform:translateY(3px);box-shadow:0 0 0 #0c3233}
.gb:disabled{opacity:.45;transform:none;box-shadow:0 2px 0 #0c3233;cursor:default}
.gb.ghost{flex:0 0 60px;background:rgba(255,255,255,.12);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18),inset 0 0 0 1.5px rgba(255,255,255,.3)}
.gb.ghost.wide{flex:1}
.gb.go{animation:goPulse 1.2s infinite;font-size:22px}
@keyframes goPulse{0%,100%{box-shadow:0 6px 0 #0c3233,0 0 0 0 rgba(245,109,3,.55)}50%{box-shadow:0 6px 0 #0c3233,0 0 0 12px rgba(245,109,3,0)}}
/* 그림(움직임) */
.art{width:min(56vw,220px);height:min(56vw,220px);position:relative;animation:bobIn .7s cubic-bezier(.2,1.5,.4,1) both}
.art svg{width:100%;height:100%}
@keyframes bobIn{from{opacity:0;transform:translateY(-30px) rotate(-8deg)}to{opacity:1;transform:none}}
.a-bomb svg{animation:wob 1.1s infinite ease-in-out;transform-origin:50% 70%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.a-bal .blw{transform-origin:100px 176px;animation:inflate 2.2s infinite cubic-bezier(.5,0,.5,1)}
@keyframes inflate{0%{transform:scale(.5)}70%{transform:scale(1)}78%{transform:scale(1.06)}86%,100%{transform:scale(.5)}}
.a-fg i{position:absolute;width:28%;height:28%;border-radius:50%;border:5px solid #fff;box-sizing:border-box;background:rgba(245,109,3,.25);animation:fgOut 4s infinite}
.a-fg i:nth-child(2){animation-delay:.9s}.a-fg i:nth-child(3){animation-delay:1.8s}.a-fg i:nth-child(4){animation:fgLast 4s infinite}
@keyframes fgOut{0%,20%{border-color:var(--or);transform:scale(1)}30%,100%{border-color:rgba(255,255,255,.3);background:transparent;transform:scale(.8)}}
@keyframes fgLast{0%,70%{border-color:var(--or);transform:scale(1)}80%,100%{border-color:#fff;background:#c23a2b;transform:scale(1.2)}}
.a-ud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.a-ud b{border-radius:12px;background:#fcf9f4;color:var(--g);display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:0 4px 0 #0c3233;animation:udFlip 2.4s infinite}
@keyframes udFlip{0%,70%,100%{transform:rotateY(0)}80%{transform:rotateY(90deg);background:#c23a2b}90%{transform:rotateY(0);background:var(--or);color:#fff}}
.a-w .hand{transform-origin:100px 112px;animation:spin 2.2s infinite linear}
@keyframes spin{to{transform:rotate(360deg)}}
.a-cd{display:flex;align-items:center;justify-content:center;perspective:700px}
.cd2{width:30%;aspect-ratio:3/4;border-radius:12px;margin:0 -2%;transform:rotate(var(--r));position:relative;transform-style:preserve-3d}
.cd2 b{position:absolute;inset:0;border-radius:12px;background:#fcf9f4;color:var(--g);display:grid;place-items:center;font-weight:900;font-size:17px;box-shadow:0 5px 0 #0c3233}
.cd2 b.x{background:#c23a2b;color:#fff;font-size:22px}
.cd2.fl{animation:cdFlip 2.6s infinite;z-index:2}
@keyframes cdFlip{0%,35%{transform:rotateY(180deg) translateY(-8px)}50%,90%{transform:rotateY(0) translateY(-8px) scale(1.12)}100%{transform:rotateY(180deg) translateY(-8px)}}
.cd2.fl b.x{backface-visibility:hidden}
.cd2.fl::after{content:"";position:absolute;inset:0;border-radius:12px;background:#fcf9f4;box-shadow:0 5px 0 #0c3233;transform:rotateY(180deg);backface-visibility:hidden}
/* 게임 방법 카드 */
.rk-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.rn{font-weight:900;font-size:15px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px}
.skip{color:rgba(255,255,255,.75);font-weight:700;font-size:14px;padding:6px 8px}
.rcard{width:100%;background:#fcf9f4;color:var(--ink);border-radius:22px;padding:22px 20px 24px;box-shadow:0 8px 0 #0c3233;position:relative;animation:cardIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(4deg)}to{opacity:1;transform:none}}
.rcard .art{width:min(40vw,150px);height:min(40vw,150px);margin:0 auto}
.rcard .a-bal path:first-child{fill:#195455}.rcard .a-w circle:nth-of-type(1),.rcard .a-w rect{fill:#195455}.rcard .a-w circle:nth-of-type(2){fill:#e3ecea}.rcard .a-w circle:nth-of-type(3){fill:#195455}
.rcard .a-fg{background:#1d2a2a;border-radius:16px}
.rcard .cd2 b{background:var(--g);color:#fff}.rcard .cd2 b.x{background:#c23a2b}.rcard .cd2.fl::after{background:var(--g)}.rcard .a-ud b{background:var(--g);color:#fff}.rcard .a-bal .blw path:first-child{fill:#195455}
.rbig{position:absolute;left:16px;top:-16px;width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:0 3px 0 #b84f00}
.rtx{margin:10px 0 0;font-size:clamp(17px,4.6vw,20px);font-weight:800;line-height:1.55;word-break:keep-all;animation:txIn .5s .2s both}
@keyframes txIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:7px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.done{background:rgba(255,255,255,.6)}.dots i.on{background:var(--or);width:24px;border-radius:5px}
/* 순서 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode{background:rgba(255,255,255,.1);color:#fff;border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.mode b{font-size:17px;font-weight:900}.mode span{font-size:13px;opacity:.8}
.mode.on{background:#fcf9f4;color:var(--g);box-shadow:0 5px 0 #0c3233}
.slots{width:100%;display:flex;flex-direction:column;gap:7px}
.slot{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.18);border-radius:14px;padding:8px 12px;min-height:52px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.slot em{font-style:normal;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.slot b{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900}
.slot.spin b{opacity:.55;filter:blur(.6px)}
.slot.in{background:#fcf9f4;color:var(--ink);box-shadow:0 4px 0 #0c3233;animation:popIn .35s cubic-bezier(.2,1.8,.4,1)}
.slot.in em{background:var(--g);color:#fff}
.slot.pop{animation:popIn .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes popIn{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.av{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:inline-grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}

        if (n === bomb) { b.classList.add("x"); b.textContent = "펑"; setTimeout(() => { SND.boom(); vib([400, 80, 400]); const bx = document.createElement("div"); bx.className = "boom"; bx.innerHTML = `<b>펑! ${n}</b>`; document.body.appendChild(bx); }, 350); lose(order[cur], "숨은 숫자 " + bomb + " 카드를 뒤집었어요", 1700); return; }
        b.classList.add("ok"); if (n < bomb) { lo = n + 1; last = "UP"; } else { hi = n - 1; last = "DOWN"; }
        setTimeout(() => { SND.safe(); vib(30); done = false; cur = (cur + 1) % order.length; draw(); }, 650); };
    };
    draw(); G_STOP = () => { done = true; };
  },
  /* 5) 10초 맞히기 */
  watch(pl, order) {
    const T = wTarget(), HIDE = Math.min(3, T / 3), res = []; let cur = 0, t0 = 0, run = false, raf, stopped = false;
    const draw = () => {
      pl.innerHTML = `<div class="who">${cur + 1} / ${order.length}번째<b>${esc(order[cur])}</b></div>
        <div class="watch num" id="wv">0.00</div><div class="who" id="wh">${T}.00초에 멈추면 완벽!</div>
        <button class="btn p big" id="wb" style="max-width:420px">시작</button>
        ${res.length ? `<div class="rk">${res.map(r => `<div><span>${esc(r.p)}</span><span class="num">${r.t.toFixed(2)}초</span></div>`).join("")}</div>` : ""}`;
      $("#wb").onclick = () => {
        if (!run) { run = true; t0 = performance.now(); $("#wb").textContent = "멈추기"; SND.safe();
          const loop = now => { if (!run || stopped) return; const s = (now - t0) / 1000; const w = $("#wv"); if (s < HIDE) w.textContent = s.toFixed(2); else { w.textContent = "?.??"; w.classList.add("hid"); $("#wh").textContent = "숫자는 가려졌어요 — 마음속으로 세어요"; } raf = requestAnimationFrame(loop); };
          raf = requestAnimationFrame(loop); }
        else { run = false; cancelAnimationFrame(raf); const s = (performance.now() - t0) / 1000; res.push({ p: order[cur], t: s, d: Math.abs(s - T) }); SND.flip(); vib(30);
          const w = $("#wv"); w.classList.remove("hid"); w.textContent = s.toFixed(2); $("#wh").textContent = `${T}초에서 ${Math.abs(s - T).toFixed(2)}초 ${s >= T ? "넘었어요" : "모자라요"}`;
          const b = $("#wb"); b.disabled = true;
          setTimeout(() => { if (stopped) return; cur++; if (cur < order.length) draw(); else end(); }, 1500); } };
    };
    const end = () => { const s = res.slice().sort((a, b) => b.d - a.d); const L = s[0];
      pl.innerHTML = `<div class="who">결과 — ${T}초에서 가장 먼 사람이 독박</div><div class="rk">${s.map((r, i) => `<div><span class="${i ? "" : "l"}">${esc(r.p)}</span><span class="num ${i ? "" : "l"}">${r.t.toFixed(2)}초 (${r.t >= T ? "+" : "−"}${r.d.toFixed(2)})</span></div>`).join("")}</div>`;
      SND.boom(); vib([300, 60, 300]); lose(L.p, `${L.t.toFixed(2)}초에 멈췄어요 (${T}초에서 ${L.d.toFixed(2)}초 차이)`, 2600); };
    draw(); G_STOP = () => { stopped = true; run = false; cancelAnimationFrame(raf); };
  },
  /* 6) 꽝 카드 */
  cards(pl, order) {
    const N = cardN(order.length), bad = RI(0, N - 1), open = new Set(); let cur = 0, done = false;
    const draw = () => {
      pl.innerHTML = `<div class="who">카드를 뒤집을 사람<b>${esc(order[cur])}</b></div>
        <div class="cards${N > 12 ? " many" : ""}">${Array.from({ length: N }, (_, i) => `<div class="cd${open.has(i) ? " fl" : ""}" data-c="${i}"><div class="in"><div class="fa"><b class="q">?</b></div><div class="ba${i === bad ? " x" : ""}">${i === bad ? "꽝" : "통과"}</div></div></div>`).join("")}</div>${orderLine(order, cur)}`;
      pl.querySelector(".cards").onclick = e => { const c = e.target.closest("[data-c]"); if (!c || done) return; const i = +c.dataset.c; if (open.has(i)) return;
        open.add(i); c.classList.add("fl"); SND.flip(); vib(20);
        if (i === bad) { done = true; setTimeout(() => { SND.boom(); vib([400, 80, 400]); }, 450); lose(order[cur], "꽝 카드를 뒤집었어요", 1700); return; }
        done = true; setTimeout(() => { SND.safe(); done = false; cur = (cur + 1) % order.length; draw(); }, 800); };
    };
    draw(); G_STOP = () => { done = true; };
  },
};

/* ── 누르기 · 입력 ── */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a],[data-pen],[data-g]"); if (!b) return;
  if (b.dataset.pen) { S.pen = b.dataset.pen; save(); render(); if (S.pen === "직접") { const i = $(".pin"); if (i) i.focus(); } return; }
  if (b.dataset.g) { const g = GAMES.find(x => x.id === b.dataset.g); if (g.touch && !TOUCH) { toast("손가락 고르기는 휴대폰 · 태블릿에서 할 수 있어요"); return; } S.game = g; S.loser = null; go(2); return; }
  const a = b.dataset.a;
  if (a === "n-" || a === "n+") { S.n = Math.min(10, Math.max(2, S.n + (a === "n+" ? 1 : -1))); save(); render(); }
  else if (a === "tog") { if (S.pre) { S.game = S.pre; S.pre = null; S.loser = null; go(2); } else go(1); }
  else if (a === "to0") go(0);
  else if (a === "to1") go(1);
  else if (a === "again") { S.loser = null; S.quick = true; go(2); }
  else if (a === "quit") go(1);
  else if (a === "snd") { S.sound = !S.sound; save(); render(); if (S.sound) SND.safe(); }
  else if (a === "vib") { S.vib = !S.vib; save(); render(); vib(60); }
  else if (a === "fs") { const d = document, el = d.documentElement; try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (err) { toast("이 브라우저는 꽉 채우기를 지원하지 않아요"); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.nm != null) { S.names[+t.dataset.nm] = t.value; save(); }
  else if (t.dataset.a === "penc") { S.penC = t.value; save(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.nm != null) { const n = document.querySelector(`[data-nm="${+e.target.dataset.nm + 1}"]`); if (n) n.focus(); else go(1); } });

const GATE_ON = false;   /* 대표 글 공개 시각에 맞춰 Date.now() >= Date.parse(...)로 바꿈 */
(async () => { const T = new URLSearchParams(location.search).get("tab") || "all"; if (GATE_ON && !(await BJ_GATE.check("game", T))) return;
  const g = GAMES.find(x => x.id === T); if (g && !(g.touch && !TOUCH)) S.pre = g; render(); })();
</script></body></html>
