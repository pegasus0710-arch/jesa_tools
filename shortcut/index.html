<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#0B3D4A">
<title>단축키 사전 | Blog J</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"SUIT Variable";src:url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--sand:#FAF6EE;--sand2:#F3EEE3;--sand3:#F0EADF;--cloud:#FFFFFF;--line:#CDD3DC;--ink:#14202B;--sub:#5F6B7A;--sea:#0C737D;--sea2:#0A5C66;--sealt:#EEF6F7;--deep:#0B3D4A;--deepsub:#CFE3E6;--sky:#2B5FA0;--sun:#E07A4F;--suntx:#B4532A;--red:#C23A2B;--hair:rgba(20,32,43,.12);--hair2:rgba(20,32,43,.2);
 --up:0 0 0 1px rgba(20,32,43,.07),0 1px 2px rgba(20,32,43,.05),0 10px 26px -14px rgba(20,32,43,.22)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"SUIT Variable","SUIT","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:var(--sky)}
svg{display:block}
.top{background:var(--deep);color:#fff;position:sticky;top:0;z-index:30}
.tin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.badge{width:36px;height:36px;border-radius:10px;overflow:hidden;flex-shrink:0;position:relative}
.badge img{width:36px;height:36px;display:block}
.tname{font-weight:800;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
.tname small{font-weight:600;font-size:12.5px;color:var(--deepsub);margin-left:8px}
.tbtns{margin-left:auto;display:flex;gap:6px}
.tb{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.22)}
.tb svg{width:18px;height:18px}
.sbar{background:var(--deep);padding:0 16px 14px}
.sin{max-width:1280px;margin:0 auto;position:relative}
.sin input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.sin input{width:100%;height:52px;border-radius:14px;border:0;background:#fff;padding:0 48px 0 50px;font-size:17px;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.sin input:focus{box-shadow:0 0 0 3px #7fc4cb,0 2px 10px rgba(0,0,0,.18)}
.sin .mg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--sub)}
.sin .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;display:none;place-items:center;color:var(--sub)}
.sin .clr.on{display:grid}
.sin .clr:hover{background:var(--sand2)}
.sin kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:700 12.5px/1 "SUIT Variable",sans-serif;color:var(--sub);background:var(--sand2);border-radius:6px;padding:5px 7px}
.recent{max-width:1280px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.recent span{font-size:12.5px;color:var(--deepsub);font-weight:700;margin-right:2px}
.recent button{font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px}
.recent button:hover{background:rgba(255,255,255,.26)}
.wrap{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.side{position:sticky;top:140px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 156px);overflow:auto;padding-bottom:4px}
.card{background:var(--cloud);border-radius:16px;box-shadow:var(--up)}
.plist{padding:8px}
.pi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;text-align:left;font-weight:700;font-size:15px}
.pi:hover{background:var(--sand2)}
.pi.on{background:var(--sea);color:#fff}
.pi .pc{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px}
.pi.on .pc{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.pi .n{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.pi.on .n{color:#d6eef0}
.sep{height:1px;background:var(--hair);margin:6px 8px}
.clist{padding:10px 8px}
.clist h4{margin:2px 8px 6px;font-size:12.5px;color:var(--sub);font-weight:800}
.ci{display:flex;width:100%;padding:7px 10px;border-radius:9px;font-size:14px;font-weight:600;text-align:left;gap:8px}
.ci:hover{background:var(--sand2)}
.ci.on{background:var(--sealt);color:var(--sea2);font-weight:800;box-shadow:inset 3px 0 0 var(--sea)}
.ci .n{margin-left:auto;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.main{min-width:0}
.mhead{padding:16px 18px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 14px;border-bottom:1px solid var(--hair)}
.mhead h2{margin:0;font-size:21px;letter-spacing:-.4px}
.mhead .meta{font-size:13px;color:var(--sub);font-weight:600}
.mhead .acts{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13.5px;box-shadow:inset 0 0 0 1px var(--hair2);background:#fff;white-space:nowrap}
.btn:hover{background:var(--sand2)}
.btn svg{width:16px;height:16px}
.btn.go{background:var(--sea);color:#fff;box-shadow:none}
.btn.go:hover{background:var(--sea2)}
.mobcats{display:none}
.grp{padding:14px 18px 4px;font-size:13px;font-weight:800;color:var(--deep);display:flex;align-items:center;gap:8px;position:sticky;top:132px;background:var(--cloud);z-index:2}
.grp i{font-style:normal;color:var(--sub);font-weight:700;font-size:12.5px}
.row{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 18px;border-top:1px solid var(--hair)}
.row:hover{background:#FCFAF6}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.kc{display:inline-block;min-width:26px;text-align:center;padding:3px 8px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1px #C9CFD8,0 2px 0 #C9CFD8;font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.kp{color:var(--sub);font-size:12.5px;font-weight:700}
.kor{color:var(--sub);font-size:12.5px;font-weight:800;margin:0 2px}
.kt{font-size:13.5px;font-weight:600;color:var(--ink)}
.desc{font-size:15px;line-height:1.5;min-width:0}
.desc .tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}
.tag{font-size:12.5px;color:var(--sub);font-weight:600}
.tag.pg{color:#fff;font-weight:800;border-radius:6px;padding:1px 7px}
.tag.wp{color:var(--suntx);font-weight:800;text-decoration:none}
a.tag.wp:hover{text-decoration:underline}
mark{background:#FFE7A8;color:inherit;border-radius:3px;padding:0 1px}
.ra{display:flex;gap:2px}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--sub)}
.ib:hover{background:var(--sand2);color:var(--ink)}
.ib svg{width:18px;height:18px}
.ib.fav{color:var(--suntx)}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:15px;line-height:1.7}
.empty b{color:var(--ink)}
.more{padding:12px 18px 16px;text-align:center;border-top:1px solid var(--hair)}
.src{padding:12px 18px 16px;font-size:12.5px;color:var(--sub);line-height:1.7;border-top:1px solid var(--hair)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
#sheet{position:fixed;inset:0;background:rgba(11,61,74,.45);z-index:60;display:grid;place-items:center;padding:16px}
#sheet[hidden]{display:none}
.shbox{background:var(--cloud);border-radius:18px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shh b{font-size:18px}
.sc{background:var(--sand);border-radius:14px;padding:14px;margin-top:10px}
.sh2{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sh2 svg{width:18px;height:18px;color:var(--sea)}
.sc p{margin:6px 0 0;font-size:14px;line-height:1.65;color:var(--ink)}
.small{font-size:12.5px!important;color:var(--sub)!important}
.links{display:flex;flex-direction:column;gap:6px}
.links a{font-weight:700;font-size:14.5px}
.qrw{display:flex;gap:14px;align-items:center}
.qr{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px;flex-shrink:0}
.qr svg{width:100%;height:100%}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.apps a{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px;font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;box-shadow:inset 0 0 0 1px var(--hair)}
.apps img{width:28px;height:28px;border-radius:7px}
.isteps{margin:10px 0 0;padding-left:22px;font-size:14.5px;line-height:1.8}
.iapp{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.iapp img{border-radius:12px}
.iapp b{display:block;font-size:16px}
.iapp span{font-size:13px;color:var(--sub)}
.foot{max-width:1280px;margin:0 auto;padding:6px 16px 30px;font-size:12.5px;color:var(--sub)}
@media (max-width:900px){
 .mhead .acts .btn{height:30px;padding:0 9px}
 .wrap{grid-template-columns:1fr;padding:10px}
 .side{display:none}
 .mobcats{display:block;padding:10px 12px 8px;border-bottom:1px solid var(--hair)}
 .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
 .chips::-webkit-scrollbar{display:none}
 .chip{flex-shrink:0;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px var(--hair2);background:#fff;white-space:nowrap}
 .chip.on{background:var(--sea);color:#fff;box-shadow:none}
 .chips.c2 .chip{font-size:13px;padding:6px 11px}
 .chips.c2 .chip.on{background:var(--sealt);color:var(--sea2);box-shadow:inset 0 0 0 1.5px var(--sea)}
 .row{grid-template-columns:minmax(0,1fr) auto;padding:10px 12px}
 .row .keys{grid-column:1/2}
 .row .desc{grid-column:1/2}
 .row .ra{grid-column:2/3;grid-row:1/3;align-self:center}
 .grp{top:118px;padding:12px 12px 4px}
 .mhead{padding:12px 12px 10px}
 .mhead h2{font-size:18px}
 .tname small{display:none}
 .tb span{display:none}
 .tb{padding:0 10px}
 .sin kbd{display:none}
 .sin input{height:48px;font-size:16px}
}
@media print{
 .top,.sbar,.side,.ra,.acts,.mobcats,.more,.foot,#sheet,.toast{display:none!important}
 body{background:#fff}
 .wrap{display:block;padding:0}
 .card{box-shadow:none}
 .grp{position:static}
 .row{break-inside:avoid;padding:5px 4px;grid-template-columns:180px 1fr}
 .desc{font-size:12px}.kc{font-size:11px;box-shadow:inset 0 0 0 1px #999}
 @page{size:A4;margin:12mm}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<div class="sbar"><div class="sin">

 <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="하고 싶은 일이나 키로 찾기 — 캡처 · 줄 바꿈 · Ctrl+Shift+L" aria-label="단축키 찾기">
 <kbd id="kslash">/</kbd>

</div><div class="recent" id="recent"></div></div>
<div class="wrap">

</div>
<div class="foot" id="foot"></div>
<div id="sheet" hidden></div>
<div class="toast" id="toast"></div>
