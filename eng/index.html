<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light"><meta name="theme-color" content="#0B3D4A">
<title>영어 노트 | Blog J</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{--bg:#FAF6EE;--in:#F3EEE3;--desk:#F0EADF;--card:#fff;--line:#CDD3DC;--hair:rgba(20,32,43,.12);--ink:#14202B;--sub:#5F6B7A;--sea:#0C737D;--sea2:#0A5C66;--seal:#EEF6F7;--deep:#0B3D4A;--deeps:#CFE3E6;--sky:#2B5FA0;--sun:#E07A4F;--red:#C23A2B;--up:0 1px 2px rgba(20,32,43,.06),0 0 0 1px rgba(20,32,43,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SUIT,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--sky)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hd{background:var(--deep);color:#fff;position:sticky;top:0;z-index:30}
.hd-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{width:38px;height:38px;border-radius:10px;flex-shrink:0}
.logo small{display:block;font-size:11.5px;font-weight:700;color:var(--deeps)}
.logo b{display:block;font-size:18px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.hd .sp{flex:1}
.gdot{width:9px;height:9px;border-radius:50%;background:#9AA3AE;display:inline-block;flex-shrink:0}
.gdot.ok{background:#2f8a57}.gdot.busy{background:var(--sun)}
.nav{display:flex;gap:4px}
.nav button{height:38px;padding:0 13px;border-radius:10px;color:var(--deeps);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 40px}
.btn{height:42px;padding:0 15px;border-radius:11px;background:#fff;box-shadow:var(--up);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14.5px;white-space:nowrap}
.btn:hover{box-shadow:0 0 0 2px var(--sea)}
.btn.go{background:var(--sea);color:#fff;box-shadow:none}
.btn.go:hover{background:var(--sea2)}
.btn.sm{height:34px;padding:0 11px;font-size:13.5px;border-radius:9px}
.btn.red{color:var(--red)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.vh h2{font-size:21px;font-weight:900;letter-spacing:-.02em}
.vh p{font-size:13.5px;color:var(--sub)}
.card{background:#fff;border-radius:16px;box-shadow:var(--up);padding:16px}
.lead{color:var(--sub);font-size:13.5px}
.hint{font-size:13px;color:var(--sub);line-height:1.6;margin-top:8px}
/* 복습 띠 */
.rvband{background:var(--seal);border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:inset 0 0 0 1px rgba(12,115,125,.25)}
.rvband .pip{width:10px;height:10px;border-radius:50%;background:var(--sun);flex-shrink:0}
.rvband b{font-size:15px}
.rvband .tx{flex:1;min-width:200px;font-size:14px}
/* 챕터 목록 */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ch{background:#fff;border-radius:14px;box-shadow:var(--up);padding:12px 12px 12px 10px;display:flex;gap:10px;align-items:center}
.ch.sel{box-shadow:0 0 0 2px var(--sea)}
.ch .ck{width:26px;height:26px;border-radius:7px;background:var(--in);display:grid;place-items:center;flex-shrink:0}
.ch.sel .ck{background:var(--sea);color:#fff}
.ch .tx{flex:1;min-width:0;text-align:left}
.ch .tx b{display:block;font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .tx small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .pl{width:44px;height:44px;border-radius:12px;background:var(--sea);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ch .pl svg{width:20px;height:20px}
.ch .ed{width:36px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--sub);flex-shrink:0}
.ch.star .pl{background:var(--deep)}
.tag{font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--in);color:var(--sub);margin-left:6px;vertical-align:1px}
.tag.due{background:#FBE7DD;color:#9A4320}
.selbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:12px;display:flex;gap:8px;align-items:center;background:var(--deep);color:#fff;border-radius:14px;padding:10px 12px;z-index:20}
.selbar span{flex:1;font-weight:800;font-size:14px;min-width:0}
.selbar .btn{color:var(--ink)}.selbar .btn.go{color:#fff;background:var(--sun)}
/* 플레이어 */
.pv{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.stagep{background:var(--deep);color:#fff;border-radius:20px;padding:18px 18px 16px;min-height:330px;display:flex;flex-direction:column}
.stagep .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--deeps);font-weight:700}
.stagep .top b{color:#fff}
.phase{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.phase i{font-style:normal;font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--deeps)}
.phase i.on{background:var(--sun);color:#fff}
.ko{font-size:clamp(22px,4.6vw,30px);font-weight:900;line-height:1.35;letter-spacing:-.02em;word-break:keep-all}
.en{font-size:clamp(20px,4.2vw,27px);font-weight:700;line-height:1.4;margin-top:14px;color:#fff;word-break:break-word}
.en.hide{color:transparent;text-shadow:0 0 14px rgba(255,255,255,.55);user-select:none}
.count{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:0}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0 4px}
.ctl button{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--up);display:grid;place-items:center}
.ctl button svg{width:22px;height:22px}
.ctl .big{width:76px;height:76px;background:var(--sea);color:#fff;box-shadow:none}
.ctl .big svg{width:32px;height:32px}
.ctl .st.on{background:var(--sun);color:#fff}
.tst{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tst button{height:46px;padding:0 20px;border-radius:12px;font-weight:900;font-size:15px;background:#fff;box-shadow:var(--up)}
.tst .ok{color:#1f7a4a}.tst .ng{color:var(--red)}
.opt{display:flex;flex-direction:column;gap:12px}
.lab{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.seg{display:flex;background:var(--in);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1 0 auto;height:34px;padding:0 9px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--up)}
.tg{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;padding:4px 0;cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--sea);flex-shrink:0}
.tg span{flex:1}
.engine{font-size:13px;border-radius:10px;padding:9px 11px;background:var(--in);color:var(--sub);line-height:1.55}
.engine b{color:var(--ink)}
.engine.az{background:var(--seal)}
.qlist{margin-top:14px}
.qi{display:flex;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;width:100%;align-items:flex-start}
.qi:hover{background:var(--in)}
.qi.on{background:var(--seal);box-shadow:inset 3px 0 0 var(--sea)}
.qi .n{font-size:12.5px;color:var(--sub);font-weight:800;width:24px;flex-shrink:0;padding-top:2px}
.qi .tx{flex:1;min-width:0}
.qi .tx b{display:block;font-size:14.5px;font-weight:800}
.qi .tx small{display:block;font-size:13px;color:var(--sub)}
.qi .s{color:var(--sun);flex-shrink:0}
/* 편집 */
.inp{height:42px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);padding:0 11px;font-size:15px;outline:0;min-width:0;width:100%}
.inp:focus,textarea.inp:focus{box-shadow:0 0 0 2px var(--sea)}
textarea.inp{height:auto;padding:10px 11px;line-height:1.55;resize:vertical}
.it{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 34px 34px;gap:6px;align-items:center;margin-bottom:6px}
.it .n{font-size:12.5px;font-weight:800;color:var(--sub);text-align:right}
.it .x,.it .sx{width:34px;height:42px;border-radius:9px;background:var(--in);display:grid;place-items:center;color:var(--sub)}
.it .sx.on{color:var(--sun)}
/* 통계 */
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kp div{background:#fff;border-radius:14px;box-shadow:var(--up);padding:12px 14px}
.kp small{display:block;font-size:12.5px;color:var(--sub);font-weight:700}
.kp b{display:block;font-size:24px;font-weight:900;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:120px;margin-top:8px}
.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.days i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--sea);min-height:2px}
.days i.z{background:var(--line)}
.days span{font-size:11.5px;color:var(--sub)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair)}
.tbl th{font-size:12.5px;color:var(--sub);white-space:nowrap}
.tbl td.num{white-space:nowrap}
@media (max-width:600px){.tbl{font-size:13px}.tbl th,.tbl td{padding:7px 4px}}
/* 설정 */
.setg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sc{background:#fff;border-radius:16px;box-shadow:var(--up);padding:16px}
.sh2{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;margin-bottom:8px}
.sc p{font-size:13.5px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.stc{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--sub);background:var(--in);padding:2px 8px;border-radius:6px}
.stc.ok{background:#E3F2EA;color:#1f7a4a}
.qrw{display:flex;gap:12px;align-items:center}
.qr{width:120px;flex-shrink:0;background:#fff}
.qr svg{width:100%;height:auto;display:block}
.links{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
select.inp{appearance:auto}
/* 시트 · 알림 */
#sheet{position:fixed;inset:0;background:rgba(11,25,32,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.shbox{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.edh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.edh b{font-size:17px;font-weight:900}
#busy{position:fixed;inset:0;background:rgba(11,25,32,.5);z-index:70;display:grid;place-items:center;padding:20px}
#busy[hidden]{display:none}
#busy .bx{background:#fff;border-radius:16px;padding:20px 22px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(360px,100%);text-align:center}
#busy .bar{background:var(--in);margin:12px 0}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#syband{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#fffdf7;border:1px solid #d9cfbd;font-weight:700;font-size:13.5px}
#syband button{font-weight:900;color:var(--sea)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -1px 0 var(--hair);display:none;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabs button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:var(--sub)}
.tabs button.on{color:var(--sea)}
.tabs svg{width:22px;height:22px}
.iapp{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.iapp img{border-radius:12px}
.iapp b{display:block;font-size:16px}.iapp span{font-size:13px;color:var(--sub)}
.isteps{padding-left:20px;margin:10px 0;line-height:1.9}
/* 회화 · 단어 구역 */
.sectab{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--in);border-radius:14px;padding:4px;margin-bottom:16px;max-width:460px}
.sectab button{height:48px;border-radius:11px;font-size:17px;font-weight:900;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px}
.sectab button small{font-size:12.5px;font-weight:700;color:var(--sub)}
.sectab button.on{background:var(--sea);color:#fff;box-shadow:var(--up)}
.sectab button.on small{color:var(--deeps)}
.ch .tx b .tag{margin-left:6px}
/* 단어 줄 */
.it.w{grid-template-columns:28px minmax(0,1fr) minmax(0,1.2fr) 34px 34px;row-gap:4px;padding-bottom:8px;border-bottom:1px dashed var(--hair);margin-bottom:8px}
.it.w .ex2{grid-column:2/4}.it.w .exk2{grid-column:2/4;height:36px;font-size:14px}
.it.w .ex2{height:36px;font-size:14px}
/* 단어 무대 */
.wdx{font-size:clamp(30px,7vw,46px);font-weight:900;letter-spacing:-.01em;line-height:1.15;word-break:break-word}
.mnx{font-size:clamp(20px,4.4vw,26px);font-weight:800;margin-top:10px;color:var(--deeps);word-break:keep-all}
.exx{font-size:16px;margin-top:16px;line-height:1.5;color:#fff;opacity:.92}
.exx small{display:block;font-size:14px;color:var(--deeps);margin-top:2px}
.exx.dim{opacity:.25}
.wdx.hide,.mnx.hide{color:transparent;text-shadow:0 0 14px rgba(255,255,255,.55);user-select:none}
/* 단어장 인쇄 */
#prt{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body.printing{background:#fff!important;padding:0!important}
  body.printing>*:not(#prt){display:none!important}
  body.printing #prt{display:block;color:#000;font-family:SUIT,"Malgun Gothic",sans-serif}
  #prt h1{font-size:18pt;margin:0 0 2mm}
  #prt .prs{font-size:9.5pt;color:#555;margin:0 0 4mm}
  #prt table{width:100%;border-collapse:collapse;font-size:11pt}
  #prt th,#prt td{border:0.3mm solid #999;padding:2.4mm 2.5mm;text-align:left;vertical-align:top}
  #prt th{background:#eee;font-size:9.5pt}
  #prt td:first-child{width:8mm;text-align:center;color:#666}
  #prt td.w{font-weight:800;width:38mm}
  #prt td.e{font-size:9.5pt}
  #prt td.e small{color:#555}
  #prt tr{break-inside:avoid}
  #prt .prf{font-size:8.5pt;color:#888;text-align:right;margin-top:3mm}
}
@media (max-width:600px){.it.w{grid-template-columns:22px minmax(0,1fr) 34px 34px}.it.w .wd2{grid-column:2/3}.it.w .mn2{grid-column:2/5;grid-row:2}.it.w .ex2,.it.w .exk2{grid-column:2/5}}
/* 아래 미니 플레이어(다른 화면에서도 재생 상태) */
#mini{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:39;background:var(--deep);color:#fff;box-shadow:0 -8px 22px rgba(11,25,32,.22)}
#mini[hidden]{display:none}
.mini-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;position:relative}
.mini-bar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.14)}
.mini-bar i{display:block;height:100%;background:var(--sun)}
.mini-tx{flex:1;min-width:0;text-align:left;color:#fff;padding:2px 0}
.mini-tx small{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--deeps);white-space:nowrap;overflow:hidden}
.mini-tx small span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini-tx small span.num{flex-shrink:0;overflow:visible}
.mini-tx small em{font-style:normal;font-weight:800;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;flex-shrink:0}
.mini-tx small em.live{background:var(--sun)}
.mini-tx b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-in .mb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
.mini-in .mb:hover{background:rgba(255,255,255,.12)}
.mini-in .mb svg{width:20px;height:20px}
.mini-in .mpp{width:48px;height:48px;background:#fff;color:var(--deep)}
.mini-in .mpp:hover{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.mini-in .mpp svg{width:22px;height:22px}
body.hasmini{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
body.hasmini .selbar{bottom:calc(148px + env(safe-area-inset-bottom))}
body.hasmini #toast{bottom:calc(156px + env(safe-area-inset-bottom))}
body.hasmini #syband{bottom:calc(148px + env(safe-area-inset-bottom))}
@media (min-width:901px){#mini{bottom:0}body.hasmini{padding-bottom:76px}body.hasmini .selbar{bottom:80px}body.hasmini #toast{bottom:90px}body.hasmini #syband{bottom:84px}}
@media (min-width:901px){body{padding-bottom:0}.selbar{bottom:12px}#toast{bottom:24px}#syband{bottom:16px}}
@media (max-width:900px){
  .nav{display:none}.tabs{display:grid}
  .pv{grid-template-columns:minmax(0,1fr)}
  .kp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:14px 14px 30px}
}
@media (max-width:600px){
  .logo small{display:none}
  .it{grid-template-columns:22px minmax(0,1fr) 34px 34px}
  .it .en2{grid-column:2/3}
  .it .ko2{grid-column:2/5}
  .chs{grid-template-columns:minmax(0,1fr)}
  .stagep{min-height:300px}
}
</style></head><body>
<header class="hd"><div class="hd-in"><div class="logo"><img src="icon-192.png" alt=""><div><small>Blog J · 회화 · 단어</small><b>영어 노트</b></div></div><span class="sp"></span><nav class="nav" id="nav"></nav><span class="gdot" id="gdot"></span></div></header>
<main class="wrap" id="main"></main>
<div id="mini" hidden></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet" hidden></div>
<div id="busy" hidden><div class="bx"><div id="busyT">음성 만드는 중</div><div class="bar"><i id="busyB"></i></div><button class="btn sm" data-a="cancel">멈추기</button></div></div>
<div id="toast" role="status"></div>
<audio id="au" preload="auto" playsinline></audio>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Blog J 공통 동기화 핵심(bj-sync-core.js) — 2026-11-08 점검안 · 서버 없음
   ───────────────────────────────────────────────────────────────────────────
   목적(제이 불편 3가지):
     ① 쓰다 보면 구글이 끊긴 것처럼 보이고 처음 화면이 다시 나옴
     ② PC · 휴대폰이 바로 맞춰지지 않음
     ③ PC 폴더를 연결해도 저절로 저장이 잘 안 됨
   원칙:
     · 「연결됨」은 저장된 표시(앱의 gdOn)로 정한다 — 토큰(1시간짜리) 유무로 정하지 않는다.
       토큰이 없으면 「쉬는 중」일 뿐, 처음 화면 · 설정 화면을 다시 띄우지 않는다.
     · 토큰은 모든 Blog J 앱이 같은 주소(origin)라서 localStorage 「bj-gd-token」 하나를 같이 쓴다
       (클라이언트 ID · 권한(drive.file)이 같아서 한 앱에서 받은 토큰을 다른 앱도 쓸 수 있음).
     · 토큰 다시 받기는 브라우저가 「사용자가 누른 순간」에만 구글 창(잠깐 열렸다 닫힘)을 허락한다.
       → 화면을 누를 때(pointerdown/keydown) 조용히(prompt:'none' + login_hint) 다시 받는다.
       → 누름 없이(백그라운드 · 401) 구글 창을 열지 않는다(열면 팝업 차단 → 오류만 남음).
     · 고친 것은 「올릴 것 있음」 표시를 localStorage에 남겨(앱을 닫아도 남음) 연결이 돌아오면 올린다.
     · 열려 있고 화면이 보이는 동안: 다시 볼 때 · 창에 들어올 때 · 인터넷이 돌아올 때 + 90초마다
       드라이브 파일의 수정 시각만 가볍게 확인 → 바뀌었으면 맞추기(받기+합치기+올리기).
     · PC 폴더: 권한이 'prompt'가 되면(브라우저를 다시 열면 흔함) 조용히 실패하지 않고
       작은 띠 「PC 폴더 다시 연결」 → 누르면 그 누름으로 허용을 받고 밀린 것을 한꺼번에 씀.
   서버 없이 안 되는 것(정직하게):
     · 새로 고침 토큰(refresh token)이 없다 → 1시간마다 토큰이 끝나고, 다시 받으려면 「누름」이 한 번 필요.
       (구글 로그인 · 앱 허용이 살아 있으면 창이 잠깐 깜빡이고 끝, 로그아웃 · 쿠키 삭제 · 여러 계정이면 계정 고르기 창)
     · 앱이 닫혀 있을 때(또는 휴대폰이 앱을 얼려 둔 동안) 동기화는 불가 — 다음에 열고 한 번 누를 때 맞춤.
     · 사파리 · 일부 브라우저는 prompt:'none' 창을 막거나 서드파티 쿠키 때문에 실패할 수 있음 → 띠 단추로.
     · 드라이브 v3에는 「바뀌지 않았을 때만 덮어쓰기」 조건 저장이 공식적으로 없다 →
       올리기 바로 전에 수정 시각을 한 번 더 보고 바뀌었으면 한 번 더 합친 뒤 올림(beforePush 훅).
   쓰는 법: 맨 아래 「앱에 붙이기」 + sync_plan/integration_checklist.md
   ═══════════════════════════════════════════════════════════════════════════ */
(function (W) {
  "use strict";
  const TK = "bj-gd-token";                     /* 기존 trip2 와 같은 키 · 같은 모양 {t,e,m} */
  const now = () => Date.now();
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const hasGesture = () => !!(navigator.userActivation && navigator.userActivation.isActive);
  const visible = () => document.visibilityState === "visible";

  function create(cfg) {
    /* cfg = {
         app:        "trip2"                       — 로컬 저장 키 이름에 씀
         clientId, scope                           — GIS
         isOn():     bool                          — 저장된 「드라이브 연결함」 표시(D.set.gdOn 등). 토큰과 무관
         email():    string                        — 연결한 계정(login_hint). 없으면 조용한 갱신이 덜 됨
         setEmail(e)                               — (선택) 처음 맞출 때 받은 계정 저장
         sync(why):  Promise                       — 앱의 맞추기(받기 → 합치기 → 올리기). 토큰은 core.token()으로
         remoteStamp(): Promise<string|null>       — (선택) 드라이브 본 파일의 modifiedTime 만 가볍게. 없으면 주기 확인 때 전체 맞추기
         paint(state)                              — (선택) 앱 머리줄 · 상태 줄 다시 그리기
         folder: {                                 — (선택) PC · 안드로이드 폴더
           handle(): FileSystemDirectoryHandle|null
           onPerm(p)                               — 'granted' | 'prompt' | 'denied' 를 앱 상태(D.dirPerm 등)에 반영
           writeAll(): Promise                     — 지금 자료 전부 폴더에 쓰기(앱의 folderWrite / dirWrite(true) / Store.writeFile 들)
           name(): string
         }
         band: true                                — 기본 띠를 core가 그림(false면 앱이 state로 직접)
       } */
    const K = { dirty: "bj-sync:" + cfg.app + ":dirty", fdirty: "bj-sync:" + cfg.app + ":fdirty", stamp: "bj-sync:" + cfg.app + ":stamp" };
    const C = { token: null, exp: 0, tc: null, silentAt: 0, silentFails: 0, busy: false, again: false, err: "", lastPull: 0, timer: null, pushT: null, needGesture: false, folderPerm: null };

    /* ── 토큰 ───────────────────────────────────────────── */
    const live = () => !!C.token && now() < C.exp - 60000;
    function restore() {   /* 같은 주소의 다른 Blog J 앱이 받은 토큰도 씀(계정이 같을 때만) */
      const o = lsGet(TK, null), m = (cfg.email && cfg.email()) || "";
      if (o && o.t && o.e > now() + 120000 && (!o.m || !m || o.m === m)) { C.token = o.t; C.exp = o.e; return true; }
      return false;
    }
    function keep() { lsSet(TK, { t: C.token, e: C.exp, m: (cfg.email && cfg.email()) || "" }); }
    function invalidate() { C.token = null; C.exp = 0; const o = lsGet(TK, null); if (o && o.t) lsSet(TK, null); }
    function loadGis() {
      return new Promise((res, rej) => { if (W.google && google.accounts && google.accounts.oauth2) return res();
        const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
        s.onload = () => res(); s.onerror = () => rej(new Error("구글 로그인 도구를 불러오지 못했어요 (인터넷 확인)")); document.head.appendChild(s); });
    }
    /* 토큰 받기 — mode: 'silent'(prompt:none, 누름 안에서만) | 'interactive'(prompt:'' 또는 처음이면 consent) */
    function request(mode) {
      return loadGis().then(() => new Promise((res, rej) => {
        const em = (cfg.email && cfg.email()) || undefined;
        const tc = google.accounts.oauth2.initTokenClient({ client_id: cfg.clientId, scope: cfg.scope, hint: em, login_hint: em,
          callback: r => { if (r.error) return rej(Object.assign(new Error(r.error_description || r.error), { code: r.error }));
            C.token = r.access_token; C.exp = now() + (+r.expires_in || 3600) * 1000; keep(); res(C.token); },
          error_callback: e => rej(Object.assign(new Error(e && e.type === "popup_failed_to_open" ? "구글 창이 막혔어요 — 「다시 연결」을 눌러 주세요" : e && e.type === "popup_closed" ? "구글 창을 닫았어요" : "구글 연결이 취소됐어요"), { code: e && e.type })) });
        tc.requestAccessToken({ prompt: mode === "silent" ? "none" : (cfg.isOn() ? "" : "consent") });
      }));
    }
    /* 앱의 gdToken 대신: 살아 있으면 바로, 없으면 누름이 있을 때만 다시 받음. 누름이 없으면 창을 열지 않고 NEED_GESTURE */
    /* 11-09: 한 번만 받기 — 사진을 여러 장 동시에 올리다 토큰이 끝나도 구글 창은 한 번만 열고 같이 씀 */
    let tokP = null;
    function token(interactive) {
      if (live()) return Promise.resolve(C.token);
      return tokP || (tokP = token0(interactive).finally(() => { tokP = null; }));
    }
    async function token0(interactive) {
      if (live()) return C.token;
      if (restore()) return C.token;
      if (!hasGesture()) { C.needGesture = true; paint(); throw Object.assign(new Error("구글 연결이 쉬는 중이에요 — 화면을 한 번 누르면 이어서 맞춰요"), { code: "NEED_GESTURE" }); }
      const t = await request(interactive ? "interactive" : "silent");
      C.needGesture = false; C.silentFails = 0; return t;
    }

    /* ── 올릴 것 표시(앱을 닫아도 남음) ───────────────────── */
    const dirtyAt = () => +lsGet(K.dirty, 0) || 0;
    function markDirty() {                  /* 앱의 touch() / save() 마다 */
      lsSet(K.dirty, now());
      if (cfg.folder) lsSet(K.fdirty, now());
      if (!cfg.isOn()) return;
      clearTimeout(C.pushT);
      if (live()) C.pushT = setTimeout(() => run("push"), 2500); else { C.needGesture = true; paint(); }
    }
    /* ── 맞추기 실행(겹치지 않게 · 실패해도 표시는 남김) ─────── */
    async function run(why) {
      if (!cfg.isOn()) return;
      if (C.busy) { C.again = true; return; }
      if (!live() && !restore()) { C.needGesture = true; paint(); return; }
      C.busy = true; C.err = ""; paint();
      const started = now();
      try {
        await cfg.sync(why);
        if (dirtyAt() <= started) lsSet(K.dirty, null);     /* 맞추는 동안 또 고쳤으면 표시 유지 */
        C.lastPull = now();
        if (cfg.remoteStamp) { try { lsSet(K.stamp, await cfg.remoteStamp()); } catch (e) {} }
        if (cfg.folder) folderFlush();                         /* ③ 받은 것도 폴더에 — 지금은 레시피 · 스크랩 · 가계부가 안 씀 */
      } catch (e) {
        if (e && (e.status === 401 || /401|Invalid Credentials/.test(e.message || ""))) { invalidate(); C.needGesture = true; }
        else if (!(e && e.code === "NEED_GESTURE")) C.err = (e && e.message) || "동기화 오류";
      }
      C.busy = false; paint();
      if (C.again) { C.again = false; setTimeout(() => run("again"), 600); }
    }
    /* 가벼운 확인: 드라이브 본 파일 수정 시각만 보고 바뀌었을 때만 맞춤(요청 1번) */
    async function check(why) {
      if (!cfg.isOn() || !visible() || C.busy) return;
      if (!live() && !restore()) { C.needGesture = true; paint(); return; }
      if (dirtyAt()) return run(why);                          /* 올릴 것이 있으면 바로 맞추기 */
      if (!cfg.remoteStamp) return run(why);
      try { const s = await cfg.remoteStamp(); if (s && s !== lsGet(K.stamp, null)) return run(why); C.lastPull = now(); }
      catch (e) { if (/401/.test(e && e.message || "")) { invalidate(); C.needGesture = true; paint(); } }
    }

    /* ── 화면을 누를 때: 조용히 토큰 다시 받기(누름 안에서만 창 허용) ── */
    function onGesture(e) {
      if (!cfg.isOn() || live() || C.busy) return;
      if (e && e.target && e.target.closest && e.target.closest("[data-bjs-band],[data-gdoff]")) return;
      if (restore()) { run("restore"); return; }
      if (cfg.noSilent && cfg.noSilent()) { C.needGesture = true; paint(); return; }   /* 11-10: 휴대폰 설치 앱은 창 대신 띠 「다시 연결」(같은 화면 이동) */
      const gap = C.silentFails ? Math.min(10 * 60000, 30000 * Math.pow(2, C.silentFails)) : 0;   /* 실패하면 30초 · 1분 · 2분 … 최대 10분 */
      if (now() - C.silentAt < gap) return;
      C.silentAt = now();
      request("silent").then(() => { C.needGesture = false; C.silentFails = 0; run("gesture"); })
        .catch(() => { C.silentFails++; C.needGesture = true; paint(); });
    }

    /* ── PC 폴더 ───────────────────────────────────────── */
    async function folderCheck() {
      const h = cfg.folder && cfg.folder.handle(); if (!h || !h.queryPermission) return;
      let p = "prompt"; try { p = await h.queryPermission({ mode: "readwrite" }); } catch (e) {}
      if (p !== C.folderPerm) { C.folderPerm = p; cfg.folder.onPerm && cfg.folder.onPerm(p); paint(); }
      if (p === "granted" && lsGet(K.fdirty, 0)) folderFlush();
    }
    let fBusy = false;
    async function folderFlush() {
      const h = cfg.folder && cfg.folder.handle(); if (!h || fBusy) return;
      if (C.folderPerm !== "granted") { await folderCheck(); if (C.folderPerm !== "granted") return; }
      fBusy = true; const t0 = now();
      try { await cfg.folder.writeAll(); if (+lsGet(K.fdirty, 0) <= t0) lsSet(K.fdirty, null); }
      catch (e) { if (e && e.name === "NotAllowedError") { C.folderPerm = "prompt"; cfg.folder.onPerm && cfg.folder.onPerm("prompt"); } }
      fBusy = false; paint();
    }
    async function folderGrant() {      /* 띠 단추 — 반드시 누름 안에서 */
      const h = cfg.folder && cfg.folder.handle(); if (!h) return false;
      let p = "denied"; try { p = await h.requestPermission({ mode: "readwrite" }); } catch (e) {}
      C.folderPerm = p; cfg.folder.onPerm && cfg.folder.onPerm(p);
      if (p === "granted") { lsSet(K.fdirty, now()); await folderFlush(); }
      paint(); return p === "granted";
      /* 크롬(PC) 122+ 는 다시 물을 때 「방문할 때마다 허용」을 고를 수 있음 → 그 뒤로는 브라우저를 다시 열어도 'granted' */
    }

    /* ── 띠(작게 · 가리지 않게) ─────────────────────────── */
    function state() {
      const on = cfg.isOn(), pend = !!dirtyAt();
      return { on, live: live(), busy: C.busy, err: C.err, pending: pend, needGesture: on && !live() && C.needGesture,
        folder: cfg.folder && cfg.folder.handle() ? (C.folderPerm || "?") : null, fpending: !!lsGet(K.fdirty, 0), lastPull: C.lastPull };
    }
    function paint() {
      const s = state(); try { cfg.paint && cfg.paint(s); } catch (e) {}
      if (cfg.band === false) return;
      let el = document.getElementById("bjsBand");
      const items = [];
      if (s.on && !s.live && (s.needGesture || s.pending)) items.push(`<span>구글 드라이브 연결이 쉬는 중${s.pending ? " · 올릴 것 있음" : ""}</span><button type="button" data-bjs-band="gd">다시 연결</button>`);
      if (s.folder && s.folder !== "granted" && s.folder !== "?") items.push(`<span>PC 폴더 「${(cfg.folder.name && cfg.folder.name()) || "저장 폴더"}」 쉬는 중</span><button type="button" data-bjs-band="dir">폴더 다시 연결</button>`);
      if (!items.length) { if (el) el.remove(); return; }
      if (!el) { el = document.createElement("div"); el.id = "bjsBand"; el.setAttribute("role", "status");
        el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:9000;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;max-width:min(560px,calc(100vw - 32px));padding:8px 12px;border-radius:10px;background:#fffdf7;border:1px solid #d9cfbd;box-shadow:0 2px 8px rgba(0,0,0,.12);font:600 13.5px/1.4 SUIT,Pretendard,sans-serif;color:#1f2125";
        document.body.appendChild(el); }
      el.innerHTML = items.map(x => `<div style="display:flex;gap:8px;align-items:center">${x}</div>`).join("");
      el.querySelectorAll("button").forEach(b => { b.style.cssText = "border:1px solid #195455;background:#195455;color:#fff;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer"; });
    }
    document.addEventListener("click", async e => {
      const b = e.target.closest && e.target.closest("[data-bjs-band]"); if (!b) return;
      if (b.dataset.bjsBand === "gd") { try { await token(true); run("band"); } catch (er) { C.err = er.message; paint(); } }
      else folderGrant();
    });

    /* ── 시작 · 이벤트 ───────────────────────────────────── */
    function start() {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   /* 휴대폰이 저장소를 비우지 않게 */
      document.addEventListener("pointerdown", onGesture, true);
      document.addEventListener("keydown", onGesture, true);
      document.addEventListener("visibilitychange", () => { if (visible()) { check("visible"); folderCheck(); } else if (dirtyAt() && live()) run("hide"); });   /* 내릴 때 남은 것 올리기 */
      W.addEventListener("focus", () => check("focus"));
      W.addEventListener("online", () => check("online"));
      W.addEventListener("pageshow", e => { if (e.persisted) check("bfcache"); });
      C.timer = setInterval(() => { if (visible() && now() - C.lastPull > 85000) check("tick"); paint(); }, 30000);   /* 약 90초마다 가볍게 확인 */
      if (cfg.isOn()) { if (restore()) setTimeout(() => run("start"), 800); else { C.needGesture = true; paint(); } }
      folderCheck();
    }
    return { start, token, invalidate, markDirty, run, check, folderGrant, folderFlush, state, live, restore, _C: C };
  }

  /* 처음 화면(처음 써요 / 전에 쓰던 자료)을 띄울지 — 저장된 흔적이 하나라도 있으면 절대 띄우지 않음 */
  function shouldWelcome(o) {
    /* o = { gdOn, dirSaved(폴더 핸들 저장됨), storeAsked, hasData, setupDone } */
    return !(o.gdOn || o.dirSaved || o.storeAsked || o.hasData || o.setupDone);
  }
  W.BJSync = { create, shouldWelcome };
})(window);

/* ───────── 앱에 붙이기(여행 노트 v2.0 예) ─────────
const SYNC = BJSync.create({
  app: "trip2", clientId: GD_CLIENT_ID, scope: GD_SCOPE,
  isOn: () => !!D.set.gdOn, email: () => D.set.gdEmail || "",
  sync: why => gdSync({ toast: false }),                         // gdSync 안의 gdToken(...) → SYNC.token(...)
  remoteStamp: async () => { const fid = await gdFolder(); const r = await (await gdApi(`files?q=${gq(`'${fid}' in parents and name='${GDJ}' and trashed=false`)}&fields=files(modifiedTime)`)).json(); return r.files && r.files[0] ? r.files[0].modifiedTime : null; },
  paint: () => gdPaint(),
  folder: { handle: () => D.dir, onPerm: p => { D.dirPerm = p; gdPaint(); }, writeAll: () => folderWrite(), name: () => D.dir && D.dir.name },
});
// gdToken(i)  → return SYNC.token(i)
// gdApi 401   → SYNC.invalidate(); throw Object.assign(new Error("401"), { status: 401 })   (다시 창을 열지 않음)
// touch()     → … SYNC.markDirty()   (gdAuto() 는 지움)
// 처음 화면    → if (BJSync.shouldWelcome({ gdOn: D.set.gdOn, dirSaved: !!(await getMeta("dir")), storeAsked: D.set.storeAsked, hasData: D.items.length })) S.sheet = "wel";
// init 끝     → SYNC.start()    · 기존 visibilitychange · 첫 누름(prompt:none) · gdPrepSilent · 30초 setInterval 동기화 부분은 지움
*/

</script>

function drawStat() {
  const days = []; for (let i = 13; i >= 0; i--) days.push(addD(todayS(), -i));
  const mins = k => Math.round(((D.log[k] || {}).ms || 0) / 60000);
  let streak = 0; for (let i = 0; ; i++) { const k = addD(todayS(), -i); if ((D.log[k] || {}).n) streak++; else if (i > 0 || !(D.log[k] || {}).n) { if (i === 0) continue; break; } if (i > 400) break; }
  const wk = days.slice(-7).reduce((s, k) => s + mins(k), 0), all = Object.values(D.log).reduce((s, l) => s + (l.n || 0), 0);
  const ok = Object.values(D.log).reduce((s, l) => s + (l.ok || 0), 0), ng = Object.values(D.log).reduce((s, l) => s + (l.ng || 0), 0);
  const mx = Math.max(10, ...days.map(mins));
  let h = `<div class="vh"><div><h2>공부 기록</h2><p>${ymdw(todayS())} 기준</p></div></div><div class="kp"><div><small>연속 공부</small><b class="num">${streak}일</b></div><div><small>최근 7일</small><b class="num">${wk}분</b></div><div><small>들은 문장(누적)</small><b class="num">${all.toLocaleString()}</b></div><div><small>시험 맞힌 비율</small><b class="num">${ok + ng ? Math.round(ok * 100 / (ok + ng)) + "%" : "–"}</b></div></div>`;
  h += `<div class="card" style="margin-bottom:14px"><div class="lab"><span>최근 14일 들은 시간(분)</span></div><div class="days">${days.map(k => `<div><i class="${mins(k) ? "" : "z"}" style="height:${Math.max(2, mins(k) * 100 / mx)}%" title="${ymdw(k)} ${mins(k)}분"></i><span class="num">${+k.slice(8)}</span></div>`).join("")}</div></div>`;
  h += `<div class="card"><div class="lab"><span>챕터별</span></div><table class="tbl"><thead><tr><th>구분</th><th>챕터</th><th>개수</th><th>시험</th><th>☆</th><th>복습</th></tr></thead><tbody>${D.chapters.map(c => { const o = c.items.reduce((s, i) => s + (i.ok || 0), 0), g = c.items.reduce((s, i) => s + (i.ng || 0), 0); return `<tr><td>${SECN[c.sec]}</td><td>${esc(c.name)}</td><td class="num">${c.items.length}</td><td class="num">${o + g ? Math.round(o * 100 / (o + g)) + "%" : "–"}</td><td class="num">${c.items.filter(i => i.star).length}</td><td>${rvLabel(c)}</td></tr>`; }).join("")}</tbody></table></div>`;
  $("#main").innerHTML = h;
}
