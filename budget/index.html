<style>
:root{
  --bg:#f7f6f2;--panel:#ffffff;--line:#e7e5dc;--line2:#d7d4c8;
  --ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
  --acc:#0a1931;--acc2:#343d5c;--accbg:#ebedf3;--cat:#4f56d8;--catbg:#eef0ff;--brand-accent:#f56d03;--brand-accent2:#c9762f;
  --exp:#c9503f;--expbg:#fbece8;--inc:#2e8a58;--incbg:#e7f4ec;
  --warn:#d98a1a;--warnbg:#fff4e0;
  --r:12px;--sh:0 8px 30px rgba(28,31,43,.10);
  --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(10,25,49,.12)}
input[type=number]{text-align:right}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--ink3);font-size:12px}
.small{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.exp{color:var(--exp)}.inc{color:var(--inc)}
.hide{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;background:#fff;border:1px solid var(--line2);font-weight:600;white-space:nowrap;transition:background .12s}
.btn:hover{background:#f1efe8}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--exp);border-color:#f2c9c6;background:#fff}
.btn.d:hover{background:var(--expbg)}
.btn.s{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.g{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.g:hover{background:#efede5}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}

/* layout */
.app{max-width:1600px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
.foot{margin-top:auto;padding:22px 0 8px;text-align:center;font-size:11.5px;color:var(--ink3)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand .lg{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.brand .ver{font-size:11px;color:var(--ink3);font-weight:500;margin-left:2px}
.tabs{display:flex;background:#efede5;border-radius:10px;padding:3px;gap:2px}
.tabs button{padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mnav{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px}
.mnav button{padding:5px 9px;border-radius:7px;font-weight:700}
.mnav button:hover{background:#f1efe8}
.mnav .ym{min-width:112px;text-align:center;font-weight:800;font-size:15px}
.actions{display:flex;gap:6px;margin-left:auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum .c{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.sum .c .t{font-size:12px;color:var(--ink3)}
.sum .c .v{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-top:2px}

/* calendar */
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .hd{display:grid;grid-template-columns:repeat(7,1fr);background:#faf9f5;border-bottom:1px solid var(--line)}
.cal .hd div{text-align:center;padding:7px 0;font-size:12px;color:var(--ink2);font-weight:700}
.cal .hd div:first-child{color:var(--exp)}.cal .hd div:last-child{color:var(--acc)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .d{min-height:var(--cellh,96px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 4px;cursor:pointer;position:relative;overflow:hidden}
.cal .d:nth-child(7n){border-right:none}
.cal .d:hover{background:#faf9f5}
.cal .d.out{background:#f9f8f4;color:var(--ink3)}
.cal .d.out .chip{opacity:.5}
.cal .d .n{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.cal .d .n .hol{font-size:10px;color:var(--exp);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.sun .n,.cal .d.hol .n{color:var(--exp)}.cal .d.sat .n{color:var(--acc)}
.cal .d.today .n b{background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center}
.cal .d .n{margin-bottom:3px}
.cal .d .tot{margin-left:auto;font-size:10.5px;font-weight:700;white-space:nowrap;display:inline-flex;gap:3px;align-items:center}
.cal .d .tot .sep{color:#cfcbbd;font-weight:400}
.chip{font-size:10.5px;padding:1px 5px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:3px;justify-content:space-between;line-height:1.5}
.chip.e{background:var(--expbg);color:#b3413a}
.chip.i{background:var(--incbg);color:#177a52}
.chip.cat{background:color-mix(in srgb,var(--cc) 16%,#fff);color:var(--ink);border-left:3px solid var(--cc);padding-left:4px}
.chip.cat .m{color:var(--cc);filter:brightness(.8)}
.chip.cat .m.inc{color:var(--inc);filter:none}
.chip.pl,.chip.cat.pl{background:#fff;border:1px dashed var(--cc,#cfcbbd);border-left:3px solid var(--cc,#cfcbbd);color:var(--ink2)}
.chip.bill{background:var(--warnbg);color:#9a6210;border:1px solid #f4dfb5}
.chip .m{font-weight:700;flex-shrink:0}
.more{font-size:10px;color:var(--ink3);padding-left:3px}
.cal .d .dots{display:none;gap:2px;flex-wrap:wrap;margin-top:2px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;display:block}
@media(max-width:640px){
  .cal .d{min-height:var(--cellh,74px);padding:3px}
  .chip,.more{display:none}
  .cal .d .dots{display:flex}
  .cal .d .n{flex-wrap:wrap}.cal .d .tot{font-size:9px;margin-left:0;width:100%;flex-direction:column;align-items:flex-start;gap:0;line-height:1.2}.cal .d .tot .sep{display:none}
  .sum{gap:5px}.sum .c{padding:8px 9px}.sum .c .t{font-size:11px}.sum .c .v{font-size:13px;white-space:nowrap}
  .app{padding:8px 8px 80px}
  .sum .c .v{font-size:15px}
  .actions{margin-left:0;width:100%}
  .actions .btn{flex:1}
  .mnav .ym{min-width:90px;font-size:14px}
}

/* list */
.lst .day{margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lst .day .dh{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#faf9f5;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.lst .day .dh .dt{color:var(--ink2)}
.tr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #efede6;cursor:pointer}
.tr:last-child{border-bottom:none}
.tr:hover{background:#faf9f5}
.tr .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .sb{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .am{font-weight:800;white-space:nowrap}
.tr.pl{opacity:.75;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f9f8f4 6px,#f9f8f4 12px)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:5px;background:#efede5;color:var(--ink2);white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{width:auto;min-width:0;padding:6px 8px;font-size:13px}
.empty{text-align:center;color:var(--ink3);padding:36px 0}

/* stats */
.stg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stg .panel h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.stg .panel h4 select{width:auto;padding:3px 6px;font-size:12px}
.stg .ch{position:relative;height:250px}
.stg .full{grid-column:1/-1}
@media(max-width:760px){.stg{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid #efede6;text-align:left}
.tbl th{font-size:11.5px;color:var(--ink3);font-weight:600;background:#faf9f5}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.sub td:first-child{padding-left:22px;color:var(--ink2)}

/* settings */
.set{display:grid;grid-template-columns:200px 1fr;gap:14px}
.set .nav{display:flex;flex-direction:column;gap:2px}
.set .nav button{text-align:left;padding:9px 12px;border-radius:9px;font-weight:600;color:var(--ink2)}
.set .nav button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.set .nav .grp{font-size:11px;color:var(--ink3);padding:10px 12px 2px}
@media(max-width:700px){.set{grid-template-columns:1fr}.set .nav{flex-direction:row;flex-wrap:wrap}.set .nav .grp{display:none}}
.sec{margin-bottom:16px}
.sec h3{font-size:16px;margin-bottom:4px}
.sec .desc{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.item .nm{font-weight:700}
.item .ops{display:flex;gap:4px;margin-left:auto}
.item.sub{margin-left:26px;padding:6px 12px;background:#fbfbfd}
.item.sub .nm{font-weight:500}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.sw .t{font-weight:700}.sw .d{font-size:12px;color:var(--ink3)}
.tog{width:40px;height:22px;border-radius:11px;background:#d7d4c8;position:relative;flex-shrink:0;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--acc)}.tog.on::after{left:20px}
.note{background:var(--accbg);border:1px solid #d9dcff;color:#3a40a8;padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
.note.w{background:var(--warnbg);border-color:#f4dfb5;color:#7f5008}
.note.e{background:var(--expbg);border-color:#f2c9c6;color:#a6352e}
.pal{display:flex;gap:5px;flex-wrap:wrap}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.pal button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,22,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:var(--sh);animation:up .18s ease}
.md.lg{max-width:760px}
.md .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;position:sticky;top:0;background:#fff;z-index:1}
.md .mh h3{font-size:16px}
.md .mb{padding:4px 18px 18px}
.md .mf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.md .mf .btn{flex:1}
.x{font-size:22px;color:var(--ink3);width:32px;height:32px;border-radius:8px}
.x:hover{background:#efede6}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.seg{display:flex;background:#efede5;border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px;border-radius:7px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.e{color:var(--exp)}.seg button.on.i{color:var(--inc)}
textarea.paste{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:150px;white-space:pre;overflow:auto}
.prev{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.prev .tbl{font-size:12px}
.prev td.bad{color:var(--exp)}
.prev td.new{color:var(--warn)}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock .bx{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 28px;width:100%;max-width:360px;box-shadow:var(--sh);text-align:center}
.lock .bx .lg{width:52px;height:52px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20241f;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:var(--sh);animation:up .2s}
.fab{display:none}
@media(max-width:640px){
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(10,25,49,.35);z-index:50}
}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
kbd{font-family:inherit;background:#efede5;border-radius:4px;padding:0 5px;font-size:11px}
.bal{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bal .b{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px}
.bal .b b{display:block;font-size:14px}

.date-field{position:relative;display:inline-flex;align-items:center;gap:5px}
.date-field .date-display{cursor:pointer;background:#fff;font-variant-numeric:tabular-nums;padding:7px 10px;font-weight:600}
.date-field .date-display.sat{color:var(--acc)}
.date-field .date-native{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;padding:0;border:0;pointer-events:none}
.date-icon-btn{cursor:pointer;font-size:15px;flex-shrink:0;line-height:1}
.dd .date-field{display:flex}.dd .date-field .date-display{flex:1;width:auto!important}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}.foot a:hover{color:var(--acc);border-color:var(--acc)}

:root{--head:"BJ-Head","Pretendard",var(--font);--brand-ink:#0a1931;--tint:#efede5;--hover:#f1efe8;
  --r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);--sh3:0 24px 60px rgba(30,28,20,.18);
  --danger:#b84a3c;--success:#2e8a58}
body{font-size:14.5px}
.app{padding:20px 20px 40px}
.muted{font-size:12.5px}

/* 헤더 */
.top{gap:12px;margin-bottom:18px}
.brand{font-family:var(--head);font-size:20px;gap:11px;letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--cat);font-size:17px;position:relative;box-shadow:var(--sh1);font-family:var(--head)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--catbg);color:var(--cat)}
.brand .ver{font-family:var(--font)}
.mnav{border-radius:12px;padding:4px;gap:2px;box-shadow:var(--sh1)}
.mnav .ar{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:9px;color:var(--ink2)}
.mnav .ym{font-family:var(--head);font-size:16px;min-width:118px;letter-spacing:-.3px}
.mnav .today{font-size:12.5px;font-weight:700;color:var(--brand-ink);background:var(--tint);border-radius:8px;padding:6px 11px;margin-left:2px}
.tabs{background:var(--tint);border-radius:12px;padding:4px;gap:3px}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;font-family:var(--head);font-size:14px;white-space:nowrap}
.tabs button svg{opacity:.7}.tabs button.on{color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}.tabs button.on svg{opacity:1}

/* 버튼 */
.btn{border-radius:var(--r-btn);padding:9px 16px;font-weight:700;gap:6px}
.btn.p{background:var(--brand-ink);border-color:var(--brand-ink);box-shadow:var(--sh1)}.btn.p:hover{background:#343d5c}.btn.p:active{background:#151a29}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}.btn.ghost:hover{background:var(--hover)}
.btn.ic{padding:9px 10px}
.btn.d{color:var(--danger);border-color:#ecc9c2}.btn.d:hover{background:#fbece8}
.btn.g{color:var(--ink2)}
.btn:disabled{background:#eceae2;color:var(--ink3);border-color:#eceae2;opacity:1;box-shadow:none}
.btn.s{padding:6px 11px;font-size:12.5px;border-radius:8px}

/* 요약 카드 */
.sum{gap:12px;margin-bottom:16px}
.sum .c{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);box-shadow:var(--sh1)}
.sum .c.hi{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.sum .c.hi .t{color:#b9bfd3}.sum .c.hi .v{color:#fff}.sum .c.hi .v.exp{color:#ffb4a6}
.sum .ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.sum .ib.inc{background:var(--incbg);color:var(--inc)}.sum .ib.exp{background:var(--expbg);color:var(--exp)}.sum .ib.bal{background:rgba(255,255,255,.12);color:#fff}
.sum .c .t{font-size:12.5px;font-weight:600}
.sum .c .v{font-family:var(--head);font-size:20px;letter-spacing:-.5px;margin-top:1px}
.pl-tag{font-size:11px;font-weight:700;color:var(--ink3);background:var(--tint);border-radius:6px;padding:1px 6px;margin-left:4px}

/* 달력 */
.cal{border-radius:var(--r);box-shadow:var(--sh1)}
.cal .hd{background:var(--paper,#faf9f5)}
.cal .hd div{padding:9px 0;font-size:12px}
.cal .hd div:last-child,.cal .d.sat .n{color:#2f6fe4}
.cal .d{padding:6px}
.cal .d:hover{background:#faf9f5}
.cal .d .n{font-size:12.5px}
.cal .d.today .n b{background:var(--brand-ink);width:22px;height:22px}
.chip{font-size:11px;border-radius:6px}

/* 리스트·필터 */
.lst .day{border-radius:var(--r);box-shadow:var(--sh1)}
.lst .day .dh{padding:10px 16px;font-size:12.5px}

/* 10-31 제이: 휴대폰 다시 점검 — 설정 칸이 화면 밖으로 밀리던 것 · 작은 글씨 */

/* 10-31 제이: 연결한 폴더 경로 */
.lkf{border:0;background:none;padding:0;font:inherit;font-size:13px;font-weight:700;color:var(--navy,#0a1931);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dpath{font:600 13px/1.5 ui-monospace,Consolas,"Malgun Gothic",monospace;background:rgba(160,140,108,.14);padding:2px 7px;border-radius:6px;overflow-wrap:anywhere}


/* 3.1: 분야 배지 = 앱 색 */
.cat{background:rgba(10,25,49,.1)!important;color:#0a1931!important}
/* BJ31-APPLIED */
/* 색(10-30 제이 지정): 초록 #0a1931 · 바탕 베이지 #F0E8DB · 주황 #F56D03 — 메인 = 짙은 초록 #0a1931(고른 것 · 기능 · 로고 배지), 이벤트 = 진한 주황 #f56d03(주 단추 · 진행 표시) */
/* ══ Blog J 디자인 3.1 「정돈」 — 3.0 위에 덮어쓰는 다듬기 (10-30) ══
   1) 깊이는 3단만: 판(바탕) · 카드(머리카락 선 + 아주 옅은 그림자) · 들어감(입력 · 고르기 바탕)
   2) 이중 그림자(어두운 + 흰 빛) 없앰 → 흐릿함 · 뭉개짐 제거
   3) 모서리 4단계: 8 · 10 · 14 · 18px
   4) 고른 것 = 남색 선(1.5px) + 남색 글자, 주 버튼 = 앰버 한 곳(평평하게) */
:root{
  --navy:#0a1931;--amber:#f56d03;--brand:#0a1931;--accent:#f56d03;
  --paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--in-bg:#ece3d5;--up-bg:#f7f2ea;--pr-bg:#f3ece1;--press-bg:#f3ece1;--tray:#e9e0d1;--hover:#f5efe5;
  --hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.2);
  --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);
  --up-s:0 0 0 1px rgba(90,74,50,.09),0 1px 2px rgba(90,74,50,.06);
  --in:inset 0 0 0 1px rgba(90,74,50,.1);
  --press:inset 0 0 0 1.5px var(--navy,#0a1931);
  --sh-paper:0 1px 3px rgba(0,0,0,.06),0 14px 34px -14px rgba(60,48,30,.28);
  --r-s:8px;--r:10px;--r-m:14px;--r-l:18px;
}
/* 버튼: 평평하게, 그림자는 선 하나 */
.btn{border-radius:var(--r);box-shadow:var(--up-s);font-weight:600;transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--hover);box-shadow:0 0 0 1px var(--navy,#0a1931)}
.btn:active{transform:none;box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.btn.sm{border-radius:var(--r-s)}
.btn.go{background:var(--amber,#f56d03);color:#fff;box-shadow:0 1px 2px rgba(140,60,10,.25),inset 0 -1px 0 rgba(0,0,0,.08);outline:0}
.btn.go:hover{background:#d95f00;box-shadow:0 1px 2px rgba(140,60,10,.25),0 0 0 3px rgba(245,109,3,.22);outline:0}
.btn.nv,.btn.p,.btn.accent{background:var(--navy,#0a1931);color:#fff;box-shadow:0 1px 2px rgba(6,15,30,.25)}
.btn.nv:hover,.btn.p:hover,.btn.accent:hover{background:#060f1f;box-shadow:0 0 0 3px rgba(10,25,49,.16)}
.ib{box-shadow:var(--up-s);border-radius:var(--r)}
.ib:hover{box-shadow:0 0 0 1px var(--navy,#0a1931)}
/* 고르기(세그먼트): 바탕은 들어감 한 장, 고른 칸은 흰 카드 + 머리카락 선 */
.vt,.seg,.tvbar{background:var(--tint);box-shadow:var(--in);border-radius:var(--r);padding:3px;gap:2px}
.vt button,.seg button,.tvbar button{border-radius:var(--r-s);font-weight:600}
.vt button.on,.seg button.on,.tvbar button.on{background:var(--card);color:var(--ink,#1f2125);font-weight:700;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
/* 칩: 테두리만, 고른 칩은 남색 선 + 남색 글자 */
.chip{background:transparent;box-shadow:inset 0 0 0 1px var(--hair2);border-radius:999px;padding:7px 13px;font-weight:600}
.chip:hover{background:var(--card);box-shadow:inset 0 0 0 1px var(--navy,#0a1931)}
.chip.on,.chip.on:hover{background:var(--card);color:var(--navy,#0a1931);box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931);font-weight:700}
/* 입력: 들어감 대신 흰 바탕 + 선 (읽기 쉬움) */
.inp,input.inp,select.inp,textarea.inp{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1);outline:0}
.srch{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1)}
/* 카드 · 줄 */
.tcard,.row,.sgc,.pg{box-shadow:var(--up-s);border-radius:var(--r-m)}
.tcard:hover,.tgt:hover,.tlist .tcard.trip:hover{box-shadow:0 0 0 1px var(--navy,#0a1931),0 6px 18px -10px rgba(10,25,49,.3)}
body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div{box-shadow:var(--up);border-radius:var(--r-l)}
.sheet .in,.sheet>div{border-radius:var(--r-l) var(--r-l) 0 0}
/* 이름표(섹션 머리): 작게 · 자간 · 흐린 먹 */
.lbl{font-size:12.5px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.sgc h4{font-size:14px;letter-spacing:-.01em}
/* 안내 상자: 상자 대신 왼쪽 선 하나 */
.note,.note.w,.stnote{background:transparent;box-shadow:none;border-radius:0;border-left:3px solid var(--hair2);padding:4px 0 4px 12px}
.note.w{border-left-color:#d98a1a}
/* 작은 표 · 뱃지 */
.okb,.dd{border-radius:6px}
/* 도구 작업대(3.0 틀): 교정대 · 작업 패널 · 눈금자 */
.tray{background:var(--tray);box-shadow:var(--in);border-radius:var(--r-l)}
.wp{box-shadow:var(--up);border-radius:var(--r-l)}
.ruler{box-shadow:var(--in);background:var(--tint)}
.tcard.on,.tcard.on:hover{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.wp-f{box-shadow:0 -1px 0 var(--hair)}
.brand .lg,.pcbar .lg{box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 -2px 0 rgba(0,0,0,.1)!important}
/* 고른 것 = 남색(10-30 제이): 고른 칸의 아이콘 · 글자 · 점은 남색, 주황은 진행 표시와 주 단추에만 */
.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on,.tabs button.on,.chip.on{color:var(--navy,#0a1931)}
.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.tabs button.on svg,.chip.on svg,.li.on svg,.tcard.on svg{color:var(--navy,#0a1931);opacity:1}
.tcard.on i{background:var(--navy,#0a1931)}
.pvth button.on,.vw2-strip button.on{box-shadow:0 0 0 3px var(--navy,#0a1931)}
.li.on{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
/* 눈금자 진행(공통 · 10-22 제이 규칙): 단계 이름은 글자만 — 박스 · 테두리 · 바탕 없음.
   올리면 번호 앰버 + 글자 밑 앰버 2px 밑줄, 지금 단계는 굵게만, 키보드 포커스만 남색 윤곽선 */
.ruler{background:transparent!important;box-shadow:none!important;border-bottom:1px solid var(--hair2);border-radius:0!important}
.ruler button,.ruler button:hover,.ruler button.cur,.ruler button.done{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important}
.ruler button:hover{color:var(--ink)}
.ruler button:hover .rn{color:var(--amber,#f56d03)}
.ruler button:not(.cur):hover{text-decoration:underline;text-decoration-color:var(--amber,#f56d03);text-decoration-thickness:2px;text-underline-offset:6px}
.ruler button:focus{outline:0}
.ruler button:focus-visible{outline:2px solid var(--navy,#0a1931);outline-offset:2px;border-radius:6px!important}
/* 로고 배지(도구 아이콘) 바탕 = 남색 — Blog J 고유 색(10-30 제이). 분야색은 배지에서 빼고 표시에만 */
.brand .lg,.pcbar .lg{background:var(--navy,#0a1931)!important;color:#fff}
.brand .lg svg,.pcbar .lg svg{color:#fff}

/* 고른 것 = 초록 바탕 + 흰 글자(10-30 제이) — 카드 · 칩 · 나눔 단추 · 보기 단추 · 날 목록 */
.tcard.on,.tcard.on:hover,.li.on,.chip.on,.chip.on:hover,.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.tcard.on *,.li.on *,.chip.on *,.vt button.on *,.seg button.on *,.tvbar button.on *,.pcnav button.on *{color:#fff!important}
.tcard.on small,.li.on small,.tcard.on .muted,.li.on .k,.chip.on small{color:rgba(255,255,255,.78)!important}
.tcard.on i{background:#fff!important}
.tcard.on svg,.chip.on svg,.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.li.on svg{color:#fff!important}
.pdays>button.on,.pdays>button.on:hover,.pside button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.pdays>button.on *,.pside button.on *{color:#fff!important}.pdays>button.on small,.pside button.on small{color:rgba(255,255,255,.78)!important}
/* 주 단추 = 앱의 메인 색(10-30 제이 안): 주황은 단추에 쓰지 않고 진행 구슬 · 로고 점 · 새 소식 같은 작은 표시에만 */
.btn.go{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.3),inset 0 -1px 0 rgba(0,0,0,.12)!important;outline:0!important}
.btn.go:hover{background:var(--navy-h,#060f1f)!important;box-shadow:0 0 0 3px rgba(10,25,49,.2)!important}
.btn.go:disabled{background:#d6cdbd!important;color:#8d8574!important;box-shadow:none!important}
:root{--navy-h:#060f1f}
/* ══ 10-30 제이: 색을 칠하는 단추는 적당한 크기로만, 큰 카드 · 큰 단추는 3.0의 돋움(음영) · 들어감(음각)으로 ══ */
:root{
  --up3:9px 10px 22px rgba(160,140,108,.38),-7px -7px 18px rgba(255,255,255,.85);
  --up3s:3px 4px 9px rgba(160,140,108,.34),-3px -3px 8px rgba(255,255,255,.88);
  --in3:inset 3px 3px 8px rgba(160,140,108,.34),inset -3px -3px 8px rgba(255,255,255,.8);
  --press3:inset 3px 3px 7px rgba(150,128,95,.42),inset -2px -2px 5px rgba(255,255,255,.72);
}
/* 큰 판 · 패널 = 돋움 */
.wp,body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div,.pdays,.sgc{box-shadow:var(--up3)!important}
/* 큰 고르기 카드 · 날 목록 · 목록 카드 = 작은 돋움, 고르면 눌림(음각) + 앱 색 테두리 · 글자 · 점 (바탕을 칠하지 않음) */
.tcard,.pdays>button[data-day],.row,.pg{box-shadow:var(--up3s)!important}
.pdays>button.tname{box-shadow:none!important;background:transparent!important}
.tcard:hover,.pdays>button[data-day]:hover,.tlist .tcard.trip:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.tcard.on,.tcard.on:hover,.pdays>button.on,.pdays>button.on:hover,.pside button.on,.li.on{background:var(--press-bg,#f3ece1)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--press3),inset 0 0 0 2px var(--navy,#0a1931)!important}
.tcard.on *,.pdays>button.on *,.pside button.on *,.li.on *{color:var(--navy,#0a1931)!important}
.tcard.on small,.pdays>button.on small,.pside button.on small,.li.on small{color:var(--ink2,#5b5547)!important}
.tcard.on i{background:var(--navy,#0a1931)!important}
.tcard.on svg,.li.on svg{color:var(--navy,#0a1931)!important}
/* 교정대 · 나눔 단추 홈 = 들어감(음각) */
.tray{box-shadow:var(--in3)!important}
.vt,.seg,.tvbar{box-shadow:var(--in3)!important;background:var(--tint)!important}
/* 색 단추는 적당한 크기 — 주 단추 높이 44, 좌우 여유만 */
.btn.go{min-height:44px!important;padding:10px 20px!important;font-size:15px!important;flex:0 0 auto}
/* 폭이 넓은 큰 단추(가로 꽉 찬 단추)는 칠하지 않고 돋움 + 앱 색 글자 */
.btn.go.w,.btn.w.nv{background:var(--card,#fcf9f4)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--up3s)!important;min-height:52px!important;font-weight:700}
.btn.go.w svg,.btn.w.nv svg{color:var(--navy,#0a1931)!important}
.btn.go.w:hover,.btn.w.nv:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.btn.go.w:active,.btn.w.nv:active{box-shadow:var(--press3)!important}
/* 눈금자 구슬: 지금 위치를 알려 주듯 살짝 반짝임(10-30 제이) — 퍼지는 고리 + 은은한 빛, 움직임 줄이기 설정이면 멈춤 */
.ruler .bead,.ruler-dot,.ruler .rdot{animation:bjBeadGlow 2.6s ease-in-out infinite}

<script>/* ══ 공통: 폴더의 정확한 전체 경로 (2026-10-31 제이 — 「글자가 작더라도 정확한 경로가 보여야 해」) ══
   웹 앱은 보안상 폴더의 전체 경로(C:\Users\…)를 알 수 없음 → 사용자가 탐색기 주소창을 한 번 복사해 붙여넣으면 그대로 기억해서 보여 줌.
   마지막 폴더 이름이 실제로 연결한 폴더와 같은지 확인.
   FPATH.ask({ name:"여행노트", cur:"지금 값", what:"저장 폴더" }) → Promise<"C:\…" | "" (지움) | null (취소)>
   FPATH.show(full, known) → 보여 줄 글자 (full 있으면 그대로, 없으면 "…\" + known) */
(function () {
  "use strict";
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MAC = /Macintosh|Mac OS X/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1);
  function clean(v) { v = String(v || "").trim().replace(/^["'“”]+|["'“”]+$/g, "").trim(); if (v.length > 3) v = v.replace(/[\\/]+$/, ""); return v; }
  function last(v) { const a = v.split(/[\\/]/).filter(Boolean); return a.length ? a[a.length - 1] : ""; }
  function show(full, known) { if (full) return full; if (!known) return ""; return "…\\" + String(known).split(" › ").join("\\"); }
  function ask(o) {
    o = o || {};
    return new Promise(res => {
      const ov = document.createElement("div"); ov.className = "fpx-ov";
      ov.innerHTML = `<div class="fpx" role="dialog" aria-modal="true"><div class="fpx-h"><b>${E(o.what || "폴더")}의 정확한 경로</b><button class="fpx-c" data-x aria-label="닫기">×</button></div>
<p class="fpx-p">웹 앱은 보안상 PC의 전체 경로를 알 수 없어요. 아래처럼 <b>한 번만</b> 복사해 붙여넣으면 그다음부터 정확한 경로가 늘 보여요.</p>
<ol class="fpx-s">${MAC ? `<li>Finder에서 「${E(o.name)}」 폴더를 찾아 <b>오른쪽 클릭</b></li><li><b>Option</b> 키를 누른 채 「<b>경로 이름 복사</b>」</li>` : `<li>파일 탐색기에서 「${E(o.name)}」 폴더를 <b>열기</b></li><li>위쪽 <b>주소창</b>을 한 번 누르면 경로가 파랗게 → <b>Ctrl + C</b></li>`}<li>아래 칸에 <b>Ctrl + V</b></li></ol>
<input class="fpx-i" spellcheck="false" autocomplete="off" placeholder="${MAC ? "/Users/이름/Pictures/" : "C:\\Users\\이름\\Pictures\\"}${E(o.name)}" value="${E(o.cur || "")}">
<p class="fpx-e" hidden></p>
<div class="fpx-r">${o.cur ? `<button class="fpx-b" data-clr>지우기</button>` : ""}<span style="flex:1"></span><button class="fpx-b" data-x>취소</button><button class="fpx-b go" data-ok>저장</button></div></div>`;
      document.body.appendChild(ov);
      const inp = ov.querySelector(".fpx-i"), er = ov.querySelector(".fpx-e");
      const done = v => { ov.remove(); res(v); };
      ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-x]")) done(null); else if (e.target.closest("[data-clr]")) done(""); else if (e.target.closest("[data-ok]")) ok(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); if (e.key === "Escape") done(null); });
      inp.addEventListener("input", () => { er.hidden = true; });
      function ok() {
        const v = clean(inp.value);
        if (!v) { er.textContent = "경로를 붙여넣어 주세요."; er.hidden = false; return; }
        if (!/^([A-Za-z]:[\\/]|\\\\|\/)/.test(v)) { er.textContent = "「C:\\…」처럼 드라이브부터 시작하는 전체 경로를 붙여넣어 주세요."; er.hidden = false; return; }
        if (o.name && last(v).toLowerCase() !== String(o.name).toLowerCase()) { er.innerHTML = `마지막 폴더 이름이 연결한 폴더 「<b>${E(o.name)}</b>」와 달라요. 그 폴더를 열고 주소창을 복사해 주세요.`; er.hidden = false; return; }
        done(v);
      }
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  }
  if (!window.__fpxCss) {
    window.__fpxCss = 1;
    const st = document.createElement("style");
    st.textContent = `
.fpx-ov{position:fixed;inset:0;z-index:10050;background:rgba(31,33,37,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.fpx{width:min(480px,100%);background:#f1ebe1;border-radius:14px;box-shadow:0 18px 40px rgba(31,33,37,.3);padding:16px 18px 16px;color:#1f2125;font-size:14px;line-height:1.55}
.fpx-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.fpx-h b{font-size:16px;font-weight:800}
.fpx-c{width:32px;height:32px;border:0;border-radius:9px;background:transparent;font-size:22px;line-height:1;color:#5b5547;cursor:pointer}.fpx-c:hover{background:#e7e0d2}
.fpx-p{margin:0 0 6px;font-size:13px;color:#5b5547}
.fpx-s{margin:0 0 10px;padding-left:20px;font-size:13.5px}
.fpx-i{width:100%;box-sizing:border-box;height:42px;padding:0 11px;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(32,38,58,.3);font:13.5px/1 ui-monospace,Consolas,"D2Coding",monospace;color:#1f2125}
.fpx-i:focus{outline:0;box-shadow:inset 0 0 0 2px #20263a}
.fpx-e{margin:7px 0 0;font-size:13px;color:#c23a2b}
.fpx-r{display:flex;gap:8px;margin-top:12px;align-items:center}
.fpx-b{font:inherit;font-size:13.5px;font-weight:700;height:38px;padding:0 14px;border:0;border-radius:10px;background:#f4efe6;color:#20263a;box-shadow:inset 0 0 0 1.5px rgba(32,38,58,.3);cursor:pointer}
.fpx-b:hover{box-shadow:inset 0 0 0 2px #20263a}.fpx-b.go{background:#20263a;color:#fff;box-shadow:none}`;
    (document.head || document.documentElement).appendChild(st);
  }
  window.FPATH = { ask, show, clean };
})();
/* ══ 공통: 백업 (2026-10-31 제이) ══
   ① 주기 알림 — 마지막 백업 뒤 정한 날짜(기본 7일)가 지나면 화면 아래 작은 카드 「지금 백업 · 3일 뒤에」
   ② 백업 폴더 기억 — PC · 안드로이드 크롬은 백업 폴더를 한 번 정하면(데이터 폴더가 있으면 그 안 「백업」 자동) 다음부터 누르면 바로 그 폴더에 저장, 최근 10개만 남김
   ③ 되살리기 — 기억한 폴더의 백업을 최신순으로 보여 주고 하나 누르면 끝. 기억이 없으면(브라우저 데이터를 지운 뒤) 「백업 폴더 고르기」 → 그 폴더에서 최신 백업을 찾아 줌
   아이폰 · 폴더를 못 쓰는 브라우저 = 공유 창(파일에 저장) · 다운로드 + 파일 고르기
   쓰는 법: BKUP.setup({ app, name, prefix, ext, mime, make, restore, count, dataDir, done })
            BKUP.run() 백업 · BKUP.restore() 되살리기 · BKUP.settings() 백업 설정 · BKUP.info() 상태 */
(function () {
  "use strict";
  const CAN = typeof window.showDirectoryPicker === "function";
  const AND = /Android/i.test(navigator.userAgent);
  const MOB = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const p2 = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  const ymdw = d => `${ymd(d)}(${WD[d.getDay()]})`;
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB";
  let O = null, st = { last: 0, every: 7, later: 0, first: 0 }, dir = null, dpath = "", dfull = "", indata = false, ready = null;
  /* 10-31 제이: 백업 폴더 경로 표시 — 브라우저는 앞부분(C:\\Users\\…)을 알려 주지 않아 고른 폴더부터 */
  /* 정확한 전체 경로: 사용자가 붙여넣은 값(dfull) → 데이터 폴더 안 「백업」이면 데이터 폴더 전체 경로 + \백업 → 없으면 고른 폴더부터 */
  const dataFull = () => { try { return (O && O.dataFull && O.dataFull()) || ""; } catch (e) { return ""; } };
  const fullP = () => dfull || (indata && dataFull() ? dataFull().replace(/[\\/]+$/, "") + (dataFull().includes("/") && !dataFull().includes("\\") ? "/백업" : "\\백업") : "");
  const ptext = () => dir ? (fullP() || "…\\" + (dpath || dir.name).split(" › ").join("\\")) : "";

  /* 저장: 이 앱 전용 IndexedDB (폴더 손잡이는 IndexedDB에만 넣을 수 있음) */
  function idb() { return new Promise((res, rej) => { const r = indexedDB.open("bj-backup", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function kget(k) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(O.app + ":" + k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } }
  async function kset(k, v) { try { const db = await idb(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, O.app + ":" + k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
  async function kdel(k) { try { const db = await idb(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").delete(O.app + ":" + k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
  const saveSt = () => kset("st", st);

  function toast(m) { if (typeof O.toast === "function") return O.toast(m); let t = document.querySelector(".bkx-toast"); if (!t) { t = document.createElement("div"); t.className = "bkx-toast"; document.body.appendChild(t); } t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2800); }
  async function perm(h, ask) { if (!h) return false; try { const o = { mode: "readwrite" }; if (await h.queryPermission(o) === "granted") return true; return ask ? (await h.requestPermission(o)) === "granted" : false; } catch (e) { return false; } }
  const isBk = n => n.startsWith(O.prefix) && n.toLowerCase().endsWith("." + O.ext);
  async function listIn(h) { const L = []; try { for await (const [n, e] of h.entries()) if (e.kind === "file" && isBk(n)) { const f = await e.getFile(); L.push({ name: n, size: f.size, time: f.lastModified, h: e }); } } catch (e) {} return L.sort((a, b) => b.name.localeCompare(a.name) || b.time - a.time); }
  const bkFolderName = () => O.name.replace(/\s/g, "") + "_백업";

  /* 백업 폴더 정하기: 데이터 폴더가 있으면 그 안 「백업」, 아니면 고르는 창(사진 폴더에서 시작 → 안에 「앱이름_백업」을 만듦) */
  async function autoDir() {
    if (dir || !CAN || typeof O.dataDir !== "function") return dir;
    try { const d = await O.dataDir(); if (d && await perm(d, false)) { dir = await d.getDirectoryHandle("백업", { create: true }); await kset("dir", dir); let dp = ""; try { dp = (O.dataPath && O.dataPath()) || d.name; } catch (e) { dp = d.name; } dpath = dp + " › 백업"; await kset("dpath", dpath); indata = true; await kset("indata", true); dfull = ""; await kdel("dfull"); } } catch (e) {}
    return dir;
  }
  async function pickDir(forRestore) {
    let h; try { h = await window.showDirectoryPicker({ mode: "readwrite", id: "bjbk-" + O.app, startIn: AND ? undefined : "pictures" }); }
    catch (e) { if (e.name !== "AbortError") toast("폴더를 열지 못했어요: " + e.message); return null; }
    let t = h;
    try {
      if (!(await listIn(h)).length) {
        let sub = null; for (const n of [bkFolderName(), "백업"]) { try { sub = await h.getDirectoryHandle(n); if ((await listIn(sub)).length) break; sub = null; } catch (e) { sub = null; } }
        if (sub) t = sub; else if (!forRestore && !/백업/.test(h.name)) t = await h.getDirectoryHandle(bkFolderName(), { create: true });
      }
    } catch (e) {}
    dir = t; await kset("dir", t); dpath = t === h ? h.name : h.name + " › " + t.name; await kset("dpath", dpath); indata = false; await kdel("indata"); dfull = ""; await kdel("dfull"); return t;
  }

  async function writeTo(h, name, blob) {
    const fh = await h.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(blob); await w.close();
    const L = await listIn(h), keep = O.keep || 10;
    for (const x of L.slice(keep)) { try { await h.removeEntry(x.name); } catch (e) {} }
  }
  function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }

  async function run(opt) {
    opt = opt || {}; await ready;
    const useDir = CAN && !opt.file;
    /* 폴더 허용은 누른 직후에 물어야 함(백업 만드는 동안 기다리면 브라우저가 막음) → 폴더부터 */
    if (useDir) { await autoDir(); if (!dir || !(await perm(dir, true))) { if (!(await pickDir(false))) return false; } }
    let blob; try { blob = await O.make(); } catch (e) { toast("백업을 만들지 못했어요: " + (e && e.message || e)); return false; }
    if (!blob) return false;
    const n = new Date(), name = `${O.prefix}${ymd(n)}_${p2(n.getHours())}${p2(n.getMinutes())}.${O.ext}`;
    let where = "";
    if (useDir) {
      try { await writeTo(dir, name, blob); where = ptext(); }
      catch (e) { toast("폴더에 쓰지 못했어요 — 파일로 받을게요."); download(blob, name); where = "다운로드 폴더"; }
    } else {
      const file = new File([blob], name, { type: O.mime || "application/octet-stream" });
      if (MOB && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); where = "공유한 곳"; } catch (e) { if (e && e.name === "AbortError") return false; download(blob, name); where = "다운로드 폴더"; } }
      else { download(blob, name); where = "다운로드 폴더"; }
    }
    st.last = Date.now(); st.later = 0; await saveSt(); hideRemind();
    try { O.done && O.done(st.last); } catch (e) {}
    toast(`백업했어요 (${mb(blob.size)}) — ${where}`);
    return true;
  }

  /* ── 창 ── */
  function modal(html, bind) {
    closeModal(); const o = document.createElement("div"); o.className = "bkx-ov"; o.innerHTML = `<div class="bkx-m" role="dialog" aria-modal="true">${html}</div>`;
    o.addEventListener("click", e => { if (e.target === o || e.target.closest("[data-bkx-x]")) closeModal(); });
    document.body.appendChild(o); bind && bind(o); return o;
  }
  function closeModal() { const o = document.querySelector(".bkx-ov"); if (o) o.remove(); }
  function pickFile() { const i = document.createElement("input"); i.type = "file"; i.accept = "." + O.ext + (O.accept ? "," + O.accept : ""); i.onchange = async () => { const f = i.files[0]; if (f) { closeModal(); await O.restore(f); } }; i.click(); }

  async function restore() {
    await ready; if (!CAN) return pickFile();
    await autoDir();
    const has = dir && await perm(dir, false);
    const head = `<div class="bkx-h"><b>백업에서 되살리기</b><button class="bkx-c" data-bkx-x aria-label="닫기">×</button></div>`;
    if (!dir) return modal(`${head}<p class="bkx-p">백업을 넣어 둔 폴더를 고르면 <b>그 폴더에서 가장 최근 백업</b>을 찾아 보여 드려요. (${E(bkFolderName())} 폴더나 그 위 폴더를 골라도 돼요)</p>
      <div class="bkx-r"><button class="bkx-b go" data-bkx-pick>백업 폴더 고르기</button><button class="bkx-b" data-bkx-file>파일 직접 고르기</button></div>`, o => {
        o.querySelector("[data-bkx-pick]").onclick = async () => { if (await pickDir(true)) restore(); };
        o.querySelector("[data-bkx-file]").onclick = pickFile; });
    if (!has) return modal(`${head}<p class="bkx-p">기억해 둔 백업 폴더 <b class="bkx-path">${E(ptext())}</b>를 열려면 허용이 한 번 필요해요.</p>

function isOff(y,m,d){ const w=new Date(y,m,d).getDay(); return w===0||w===6||!!holidayOf(y,m,d); }

function p2(n){ return String(n).padStart(2,"0"); }

function parseDate(s, defYear){
  if(!s) return null; s=String(s).trim();
  let m;
  if((m=s.match(/^(\d{4})[.\-\/년]\s?(\d{1,2})[.\-\/월]\s?(\d{1,2})/))) return ymd(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/))) return ymd(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/))) return ymd(2000+ +m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[.\-\/월]\s?(\d{1,2})일?$/))) return ymd(defYear||new Date().getFullYear(),+m[1]-1,+m[2]);
  const d=new Date(s); if(!isNaN(d)) return ymd(d.getFullYear(),d.getMonth(),d.getDate());
  return null;
}

/* ── 암호화 (Web Crypto, AES-GCM + PBKDF2) ── */
/* 바이너리 ↔ 16진수 문자열 (난독화로 오인되는 base64 함수 대신 사용) */
const b64 = { enc:b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join(""), dec:s=>new Uint8Array(s.match(/.{2}/g).map(x=>parseInt(x,16))) };
async function deriveKey(pw, saltB64){
  const salt = saltB64 ? b64.dec(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
  return { key, salt: b64.enc(salt) };
}
async function encryptStr(key, str){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, new TextEncoder().encode(str));
  return { enc:true, iv:b64.enc(iv), data:b64.enc(ct) };
}
async function decryptStr(key, obj){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(obj.iv)}, key, b64.dec(obj.data));
  return new TextDecoder().decode(pt);
}

const Store = {
  key:null, salt:null, // 세션 암호키 (암호 잠금 사용 시)
  dirHandle:null,
  async pack(obj){ const s=JSON.stringify(obj); if(!this.key) return s; const e=await encryptStr(this.key,s); e.salt=this.salt; return JSON.stringify(e); },
  async unpack(str){ if(!str) return null; const o=JSON.parse(str); if(o&&o.enc){ if(!this.key) throw new Error("locked"); return JSON.parse(await decryptStr(this.key,o)); } return o; },
  rawSettings(){ const s=localStorage.getItem(LS.settings); return s?JSON.parse(s):null; },
  async loadSettings(){ return await this.unpack(localStorage.getItem(LS.settings)); },
  async loadYear(y){ return (await this.unpack(localStorage.getItem(LS.year(y))))||[]; },
  years(){ const r=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); const m=k&&k.match(/^hb1:tx:(\d{4})$/); if(m) r.push(+m[1]); } return r.sort(); },
  async saveSettings(s){ const p=await this.pack(s); localStorage.setItem(LS.settings,p); this.writeFile("settings.json",p); },
  async saveYear(y,list){ const p=await this.pack(list); localStorage.setItem(LS.year(y),p); this.writeFile(`가계부_${y}.json`,p); },
  async writeFile(name, content){
    GS.touch(name); if(!this.dirHandle) return;
    try{ const fh=await this.dirHandle.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(content); await w.close(); }
    catch(e){ console.warn("folder write failed",e); }
  },
  async readFile(name){ try{ const fh=await this.dirHandle.getFileHandle(name); const f=await fh.getFile(); return await f.text(); }catch(e){ return null; } },
  async listFolder(){ const out=[]; if(!this.dirHandle) return out; for await(const [n,h] of this.dirHandle.entries()) if(h.kind==="file") out.push(n); return out; },
  clearAll(){ Object.keys(localStorage).filter(k=>k.startsWith("hb1:")).forEach(k=>localStorage.removeItem(k)); },

function catOf(settings,type,catId){ return (settings.categories[type]||[]).find(c=>c.id===catId); }
function subName(settings,type,catId,subId){ const c=catOf(settings,type,catId); const s=c&&c.subs.find(x=>x.id===subId); return s?s.name:""; }

function methodLabel(settings,tx){
  if(tx.method==="cash") return "현금";
  if(tx.method==="card"){ const c=settings.cards.find(x=>x.id===tx.methodId); return c?c.name:"카드"; }

  return "";
}
/* 고정비를 특정 월의 '예정 항목'으로 전개 */
function plannedForMonth(settings,y,m,actual){
  const cur=ym_(y,m); const out=[];
  for(const f of settings.fixed){
    if(f.startYM && cur<f.startYM) continue;
    if(f.endYM && cur>f.endYM) continue;
    if(actual.some(t=>t.fixedId===f.id)) continue;
    const d=Math.min(f.day||1,dim_(y,m));
    out.push({ id:"pl_"+f.id+"_"+cur, planned:true, fixedId:f.id, date:ymd(y,m,d), type:f.type, name:f.name, amount:f.amount, catId:f.catId, subId:f.subId, method:f.method, methodId:f.methodId, memo:"고정비 예정" });
  }
  return out;
}
/* 카드 청구: (전월 periodFrom ~ 당월 periodTo) 사용분 → 당월 billingDay 출금 */
function cardBillingFor(card,y,m,getEntries){
  if(!card.billingDay||!card.periodFrom||!card.periodTo) return null;
  const pf=card.periodFrom, pt=card.periodTo;
  const py=m===0?y-1:y, pm=m===0?11:m-1;
  const prev=getEntries(py,pm), cur=getEntries(y,m);
  let list=[];
  if(pf>pt){
    list=[...prev.filter(t=>t.type==="expense"&&t.method==="card"&&t.methodId===card.id&&+t.date.slice(8)>=pf),
          ...cur.filter(t=>t.type==="expense"&&t.method==="card"&&t.methodId===card.id&&+t.date.slice(8)<=pt)];
  }else{
    list=cur.filter(t=>t.type==="expense"&&t.method==="card"&&t.methodId===card.id&&+t.date.slice(8)>=pf&&+t.date.slice(8)<=pt);
  }
  const total=list.reduce((s,t)=>s+t.amount,0);
  const day=nextBizDay(y,m,card.billingDay);
  return { card, total, count:list.length, date:ymd(y,m,day), items:list };
}

  return html`<div class="ov" onClick=${e=>e.target===e.currentTarget&&tryClose()}>
    <div class="md ${lg?"lg":""}">
      <div class="mh"><h3>${title}</h3><button class="x" onClick=${tryClose}>×</button></div>
      <div class="mb">${children}</div>
      ${footer&&html`<div class="mf">${footer}</div>`}
    </div></div>`;
}

function MethodSelect({settings,method,methodId,onChange}){

function dowOf(d){ if(!d||d.length<10) return ""; const t=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)); return isNaN(t)?"":"일월화수목금토"[t.getDay()]; }
/* 날짜 위젯: 보이는 텍스트칸("2026-09-20(일)") + 숨은 실제 date 입력 + 달력 아이콘. 클릭하면 선택창이 열립니다 */
function DateInput({value,onInput,style,width}){
  const ref=useRef(); const w=dowOf(value);
  const open=()=>{ const n=ref.current; if(!n) return; try{ n.showPicker?n.showPicker():n.focus(); }catch(e){ n.focus(); } };
  return html`<span class="date-field" style=${style}>
    <input type="text" class="date-display ${w==="일"?"exp":w==="토"?"sat":""}" readonly value=${value?`${value}(${w})`:""} placeholder="년-월-일" style=${{width:(width||132)+"px"}} onClick=${open} />
    <input type="date" class="date-native" ref=${ref} value=${value} onInput=${onInput} tabindex="-1" />
    <span class="date-icon-btn" title="날짜 선택" onClick=${open}><${Icon} name="calendar" size=${18} /></span>
  </span>`;
}

function TxModal({db,init,onClose}){
  const s=db.settings;
  const [f,setF]=useState(()=>{
    const base={ id:"", date:todayStr(), type:"expense", name:"", amount:"", catId:"", subId:"", method:"cash", methodId:"", memo:"" };
    const t={...base,...(init||{})}; if(t.planned){ t.id=""; delete t.planned; t.memo=""; }
    if(!t.catId){ const c=s.categories[t.type][0]; if(c){ t.catId=c.id; t.subId=c.subs[0]?c.subs[0].id:""; } }
    return t;
  });
  const up=(k,v)=>setF(p=>({...p,[k]:v}));
  const setType=t=>{ const c=s.categories[t][0]; setF(p=>({...p,type:t,catId:c?c.id:"",subId:c&&c.subs[0]?c.subs[0].id:""})); };
  const save=(again)=>{
    const amt=parseAmount(f.amount);
    if(!f.date||!parseDate(f.date)) return toast("날짜를 확인해 주세요");
    if(!f.name.trim()) return toast("항목명을 입력해 주세요");
    if(!(amt>0)) return toast("금액을 입력해 주세요");
    db.upsertTx({...f,id:f.id||uid(),date:parseDate(f.date),name:f.name.trim(),amount:amt});
    toast(f.id?"수정했습니다":"저장했습니다");
    if(again) setF(p=>({...p,id:"",name:"",amount:"",memo:""})); else onClose();
  };
  const del=()=>{ if(confirm("이 내역을 삭제할까요?")){ db.delTx(f.id,f.date); onClose(); } };
  const isExp=f.type==="expense";
  return html`<${Modal} title=${f.id?"내역 수정":"내역 입력"} onClose=${onClose} guard=${true}
    footer=${html`${f.id?html`<button class="btn d" onClick=${del}>삭제</button>`:html`<button class="btn" onClick=${()=>save(true)}>저장 후 계속</button>`}<button class="btn p" onClick=${()=>save(false)}>저장</button>`}>
    <div class="seg" style="margin-top:6px">
      <button class=${isExp?"on e":""} onClick=${()=>setType("expense")}>지출</button>
      <button class=${!isExp?"on i":""} onClick=${()=>setType("income")}>수입</button>
    </div>
    <div class="dd">
      <div><label class="f">날짜</label><${DateInput} value=${f.date} onInput=${e=>up("date",e.target.value)} /></div>
      <div><label class="f">금액</label><input type="text" inputmode="numeric" data-money placeholder="0" value=${f.amount} onInput=${e=>up("amount",e.target.value)} onBlur=${e=>{const n=parseAmount(e.target.value); if(!isNaN(n)) up("amount",n.toLocaleString());}} style="text-align:right;font-weight:700" /></div>
    </div>
    <label class="f">항목명</label><input placeholder=${isExp?"예: 점심 식사":"예: 9월 급여"} value=${f.name} onInput=${e=>up("name",e.target.value)} autofocus />
    <label class="f">분류</label><${CatSelect} settings=${s} type=${f.type} catId=${f.catId} subId=${f.subId} onChange=${(c,sub)=>setF(p=>({...p,catId:c,subId:sub}))} />
    <label class="f">${isExp?"결제수단":"입금 계좌"}</label>
    ${isExp?html`<${MethodSelect} settings=${s} method=${f.method} methodId=${f.methodId} onChange=${(m,id)=>setF(p=>({...p,method:m,methodId:id}))} />`
      :html`<select value=${f.method==="account"?f.methodId:""} onChange=${e=>setF(p=>({...p,method:e.target.value?"account":"cash",methodId:e.target.value}))}><option value="">현금 / 계좌 미지정</option>${s.accounts.map(a=>html`<option value=${a.id}>${a.name}</option>`)}</select>`}
    <label class="f">메모 (선택)</label><input value=${f.memo} onInput=${e=>up("memo",e.target.value)} />
  <//>`;
}

function parseBulk(text,settings){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(!lines.length) return {rows:[],err:"내용이 없습니다"};
  const sep=lines[0].includes("\t")?"\t":(lines[0].includes(",")?",":null);
  if(!sep) return {rows:[],err:"탭 또는 쉼표로 구분된 표를 붙여넣어 주세요 (엑셀에서 복사)"};

  let map={date:0,type:1,cat:2,sub:3,name:4,amount:5,method:6,memo:7};
  const hd=rows[0].map(x=>x.replace(/\s/g,""));
  if(hd.some(x=>/날짜|일자|date/i.test(x))){
    const find=(re,def)=>{ const i=hd.findIndex(x=>re.test(x)); return i<0?def:i; };
    map={date:find(/날짜|일자|date/i,-1),type:find(/^구분|유형|수입\/지출|type/i,-1),cat:find(/대분류|카테고리|분류$|category/i,-1),sub:find(/소분류|하위|sub/i,-1),name:find(/항목|내용|내역|적요|name|item/i,-1),amount:find(/금액|amount|price/i,-1),method:find(/결제|수단|카드|method/i,-1),memo:find(/메모|비고|memo|note/i,-1)};
    rows=rows.slice(1);
  }
  const g=(r,k)=>map[k]>=0?(r[map[k]]||""):"";
  const norm=s=>String(s||"").replace(/\s/g,"").toLowerCase();
  const out=rows.map((r,i)=>{
    const o={line:i+1,raw:r,ok:true,msgs:[],newCat:false,newSub:false};
    o.date=parseDate(g(r,"date")); if(!o.date){o.ok=false;o.msgs.push("날짜 오류");}
    let amt=parseAmount(g(r,"amount")); if(isNaN(amt)||amt===0){o.ok=false;o.msgs.push("금액 오류");}
    const ts=g(r,"type"); o.type=/수입|소득|income|입금/i.test(ts)?"income":(/지출|expense|출금/i.test(ts)?"expense":(amt<0?"expense":"expense"));
    if(!ts&&amt>0&&/급여|월급|상여|이자|배당|환급/.test(g(r,"name"))) o.type="income";
    o.amount=Math.abs(amt);
    o.name=g(r,"name")||g(r,"sub")||g(r,"cat")||"(항목없음)";
    o.memo=g(r,"memo");
    // 분류
    const cats=settings.categories[o.type]; const cn=g(r,"cat"), sn=g(r,"sub");
    let cat=cats.find(c=>norm(c.name)===norm(cn))||(!cn&&cats.find(c=>c.subs.some(s=>norm(s.name)===norm(sn))));
    if(!cat&&cn){ o.newCat=true; o.catName=cn; }
    else if(!cat){ cat=cats.find(c=>/기타/.test(c.name))||cats[cats.length-1]; }
    o.catId=cat?cat.id:""; o.catName=o.catName||(cat?cat.name:"");
    if(cat){ const sub=cat.subs.find(s=>norm(s.name)===norm(sn)); if(sub) o.subId=sub.id; else if(sn){ o.newSub=true; o.subName=sn; } else { o.subId=cat.subs[0]?cat.subs[0].id:""; } }
    else if(sn){ o.newSub=true; o.subName=sn; }
    o.subName=o.subName||(cat&&o.subId?cat.subs.find(s=>s.id===o.subId).name:"");
    // 결제수단
    const mn=g(r,"method"); o.method="cash"; o.methodId="";
    if(mn&&!/현금|cash/i.test(mn)){
      const c=settings.cards.find(c=>norm(c.name)===norm(mn)||(c.last4&&mn.includes(c.last4))||norm(mn).includes(norm(c.name)));
      const a=settings.accounts.find(a=>norm(a.name)===norm(mn)||(a.last4&&mn.includes(a.last4))||norm(mn).includes(norm(a.name)));
      if(c){o.method="card";o.methodId=c.id;} else if(a){o.method="account";o.methodId=a.id;} else o.msgs.push(`'${mn}' 미등록→현금`);
    }
    o.methodLabel=methodLabel(settings,o);
    return o;
  });
  return {rows:out,err:null};
}

function StatsView({db,y,m,getEntries}){
  const s=db.settings;
  const [scope,setScope]=useState("month"); const [type,setType]=useState("expense"); const [mainCat,setMainCat]=useState("");
  const months=useMemo(()=>Array.from({length:12},(_,i)=>getEntries(y,i).filter(t=>!t.planned)),[y,db.txByYear,s]);
  const period=scope==="month"?months[m]:months.flat();
  const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);
  const cats=s.categories[type]; const sel=period.filter(t=>t.type===type);
  const byCat=cats.map(c=>({c,v:sel.filter(t=>t.catId===c.id).reduce((a,t)=>a+t.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const catForSub=cats.find(c=>c.id===mainCat)||byCat[0]?.c;
  const bySub=catForSub?catForSub.subs.map(sb=>({n:sb.name,v:sel.filter(t=>t.catId===catForSub.id&&t.subId===sb.id).reduce((a,t)=>a+t.amount,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v):[];
  const byName={}; sel.forEach(t=>byName[t.name]=(byName[t.name]||0)+t.amount); const topName=Object.entries(byName).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const byMethod={"현금":0}; s.cards.forEach(c=>byMethod[c.name]=0); s.accounts.forEach(a=>byMethod[a.name]=0);
  period.filter(t=>t.type==="expense").forEach(t=>{ const k=methodLabel(s,t); byMethod[k]=(byMethod[k]||0)+t.amount; });
  const methodE=Object.entries(byMethod).filter(x=>x[1]>0);
  // 일자별 (월) / 월별 (연) 추이
  const dim=dim_(y,m); const daily=Array.from({length:dim},(_,i)=>{ const d=ymd(y,m,i+1); return months[m].filter(t=>t.type===type&&t.date===d).reduce((a,t)=>a+t.amount,0); });
  const cum=daily.reduce((acc,v,i)=>{ acc.push((acc[i-1]||0)+v); return acc; },[]);
  const monthly={e:months.map(l=>sum(l,"expense")),i:months.map(l=>sum(l,"income"))};
  const colorOf=c=>c.color;
  const totE=sum(period,"expense"), totI=sum(period,"income");
  const scopeLabel=scope==="month"?`${y}년 ${m+1}월`:`${y}년`;
  const seg=html`<div class="seg" style="width:180px"><button class=${scope==="month"?"on":""} onClick=${()=>setScope("month")}>월</button><button class=${scope==="year"?"on":""} onClick=${()=>setScope("year")}>연</button></div>`;
  const tseg=html`<div class="seg" style="width:150px"><button class=${type==="expense"?"on e":""} onClick=${()=>{setType("expense");setMainCat("");}}>지출</button><button class=${type==="income"?"on i":""} onClick=${()=>{setType("income");setMainCat("");}}>수입</button></div>`;
  return html`<div>
    <div class="row" style="margin-bottom:12px;flex-wrap:wrap"><div style="flex:0">${seg}</div><div style="flex:0">${tseg}</div><div class="muted" style="flex:1;text-align:right">${scopeLabel} · 수입 <b class="inc">${won(totI)}</b> · 지출 <b class="exp">${won(totE)}</b> · 차액 <b>${won(totI-totE)}</b></div></div>
    <div class="stg">
      <${ChartBox} title="월별 수입·지출 (${y}년)" full=${true} deps=${[y,months]} config=${{type:"bar",data:{labels:Array.from({length:12},(_,i)=>`${i+1}월`),datasets:[{label:"수입",data:monthly.i,backgroundColor:"#2e8a58",borderRadius:4},{label:"지출",data:monthly.e,backgroundColor:"#c9503f",borderRadius:4},{label:"차액",data:monthly.i.map((v,i)=>v-monthly.e[i]),type:"line",borderColor:"#20263a",backgroundColor:"#20263a",tension:.3,pointRadius:3}]},options:{maintainAspectRatio:false,scales:{y:axisWon},plugins:{tooltip:tipWon}}}} />
      <${ChartBox} title="대분류별 ${type==="expense"?"지출":"수입"} (${scopeLabel})" deps=${[byCat]} config=${{type:"doughnut",data:{labels:byCat.map(x=>x.c.name),datasets:[{data:byCat.map(x=>x.v),backgroundColor:byCat.map(x=>colorOf(x.c)),borderWidth:2}]},options:{maintainAspectRatio:false,cutout:"55%",plugins:{legend:legendPct,tooltip:tipWonDonut}}}} />
      <${ChartBox} title="소분류별" right=${html`<select value=${catForSub?catForSub.id:""} onChange=${e=>setMainCat(e.target.value)}>${cats.map(c=>html`<option value=${c.id}>${c.name}</option>`)}</select>`} deps=${[bySub]} config=${{type:"bar",data:{labels:bySub.map(x=>x.n),datasets:[{data:bySub.map(x=>x.v),backgroundColor:catForSub?catForSub.color:"#888",borderRadius:4}]},options:{indexAxis:"y",maintainAspectRatio:false,scales:{x:axisWon},plugins:{legend:{display:false},tooltip:tipWon}}}} />
      <${ChartBox} title=${scope==="month"?`일자별 누적 ${type==="expense"?"지출":"수입"} (${m+1}월)`:`월별 ${type==="expense"?"지출":"수입"} 추이 (${y}년)`} deps=${[scope,type,cum,monthly]} config=${scope==="month"?{type:"line",data:{labels:daily.map((_,i)=>i+1),datasets:[{label:"누적",data:cum,borderColor:type==="expense"?"#c9503f":"#2e8a58",backgroundColor:type==="expense"?"rgba(201,80,63,.12)":"rgba(46,138,88,.12)",fill:true,tension:.25,pointRadius:0},{label:"일별",data:daily,type:"bar",backgroundColor:"rgba(32,38,58,.30)",borderRadius:2}]},options:{maintainAspectRatio:false,scales:{y:axisWon},plugins:{tooltip:tipWon}}}
        :{type:"line",data:{labels:Array.from({length:12},(_,i)=>`${i+1}월`),datasets:[{label:type==="expense"?"지출":"수입",data:type==="expense"?monthly.e:monthly.i,borderColor:type==="expense"?"#c9503f":"#2e8a58",backgroundColor:type==="expense"?"rgba(201,80,63,.12)":"rgba(46,138,88,.12)",fill:true,tension:.25}]},options:{maintainAspectRatio:false,scales:{y:axisWon},plugins:{tooltip:tipWon}}}} />
      <${ChartBox} title="항목별 상위 10" deps=${[topName]} config=${{type:"bar",data:{labels:topName.map(x=>x[0]),datasets:[{data:topName.map(x=>x[1]),backgroundColor:"#4f56d8",borderRadius:4}]},options:{indexAxis:"y",maintainAspectRatio:false,scales:{x:axisWon},plugins:{legend:{display:false},tooltip:tipWon}}}} />
      <${ChartBox} title="결제수단별 지출 (${scopeLabel})" deps=${[methodE]} config=${{type:"doughnut",data:{labels:methodE.map(x=>x[0]),datasets:[{data:methodE.map(x=>x[1]),backgroundColor:methodE.map((_,i)=>PALETTE[(i+6)%PALETTE.length]),borderWidth:2}]},options:{maintainAspectRatio:false,cutout:"55%",plugins:{legend:legendPct,tooltip:tipWonDonut}}}} />
      <div class="panel full"><h4>분류별 집계표 (${scopeLabel} · ${type==="expense"?"지출":"수입"})</h4>
        <table class="tbl"><thead><tr><th>분류</th><th class="r">건수</th><th class="r">금액</th><th class="r">비율</th></tr></thead><tbody>
          ${byCat.map(x=>html`<tr style=${{background:x.c.color+"22"}}><td><span class="dot" style=${{display:"inline-block",width:8,height:8,borderRadius:4,background:x.c.color,marginRight:6}}></span><b>${x.c.name}</b></td><td class="r">${sel.filter(t=>t.catId===x.c.id).length}</td><td class="r mono"><b>${x.v.toLocaleString()}</b></td><td class="r">${Math.round(x.v/(type==="expense"?totE:totI)*100)}%</td></tr>
            ${x.c.subs.map(sb=>{ const l=sel.filter(t=>t.catId===x.c.id&&t.subId===sb.id); const v=l.reduce((a,t)=>a+t.amount,0); return v?html`<tr class="sub" style=${{background:x.c.color+"0d"}}><td>${sb.name}</td><td class="r">${l.length}</td><td class="r mono">${v.toLocaleString()}</td><td class="r">${Math.round(v/x.v*100)}%</td></tr>`:null; })}`)}
          ${!byCat.length?html`<tr><td colspan="4" class="empty">데이터가 없습니다</td></tr>`:null}
        </tbody></table></div>
    </div>
  </div>`;
}

    <div class="nav">${nav.map(([g,items])=>html`<div class="grp">${g}</div>${items.map(([k,l])=>html`<button class=${sec===k?"on":""} onClick=${()=>setSec(k)}>${l}</button>`)}`)}</div>

  const [v,setV]=useState(init);
  return html`<${Modal} title=${title} onClose=${onClose} footer=${html`<button class="btn" onClick=${onClose}>취소</button><button class="btn p" onClick=${()=>onOk(v)}>저장</button>`}>
    ${fields.map(f=>html`<label class="f">${f.label}</label>${f.type==="color"?html`<${Palette} value=${v[f.key]} onChange=${c=>setV({...v,[f.key]:c})} />`
      :f.type==="select"?html`<select value=${v[f.key]||""} onChange=${e=>setV({...v,[f.key]:e.target.value})}>${f.opts.map(o=>html`<option value=${o[0]}>${o[1]}</option>`)}</select>`
      :html`<input type=${f.type||"text"} value=${v[f.key]??""} placeholder=${f.ph||""} onInput=${e=>setV({...v,[f.key]:e.target.value})} />`}`)}
  <//>`;

function CatSettings({db}){
  const s=db.settings; const [type,setType]=useState("expense"); const [pr,setPr]=useState(null);
  const cats=s.categories[type];
  const commit=(fn)=>{ const ns=clone(s); fn(ns.categories[type]); db.saveSettings(ns); };
  const move=(arr,i,d)=>{ const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; };
  return html`<div class="sec"><h3>분류 관리</h3><div class="desc">대분류 › 소분류 2단계입니다. 이름·색상·순서를 자유롭게 바꿀 수 있고, 삭제해도 이미 입력한 내역은 남습니다(미분류로 표시).</div>
    <div class="seg" style="width:200px;margin-bottom:12px"><button class=${type==="expense"?"on e":""} onClick=${()=>setType("expense")}>지출</button><button class=${type==="income"?"on i":""} onClick=${()=>setType("income")}>수입</button></div>
    ${cats.map((c,i)=>html`
      <div class="item"><span class="dot" style=${{width:12,height:12,borderRadius:6,background:c.color,flexShrink:0}}></span><span class="nm">${c.name}</span><span class="muted">${c.subs.length}개</span>
        <div class="ops"><button class="btn s g" onClick=${()=>commit(a=>move(a,i,-1))}>↑</button><button class="btn s g" onClick=${()=>commit(a=>move(a,i,1))}>↓</button>
          <button class="btn s" onClick=${()=>setPr({title:"소분류 추가",init:{name:""},fields:[{key:"name",label:"소분류 이름",ph:"예: 배달"}],ok:v=>{ if(v.name.trim()) commit(a=>a[i].subs.push({id:uid("s"),name:v.name.trim()})); setPr(null); }})}>+ 소분류</button>
          <button class="btn s" onClick=${()=>setPr({title:"대분류 수정",init:{name:c.name,color:c.color},fields:[{key:"name",label:"이름"},{key:"color",label:"색상",type:"color"}],ok:v=>{ if(v.name.trim()) commit(a=>{a[i].name=v.name.trim();a[i].color=v.color;}); setPr(null); }})}>수정</button>
          <button class="btn s d" onClick=${()=>{ if(confirm(`'${c.name}' 대분류와 소분류를 모두 삭제할까요?`)) commit(a=>a.splice(i,1)); }}>삭제</button></div></div>
      ${c.subs.map((sb,j)=>html`<div class="item sub"><span class="nm">${sb.name}</span>
        <div class="ops"><button class="btn s g" onClick=${()=>commit(a=>move(a[i].subs,j,-1))}>↑</button><button class="btn s g" onClick=${()=>commit(a=>move(a[i].subs,j,1))}>↓</button>
          <button class="btn s g" onClick=${()=>setPr({title:"소분류 수정",init:{name:sb.name},fields:[{key:"name",label:"이름"}],ok:v=>{ if(v.name.trim()) commit(a=>a[i].subs[j].name=v.name.trim()); setPr(null); }})}>수정</button>
          <button class="btn s g" style="color:var(--exp)" onClick=${()=>{ if(confirm(`'${sb.name}' 소분류를 삭제할까요?`)) commit(a=>a[i].subs.splice(j,1)); }}>삭제</button></div></div>`)}`)}
    <button class="btn w" style="margin-top:6px" onClick=${()=>setPr({title:"대분류 추가",init:{name:"",color:PALETTE[cats.length%PALETTE.length]},fields:[{key:"name",label:"대분류 이름",ph:"예: 반려동물"},{key:"color",label:"색상",type:"color"}],ok:v=>{ if(v.name.trim()) commit(a=>a.push({id:uid("c"),name:v.name.trim(),color:v.color,subs:[{id:uid("s"),name:"기타"}]})); setPr(null); }})}>+ 대분류 추가</button>
    ${pr&&html`<${Prompt} title=${pr.title} init=${pr.init} fields=${pr.fields} onOk=${pr.ok} onClose=${()=>setPr(null)} />`}
  </div>`;
}
function PaySettings({db,balances}){
  const s=db.settings; const [pr,setPr]=useState(null);

    ${s.cards.map((c,i)=>html`<div class="item"><span class="dot" style=${{width:12,height:12,borderRadius:6,background:c.color}}></span><div><div class="nm">${c.name} ${c.last4?html`<span class="muted">····${c.last4}</span>`:null}</div><div class="muted">${c.billingDay?`매월 ${c.billingDay}일 결제 · 전월 ${c.periodFrom}일~당월 ${c.periodTo}일 사용분`:"결제일 미설정"}${c.accountId?` · 출금: ${(s.accounts.find(a=>a.id===c.accountId)||{}).name||""}`:""}</div></div>
      <div class="ops"><button class="btn s" onClick=${()=>setPr({title:"카드 수정",init:{...c},fields:cardFields,ok:v=>{ if(v.name.trim()) commit(ns=>ns.cards[i]={...ns.cards[i],...numify(v),name:v.name.trim()}); setPr(null); }})}>수정</button><button class="btn s d" onClick=${()=>{ if(confirm("카드를 삭제할까요? 기존 내역은 유지됩니다.")) commit(ns=>ns.cards.splice(i,1)); }}>삭제</button></div></div>`)}

      <div class="ops"><button class="btn s" onClick=${()=>setPr({title:"계좌 수정",init:{...a},fields:acctFields,ok:v=>{ if(v.name.trim()) commit(ns=>ns.accounts[i]={...ns.accounts[i],...v,initialBalance:+v.initialBalance||0,name:v.name.trim()}); setPr(null); }})}>수정</button><button class="btn s d" onClick=${()=>{ if(confirm("계좌를 삭제할까요?")) commit(ns=>ns.accounts.splice(i,1)); }}>삭제</button></div></div>`)}

function FixedSettings({db}){

function App(){
  const [settings,setSettings]=useState(null);
  const [txByYear,setTxByYear]=useState({});
  const [locked,setLocked]=useState(false);
  const [ready,setReady]=useState(false);
  const now=new Date(); const [y,setY]=useState(now.getFullYear()); const [m,setM]=useState(now.getMonth());
  const [view,setView]=useState("cal");
  const [modal,setModal]=useState(null); // {kind, ...}
  const [filter,setFilter]=useState({type:"all",cat:"",method:"",q:"",planned:true,showBill:true,desc:false});
  const [needPerm,setNeedPerm]=useState(false);

  // ── 초기 로드 ──
  const loadAll=async()=>{
    let s=await Store.loadSettings(); if(!s){ s=DEFAULT_SETTINGS(); await Store.saveSettings(s); }
    s={...DEFAULT_SETTINGS(),...s,prefs:{...DEFAULT_SETTINGS().prefs,...(s.prefs||{})},security:s.security||{enabled:false}};
    const tb={}; for(const yr of Store.years()) tb[yr]=await Store.loadYear(yr);
    setSettings(s); setTxByYear(tb); setView(s.prefs.defaultView||"cal"); setReady(true);
  };
  useEffect(()=>{ (async()=>{
    const h=await HDB.get(); if(h){ const p=await h.queryPermission({mode:"readwrite"}); if(p==="granted") Store.dirHandle=h; else setNeedPerm(true); }
    const raw=Store.rawSettings();
    if(raw&&raw.enc){ setLocked(true); setReady(true); } else await loadAll();
  })(); },[]);
  const unlock=async(pw)=>{
    const raw=Store.rawSettings(); try{ const {key}=await deriveKey(pw,raw.salt); Store.key=key; Store.salt=raw.salt; await decryptStr(key,raw); await loadAll(); setLocked(false); setTimeout(()=>{ if(GS.m().on&&GS.live()) GS.sync({toast:false}); else GS.paint(); },300); return true; }catch(e){ Store.key=null; return false; }
  };
  const lockNow=()=>{ if(!settings.security.enabled) return; Store.key=null; Store.salt=null; setSettings(null); setTxByYear({}); setLocked(true); setModal(null); };
  const reconnect=async()=>{ const h=await HDB.get(); if(!h) return setNeedPerm(false); try{ const p=await h.requestPermission({mode:"readwrite"}); if(p==="granted"){ Store.dirHandle=h; setNeedPerm(false); toast("폴더를 다시 연결했습니다"); } }catch(e){} };

  // ── 저장 API ──
  const db=useMemo(()=>({
    get settings(){ return settings; }, get txByYear(){ return txByYear; },
    tx(yr){ return txByYear[yr]||[]; },
    async saveSettings(ns){ setSettings(ns); await Store.saveSettings(ns); },
    async saveYear(yr,list){ setTxByYear(p=>({...p,[yr]:list})); await Store.saveYear(yr,list); },
    async upsertTx(t){ const yr=+t.date.slice(0,4); // 연도가 바뀐 수정이면 이전 연도에서 제거
      for(const k of Object.keys(txByYear)){ if(+k!==yr&&txByYear[k].some(x=>x.id===t.id)) await this.saveYear(+k,txByYear[k].filter(x=>x.id!==t.id)); }
      const list=(txByYear[yr]||[]).filter(x=>x.id!==t.id); list.push(t); list.sort((a,b)=>a.date.localeCompare(b.date)); await this.saveYear(yr,list); },
    async delTx(id,date){ const yr=+date.slice(0,4); await this.saveYear(yr,(txByYear[yr]||[]).filter(x=>x.id!==id)); },
    async addMany(list){ const by={...txByYear}; for(const t of list){ const yr=+t.date.slice(0,4); by[yr]=[...(by[yr]||[]),t]; } for(const yr of Object.keys(by)){ if(list.some(t=>+t.date.slice(0,4)===+yr)){ by[yr].sort((a,b)=>a.date.localeCompare(b.date)); await Store.saveYear(+yr,by[yr]); } } setTxByYear(by); },
    async setPassword(pw){ // 재암호화
      const ns=clone(settings);
      if(pw){ const {key,salt}=await deriveKey(pw); Store.key=key; Store.salt=salt; ns.security={enabled:true}; } else { Store.key=null; Store.salt=null; ns.security={enabled:false}; }
      setSettings(ns); await Store.saveSettings(ns); for(const yr of Object.keys(txByYear)) await Store.saveYear(+yr,txByYear[yr]);
    },
    async writeAllToFolder(){ await Store.saveSettings(settings); for(const yr of Object.keys(txByYear)) await Store.saveYear(+yr,txByYear[yr]); },
    async loadAllFromFolder(){ let n=0; try{ const files=await Store.listFolder(); const st=await Store.readFile("settings.json"); if(st){ const o=await Store.unpack(st); if(o){ localStorage.setItem(LS.settings,st); n++; } }
      for(const f of files){ const mm=f.match(/^가계부_(\d{4})\.json$/); if(mm){ const c=await Store.readFile(f); const o=await Store.unpack(c); if(o){ localStorage.setItem(LS.year(+mm[1]),c); n++; } } } }catch(e){ return -1; } GS.touchAll();
      await loadAll(); return n; },
    async exportBackup(){ const data={app:"hb",ver:APP_VER,exported:new Date().toISOString(),settings,years:txByYear}; let s=JSON.stringify(data);
      if(Store.key){ const raw=Store.rawSettings(); const e=await encryptStr(Store.key,s); s=JSON.stringify({app:"hb",ver:APP_VER,enc:true,salt:raw.salt,iv:e.iv,data:e.data}); }
      return new Blob([s],{type:"application/json"}); },
    async importBackup(text){ try{ let o=JSON.parse(text);
      if(o.enc){ let key=Store.key; let ok=false; if(key){ try{ o=JSON.parse(await decryptStr(key,o)); ok=true; }catch(e){} }
        if(!ok){ const pw=prompt("백업 파일의 암호를 입력하세요"); if(!pw) return "취소했습니다"; const {key:k}=await deriveKey(pw,o.salt); o=JSON.parse(await decryptStr(k,o)); } }
      if(o.app!=="hb"||!o.settings) return "가계부 백업 파일이 아닙니다";
      Store.clearAll(); await Store.saveSettings(o.settings); for(const yr of Object.keys(o.years||{})) await Store.saveYear(+yr,o.years[yr]); await loadAll(); return "복원했습니다"; }
      catch(e){ return "복원 실패: 파일이 손상되었거나 암호가 다릅니다"; } },
  }),[settings,txByYear]);
  const [sk,setSk]=useState(0);

  if(!ready) return html`<div class="lock"><div class="muted">불러오는 중…</div></div>`;

  const plE=entries.filter(t=>t.type==="expense"&&t.planned).reduce((a,t)=>a+t.amount,0);

    </div>`}
    ${view==="list"&&settings.accounts.some(a=>a.initialDate)&&html`<div class="bal">${settings.accounts.filter(a=>a.initialDate).map(a=>html`<div class="b"><span class="muted">${a.name}</span><b class="mono">${(balances[a.id]||0).toLocaleString()}원</b></div>`)}</div>`}

  return html`<div class="note gsmove"><b>v1.0(내려받은 파일)을 쓰셨나요?</b> 그 기록은 이 앱으로 저절로 오지 않아요. v1.0에서 「설정 › 저장·백업 › 백업 파일 내려받기」를 한 뒤, 여기 <b>「설정 › 저장 · 동기화 › 백업 파일에서 복원」</b>을 누르면 그대로 옮겨져요(쓰던 폴더가 있으면 「폴더 선택 → 폴더에서 불러오기」).
    <div class="row" style="margin-top:8px;justify-content:flex-start"><button class="btn s p" style="flex:0" onClick=${onGo}>옮기러 가기</button><button class="btn s g" style="flex:0" onClick=${close}>처음 써요 · 닫기</button></div></div>`;
}
