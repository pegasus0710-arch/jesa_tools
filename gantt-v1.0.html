<style>:root{--paper:#faf6ee;--panel:#ffffff;--card:#ffffff;--tint:#f3eee3;--ink:#14202b;--sub:#5f6b7a;--sub2:#5f6b7a;--n:#0c737d;--nh:#0f3a3b;--nl:#dcebe9;--or:#e07a4f;--red:#c23a2b;--blue:#1f4f9a;--hair:rgba(20,32,43,0.18);--hair2:rgba(20,32,43,0.33);--up:0 0 0 1px rgba(20,32,43,0.105),0 1px 2px rgba(20,32,43,0.075),0 10px 28px -12px rgba(20,32,43,0.27);--in:inset 0 1px 2px rgba(20,32,43,0.21);color-scheme:only light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SUIT,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num,input.amt{font-variant-numeric:tabular-nums}
#root{min-height:100vh}
.yt-head{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--hair);background:var(--paper);position:sticky;top:0;z-index:20}
.yt-ic{width:38px;height:38px;border-radius:10px;background:var(--n);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yt-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.yt-ic i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--paper)}
.yt-head h1{font-size:19px;font-weight:800;white-space:nowrap}
.yt-head small{font-size:13px;color:var(--sub2)}
.yt-yr{font-size:13px;font-weight:700;color:var(--n);background:var(--nl);border-radius:8px;padding:5px 10px;white-space:nowrap}
.yt-rul{margin-left:auto;display:flex;width:min(560px,46vw)}
.yt-rul button{flex:1;text-align:center;font-size:12.5px;color:var(--sub2);position:relative;padding-top:16px;white-space:nowrap}
.yt-rul button:before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:var(--hair2)}
.yt-rul button.done:before,.yt-rul button.on:before{background:var(--or)}
.yt-rul button.on:before{right:50%}
.yt-rul button b{position:absolute;top:0;left:50%;margin-left:-6px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--hair2)}
.yt-rul button.done b,.yt-rul button.on b{background:var(--or);border-color:var(--or)}
.yt-rul button.on b{box-shadow:0 0 0 4px rgba(224,122,79,0.18)}
.yt-rul button.on{color:var(--ink);font-weight:800}
.yt-main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:22px;padding:22px 24px 40px;max-width:1500px;margin:0 auto}
.yt-panel{background:var(--panel);border-radius:16px;box-shadow:var(--up);padding:22px 24px;display:flex;flex-direction:column;min-height:640px;align-self:start}
.yt-k{font-size:13px;color:var(--sub2);font-weight:700}
.yt-panel h2{font-size:24px;font-weight:800;margin:4px 0}
.yt-lead{font-size:14.5px;color:var(--sub);margin-bottom:16px}
.yt-sec{font-size:15.5px;font-weight:800;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:8px}
.yt-sec:first-of-type{border:0;padding-top:0;margin-top:4px}
.f{margin-bottom:14px;min-width:0}
.f>label,.f>.lb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px;font-weight:800;margin-bottom:6px}
.f>label,.f>.lb{flex-wrap:wrap;white-space:nowrap}
.f>label span,.f>.lb span{font-weight:500;color:var(--sub2);font-size:13px;text-align:right;white-space:normal;margin-left:auto}
.in{height:48px;border-radius:12px;background:#fff;box-shadow:var(--in),0 0 0 1px var(--hair2);display:flex;align-items:center;padding:0 14px;gap:6px}
.in:focus-within{box-shadow:0 0 0 2px var(--n)}
.in input{border:0;outline:0;background:none;width:100%;min-width:0;font-size:18px;font-weight:700;text-align:right}
.in input::placeholder{color:#b7ae9e;font-weight:600}
.in em{font-style:normal;font-size:15px;color:var(--sub2);font-weight:600;flex-shrink:0}
.in select{border:0;outline:0;background:none;width:100%;font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--sub2);margin-top:5px}
.hint b{color:var(--n)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--up)}
.chip.on{background:var(--n);color:#fff}
.box{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--sub);box-shadow:var(--in);margin:4px 0 12px}
.box b{color:var(--ink)}
.kid{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;box-shadow:var(--up);padding:8px 10px 8px 12px;margin-bottom:8px}
.kid .in{height:40px;width:130px;flex-shrink:0}
.kid .in input{font-size:16px}
.kid .ag{font-size:14px;color:var(--sub);white-space:nowrap}
.kid .tg{margin-left:auto;font-size:12.5px;font-weight:800;border-radius:7px;padding:3px 8px;background:var(--nl);color:var(--n);white-space:nowrap}
.kid .tg.x{background:var(--tint);color:var(--sub2)}
.kid .del{width:32px;height:32px;border-radius:8px;color:var(--sub2);font-size:20px;line-height:1;flex-shrink:0}
.kid .del:hover{background:var(--tint)}
.addb{width:100%;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--up);color:var(--n);font-weight:800;margin-bottom:12px}
.edu{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.edu .in{height:44px}
.more{width:100%;text-align:left;font-weight:800;font-size:14.5px;color:var(--n);padding:10px 0;display:flex;align-items:center;gap:6px}
.more i{font-style:normal;transition:transform .15s}
.more.op i{transform:rotate(90deg)}
.yt-nav{margin-top:auto;padding-top:18px;display:flex;gap:10px}
.btn{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;padding:0 20px;background:var(--card);box-shadow:var(--up);white-space:nowrap}
.btn:hover{box-shadow:0 0 0 2px var(--n)}
.btn:active{transform:translateY(1px)}
.btn.pr{background:var(--n);color:#fff;flex:1}
.btn.pr:hover{background:var(--nh);box-shadow:none}
.btn.sm{height:40px;font-size:14px;padding:0 14px}
.yt-res{display:flex;flex-direction:column;gap:16px;min-width:0;position:sticky;top:86px;align-self:start}
.big{background:var(--card);border-radius:16px;box-shadow:var(--up);padding:22px 26px}
.big .k2{font-size:14px;font-weight:800;color:var(--sub)}
.amt-b{font-size:clamp(34px,4.2vw,52px);font-weight:900;letter-spacing:-1.5px;color:var(--blue);margin:2px 0;line-height:1.15;word-break:keep-all}
.amt-b.pay{color:var(--red)}
.amt-b.zero{color:var(--ink)}
.amt-b small{font-size:.46em;font-weight:800;margin-left:4px;letter-spacing:-.3px}
.amt-s{font-size:14px;color:var(--sub2)}
.flow{display:flex;gap:8px;align-items:stretch;margin-top:16px}
.fb{flex:1;background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:var(--in);min-width:0}
.fb span{display:block;font-size:12.5px;color:var(--sub2);font-weight:700}
.fb b{font-size:clamp(15px,1.4vw,19px);font-weight:800}
.op{display:flex;align-items:center;font-size:18px;color:var(--sub2);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--up);padding:18px 20px;min-width:0}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border:0}
.row b{font-weight:800;white-space:nowrap}
.row.z{color:var(--sub2)}
.row.t{font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:9px}
.row.s{padding-left:14px;font-size:13.5px;color:var(--sub)}
.tip{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.tip:last-child{border:0}
.tip .d{width:34px;height:34px;border-radius:9px;background:var(--nl);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tip .d svg{width:19px;height:19px;stroke:var(--n);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip p{font-size:14px;line-height:1.4;flex:1;min-width:0}
.tip p small{color:var(--sub2);font-size:12.5px}
.tip b.g{color:var(--blue);font-size:16px;white-space:nowrap}
.tip.info b.g{color:var(--sub2);font-size:13px;font-weight:700}
.note{font-size:12.5px;color:var(--sub2);margin-top:10px}
.cardbar{height:12px;border-radius:6px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;margin:6px 0 4px}
.cardbar i{position:absolute;left:0;top:0;bottom:0;background:var(--n);border-radius:6px}
.cardbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--or)}
.yt-mbar{display:none}
.yt-foot{text-align:center;font-size:12.5px;color:var(--sub2);padding:0 16px 30px}
.yt-foot a{color:var(--n);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* 결과 단계 */
.res-tbl .row span{min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:899px){
  .yt-head{height:56px;padding:0 16px}
  .yt-head small,.yt-head .yt-yr{display:none}
  .yt-head h1{font-size:17px}
  .yt-rul{display:none}
  .yt-mrul{display:flex;gap:4px;padding:10px 16px 0}
  .yt-mrul i{flex:1;height:4px;border-radius:2px;background:var(--hair2)}
  .yt-mrul i.d{background:var(--or)}
  .yt-main{grid-template-columns:1fr;padding:12px 12px 110px;gap:14px}
  .yt-panel{padding:18px 16px;min-height:0}
  .yt-panel h2{font-size:21px}
  .yt-res{position:static}
  .yt-res.side{display:none}
  .yt-nav{display:none}
  .yt-mbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--n);color:#fff;padding:10px 14px calc(12px + env(safe-area-inset-bottom));align-items:center;gap:8px;z-index:30}
  .yt-mbar span{font-size:12.5px;color:#eaf4f5;display:block}
  .yt-mbar b{font-size:22px;font-weight:900;white-space:nowrap}
  .yt-mbar .bk{margin-left:auto;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:11px 12px;font-weight:800;font-size:14px}
  .yt-mbar .go{background:#fff;color:var(--n);border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;white-space:nowrap}
  .flow{flex-wrap:wrap}.flow .op{display:none}.fb{flex:1 1 40%}
  .edu{grid-template-columns:118px 1fr 32px}
  .kid .in{width:112px}
}
@media (min-width:900px){.yt-mrul{display:none}}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .yt-head,.yt-panel,.yt-mbar,.yt-mrul,.yt-foot,.noprint,.toast{display:none!important}
  .yt-main{display:block;padding:0}
  .yt-res{position:static;display:flex!important}
  .big,.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .printhead{display:block!important;font-size:18px;font-weight:800;margin-bottom:8px}
}

<script>/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════

    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };

        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };

})();</script>

  const cm = colorMap(all), keys = [...cm.keys()];
  /* 채우기: 0 없음 · 1 gray125 · 2 머리 · 3 주말 · 4 공휴일 · 5 오늘 · 그 뒤 색마다 (진한 · 연한) */
  const fill = c => `<fill><patternFill patternType="solid"><fgColor rgb="FF${c.slice(1).toUpperCase()}"/><bgColor indexed="64"/></patternFill></fill>`;
  const fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>', fill("#EFEBE3"), fill("#F3F1EC"), fill("#FBEEEE"), fill("#F6C7B3")];
  keys.forEach(k => { const c = cm.get(k); fills.push(fill(c), fill(mix(c, .62))); });
  /* 칸 모양: 0 기본 · 1 머리(굵게 · 머리 색) · 2 주말 · 3 공휴일 · 4 오늘 머리 · 5 구분 굵게 · 6+ 색 */
  const xf = (f, font, al) => `<xf numFmtId="0" fontId="${font}" fillId="${f}" borderId="1" xfId="0" applyFill="1" applyBorder="1"${al ? ` applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>` : "/>"}`;
  const xfs = [xf(0, 0), xf(2, 1, 1), xf(3, 0), xf(4, 0), xf(5, 1, 1), xf(0, 1)];
  keys.forEach((k, i) => { xfs.push(xf(6 + i * 2, 0), xf(7 + i * 2, 0)); });
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font><font><b/><sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font></fonts><fills count="${fills.length}">${fills.join("")}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFE0DAD0"/></left><right style="thin"><color rgb="FFE0DAD0"/></right><top style="thin"><color rgb="FFE0DAD0"/></top><bottom style="thin"><color rgb="FFE0DAD0"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const colL = i => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const cell = (r, c, v, st, num) => v === "" || v == null ? `<c r="${colL(c)}${r}" s="${st || 0}"/>` : num ? `<c r="${colL(c)}${r}" s="${st || 0}"><v>${v}</v></c>` : `<c r="${colL(c)}${r}" s="${st || 0}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  const H = ["구분", "작업", "담당", "시작일", "종료일", "일수", "진행률"], NC = H.length, tn = dn(todayS());
  let rowsX = [];
  /* 1행: 제목 · 2행: 머리 · 3행~: 작업 */
  let r1x = `<row r="1">${cell(1, 0, S.title || "간트 차트", 5)}`; cols.forEach(([x], j) => { const prev = j ? cols[j - 1][0] : null; if (!j || ds(x).slice(0, 7) !== ds(prev).slice(0, 7)) r1x += cell(1, NC + j, ds(x).slice(0, 7), 5); }); rowsX.push(r1x + "</row>");
  let r2 = `<row r="2">` + H.map((h, i) => cell(2, i, h, 1)).join("");
  cols.forEach(([x, y], j) => { const today = tn >= x && tn <= y; r2 += cell(2, NC + j, wk ? ds(x).slice(5) : +ds(x).slice(8) + "(" + WD[wdi(x)] + ")", today ? 4 : 1); });
  rowsX.push(r2 + "</row>");
  all.forEach((t, i) => {
    const r = i + 3, ki = keys.indexOf(keyOf(t)), sa = dn(t.s), sb = dn(t.e), p = t.pct || 0, done = sa + Math.round((sb - sa + 1) * p / 100);
    let row = `<row r="${r}">` + cell(r, 0, t.g || "") + cell(r, 1, t.n || "", t.ms ? 5 : 0) + cell(r, 2, t.who || "") + cell(r, 3, ymdw(t.s)) + cell(r, 4, t.ms ? "" : ymdw(t.e)) + cell(r, 5, t.ms ? 0 : +durTxt(t).replace("일", ""), 0, true) + cell(r, 6, p / 100 ? p + "%" : "0%");
    cols.forEach(([x, y], j) => { const on = sa <= y && sb >= x; let st = 0;
      if (on) st = 6 + ki * 2 + (S.pct && (wk ? x >= done : x >= done) ? 1 : 0);
      else if (!wk && S.hol && HOL[ds(x)]) st = 3; else if (!wk && S.wk && (wdi(x) === 0 || wdi(x) === 6)) st = 2;
      row += cell(r, NC + j, on && t.ms ? "◆" : "", st); });
    rowsX.push(row + "</row>");
  });
  const colW = `<cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="24" customWidth="1"/><col min="3" max="3" width="9" customWidth="1"/><col min="4" max="5" width="15" customWidth="1"/><col min="6" max="7" width="7" customWidth="1"/><col min="${NC + 1}" max="${NC + cols.length}" width="${wk ? 6.5 : 6.2}" customWidth="1"/></cols>`;
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0"><pane xSplit="${NC}" ySplit="2" topLeftCell="${colL(NC)}3" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/>${colW}<sheetData>${rowsX.join("")}</sheetData><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  const files = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="간트 차트" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", styles], ["xl/worksheets/sheet1.xml", sheet]];
  dl(zipStore(files), fname("xlsx")); toast(wk ? "엑셀로 받았어요 — 기간이 길어 칸 하나 = 한 주" : "엑셀로 받았어요 — 칸 하나 = 하루");
}

/* ── 입력 ── */
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.k) { S[t.dataset.k] = t.value; save(); renderPreview(); return; }
  if (t.dataset.t && t.type !== "date") { const i = +t.dataset.i, k = t.dataset.t; let v = t.value;
    if (k === "pct") { v = v.replace(/\D/g, "").slice(0, 3); if (+v > 100) v = "100"; t.value = v; v = +v || 0; }
    S.tasks[i][k] = v; S.sample = false; save(); renderPreview(); return; }
});
document.addEventListener("change", e => {
  const t = e.target; if (t.type !== "date") return;
  const lab = t.parentElement, sp = lab.querySelector("span");
  if (t.dataset.t) { const i = +t.dataset.i, k = t.dataset.t, T = S.tasks[i]; T[k] = t.value; S.sample = false;
    if (k === "s" && T.e && dn(T.e) < dn(T.s)) T.e = T.s;
    if (k === "e" && T.s && dn(T.e) < dn(T.s)) T.s = T.e;
    if (T.ms) T.e = T.s;
    save(); const row = document.querySelector(`[data-row="${i}"]`); if (row) row.outerHTML = taskRow(T, i); renderPreview(); return; }
  if (t.hasAttribute("data-from")) S.from = t.value; if (t.hasAttribute("data-to")) S.to = t.value;
  if (sp) sp.textContent = t.value ? ymdw(t.value) : "날짜"; lab.classList.toggle("no", !t.value);
  save(); renderPreview();
});
document.addEventListener("click", e => {
  const dt = e.target.closest(".dt"); if (dt) { const inp = dt.querySelector("input"); try { inp.showPicker(); e.preventDefault(); } catch (er) {} }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if ("go" in d) return go(+d.go);
  if (b.hasAttribute("data-next")) { if (S.step === 0 && !validTasks().length) return toast("작업 이름과 시작일을 하나 이상 넣어 주세요"); return go(S.step + 1); }
  if (b.hasAttribute("data-prev")) return go(S.step - 1);
  if (b.hasAttribute("data-pvjump")) { const r = $("#res"); if (r) r.scrollIntoView({ behavior: "smooth" }); return; }
  if (d.paste) { const v = ($("#pst") || {}).value || ""; const r = parsePaste(v);
    if (r.noTab && r.tasks.length < 1) return toast("칸이 나뉘지 않았어요 — 엑셀에서 표를 골라 복사해 주세요");
    if (!r.tasks.length) return toast(r.bad ? "시작일을 읽지 못했어요 — 날짜 칸을 확인해 주세요" : "붙여 넣은 내용이 없어요");
    S.tasks = d.paste === "add" && !S.sample ? S.tasks.concat(r.tasks) : r.tasks; S.sample = false; save(); render();
    return toast(`작업 ${r.tasks.length}개를 넣었어요${r.bad ? ` · 시작일을 못 읽은 줄 ${r.bad}개는 뺐어요` : ""}`); }
  if (b.hasAttribute("data-add")) { const last = S.tasks[S.tasks.length - 1]; const s = last && last.e ? ds(dn(last.e) + 1) : todayS();
    if (S.sample) { S.tasks = []; S.sample = false; }
    S.tasks.push({ g: last ? last.g : "", n: "", s, e: ds(dn(s) + 4), who: "", pct: 0 }); save(); render();
    const el = document.querySelector(`[data-t="n"][data-i="${S.tasks.length - 1}"]`); if (el) { el.focus(); el.scrollIntoView({ block: "center" }); } return; }
  if (b.hasAttribute("data-clear")) { if (!confirmTwice("clear")) return; S.tasks = []; S.sample = false; save(); render(); return toast("작업을 모두 지웠어요"); }
  if (b.hasAttribute("data-sample")) { S.tasks = SAMPLE(); S.sample = true; S.title = S.title || "프로젝트 일정표"; save(); render(); return; }
  if (d.del != null) { S.tasks.splice(+d.del, 1); S.sample = false; save(); render(); return; }
  if (d.up != null) { const i = +d.up; if (i > 0) { [S.tasks[i - 1], S.tasks[i]] = [S.tasks[i], S.tasks[i - 1]]; S.sample = false; save(); render(); } return; }
  if (d.ms != null) { const T = S.tasks[+d.ms]; T.ms = !T.ms; if (T.ms) T.e = T.s; else if (T.s) T.e = ds(dn(T.s) + 4); S.sample = false; save(); render(); return; }
  if (d.scale) { S.scale = d.scale; save(); render(); return; }
  if (d.rng) { S.rng = d.rng; if (d.rng === "set" && !S.from) { const { a, b } = rangeOf(validTasks()); S.from = ds(a); S.to = ds(b); } save(); render(); return; }
  if (d.tog) { S[d.tog] = !S[d.tog]; save(); render(); return; }
  if (d.biz) { S.biz = d.biz === "1"; save(); render(); return; }
  if (d.cby) { S.colorBy = d.cby; save(); render(); return; }
  if (d.pal) { S.pal = d.pal; save(); render(); return; }
  if (d.fs) { S.fs = d.fs; save(); render(); return; }
  if (d.shape) { S.shape = d.shape; save(); render(); return; }
  if (d.pngw) { S.pngW = +d.pngw; save(); render(); return; }
  if (d.out) { if (!validTasks().length) return toast("그릴 일정이 없어요");
    return ({ copy: outCopy, png: outPng, print: outPrint, xlsx: outXlsx, tsv: outTsv })[d.out](); }
  if (b.hasAttribute("data-reset")) { if (!confirmTwice("reset")) return; S = BLANK(); try { localStorage.removeItem(LSK); } catch (er) {} go(0); toast("처음 상태로 돌렸어요"); }
});
/* 1단계에서 입력칸 밖에 표를 붙여 넣어도 바로 읽음 */
document.addEventListener("paste", e => {
  if (S.step !== 0) return; const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  const v = (e.clipboardData || window.clipboardData).getData("text"); if (!v || v.indexOf("\t") < 0) return;
  e.preventDefault(); const p = $("#pst"); if (p) { p.value = v; p.focus(); toast("붙여 넣었어요 — 「이 표로 바꾸기」를 눌러 주세요"); }
});
let ctT = 0, ctK = "";
function confirmTwice(k) { const n = Date.now(); if (ctK === k && n - ctT < 4000) return true; ctK = k; ctT = n; toast("한 번 더 누르면 지워요"); return false; }
function toast(t) { const o = document.querySelector(".toast"); if (o) o.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* 시작 — 블로그 경유 잠금(대표 글 공개 시각부터) */
const GATE_ON = false;   /* 대표 글 날짜가 정해지면 Date.now() >= Date.parse("…") 로 */
(async () => {
  const T = new URLSearchParams(location.search).get("tab") || "all";
  if (GATE_ON && !(await BJ_GATE.check(TOOL, T))) return;
  if (S.sample) S.tasks = SAMPLE();   /* 예시는 늘 오늘 기준으로 */
  try { history.replaceState({ gt: S.step }, "", location.href); } catch (e) {}
  render();
  if (document.fonts) document.fonts.ready.then(renderPreview);
})();

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알림 */
(function () { if (!EMBED || window.parent === window) return;
  let last = 0, t = null;
  function send() { const r = document.getElementById("root"); if (!r) return; const h = Math.ceil(r.getBoundingClientRect().height) + 8; if (Math.abs(h - last) < 4) return; last = h; try { window.parent.postMessage({ blogj: "height", h }, "https://luvbong.tistory.com"); } catch (e) {} }
  function soon() { clearTimeout(t); t = setTimeout(send, 60); }
  if (window.ResizeObserver) new ResizeObserver(soon).observe(document.getElementById("root"));
  window.addEventListener("load", send); setTimeout(send, 300);
})();
</script>
</body></html>
