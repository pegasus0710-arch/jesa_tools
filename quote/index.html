.dtq::after{content:"";position:absolute;right:12px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid currentColor;border-radius:3px;opacity:.55}
.dtq input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
.dtq input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* BJ31-APPLIED */
/* 색(10-30 제이 지정): 초록 #0a1931 · 바탕 베이지 #F0E8DB · 주황 #F56D03 — 메인 = 짙은 초록 #0a1931(고른 것 · 기능 · 로고 배지), 이벤트 = 진한 주황 #f56d03(주 단추 · 진행 표시) */
/* ══ Blog J 디자인 3.1 「정돈」 — 3.0 위에 덮어쓰는 다듬기 (10-30) ══
   1) 깊이는 3단만: 판(바탕) · 카드(머리카락 선 + 아주 옅은 그림자) · 들어감(입력 · 고르기 바탕)
   2) 이중 그림자(어두운 + 흰 빛) 없앰 → 흐릿함 · 뭉개짐 제거
   3) 모서리 4단계: 8 · 10 · 14 · 18px
   4) 고른 것 = 남색 선(1.5px) + 남색 글자, 주 버튼 = 앰버 한 곳(평평하게) */
:root{
  --navy:#0a1931;--amber:#f56d03;--brand:#0a1931;--accent:#f56d03;
  --paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--in-bg:#ece3d5;--up-bg:#f7f2ea;--pr-bg:#f3ece1;--press-bg:#f3ece1;--tray:#e9e0d1;--hover:#f5efe5;
  --hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.2);
  --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);
  --up-s:0 0 0 1px rgba(90,74,50,.09),0 1px 2px rgba(90,74,50,.06);
  --in:inset 0 0 0 1px rgba(90,74,50,.1);
  --press:inset 0 0 0 1.5px var(--navy,#0a1931);
  --sh-paper:0 1px 3px rgba(0,0,0,.06),0 14px 34px -14px rgba(60,48,30,.28);
  --r-s:8px;--r:10px;--r-m:14px;--r-l:18px;
}
/* 버튼: 평평하게, 그림자는 선 하나 */
.btn{border-radius:var(--r);box-shadow:var(--up-s);font-weight:600;transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--hover);box-shadow:0 0 0 1px var(--navy,#0a1931)}
.btn:active{transform:none;box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.btn.sm{border-radius:var(--r-s)}
.btn.go{background:var(--amber,#f56d03);color:#fff;box-shadow:0 1px 2px rgba(140,60,10,.25),inset 0 -1px 0 rgba(0,0,0,.08);outline:0}
.btn.go:hover{background:#d95f00;box-shadow:0 1px 2px rgba(140,60,10,.25),0 0 0 3px rgba(245,109,3,.22);outline:0}
.btn.nv,.btn.p,.btn.accent{background:var(--navy,#0a1931);color:#fff;box-shadow:0 1px 2px rgba(6,15,30,.25)}
.btn.nv:hover,.btn.p:hover,.btn.accent:hover{background:#060f1f;box-shadow:0 0 0 3px rgba(10,25,49,.16)}
.ib{box-shadow:var(--up-s);border-radius:var(--r)}
.ib:hover{box-shadow:0 0 0 1px var(--navy,#0a1931)}
/* 고르기(세그먼트): 바탕은 들어감 한 장, 고른 칸은 흰 카드 + 머리카락 선 */
.vt,.seg,.tvbar{background:var(--tint);box-shadow:var(--in);border-radius:var(--r);padding:3px;gap:2px}
.vt button,.seg button,.tvbar button{border-radius:var(--r-s);font-weight:600}
.vt button.on,.seg button.on,.tvbar button.on{background:var(--card);color:var(--ink,#1f2125);font-weight:700;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
/* 칩: 테두리만, 고른 칩은 남색 선 + 남색 글자 */
.chip{background:transparent;box-shadow:inset 0 0 0 1px var(--hair2);border-radius:999px;padding:7px 13px;font-weight:600}
.chip:hover{background:var(--card);box-shadow:inset 0 0 0 1px var(--navy,#0a1931)}
.chip.on,.chip.on:hover{background:var(--card);color:var(--navy,#0a1931);box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931);font-weight:700}
/* 입력: 들어감 대신 흰 바탕 + 선 (읽기 쉬움) */
.inp,input.inp,select.inp,textarea.inp{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1);outline:0}
.srch{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1)}
/* 카드 · 줄 */
.tcard,.row,.sgc,.pg{box-shadow:var(--up-s);border-radius:var(--r-m)}
.tcard:hover,.tgt:hover,.tlist .tcard.trip:hover{box-shadow:0 0 0 1px var(--navy,#0a1931),0 6px 18px -10px rgba(10,25,49,.3)}
body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div{box-shadow:var(--up);border-radius:var(--r-l)}
.sheet .in,.sheet>div{border-radius:var(--r-l) var(--r-l) 0 0}
/* 이름표(섹션 머리): 작게 · 자간 · 흐린 먹 */
.lbl{font-size:12.5px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.sgc h4{font-size:14px;letter-spacing:-.01em}
/* 안내 상자: 상자 대신 왼쪽 선 하나 */
.note,.note.w,.stnote{background:transparent;box-shadow:none;border-radius:0;border-left:3px solid var(--hair2);padding:4px 0 4px 12px}
.note.w{border-left-color:#d98a1a}
/* 작은 표 · 뱃지 */
.okb,.dd{border-radius:6px}
/* 도구 작업대(3.0 틀): 교정대 · 작업 패널 · 눈금자 */
.tray{background:var(--tray);box-shadow:var(--in);border-radius:var(--r-l)}
.wp{box-shadow:var(--up);border-radius:var(--r-l)}
.ruler{box-shadow:var(--in);background:var(--tint)}
.tcard.on,.tcard.on:hover{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.wp-f{box-shadow:0 -1px 0 var(--hair)}
.brand .lg,.pcbar .lg{box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 -2px 0 rgba(0,0,0,.1)!important}
/* 고른 것 = 남색(10-30 제이): 고른 칸의 아이콘 · 글자 · 점은 남색, 주황은 진행 표시와 주 단추에만 */
.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on,.tabs button.on,.chip.on{color:var(--navy,#0a1931)}
.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.tabs button.on svg,.chip.on svg,.li.on svg,.tcard.on svg{color:var(--navy,#0a1931);opacity:1}
.tcard.on i{background:var(--navy,#0a1931)}
.pvth button.on,.vw2-strip button.on{box-shadow:0 0 0 3px var(--navy,#0a1931)}
.li.on{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
/* 눈금자 진행(공통 · 10-22 제이 규칙): 단계 이름은 글자만 — 박스 · 테두리 · 바탕 없음.
   올리면 번호 앰버 + 글자 밑 앰버 2px 밑줄, 지금 단계는 굵게만, 키보드 포커스만 남색 윤곽선 */
.ruler{background:transparent!important;box-shadow:none!important;border-bottom:1px solid var(--hair2);border-radius:0!important}
.ruler button,.ruler button:hover,.ruler button.cur,.ruler button.done{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important}
.ruler button:hover{color:var(--ink)}
.ruler button:hover .rn{color:var(--amber,#f56d03)}
.ruler button:not(.cur):hover{text-decoration:underline;text-decoration-color:var(--amber,#f56d03);text-decoration-thickness:2px;text-underline-offset:6px}
.ruler button:focus{outline:0}
.ruler button:focus-visible{outline:2px solid var(--navy,#0a1931);outline-offset:2px;border-radius:6px!important}
/* 로고 배지(도구 아이콘) 바탕 = 남색 — Blog J 고유 색(10-30 제이). 분야색은 배지에서 빼고 표시에만 */
.brand .lg,.pcbar .lg{background:var(--navy,#0a1931)!important;color:#fff}
.brand .lg svg,.pcbar .lg svg{color:#fff}

/* 고른 것 = 초록 바탕 + 흰 글자(10-30 제이) — 카드 · 칩 · 나눔 단추 · 보기 단추 · 날 목록 */
.tcard.on,.tcard.on:hover,.li.on,.chip.on,.chip.on:hover,.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.tcard.on *,.li.on *,.chip.on *,.vt button.on *,.seg button.on *,.tvbar button.on *,.pcnav button.on *{color:#fff!important}
.tcard.on small,.li.on small,.tcard.on .muted,.li.on .k,.chip.on small{color:rgba(255,255,255,.78)!important}
.tcard.on i{background:#fff!important}
.tcard.on svg,.chip.on svg,.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.li.on svg{color:#fff!important}
.pdays>button.on,.pdays>button.on:hover,.pside button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.pdays>button.on *,.pside button.on *{color:#fff!important}.pdays>button.on small,.pside button.on small{color:rgba(255,255,255,.78)!important}
/* 주 단추 = 앱의 메인 색(10-30 제이 안): 주황은 단추에 쓰지 않고 진행 구슬 · 로고 점 · 새 소식 같은 작은 표시에만 */
.btn.go{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.3),inset 0 -1px 0 rgba(0,0,0,.12)!important;outline:0!important}
.btn.go:hover{background:var(--navy-h,#060f1f)!important;box-shadow:0 0 0 3px rgba(10,25,49,.2)!important}
.btn.go:disabled{background:#d6cdbd!important;color:#8d8574!important;box-shadow:none!important}
:root{--navy-h:#060f1f}
/* ══ 10-30 제이: 색을 칠하는 단추는 적당한 크기로만, 큰 카드 · 큰 단추는 3.0의 돋움(음영) · 들어감(음각)으로 ══ */
:root{
  --up3:9px 10px 22px rgba(160,140,108,.38),-7px -7px 18px rgba(255,255,255,.85);
  --up3s:3px 4px 9px rgba(160,140,108,.34),-3px -3px 8px rgba(255,255,255,.88);
  --in3:inset 3px 3px 8px rgba(160,140,108,.34),inset -3px -3px 8px rgba(255,255,255,.8);
  --press3:inset 3px 3px 7px rgba(150,128,95,.42),inset -2px -2px 5px rgba(255,255,255,.72);
}
/* 큰 판 · 패널 = 돋움 */
.wp,body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div,.pdays,.sgc{box-shadow:var(--up3)!important}
/* 큰 고르기 카드 · 날 목록 · 목록 카드 = 작은 돋움, 고르면 눌림(음각) + 앱 색 테두리 · 글자 · 점 (바탕을 칠하지 않음) */
.tcard,.pdays>button[data-day],.row,.pg{box-shadow:var(--up3s)!important}
.pdays>button.tname{box-shadow:none!important;background:transparent!important}
.tcard:hover,.pdays>button[data-day]:hover,.tlist .tcard.trip:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.tcard.on,.tcard.on:hover,.pdays>button.on,.pdays>button.on:hover,.pside button.on,.li.on{background:var(--press-bg,#f3ece1)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--press3),inset 0 0 0 2px var(--navy,#0a1931)!important}
.tcard.on *,.pdays>button.on *,.pside button.on *,.li.on *{color:var(--navy,#0a1931)!important}
.tcard.on small,.pdays>button.on small,.pside button.on small,.li.on small{color:var(--ink2,#5b5547)!important}
.tcard.on i{background:var(--navy,#0a1931)!important}
.tcard.on svg,.li.on svg{color:var(--navy,#0a1931)!important}
/* 교정대 · 나눔 단추 홈 = 들어감(음각) */
.tray{box-shadow:var(--in3)!important}
.vt,.seg,.tvbar{box-shadow:var(--in3)!important;background:var(--tint)!important}
/* 색 단추는 적당한 크기 — 주 단추 높이 44, 좌우 여유만 */
.btn.go{min-height:44px!important;padding:10px 20px!important;font-size:15px!important;flex:0 0 auto}
/* 폭이 넓은 큰 단추(가로 꽉 찬 단추)는 칠하지 않고 돋움 + 앱 색 글자 */
.btn.go.w,.btn.w.nv{background:var(--card,#fcf9f4)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--up3s)!important;min-height:52px!important;font-weight:700}
.btn.go.w svg,.btn.w.nv svg{color:var(--navy,#0a1931)!important}
.btn.go.w:hover,.btn.w.nv:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.btn.go.w:active,.btn.w.nv:active{box-shadow:var(--press3)!important}
/* 눈금자 구슬: 지금 위치를 알려 주듯 살짝 반짝임(10-30 제이) — 퍼지는 고리 + 은은한 빛, 움직임 줄이기 설정이면 멈춤 */
.ruler .bead,.ruler-dot,.ruler .rdot{animation:bjBeadGlow 2.6s ease-in-out infinite}
.ruler .bead::after,.ruler-dot::after,.ruler .rdot::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid rgba(245,109,3,.55);animation:bjBeadRing 2.6s ease-out infinite;pointer-events:none}
@keyframes bjBeadGlow{0%,100%{filter:brightness(1);box-shadow:2px 3px 5px rgba(120,70,20,.35),inset 2px 2px 3px rgba(255,255,255,.45)}50%{filter:brightness(1.18);box-shadow:0 0 10px 3px rgba(255,150,50,.55),inset 2px 2px 3px rgba(255,255,255,.6)}}
@keyframes bjBeadRing{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.ruler .bead::after,.ruler-dot::after,.ruler .rdot::after{animation-duration:4s}.ruler .bead,.ruler-dot,.ruler .rdot{animation-duration:4s}}
@media print{.ruler .bead,.ruler .bead::after,.ruler-dot,.ruler-dot::after,.ruler .rdot,.ruler .rdot::after{animation:none}}
/* 고르기 칸(select) · 체크 — 입력칸과 같이 카드 바탕 + 선, 체크는 앱 색 */
select,.t-cal select,select.inp{background-color:var(--card)!important;box-shadow:inset 0 0 0 1px var(--hair2)!important;border-radius:var(--r)!important}
select:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.12)!important;outline:0}
input[type=checkbox],input[type=radio]{accent-color:var(--navy,#0a1931)}
input[type=text]:not(.inp),input[type=number]:not(.inp){background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
input[type=text]:not(.inp):focus,input[type=number]:not(.inp):focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.12);outline:0}
/* 10-30 밤: 떠 있는 「+」 단추 — 주황 단추 금지(3.1 2-1) → 앱 색 */
.fab{background:var(--navy,#0a1931);color:#fff;box-shadow:0 1px 2px rgba(6,15,30,.25),0 8px 20px -6px rgba(6,15,30,.45)}
.fab:hover{background:#060f1f}
/* 10-30 밤: 머리 막대 안 눈금자(라벨 · 김치)도 3.1 6번 — 홈 · 바탕 상자 없이 */
.bar-in .ruler::before{display:none!important}

function hangul(n){n=Math.round(Math.abs(+n||0));if(!n)return'영';const D=['','일','이','삼','사','오','육','칠','팔','구'],U=['','십','백','천'],B=['','만','억','조','경'];

const FILE='견적서발행기.json';

function calc(doc){const mode=doc.vat||'sep';let supply=0,tax=0;const rows=(doc.lines||[]).map(l=>{const amt=Math.round(numIn(l.qty)*numIn(l.price));let sp,tx;
  if(mode==='inc'){sp=Math.round(amt/1.1);tx=amt-sp;}else if(mode==='none'){sp=amt;tx=0;}else{sp=amt;tx=Math.floor(amt*0.1);}supply+=sp;tax+=tx;return {sp,tx};});
  return {rows,supply,tax,total:supply+tax};}
function nextNo(type,date){const pre=date.replace(/-/g,'').slice(2);const k=TYPES[type].pre+' '+pre+'-';let n=0;D.docs.forEach(d=>{if(d.type===type&&d.no&&d.no.startsWith(k)){const x=+d.no.slice(k.length);if(x>n)n=x;}});return k+pad(n+1);}
function newDoc(type,from){const date=today();const d={id:rid('d'),type,no:nextNo(type,date),date,clientId:from?from.clientId:'',client:from?Object.assign({},from.client):{},lines:from?from.lines.map(l=>Object.assign({},l)):[{name:'',spec:'',qty:1,unit:'',price:0}],vat:from?from.vat:(D.set.vat||'sep'),valid:D.set.valid||30,due:'',note:from?from.note:'',from:from?from.id:'',created:Date.now(),updated:Date.now(),copies:D.set.copies||2};D.docs.unshift(d);return d;}
const isBlank=d=>!d.clientId&&!(d.client&&d.client.name)&&!(d.lines||[]).some(l=>l.name||numIn(l.price));

/* 품목 표 한 쪽 — P = [{l, i(원래 순서)}], start = 앞쪽까지 줄 수, fill = 채울 줄 수, last = 마지막 쪽 */
function linesTable(d,c,P,start,fill,compact,last){const vat=d.vat!=='none';let h=`<table><thead><tr><th style="width:8mm">No</th><th>품목</th><th style="width:20mm">규격</th><th style="width:13mm">수량</th><th style="width:11mm">단위</th><th style="width:22mm">단가</th><th style="width:25mm">공급가액</th>${vat?'<th style="width:20mm">세액</th>':''}</tr></thead><tbody>`;
  P.forEach(({l,i},k)=>{const r=c.rows[i];h+=`<tr><td class="c">${start+k+1}</td><td>${esc(l.name)}</td><td class="c">${esc(l.spec)}</td><td class="r">${esc(l.qty)}</td><td class="c">${esc(l.unit)}</td><td class="r">${won(l.price)}</td><td class="r">${won(r.sp)}</td>${vat?`<td class="r">${won(r.tx)}</td>`:''}</tr>`;});

    <div class="row" style="justify-content:flex-end;margin-top:12px"><span class="muted" id="pkN" style="margin-right:auto">${one?'줄을 누르면 바로 들어가요':'줄을 눌러 고르세요 — 여러 분류에서 골라도 돼요'}</span><button class="btn" id="pkX">닫기</button>${one?'':'<button class="btn p" id="pkOk" disabled>넣기</button>'}</div></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  const drawC=()=>{o.querySelector('#pkC').innerHTML=catsHtml(S.pcat);o.querySelectorAll('#pkC [data-cat]').forEach(b=>b.onclick=()=>{S.pcat=b.dataset.cat;drawC();drawB();});};
  const drawN=()=>{if(one)return;const ok=o.querySelector('#pkOk');ok.disabled=!sel.size;ok.textContent=sel.size?`${sel.size}개 넣기`:'넣기';o.querySelector('#pkN').textContent=sel.size?`고른 품목 ${sel.size}개`:'줄을 눌러 고르세요 — 여러 분류에서 골라도 돼요';};
  const drawB=()=>{const L=D.items.filter(x=>x.name&&(q?itemMatch(x,q):inCat(x,S.pcat)));
    o.querySelector('#pkB').innerHTML=L.map(x=>{const on=sel.has(x.id);return `<tr class="clk ${on?'sel':''}" data-id="${x.id}">${one?'':`<td><input type="checkbox" ${on?'checked':''} tabindex="-1" aria-label="고르기"></td>`}<td><b style="font-weight:600">${esc(x.name)}</b>${(q||S.pcat==='')&&x.cat?` <span class="chip">${esc(x.cat)}</span>`:''}</td><td class="muted">${esc(x.spec||'')}</td><td>${esc(x.unit||'')}</td><td class="num" style="text-align:right">${x.price?won(x.price):''}</td>${one?'':`<td style="text-align:right">${on?`<input class="q" type="text" inputmode="decimal" value="${esc(sel.get(x.id))}" aria-label="수량">`:''}</td>`}</tr>`;}).join('')||`<tr><td colspan="6" class="empty">${q?'찾는 품목이 없어요.':'이 분류에 품목이 없어요.'}</td></tr>`;
    o.querySelectorAll('#pkB tr[data-id]').forEach(tr=>{const id=tr.dataset.id;
      tr.onclick=e=>{if(e.target.classList.contains('q'))return;const it=D.items.find(x=>x.id===id);if(one){close();cb([[it,1]]);return;}if(sel.has(id))sel.delete(id);else sel.set(id,'1');drawB();drawN();const qi=o.querySelector(`#pkB tr[data-id="${id}"] .q`);if(qi){qi.focus();qi.select();}};
      const qi=tr.querySelector('.q');if(qi){qi.oninput=()=>sel.set(id,qi.value);qi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();o.querySelector('#pkOk').click();}};}});};
  drawC();drawB();drawN();
  const qe=o.querySelector('#pkQ');qe.oninput=()=>{q=qe.value.trim();drawB();};setTimeout(()=>qe.focus(),30);
  o.querySelector('#pkX').onclick=close;o.onclick=e=>{if(e.target===o)close();};
  o.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  if(!one)o.querySelector('#pkOk').onclick=()=>{const out=D.items.filter(x=>sel.has(x.id)).map(x=>[x,numIn(sel.get(x.id))||1]);if(!out.length)return;close();cb(out);};}

/* ── 품목 ── */
function renderItems(){if(S.icat==null||(S.icat&&S.icat!==NOCAT&&!catList().some(([c])=>c===S.icat)))S.icat='';
  const iq=S.iq||'';const cur=S.icat;
  $('#main').innerHTML=`<section class="panel" style="margin-top:12px"><div class="row" style="margin-bottom:12px"><b style="font-size:17px">품목</b><span class="muted">분류를 넣어 두면 문서에서 「목록에서 고르기」로 분류별로 골라 넣을 수 있어요.</span><span style="flex:1"></span><input type="search" id="iQ" placeholder="품목 · 규격 · 분류 찾기" value="${esc(iq)}" style="width:min(220px,100%)"><button class="btn s" id="iXl">엑셀로 저장</button><button class="btn s" id="iPaste">엑셀에서 붙여넣기</button><button class="btn p s" id="iAdd">+ 품목 추가</button></div>
  <div class="itl"><div><div class="cats" id="iC">${catsHtml(cur)}</div>${cur&&cur!==NOCAT?`<div class="row" style="margin-top:8px;gap:10px;padding:0 4px"><button class="lk" id="iRen">분류 이름 바꾸기</button><button class="lk red" id="iCdel">분류 지우기</button></div>`:''}<p class="muted" style="margin:10px 4px 0;font-size:12.5px">새 분류는 품목의 「분류」 칸에 이름을 쓰면 생겨요.</p></div>
  <div class="wrapt"><table class="tbl"><thead><tr><th style="width:17%">분류</th><th style="width:31%">품목</th><th>규격</th><th style="width:10%">단위</th><th style="width:15%;text-align:right">단가</th><th></th></tr></thead><tbody>${(()=>{const L=D.items.map((x,i)=>[x,i]).filter(([x])=>iq?itemMatch(x,iq):inCat(x,cur));
    return L.map(([x,i])=>`<tr data-r="${i}"><td><input type="text" data-k="cat" list="catList" value="${esc(x.cat||'')}" placeholder="분류 없음"></td><td><input type="text" data-k="name" value="${esc(x.name)}"></td><td><input type="text" data-k="spec" value="${esc(x.spec||'')}"></td><td><input type="text" data-k="unit" value="${esc(x.unit||'')}"></td><td><input type="text" inputmode="numeric" data-k="price" value="${x.price?won(x.price):''}" style="text-align:right"></td><td><button class="lk red" data-idel="${i}">삭제</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">${D.items.length?(iq?'찾는 품목이 없어요.':'이 분류에 품목이 없어요.'):'품목이 없어요. 자주 쓰는 품목을 넣어 두면 견적서 쓰기가 빨라져요.'}</td></tr>`;})()}</tbody></table></div></div>
  <datalist id="catList">${catList().map(([c])=>`<option value="${esc(c)}">`).join('')}</datalist></section>`;
  const drawC=()=>{const box=$('#iC');if(box){box.innerHTML=catsHtml(S.icat);bindC();}const dl=$('#catList');if(dl)dl.innerHTML=catList().map(([c])=>`<option value="${esc(c)}">`).join('');};
  const bindC=()=>document.querySelectorAll('#iC [data-cat]').forEach(b=>b.onclick=()=>{S.icat=b.dataset.cat;S.iq='';renderItems();});bindC();
  document.querySelectorAll('[data-r] input').forEach(inp=>{const i=+inp.closest('tr').dataset.r,k=inp.dataset.k;inp.oninput=()=>{D.items[i][k]=k==='price'?numIn(inp.value):inp.value;save();};if(k==='price')inp.onblur=()=>{inp.value=D.items[i].price?won(D.items[i].price):'';};if(k==='cat')inp.onchange=()=>{D.items[i].cat=inp.value.trim();inp.value=D.items[i].cat;save();drawC();};});
  document.querySelectorAll('[data-idel]').forEach(b=>b.onclick=()=>{D.items.splice(+b.dataset.idel,1);save();renderItems();});
  const iQ=$('#iQ');let comp=false;iQ.addEventListener('compositionstart',()=>comp=true);iQ.addEventListener('compositionend',()=>{comp=false;iQ.dispatchEvent(new Event('input'));});
  iQ.oninput=()=>{if(comp)return;S.iq=iQ.value.trim();const pos=iQ.selectionStart;renderItems();const n=$('#iQ');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  const curCat=()=>cur&&cur!==NOCAT?cur:'';
  $('#iAdd').onclick=()=>{S.iq='';D.items.push({id:rid('i'),cat:curCat(),name:'',spec:'',unit:'',price:0});save();renderItems();const r=document.querySelector('[data-r]:last-child [data-k="name"]');if(r)r.focus();};
  if($('#iRen'))$('#iRen').onclick=()=>{const nv=(prompt(`「${cur}」 분류의 새 이름`,cur)||'').trim();if(!nv||nv===cur)return;D.items.forEach(x=>{if((x.cat||'').trim()===cur)x.cat=nv;});S.icat=nv;save();renderItems();toast('분류 이름을 바꿨어요.');};
  if($('#iCdel'))$('#iCdel').onclick=()=>{if(!confirm(`「${cur}」 분류를 지울까요? 품목은 지우지 않고 「분류 없음」으로 옮겨요.`))return;D.items.forEach(x=>{if((x.cat||'').trim()===cur)x.cat='';});S.icat='';save();renderItems();};
  $('#iXl').onclick=()=>{const L=D.items.filter(x=>x.name).slice().sort((a,b)=>(a.cat||'힣').localeCompare(b.cat||'힣','ko'));XL.save('품목목록_'+today()+'.xlsx',[XL.table('품목',['품목','규격','단위','단가','분류'],L.map(x=>[x.name,x.spec||'',x.unit||'',+x.price||0,x.cat||'']),[32,14,8,13,16],[3])]);toast('엑셀로 받았어요 — 고친 뒤 표를 복사해 「엑셀에서 붙여넣기」로 다시 넣을 수 있어요.');};
  $('#iPaste').onclick=()=>pasteDlg(rows=>{rows.forEach(r=>{if(!r.cat)r.cat=curCat();const ex=D.items.find(x=>x.name===r.name);if(ex)Object.assign(ex,{spec:r.spec,unit:r.unit,price:r.price,cat:r.cat||ex.cat||''});else D.items.push({id:rid('i'),cat:r.cat,name:r.name,spec:r.spec,unit:r.unit,price:r.price});});save();renderItems();toast(rows.length+'개를 넣었어요(같은 이름은 고쳤어요).');},true);}

/* ── 엑셀(.xlsx) 만들기 — 외부 라이브러리 없이 ── */
const XL=(()=>{
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const enc=new TextEncoder();
  function zip(files){const parts=[],cen=[];let off=0;
    for(const [name,text] of files){const nb=enc.encode(name),db=enc.encode(text),c=crc(db);
      const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nb,db);
      const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,0,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,db.length,true);e.setUint32(24,db.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
      cen.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+db.length;}
    const cs=cen.reduce((n,b)=>n+b.length,0);const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
    return new Blob([...parts,...cen,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
  const x=v=>String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCodePoint(65+m)+s;n=(n-m-1)/26;}return s;};
  /* 스타일 번호: 0 기본 · 1 제목 · 2 머리칸 · 3 글자칸 · 4 숫자칸 · 5 이름칸(굵게 · 회색) · 6 굵은 숫자칸 · 7 작은 글씨 · 8 비고칸 · 9 가운데칸 · 10 굵은 글자칸 · 11 굵게(테두리 없음) · 12 굵은 큰 글씨 */
  const STY=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="5"><font><sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font><font><b/><sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font><font><b/><sz val="20"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font><font><sz val="9"/><color rgb="FF666666"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font><font><b/><sz val="12"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF1F1F1"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF444444"/></left><right style="thin"><color rgb="FF444444"/></right><top style="thin"><color rgb="FF444444"/></top><bottom style="thin"><color rgb="FF444444"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="13"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="3" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf numFmtId="3" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  /* sheet = {name, cols:[너비], rows:[{h, c:[셀]}], merges:['A1:H1'], fit:true}
     셀 = null | 값 | {v, s, f}  (f는 = 없이 수식) */
  function sheetXml(sh){let r='';sh.rows.forEach((row,ri)=>{if(!row)return;const cells=row.c||row;let cs='';
      cells.forEach((c,ci)=>{if(c==null)return;const o=typeof c==='object'?c:{v:c};const ref=col(ci)+(ri+1);const s=o.s?` s="${o.s}"`:'';
        if(o.f!=null)cs+=`<c r="${ref}"${s}><f>${x(o.f)}</f>${o.v!=null&&o.v!==''?`<v>${+o.v||0}</v>`:''}</c>`;
        else if(typeof o.v==='number'&&isFinite(o.v))cs+=`<c r="${ref}"${s}><v>${o.v}</v></c>`;
        else if(o.v==null||o.v==='')cs+=`<c r="${ref}"${s}/>`;
        else cs+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${x(o.v)}</t></is></c>`;});
      r+=`<row r="${ri+1}"${row.h?` ht="${row.h}" customHeight="1"`:''}>${cs}</row>`;});
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${sh.fit?'<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>':''}<sheetViews><sheetView workbookViewId="0"${sh.grid===false?' showGridLines="0"':''}>${sh.freeze?`<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze+1}" activePane="bottomLeft" state="frozen"/>`:''}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16.5"/>
<cols>${sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${r}</sheetData>${sh.merges&&sh.merges.length?`<mergeCells count="${sh.merges.length}">${sh.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:''}<printOptions horizontalCentered="1"/><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="portrait"${sh.fit?' fitToWidth="1" fitToHeight="0"':''}/></worksheet>`;}
  function book(sheets){const n=sheets.length,ix=[...Array(n).keys()];
    const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${ix.map(i=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
      ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`],
      ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${ix.map(i=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml',STY]];
    sheets.forEach((s,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)]));return zip(files);}
  /* 간단한 표(머리줄 + 줄들) */
  function table(name,head,rows,widths,numCols){return {name,cols:widths,freeze:1,rows:[{h:22,c:head.map(v=>({v,s:2}))}].concat(rows.map(r=>r.map((v,i)=>({v,s:(numCols||[]).includes(i)?4:3}))))};}

  const hr=r;put(r,0,{v:'No',s:2});['품목','규격','수량','단위','단가','공급가액'].forEach((v,i)=>put(r,i+1,{v,s:2}));if(vat)put(r,7,{v:'세액',s:2});rows[r].h=22;r++;

/* 도장: 흰 배경 → 투명, 빨간 기 강조, 여백 잘라 256px */
function cleanStamp(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),p=d.data;let x0=w,y0=h,x1=0,y1=0;
  for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];const red=r-(g+b)/2;const light=(r+g+b)/3;let a=0;if(red>40)a=Math.min(255,red*3);else if(light<110)a=Math.min(255,(110-light)*2.2);if(a<30)a=0;p[i+3]=a;if(a){p[i]=Math.max(r,170);p[i+1]=Math.min(g,60);p[i+2]=Math.min(b,60);const k=i/4,xx=k%w,yy=(k-xx)/w;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy;}}
  x.putImageData(d,0,0);URL.revokeObjectURL(u);if(x1<=x0||y1<=y0){no();return;}const cw=x1-x0+1,ch=y1-y0+1,S2=256,k=S2/Math.max(cw,ch);const o=document.createElement('canvas');o.width=o.height=S2;o.getContext('2d').drawImage(c,x0,y0,cw,ch,(S2-cw*k)/2,(S2-ch*k)/2,cw*k,ch*k);ok(o.toDataURL('image/png'));};im.onerror=()=>{URL.revokeObjectURL(u);no();};im.src=u;});}
