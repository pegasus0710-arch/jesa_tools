/* ══════════ 자기소개서 쓰기 — 한 페이지 · 디자인 3.0 "입체 교정지" ══════════ */
:root{
--pan:#f0e8db;--up-bg:#f1ebe1;--card:#f4efe6;--in-bg:#e7e0d2;--pr-bg:#e6dfd1;--tray:#e2dacb;--paper:#fffdf8;
--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;--line:#ddd5c5;
--navy:#0a1931;--amber:#f56d03;--red:#c23a2b;--green:#2e7d4f;--cat:#1f7f8f;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-m:6px 7px 16px rgba(160,140,108,.38),-5px -5px 12px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--paper-sh:10px 12px 26px rgba(120,100,70,.30),-5px -5px 12px rgba(255,255,255,.6);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
--head:"BlogJ-Head","Pretendard",var(--font);
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pan)}
body{color:var(--ink);font-family:var(--font);font-size:15px;letter-spacing:-.01em;line-height:1.5;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
[hidden]{display:none!important}
svg.i{display:inline-block;vertical-align:-3px;flex-shrink:0}
.muted{color:var(--ink3)}
.sp{flex:1}
.bad{color:var(--red)!important}.ok{color:var(--green)!important}
.app{max-width:1440px;margin:0 auto;padding:0 24px 40px}

/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--card);box-shadow:var(--up-s);font-weight:700;font-size:15px;color:var(--navy)}
.btn:hover:not(:disabled){box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.btn:active:not(:disabled){box-shadow:var(--press)}
.btn.p{background:var(--navy);color:#fff;box-shadow:var(--up-s)}
.btn.p:hover:not(:disabled){background:#060f1f}
.btn.go{background:var(--amber);color:var(--ink);font-weight:800}
.btn.go:hover:not(:disabled){box-shadow:var(--up-s),inset 0 0 0 2px var(--ink)}
.btn:disabled{opacity:.45}
.btn.s{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.w{width:100%}
.lnk{color:var(--navy);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:var(--card);box-shadow:var(--up-s);color:var(--ink2)}
.ib:hover:not(:disabled){color:var(--navy);box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.ib.del:hover:not(:disabled){color:var(--red);box-shadow:var(--up-s),inset 0 0 0 2px var(--red)}
.ib:disabled{opacity:.3;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;background:var(--card);box-shadow:var(--up-s);font-size:14px;font-weight:600}
.chip:hover{box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.chip.on{background:var(--pr-bg);box-shadow:var(--press)}
label.f{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
label.f span{font-weight:500;font-size:13px;color:var(--ink3)}
input[type=text],input[type=number],select,.m-b textarea,.qe textarea,.hb textarea,.start textarea{width:100%;border:0;border-radius:11px;padding:10px 12px;background:var(--in-bg);box-shadow:var(--in);font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:var(--in),inset 0 0 0 2px var(--navy)}
textarea{resize:vertical;line-height:1.6}
.hint{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:6px}
.mh{font-size:14.5px;font-weight:800;margin:4px 0 8px}
.mh span{font-weight:500;font-size:13px;color:var(--ink3);margin-left:4px}

/* 머리 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;margin:0 -24px 20px;padding:12px 24px;background:var(--up-bg);box-shadow:0 3px 12px rgba(160,140,108,.28)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lg{position:relative;width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;font-size:19px;font-family:Georgia,serif}
.lg i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--amber);border:2.5px solid var(--up-bg)}
.brand small{display:block;font-size:12.5px;color:var(--ink3);font-weight:600}
.brand b{display:block;font-family:var(--head);font-size:19px;font-weight:800;line-height:1.2}
.cosel{position:relative;margin-left:14px}
.cobtn{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:12px;background:var(--in-bg);box-shadow:var(--in);text-align:left}
.cobtn small{font-size:12.5px;color:var(--ink3);font-weight:600}
.cobtn b{font-size:15.5px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cobtn:hover{box-shadow:var(--in),inset 0 0 0 2px var(--navy)}
.comenu{position:absolute;left:0;top:54px;width:340px;padding:16px;border-radius:16px;background:var(--up-bg);box-shadow:0 16px 40px rgba(60,48,30,.28);z-index:30}
.comenu label.f{margin-top:0}
.dlist{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:240px;overflow:auto;padding:2px}
.dlist li{display:flex;gap:6px;align-items:center}
.dl{flex:1;min-width:0;text-align:left;padding:9px 12px;border-radius:10px;background:var(--card);box-shadow:var(--up-s)}
.dl:hover{box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.dl b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl span{font-size:12.5px;color:var(--ink3)}
.comenu .mh{margin-top:14px}
.rsel{margin-left:8px}.rsel .comenu{width:360px}
.tb.new.on{box-shadow:var(--press),inset 0 0 0 2px var(--navy)}
.nb2{font-family:var(--mono);font-size:12.5px;background:var(--navy);color:#fff;border-radius:9px;padding:0 7px;line-height:20px}
.dl.cur{background:var(--pr-bg);box-shadow:inset 0 0 0 2px var(--navy)}
.mrow{display:flex;gap:16px;margin-top:12px;font-size:13.5px}
.saved{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2)}
.saved .i{color:var(--green)}
.saved.err{color:var(--red)}
.tb{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--up-s);font-weight:700;font-size:14.5px;color:var(--navy)}
.tb:hover:not(:disabled){box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.tb.p{background:var(--navy);color:#fff}
.tb.on{background:var(--pr-bg);box-shadow:var(--press),inset 0 0 0 2px var(--navy)}
.tb:disabled{opacity:.4;box-shadow:none}
.nb{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12.5px;line-height:20px}

/* ① 처음 화면 */
.start{display:flex;flex-direction:column;align-items:center;padding:30px 0 10px;text-align:center}
.eyebrow{font-size:15px;color:var(--ink2);font-weight:600}
.start h1{font-family:var(--head);font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.lead{font-size:17px;color:var(--ink2);line-height:1.6;margin:12px 0 34px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;width:100%;max-width:1140px;text-align:left}
.card{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:18px;background:var(--card);box-shadow:var(--up)}
.card.main{box-shadow:var(--up),inset 0 0 0 2px var(--navy)}
.card .tag{align-self:flex-start;font-size:13px;font-weight:700;color:var(--ink2);background:var(--in-bg);border-radius:6px;padding:3px 9px}
.card.main .tag{color:var(--navy)}
.card h2{font-family:var(--head);font-size:21px;font-weight:800;line-height:1.35}
.card>p{font-size:15px;color:var(--ink2);line-height:1.65}
.card textarea{flex:1;min-height:120px;font-size:14px}
.card .btn{min-height:50px;font-size:16px}
.b4{list-style:none;display:flex;flex-direction:column;gap:8px;flex:1}
.b4 li{padding:10px 14px;border-radius:10px;background:var(--pan);font-size:15px}
.b4 b{font-family:var(--mono);color:var(--navy);margin-right:10px}
.peek{flex:1;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;font-size:14px;line-height:1.75}
.peek p+p{margin-top:6px}
.g-lb{display:inline-block;font-size:12.5px;font-weight:700;color:var(--cat);border:1.5px solid var(--cat);border-radius:6px;padding:0 6px;margin-right:7px;line-height:1.5;vertical-align:1px}
.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:34px;font-size:15px;color:var(--ink2)}
.flow b{color:var(--ink)}
.flow span{display:flex;align-items:center;gap:8px}
.flow i{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700}
.flow em{font-style:normal}
.cont{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:14px;color:var(--ink2)}

/* ② 쓰는 화면 */
.work{display:grid;grid-template-columns:240px minmax(0,1fr) 360px;gap:20px;align-items:start}
.ilist{position:sticky;top:96px;display:flex;flex-direction:column;gap:8px}
.lh{font-size:14px;font-weight:800;color:var(--ink2);padding:0 4px}
.lh span{font-weight:500}
.ilist ol{list-style:none;display:flex;flex-direction:column;gap:8px}
.ilist li{border-radius:12px}
.it{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:12px;background:var(--card);box-shadow:var(--up-s)}
.it:hover{box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.on>.it{background:var(--pr-bg);box-shadow:var(--press),inset 0 0 0 2px var(--navy)}
.it .no{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:var(--in-bg);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px}
.on>.it .no{background:var(--navy);color:#fff}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .st{display:block;font-size:13px;color:var(--ink2)}
.it .st.bad,.it .st.ok{font-weight:700}
.mini{display:block;height:5px;border-radius:5px;background:var(--line);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--navy)}
.mini.over i{background:var(--red)}
.iact{display:flex;gap:6px;justify-content:flex-end;padding:6px 2px 2px}
.iact .ib{width:32px;height:32px}
.addi{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:12px;border:2px dashed #b9ae9a;font-weight:700;font-size:14.5px;color:var(--ink2);margin-top:2px}
.addi:hover{border-color:var(--navy);color:var(--navy)}
.prog{margin-top:8px;border-radius:12px;background:var(--in-bg);box-shadow:var(--in);padding:12px 14px;font-size:13.5px;color:var(--ink2);line-height:1.55}
.prog b{display:block;color:var(--ink);font-size:14px}
.bk{margin-top:8px;border-radius:12px;background:var(--card);box-shadow:var(--up-s);padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.55}
.bk b{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;margin-bottom:2px}
.bk div{display:flex;gap:14px;margin-top:8px;font-size:13.5px}
.tb.new{background:var(--in-bg);box-shadow:var(--in);color:var(--ink)}

.desk{display:flex;flex-direction:column;gap:12px;min-width:0}
.qcard{border-radius:14px;background:var(--up-bg);box-shadow:var(--up-m);padding:14px 18px}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink2)}
.qn{color:var(--navy)}
.qk{background:var(--in-bg);border-radius:6px;padding:2px 8px}
.mini-b{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:9px;background:var(--card);box-shadow:var(--up-s);font-size:13.5px;font-weight:700;color:var(--navy)}
.mini-b:hover{box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.qt{margin-top:8px;font-size:18px;font-weight:700;line-height:1.5;white-space:pre-line}
.qe{margin-top:6px;padding-top:4px;border-top:1px dashed var(--line)}
.qe2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.qe3{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btn.del{color:var(--red)}
.paper{position:relative;border-radius:6px;background:var(--paper);box-shadow:var(--paper-sh);padding:26px 32px 0}
.ttl{width:100%;border:0!important;box-shadow:none!important;background:transparent!important;border-bottom:1.5px dashed var(--line)!important;border-radius:0!important;padding:0 0 10px!important;font-size:17px!important;font-weight:700}
.ttl::placeholder{font-weight:500;color:#a39a88}
.ed{position:relative;margin:14px 0 0}
.ed textarea,.mir{display:block;width:100%;padding:0 0 20px;font:inherit;font-size:16.5px;line-height:1.95;letter-spacing:-.01em;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere}
.ed textarea{position:relative;z-index:1;border:0;background:transparent;resize:none;overflow:hidden;color:var(--ink);caret-color:var(--navy);box-shadow:none}
.ed textarea:focus{box-shadow:none}
.ed textarea::placeholder{color:#9b927f}
.mir{position:absolute;inset:0;color:transparent;pointer-events:none}
.mir .ov{background:rgba(194,58,43,.16);border-radius:2px}
.mir .m{border-radius:2px}
.mir .t-sp,.mir .t-ws,.mir .t-pu{text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:6px;background:rgba(194,58,43,.07)}
.mir .t-ck{text-decoration:underline wavy var(--navy);text-decoration-thickness:1.5px;text-underline-offset:6px}
.mir .t-da{text-decoration:underline dotted var(--navy);text-decoration-thickness:2px;text-underline-offset:6px}
.mir .lng{text-decoration:none;background:rgba(245,109,3,.16)}
.mir .on{outline:2px solid var(--red);outline-offset:1px;background:rgba(194,58,43,.14)}
.cbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 -32px;padding:12px 32px;border-top:1px solid var(--pan);position:sticky;bottom:0;background:var(--paper);border-radius:0 0 6px 6px;z-index:2}
.cv{font-size:15px;white-space:nowrap}
.cv>b{font-family:var(--mono);font-size:21px;font-weight:700}
.lim{font-weight:700;color:var(--navy);text-decoration:underline dotted;text-underline-offset:4px}
#limIn{width:110px;padding:6px 8px;font-size:15px}
.bar{position:relative;flex:1;min-width:120px;height:8px;border-radius:8px;background:var(--in-bg)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--navy)}
.bar.over i{background:var(--red)}
.bar em{position:absolute;left:80%;top:-4px;width:2px;height:16px;background:#8a8373}
.cm{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.cm b{display:inline-flex;align-items:center;gap:4px}
#basis{width:auto;padding:6px 10px;font-size:13.5px;font-weight:600;border-radius:9px}

/* 쓰기 도움 */
.help{position:sticky;top:96px;max-height:calc(100vh - 116px);display:flex;flex-direction:column;border-radius:16px;background:var(--up-bg);box-shadow:var(--up-m);overflow:hidden}
.help.chk{padding:16px;overflow:auto;display:block}
.sheetx{display:none}
.htabs{display:flex;gap:6px;padding:8px;background:var(--in-bg);flex-shrink:0}
.htabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2)}
.htabs button[aria-selected=true]{background:var(--card);color:var(--navy);font-weight:800;box-shadow:var(--up-s)}
.hb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.hh b{font-size:17px;font-weight:800}
.hh .hr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.hh p{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:4px}
.qa{border-radius:12px;background:var(--card);box-shadow:var(--up-s);padding:12px 14px}
.qa-h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800}
.qa-n{position:relative;width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.qa-n .i{display:none}.qa-n i{font-style:normal;font-size:12.5px}
.qa.done .qa-n{background:var(--green)}.qa.done .qa-n .i{display:block}.qa.done .qa-n i{display:none}
.qa textarea{margin-top:8px;font-size:14px;min-height:64px}
.qa-t{font-size:13px;color:var(--ink3);margin-top:6px;line-height:1.5}
.htip{font-size:13.5px;color:var(--ink2);line-height:1.6;display:flex;gap:6px}
.htip .i{color:var(--amber);margin-top:2px}
.hf p{font-size:13px;color:var(--ink2);text-align:center;margin-top:8px;line-height:1.5}
.hf .btn{min-height:50px;font-size:16px}
.exs{border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;font-size:14.5px;line-height:1.8}
.exs p+p{margin-top:8px}
.pairs{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.pairs li{border-radius:10px;background:var(--card);box-shadow:var(--up-s);padding:10px 12px}
.pairs s{display:block;color:var(--ink3)}
.pairs span{display:block;font-weight:600}
.exc{border-radius:12px;background:var(--card);box-shadow:var(--up-s);padding:4px 4px 10px}
.exh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;text-align:left;font-size:14.5px}
.exc .exp{font-size:13px;color:var(--ink2);padding:0 10px;line-height:1.5}
.exf{padding:0 10px}
.exf label.f{margin:8px 0 4px;font-size:13px}
.exf input,.exf textarea{font-size:14px!important;padding:8px 10px!important}
.exf .lnk{display:inline-block;margin-top:8px;font-size:13px}

/* 맞춤법 */
.flist{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fi{border-radius:12px;background:var(--card);box-shadow:var(--up-s);padding:12px 14px}
.fi.on{box-shadow:var(--up-s),inset 0 0 0 2px var(--red)}
.fi-h{width:100%;text-align:left;font-size:16px;line-height:1.5}
.fi-h s{color:var(--ink3)}
.ft{display:block;font-size:12.5px;font-weight:800;margin-bottom:2px}
.t-sp .ft,.t-ws .ft,.t-pu .ft{color:var(--red)}
.t-ck .ft,.t-da .ft{color:var(--navy)}
.fi p{font-size:13.5px;color:var(--ink2);line-height:1.55;margin:4px 0 8px}
.fa{display:flex;gap:6px;flex-wrap:wrap}
.fprev{font-size:13.5px!important;color:var(--ink)!important;background:var(--paper);border-radius:8px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:22px 10px;border-radius:12px;background:var(--card);box-shadow:var(--up-s);margin-top:12px}
.empty .i{color:var(--green)}
.empty span{font-size:13.5px;color:var(--ink2)}
.ext{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.ext-r{display:flex;align-items:center;gap:10px;margin-top:8px}
.ext-r div{flex:1;min-width:0}
.ext-r b{display:block;font-size:14px}
.ext-r span{font-size:12.5px;color:var(--ink3)}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hh+.btn{margin-top:12px}

/* 창 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(31,33,37,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.mbox{width:min(760px,100%);max-height:calc(100vh - 48px);overflow:auto;border-radius:18px;background:var(--up-bg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.sm{width:min(560px,100%)}
.mbox.wide{width:min(1180px,100%);height:calc(100vh - 48px);overflow:hidden}
.m-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:16px 20px;background:var(--up-bg);border-bottom:1px solid var(--line)}
.m-h b{font-size:18px;font-weight:800}
.m-h .ib{margin-left:auto}
.m-b{padding:16px 20px 22px}
.m-s{margin-top:20px}
.m-s h3{font-size:17px;margin-bottom:8px}
.m-s p{font-size:15px;line-height:1.85;margin-bottom:6px}
.g-exn{display:flex;gap:8px;font-size:13.5px;color:var(--ink2);line-height:1.6;background:var(--in-bg);border-radius:10px;padding:10px 12px}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kadd{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-radius:12px;background:var(--card);box-shadow:var(--up-s);font-size:14.5px;font-weight:700;text-align:left}
.kadd:hover{box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.kadd .i{color:var(--navy)}
.kadd.done{background:var(--pr-bg);box-shadow:var(--press);color:var(--ink2)}
.kadd.done .i{color:var(--green)}
.kadd em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--navy);background:var(--in-bg);border-radius:6px;padding:1px 6px}
.kadd.own{background:var(--in-bg);box-shadow:var(--in)}
.pv{display:flex;height:100%}
.pv-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--tray)}
.pv-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pv-h b{font-size:16px}.pv-h span{font-size:13.5px;color:var(--ink2)}
.pv-p{flex:1;overflow:auto;padding:4px 12px 12px}
.pgs{display:flex;flex-direction:column;align-items:center;gap:22px}
.pg,.a4m .pg{width:210mm;height:297mm;box-sizing:border-box;padding:18mm;background:#fff;position:relative;flex-shrink:0;font-family:"Malgun Gothic","맑은 고딕",var(--font);font-size:14px;line-height:1.85;color:#111}
.pgs .pg{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pg .in{height:100%;overflow:hidden}
.pg .pn{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:12.5px;color:#888;font-family:var(--mono)}
.a4m{position:absolute;left:-10000px;top:0;visibility:hidden}
.a4m .pg{height:auto}.a4m .in{height:auto;overflow:visible;display:flow-root}.a4m .hm{height:261mm}
.a4-t{text-align:center;font-size:24px;font-weight:800;letter-spacing:.3em}
.a4-c{text-align:right;font-size:13px;color:#555;margin:6px 0 22px}
.a4-gap{height:22px}
.pg h3{font-size:15px;font-weight:800;border-bottom:1.5px solid #111;padding-bottom:4px;margin-bottom:8px;line-height:1.5}
.a4-s{font-weight:700}
.pg p+p{margin-top:8px}
.a4-e{color:#999}
.pv-r{width:390px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:0 20px 20px;overflow:auto;background:var(--up-bg)}
.pv-r .m-h{margin:0 -20px;padding:16px 20px}
.box{border-radius:14px;background:var(--card);box-shadow:var(--up-s);padding:14px 16px}
.pc{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5}
.pc li{display:flex;gap:8px}
.pc li>span{font-weight:800;width:10px;flex-shrink:0}
.pc li.b>span,.pc li.b .lnk{color:var(--red)}
.pc .lnk{text-align:left;font-weight:600}
.okline{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--green)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* BJ31-APPLIED */
/* 색(10-30 제이 지정): 초록 #0a1931 · 바탕 베이지 #F0E8DB · 주황 #F56D03 — 메인 = 짙은 초록 #0a1931(고른 것 · 기능 · 로고 배지), 이벤트 = 진한 주황 #f56d03(주 단추 · 진행 표시) */
/* ══ Blog J 디자인 3.1 「정돈」 — 3.0 위에 덮어쓰는 다듬기 (10-30) ══
   1) 깊이는 3단만: 판(바탕) · 카드(머리카락 선 + 아주 옅은 그림자) · 들어감(입력 · 고르기 바탕)
   2) 이중 그림자(어두운 + 흰 빛) 없앰 → 흐릿함 · 뭉개짐 제거
   3) 모서리 4단계: 8 · 10 · 14 · 18px
   4) 고른 것 = 남색 선(1.5px) + 남색 글자, 주 버튼 = 앰버 한 곳(평평하게) */
:root{
  --navy:#0a1931;--amber:#f56d03;--brand:#0a1931;--accent:#f56d03;
  --paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--in-bg:#ece3d5;--up-bg:#f7f2ea;--pr-bg:#f3ece1;--press-bg:#f3ece1;--tray:#e9e0d1;--hover:#f5efe5;
  --hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.2);
  --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);
  --up-s:0 0 0 1px rgba(90,74,50,.09),0 1px 2px rgba(90,74,50,.06);
  --in:inset 0 0 0 1px rgba(90,74,50,.1);
  --press:inset 0 0 0 1.5px var(--navy,#0a1931);
  --sh-paper:0 1px 3px rgba(0,0,0,.06),0 14px 34px -14px rgba(60,48,30,.28);
  --r-s:8px;--r:10px;--r-m:14px;--r-l:18px;
}
/* 버튼: 평평하게, 그림자는 선 하나 */
.btn{border-radius:var(--r);box-shadow:var(--up-s);font-weight:600;transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--hover);box-shadow:0 0 0 1px var(--navy,#0a1931)}
.btn:active{transform:none;box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.btn.sm{border-radius:var(--r-s)}
.btn.go{background:var(--amber,#f56d03);color:#fff;box-shadow:0 1px 2px rgba(140,60,10,.25),inset 0 -1px 0 rgba(0,0,0,.08);outline:0}
.btn.go:hover{background:#d95f00;box-shadow:0 1px 2px rgba(140,60,10,.25),0 0 0 3px rgba(245,109,3,.22);outline:0}
.btn.nv,.btn.p,.btn.accent{background:var(--navy,#0a1931);color:#fff;box-shadow:0 1px 2px rgba(6,15,30,.25)}
.btn.nv:hover,.btn.p:hover,.btn.accent:hover{background:#060f1f;box-shadow:0 0 0 3px rgba(10,25,49,.16)}
.ib{box-shadow:var(--up-s);border-radius:var(--r)}
.ib:hover{box-shadow:0 0 0 1px var(--navy,#0a1931)}
/* 고르기(세그먼트): 바탕은 들어감 한 장, 고른 칸은 흰 카드 + 머리카락 선 */
.vt,.seg,.tvbar{background:var(--tint);box-shadow:var(--in);border-radius:var(--r);padding:3px;gap:2px}
.vt button,.seg button,.tvbar button{border-radius:var(--r-s);font-weight:600}
.vt button.on,.seg button.on,.tvbar button.on{background:var(--card);color:var(--ink,#1f2125);font-weight:700;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
/* 칩: 테두리만, 고른 칩은 남색 선 + 남색 글자 */
.chip{background:transparent;box-shadow:inset 0 0 0 1px var(--hair2);border-radius:999px;padding:7px 13px;font-weight:600}
.chip:hover{background:var(--card);box-shadow:inset 0 0 0 1px var(--navy,#0a1931)}
.chip.on,.chip.on:hover{background:var(--card);color:var(--navy,#0a1931);box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931);font-weight:700}
/* 입력: 들어감 대신 흰 바탕 + 선 (읽기 쉬움) */
.inp,input.inp,select.inp,textarea.inp{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1);outline:0}
.srch{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1)}
/* 카드 · 줄 */
.tcard,.row,.sgc,.pg{box-shadow:var(--up-s);border-radius:var(--r-m)}
.tcard:hover,.tgt:hover,.tlist .tcard.trip:hover{box-shadow:0 0 0 1px var(--navy,#0a1931),0 6px 18px -10px rgba(10,25,49,.3)}
body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div{box-shadow:var(--up);border-radius:var(--r-l)}
.sheet .in,.sheet>div{border-radius:var(--r-l) var(--r-l) 0 0}
/* 이름표(섹션 머리): 작게 · 자간 · 흐린 먹 */
.lbl{font-size:12.5px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.sgc h4{font-size:14px;letter-spacing:-.01em}
/* 안내 상자: 상자 대신 왼쪽 선 하나 */
.note,.note.w,.stnote{background:transparent;box-shadow:none;border-radius:0;border-left:3px solid var(--hair2);padding:4px 0 4px 12px}
.note.w{border-left-color:#d98a1a}
/* 작은 표 · 뱃지 */
.okb,.dd{border-radius:6px}
/* 도구 작업대(3.0 틀): 교정대 · 작업 패널 · 눈금자 */
.tray{background:var(--tray);box-shadow:var(--in);border-radius:var(--r-l)}
.wp{box-shadow:var(--up);border-radius:var(--r-l)}
.ruler{box-shadow:var(--in);background:var(--tint)}
.tcard.on,.tcard.on:hover{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.wp-f{box-shadow:0 -1px 0 var(--hair)}
.brand .lg,.pcbar .lg{box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 -2px 0 rgba(0,0,0,.1)!important}
/* 고른 것 = 남색(10-30 제이): 고른 칸의 아이콘 · 글자 · 점은 남색, 주황은 진행 표시와 주 단추에만 */
.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on,.tabs button.on,.chip.on{color:var(--navy,#0a1931)}
.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.tabs button.on svg,.chip.on svg,.li.on svg,.tcard.on svg{color:var(--navy,#0a1931);opacity:1}
.tcard.on i{background:var(--navy,#0a1931)}
.pvth button.on,.vw2-strip button.on{box-shadow:0 0 0 3px var(--navy,#0a1931)}
.li.on{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
/* 눈금자 진행(공통 · 10-22 제이 규칙): 단계 이름은 글자만 — 박스 · 테두리 · 바탕 없음.
   올리면 번호 앰버 + 글자 밑 앰버 2px 밑줄, 지금 단계는 굵게만, 키보드 포커스만 남색 윤곽선 */
.ruler{background:transparent!important;box-shadow:none!important;border-bottom:1px solid var(--hair2);border-radius:0!important}
.ruler button,.ruler button:hover,.ruler button.cur,.ruler button.done{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important}
.ruler button:hover{color:var(--ink)}
.ruler button:hover .rn{color:var(--amber,#f56d03)}
.ruler button:not(.cur):hover{text-decoration:underline;text-decoration-color:var(--amber,#f56d03);text-decoration-thickness:2px;text-underline-offset:6px}
.ruler button:focus{outline:0}
.ruler button:focus-visible{outline:2px solid var(--navy,#0a1931);outline-offset:2px;border-radius:6px!important}
/* 로고 배지(도구 아이콘) 바탕 = 남색 — Blog J 고유 색(10-30 제이). 분야색은 배지에서 빼고 표시에만 */
.brand .lg,.pcbar .lg{background:var(--navy,#0a1931)!important;color:#fff}
.brand .lg svg,.pcbar .lg svg{color:#fff}

/* 고른 것 = 초록 바탕 + 흰 글자(10-30 제이) — 카드 · 칩 · 나눔 단추 · 보기 단추 · 날 목록 */
.tcard.on,.tcard.on:hover,.li.on,.chip.on,.chip.on:hover,.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.tcard.on *,.li.on *,.chip.on *,.vt button.on *,.seg button.on *,.tvbar button.on *,.pcnav button.on *{color:#fff!important}
.tcard.on small,.li.on small,.tcard.on .muted,.li.on .k,.chip.on small{color:rgba(255,255,255,.78)!important}
.tcard.on i{background:#fff!important}
.tcard.on svg,.chip.on svg,.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.li.on svg{color:#fff!important}
.pdays>button.on,.pdays>button.on:hover,.pside button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.pdays>button.on *,.pside button.on *{color:#fff!important}.pdays>button.on small,.pside button.on small{color:rgba(255,255,255,.78)!important}
/* 주 단추 = 앱의 메인 색(10-30 제이 안): 주황은 단추에 쓰지 않고 진행 구슬 · 로고 점 · 새 소식 같은 작은 표시에만 */
.btn.go{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.3),inset 0 -1px 0 rgba(0,0,0,.12)!important;outline:0!important}
.btn.go:hover{background:var(--navy-h,#060f1f)!important;box-shadow:0 0 0 3px rgba(10,25,49,.2)!important}
.btn.go:disabled{background:#d6cdbd!important;color:#8d8574!important;box-shadow:none!important}
:root{--navy-h:#060f1f}
/* ══ 10-30 제이: 색을 칠하는 단추는 적당한 크기로만, 큰 카드 · 큰 단추는 3.0의 돋움(음영) · 들어감(음각)으로 ══ */
:root{
  --up3:9px 10px 22px rgba(160,140,108,.38),-7px -7px 18px rgba(255,255,255,.85);
  --up3s:3px 4px 9px rgba(160,140,108,.34),-3px -3px 8px rgba(255,255,255,.88);
  --in3:inset 3px 3px 8px rgba(160,140,108,.34),inset -3px -3px 8px rgba(255,255,255,.8);
  --press3:inset 3px 3px 7px rgba(150,128,95,.42),inset -2px -2px 5px rgba(255,255,255,.72);
}
/* 큰 판 · 패널 = 돋움 */
.wp,body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div,.pdays,.sgc{box-shadow:var(--up3)!important}
/* 큰 고르기 카드 · 날 목록 · 목록 카드 = 작은 돋움, 고르면 눌림(음각) + 앱 색 테두리 · 글자 · 점 (바탕을 칠하지 않음) */
.tcard,.pdays>button[data-day],.row,.pg{box-shadow:var(--up3s)!important}
.pdays>button.tname{box-shadow:none!important;background:transparent!important}
.tcard:hover,.pdays>button[data-day]:hover,.tlist .tcard.trip:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.tcard.on,.tcard.on:hover,.pdays>button.on,.pdays>button.on:hover,.pside button.on,.li.on{background:var(--press-bg,#f3ece1)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--press3),inset 0 0 0 2px var(--navy,#0a1931)!important}
.tcard.on *,.pdays>button.on *,.pside button.on *,.li.on *{color:var(--navy,#0a1931)!important}
.tcard.on small,.pdays>button.on small,.pside button.on small,.li.on small{color:var(--ink2,#5b5547)!important}
.tcard.on i{background:var(--navy,#0a1931)!important}
.tcard.on svg,.li.on svg{color:var(--navy,#0a1931)!important}
/* 교정대 · 나눔 단추 홈 = 들어감(음각) */
.tray{box-shadow:var(--in3)!important}
.vt,.seg,.tvbar{box-shadow:var(--in3)!important;background:var(--tint)!important}
/* 색 단추는 적당한 크기 — 주 단추 높이 44, 좌우 여유만 */
.btn.go{min-height:44px!important;padding:10px 20px!important;font-size:15px!important;flex:0 0 auto}
/* 폭이 넓은 큰 단추(가로 꽉 찬 단추)는 칠하지 않고 돋움 + 앱 색 글자 */
.btn.go.w,.btn.w.nv{background:var(--card,#fcf9f4)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--up3s)!important;min-height:52px!important;font-weight:700}
.btn.go.w svg,.btn.w.nv svg{color:var(--navy,#0a1931)!important}
.btn.go.w:hover,.btn.w.nv:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.btn.go.w:active,.btn.w.nv:active{box-shadow:var(--press3)!important}
/* 눈금자 구슬: 지금 위치를 알려 주듯 살짝 반짝임(10-30 제이) — 퍼지는 고리 + 은은한 빛, 움직임 줄이기 설정이면 멈춤 */
.ruler .bead,.ruler-dot,.ruler .rdot{animation:bjBeadGlow 2.6s ease-in-out infinite}
.ruler .bead::after,.ruler-dot::after,.ruler .rdot::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid rgba(245,109,3,.55);animation:bjBeadRing 2.6s ease-out infinite;pointer-events:none}
@keyframes bjBeadGlow{0%,100%{filter:brightness(1);box-shadow:2px 3px 5px rgba(120,70,20,.35),inset 2px 2px 3px rgba(255,255,255,.45)}50%{filter:brightness(1.18);box-shadow:0 0 10px 3px rgba(255,150,50,.55),inset 2px 2px 3px rgba(255,255,255,.6)}}
@keyframes bjBeadRing{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.ruler .bead::after,.ruler-dot::after,.ruler .rdot::after{animation-duration:4s}.ruler .bead,.ruler-dot,.ruler .rdot{animation-duration:4s}}
@media print{.ruler .bead,.ruler .bead::after,.ruler-dot,.ruler-dot::after,.ruler .rdot,.ruler .rdot::after{animation:none}}
/* 고르기 칸(select) · 체크 — 입력칸과 같이 카드 바탕 + 선, 체크는 앱 색 */
select,.t-cal select,select.inp{background-color:var(--card)!important;box-shadow:inset 0 0 0 1px var(--hair2)!important;border-radius:var(--r)!important}
select:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.12)!important;outline:0}
input[type=checkbox],input[type=radio]{accent-color:var(--navy,#0a1931)}
