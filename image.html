:root{--bg:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f1efe8;--line:#e7e5dc;--line2:#d7d4c8;--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--brand-ink:#20263a;--brand-accent:#e08a3e;--cat:#1f7f8f;--catbg:#e3f3f5;--success:#2e8a58;--danger:#b84a3c;
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.app{max-width:1200px;margin:0 auto;padding:20px 20px 40px;min-height:100vh}
.app.embed{padding:14px 14px 20px;min-height:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--cat);color:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--sh1)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--catbg);color:var(--cat)}
.brand .ver{font-family:var(--font);font-size:11px;color:var(--ink3);font-weight:500}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:18px;align-items:start}
.lay>*{min-width:0}
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh1)}
.step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-h .num{width:28px;height:28px;border-radius:9px;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:13px;flex-shrink:0}
.step h3,.res-h h3{font-family:var(--head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500;color:var(--ink3)}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:15px}
input[type=number]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip:hover{background:var(--hover)}.chip.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand-ink)}
input[type=range]{width:100%;accent-color:var(--brand-ink);margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}
.qv{font-family:var(--head);font-size:15px;color:var(--brand-ink);margin-left:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:10px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-ink);color:var(--ink2);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:12px}
.note.w{border-left-color:var(--brand-accent);background:#fffaf2;color:#6b4a12}
.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--bg);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--ink2);transition:.12s}
.drop:hover,.drop.on{border-color:var(--brand-ink);background:#fff;color:var(--brand-ink)}
.drop b{font-size:15px;color:var(--ink)}.drop span{font-size:12.5px;color:var(--ink3)}
.col-r{position:sticky;top:16px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.lnk{color:var(--ink3);font-size:12.5px;font-weight:700}.lnk:hover{color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0;color:var(--ink3);font-size:13.5px;border:1.5px dashed var(--line2);border-radius:12px;margin-bottom:14px}
.list{list-style:none;max-height:420px;overflow-y:auto;margin:0 -4px 14px;padding:0 4px}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.th{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--tint);flex-shrink:0;border:1px solid var(--line)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta>b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>span{font-size:12px;color:var(--ink3)}.meta .res{color:var(--ink);font-weight:700}.arr{color:var(--ink3);margin:0 2px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:2px}
.tag.g{background:#e7f4ec;color:var(--success)}.tag.n{background:var(--tint);color:var(--ink2)}.tag.e{background:#fbece8;color:var(--danger)}
.acts{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-btn);font-weight:700;border:1px solid transparent;white-space:nowrap}
.btn.s{padding:6px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:#fff;border-color:var(--line2);color:var(--ink2)}.btn.ghost:hover{background:var(--hover)}
.btn.p{background:var(--brand-ink);color:#fff}.btn.p:hover{background:#343d5c}
.btn.accent{background:var(--brand-accent);color:#fff}.btn.accent:hover{background:#c9762f}
.btn:disabled{background:#eceae2;color:var(--ink3);cursor:default}
.btn.w{width:100%}.btn.big{padding:14px;font-size:15px;font-family:var(--head);border-radius:12px}
.sumr{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13.5px;color:var(--ink2)}
.sumr b{color:var(--ink)}.sumr b.g{color:var(--success);font-family:var(--head)}
.priv{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.priv svg{flex-shrink:0;margin-top:1px}

    <div class="pad-ctl"><label>자르는 크기 <b>${pct}%</b></label><input type="range" min="30" max="100" value=${pct} onInput=${e => setPct(+e.target.value)} />
      <button class="btn s ghost" title="가운데로" onClick=${() => { if (box) { const nb = { ...box, x: (1 - box.w) / 2, y: (1 - box.h) / 2 }; setBox(nb); commit(nb); } }}>가운데</button></div>
  </div>`;
}

/* 전후 비교 */
function Compare({ item, onClose }) {
  const [p, setP] = useState(50);
  return html`<div class="ov" onClick=${e => e.target === e.currentTarget && onClose()}><div class="md wide">
    <div class="mh"><h3>${h(Icon, { name: "eye", size: 18 })} 전후 비교</h3><button class="x" onClick=${onClose}>${h(Icon, { name: "x", size: 18 })}</button></div>
    <div class="mb">
      <div class="cmp"><img src=${item.url} alt="원본" /><div class="after" style=${{ clipPath: `inset(0 0 0 ${p}%)` }}><img src=${item.out.url} alt="변환" /></div><div class="bar" style=${{ left: p + "%" }}></div>
        <span class="lb l">원본 ${fmtBytes(item.file.size)}</span><span class="lb r">변환 ${fmtBytes(item.out.blob.size)}</span></div>
      <input type="range" min="0" max="100" value=${p} onInput=${e => setP(+e.target.value)} />
      <p class="hint">막대를 움직여 화질을 비교하세요. 원본 ${item.out.w0}×${item.out.h0} → 변환 ${item.out.w}×${item.out.h}</p>
    </div>
    <div class="mf"><button class="btn ghost" onClick=${onClose}>닫기</button><button class="btn p" onClick=${() => downloadBlob(item.out.blob, item.out.name)}>${h(Icon, { name: "download", size: 16 })} 이 사진 내려받기</button></div>
  </div></div>`;
}

function App() {
  const [items, setItems] = useState([]);
  const [s, setS] = useState(() => { const d = DEF[MODE], v = load("set:" + MODE, {}); return { ...d, ...v, wm: { ...d.wm, ...(v.wm || {}) } }; });
  const [busy, setBusy] = useState(false), [drag, setDrag] = useState(false), [stale, setStale] = useState(false);
  const [toast, setToast] = useState(""), [edit, setEdit] = useState(null), [cmp, setCmp] = useState(null);
  const [logo, setLogo] = useState(null), [est, setEst] = useState(null), [selId, setSelId] = useState(null), [view, setView] = useState("after"), [zoom, setZoom] = useState(null);
  const fileRef = useRef(), estTok = useRef(0);
  useEffect(() => save("set:" + MODE, s), [s]);
  const up = (k, v) => { setS(p => ({ ...p, [k]: v })); if (items.some(i => i.out)) setStale(true); };
  const flash = m => { setToast(m); clearTimeout(flash.t); flash.t = setTimeout(() => setToast(""), 2600); };
  const E = effective(s);

  const add = list => {
    const ok = [], bad = [];
    for (const f of list) { if (!f) continue;
      if (/heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name) || !/^image\//.test(f.type)) { bad.push(f.name); continue; }
      ok.push({ id: uid(), file: f, url: URL.createObjectURL(f), status: "wait", rot: 0, flip: false }); }
    if (ok.length) { setItems(p => [...p, ...ok]); setStale(false); }
    if (bad.length) flash(bad.some(n => /\.(heic|heif)$/i.test(n)) ? "HEIC 사진은 브라우저가 열지 못해요. 아이폰 설정 › 카메라 › 포맷에서 '높은 호환성'을 고르면 JPG로 찍힙니다." : "이미지 파일만 올릴 수 있어요: " + bad.slice(0, 2).join(", "));
    ok.filter(it => it.file.type === "image/gif").forEach(async it => {
      const b = new Uint8Array(await it.file.arrayBuffer()); let n = 0;
      for (let i = 0; i < b.length - 2 && n < 2; i++) if (b[i] === 0x21 && b[i + 1] === 0xF9 && b[i + 2] === 0x04) n++;
      if (n > 1) { setItems(p => p.map(x => x.id === it.id ? { ...x, anim: true } : x)); flash("움직이는 GIF는 첫 장면만 저장돼요."); } });
    ok.forEach(async it => { try { const b = await decode(it.file); setItems(p => p.map(x => x.id === it.id ? { ...x, w: b.width, h: b.height } : x)); if (b.close) b.close(); }
      catch (e) { setItems(p => p.map(x => x.id === it.id ? { ...x, status: "err" } : x)); } });
  };
  useEffect(() => { const onPaste = e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { add(fs); flash(fs.length + "장을 붙여넣었어요"); } };
    window.addEventListener("paste", onPaste); return () => window.removeEventListener("paste", onPaste); }, []);
  const remove = id => setItems(p => { const x = p.find(i => i.id === id); if (x) { URL.revokeObjectURL(x.url); if (x.out) URL.revokeObjectURL(x.out.url); } return p.filter(i => i.id !== id); });
  const clearAll = () => { items.forEach(x => { URL.revokeObjectURL(x.url); if (x.out) URL.revokeObjectURL(x.out.url); }); setItems([]); setStale(false); setEst(null); };

  /* 실시간 미리보기 (선택한 사진, 없으면 첫 사진) */
  const sel = items.find(i => i.id === selId && i.w) || items.find(i => i.w);
  const estSig = sel ? JSON.stringify([sel.id, sel.rot, sel.flip, sel.crop, E, !!logo]) : "";
  const [estBusy, setEstBusy] = useState(false);
  useEffect(() => { if (!sel) { setEst(e => { if (e && e.url) URL.revokeObjectURL(e.url); return null; }); return; } const tok = ++estTok.current; setEstBusy(true);
    const t = setTimeout(async () => { try { const o = await processOne(sel, E, logo); if (tok !== estTok.current) return;
        const url = URL.createObjectURL(o.blob); setEst(e => { if (e && e.url) URL.revokeObjectURL(e.url); return { id: sel.id, size: o.blob.size, w: o.w, h: o.h, from: sel.file.size, url, kept: o.keptOriginal, scaled: o.scaled, over: o.over }; }); }
      catch (e) {} finally { if (tok === estTok.current) setEstBusy(false); } }, 350);
    return () => clearTimeout(t); }, [estSig]);
  const canPos = !!cropRatio(E) && !(E.size === "exact" && E.fit === "contain");
  const [viewTouched, setViewTouched] = useState(false);
  const pvView = view === "pos" && !canPos ? "after" : (!viewTouched && canPos ? "pos" : view);
  const setViewU = v => { setViewTouched(true); setView(v); };
  const stage = !items.length ? 1 : items.some(i => i.out) && !stale ? 3 : 2;
  const GUIDE = { 1: "먼저 사진을 올려 주세요. 여러 장을 한 번에 넣을 수 있어요.",
    2: MODE === "all" && canPos ? "미리보기의 밝은 네모를 끌어 남길 부분을 정하세요. 설정을 바꾸면 결과와 예상 용량도 바로 바뀝니다." : MODE === "idphoto" ? "제출할 곳을 고른 뒤, 미리보기의 네모를 끌어 얼굴이 가운데 오도록 맞추세요." : MODE === "crop" ? "미리보기의 밝은 네모를 끌어서 남길 부분을 정하세요. 결과 버튼으로 잘린 모습을 확인할 수 있어요." : MODE === "watermark" ? "글자·위치·진하기를 바꾸면 미리보기에 바로 반영돼요." : "왼쪽 설정을 바꾸면 미리보기와 예상 용량이 바로 바뀝니다. 마음에 들면 변환하세요.",
    3: "변환이 끝났어요. 사진별로 내려받거나 zip으로 한 번에 받으세요." };
  const run = async () => {
    if (!items.length || busy) return;
    if (E.wm.on && E.wm.kind === "logo" && !logo) { flash("로고 이미지를 먼저 업로드해 주세요."); return; }
    setBusy(true); setStale(false);
    for (const it of items) {
      if (it.status === "err" && !it.w) continue;
      setItems(p => p.map(x => x.id === it.id ? { ...x, status: "busy" } : x));
      try { const cur = it; const out = await processOne(cur, E, logo); out.url = URL.createObjectURL(out.blob);
        setItems(p => p.map(x => { if (x.id !== it.id) return x; if (x.out) URL.revokeObjectURL(x.out.url); return { ...x, status: "done", out }; }));
      } catch (e) { setItems(p => p.map(x => x.id === it.id ? { ...x, status: "err" } : x)); }
      await new Promise(r => setTimeout(r, 0));
    }
    setBusy(false);
  };
  const done = items.filter(i => i.out);
  const tIn = done.reduce((a, i) => a + i.file.size, 0), tOut = done.reduce((a, i) => a + i.out.blob.size, 0);
  const zipAll = async () => { if (!done.length) return; flash("압축 파일을 만드는 중…"); downloadBlob(await makeZip(done.map(i => ({ name: i.out.name, blob: i.out.blob }))), "BlogJ_이미지_" + done.length + "장.zip"); };
  const saveEdit = patch => { setItems(p => p.map(x => x.id === edit.id ? { ...x, ...patch } : x)); setSelId(edit.id); if (items.some(i => i.out)) setStale(true); setEdit(null); flash("적용했어요. 미리보기로 확인한 뒤 변환하기를 누르세요."); };
  let n = 1; const nx = () => ++n;

  return html`<div class="app ${EMBED ? "embed" : ""}">
    ${!EMBED && html`<div class="top"><div class="brand"><span class="lg">${h(Icon, { name: "image", size: 20, sw: 2.2 })}<span class="jmini">J</span></span>${TITLE}<span class="cat">디지털</span><span class="ver">v${APP_VER}</span></div></div>`}
    <div class="lay">
      <div class="col-l">
        <${Step} n=${1} title="사진 올리기" sub="여러 장 한 번에 · 사진은 이 기기 밖으로 나가지 않습니다">
          <div class=${"drop " + (drag ? "on" : "")} onClick=${() => fileRef.current.click()}
            onDragOver=${e => { e.preventDefault(); setDrag(true); }} onDragLeave=${() => setDrag(false)} onDrop=${e => { e.preventDefault(); setDrag(false); add([...e.dataTransfer.files]); }}>
            ${h(Icon, { name: "upload", size: 30 })}<b>사진을 끌어다 놓거나 눌러서 고르세요</b><span>JPG · PNG · WEBP · GIF · BMP · 캡처 화면은 Ctrl+V로 붙여넣기</span>
            <input ref=${fileRef} type="file" accept="image/*" multiple hidden onChange=${e => { add([...e.target.files]); e.target.value = ""; }} />
          </div>
        </${Step}>
        ${SHOW.preset && html`<${PresetStep} s=${s} up=${up} n=${nx()} />`}
        ${SHOW.crop && html`<${CropStep} s=${s} up=${up} n=${nx()} />`}
        ${SHOW.size && html`<${SizeStep} s=${s} up=${up} n=${nx()} />`}
        ${SHOW.fmt && html`<${FmtStep} s=${s} up=${up} n=${nx()} />`}
        ${SHOW.qual && html`<${QualStep} s=${s} up=${up} n=${nx()} />`}
        ${SHOW.wm && html`<${WmStep} s=${s} up=${up} n=${nx()} logo=${logo} setLogo=${setLogo} />`}
        <button class="btn accent w big mob-run" disabled=${!items.length || busy} onClick=${() => { run(); window.scrollTo({ top: 0, behavior: "smooth" }); }}>${h(Icon, { name: RUN_ICON, size: 18 })} ${busy ? "변환 중…" : items.length ? "이 설정으로 " + items.length + "장 변환하기" : "사진을 먼저 올려 주세요"}</button>
      </div>
      <div class="col-r"><div class="res-card">
        <ol class="flow">${["사진 올리기", "설정 확인", "변환·내려받기"].map((t, i) => html`<li class=${stage === i + 1 ? "on" : stage > i + 1 ? "ok" : ""}><span>${stage > i + 1 ? h(Icon, { name: "check", size: 12, sw: 3, color: "#fff" }) : i + 1}</span>${t}</li>`)}</ol>
        <p class="guide">${GUIDE[stage]}</p>
        ${sel && html`<div class="pv">
          <div class="pv-top"><b title=${sel.file.name}>${sel.file.name}</b><div class="seg sm">${canPos && html`<button class=${pvView === "pos" ? "on" : ""} onClick=${() => setViewU("pos")}>위치 조정</button>`}<button class=${pvView === "after" ? "on" : ""} onClick=${() => setViewU("after")}>결과</button><button class=${pvView === "before" ? "on" : ""} onClick=${() => setViewU("before")}>원본</button></div></div>
          ${pvView === "pos" ? html`<${CropPad} item=${sel} s=${E} logo=${logo} onChange=${patch => { setItems(p => p.map(x => x.id === sel.id ? { ...x, ...patch } : x)); if (items.some(i => i.out)) setStale(true); }} />
            <p class="pad-tip">${h(Icon, { name: "info", size: 13 })} 밝은 네모 부분만 남습니다. 끌어서 원하는 곳으로 옮기세요. 화면이 작아 불편하면 아래 <b>큰 화면에서 편집하기</b>를 누르세요. 회전·좌우 반전도 거기서 할 수 있어요.</p>` : html`
          <div class="pv-box">${pvView === "before" ? html`<img src=${sel.url} alt="원본 미리보기" onClick=${() => setZoom(sel.url)} />` : est && est.id === sel.id ? html`<img src=${est.url} alt="결과 미리보기" onClick=${() => setZoom(est.url)} />` : null}<span class="zm">${h(Icon, { name: "search", size: 13, color: "#fff" })} 누르면 크게 보기</span>${estBusy && pvView === "after" ? html`<span class="pv-load">미리보기 만드는 중…</span>` : null}</div>`}
          ${est && est.id === sel.id && html`<div class="pv-meta"><span>원본 ${sel.w}×${sel.h} · ${fmtBytes(sel.file.size)}</span><span class="arr">›</span><b>${est.w}×${est.h} · 약 ${fmtBytes(est.size)}</b>${est.size < est.from ? html`<b class="g">−${Math.round((1 - est.size / est.from) * 100)}%</b>` : null}</div>
            ${(est.kept || est.scaled || est.over) && html`<p class="pv-note">${est.kept ? "이미 충분히 작아 원본을 그대로 씁니다." : ""}${est.scaled ? "목표 용량을 맞추려고 크기도 줄입니다." : ""}${est.over ? " 목표 용량까지는 줄이지 못했어요." : ""}</p>`}`}
          ${MODE !== "compress" && MODE !== "convert" && html`<button class="btn ghost w bigedit" onClick=${() => setEdit(sel)}>${h(Icon, { name: "maximize", size: 16 })} 큰 화면에서 편집하기 <span>${canPos ? "자르기 위치 · 회전 · 반전" : "회전 · 반전"}</span></button>`}
        </div>`}
        <div class="res-h"><h3>사진 ${items.length ? items.length + "장" : ""}</h3>${items.length ? html`<button class="lnk" onClick=${clearAll}>모두 지우기</button>` : null}</div>
        ${!items.length ? html`<div class="empty">${h(Icon, { name: "image", size: 34, color: "#b8b4a6" })}<p>사진을 올리면 여기에 미리보기가 나타납니다</p></div>` : html`
        <ul class="list">${items.map(it => html`<li class=${sel && sel.id === it.id ? "sel" : ""} onClick=${e => { if (!e.target.closest("button")) setSelId(it.id); }}>
          <button class="thb" title=${it.out ? "전후 비교" : ""} onClick=${() => it.out && setCmp(it)}><img class="th" src=${it.out ? it.out.url : it.url} alt="" />${it.out && html`<span class="eye">${h(Icon, { name: "eye", size: 13, color: "#fff" })}</span>`}</button>
          <div class="meta"><b title=${it.file.name}>${it.file.name}</b>
            <span>${it.w ? it.w + "×" + it.h + " · " : ""}${fmtBytes(it.file.size)}${it.out ? html` <span class="arr">›</span> <b class="res">${it.out.w}×${it.out.h} · ${fmtBytes(it.out.blob.size)}</b>` : ""}</span>
            ${it.out && html`<span class=${"tag " + (it.out.blob.size < it.file.size ? "g" : "n")}>${it.out.underTarget ? "이미 목표보다 작아 원본 유지" : it.out.keptOriginal ? "이미 충분히 작아 원본 유지" : it.out.blob.size < it.file.size ? "−" + Math.round((1 - it.out.blob.size / it.file.size) * 100) + "%" : "+" + Math.round((it.out.blob.size / it.file.size - 1) * 100) + "%"}${it.out.scaled ? " · 용량을 맞추려고 크기도 줄였어요" : ""}${it.out.over ? " · 목표 용량까지 못 줄였어요" : ""}</span>`}
            ${(it.rot || it.flip || it.crop) ? html`<span class="tag n">${[it.rot ? it.rot + "° 회전" : "", it.flip ? "반전" : "", it.crop ? "위치 조정" : ""].filter(Boolean).join(" · ")}</span>` : null}
            ${it.anim && html`<span class="tag n">움직이는 GIF · 첫 장면만 저장</span>`}${it.status === "busy" && html`<span class="tag n">변환 중…</span>`}${it.status === "err" && html`<span class="tag e">열 수 없는 파일</span>`}
          </div>
          <div class="acts">
            ${MODE !== "compress" && MODE !== "convert" && html`<button class="btn s ghost ic" title="자르기·회전" disabled=${!it.w} onClick=${() => setEdit(it)}>${h(Icon, { name: "crop", size: 16 })}</button>`}
            ${it.out && html`<button class="btn s ghost ic" title="내려받기" onClick=${() => downloadBlob(it.out.blob, it.out.name)}>${h(Icon, { name: "download", size: 16 })}</button>`}
            <button class="btn s ghost ic" title="빼기" onClick=${() => remove(it.id)}>${h(Icon, { name: "x", size: 16 })}</button></div>
        </li>`)}</ul>`}
        ${stale && html`<div class="note w">설정이 바뀌었어요. 다시 변환하세요.</div>`}
        <button class="btn accent w big" disabled=${!items.length || busy} onClick=${run}>${h(Icon, { name: RUN_ICON, size: 18 })} ${busy ? "변환 중…" : items.length ? items.length + "장 변환하기" : "사진을 먼저 올려 주세요"}</button>
        ${done.length > 0 && html`<div class="sumr"><span>${done.length}장 · ${fmtBytes(tIn)} <span class="arr">›</span> <b>${fmtBytes(tOut)}</b></span>${tOut < tIn ? html`<b class="g">−${Math.round((1 - tOut / tIn) * 100)}%</b>` : null}</div>
          <button class="btn p w" onClick=${zipAll}>${h(Icon, { name: "zip", size: 17 })} ${done.length > 1 ? "전체 내려받기 (zip)" : "zip으로 내려받기"}</button>
          <p class="hint c">썸네일을 누르면 원본과 화질을 비교할 수 있어요.</p>`}
        <p class="priv">${h(Icon, { name: "shield", size: 15, color: "#2e8a58" })} 변환은 이 브라우저 안에서만 이뤄지고, 위치정보 같은 사진 속 정보는 자동으로 빠집니다.</p>
      </div></div>
