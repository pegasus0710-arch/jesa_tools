<style>
:root{
  --bg:#f7f6f2;--panel:#ffffff;--line:#e7e5dc;--line2:#d7d4c8;
  --ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
  --acc:#0a1931;--acc2:#343d5c;--accbg:#ebedf3;--cat:#4f56d8;--catbg:#eef0ff;--brand-ink:#0a1931;--brand-accent:#f56d03;
  --inc:#d04a3f;--incbg:#fbece8;--exp:#2f64d6;--expbg:#e9effc;
  --warn:#d98a1a;--warnbg:#fff4e0;
  --r:12px;--sh:0 8px 30px rgba(28,31,43,.10);
  --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(10,25,49,.12)}
input[type=number]{text-align:right}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--ink3);font-size:12px}
.small{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.exp{color:var(--exp)}.inc{color:var(--inc)}
.hide{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;background:#fff;border:1px solid var(--line2);font-weight:600;white-space:nowrap;transition:background .12s}
.btn:hover{background:#f1efe8}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--exp);border-color:#f2c9c6;background:#fff}
.btn.d:hover{background:var(--expbg)}
.btn.s{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.g{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.g:hover{background:#efede5}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}

/* layout */
.app{max-width:1600px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
.foot{margin-top:auto;padding:22px 0 8px;text-align:center;font-size:11.5px;color:var(--ink3)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand .lg{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.brand .ver{font-size:11px;color:var(--ink3);font-weight:500;margin-left:2px}
.tabs{display:flex;background:#efede5;border-radius:10px;padding:3px;gap:2px}
.tabs button{padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mnav{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px}
.mnav button{padding:5px 9px;border-radius:7px;font-weight:700}
.mnav button:hover{background:#f1efe8}
.mnav .ym{min-width:112px;text-align:center;font-weight:800;font-size:15px}
.actions{display:flex;gap:6px;margin-left:auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum .c{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.sum .c .t{font-size:12px;color:var(--ink3)}
.sum .c .v{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-top:2px}

/* calendar */
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .hd{display:grid;grid-template-columns:repeat(7,1fr);background:#faf9f5;border-bottom:1px solid var(--line)}
.cal .hd div{text-align:center;padding:7px 0;font-size:12px;color:var(--ink2);font-weight:700}
.cal .hd div:first-child{color:var(--exp)}.cal .hd div:last-child{color:var(--acc)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .d{min-height:var(--cellh,96px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 4px;cursor:pointer;position:relative;overflow:hidden}
.cal .d:nth-child(7n){border-right:none}
.cal .d:hover{background:#faf9f5}
.cal .d.out{background:#f9f8f4;color:var(--ink3)}
.cal .d.out .chip{opacity:.5}
.cal .d .n{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.cal .d .n .hol{font-size:10px;color:var(--exp);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.sun .n,.cal .d.hol .n{color:var(--exp)}.cal .d.sat .n{color:var(--acc)}
.cal .d.today .n b{background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center}
.cal .d .n{margin-bottom:3px}
.cal .d .tot{margin-left:auto;font-size:10.5px;font-weight:700;white-space:nowrap;display:inline-flex;gap:3px;align-items:center}
.cal .d .tot .sep{color:#cfcbbd;font-weight:400}
.chip{font-size:10.5px;padding:1px 5px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:3px;justify-content:space-between;line-height:1.5}
.chip.e{background:var(--expbg);color:#b3413a}
.chip.i{background:var(--incbg);color:#177a52}
.chip.cat{background:color-mix(in srgb,var(--cc) 16%,#fff);color:var(--ink);border-left:3px solid var(--cc);padding-left:4px}
.chip.cat .m{color:var(--cc);filter:brightness(.8)}
.chip.cat .m.inc{color:var(--inc);filter:none}
.chip.pl,.chip.cat.pl{background:#fff;border:1px dashed var(--cc,#cfcbbd);border-left:3px solid var(--cc,#cfcbbd);color:var(--ink2)}
.chip.bill{background:var(--warnbg);color:#9a6210;border:1px solid #f4dfb5}
.chip .m{font-weight:700;flex-shrink:0}
.more{font-size:10px;color:var(--ink3);padding-left:3px}
.cal .d .dots{display:none;gap:2px;flex-wrap:wrap;margin-top:2px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;display:block}
@media(max-width:640px){
  .cal .d{min-height:var(--cellh,74px);padding:3px}
  .chip,.more{display:none}
  .cal .d .dots{display:flex}
  .cal .d .n{flex-wrap:wrap}.cal .d .tot{font-size:9px;margin-left:0;width:100%;flex-direction:column;align-items:flex-start;gap:0;line-height:1.2}.cal .d .tot .sep{display:none}
  .sum{gap:5px}.sum .c{padding:8px 9px}.sum .c .t{font-size:11px}.sum .c .v{font-size:13px;white-space:nowrap}
  .app{padding:8px 8px 80px}
  .sum .c .v{font-size:15px}
  .actions{margin-left:0;width:100%}
  .actions .btn{flex:1}
  .mnav .ym{min-width:90px;font-size:14px}
}

/* list */
.lst .day{margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lst .day .dh{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#faf9f5;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.lst .day .dh .dt{color:var(--ink2)}
.tr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #efede6;cursor:pointer}
.tr:last-child{border-bottom:none}
.tr:hover{background:#faf9f5}
.tr .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .sb{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .am{font-weight:800;white-space:nowrap}
.tr.pl{opacity:.75;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f9f8f4 6px,#f9f8f4 12px)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:5px;background:#efede5;color:var(--ink2);white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{width:auto;min-width:0;padding:6px 8px;font-size:13px}
.empty{text-align:center;color:var(--ink3);padding:36px 0}

/* stats */
.stg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stg .panel h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.stg .panel h4 select{width:auto;padding:3px 6px;font-size:12px}
.stg .ch{position:relative;height:250px}
.stg .full{grid-column:1/-1}
@media(max-width:760px){.stg{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid #efede6;text-align:left}
.tbl th{font-size:11.5px;color:var(--ink3);font-weight:600;background:#faf9f5}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.sub td:first-child{padding-left:22px;color:var(--ink2)}

/* settings */
.set{display:grid;grid-template-columns:200px 1fr;gap:14px}
.set .nav{display:flex;flex-direction:column;gap:2px}
.set .nav button{text-align:left;padding:9px 12px;border-radius:9px;font-weight:600;color:var(--ink2)}
.set .nav button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.set .nav .grp{font-size:11px;color:var(--ink3);padding:10px 12px 2px}
@media(max-width:700px){.set{grid-template-columns:1fr}.set .nav{flex-direction:row;flex-wrap:wrap}.set .nav .grp{display:none}}
.sec{margin-bottom:16px}
.sec h3{font-size:16px;margin-bottom:4px}
.sec .desc{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.item .nm{font-weight:700}
.item .ops{display:flex;gap:4px;margin-left:auto}
.item.sub{margin-left:26px;padding:6px 12px;background:#fbfbfd}
.item.sub .nm{font-weight:500}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.sw .t{font-weight:700}.sw .d{font-size:12px;color:var(--ink3)}
.tog{width:40px;height:22px;border-radius:11px;background:#d7d4c8;position:relative;flex-shrink:0;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--acc)}.tog.on::after{left:20px}
.note{background:var(--accbg);border:1px solid #d9dcff;color:#3a40a8;padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
.note.w{background:var(--warnbg);border-color:#f4dfb5;color:#7f5008}
.note.e{background:var(--expbg);border-color:#f2c9c6;color:#a6352e}
.pal{display:flex;gap:5px;flex-wrap:wrap}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.pal button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,22,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:var(--sh);animation:up .18s ease}
.md.lg{max-width:760px}
.md .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;position:sticky;top:0;background:#fff;z-index:1}
.md .mh h3{font-size:16px}
.md .mb{padding:4px 18px 18px}
.md .mf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.md .mf .btn{flex:1}
.x{font-size:22px;color:var(--ink3);width:32px;height:32px;border-radius:8px}
.x:hover{background:#efede6}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.seg{display:flex;background:#efede5;border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px;border-radius:7px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.e{color:var(--exp)}.seg button.on.i{color:var(--inc)}
textarea.paste{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:150px;white-space:pre;overflow:auto}
.prev{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.prev .tbl{font-size:12px}
.prev td.bad{color:var(--exp)}
.prev td.new{color:var(--warn)}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock .bx{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 28px;width:100%;max-width:360px;box-shadow:var(--sh);text-align:center}
.lock .bx .lg{width:52px;height:52px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20241f;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:var(--sh);animation:up .2s}
.fab{display:none}
@media(max-width:640px){
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(79,86,216,.4);z-index:50}
}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
kbd{font-family:inherit;background:#efede5;border-radius:4px;padding:0 5px;font-size:11px}
.bal{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bal .b{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px}
.bal .b b{display:block;font-size:14px}
.tbl td,.tbl th{white-space:nowrap}
.tabs.sub{display:inline-flex}
@media(max-width:760px){.sum{grid-template-columns:repeat(2,1fr)!important}}

.date-field{position:relative;display:inline-flex;align-items:center;gap:5px}
.date-field .date-display{cursor:pointer;background:#fff;font-variant-numeric:tabular-nums;padding:7px 10px;font-weight:600}
.date-field .date-display.sat{color:var(--acc)}
.date-field .date-native{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;padding:0;border:0;pointer-events:none}
.date-icon-btn{cursor:pointer;font-size:15px;flex-shrink:0;line-height:1}
.dd .date-field{display:flex}.dd .date-field .date-display{flex:1;width:auto!important}

.ac{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:var(--sh);max-height:240px;overflow:auto;margin-top:2px}
.ac-i{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px}
.ac-i:hover{background:var(--accbg)}

.app>*{min-width:0;max-width:100%}
.panel{max-width:100%}
.stg>*{min-width:0}

.tbl.tx tbody tr{cursor:pointer;transition:background .1s}
.tbl.tx tr.k-buy td{background:#fff5f4}
.tbl.tx tr.k-sell td{background:#f1faf6}
.tbl.tx tr.k-div td{background:#fff9ec}
.tbl.tx tr.k-dep td{background:#f2f8ff}
.tbl.tx tr.k-wd td{background:#f5f5f8}
.tbl.tx tr.k-buy:hover td{background:#fde4e2}
.tbl.tx tr.k-sell:hover td{background:#dcf3e8}
.tbl.tx tr.k-div:hover td{background:#fdefcf}
.tbl.tx tr.k-dep:hover td{background:#dfeeff}
.tbl.tx tr.k-wd:hover td{background:#e6e7ee}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}

a.nv{display:inline-block;margin-left:2px;padding:0 5px;border-radius:5px;color:var(--acc);font-weight:800;font-size:12px;text-decoration:none;line-height:1.5}
a.nv:hover{background:var(--accbg)}

.sec-h{font-size:12.5px;font-weight:700;color:var(--ink2);margin:2px 0 6px;display:flex;gap:6px;align-items:baseline}
.sec-h .muted{font-weight:500}
.sum .c.hi{border-color:#c9ccff;background:#f7f8ff}
.onboard h3{font-size:18px;margin-bottom:4px}
.onboard ol{margin:10px 0 0 20px;line-height:1.9}
.panel .tbl{min-width:100%}
.panel:has(> .tbl){overflow-x:auto}
@media(max-width:640px){
  .hide-m{display:none!important}
  .actions{margin-left:auto;width:auto}.actions .btn{flex:0}
  .brand{font-size:15px}
  .sum .c .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filters .date-field .date-display{width:122px!important;padding:6px 6px;font-size:12px}
  .onboard .row{flex-direction:column}
}

/* ── 매매일지 다크 헤더 ── */
.top.dark{background:linear-gradient(135deg,#0f1c3f,#16265a 60%,#1b2f6b);border-radius:14px;padding:10px 14px;margin:-2px 0 14px;box-shadow:0 8px 24px rgba(15,28,63,.25)}
.top.dark .brand{color:#fff}.top.dark .brand .ver{color:#9fb0e0}.top.dark .brand .lg{background:#2f6fe4}
.top.dark .tabs{background:rgba(255,255,255,.08);padding:4px}
.top.dark .tabs button{color:#c9d3f0;padding:7px 16px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.top.dark .tabs button .ic{font-size:14px}
.top.dark .tabs button.on{background:#2f6fe4;color:#fff;box-shadow:0 2px 8px rgba(47,111,228,.5)}
.top.dark .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.top.dark .btn.ghost:hover{background:rgba(255,255,255,.18)}
.top.dark .btn.p{background:#2f6fe4;border-color:#2f6fe4}
.tabs button.on{color:var(--ink)}
.btn.p{background:#2f6fe4;border-color:#2f6fe4}.btn.p:hover{background:#4a83ea}
.fab{background:#2f6fe4}
/* 카드 */
.sum .c .v.big{font-size:22px}
.sum .c .delta{font-size:13px;font-weight:700;margin-top:2px}
.sum .c.tint-b{background:#eef3ff;border-color:#d5e0fb}
.sum .c.tint-r{background:#fff1f0;border-color:#f8d5d2}
.sum .c.tint-n{background:#f4f6fb;border-color:#e0e4ef}
/* 대시보드 */
.dash{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;align-items:start}
.dash .side{display:flex;flex-direction:column;gap:12px}
.dash .ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.dash .ph b{flex:1}
.dash .panel h4{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #efede6;font-size:13.5px}
.kv:last-child{border-bottom:none}.kv span{color:var(--ink2)}
.tbl.hold td{padding:9px 10px;vertical-align:middle}
.tbl.hold thead th{padding:8px 10px}
.stk{display:flex;align-items:center;gap:9px}
.badge{width:30px;height:30px;border-radius:8px;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.tbl input.px{width:96px;padding:5px 7px;text-align:right;font-weight:600}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
@media(max-width:640px){.top.dark .tabs button{padding:6px 9px;font-size:13px}.top.dark .tabs button .ic{display:none}.sum .c .v.big{font-size:16px}}

@media(max-width:640px){.sum{grid-template-columns:1fr 1fr!important}.dash .ph{flex-wrap:wrap}.dash .ph b{flex:1 0 100%}.dash .ph .btn{margin-left:auto}}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}.foot a:hover{color:var(--acc);border-color:var(--acc)}

.panel{border-radius:var(--r);box-shadow:var(--sh1)}

.pager button.on,.pg button.on{background:var(--brand-ink);border-color:var(--brand-ink)}

/* 설정 */
.set .nav button{border-radius:10px;padding:10px 14px}.set .nav button.on{color:var(--brand-ink);box-shadow:var(--sh1);font-weight:800}

/* 안내 */
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-ink);color:var(--ink2);border-radius:10px;font-size:13px}
.note.w{border-left-color:var(--brand-accent);background:#fffaf2;color:#6b4a12}

label.f{font-size:12.5px;font-weight:700}

/* 3.1: 분야 배지 = 앱 색 */
.cat{background:rgba(10,25,49,.1)!important;color:#0a1931!important}
/* BJ31-APPLIED */
/* 색(10-30 제이 지정): 초록 #0a1931 · 바탕 베이지 #F0E8DB · 주황 #F56D03 — 메인 = 짙은 초록 #0a1931(고른 것 · 기능 · 로고 배지), 이벤트 = 진한 주황 #f56d03(주 단추 · 진행 표시) */
/* ══ Blog J 디자인 3.1 「정돈」 — 3.0 위에 덮어쓰는 다듬기 (10-30) ══
   1) 깊이는 3단만: 판(바탕) · 카드(머리카락 선 + 아주 옅은 그림자) · 들어감(입력 · 고르기 바탕)
   2) 이중 그림자(어두운 + 흰 빛) 없앰 → 흐릿함 · 뭉개짐 제거
   3) 모서리 4단계: 8 · 10 · 14 · 18px
   4) 고른 것 = 남색 선(1.5px) + 남색 글자, 주 버튼 = 앰버 한 곳(평평하게) */
:root{
  --navy:#0a1931;--amber:#f56d03;--brand:#0a1931;--accent:#f56d03;
  --paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--in-bg:#ece3d5;--up-bg:#f7f2ea;--pr-bg:#f3ece1;--press-bg:#f3ece1;--tray:#e9e0d1;--hover:#f5efe5;
  --hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.2);
  --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);
  --up-s:0 0 0 1px rgba(90,74,50,.09),0 1px 2px rgba(90,74,50,.06);
  --in:inset 0 0 0 1px rgba(90,74,50,.1);
  --press:inset 0 0 0 1.5px var(--navy,#0a1931);
  --sh-paper:0 1px 3px rgba(0,0,0,.06),0 14px 34px -14px rgba(60,48,30,.28);
  --r-s:8px;--r:10px;--r-m:14px;--r-l:18px;
}
/* 버튼: 평평하게, 그림자는 선 하나 */
.btn{border-radius:var(--r);box-shadow:var(--up-s);font-weight:600;transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--hover);box-shadow:0 0 0 1px var(--navy,#0a1931)}
.btn:active{transform:none;box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.btn.sm{border-radius:var(--r-s)}
.btn.go{background:var(--amber,#f56d03);color:#fff;box-shadow:0 1px 2px rgba(140,60,10,.25),inset 0 -1px 0 rgba(0,0,0,.08);outline:0}
.btn.go:hover{background:#d95f00;box-shadow:0 1px 2px rgba(140,60,10,.25),0 0 0 3px rgba(245,109,3,.22);outline:0}
.btn.nv,.btn.p,.btn.accent{background:var(--navy,#0a1931);color:#fff;box-shadow:0 1px 2px rgba(6,15,30,.25)}
.btn.nv:hover,.btn.p:hover,.btn.accent:hover{background:#060f1f;box-shadow:0 0 0 3px rgba(10,25,49,.16)}
.ib{box-shadow:var(--up-s);border-radius:var(--r)}
.ib:hover{box-shadow:0 0 0 1px var(--navy,#0a1931)}
/* 고르기(세그먼트): 바탕은 들어감 한 장, 고른 칸은 흰 카드 + 머리카락 선 */
.vt,.seg,.tvbar{background:var(--tint);box-shadow:var(--in);border-radius:var(--r);padding:3px;gap:2px}
.vt button,.seg button,.tvbar button{border-radius:var(--r-s);font-weight:600}
.vt button.on,.seg button.on,.tvbar button.on{background:var(--card);color:var(--ink,#1f2125);font-weight:700;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
/* 칩: 테두리만, 고른 칩은 남색 선 + 남색 글자 */
.chip{background:transparent;box-shadow:inset 0 0 0 1px var(--hair2);border-radius:999px;padding:7px 13px;font-weight:600}
.chip:hover{background:var(--card);box-shadow:inset 0 0 0 1px var(--navy,#0a1931)}
.chip.on,.chip.on:hover{background:var(--card);color:var(--navy,#0a1931);box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931);font-weight:700}
/* 입력: 들어감 대신 흰 바탕 + 선 (읽기 쉬움) */
.inp,input.inp,select.inp,textarea.inp{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1);outline:0}
.srch{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.1)}
/* 카드 · 줄 */
.tcard,.row,.sgc,.pg{box-shadow:var(--up-s);border-radius:var(--r-m)}
.tcard:hover,.tgt:hover,.tlist .tcard.trip:hover{box-shadow:0 0 0 1px var(--navy,#0a1931),0 6px 18px -10px rgba(10,25,49,.3)}
body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div{box-shadow:var(--up);border-radius:var(--r-l)}
.sheet .in,.sheet>div{border-radius:var(--r-l) var(--r-l) 0 0}
/* 이름표(섹션 머리): 작게 · 자간 · 흐린 먹 */
.lbl{font-size:12.5px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.sgc h4{font-size:14px;letter-spacing:-.01em}
/* 안내 상자: 상자 대신 왼쪽 선 하나 */
.note,.note.w,.stnote{background:transparent;box-shadow:none;border-radius:0;border-left:3px solid var(--hair2);padding:4px 0 4px 12px}
.note.w{border-left-color:#d98a1a}
/* 작은 표 · 뱃지 */
.okb,.dd{border-radius:6px}
/* 도구 작업대(3.0 틀): 교정대 · 작업 패널 · 눈금자 */
.tray{background:var(--tray);box-shadow:var(--in);border-radius:var(--r-l)}
.wp{box-shadow:var(--up);border-radius:var(--r-l)}
.ruler{box-shadow:var(--in);background:var(--tint)}
.tcard.on,.tcard.on:hover{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
.wp-f{box-shadow:0 -1px 0 var(--hair)}
.brand .lg,.pcbar .lg{box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 -2px 0 rgba(0,0,0,.1)!important}
/* 고른 것 = 남색(10-30 제이): 고른 칸의 아이콘 · 글자 · 점은 남색, 주황은 진행 표시와 주 단추에만 */
.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on,.tabs button.on,.chip.on{color:var(--navy,#0a1931)}
.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.tabs button.on svg,.chip.on svg,.li.on svg,.tcard.on svg{color:var(--navy,#0a1931);opacity:1}
.tcard.on i{background:var(--navy,#0a1931)}
.pvth button.on,.vw2-strip button.on{box-shadow:0 0 0 3px var(--navy,#0a1931)}
.li.on{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931)}
/* 눈금자 진행(공통 · 10-22 제이 규칙): 단계 이름은 글자만 — 박스 · 테두리 · 바탕 없음.
   올리면 번호 앰버 + 글자 밑 앰버 2px 밑줄, 지금 단계는 굵게만, 키보드 포커스만 남색 윤곽선 */
.ruler{background:transparent!important;box-shadow:none!important;border-bottom:1px solid var(--hair2);border-radius:0!important}
.ruler button,.ruler button:hover,.ruler button.cur,.ruler button.done{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important}
.ruler button:hover{color:var(--ink)}
.ruler button:hover .rn{color:var(--amber,#f56d03)}
.ruler button:not(.cur):hover{text-decoration:underline;text-decoration-color:var(--amber,#f56d03);text-decoration-thickness:2px;text-underline-offset:6px}
.ruler button:focus{outline:0}
.ruler button:focus-visible{outline:2px solid var(--navy,#0a1931);outline-offset:2px;border-radius:6px!important}
/* 로고 배지(도구 아이콘) 바탕 = 남색 — Blog J 고유 색(10-30 제이). 분야색은 배지에서 빼고 표시에만 */
.brand .lg,.pcbar .lg{background:var(--navy,#0a1931)!important;color:#fff}
.brand .lg svg,.pcbar .lg svg{color:#fff}

/* 고른 것 = 초록 바탕 + 흰 글자(10-30 제이) — 카드 · 칩 · 나눔 단추 · 보기 단추 · 날 목록 */
.tcard.on,.tcard.on:hover,.li.on,.chip.on,.chip.on:hover,.vt button.on,.seg button.on,.tvbar button.on,.pcnav button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.tcard.on *,.li.on *,.chip.on *,.vt button.on *,.seg button.on *,.tvbar button.on *,.pcnav button.on *{color:#fff!important}
.tcard.on small,.li.on small,.tcard.on .muted,.li.on .k,.chip.on small{color:rgba(255,255,255,.78)!important}
.tcard.on i{background:#fff!important}
.tcard.on svg,.chip.on svg,.vt button.on svg,.seg button.on svg,.tvbar button.on svg,.pcnav button.on svg,.li.on svg{color:#fff!important}
.pdays>button.on,.pdays>button.on:hover,.pside button.on{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.25)!important}
.pdays>button.on *,.pside button.on *{color:#fff!important}.pdays>button.on small,.pside button.on small{color:rgba(255,255,255,.78)!important}
/* 주 단추 = 앱의 메인 색(10-30 제이 안): 주황은 단추에 쓰지 않고 진행 구슬 · 로고 점 · 새 소식 같은 작은 표시에만 */
.btn.go{background:var(--navy,#0a1931)!important;color:#fff!important;box-shadow:0 1px 2px rgba(6,15,30,.3),inset 0 -1px 0 rgba(0,0,0,.12)!important;outline:0!important}
.btn.go:hover{background:var(--navy-h,#060f1f)!important;box-shadow:0 0 0 3px rgba(10,25,49,.2)!important}
.btn.go:disabled{background:#d6cdbd!important;color:#8d8574!important;box-shadow:none!important}
:root{--navy-h:#060f1f}
/* ══ 10-30 제이: 색을 칠하는 단추는 적당한 크기로만, 큰 카드 · 큰 단추는 3.0의 돋움(음영) · 들어감(음각)으로 ══ */
:root{
  --up3:9px 10px 22px rgba(160,140,108,.38),-7px -7px 18px rgba(255,255,255,.85);
  --up3s:3px 4px 9px rgba(160,140,108,.34),-3px -3px 8px rgba(255,255,255,.88);
  --in3:inset 3px 3px 8px rgba(160,140,108,.34),inset -3px -3px 8px rgba(255,255,255,.8);
  --press3:inset 3px 3px 7px rgba(150,128,95,.42),inset -2px -2px 5px rgba(255,255,255,.72);
}
/* 큰 판 · 패널 = 돋움 */
.wp,body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div,.pdays,.sgc{box-shadow:var(--up3)!important}
/* 큰 고르기 카드 · 날 목록 · 목록 카드 = 작은 돋움, 고르면 눌림(음각) + 앱 색 테두리 · 글자 · 점 (바탕을 칠하지 않음) */
.tcard,.pdays>button[data-day],.row,.pg{box-shadow:var(--up3s)!important}
.pdays>button.tname{box-shadow:none!important;background:transparent!important}
.tcard:hover,.pdays>button[data-day]:hover,.tlist .tcard.trip:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.tcard.on,.tcard.on:hover,.pdays>button.on,.pdays>button.on:hover,.pside button.on,.li.on{background:var(--press-bg,#f3ece1)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--press3),inset 0 0 0 2px var(--navy,#0a1931)!important}
.tcard.on *,.pdays>button.on *,.pside button.on *,.li.on *{color:var(--navy,#0a1931)!important}
.tcard.on small,.pdays>button.on small,.pside button.on small,.li.on small{color:var(--ink2,#5b5547)!important}
.tcard.on i{background:var(--navy,#0a1931)!important}
.tcard.on svg,.li.on svg{color:var(--navy,#0a1931)!important}
/* 교정대 · 나눔 단추 홈 = 들어감(음각) */
.tray{box-shadow:var(--in3)!important}
.vt,.seg,.tvbar{box-shadow:var(--in3)!important;background:var(--tint)!important}
/* 색 단추는 적당한 크기 — 주 단추 높이 44, 좌우 여유만 */
.btn.go{min-height:44px!important;padding:10px 20px!important;font-size:15px!important;flex:0 0 auto}
/* 폭이 넓은 큰 단추(가로 꽉 찬 단추)는 칠하지 않고 돋움 + 앱 색 글자 */
.btn.go.w,.btn.w.nv{background:var(--card,#fcf9f4)!important;color:var(--navy,#0a1931)!important;box-shadow:var(--up3s)!important;min-height:52px!important;font-weight:700}
.btn.go.w svg,.btn.w.nv svg{color:var(--navy,#0a1931)!important}
.btn.go.w:hover,.btn.w.nv:hover{box-shadow:var(--up3s),inset 0 0 0 1.5px var(--navy,#0a1931)!important}
.btn.go.w:active,.btn.w.nv:active{box-shadow:var(--press3)!important}
/* 눈금자 구슬: 지금 위치를 알려 주듯 살짝 반짝임(10-30 제이) — 퍼지는 고리 + 은은한 빛, 움직임 줄이기 설정이면 멈춤 */
.ruler .bead,.ruler-dot,.ruler .rdot{animation:bjBeadGlow 2.6s ease-in-out infinite}
.ruler .bead::after,.ruler-dot::after,.ruler .rdot::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid rgba(245,109,3,.55);animation:bjBeadRing 2.6s ease-out infinite;pointer-events:none}
@keyframes bjBeadGlow{0%,100%{filter:brightness(1);box-shadow:2px 3px 5px rgba(120,70,20,.35),inset 2px 2px 3px rgba(255,255,255,.45)}50%{filter:brightness(1.18);box-shadow:0 0 10px 3px rgba(255,150,50,.55),inset 2px 2px 3px rgba(255,255,255,.6)}}
@keyframes bjBeadRing{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.ruler .bead::after,.ruler-dot::after,.ruler .rdot::after{animation-duration:4s}.ruler .bead,.ruler-dot,.ruler .rdot{animation-duration:4s}}
@media print{.ruler .bead,.ruler .bead::after,.ruler-dot,.ruler-dot::after,.ruler .rdot,.ruler .rdot::after{animation:none}}
/* 고르기 칸(select) · 체크 — 입력칸과 같이 카드 바탕 + 선, 체크는 앱 색 */
select,.t-cal select,select.inp{background-color:var(--card)!important;box-shadow:inset 0 0 0 1px var(--hair2)!important;border-radius:var(--r)!important}
select:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.12)!important;outline:0}
input[type=checkbox],input[type=radio]{accent-color:var(--navy,#0a1931)}
input[type=text]:not(.inp),input[type=number]:not(.inp){background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
input[type=text]:not(.inp):focus,input[type=number]:not(.inp):focus{box-shadow:inset 0 0 0 1.5px var(--navy,#0a1931),0 0 0 3px rgba(10,25,49,.12);outline:0}
/* 10-30 밤: 떠 있는 「+」 단추 — 주황 단추 금지(3.1 2-1) → 앱 색 */
.fab{background:var(--navy,#0a1931);color:#fff;box-shadow:0 1px 2px rgba(6,15,30,.25),0 8px 20px -6px rgba(6,15,30,.45)}
.fab:hover{background:#060f1f}
/* 10-30 밤: 머리 막대 안 눈금자(라벨 · 김치)도 3.1 6번 — 홈 · 바탕 상자 없이 */
.bar-in .ruler::before{display:none!important}

</style><script>/* ══ 공통: 엑셀 붙여넣기 「엑셀 표 예시」 (2026-10-31) ══
   엑셀 화면처럼 생긴 예시 표(열 문자 A·B·C · 행 번호 · 1행 머리글 · 초록 선택 테두리)
   + 복사 순서 3단계 + 「이 예시를 붙여넣어 보기」(대상 입력칸에 그대로 채움).
   XLEX({ cols:[…], rows:[[…]…], ta:"#입력칸", note:"…", open:true, num:[숫자 열 번호…] }) → HTML 문자열 */
(function () {
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const L = i => "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[i];
  window.XLEX = function (o) {
    const cols = o.cols, rows = o.rows, nC = cols.length, nR = rows.length + 1, num = o.num || [];
    const all = [cols].concat(rows), tsv = all.map(r => r.join("\t")).join("\n");
    const cell = (v, r, c) => {
      const k = [r === 0 ? "xlx-hd" : "", num.indexOf(c) >= 0 && r > 0 ? "xlx-n" : "", r === 0 ? "xlx-st" : "", r === nR - 1 ? "xlx-sb" : "", c === 0 ? "xlx-sl" : "", c === nC - 1 ? "xlx-sr" : ""].filter(Boolean).join(" ");
      return `<td class="${k}">${E(v)}${r === nR - 1 && c === nC - 1 ? '<i class="xlx-fh"></i>' : ""}</td>`;
    };
    return `<details class="xlx"${o.open === false ? "" : " open"}><summary><b>엑셀 표 예시</b><span>${E(o.sum || "엑셀에 이렇게 적고 복사해서 붙여넣으세요")}</span></summary>
<div class="xlx-w"><table class="xlx-t"><thead><tr><th class="xlx-c"></th>${cols.map((_, i) => `<th>${L(i)}</th>`).join("")}</tr></thead><tbody>${all.map((r, ri) => `<tr><th>${ri + 1}</th>${r.map((v, ci) => cell(v, ri, ci)).join("")}</tr>`).join("")}</tbody></table></div>
<ol class="xlx-s"><li>엑셀에서 <b>A1 칸(머리글)부터 마지막 칸까지</b> 마우스로 끌어 고르기 — 위 초록 테두리만큼</li><li><b>Ctrl + C</b> (복사)</li><li>${E(o.where || "아래 칸")}을 누르고 <b>Ctrl + V</b> (붙여넣기)</li></ol>
${o.note ? `<p class="xlx-p">${o.note}</p>` : ""}<button type="button" class="xlx-b" data-xlfill="${E(tsv)}" data-xlta="${E(o.ta)}">이 예시를 붙여넣어 보기</button></details>`;
  };
  if (!window.__xlxOn) {
    window.__xlxOn = 1;
    document.addEventListener("click", e => {
      const b = e.target.closest && e.target.closest("[data-xlfill]"); if (!b) return;
      e.preventDefault(); e.stopPropagation();
      const t = document.querySelector(b.dataset.xlta); if (!t) return;
      Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, "value").set.call(t, b.dataset.xlfill);
      t.dispatchEvent(new Event("input", { bubbles: true })); t.focus();
    }, true);
    const st = document.createElement("style");
    st.textContent = `
.xlx{margin:0 0 10px;padding:10px 12px 12px;border-radius:12px;background:#f4efe6;box-shadow:inset 0 0 0 1px rgba(31,33,37,.1);text-align:left}
.xlx>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;list-style:none;font-size:14px;color:#1f2125}
.xlx>summary::-webkit-details-marker{display:none}
.xlx>summary::before{content:"";width:7px;height:7px;border:solid #5b5547;border-width:0 2px 2px 0;transform:rotate(-45deg);margin-right:2px;align-self:center;transition:transform .15s}
.xlx[open]>summary::before{transform:rotate(45deg)}
.xlx>summary span{font-size:12.5px;color:#5b5547}
.xlx-w{margin-top:8px;overflow-x:auto;background:#fff;border:1px solid #c9c9c9;border-radius:4px;-webkit-overflow-scrolling:touch}
.xlx-t{border-collapse:collapse;font:12.5px/1.35 "Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:#1f2125;white-space:nowrap;min-width:100%}
.xlx-t th{background:#f0f0f0;color:#555;font-weight:400;border:1px solid #d4d4d4;padding:3px 8px;text-align:center;min-width:22px}
.xlx-t thead th{border-top:0}.xlx-t tr>th:first-child{border-left:0}
.xlx-t th.xlx-c{background:#e6e6e6}
.xlx-t td{border:1px solid #d4d4d4;padding:4px 9px;position:relative;background:#fff}
.xlx-t td.xlx-hd{font-weight:700;background:#f7f9f7}
.xlx-t td.xlx-n{text-align:right;font-variant-numeric:tabular-nums}
.xlx-t td.xlx-st{border-top:2px solid #217346}.xlx-t td.xlx-sb{border-bottom:2px solid #217346}
.xlx-t td.xlx-sl{border-left:2px solid #217346}.xlx-t td.xlx-sr{border-right:2px solid #217346}
.xlx-fh{position:absolute;right:-4px;bottom:-4px;width:6px;height:6px;background:#217346;border:1px solid #fff}
.xlx-s{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.6;color:#1f2125}
.xlx-s b{color:#1f2125}
.xlx-p{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:#5b5547}
.xlx-b{margin-top:8px;font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:9px;border:0;background:#fcf9f4;color:#20263a;box-shadow:inset 0 0 0 1.5px rgba(32,38,58,.35);cursor:pointer}
.xlx-b:hover{box-shadow:inset 0 0 0 2px #20263a}.xlx-b:active{transform:translateY(1px)}`;
    (document.head || document.documentElement).appendChild(st);
  }
})();

  if((m=s.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/))) return ymd(2000+ +m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[.\-\/월]\s?(\d{1,2})일?$/))) return ymd(defYear||new Date().getFullYear(),+m[1]-1,+m[2]);

/* ── 암호화 (Web Crypto, AES-GCM + PBKDF2) ── */
/* 바이너리 ↔ 16진수 문자열 (난독화로 오인되는 base64 함수 대신 사용) */
const b64 = { enc:b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join(""), dec:s=>new Uint8Array(s.match(/.{2}/g).map(x=>parseInt(x,16))) };
async function deriveKey(pw, saltB64){
  const salt = saltB64 ? b64.dec(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
  return { key, salt: b64.enc(salt) };
}
async function encryptStr(key, str){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, new TextEncoder().encode(str));
  return { enc:true, iv:b64.enc(iv), data:b64.enc(ct) };
}
async function decryptStr(key, obj){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(obj.iv)}, key, b64.dec(obj.data));
  return new TextDecoder().decode(pt);
}

/* 전체 거래를 날짜순으로 재생하여 보유·실현손익 계산 */
function replay(settings,allTx,merge){
  const key=t=>merge?t.code:(t.accountId+"|"+t.code);
  const pos={}; // key -> {code,name,accountId,qty,cost,firstDate,buys:[]}
  const sells=[]; // 실현 손익 레코드
  const tx=allTx.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.seq||0)-(b.seq||0));
  for(const t of tx){
    // 평단·투자원금은 매수단가 기준(수수료 제외). 매수 수수료는 포지션에 따로 누적해 두었다가 매도 시 수량 비율만큼 손익에 반영
    if(t.kind==="buy"){ const k=key(t); const p=pos[k]||(pos[k]={code:t.code,name:t.name,accountId:t.accountId,qty:0,cost:0,feeAcc:0,firstDate:t.date,lastDate:t.date,buys:0}); p.qty+=t.qty; p.cost+=t.price*t.qty; p.feeAcc+=(t.fee||0); p.name=t.name||p.name; p.lastDate=t.date; p.buys++; if(p.qty===t.qty) p.firstDate=t.date; }
    else if(t.kind==="sell"){ const k=key(t); const p=pos[k]; const avg=p&&p.qty>0?p.cost/p.qty:0; const feeShare=p&&p.qty>0?p.feeAcc*Math.min(t.qty,p.qty)/p.qty:0; const proceeds=t.price*t.qty-(t.fee||0)-(t.tax||0); const costBasis=avg*t.qty; const pl=proceeds-costBasis-feeShare; const hold=p?Math.round((new Date(t.date)-new Date(p.firstDate))/86400000):0;
      sells.push({...t,avg,costBasis,proceeds,buyFee:feeShare,pl,plPct:pct(pl,costBasis),holdDays:hold,noPos:!p||p.qty<t.qty});
      if(p){ p.feeAcc-=feeShare; p.qty-=t.qty; p.cost-=costBasis; if(p.qty<=0){ p.qty=0; p.cost=0; p.feeAcc=0; } } }
  }
  const holdings=Object.values(pos).filter(p=>p.qty>0).map(p=>({...p,avg:p.cost/p.qty}));
  return {holdings,sells};
}
/* 자산 현황: 전체 기간 누적 (기간 필터와 무관) */
function assetsOf(allTx,holdings,acct){
  const tx=acct?allTx.filter(t=>t.accountId===acct):allTx;
  let cash=0; for(const t of tx){ if(t.kind==="dep") cash+=t.amount; else if(t.kind==="wd") cash-=t.amount; else if(t.kind==="div") cash+=t.amount; else if(t.kind==="buy") cash-=t.price*t.qty+(t.fee||0); else if(t.kind==="sell") cash+=t.price*t.qty-(t.fee||0)-(t.tax||0); }
  const hs=acct?holdings.filter(h=>h.accountId===acct):holdings; const stock=hs.reduce((s,h)=>s+h.cost,0);
  const dep=tx.filter(t=>t.kind==="dep").reduce((s,t)=>s+t.amount,0)-tx.filter(t=>t.kind==="wd").reduce((s,t)=>s+t.amount,0);
  return {cash,stock,total:cash+stock,dep};
}
function AssetsBar({allTx,rep,acct,showCum}){
  const A=assetsOf(allTx,rep.holdings,acct); const pl=A.total-A.dep;
  return html`<div class="sum" style=${{gridTemplateColumns:`repeat(${showCum?4:3},1fr)`,marginBottom:8}}>
    <div class="c hi" title="보유주식 + 보유현금"><div class="t">총자산</div><div class="v">${won(A.total)}</div></div>
    <div class="c" title="평단 × 수량 (수수료 제외)"><div class="t">보유주식</div><div class="v">${won(A.stock)}</div></div>
    <div class="c" title="입금 − 출금 − 매수대금 − 수수료 + 매도수령액 − 세금 + 배당"><div class="t">보유현금</div><div class="v ${A.cash<0?"exp":""}">${won(A.cash)}</div></div>
    ${showCum?html`<div class="c" title=${"총자산 − 순입금("+A.dep.toLocaleString()+"원)"}><div class="t">누적 손익</div><div class="v ${pl>0?"inc":pl<0?"exp":""}">${sgn(pl)} <span class="small">${A.dep?fmtPct(pct(pl,A.dep)):""}</span></div></div>`:null}
  </div>`;
}
function inRange(d,from,to){ return (!from||d>=from)&&(!to||d<=to); }
function quickRange(q){ const t=new Date(); const y=t.getFullYear(), m=t.getMonth();
  if(q==="year") return [ymd(y,0,1),todayStr()]; if(q==="lyear") return [ymd(y-1,0,1),ymd(y-1,11,31)];
  if(q==="month") return [ymd(y,m,1),ymd(y,m,dim_(y,m))]; if(q==="lmonth"){ const yy=m===0?y-1:y, mm=m===0?11:m-1; return [ymd(yy,mm,1),ymd(yy,mm,dim_(yy,mm))]; }
  return ["",""]; }

/* 날짜 입력 + 요일 표시 */
function dowOf(d){ if(!d||d.length<10) return ""; const t=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)); return isNaN(t)?"":"일월화수목금토"[t.getDay()]; }
/* 날짜 위젯: 보이는 텍스트칸("2026-09-20(일)") + 숨은 실제 date 입력 + 달력 아이콘. 클릭하면 선택창이 열립니다 */
function DateInput({value,onInput,style,width}){
  const ref=useRef(); const w=dowOf(value);
  const open=()=>{ const n=ref.current; if(!n) return; try{ n.showPicker?n.showPicker():n.focus(); }catch(e){ n.focus(); } };
  return html`<span class="date-field" style=${style}>
    <input type="text" class="date-display ${w==="일"?"exp":w==="토"?"sat":""}" readonly value=${value?`${value}(${w})`:""} placeholder="년-월-일" style=${{width:(width||132)+"px"}} onClick=${open} />
    <input type="date" class="date-native" ref=${ref} value=${value} onInput=${onInput} tabindex="-1" />
    <span class="date-icon-btn" title="날짜 선택" onClick=${open}><${Icon} name="calendar" size=${18} /></span>
  </span>`;
}

/* ══════════ 공통 필터 바 ══════════ */
function FilterBar({s,f,setF,extra}){
  const q=(k)=>{ const [a,b]=quickRange(k); setF({...f,quick:k,from:a,to:b}); };
  return html`<div class="filters">
    <select value=${f.acct} onChange=${e=>setF({...f,acct:e.target.value})}><option value="">전체 계좌</option>${s.accounts.map(a=>html`<option value=${a.id}>${a.name}</option>`)}</select>
    ${["all","전체","year","올해","lyear","전년","month","당월","lmonth","전월"].reduce((acc,v,i,arr)=>{ if(i%2===0) acc.push(html`<button class="btn s ${f.quick===v?"p":""}" onClick=${()=>q(v)}>${arr[i+1]}</button>`); return acc; },[])}
    <${DateInput} value=${f.from} onInput=${e=>setF({...f,quick:"",from:e.target.value})} /><span class="muted">~</span><${DateInput} value=${f.to} onInput=${e=>setF({...f,quick:"",to:e.target.value})} />
    <input placeholder="종목·메모 검색" value=${f.q} onInput=${e=>setF({...f,q:e.target.value})} style="min-width:120px" />
    ${extra}
  </div>`;
}
function applyFilter(list,f){ let l=list; if(f.acct) l=l.filter(t=>t.accountId===f.acct); l=l.filter(t=>inRange(t.date,f.from,f.to)); if(f.q){ const q=f.q.toLowerCase(); l=l.filter(t=>((t.name||"")+(t.code||"")+(t.memo||"")+(t.reason||"")).toLowerCase().includes(q)); } return l; }

/* 종목 자동완성 입력 */
function StockInput({s,name,code,onPick,onName,onCode}){
  const [open,setOpen]=useState(false); const [q,setQ]=useState("");
  const hits=useMemo(()=>open?stockSearch(s,q):[],[open,q,s]);
  const pick=x=>{ onPick(x); setOpen(false); };
  return html`<div class="dd" style="position:relative">
    <div><label class="f">종목명</label><input value=${name} placeholder="예: 삼성전자" autocomplete="off" onInput=${e=>{ onName(e.target.value); setQ(e.target.value); setOpen(true); }} onFocus=${e=>{ setQ(e.target.value); setOpen(true); }} onBlur=${()=>setTimeout(()=>setOpen(false),150)} /></div>
    <div><label class="f">종목코드 (선택)</label><input value=${code} placeholder="005930" autocomplete="off" onInput=${e=>{ const v=e.target.value.replace(/[^0-9]/g,"").slice(0,6); onCode(v); if(v.length===6){ const x=stockByCode(s,v); if(x) onPick(x); else { setQ(v); setOpen(true); } } else { setQ(v); setOpen(v.length>=2); } }} onBlur=${()=>setTimeout(()=>setOpen(false),150)} /></div>
    ${open&&hits.length?html`<div class="ac">${hits.map(x=>html`<div class="ac-i" onMouseDown=${e=>{e.preventDefault();pick(x);}}><b>${x.name}</b><span class="muted">${x.code}${MK[x.mk]?" · "+MK[x.mk]:""}</span></div>`)}</div>`:null}
  </div>`;
}

      <div><label class="f">계좌</label><select value=${f.accountId} onChange=${e=>up("accountId",e.target.value)}>${s.accounts.map(a=>html`<option value=${a.id}>${a.name}</option>`)}</select></div></div>
    ${(isTrade||f.kind==="div")&&html`
      ${held.length&&(f.kind==="sell"||f.kind==="div")?html`<label class="f">보유 종목에서 선택</label><div class="row" style="flex-wrap:wrap;gap:4px">${held.map(h=>html`<button class="btn s ${f.code===h.code?"p":""}" style="flex:0" onClick=${()=>pick(h)}>${h.name} ${h.qty}주</button>`)}</div>`:null}
      <${StockInput} s=${s} name=${f.name} code=${f.code} onName=${v=>up("name",v)} onCode=${v=>up("code",v)} onPick=${x=>setF(p=>({...p,name:x.name,code:x.code}))} />`}
    ${isTrade&&html`

        <div><label class="f">수량</label><input inputmode="numeric" data-money value=${f.qty} style="text-align:right" onInput=${e=>up("qty",e.target.value)} /></div></div>

  <//>`;

/* ══════════ 일괄 입력 ══════════ */
const BULK_HEADER=["날짜","구분","계좌","종목코드","종목명","단가","수량","수수료","세금","금액","그룹","메모"];
const BULK_SAMPLE=[["2026-08-03","입금","주식계좌","","","","","","","5000000","",""],["2026-08-05","매수","주식계좌","005930","삼성전자","71500","20","","","","","실적 기대"],["2026-08-20","매수","주식계좌","000660","SK하이닉스","198000","5","","","","",""],["2026-09-02","매도","주식계좌","005930","삼성전자","76800","10","","","","","목표가"],["2026-09-15","배당","주식계좌","005930","삼성전자","","","","","3610","",""]];
function bulkTSV(rows){ return [BULK_HEADER,...rows].map(r=>r.join("\t")).join("\n"); }
function parseBulk(text,s){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()); if(!lines.length) return {rows:[],err:"내용이 없습니다"};
  const sep=lines[0].includes("\t")?"\t":(lines[0].includes(",")?",":null); if(!sep) return {rows:[],err:"탭 또는 쉼표로 구분된 표를 붙여넣어 주세요"};
  let rows=lines.map(l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,"")));
  let map={date:0,kind:1,acct:2,code:3,name:4,price:5,qty:6,fee:7,tax:8,amount:9,group:10,memo:11};
  const hd=rows[0].map(x=>x.replace(/\s/g,""));
  if(hd.some(x=>/날짜|일자|거래일/.test(x))){ const find=(re)=>hd.findIndex(x=>re.test(x)); map={date:find(/날짜|일자|거래일/),kind:find(/구분|유형|매매구분|거래구분/),acct:find(/계좌/),code:find(/코드/),name:find(/종목명|종목$|이름/),price:find(/단가|가격|체결가/),qty:find(/수량/),fee:find(/수수료/),tax:find(/세금|거래세/),amount:find(/^금액|입금액|배당금/),group:find(/그룹/),memo:find(/메모|비고|사유/)}; rows=rows.slice(1); }
  const g=(r,k)=>map[k]>=0?(r[map[k]]||""):"";
  const norm=x=>String(x||"").replace(/\s/g,"").toLowerCase();
  const out=rows.map((r,i)=>{ const o={line:i+1,ok:true,msgs:[]};
    o.date=parseDate(g(r,"date")); if(!o.date){o.ok=false;o.msgs.push("날짜 오류");}
    const ks=g(r,"kind"); o.kind=/매수|buy/i.test(ks)?"buy":/매도|sell/i.test(ks)?"sell":/배당|div/i.test(ks)?"div":/출금|withdraw/i.test(ks)?"wd":/입금|deposit/i.test(ks)?"dep":null; if(!o.kind){o.ok=false;o.msgs.push("구분 오류");}
    const an=g(r,"acct"); const a=s.accounts.find(x=>norm(x.name)===norm(an))||s.accounts.find(x=>an&&norm(an).includes(norm(x.name)))||(!an?s.accounts[0]:null); if(!a){o.ok=false;o.msgs.push(`'${an}' 계좌 없음`);} else o.accountId=a.id; o.acctName=a?a.name:an;
    o.code=g(r,"code").replace(/[^0-9]/g,""); if(o.code&&o.code.length<6&&/^\d+$/.test(o.code)) o.code=o.code.padStart(6,"0"); o.name=g(r,"name"); o.memo=g(r,"memo");
    if(o.code&&!o.name){ const x=stockByCode(s,o.code); if(x) o.name=x.name; }
    if(o.name&&!o.code){ const x=stockList(s).find(y=>norm(y.name)===norm(o.name)); if(x) o.code=x.code; }
    const gn=g(r,"group"); if(gn){ const gr=s.groups.find(x=>norm(x.name)===norm(gn)); if(gr) o.groupId=gr.id; else { o.newGroup=gn; } }
    if(o.kind==="buy"||o.kind==="sell"){ o.price=parseAmount(g(r,"price")); o.qty=parseAmount(g(r,"qty")); if(!(o.price>0)||!(o.qty>0)){o.ok=false;o.msgs.push("단가/수량 오류");} if(!o.name){o.ok=false;o.msgs.push("종목명 없음");}
      const fe=parseAmount(g(r,"fee")), tx=parseAmount(g(r,"tax")); o.fee=isNaN(fe)?feeCalc(s,o.kind,o.price,o.qty):fe; o.tax=o.kind==="sell"?(isNaN(tx)?taxCalc(s,o.kind,o.price,o.qty):tx):0; o.amount=o.price*o.qty; }
    else if(o.kind){ let am=parseAmount(g(r,"amount")); if(isNaN(am)){ am=parseAmount(g(r,"price")); } o.amount=Math.abs(am); if(!(o.amount>0)){o.ok=false;o.msgs.push("금액 오류");} if(o.kind==="div"&&!o.name){o.ok=false;o.msgs.push("종목명 없음");} }
    return o; });
  return {rows:out,err:null};
}

/* KRX 전종목 기본정보 CSV 파싱 (EUC-KR/UTF-8 자동, 따옴표 안 쉼표 처리) */
async function readTextAuto(file){ const buf=await file.arrayBuffer(); let t=new TextDecoder("utf-8",{fatal:false}).decode(buf); if(/\uFFFD/.test(t)||!/[가-힣]/.test(t.slice(0,2000))){ try{ t=new TextDecoder("euc-kr").decode(buf); }catch(e){} } return t.replace(/^\uFEFF/,""); }
function parseKrxCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return {err:"유효한 CSV가 아닙니다"};
  const sep=lines[0].includes("\t")?"\t":",";
  const parseLine=line=>{ if(sep==="\t") return line.split("\t").map(x=>x.trim().replace(/^"|"$/g,"")); const res=[]; let cur="",inQ=false; for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; } else if(c===sep&&!inQ){ res.push(cur.trim()); cur=""; } else cur+=c; } res.push(cur.trim()); return res; };
  const headers=parseLine(lines[0]).map(h=>h.replace(/\s+/g,""));
  const findCol=(...c)=>{ for(const x of c){ let i=headers.findIndex(h=>h===x); if(i<0) i=headers.findIndex(h=>h.includes(x)); if(i>=0) return i; } return -1; };
  const codeIdx=findCol("단축코드","종목코드","Code"), nameIdx=findCol("한글종목약명","한글종목명","종목명","Name"), mktIdx=findCol("시장구분","Market","상장시장");
  if(nameIdx<0||codeIdx<0) return {err:"종목명/단축코드 열을 찾지 못했습니다. 헤더: "+headers.slice(0,8).join(" | ")};
  const out=[]; let konex=0;
  for(let i=1;i<lines.length;i++){ const c=parseLine(lines[i]); const name=(c[nameIdx]||"").trim(); let code=(c[codeIdx]||"").trim(); if(!name||!code) continue; if(/^\d+$/.test(code)) code=code.padStart(6,"0"); if(!/^\d{6}$/.test(code)&&!/^\d{5}[A-Z0-9]$/.test(code)) continue;
    const m=(mktIdx>=0?c[mktIdx]:"")||""; const mu=m.toUpperCase(); if(/KONEX|코넥스/.test(mu)){ konex++; continue; } const mk=/KOSDAQ|코스닥/.test(mu)?"Q":/KOSPI|코스피|유가/.test(mu)?"P":"?";
    out.push({code,name,mk}); }

}

    const ns=clone(s); const base=new Map(STOCK_BASE.map(([c,n])=>[c,n])); let added=0,updated=0; const cur=new Map((ns.customStocks||[]).map(x=>[x.code,x]));

const LS_PRICES="mm1:prices";
function App(){
  const [settings,setSettings]=useState(null); const [txByYear,setTxByYear]=useState({}); const [prices,setPrices]=useState({});
  const [locked,setLocked]=useState(false); const [ready,setReady]=useState(false); const [needPerm,setNeedPerm]=useState(false);
  const [view,setView]=useState("trades"); const [modal,setModal]=useState(null);
  const [f,setF_]=useState({acct:"",quick:"year",from:ymd(new Date().getFullYear(),0,1),to:todayStr(),q:""});
  const setF=(nf)=>{ setF_(nf); try{ localStorage.setItem("mm1:filter",JSON.stringify({acct:nf.acct,quick:nf.quick,from:nf.from,to:nf.to})); }catch(e){} };
  const loadAll=async()=>{ let s=await Store.loadSettings(); if(!s){ s=DEFAULT_SETTINGS(); await Store.saveSettings(s); }
    s={...DEFAULT_SETTINGS(),...s,fees:{...DEFAULT_SETTINGS().fees,...(s.fees||{})},prefs:{...DEFAULT_SETTINGS().prefs,...(s.prefs||{})},security:s.security||{enabled:false}};
    const tb={}; for(const yr of Store.years()) tb[yr]=await Store.loadYear(yr);
    const pr=(await Store.unpack(localStorage.getItem(LS_PRICES)))||{};
    try{ const sv=JSON.parse(localStorage.getItem("mm1:filter")||"null"); if(sv){ if(sv.quick==="year"||!sv.quick&&!sv.from) setF_(p=>({...p,acct:sv.acct||"",quick:"year",from:ymd(new Date().getFullYear(),0,1),to:todayStr()})); else setF_(p=>({...p,acct:sv.acct||"",quick:sv.quick||"",from:sv.from||"",to:sv.to||""})); } }catch(e){}
    setSettings(s); setTxByYear(tb); setPrices(pr); setView(s.prefs.defaultView||"hold"); setReady(true); };
  useEffect(()=>{ (async()=>{ const h=await HDB.get(); if(h){ const p=await h.queryPermission({mode:"readwrite"}); if(p==="granted") Store.dirHandle=h; else setNeedPerm(true); }
    const raw=Store.rawSettings(); if(raw&&raw.enc){ setLocked(true); setReady(true); } else await loadAll(); })(); },[]);
  const unlock=async(pw)=>{ const raw=Store.rawSettings(); try{ const {key}=await deriveKey(pw,raw.salt); Store.key=key; Store.salt=raw.salt; await decryptStr(key,raw); await loadAll(); setLocked(false); setTimeout(()=>{ if(GS.m().on&&GS.live()) GS.sync({toast:false}); else GS.paint(); },300); return true; }catch(e){ Store.key=null; return false; } };
  const lockNow=()=>{ if(!settings.security.enabled) return; Store.key=null; Store.salt=null; setSettings(null); setTxByYear({}); setLocked(true); setModal(null); };
  const reconnect=async()=>{ const h=await HDB.get(); if(!h) return setNeedPerm(false); try{ const p=await h.requestPermission({mode:"readwrite"}); if(p==="granted"){ Store.dirHandle=h; setNeedPerm(false); toast("폴더를 다시 연결했습니다"); } }catch(e){} };
  const savePrices=async(pr)=>{ setPrices(pr); const p=await Store.pack(pr); localStorage.setItem(LS_PRICES,p); Store.writeFile("시세.json",p); };
  const db=useMemo(()=>({
    get settings(){ return settings; }, get txByYear(){ return txByYear; },
    async saveSettings(ns){ setSettings(ns); await Store.saveSettings(ns); },
    async saveYear(yr,list){ setTxByYear(p=>({...p,[yr]:list})); await Store.saveYear(yr,list); },
    async upsertTx(t){ const yr=+t.date.slice(0,4); for(const k of Object.keys(txByYear)){ if(+k!==yr&&txByYear[k].some(x=>x.id===t.id)) await this.saveYear(+k,txByYear[k].filter(x=>x.id!==t.id)); }
      const list=(txByYear[yr]||[]).filter(x=>x.id!==t.id); list.push(t); await this.saveYear(yr,list); },
    async delTx(id,date){ const yr=+date.slice(0,4); await this.saveYear(yr,(txByYear[yr]||[]).filter(x=>x.id!==id)); },
    async addMany(list){ const by={...txByYear}; for(const t of list){ const yr=+t.date.slice(0,4); by[yr]=[...(by[yr]||[]),t]; } for(const yr of Object.keys(by)) if(list.some(t=>+t.date.slice(0,4)===+yr)) await Store.saveYear(+yr,by[yr]); setTxByYear(by); },
    async setPassword(pw){ const ns=clone(settings); if(pw){ const {key,salt}=await deriveKey(pw); Store.key=key; Store.salt=salt; ns.security={enabled:true}; } else { Store.key=null; Store.salt=null; ns.security={enabled:false}; }
      setSettings(ns); await Store.saveSettings(ns); for(const yr of Object.keys(txByYear)) await Store.saveYear(+yr,txByYear[yr]); await savePrices(prices); },
    async writeAllToFolder(){ await Store.saveSettings(settings); for(const yr of Object.keys(txByYear)) await Store.saveYear(+yr,txByYear[yr]); await savePrices(prices); },
    async loadAllFromFolder(){ let n=0; try{ const files=await Store.listFolder(); const st=await Store.readFile("settings.json"); if(st&&await Store.unpack(st)){ localStorage.setItem(LS.settings,st); n++; }
      const pr=await Store.readFile("시세.json"); if(pr&&await Store.unpack(pr)){ localStorage.setItem(LS_PRICES,pr); n++; }
      for(const fn of files){ const mm=fn.match(/^매매일지_(\d{4})\.json$/); if(mm){ const c=await Store.readFile(fn); if(await Store.unpack(c)){ localStorage.setItem(LS.year(+mm[1]),c); n++; } } } }catch(e){ return -1; } GS.touchAll(); await loadAll(); return n; },
    async exportBackup(){ const data={app:"mm",ver:APP_VER,exported:new Date().toISOString(),settings,years:txByYear,prices}; let s=JSON.stringify(data);
      if(Store.key){ const e=await encryptStr(Store.key,s); s=JSON.stringify({app:"mm",ver:APP_VER,enc:true,salt:Store.salt,iv:e.iv,data:e.data}); } return new Blob([s],{type:"application/json"}); },
    async importBackup(text){ try{ let o=JSON.parse(text); if(o.enc){ let ok=false; if(Store.key){ try{ o=JSON.parse(await decryptStr(Store.key,o)); ok=true; }catch(e){} } if(!ok){ const pw=prompt("백업 파일의 암호를 입력하세요"); if(!pw) return "취소했습니다"; const {key:k}=await deriveKey(pw,o.salt); o=JSON.parse(await decryptStr(k,o)); } }
      if(o.app!=="mm"||!o.settings) return "매매일지 백업 파일이 아닙니다"; Store.clearAll(); await Store.saveSettings(o.settings); for(const yr of Object.keys(o.years||{})) await Store.saveYear(+yr,o.years[yr]); if(o.prices) await savePrices(o.prices); await loadAll(); return "복원했습니다"; }catch(e){ return "복원 실패: 파일이 손상되었거나 암호가 다릅니다"; } },
  }),[settings,txByYear,prices]);
  const [sk,setSk]=useState(0);
  useEffect(()=>{ window.__bjLoadAll=loadAll; window.__bjBackup=async(t)=>{ dl(await db.exportBackup(),`매매일지_백업_${t||""}_${todayStr().replace(/-/g,"")}.json`); }; window.__bjGoData=()=>{ window.__bjSec="data"; setSk(k=>k+1); setView("set"); }; });

  if(!ready) return html`<div class="lock"><div class="muted">불러오는 중…</div></div>`;
  if(locked) return html`<${LockScreen} onUnlock=${unlock} />`;
  if(!settings) return null;
  const allTx=Object.values(txByYear).flat();
  const rep=useMemo(()=>replay(settings,allTx,settings.prefs.mergeAccounts),[txByYear,settings]);
  const onPrice=(upd)=>{ const pr=clone(prices); const d=todayStr(); for(const k of Object.keys(upd)) pr[k]={price:upd[k],date:d}; savePrices(pr); };
  return html`<div class="app">
    <div class="top">
      <div class="brand"><span class="lg"><${Icon} name="trend" size=${20} sw=${2.4} /><span class="jmini">J</span></span>매매일지<span class="cat">재무</span><span class="ver">v${APP_VER}</span></div>
      <div class="tabs">${[["hold","pie","보유종목"],["trades","list","거래내역"],["anal","chart","분석"],["set","gear","설정"]].map(([k,ic,l])=>html`<button class=${view===k?"on":""} onClick=${()=>setView(k)}><${Icon} name=${ic} size=${16} /> ${l}</button>`)}</div>
      <div class="actions"><${GdChip} onGo=${()=>window.__bjGoData()} /><button class="btn ghost" onClick=${()=>setModal({kind:"bulk"})}><${Icon} name="upload" size=${16} /> 일괄 입력</button><button class="btn p hide-m" onClick=${()=>setModal({kind:"tx"})}><${Icon} name="plus" size=${16} sw=${2.4} /> 입력</button>${settings.security.enabled?html`<button class="btn ghost ic" aria-label="잠그기" onClick=${lockNow}><${Icon} name="lock" size=${17} /></button>`:null}</div>
    </div>
    ${needPerm&&html`<div class="note w row"><span class="grow">저장 폴더에 다시 접근하려면 허용이 필요합니다.</span><button class="btn s p" style="flex:0" onClick=${reconnect}>폴더 다시 연결</button><button class="btn s g" style="flex:0" onClick=${()=>setNeedPerm(false)}>나중에</button></div>`}
    <${MoveNote} onGo=${()=>window.__bjGoData()} />
    ${(view==="trades"||view==="hold")&&!allTx.length?html`<${Onboard} onEdit=${t=>setModal({kind:"tx",init:t})} onBulk=${()=>setModal({kind:"bulk"})} />`:null}
    ${view==="trades"&&allTx.length?html`<${TradesView} db=${db} allTx=${allTx} rep=${rep} f=${f} setF=${setF} onBulk=${()=>setModal({kind:"bulk"})} onEdit=${t=>setModal({kind:"tx",init:{...t,price:t.price?String(t.price):"",qty:t.qty?String(t.qty):"",fee:t.fee!=null?String(t.fee):"",tax:t.tax!=null?String(t.tax):"",amount:t.amount?String(t.amount):"",reason:t.reason||"",memo:t.memo||"",code:t.code||"",name:t.name||"",groupId:t.groupId||""}})} />`:null}
    ${view==="hold"&&allTx.length?html`<${HoldingsView} db=${db} rep=${rep} prices=${prices} onPrice=${onPrice} acct=${f.acct} setAcct=${v=>setF({...f,acct:v})} allTx=${allTx} f=${f} />`:null}
    ${view==="anal"&&html`<${AnalysisView} db=${db} allTx=${allTx} rep=${rep} f=${f} setF=${setF} />`}
    ${view==="set"&&html`<${SettingsView} key=${sk} db=${db} onLock=${lockNow} />`}
    <button class="fab" onClick=${()=>setModal({kind:"tx"})}>+</button>
    ${modal?.kind==="tx"&&html`<${TxModal} db=${db} init=${modal.init} holdings=${rep.holdings} onClose=${()=>setModal(null)} />`}
    ${modal?.kind==="bulk"&&html`<${BulkModal} db=${db} onClose=${()=>setModal(null)} />`}
    <div class="foot">Copyright © <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a> | All Rights Reserved</div>
    <${Toast} />
  </div>`;
}

    ${pc && GS_QR ? html`<div class="gsmob"><div class="qr" dangerouslySetInnerHTML=${{ __html: GS_QR }}></div><div><b>휴대폰에서도 쓰기</b><div class="muted">${m.on ? "휴대폰 카메라로 QR을 찍어 설치하고(「앱 설치」 · 「홈 화면에 추가」), 휴대폰 설정에서 같은 구글 계정으로 「구글 드라이브 연결」을 누르면 이 기록이 그대로 보여요." : "① 위 「구글 드라이브 연결」 ② 휴대폰 카메라로 QR을 찍어 설치 ③ 휴대폰에서도 같은 구글 계정으로 연결 — 그러면 PC와 휴대폰이 같은 기록을 써요."}</div><div class="muted gsurl">${GS_URL.replace(/^https:\/\//, "")}</div></div></div>` : null}
  </div>`;
}

/* 기록이 없을 때 한 번 — v1.0(내려받은 파일)에서 옮겨 오기 */
function MoveNote({ onGo }) {
  const k = GS_CFG.pfx + "gs:movenote"; const [x, setX] = useState(() => { try { return localStorage.getItem(k) === "off"; } catch (e) { return false; } });
  if (x || GS.hasTx()) return null;
  const close = () => { try { localStorage.setItem(k, "off"); } catch (e) {} setX(true); };
  return html`<div class="note gsmove"><b>v1.0(내려받은 파일)을 쓰셨나요?</b> 그 기록은 이 앱으로 저절로 오지 않아요. v1.0에서 「설정 › 저장·백업 › 백업 파일 내려받기」를 한 뒤, 여기 <b>「설정 › 저장 · 동기화 › 백업 파일에서 복원」</b>을 누르면 그대로 옮겨져요(쓰던 폴더가 있으면 「폴더 선택 → 폴더에서 불러오기」).
    <div class="row" style="margin-top:8px;justify-content:flex-start"><button class="btn s p" style="flex:0" onClick=${onGo}>옮기러 가기</button><button class="btn s g" style="flex:0" onClick=${close}>처음 써요 · 닫기</button></div></div>`;
}

render(html`<${App} />`, document.getElementById("root"));
