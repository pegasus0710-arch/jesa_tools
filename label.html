:root{
--paper:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f3f1ea;--line:#e7e5dc;--line2:#d7d4c8;
--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--navy:#20263a;--amber:#e08a3e;--amber-d:#c9742c;--cat:#1f7f8f;--catbg:#e3f3f5;
--ok:#2e8a58;--okbg:#e6f3ec;--bad:#b84a3c;--badbg:#f8e9e6;--warn:#d98a1a;--warnbg:#fbf0dc;
--mat:#1c2232;--mat-line:rgba(255,255,255,.055);--mat-line2:rgba(255,255,255,.11);
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh2:0 10px 30px rgba(30,28,20,.09);--sh-paper:0 18px 40px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:var(--font);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ── 위 도구 막대: 로고 + 도구 이름 + 눈금 진행 ── */
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.bar-in{max-width:1360px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:flex-end;gap:28px}
.brand{display:flex;align-items:center;gap:11px;padding-bottom:14px;flex-shrink:0}
.lg{width:36px;height:36px;border-radius:10px;background:var(--cat);display:grid;place-items:center;position:relative}
.lg svg{width:21px;height:21px}
.lg i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--amber);border:2.5px solid var(--navy)}
.brand b{font-family:var(--head);font-size:18px;letter-spacing:-.3px;display:block;line-height:1.2}
.brand small{font-size:11.5px;color:rgba(255,255,255,.62);display:block}
/* 눈금자 진행 표시 */
.ruler{flex:1;min-width:0;position:relative;height:58px}
.ruler-track{position:absolute;left:0;right:0;top:20px;height:12px;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,
   repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat}
.ruler-done{position:absolute;left:0;top:30px;height:3px;background:#fff;border-radius:2px;transition:width .35s ease}
.ruler-steps{position:absolute;inset:0;display:flex}
.ruler-steps button{flex:1;min-width:0;position:relative;text-align:left;padding:38px 0 0 0;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruler-steps button::before{content:"";position:absolute;left:0;top:14px;width:2px;height:22px;background:rgba(255,255,255,.55)}
.ruler-steps button.done{color:rgba(255,255,255,.88)}
.ruler-steps button.cur{color:#fff}
.ruler-steps button:disabled{cursor:default}
.ruler-steps button span{padding-left:8px}
.ruler-dot{position:absolute;top:24px;width:16px;height:16px;margin-left:-7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(224,138,62,.25);transition:left .35s ease}
.ruler-m{display:none}

/* ── 본문: 왼쪽 작업 패널 + 오른쪽 작업판(미리보기) ── */
.lay{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:460px minmax(0,1fr);gap:22px;padding:22px 20px 40px;align-items:start}
.lay>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.ph{padding:22px 24px 4px}
.ph .k{font-size:12.5px;color:var(--cat);font-weight:800}
.ph h2{font-family:var(--head);font-size:21px;letter-spacing:-.4px;line-height:1.3;margin-top:2px}
.ph p{font-size:13.5px;color:var(--ink2);margin-top:4px}
.pb{padding:16px 24px 8px}
.pf{display:flex;gap:8px;padding:16px 24px 22px;border-top:1px solid var(--line);margin-top:14px;position:sticky;bottom:0;background:#fff;border-radius:0 0 var(--r) var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-btn);font-weight:700;font-size:14px;border:1px solid var(--line2);background:#fff;color:var(--navy);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn.go{background:var(--amber);border-color:var(--amber);color:#fff;flex:1;font-size:15px;padding:12px 16px}
.btn.go:hover{background:var(--amber-d)}
.btn.nv{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.nv:hover{background:#2c3450}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--navy);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* 고르기 카드 */
.pick{display:grid;gap:10px}
.pick.two{grid-template-columns:1fr 1fr}
.pc{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;position:relative;min-width:0}
.pc:hover{border-color:var(--navy)}
.pc.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.pc.on::after{content:"";position:absolute;right:12px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.pc b{font-family:var(--head);font-size:16px;letter-spacing:-.2px}
.pc small{font-size:12.5px;color:var(--ink2);line-height:1.5}
.pc .ic{width:40px;height:40px;border-radius:11px;background:var(--catbg);color:var(--cat);display:grid;place-items:center;flex-shrink:0}
.pc .ic svg{width:22px;height:22px}
.pc.row{flex-direction:row;align-items:center;gap:12px;padding:13px 14px}
.pc.row>div{min-width:0}
.pc.row b{font-size:15px;display:block}

/* 라벨지 목록 */
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px}
.seg button{flex:1;min-width:0;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:12px}
.sh{border:1.5px solid var(--line2);border-radius:12px;background:#fff;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.sh:hover{border-color:var(--navy)}
.sh.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.sh.on::after{content:"";position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.sh svg{width:100%;height:auto;display:block}
.sh b{font-size:13.5px;font-family:var(--head)}
.sh small{font-size:11.5px;color:var(--ink3);line-height:1.35}
.sh .rec{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:800;background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px}
.fine{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:10px}
.fine b{color:var(--ink2)}

/* 입력 칸 */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .m{font-weight:500;color:var(--ink3)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:14px;min-width:0}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
textarea.inp{min-height:180px;resize:vertical;line-height:1.6;font-size:13.5px;white-space:pre;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2>*,.g4>*{min-width:0}
.mm{position:relative}.mm .inp{padding-right:34px}.mm em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--ink3);pointer-events:none}
.mm small{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2);margin-top:10px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--navy)}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px 16px;text-align:center;background:var(--paper);color:var(--ink2);font-size:13.5px}
.drop.ov{border-color:var(--navy);background:#eef0f5}
.drop b{display:block;color:var(--ink);font-size:15px;margin:6px 0 2px}
.drop svg{width:28px;height:28px;color:var(--cat)}
.samp{display:flex;align-items:center;gap:10px;background:var(--catbg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;color:#165e6a}
.samp svg{width:20px;height:20px;flex-shrink:0}
.samp>div{flex:1;min-width:0}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:12px}

<body>
<div id="root"></div>
<div id="printArea"></div>
<script>
/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev) { embedOK = inFrame; return true; }
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }

/* ── 우편번호 찾기 (행정안전부 도로명주소 검색 API) ── */
function splitAddr(a) {
  let t = String(a || "").replace(/\s+/g, " ").trim(), paren = "";
  t = t.replace(/\s*\(([^)]*)\)/g, (m, p) => { paren = paren ? paren + "," + p : p; return ""; }).trim();
  let m = t.match(/^(.*?(?:로|길)\s*\d+(?:-\d+)?)(?=$|[\s,])(.*)$/);
  if (!m) m = t.match(/^(.*?(?:동|리|가)\s*(?:산\s*)?\d+(?:-\d+)?)(?=$|[\s,])(.*)$/);
  if (!m) return { q: t, d: "", paren };
  return { q: m[1].trim(), d: m[2].replace(/^[\s,]+/, "").trim(), paren };
}
async function jusoQuery(kw) {
  const u = JUSO_API + "?confmKey=" + encodeURIComponent(JUSO_KEY) + "&currentPage=1&countPerPage=10&keyword=" + encodeURIComponent(kw) + "&resultType=json";
  const r = await fetch(u); if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json(); return j.results || { common: { errorCode: "?", errorMessage: "알 수 없는 응답" }, juso: [] };
}
const ERR = { E0001: "승인키 문제 — Blog J에 알려 주세요", E0005: "주소를 입력해 주세요", E0006: "주소를 더 자세히 적어 주세요 (도로명 + 건물번호)", E0008: "주소가 너무 짧아요", E0009: "주소에 숫자·글자만 있어요", E0010: "주소가 너무 길어요", E0011: "주소가 너무 길어요", E0012: "주소에 쓸 수 없는 글자가 있어요", E0013: "주소에 쓸 수 없는 특수문자가 있어요", E0014: "검색어에 쓸 수 없는 단어가 있어요", E0015: "검색 범위가 너무 넓어요" };
async function lookupOne(r) {
  const sp = splitAddr(r.f.addr);
  if (!sp.q || sp.q.length < 2) { r.st = "fail"; r.msg = "주소가 비어 있어요"; return; }
  try {
    const res = await jusoQuery(sp.q), c = res.common || {}, L = res.juso || [];
    if (c.errorCode && c.errorCode !== "0") { r.st = "fail"; r.msg = ERR[c.errorCode] || c.errorMessage || "찾지 못했어요"; return; }
    if (!L.length) { r.st = "fail"; r.msg = "이 주소를 찾지 못했어요. 도로명과 건물번호를 확인해 주세요."; return; }
    const zips = new Set(L.map(x => x.zipNo));
    if (zips.size === 1) { r.f.zip = L[0].zipNo; r.road = L.length === 1 ? L[0] : null; r.st = "ok"; r.cands = null; r.msg = "";
      if (!r.f.detail && sp.d) r._d = sp.d; }
    else { r.st = "pick"; r.cands = L.slice(0, 6); r.msg = ""; }
  } catch (e) { r.st = "fail"; r.msg = "연결이 안 돼요. 잠시 뒤 다시 찾기를 눌러 주세요."; }
}
async function lookupAll() {
  const L = S.rows.filter(r => r.st === "" && r.f.addr); if (!L.length) return;
  Object.assign(S.look, { run: true, done: 0, total: L.length, stop: false });
  if (S.step === 3) drawPanel();
  let i = 0;
  const upd = () => { const b = $("#lkBar"), t = $("#lkT"); if (b) b.style.width = S.look.done / S.look.total * 100 + "%"; if (t) t.textContent = `우편번호 찾는 중 ${S.look.done} / ${S.look.total}`; };
  const worker = async () => { while (i < L.length && !S.look.stop) { const r = L[i++]; await lookupOne(r); S.look.done++; upd(); } };
  await Promise.all([worker(), worker(), worker()]);
  S.look.run = false;
  const c = counts();
  toast(S.look.stop ? "멈췄어요. 남은 줄은 다시 찾기로 이어서 찾을 수 있어요." : `우편번호 찾기 끝 — 찾음 ${c.ok} · 골라 주세요 ${c.pick} · 못 찾음 ${c.fail}`);
  S.filter = c.fail + c.pick + c.wait ? "need" : "all"; S.shown = 40;
  if (S.step === 3) drawPanel(); preview();
}

  </div>${foot("인쇄하기")}`;
  const re = () => { saveDesign(); drawPanel(); preview(); };
  $$("[data-lay]").forEach(b => b.onclick = () => { d.lay = b.dataset.lay; re(); });
  $$("[data-am]").forEach(b => b.onclick = () => { d.addrMode = b.dataset.am; re(); });
  $$("[data-hon]").forEach(b => b.onclick = () => { d.hon = b.dataset.hon; re(); });
  $$("[data-ga]").forEach(b => b.onclick = () => { d.gAlign = b.dataset.ga; re(); });
  $$("[data-font]").forEach(b => b.onclick = () => { d.font = b.dataset.font; re(); });
  const live = (id, fn) => { const el = $("#" + id); if (el) el.addEventListener(el.type === "checkbox" ? "change" : "input", () => { fn(el); saveDesign(); schedPreview(); }); };
  live("honC", el => d.honC = el.value);
  live("snd", el => { d.sender = el.checked; $("#sndT").style.display = el.checked ? "" : "none"; });
  live("sndT", el => d.senderT = el.value);
  live("tel", el => d.tel = el.checked); live("memo", el => d.memo = el.checked); live("zipPre", el => d.zipPre = el.checked);
  live("gBold", el => d.gBold = el.checked); live("gTop", el => d.gTop = el.checked);
  live("fs", el => { if (isA) d.size = +el.value; else d.gSize = +el.value; $("#fsO").textContent = el.value + "pt"; $("#fsS").textContent = el.value + "pt · " + (d.font === "sans" ? "고딕" : "명조"); });
  live("pad", el => { d.pad = +el.value; $("#padO").textContent = el.value + "mm"; });
}

/* 6. 인쇄 */
function pPrint(P) {
  const s = S.sheet, pp = perPage(), isA = S.kind === "addr";
  const c = isA ? counts() : null, unsure = isA ? S.rows.filter(r => r.use && RANK[r.st] !== 3).length : 0;
  const items = labelItems(), pages = Math.ceil((items.length + S.start - 1) / pp) || 1;
  P.innerHTML = `<div class="ph"><span class="k">6단계</span><h2>인쇄하기</h2><p>처음 쓰는 라벨지라면 <b>시험 인쇄</b>로 칸 위치부터 맞춰 보세요.</p></div>
  <div class="pb">
    <div class="sumrow"><div><small>라벨</small><span class="big-n" id="sumN">${items.length}</span> 장</div><div><small>라벨지</small><span class="big-n" id="sumP">${pages}</span> 장</div><div style="flex:1;min-width:120px"><small>라벨지 종류</small><b>${esc(s.code)}</b> · ${pp}칸</div></div>
    ${isA && unsure ? `<div class="note w"><b>우편번호를 확인하지 못한 ${unsure}줄</b>이 있어요.
      <div class="seg" style="margin-top:8px"><button data-fm="skip" class="${S.failMode === "skip" ? "on" : ""}">빼고 인쇄</button><button data-fm="keep" class="${S.failMode === "keep" ? "on" : ""}">우편번호 없이 넣기</button></div>
      <button class="link" style="margin-top:8px" data-go4>4단계에서 고치기</button></div>` : ""}
    <label class="f">시작할 칸 <span class="m">— 이미 쓴 라벨지라면 남은 첫 칸을 누르세요</span></label>
    <div class="startg" style="grid-template-columns:repeat(${s.cols},1fr)">${Array.from({ length: pp }, (_, i) => `<button data-st="${i + 1}" class="${i + 1 < S.start ? "used" : i + 1 === S.start ? "st" : ""}" style="aspect-ratio:${s.w}/${s.h}">${i + 1}</button>`).join("")}</div>
    <details class="og" style="margin-top:14px"><summary>인쇄 위치 보정<small>가로 ${S.off.x}mm · 세로 ${S.off.y}mm</small></summary><div class="og-b">
      <p class="fine" style="margin-top:0">시험 인쇄한 종이를 라벨지에 겹쳐 비춰 보고, 칸이 밀린 만큼 넣으세요. 이 브라우저에 기억돼요.</p>
      <div class="g2"><div class="mm"><small>가로 (+ 오른쪽으로)</small><input class="inp" type="number" step="0.5" id="offX" value="${S.off.x}"><em>mm</em></div>
      <div class="mm"><small>세로 (+ 아래로)</small><input class="inp" type="number" step="0.5" id="offY" value="${S.off.y}"><em>mm</em></div></div>
    </div></details>
    <div class="pbtns">
      <button class="btn go" id="doPrint" style="flex:none">${I.print}라벨 인쇄하기</button>
      <button class="btn nv" id="doTest">${I.grid}시험 인쇄 (일반 종이에 칸 테두리만)</button>
    </div>
    <div class="note"><b>인쇄 창에서 꼭 확인하세요</b><br>· 배율: <b>실제 크기(100%)</b> — "페이지에 맞춤"이면 칸이 밀려요<br>· 여백: <b>없음</b> · 머리글/바닥글: <b>끄기</b><br>· 프린터마다 종이 가장자리 몇 mm는 인쇄되지 않아 바깥 칸 글자가 잘릴 수 있어요. 안쪽 여백을 늘리면 안전해요.</div>
  </div>${foot("")}`;
  $$("[data-fm]").forEach(b => b.onclick = () => { S.failMode = b.dataset.fm; drawPanel(); preview(); });
  if ($("[data-go4]")) $("[data-go4]").onclick = () => { S.filter = "need"; go(3); };
  $$("[data-st]").forEach(b => b.onclick = () => { S.start = +b.dataset.st; drawPanel(); S.page = 0; preview(); });
  const oo = () => { S.off = { x: parseFloat($("#offX").value) || 0, y: parseFloat($("#offY").value) || 0 }; lsSet("off", S.off); };
  $("#offX").addEventListener("input", oo); $("#offY").addEventListener("input", oo);
  $("#doPrint").onclick = () => doPrint(false);
  $("#doTest").onclick = () => doPrint(true);
}

/* ══════════ 라벨 그리기 ══════════ */
function addrLine(r) {
  const det = (r.f.detail || r._d || "").trim();
  if (S.d.addrMode === "road" && r.road) {
    const d2 = det.replace(/\s*\([^)]*\)/g, "").trim();
    return r.road.roadAddrPart1 + (d2 ? ", " + d2 : "") + (r.road.roadAddrPart2 ? " " + r.road.roadAddrPart2 : "");
  }
  return [r.f.addr, r.f.detail].filter(Boolean).join(" ");
}
function labelItems() {
  if (S.kind === "addr") return S.rows.filter(r => r.use && (r.f.addr || r.f.name) && (RANK[r.st] === 3 || S.failMode === "keep"));
  const out = [], n = Math.max(1, S.d.gRep | 0);
  S.rows.filter(r => r.f.l1 || r.f.l2 || r.f.l3).forEach(r => { for (let i = 0; i < n; i++) out.push(r); });
  return out;
}
const SAMPLE_A = newRow({ name: "홍길동", addr: "서울특별시 중구 세종대로 110", detail: "3층", zip: "04524", tel: "010-0000-0000", memo: "설 선물" });
const SAMPLE_G = newRow({ l1: "김하늘", l2: "1학년 2반" });
function labelInner(r) {
  const d = S.d;
  if (S.kind === "gen") {
    const L = ["l1", "l2", "l3"].filter(k => r.f[k]);
    return `<div class="lbi gen ${d.gTop ? "top" : ""}" style="text-align:${d.gAlign}">${L.map((k, i) => `<div class="ln${i + 1} ${i === 0 && d.gBold ? "b" : ""}">${esc(r.f[k])}</div>`).join("")}</div>`;
  }
  const hon = d.hon === "직접" ? d.honC : d.hon;
  const zip = r.f.zip ? `<div class="zp ${d.lay === "zipTop" ? "" : "r"}">${d.zipPre ? "<small>우편번호</small>" : ""}${esc(r.f.zip)}</div>` : "";
  const nm = r.f.name ? `<div class="nm ${d.lay === "nameTop" ? "" : "r"}">${esc(r.f.name)}${hon ? `<small>${esc(hon)}</small>` : ""}</div>` : "";
  const a = `<div class="a1">${esc(addrLine(r))}</div>`;
  const ex = (d.tel && r.f.tel ? `<div class="tel">${esc(r.f.tel)}</div>` : "") + (d.memo && r.f.memo ? `<div class="mm2">${esc(r.f.memo)}</div>` : "");
  const snd = d.sender && d.senderT ? `<div class="snd">${esc(d.senderT)}</div>` : "";
  const sp = `<div class="spc"></div>`;
  const body = d.lay === "post" ? snd + a + ex + sp + nm + zip : d.lay === "zipTop" ? snd + zip + a + ex + sp + nm : snd + nm + a + ex + sp + zip;
  return `<div class="lbi">${body}</div>`;
}
function buildPage(items, pageIdx, test) {
  const s = S.sheet, pp = perPage(), d = S.d;
  const ff = d.font === "serif" ? '"Batang","바탕","AppleMyungjo","Noto Serif KR",serif' : '"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  const pg = document.createElement("div"); pg.className = "pg"; pg.style.fontFamily = ff;
  const first = pageIdx * pp - (S.start - 1);
  let h = "";
  for (let i = 0; i < pp; i++) {
    const r = Math.floor(i / s.cols), c = i % s.cols;
    const x = s.left + c * (s.w + s.gx) + S.off.x, y = s.top + r * (s.h + s.gy) + S.off.y;
    const st = `left:${x}mm;top:${y}mm;width:${s.w}mm;height:${s.h}mm`;
    if (test) { h += `<div class="lbl" style="${st}"><div class="tst">${i + 1}</div></div>`; continue; }
    const k = first + i, it = k >= 0 ? items[k] : null;
    if (k < 0) { h += `<div class="lbl used" style="${st}"></div>`; continue; }
    if (!it) { h += `<div class="lbl" style="${st}"></div>`; continue; }
    const miss = S.kind === "addr" && !(it.f.zip);
    h += `<div class="lbl ${miss ? "miss" : ""}" style="${st}" data-fit="1"><div style="position:absolute;inset:${d.pad}mm">${labelInner(it)}</div></div>`;
  }
  pg.innerHTML = h;
  return pg;
}
/* 넘치지 않게 글자 크기 맞추기: 정해 둔 크기부터 줄여 가며(이분 탐색) 칸에 들어가는 가장 큰 크기 */
function fitLabels(root) {
  const max = S.kind === "addr" ? S.d.size : S.d.gSize, min = 6;
  let over = 0;
  root.querySelectorAll('[data-fit] .lbi').forEach(el => {
    const fits = pt => { el.style.fontSize = pt + "pt"; return el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1; };
    if (fits(max)) return;
    let lo = min, hi = max;
    if (!fits(lo)) { over++; el.closest(".lbl").classList.add("over"); return; }
    for (let k = 0; k < 6; k++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
    fits(Math.floor(lo * 4) / 4);
  });
  return over;
}
let _pt = 0;
function schedPreview() { clearTimeout(_pt); _pt = setTimeout(preview, 120); }
function preview(resizeOnly) {
  const W = $("#paperw"); if (!W) return;
  const st = $("#stage"), s = S.sheet;
  if (resizeOnly && W.firstChild) { scalePaper(); return; }
  W.innerHTML = "";
  if (!s) { $("#matT").textContent = "미리보기"; $("#matS").textContent = ""; $("#pgT").textContent = "–"; $("#pgPrev").disabled = $("#pgNext").disabled = true; $("#matF").innerHTML = "";
    const e = document.createElement("div"); e.className = "pg"; e.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8a8f84;font:600 15pt/1.6 sans-serif">A4 라벨지<br><span style="font-size:11pt;font-weight:400">${S.kind ? "라벨지를 고르면 칸이 그려져요" : "라벨 종류부터 골라 주세요"}</span></div>`;
    W.appendChild(e); scalePaper(); return; }
  let items = previewItems();
  const sample = !items.length;
  if (sample) items = Array.from({ length: perPage() }, () => S.kind === "gen" ? SAMPLE_G : SAMPLE_A);
  const pp = perPage(), pages = Math.max(1, Math.ceil((items.length + (sample ? 0 : S.start - 1)) / pp));
  if (S.page >= pages) S.page = pages - 1;
  const keepStart = S.start; if (sample) S.start = 1;
  const pg = buildPage(items, S.page, false);
  S.start = keepStart;
  W.appendChild(pg);
  const over = fitLabels(pg);
  $("#matT").textContent = sample ? "예시로 보기" : "미리보기";
  $("#matS").textContent = `${s.code} · ${pp}칸`;
  $("#pgT").textContent = `${S.page + 1} / ${pages}쪽`;
  $("#pgPrev").disabled = S.page <= 0; $("#pgNext").disabled = S.page >= pages - 1;
  const missN = S.kind === "addr" && !sample ? items.filter(r => !r.f.zip).length : 0;
  $("#matF").innerHTML = `<span><i style="background:#fff;outline:1px dashed #c9cfdc"></i>라벨 칸</span>` + (S.start > 1 && !sample ? `<span><i style="background:#e2dfd4"></i>이미 쓴 칸</span>` : "") +
    (over ? `<span style="color:#ffb4a8"><i style="background:#b84a3c"></i>이 쪽에서 글자가 넘치는 칸 ${over}개</span>` : "") + (missN ? `<span style="color:#ffd79a"><i style="background:#d98a1a"></i>우편번호 없는 칸</span>` : "");
  const on = $("#ovNote"); if (on) on.innerHTML = over ? `<div class="note b"><b>이 쪽에서 ${over}칸은 가장 작은 글자(6pt)로도 넘쳐요.</b> 안쪽 여백을 줄이거나, 보내는 분·메모를 빼거나, 더 큰 라벨지를 고르세요.</div>` : "";
  scalePaper();
}
function previewItems() {
  if (S.step < 2) return [];
  if (S.step === 2) { if (S.how === "type" || !S.raw || !S.raw.rows.length) return [];
    const req = FIELDS[S.kind].filter(x => x[2]).every(x => S.map[x[0]] != null); if (!req) return [];
    const R = rowsFromRaw(); return S.kind === "gen" ? R : R; }
  if (S.step === 5 || S.kind === "gen") return labelItems();
  return S.rows.filter(r => r.use && (r.f.addr || r.f.name));
}
function scalePaper() {
  const W = $("#paperw"), pg = W && W.firstChild, st = $("#stage"); if (!pg) return;
  const pw = pg.offsetWidth, ph = pg.offsetHeight, aw = st.clientWidth - 8;
  const vh = window.innerWidth > 1060 ? window.innerHeight - 92 - 110 : 9999;
  const k = Math.min(1, aw / pw, vh / ph);
  pg.style.transform = `scale(${k})`; W.style.width = pw * k + "px"; W.style.height = ph * k + "px";
}

/* 인쇄 */
async function doPrint(test) {
  const items = test ? [] : labelItems();
  if (!test && !items.length) { toast("인쇄할 라벨이 없어요."); return; }
  const pp = perPage(), pages = test ? 1 : Math.ceil((items.length + S.start - 1) / pp);
  const busy = document.body.appendChild(Object.assign(document.createElement("div"), { className: "busy", innerHTML: `<div>인쇄 준비 중… (${pages}쪽)</div>` }));
  await new Promise(r => setTimeout(r, 30));
  const A = $("#printArea"); A.innerHTML = "";
  for (let p = 0; p < pages; p++) A.appendChild(buildPage(items, p, test));
  const over = test ? 0 : fitLabels(A);
  busy.remove();
  if (over && !confirm(`글자가 칸을 넘치는 라벨이 ${over}개 있어요. 그대로 인쇄할까요?\n(취소하면 꾸미기에서 여백·글자 크기를 바꿀 수 있어요)`)) { A.innerHTML = ""; return; }
  const prevT = document.title; document.title = test ? "라벨 시험 인쇄" : "라벨 인쇄";
  window.print();
  setTimeout(() => { document.title = prevT; }, 500);
}

/* ══════════ 시작 ══════════ */
function start() {
  shell();
  S.step = S.kind ? 1 : 0;
  drawRuler(); drawPanel(); preview();
}
(async () => { if (!(await BJ_GATE.check("label", TAB || "all"))) return; start(); })();
</script>
