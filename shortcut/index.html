 --up:0 0 0 1px rgba(20,32,43,.07),0 1px 2px rgba(20,32,43,.05),0 10px 26px -14px rgba(20,32,43,.22)}

.tin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}

.tbtns{margin-left:auto;display:flex;gap:6px}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13.5px;box-shadow:inset 0 0 0 1px var(--hair2);background:#fff;white-space:nowrap}

.btn svg{width:16px;height:16px}

.grp{padding:14px 18px 4px;font-size:13px;font-weight:800;color:var(--deep);display:flex;align-items:center;gap:8px;position:sticky;top:var(--stk,132px);background:var(--cloud);z-index:2;box-shadow:0 1px 0 var(--hair)}

mark{background:#FFE7A8;color:inherit;border-radius:3px;padding:0 1px}
.ra{display:flex;gap:2px}

.ib svg{width:18px;height:18px}
.ib.fav{color:var(--suntx)}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:15px;line-height:1.7}

.more{padding:12px 18px 16px;text-align:center;border-top:1px solid var(--hair)}
.src{padding:12px 18px 16px;font-size:12.5px;color:var(--sub);line-height:1.7;border-top:1px solid var(--hair)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

.sc p{margin:6px 0 0;font-size:14px;line-height:1.65;color:var(--ink)}
.small{font-size:12.5px!important;color:var(--sub)!important}
.links{display:flex;flex-direction:column;gap:6px}
.links a{font-weight:700;font-size:14.5px}
.qrw{display:flex;gap:14px;align-items:center}
.qr{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px;flex-shrink:0}
.qr svg{width:100%;height:100%}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.apps a{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px;font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;box-shadow:inset 0 0 0 1px var(--hair)}

.iapp{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.iapp img{border-radius:12px}
.iapp b{display:block;font-size:16px}
.iapp span{font-size:13px;color:var(--sub)}
.foot{max-width:1280px;margin:0 auto;padding:6px 16px 30px;font-size:12.5px;color:var(--sub)}
@media (max-width:900px){
 .mhead .acts .btn{height:30px;padding:0 9px}
 .wrap{grid-template-columns:1fr;padding:10px}
 .side{display:none}
 .mobcats{display:block;padding:10px 12px 8px;border-bottom:1px solid var(--hair)}
 .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}

 .chip.on{background:var(--sea);color:#fff;box-shadow:none}
 .chips.c2 .chip{font-size:13px;padding:6px 11px}
 .chips.c2 .chip.on{background:var(--sealt);color:var(--sea2);box-shadow:inset 0 0 0 1.5px var(--sea)}
 .row{grid-template-columns:minmax(0,1fr) auto;padding:10px 12px}
 .row .keys{grid-column:1/2}
 .row .desc{grid-column:1/2}
 .row .ra{grid-column:2/3;grid-row:1/3;align-self:center}
 .grp{padding:10px 12px 6px}
 .mhead{padding:12px 12px 10px}
 .mhead h2{font-size:18px}
 .tname small{display:none}
 .tb span{display:none}
 .tb{padding:0 10px}
 .sin kbd{display:none}
 .sin input{height:48px;font-size:16px}
}
@media print{
 .top,.sbar,.side,.ra,.acts,.mobcats,.more,.foot,#sheet,.toast{display:none!important}
 body{background:#fff}
 .wrap{display:block;padding:0}
 .card{box-shadow:none}
 .grp{position:static}
 .row{break-inside:avoid;padding:5px 4px;grid-template-columns:180px 1fr}
 .desc{font-size:12px}.kc{font-size:11px;box-shadow:inset 0 0 0 1px #999}
 @page{size:A4;margin:12mm}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

}
.wplist{display:flex;flex-direction:column;gap:6px}

.wpn b{font-size:14.5px;font-weight:800}

.whow{width:100%;max-width:960px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--hair);padding:14px 18px;box-sizing:border-box}

.whow li b{display:flex;align-items:center;gap:7px;font-weight:900;font-size:14.5px}

.whow li span{color:#3c4856}

.wcta{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--deep);color:#fff;text-align:left;font:inherit;border:0;cursor:pointer;margin-top:12px;box-shadow:0 4px 14px rgba(11,61,74,.18)}
.wcta:hover{background:#0d4a59}
.wcta i{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex-shrink:0}
.wcta svg{width:20px;height:20px}
.wcta b{display:block;font-size:15px;font-weight:900}
.wcta small{display:block;font-size:12.5px;color:var(--deepsub);margin-top:2px}

  const sw = Math.max(1, A.x1 - A.x0 - drag.w), sh = Math.max(1, A.y1 - A.y0 - drag.h);
  const left = Math.max(A.x0, Math.min(A.x1 - drag.w, p.x - drag.dx - drag.w / 2)), top = Math.max(A.y0, Math.min(A.y1 - drag.h, p.y - drag.dy - drag.h / 2));
  cd.fx = (left - A.x0 + drag.w / 2) / (A.x1 - A.x0); cd.fy = (top - A.y0 + drag.h / 2) / (A.y1 - A.y0);
  drag.moved = true; fastDraw();
}
function onUp() { const d = drag; drag = null; if (d) { $w("#wcv").style.cursor = "grab"; fastDraw(); if (d.moved) wsave(); } }

/* ── 열고 닫기 ── */
let built = false;
function build() {
  const d = document.createElement("div"); d.id = "wallv"; d.hidden = true; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "단축키 배경화면 만들기");
  d.innerHTML = `<div class="wtop"><button type="button" class="wback" data-w="close" aria-label="단축키 사전으로">${svg("back")}<span>단축키 사전</span></button><div class="wtt">단축키 배경화면 만들기<small>그림 · 해상도 고르고 단축키를 붙여 저장</small></div><button type="button" class="wclose" data-w="close" aria-label="닫기">${svg("x")}</button></div>
  <div class="wbody"><aside class="wside"></aside><section class="wmain"><div class="wpv"><canvas id="wcv"></canvas></div><div class="wmeta num"></div><div class="wwarn2" hidden></div><div class="whow"></div><button type="button" class="wbtn pri wsave" data-w="save">${svg("dl")}배경화면 저장</button></section></div>
  <div class="wbusy" hidden><div>배경화면을 만드는 중…</div></div><div class="wtoast" role="status"></div>`;
  document.body.appendChild(d);
  d.addEventListener("click", onClick); d.addEventListener("change", onChange); d.addEventListener("input", onInput);
  d.addEventListener("keydown", e => { if (e.key === "Escape") closeW(); });
  const cv = d.querySelector("#wcv"); cv.addEventListener("pointerdown", onDown); cv.addEventListener("pointermove", onMove); cv.addEventListener("pointerup", onUp); cv.addEventListener("pointercancel", onUp);
  addEventListener("resize", () => { if (!d.hidden) preview(); });
  built = true;
}
function openW() { if (!built) build(); const d = document.getElementById("wallv"); d.hidden = false; document.documentElement.classList.add("wopen"); if (W.step < 0) W.step = 2; side(); preview(); setTimeout(() => { const b = d.querySelector(".wback"); if (b) b.focus(); }, 30); try { history.replaceState(history.state, "", location.pathname + location.search.replace(/[?&]wall=1/, "") + (location.search ? "&" : "?") + "wall=1"); } catch (e) {} }
function closeW() { const d = document.getElementById("wallv"); if (!d) return; d.hidden = true; document.documentElement.classList.remove("wopen"); try { history.replaceState(history.state, "", location.href.replace(/[?&]wall=1/, "").replace(/\?$/, "")); } catch (e) {} }
window.SKWALL = { open: openW, close: closeW, preset(p) { W.mode = "pick"; if (!W.cards.some(c => c.p === p)) W.cards = [{ p, off: [], size: 100, fx: .94, fy: .5 }]; W.sel = W.cards.findIndex(c => c.p === p); W.step = 2; openW(); } };
if (window.BJBACK) BJBACK.init({ ov: ["#wallv"] });
document.addEventListener("click", e => { const b = e.target.closest("[data-wallopen]"); if (!b) return; e.preventDefault(); const p = b.dataset.wallopen; if (p && PROG[p]) SKWALL.preset(p); else openW(); });
if (/[?&]wall=1/.test(location.search)) setTimeout(openW, 50);
})();

</script>
