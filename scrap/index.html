:root{
--paper:#f0e8db;--panel:#f1ebe1;--tint:#e7e0d2;--hover:#f7f2e9;--card:#f4efe6;--press-bg:#e6dfd1;
--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;--navy:#195455;--amber:#f56d03;--red:#c23a2b;--cat:#1f7f8f;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--sh-paper:12px 14px 28px rgba(120,100,70,.38),-5px -5px 12px rgba(255,255,255,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"BJ",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:20px;height:20px;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}


/* 앱 공통 */
.hd{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;flex-shrink:0}
.hd h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--up-s);display:grid;place-items:center;flex-shrink:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 110px}
.body::-webkit-scrollbar{width:0}
.srch{display:flex;align-items:center;gap:8px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:11px 14px;color:var(--ink3);font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy);color:var(--ink)}
.chips.tg .chip{font-weight:500;background:none;box-shadow:inset 0 0 0 1.5px #cfc5b2;padding:6px 11px;font-size:13.5px}
.chips.tg .chip.on{box-shadow:inset 0 0 0 2px var(--navy);color:var(--ink);font-weight:600}
.lbl{font-size:13px;font-weight:700;color:var(--ink3);margin:16px 2px 8px;letter-spacing:.02em;display:flex;justify-content:space-between}
.off{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:12px;box-shadow:4px 6px 14px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85);border:0;width:100%;text-align:left}
.off img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0}
.off b{display:block;font-size:15.5px}.off small{display:block;font-size:12.5px;color:#c9cbd6;margin-top:3px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{border:0;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:9px 9px 11px;text-align:left;min-width:0;position:relative}
.rc .ph{width:100%;aspect-ratio:4/3;border-radius:11px;object-fit:cover;display:block;background:var(--tint)}
.rc .ph.no{display:grid;place-items:center;color:var(--ink3);box-shadow:var(--in)}
.rc .ph.no svg{width:30px;height:30px;opacity:.55}
.rc b{display:block;font-size:15px;margin:9px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{display:block;font-size:12.5px;color:var(--ink3);margin:3px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .fv{position:absolute;right:15px;top:15px;width:26px;height:26px;border-radius:50%;background:rgba(31,33,37,.55);display:grid;place-items:center;color:#fff}
.rc .fv svg{width:14px;height:14px}
.fab{position:absolute;right:18px;bottom:88px;width:58px;height:58px;border-radius:18px;border:0;background:var(--amber);color:#fff;display:grid;place-items:center;box-shadow:4px 6px 14px rgba(170,110,55,.5),-3px -3px 8px rgba(255,255,255,.8);z-index:3}
.fab svg{width:26px;height:26px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--panel);box-shadow:0 -1px 0 rgba(160,140,108,.25),0 -8px 18px -10px rgba(120,100,70,.35);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 18px;z-index:2}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink3);border-radius:12px;position:relative}
.tabs button.on{color:var(--navy);background:var(--press-bg);box-shadow:var(--press)}
.tabs button .bd{position:absolute;top:2px;right:22%;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;line-height:17px;font-weight:700}
.btmbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);padding:12px 18px 20px;display:flex;gap:10px;box-shadow:0 -1px 0 rgba(160,140,108,.25),0 -8px 18px -10px rgba(120,100,70,.35);z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:0;font-size:15px;font-weight:600;padding:11px 16px;min-height:48px;border-radius:13px;box-shadow:var(--up-s);white-space:nowrap}
.btn.go{background:var(--amber);color:#fff;font-weight:700;flex:1;box-shadow:4px 6px 14px rgba(170,110,55,.45),-3px -3px 8px rgba(255,255,255,.85)}
.btn.nv{background:var(--navy);color:#fff;box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.w{width:100%}

/* 상세 */
.hero{position:relative;margin:0 -18px}
.hero img,.hero .no{width:100%;height:230px;object-fit:cover;display:block}
.hero .no{display:grid;place-items:center;background:var(--tint);color:var(--ink3);font-size:13.5px;text-align:center;line-height:1.6;box-shadow:var(--in)}
.thumbs{display:flex;gap:8px;padding:10px 0 0;overflow-x:auto}
.thumbs div{flex-shrink:0;width:64px;height:64px;border-radius:10px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;display:grid;place-items:center;font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.3}
.thumbs div img{width:100%;height:100%;object-fit:cover}
.thumbs div em{position:absolute;left:4px;bottom:4px;font-style:normal;background:rgba(31,33,37,.7);color:#fff;font-size:10.5px;border-radius:5px;padding:1px 5px}
.thumbs div.main{box-shadow:0 0 0 2px var(--navy)}
.ttl{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:14px 0 4px}
.meta{font-size:13.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:13px;color:var(--ink2);box-shadow:inset 0 0 0 1.5px #cfc5b2;border-radius:8px;padding:2px 8px}
.cat{font-size:13px;font-weight:700;color:#fff;background:var(--cat);border-radius:7px;padding:3px 8px}
.amt{display:flex;align-items:center;gap:10px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:8px;margin-top:14px}
.amt .stp{width:42px;height:42px;border-radius:11px;border:0;background:var(--card);box-shadow:var(--up-s);font-size:22px;font-weight:700}
.amt .v{flex:1;text-align:center}.amt .v b{font-size:21px;font-variant-numeric:tabular-nums}.amt .v small{display:block;font-size:12px;color:var(--ink3)}
.sec{margin-top:20px}
.sec h4{margin:0 0 6px;font-size:15px;font-weight:800;padding-bottom:7px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.sec h4 small{font-size:12.5px;color:var(--ink3);font-weight:600}
.ing{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #ddd4c3;font-size:15px}
.ing b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .gn{font-size:12.5px;color:var(--ink3);font-weight:700;padding-top:14px;border:0}
.stp-l{counter-reset:s;list-style:none;margin:0;padding:0}
.stp-l li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-bottom:1px solid #ddd4c3;font-size:14.5px;line-height:1.55}
.stp-l li:before{content:counter(s);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.log{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid #ddd4c3;font-size:14px}
.log .d{font-variant-numeric:tabular-nums;color:var(--ink3);width:84px;flex-shrink:0}
.src{font-size:12.5px;color:var(--ink3);margin-top:14px;line-height:1.55}

/* 만들기 */
.step{display:flex;gap:6px;margin:2px 0 14px}.step span{flex:1;height:4px;border-radius:2px;background:#d6ccb9}.step span.on{background:var(--navy)}
.mk-h{font-size:14px;color:var(--ink2);line-height:1.6;margin:0 0 10px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.hv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ddd4c3}
.hv .n{flex:1;min-width:0;font-size:15px}.hv .n small{display:block;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.yn{display:flex;background:var(--tint);box-shadow:var(--in);border-radius:11px;padding:3px;flex-shrink:0}
.yn button{border:0;background:none;border-radius:8px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--ink3)}
.yn button.y.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}
.yn button.n.on{background:var(--navy);color:#fff}
.sum{background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;margin-top:14px}
.picked{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* 장보기 */
.sl{border:0;width:100%;text-align:left;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.sl .t{flex:1;min-width:0}.sl b{display:block;font-size:16px}.sl small{display:block;font-size:13px;color:var(--ink3);margin-top:3px}
.prog{height:6px;border-radius:3px;background:#d6ccb9;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--navy)}
.ck{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #ddd4c3;font-size:15.5px;cursor:pointer}
.ck .bx{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px #8b8474;flex-shrink:0;display:grid;place-items:center}
.ck.dn .bx{background:var(--navy);box-shadow:none;color:#fff}
.ck.dn .bx svg{width:16px;height:16px}
.ck .n{flex:1;min-width:0}.ck .n small{display:block;font-size:12.5px;color:var(--ink3)}
.ck b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ck.dn .n,.ck.dn b{text-decoration:line-through;color:#a59d8d}
.fold{margin-top:16px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2);line-height:1.7}
.fold b{color:var(--ink)}

/* 찾기 */
.frg{background:var(--panel);border-radius:16px;box-shadow:var(--up-s);padding:14px}
.frg .in{display:flex;gap:8px;flex-wrap:wrap;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:9px}
.fc{display:inline-flex;align-items:center;gap:5px;background:var(--card);box-shadow:var(--up-s);border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600}
.fc svg{width:13px;height:13px;color:var(--ink3)}
.fr{display:flex;gap:12px;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:10px;margin-top:12px;align-items:center}
.fr .ph{width:70px;height:70px;border-radius:11px;object-fit:cover;flex-shrink:0;background:var(--tint);display:grid;place-items:center;color:var(--ink3)}
.fr .t{flex:1;min-width:0}.fr b{display:block;font-size:15.5px}
.fr .m{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
.fr .sc2{font-size:13px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.bar5{display:flex;gap:3px;margin-top:6px}.bar5 i{width:16px;height:5px;border-radius:2px;background:#d6ccb9}.bar5 i.on{background:var(--navy)}

/* 넣기 */
.sheet{position:absolute;inset:0;background:rgba(31,33,37,.38);z-index:5;display:flex;align-items:flex-end}
.sheet .in{background:var(--panel);border-radius:24px 24px 0 0;padding:16px 18px 26px;width:100%}
.sheet .gr{width:44px;height:5px;border-radius:3px;background:#cfc5b2;margin:0 auto 14px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:14px;margin-top:10px}
.opt .ic{width:46px;height:46px;border-radius:13px;background:var(--tint);box-shadow:var(--in);display:grid;place-items:center;flex-shrink:0;color:var(--navy)}
.opt b{display:block;font-size:16px}.opt small{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.f{font-size:13px;font-weight:700;color:var(--ink3);margin:16px 2px 7px;display:block}
.inp{width:100%;background:var(--tint);box-shadow:var(--in);border:0;border-radius:12px;padding:12px 13px;font-size:15px;color:var(--ink)}
.inp.ph-t{color:#9b9383}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{border-radius:13px;background:var(--tint);box-shadow:var(--in);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--ink2);text-align:center;line-height:1.35;position:relative;overflow:hidden}
.slot b{font-size:13.5px;color:var(--ink)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot em{position:absolute;left:6px;top:6px;font-style:normal;background:var(--navy);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px;z-index:1}
.er{display:grid;grid-template-columns:minmax(0,1fr) 66px 58px;gap:6px;margin-bottom:6px}
.er .inp{padding:10px 11px;font-size:14.5px}
.sr{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.sr .no{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:9px}
.sr .inp{flex:1;font-size:14.5px;line-height:1.45;padding:10px 11px}
.sr .mv{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.sr .mv button{width:28px;height:21px;border:0;border-radius:6px;background:var(--card);box-shadow:var(--up-s);font-size:11px;color:var(--ink2);padding:0}
.hint{font-size:12.5px;color:var(--ink3);margin:6px 2px 0;line-height:1.5}

/* 설정 */
.row{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.warn{background:#f6e3c8;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#5e4520;margin-bottom:12px}
.foot{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:18px;line-height:1.7}
.foot a{color:var(--navy);font-weight:700}

.thumbs div{padding-bottom:14px}
.lvs{display:flex;background:var(--tint);box-shadow:var(--in);border-radius:10px;padding:3px;gap:2px}
.lvs button{border:0;background:none;border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:4px}
.lvs button svg{width:15px;height:15px}
.lvs button.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}
.rows .li{margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{border:0;padding:0;background:var(--tint);border-radius:10px;aspect-ratio:1;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--ink3)}
.grid3 img{width:100%;height:100%;object-fit:cover}
.grid3 span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(31,33,37,.75));color:#fff;font-size:12px;font-weight:600;padding:14px 6px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3 .nm{position:static;background:none;color:var(--ink2);padding:0 6px;text-align:center;white-space:normal;font-size:12.5px}
.pv{position:absolute;inset:0;background:#111;z-index:8;display:flex;flex-direction:column;color:#fff}
.pv .pt{display:flex;align-items:center;gap:10px;padding:12px 14px}
.pv .pt b{flex:1;font-size:15px}.pv .pt small{color:#bbb;font-size:12.5px;font-weight:500;display:block}
.pv .pb{flex:1;min-height:0;overflow:auto;display:grid;place-items:center}
.pv .pb img{max-width:100%;transition:transform .2s;transform-origin:center}
.pv .pb .ppr{width:80%;aspect-ratio:3/4;background:#f3eee3;color:#5b5547;border-radius:4px;display:grid;place-items:center;font-size:14px;text-align:center;line-height:1.6;transition:transform .2s}
.pv .pf2{display:flex;align-items:center;gap:10px;padding:12px 14px 22px;justify-content:center}
.pv .cb{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center}
.pv .hint2{text-align:center;font-size:12.5px;color:#bbb;padding:0 14px}
.bn2{display:flex;gap:10px;align-items:flex-start;background:#f6e3c8;border-radius:14px;padding:11px 12px;font-size:13.5px;line-height:1.55;color:#5e4520;margin-bottom:10px}
.bn2 .t{flex:1}.bn2 b{color:#3e2c10}
.bn2 button{border:0;background:none;color:#5e4520;font-weight:700;padding:0 2px;font-size:13.5px}
.gsteps{counter-reset:g;list-style:none;padding:0;margin:12px 0 0}
.gsteps li{counter-increment:g;display:flex;gap:12px;align-items:center;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:12px;margin-bottom:9px;font-size:14.5px;line-height:1.5}
.gsteps li:before{content:counter(g);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.gsteps .k{display:inline-flex;align-items:center;gap:4px;box-shadow:inset 0 0 0 1.5px #cfc5b2;border-radius:7px;padding:1px 7px;font-weight:700}
.gsteps .k svg{width:15px;height:15px}
.devs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.devs button{border:0;background:var(--card);box-shadow:var(--up-s);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.devs button.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy);color:var(--ink)}

/* PC 보기 */
.pcwrap{background:var(--paper);border-radius:20px;box-shadow:var(--up);overflow:hidden}
.pcbar{display:flex;align-items:center;gap:22px;padding:16px 26px;box-shadow:0 1px 0 rgba(255,255,255,.7),0 6px 14px -10px rgba(120,100,70,.45)}
.pcbar .lg{width:46px;height:46px;border-radius:14px;background:var(--cat);display:grid;place-items:center;color:#fff;position:relative}
.pcbar .lg i{position:absolute;width:12px;height:12px;right:-3px;bottom:-3px;border-radius:50%;background:var(--amber);border:3px solid var(--paper)}
.pcbar .bn small{display:block;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.05em}.pcbar .bn b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.pcnav{display:flex;gap:6px;background:var(--tint);box-shadow:var(--in);padding:5px;border-radius:14px;margin-left:16px}
.pcnav button{border:0;background:none;padding:9px 16px;border-radius:10px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center}
.pcnav button.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}
.pcbar .sp{flex:1}
.pcl{display:grid;grid-template-columns:400px minmax(0,1fr);gap:26px;padding:24px 26px 30px;align-items:start}
.pcp{background:var(--panel);border-radius:20px;box-shadow:var(--up);padding:18px}
.li{display:flex;gap:12px;align-items:center;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:9px;width:100%;text-align:left;margin-top:10px}
.li.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy)}
.li img,.li .no{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--tint);display:grid;place-items:center;color:var(--ink3)}
.li b{display:block;font-size:15px}.li small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.mat{background:var(--tint);box-shadow:var(--in);border-radius:22px;padding:22px}
.paper{background:#fffdf8;border-radius:4px;box-shadow:var(--sh-paper);padding:34px 40px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px}
.paper .ttl{margin-top:0}
.paper .side img{width:100%;border-radius:8px;display:block}
.pcact{display:flex;gap:10px;margin-top:16px}

/* ── 실제 앱 ── */
body{margin:0;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.vt{display:flex;background:var(--tint);box-shadow:var(--in);padding:5px;border-radius:14px;gap:4px}

.ltile .ltl{font-size:30px;font-weight:800;line-height:1;opacity:.95}
.ltile{color:#fff!important}
.ltile .ltico{width:38px;height:38px;border-radius:9px;background:#fff;padding:5px;object-fit:contain;flex-shrink:0}
.ltile .ltico~.ltl{display:none}
.ltile .lth{font-size:11.5px;font-weight:600;opacity:.85;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.ltile .ltx{position:absolute;inset:0;padding:10px 11px;font-size:12px;line-height:1.5;color:var(--ink);background:#fffdf8;text-align:left;overflow:hidden;font-weight:500;white-space:pre-wrap;word-break:break-all}
.ar .ltile,.lprev .ltile{border-radius:9px}
.ar .ltile .ltl,.lprev .ltile .ltl{font-size:19px}.ar .ltile .ltico,.lprev .ltile .ltico{width:26px;height:26px;padding:3px;border-radius:6px}
.ar .ltile .lth,.ar .ltile .ltx,.lprev .ltile .lth{display:none}
.ltile.big{height:150px;border-radius:0}.ltile.big .ltl{font-size:44px}.ltile.big .ltico{width:48px;height:48px}.ltile.big .lth{font-size:14px}
/* 카드 */
.rc.sc{display:flex;flex-direction:column}
.rc.sc .cth{position:relative}
.rc.sc .ph{aspect-ratio:16/10}
.rc.sc b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;min-height:2.7em;font-size:14.5px}
.ytp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:34px;border-radius:10px;background:rgba(31,33,37,.72);color:#fff;display:grid;place-items:center;pointer-events:none}
.ytp svg{width:24px;height:24px}.ytp.big{width:70px;height:52px;border-radius:14px}.ytp.big svg{width:36px;height:36px}
.yts{position:absolute;right:7px;bottom:7px;font-style:normal;background:rgba(31,33,37,.8);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px}
.hero .yts{right:14px;bottom:14px;font-size:13px;padding:3px 9px}
.stb{align-self:flex-start;font-style:normal;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin:6px 3px 0}
.stb.later{background:#fbe7d3;color:#8a4b14}.stb.done{background:var(--tint);color:var(--ink3)}
.opb{position:absolute;right:15px;top:52px;width:30px;height:30px;border-radius:50%;background:rgba(31,33,37,.5);color:#fff;display:grid;place-items:center;cursor:pointer}
.opb svg{width:15px;height:15px}.opb:hover{background:var(--navy)}
.ar .opb{position:static;width:34px;height:34px;background:var(--tint);color:var(--ink2);flex-shrink:0;grid-area:o}
.ar.sr2{grid-template-columns:52px minmax(0,1fr) 34px;grid-template-areas:"p n o" "p m o"}
.allp .ar.sr2[data-asel]{grid-template-columns:24px 52px minmax(0,1fr);grid-template-areas:"c p n" "c p m"}
.ar.sr2>.ltile{grid-area:p;width:52px;height:52px}
body.pc .allp .ah{grid-template-columns:52px minmax(0,1fr) 70px 140px 92px 118px 34px}
body.pc .allp .ar.sr2{grid-template-columns:52px minmax(0,1fr) 70px 140px 92px 118px 34px;grid-template-areas:none}
body.pc .allp .ar.sr2>.ltile{grid-area:auto;width:52px;height:44px}
body.pc .allp .ar.sr2 .opb{grid-area:auto}
body.pc .allp .atb.sel .ah,body.pc .allp .ar.sr2[data-asel]{grid-template-columns:24px 52px minmax(0,1fr) 70px 150px 92px 78px}
body.pc .allp .ar.sr2 .am{color:var(--ink2)}
.anm .i.ki{flex-shrink:0;margin:0}
/* 목록 위 */
.vt.sts{margin-top:12px;overflow-x:auto;scrollbar-width:none}.vt.sts::-webkit-scrollbar{display:none}
.vt.sts button{flex:1 0 auto;padding:8px 12px;font-size:14px;white-space:nowrap}
.vt.sts small{font-size:12px;color:var(--ink3);margin-left:2px}
.chips.sub .chip{background:none;box-shadow:inset 0 0 0 1.5px #cfc5b2;font-weight:600;padding:6px 11px;font-size:13.5px}
.chips.sub .chip.on{box-shadow:inset 0 0 0 2px var(--navy);color:var(--ink)}
.chips.kinds .chip{padding:7px 11px;font-size:13.5px}
.chip.sug{box-shadow:var(--up-s),0 0 0 2px var(--amber)}.chip.sug small{color:#a45f1c;font-weight:700}
.sbl{align-self:center;font-size:13px;font-weight:700;color:var(--ink3);flex-shrink:0;padding-right:2px}
/* 보기 */
.hero.yt{display:block;cursor:pointer}
.hero.site{cursor:default}
.meta .kd{font-size:13px;color:var(--ink2);display:inline-flex;align-items:center}
.stsel{margin-top:12px}.stsel button,.strow .vt button{display:inline-flex;align-items:center;gap:5px}.stsel svg,.strow svg{width:16px;height:16px}
.ubox{display:flex;gap:10px;align-items:center;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:10px 10px 10px 14px;margin-top:14px}
.ubox .t{flex:1;min-width:0}.ubox small{display:block;font-size:12px;color:var(--ink3);font-weight:700}
.ubox a{display:block;color:var(--navy);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec h4 .lk{margin-left:auto}
.memo.txt{background:#fffdf8;border-radius:12px;padding:12px 14px;box-shadow:var(--in);max-height:420px;overflow:auto}
.dinfo{font-size:12.5px;color:var(--ink3);margin-top:16px}
a.btn{text-decoration:none;color:inherit}a.btn.go{color:#fff}
/* 담기 */
.vt.emode{margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.vt.emode::-webkit-scrollbar{display:none}
.vt.emode button{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:9px 10px}
.vt.emode svg{width:17px;height:17px}
.urlrow{display:flex;gap:8px}.urlrow .inp{flex:1;min-width:0}.urlrow .btn{flex-shrink:0;min-height:44px}
.lprev{display:flex;gap:12px;align-items:center;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:10px;margin-top:10px}
.lprev>img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex-shrink:0}
.lprev>.ltile{width:56px;height:56px;flex-shrink:0}
.lprev .t{flex:1;min-width:0}.lprev .t b{display:block;font-size:14.5px}.lprev .t small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.ytst{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13.5px;color:var(--ink2)}.ytst .inp{width:110px;padding:8px 10px}
.strow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.esec .esh{margin-bottom:8px}
.pi .pdx{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(31,33,37,.6);color:#fff;display:grid;place-items:center}
.pi .pdx svg{width:14px;height:14px}
/* 분류 관리 */
.msub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0 4px 14px}
.sbc{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink2);box-shadow:inset 0 0 0 1.5px #cfc5b2;border-radius:8px;padding:2px 4px 2px 9px}
.sbc button{border:0;background:none;padding:2px;color:var(--ink3);display:grid;place-items:center}.sbc svg{width:13px;height:13px}
.opt.sub{padding:10px 14px 10px 30px;margin-top:6px}.opt.sub span{font-size:14px;color:var(--ink2)}
.impbox{margin-top:14px;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:14px}
.impbox .vt{margin:10px 0 4px}.impbox .vt button{flex:1}
label.btn{cursor:pointer}
.ytst span{white-space:nowrap;flex-shrink:0}.ytst .inp{width:96px;flex-shrink:0}
.esec .esh small{flex-basis:auto;order:0;padding-left:0;margin:0;font-size:12.5px;color:var(--ink3);font-weight:600}
.mfold{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:space-between}
.mfold .lk{text-decoration:none;font-size:13.5px;color:var(--ink2)}.mfold .lk b.on{color:var(--navy)}
body:not(.pc) .allp .aopt .chips:not(.tg):not(.kinds){flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.allp .aopt .chips .chip{flex-shrink:0;white-space:nowrap}

/* 설치 화면 */
.ippg{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:max(28px,env(safe-area-inset-top)) 18px 40px}
.ipin{width:100%;max-width:460px}
.iph1{display:flex;gap:14px;align-items:center;background:var(--panel);box-shadow:var(--up);border-radius:20px;padding:16px;margin-bottom:18px}
.iph1 img{width:64px;height:64px;border-radius:15px;flex-shrink:0;box-shadow:var(--up-s)}
.iph1 small{display:block;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.04em}.iph1 b{display:block;font-size:21px;font-weight:800}.iph1 span{font-size:13.5px;color:var(--ink2)}
.ipbig{min-height:58px;font-size:18px}
.ippg .btn.w{width:100%;margin-top:4px}
.ippg .gsteps.big li{font-size:16px}
.ipx{display:block;margin:18px auto 0;border:0;background:none;color:var(--ink3);font-size:14px;font-weight:600;text-decoration:underline}
.ipwarn{background:#f6e3c8;color:#5e4520;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.55}.ipwarn b{display:block;font-size:15.5px}.ipwarn p{margin:4px 0 0}
.ipok{text-align:center;padding:18px 0 14px}.ipok .i{width:44px;height:44px;color:#2f7d4f}.ipok b{display:block;font-size:19px;margin-top:6px}.ipok p{color:var(--ink2);margin:6px 0 0}
.ipwait{text-align:center;color:var(--ink3);padding:22px 0;font-weight:600}
.ipqr{display:flex;gap:14px;align-items:flex-start;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:14px;margin-top:22px}
.ipqr .qr{width:120px;height:120px;flex-shrink:0;background:#fff;border-radius:10px;padding:4px}.ipqr .qr svg{display:block;width:100%;height:100%}
.ipqr b{font-size:15px}.ipqr p{margin:4px 0 0;font-size:13px;line-height:1.55;color:var(--ink2)}
.ippg a.btn{text-decoration:none;color:#fff}
.ipg{display:block;text-align:center;margin:10px auto 0;font-size:13.5px;color:var(--navy);font-weight:700}
.ipno>b{display:block;font-size:18px;margin-bottom:4px}.ipno .gsteps li span{line-height:1.6}
.stbar.ic{display:inline-flex;gap:6px;margin:0;padding:0;flex-wrap:nowrap;overflow:visible;align-items:center}
.stbar.ic .stc{width:40px;height:40px;min-width:40px;padding:0;border-radius:12px;justify-content:center;position:relative;flex-shrink:0}
.stbar.ic .stc .i{width:20px;height:20px}
.stbar.ic .stc:after{content:"";position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card);background:#9b9383}
.stbar.ic .stc.ok:after{background:#2f7d4f}.stbar.ic .stc.warn:after{background:#d8892e}.stbar.ic .stc.bad:after{background:var(--red)}.stbar.ic .stc.busy:after{background:var(--amber)}
.hd .stbar.ic{margin-right:2px}

/* 설치 아이콘(10-28) — 점 없이, 남색 아이콘 */
.stbar.ic .stc.ip{color:var(--navy)}.stbar.ic .stc.ip:after{display:none}
.row.hlp{text-decoration:none;color:var(--ink)}.row.hlp>.i:last-child{width:17px;height:17px;color:var(--ink3);flex-shrink:0;margin-left:auto}

/* 10-31 제이: 저장 위치 — 칸별(PC 폴더 · 구글 드라이브 · 사진 보관)로 나눠 정리 */
.stb{background:var(--in-bg,#e7e0d2);border-radius:12px;padding:11px 12px 12px;margin-top:8px;box-shadow:inset 0 1px 2px rgba(120,100,70,.18)}
.stb-h{display:flex;align-items:center;gap:7px}
.stb-h svg{width:17px;height:17px;color:var(--cat,#1f7f8f);flex-shrink:0}
.stb-h b{font-size:14px;font-weight:800}
.stb-st{margin-left:auto;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:7px;background:#f4efe6;color:#5b5547;white-space:nowrap}
.stb-st.ok{background:#1f7f8f;color:#fff}.stb-st.wn{background:#f8dcb7;color:#8a4a12}.stb-st.bad{background:#c23a2b;color:#fff}
.stb-n{margin:6px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink2,#5b5547)}
.stb-path{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:7px}
.stb-path code{flex:1 1 240px;min-width:0;font:600 12.5px/1.45 ui-monospace,Consolas,"Malgun Gothic",monospace;color:var(--ink,#1f2125);background:#f4efe6;border-radius:7px;padding:5px 8px;overflow-wrap:anywhere;word-break:break-all}
.stb-path .lk{font-size:12.5px}
.stb-path.bk{margin-top:8px}.stb-path.bk>span{flex:1 1 100%;font-size:12.5px;font-weight:700;color:var(--ink2,#5b5547)}
.stb-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:7px 0 0;font-size:12.5px;line-height:1.5}
.stb-kv dt{color:var(--ink3,#6f6857);font-weight:700}.stb-kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stb-kv code{font:600 12.5px/1.45 ui-monospace,Consolas,"Malgun Gothic",monospace}
.stb .row2{margin-top:9px}
.stb .gdauto{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}
.stb .lzbox{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px;font-weight:700}.stb .lzbox+.stb-n{margin-top:4px}
.stb-path .lk{min-height:0!important;height:auto!important;padding:0!important;line-height:1.5}
.stb .addl{margin-top:8px}
.stst{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:13.5px;font-weight:700}.stst svg{width:16px;height:16px;flex-shrink:0}.stst.ok{color:var(--cat,#1f7f8f)}.stst.wn{color:#a85a14}
code.bkp{display:block;margin-top:5px;font:600 12.5px/1.45 ui-monospace,Consolas,"Malgun Gothic",monospace;color:var(--ink,#1f2125);background:#f4efe6;border-radius:7px;padding:4px 8px;overflow-wrap:anywhere;word-break:break-all}

/* 색(10-30 제이 지정): 초록 #195455 · 바탕 베이지 #F0E8DB · 주황 #F56D03 — 메인 = 짙은 초록 #195455(고른 것 · 기능 · 로고 배지), 이벤트 = 진한 주황 #f56d03(주 단추 · 진행 표시) */
/* ══ Blog J 디자인 3.1 「정돈」 — 3.0 위에 덮어쓰는 다듬기 (10-30) ══
   1) 깊이는 3단만: 판(바탕) · 카드(머리카락 선 + 아주 옅은 그림자) · 들어감(입력 · 고르기 바탕)
   2) 이중 그림자(어두운 + 흰 빛) 없앰 → 흐릿함 · 뭉개짐 제거
   3) 모서리 4단계: 8 · 10 · 14 · 18px
   4) 고른 것 = 남색 선(1.5px) + 남색 글자, 주 버튼 = 앰버 한 곳(평평하게) */
:root{
  --navy:#195455;--amber:#f56d03;--brand:#195455;--accent:#f56d03;
  --paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--in-bg:#ece3d5;--up-bg:#f7f2ea;--pr-bg:#f3ece1;--press-bg:#f3ece1;--tray:#e9e0d1;--hover:#f5efe5;
  --hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.2);
  --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);
  --up-s:0 0 0 1px rgba(90,74,50,.09),0 1px 2px rgba(90,74,50,.06);
  --in:inset 0 0 0 1px rgba(90,74,50,.1);
  --press:inset 0 0 0 1.5px var(--navy,#195455);
  --sh-paper:0 1px 3px rgba(0,0,0,.06),0 14px 34px -14px rgba(60,48,30,.28);
  --r-s:8px;--r:10px;--r-m:14px;--r-l:18px;
}
/* 버튼: 평평하게, 그림자는 선 하나 */
.btn{border-radius:var(--r);box-shadow:var(--up-s);font-weight:600;transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--hover);box-shadow:0 0 0 1px var(--navy,#195455)}
.btn:active{transform:none;box-shadow:inset 0 0 0 1.5px var(--navy,#195455)}
.btn.sm{border-radius:var(--r-s)}
.btn.go{background:var(--amber,#f56d03);color:#fff;box-shadow:0 1px 2px rgba(140,60,10,.25),inset 0 -1px 0 rgba(0,0,0,.08);outline:0}
.btn.go:hover{background:#d95f00;box-shadow:0 1px 2px rgba(140,60,10,.25),0 0 0 3px rgba(245,109,3,.22);outline:0}
.btn.nv,.btn.p,.btn.accent{background:var(--navy,#195455);color:#fff;box-shadow:0 1px 2px rgba(15,55,56,.25)}
.btn.nv:hover,.btn.p:hover,.btn.accent:hover{background:#12403f;box-shadow:0 0 0 3px rgba(25,84,85,.16)}
.ib{box-shadow:var(--up-s);border-radius:var(--r)}
.ib:hover{box-shadow:0 0 0 1px var(--navy,#195455)}
/* 고르기(세그먼트): 바탕은 들어감 한 장, 고른 칸은 흰 카드 + 머리카락 선 */
.vt,.seg,.tvbar{background:var(--tint);box-shadow:var(--in);border-radius:var(--r);padding:3px;gap:2px}
.vt button,.seg button,.tvbar button{border-radius:var(--r-s);font-weight:600}
.vt button.on,.seg button.on,.tvbar button.on{background:var(--card);color:var(--ink,#1f2125);font-weight:700;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
/* 칩: 테두리만, 고른 칩은 남색 선 + 남색 글자 */
.chip{background:transparent;box-shadow:inset 0 0 0 1px var(--hair2);border-radius:999px;padding:7px 13px;font-weight:600}
.chip:hover{background:var(--card);box-shadow:inset 0 0 0 1px var(--navy,#195455)}
.chip.on,.chip.on:hover{background:var(--card);color:var(--navy,#195455);box-shadow:inset 0 0 0 1.5px var(--navy,#195455);font-weight:700}
/* 입력: 들어감 대신 흰 바탕 + 선 (읽기 쉬움) */
.inp,input.inp,select.inp,textarea.inp{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--navy,#195455),0 0 0 3px rgba(25,84,85,.1);outline:0}
.srch{background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);border-radius:var(--r)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy,#195455),0 0 0 3px rgba(25,84,85,.1)}
/* 카드 · 줄 */
.tcard,.row,.sgc,.pg{box-shadow:var(--up-s);border-radius:var(--r-m)}
.tcard:hover,.tgt:hover,.tlist .tcard.trip:hover{box-shadow:0 0 0 1px var(--navy,#195455),0 6px 18px -10px rgba(25,84,85,.3)}
body.pc .pmain,body.pc .pcp>div,body.pc .pc2>div{box-shadow:var(--up);border-radius:var(--r-l)}
.sheet .in,.sheet>div{border-radius:var(--r-l) var(--r-l) 0 0}
/* 이름표(섹션 머리): 작게 · 자간 · 흐린 먹 */
.lbl{font-size:12.5px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.sgc h4{font-size:14px;letter-spacing:-.01em}
/* 안내 상자: 상자 대신 왼쪽 선 하나 */
.note,.note.w,.stnote{background:transparent;box-shadow:none;border-radius:0;border-left:3px solid var(--hair2);padding:4px 0 4px 12px}
.note.w{border-left-color:#d98a1a}
/* 작은 표 · 뱃지 */
.okb,.dd{border-radius:6px}
/* 도구 작업대(3.0 틀): 교정대 · 작업 패널 · 눈금자 */

/* ───────── 사진 크게 보기 ───────── */
function pvList() {
  if (S.scr === "edit") return S.edit.photos.filter(p => PURL[p.id]).map(p => ({ f: PURL[p.id].f, t: PURL[p.id].t }));
  const r = RR(S.rid); if (!r) return []; return (r.photos || []).filter(p => PURL[p.id]).map(p => ({ f: PURL[p.id].f, t: PURL[p.id].t }));
}
function viewer() {
  const L = pvList(); if (!L.length) return ""; const i = Math.min(S.pv, L.length - 1), p = L[i]; const r = S.scr === "edit" ? S.edit : RR(S.rid);
  return `<div class="pv"><div class="pt"><b>${esc(titleOf(r || {}))}<small>사진 ${i + 1} / ${L.length}</small></b><button class="cb pvx" data-pvx aria-label="닫기">${IC.x}</button></div>
    <div class="pbw"><div class="pb" id="pvb"><img id="pvimg" src="${p.f}" alt="" draggable="false"></div>${L.length > 1 ? `<button class="pva l" data-pvm="-1" aria-label="이전 사진">‹</button><button class="pva r" data-pvm="1" aria-label="다음 사진">›</button>` : ""}</div>
    <p class="hint2">두 손가락으로 벌려 확대 · 두 번 눌러 2배 · 옆으로 밀어 다음 사진</p>
    ${L.length > 1 ? `<div class="pvth">${L.map((x, k) => `<button class="${k === i ? "on" : ""}" data-pvj="${k}" aria-label="${k + 1}번째 사진"><img src="${x.t || x.f}" alt=""></button>`).join("")}</div>` : ""}
    <div class="pf2"><button class="cb" data-zm="-1" aria-label="작게">−</button><span class="num" id="zv">100%</span><button class="cb" data-zm="1" aria-label="크게">+</button></div></div>`;
}
const Z = { s: 1, x: 0, y: 0 };
function zApply() { const im = $("#pvimg"); if (im) im.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`; const z = $("#zv"); if (z) z.textContent = Math.round(Z.s * 100) + "%"; }
function zReset() { Z.s = 1; Z.x = 0; Z.y = 0; zApply(); }
function pvBind() {
  const b = $("#pvb"); if (!b) return; zReset(); const pts = new Map(); let st0 = null, lastTap = 0, sw = null;
  b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, c] = [...pts.values()]; st0 = { d: Math.hypot(a.x - c.x, a.y - c.y), s: Z.s }; sw = null; }
    else { sw = { x: e.clientX, y: e.clientY, zx: Z.x, zy: Z.y, t: Date.now() }; const now = Date.now(); if (now - lastTap < 300) { Z.s = Z.s > 1 ? 1 : 2; if (Z.s === 1) { Z.x = 0; Z.y = 0; } zApply(); sw = null; } lastTap = now; } });
  b.addEventListener("pointermove", e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && st0) { const [a, c] = [...pts.values()]; Z.s = Math.min(5, Math.max(1, st0.s * Math.hypot(a.x - c.x, a.y - c.y) / st0.d)); if (Z.s === 1) { Z.x = 0; Z.y = 0; } zApply(); }
    else if (sw && Z.s > 1) { Z.x = sw.zx + e.clientX - sw.x; Z.y = sw.zy + e.clientY - sw.y; zApply(); } });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) st0 = null;
    if (sw && Z.s === 1 && pts.size === 0) { const dx = e.clientX - sw.x; if (Math.abs(dx) > 60 && Date.now() - sw.t < 600) { const n = pvList().length; if (n > 1) { S.pv = (S.pv + (dx < 0 ? 1 : -1) + n) % n; render(); } } } sw = null; };
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
  b.addEventListener("wheel", e => { e.preventDefault(); Z.s = Math.min(5, Math.max(1, Z.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); if (Z.s === 1) { Z.x = 0; Z.y = 0; } zApply(); }, { passive: false });
}

/* 붙여넣기: 담기 화면(사진 칸) · 목록 화면(Ctrl+V = 바로 담기) */
async function pastePhotos(blobs) {
  const E = S.edit; if (!E || !blobs.length) return false; const busy = $("#busy"); busy && busy.classList.add("on");
  try { for (const b of blobs) { const id = await importFile(b); E.photos.push({ id }); (E._added = E._added || []).push(id); E._dirty = true; } }
  catch (er) { toast(er.message); } busy && busy.classList.remove("on"); if (E.mode !== "photo" && !E.url && !E.text) E.mode = "photo"; render(); toast(`사진 ${blobs.length}장을 붙였어요.`); return true;
}
document.addEventListener("paste", async e => {
  const cd = e.clipboardData; if (!cd || S.sheet) return;
  const fs = [...(cd.items || [])].filter(i => i.kind === "file" && /^image\//.test(i.type)).map(i => i.getAsFile()).filter(Boolean);
  const inField = e.target.closest && e.target.closest("input,textarea");
  if (S.scr === "edit" && S.edit) { if (fs.length) { e.preventDefault(); await pastePhotos(fs); } return; }
  if (inField || S.scr !== "list" && S.scr !== "detail") return;
  if (fs.length) { e.preventDefault(); S.edit = newItem("photo"); S.edit._added = []; go("edit"); await pastePhotos(fs); return; }
  const t = cd.getData("text/plain"); if (!t || !t.trim()) return; e.preventDefault(); const it = fromShared("", t, ""); if (it) startEdit(it);
});

/* ══ 공통: 폴더의 정확한 전체 경로 (2026-10-31 제이 — 「글자가 작더라도 정확한 경로가 보여야 해」) ══
   웹 앱은 보안상 폴더의 전체 경로(C:\Users\…)를 알 수 없음 → 사용자가 탐색기 주소창을 한 번 복사해 붙여넣으면 그대로 기억해서 보여 줌.
   마지막 폴더 이름이 실제로 연결한 폴더와 같은지 확인.
   FPATH.ask({ name:"여행노트", cur:"지금 값", what:"저장 폴더" }) → Promise<"C:\…" | "" (지움) | null (취소)>
   FPATH.show(full, known) → 보여 줄 글자 (full 있으면 그대로, 없으면 "…\" + known) */
(function () {
  "use strict";
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MAC = /Macintosh|Mac OS X/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1);
  function clean(v) { v = String(v || "").trim().replace(/^["'“”]+|["'“”]+$/g, "").trim(); if (v.length > 3) v = v.replace(/[\\/]+$/, ""); return v; }
  function last(v) { const a = v.split(/[\\/]/).filter(Boolean); return a.length ? a[a.length - 1] : ""; }
  function show(full, known) { if (full) return full; if (!known) return ""; return "…\\" + String(known).split(" › ").join("\\"); }
  function ask(o) {
    o = o || {};
    return new Promise(res => {
      const ov = document.createElement("div"); ov.className = "fpx-ov";
      ov.innerHTML = `<div class="fpx" role="dialog" aria-modal="true"><div class="fpx-h"><b>${E(o.what || "폴더")}의 정확한 경로</b><button class="fpx-c" data-x aria-label="닫기">×</button></div>
<p class="fpx-p">웹 앱은 보안상 PC의 전체 경로를 알 수 없어요. 아래처럼 <b>한 번만</b> 복사해 붙여넣으면 그다음부터 정확한 경로가 늘 보여요.</p>
<ol class="fpx-s">${MAC ? `<li>Finder에서 「${E(o.name)}」 폴더를 찾아 <b>오른쪽 클릭</b></li><li><b>Option</b> 키를 누른 채 「<b>경로 이름 복사</b>」</li>` : `<li>파일 탐색기에서 「${E(o.name)}」 폴더를 <b>열기</b></li><li>위쪽 <b>주소창</b>을 한 번 누르면 경로가 파랗게 → <b>Ctrl + C</b></li>`}<li>아래 칸에 <b>Ctrl + V</b></li></ol>
<input class="fpx-i" spellcheck="false" autocomplete="off" placeholder="${MAC ? "/Users/이름/Pictures/" : "C:\\Users\\이름\\Pictures\\"}${E(o.name)}" value="${E(o.cur || "")}">
<p class="fpx-e" hidden></p>
<div class="fpx-r">${o.cur ? `<button class="fpx-b" data-clr>지우기</button>` : ""}<span style="flex:1"></span><button class="fpx-b" data-x>취소</button><button class="fpx-b go" data-ok>저장</button></div></div>`;
      document.body.appendChild(ov);
      const inp = ov.querySelector(".fpx-i"), er = ov.querySelector(".fpx-e");
      const done = v => { ov.remove(); res(v); };
      ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-x]")) done(null); else if (e.target.closest("[data-clr]")) done(""); else if (e.target.closest("[data-ok]")) ok(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); if (e.key === "Escape") done(null); });
      inp.addEventListener("input", () => { er.hidden = true; });
      function ok() {
        const v = clean(inp.value);
        if (!v) { er.textContent = "경로를 붙여넣어 주세요."; er.hidden = false; return; }
        if (!/^([A-Za-z]:[\\/]|\\\\|\/)/.test(v)) { er.textContent = "「C:\\…」처럼 드라이브부터 시작하는 전체 경로를 붙여넣어 주세요."; er.hidden = false; return; }
        if (o.name && last(v).toLowerCase() !== String(o.name).toLowerCase()) { er.innerHTML = `마지막 폴더 이름이 연결한 폴더 「<b>${E(o.name)}</b>」와 달라요. 그 폴더를 열고 주소창을 복사해 주세요.`; er.hidden = false; return; }
        done(v);
      }
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  }
  if (!window.__fpxCss) {
    window.__fpxCss = 1;
    const st = document.createElement("style");
    st.textContent = `
.fpx-ov{position:fixed;inset:0;z-index:10050;background:rgba(31,33,37,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.fpx{width:min(480px,100%);background:#f1ebe1;border-radius:14px;box-shadow:0 18px 40px rgba(31,33,37,.3);padding:16px 18px 16px;color:#1f2125;font-size:14px;line-height:1.55}
.fpx-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.fpx-h b{font-size:16px;font-weight:800}
.fpx-c{width:32px;height:32px;border:0;border-radius:9px;background:transparent;font-size:22px;line-height:1;color:#5b5547;cursor:pointer}.fpx-c:hover{background:#e7e0d2}
.fpx-p{margin:0 0 6px;font-size:13px;color:#5b5547}
.fpx-s{margin:0 0 10px;padding-left:20px;font-size:13.5px}
.fpx-i{width:100%;box-sizing:border-box;height:42px;padding:0 11px;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(32,38,58,.3);font:13.5px/1 ui-monospace,Consolas,"D2Coding",monospace;color:#1f2125}
.fpx-i:focus{outline:0;box-shadow:inset 0 0 0 2px #20263a}
.fpx-e{margin:7px 0 0;font-size:13px;color:#c23a2b}
.fpx-r{display:flex;gap:8px;margin-top:12px;align-items:center}
.fpx-b{font:inherit;font-size:13.5px;font-weight:700;height:38px;padding:0 14px;border:0;border-radius:10px;background:#f4efe6;color:#20263a;box-shadow:inset 0 0 0 1.5px rgba(32,38,58,.3);cursor:pointer}
.fpx-b:hover{box-shadow:inset 0 0 0 2px #20263a}.fpx-b.go{background:#20263a;color:#fff;box-shadow:none}`;
    (document.head || document.documentElement).appendChild(st);
  }
  window.FPATH = { ask, show, clean };
})();

/* ══ 공통: 백업 (2026-10-31 제이) ══
   ① 주기 알림 — 마지막 백업 뒤 정한 날짜(기본 7일)가 지나면 화면 아래 작은 카드 「지금 백업 · 3일 뒤에」
   ② 백업 폴더 기억 — PC · 안드로이드 크롬은 백업 폴더를 한 번 정하면(데이터 폴더가 있으면 그 안 「백업」 자동) 다음부터 누르면 바로 그 폴더에 저장, 최근 10개만 남김
   ③ 되살리기 — 기억한 폴더의 백업을 최신순으로 보여 주고 하나 누르면 끝. 기억이 없으면(브라우저 데이터를 지운 뒤) 「백업 폴더 고르기」 → 그 폴더에서 최신 백업을 찾아 줌
   아이폰 · 폴더를 못 쓰는 브라우저 = 공유 창(파일에 저장) · 다운로드 + 파일 고르기
   쓰는 법: BKUP.setup({ app, name, prefix, ext, mime, make, restore, count, dataDir, done })
            BKUP.run() 백업 · BKUP.restore() 되살리기 · BKUP.settings() 백업 설정 · BKUP.info() 상태 */
(function () {
  "use strict";
  const CAN = typeof window.showDirectoryPicker === "function";
  const AND = /Android/i.test(navigator.userAgent);
  const MOB = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const p2 = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  const ymdw = d => `${ymd(d)}(${WD[d.getDay()]})`;
  const E = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let O = null, st = { last: 0, every: 7, later: 0, first: 0 }, dir = null, dpath = "", dfull = "", indata = false, ready = null;
  /* 10-31 제이: 백업 폴더 경로 표시 — 브라우저는 앞부분(C:\\Users\\…)을 알려 주지 않아 고른 폴더부터 */

  const fullP = () => dfull || (indata && dataFull() ? dataFull().replace(/[\\/]+$/, "") + (dataFull().includes("/") && !dataFull().includes("\\") ? "/백업" : "\\백업") : "");
  const ptext = () => dir ? (fullP() || "…\\" + (dpath || dir.name).split(" › ").join("\\")) : "";

  async function kset(k, v) { try { const db = await idb(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, O.app + ":" + k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }

  const bkFolderName = () => O.name.replace(/\s/g, "") + "_백업";

  /* 백업 폴더 정하기: 데이터 폴더가 있으면 그 안 「백업」, 아니면 고르는 창(사진 폴더에서 시작 → 안에 「앱이름_백업」을 만듦) */
