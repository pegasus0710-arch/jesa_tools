:root{
--paper:#ece6da;--panel:#f1ebe1;--tint:#e7e0d2;--hover:#f7f2e9;--card:#f4efe6;--press-bg:#e6dfd1;
--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;--navy:#20263a;--amber:#e08a3e;--red:#c23a2b;--cat:#1f7f8f;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--sh-paper:12px 14px 28px rgba(120,100,70,.38),-5px -5px 12px rgba(255,255,255,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"BJ",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:20px;height:20px;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}


/* 앱 공통 */
.hd{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;flex-shrink:0}
.hd h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--up-s);display:grid;place-items:center;flex-shrink:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 110px}
.body::-webkit-scrollbar{width:0}
.srch{display:flex;align-items:center;gap:8px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:11px 14px;color:var(--ink3);font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy);color:var(--ink)}
.chips.tg .chip{font-weight:500;background:none;box-shadow:inset 0 0 0 1.5px #cfc5b2;padding:6px 11px;font-size:13.5px}
.chips.tg .chip.on{box-shadow:inset 0 0 0 2px var(--navy);color:var(--ink);font-weight:600}
.lbl{font-size:13px;font-weight:700;color:var(--ink3);margin:16px 2px 8px;letter-spacing:.02em;display:flex;justify-content:space-between}
.off{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:12px;box-shadow:4px 6px 14px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85);border:0;width:100%;text-align:left}
.off img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0}
.off b{display:block;font-size:15.5px}.off small{display:block;font-size:12.5px;color:#c9cbd6;margin-top:3px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{border:0;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:9px 9px 11px;text-align:left;min-width:0;position:relative}
.rc .ph{width:100%;aspect-ratio:4/3;border-radius:11px;object-fit:cover;display:block;background:var(--tint)}
.rc .ph.no{display:grid;place-items:center;color:var(--ink3);box-shadow:var(--in)}
.rc .ph.no svg{width:30px;height:30px;opacity:.55}
.rc b{display:block;font-size:15px;margin:9px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{display:block;font-size:12.5px;color:var(--ink3);margin:3px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .fv{position:absolute;right:15px;top:15px;width:26px;height:26px;border-radius:50%;background:rgba(31,33,37,.55);display:grid;place-items:center;color:#fff}
.rc .fv svg{width:14px;height:14px}
.fab{position:absolute;right:18px;bottom:88px;width:58px;height:58px;border-radius:18px;border:0;background:var(--amber);color:#fff;display:grid;place-items:center;box-shadow:4px 6px 14px rgba(170,110,55,.5),-3px -3px 8px rgba(255,255,255,.8);z-index:3}
.fab svg{width:26px;height:26px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--panel);box-shadow:0 -1px 0 rgba(160,140,108,.25),0 -8px 18px -10px rgba(120,100,70,.35);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 18px;z-index:2}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink3);border-radius:12px;position:relative}
.tabs button.on{color:var(--navy);background:var(--press-bg);box-shadow:var(--press)}
.tabs button .bd{position:absolute;top:2px;right:22%;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;line-height:17px;font-weight:700}
.btmbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);padding:12px 18px 20px;display:flex;gap:10px;box-shadow:0 -1px 0 rgba(160,140,108,.25),0 -8px 18px -10px rgba(120,100,70,.35);z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:0;font-size:15px;font-weight:600;padding:11px 16px;min-height:48px;border-radius:13px;box-shadow:var(--up-s);white-space:nowrap}
.btn.go{background:var(--amber);color:#fff;font-weight:700;flex:1;box-shadow:4px 6px 14px rgba(170,110,55,.45),-3px -3px 8px rgba(255,255,255,.85)}
.btn.nv{background:var(--navy);color:#fff;box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.w{width:100%}

/* 상세 */
.hero{position:relative;margin:0 -18px}
.hero img,.hero .no{width:100%;height:230px;object-fit:cover;display:block}
.hero .no{display:grid;place-items:center;background:var(--tint);color:var(--ink3);font-size:13.5px;text-align:center;line-height:1.6;box-shadow:var(--in)}
.thumbs{display:flex;gap:8px;padding:10px 0 0;overflow-x:auto}
.thumbs div{flex-shrink:0;width:64px;height:64px;border-radius:10px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;display:grid;place-items:center;font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.3}
.thumbs div img{width:100%;height:100%;object-fit:cover}
.thumbs div em{position:absolute;left:4px;bottom:4px;font-style:normal;background:rgba(31,33,37,.7);color:#fff;font-size:10.5px;border-radius:5px;padding:1px 5px}
.thumbs div.main{box-shadow:0 0 0 2px var(--navy)}
.ttl{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:14px 0 4px}
.meta{font-size:13.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:13px;color:var(--ink2);box-shadow:inset 0 0 0 1.5px #cfc5b2;border-radius:8px;padding:2px 8px}
.cat{font-size:13px;font-weight:700;color:#fff;background:var(--cat);border-radius:7px;padding:3px 8px}
.amt{display:flex;align-items:center;gap:10px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:8px;margin-top:14px}
.amt .stp{width:42px;height:42px;border-radius:11px;border:0;background:var(--card);box-shadow:var(--up-s);font-size:22px;font-weight:700}
.amt .v{flex:1;text-align:center}.amt .v b{font-size:21px;font-variant-numeric:tabular-nums}.amt .v small{display:block;font-size:12px;color:var(--ink3)}
.sec{margin-top:20px}
.sec h4{margin:0 0 6px;font-size:15px;font-weight:800;padding-bottom:7px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.sec h4 small{font-size:12.5px;color:var(--ink3);font-weight:600}
.ing{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #ddd4c3;font-size:15px}
.ing b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .gn{font-size:12.5px;color:var(--ink3);font-weight:700;padding-top:14px;border:0}
.stp-l{counter-reset:s;list-style:none;margin:0;padding:0}
.stp-l li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-bottom:1px solid #ddd4c3;font-size:14.5px;line-height:1.55}
.stp-l li:before{content:counter(s);position:absolute;left:0;top:10px;width:23px;height:23px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.log{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid #ddd4c3;font-size:14px}
.log .d{font-variant-numeric:tabular-nums;color:var(--ink3);width:84px;flex-shrink:0}
.src{font-size:12.5px;color:var(--ink3);margin-top:14px;line-height:1.55}

/* 만들기 */
.step{display:flex;gap:6px;margin:2px 0 14px}.step span{flex:1;height:4px;border-radius:2px;background:#d6ccb9}.step span.on{background:var(--navy)}
.mk-h{font-size:14px;color:var(--ink2);line-height:1.6;margin:0 0 10px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.hv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ddd4c3}
.hv .n{flex:1;min-width:0;font-size:15px}.hv .n small{display:block;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.yn{display:flex;background:var(--tint);box-shadow:var(--in);border-radius:11px;padding:3px;flex-shrink:0}
.yn button{border:0;background:none;border-radius:8px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--ink3)}
.yn button.y.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}
.yn button.n.on{background:var(--navy);color:#fff}
.sum{background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;margin-top:14px}
.picked{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* 장보기 */
.sl{border:0;width:100%;text-align:left;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.sl .t{flex:1;min-width:0}.sl b{display:block;font-size:16px}.sl small{display:block;font-size:13px;color:var(--ink3);margin-top:3px}
.prog{height:6px;border-radius:3px;background:#d6ccb9;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--navy)}
.ck{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #ddd4c3;font-size:15.5px;cursor:pointer}
.ck .bx{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px #8b8474;flex-shrink:0;display:grid;place-items:center}
.ck.dn .bx{background:var(--navy);box-shadow:none;color:#fff}
.ck.dn .bx svg{width:16px;height:16px}
.ck .n{flex:1;min-width:0}.ck .n small{display:block;font-size:12.5px;color:var(--ink3)}
.ck b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ck.dn .n,.ck.dn b{text-decoration:line-through;color:#a59d8d}
.fold{margin-top:16px;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2);line-height:1.7}
.fold b{color:var(--ink)}

/* 찾기 */
.frg{background:var(--panel);border-radius:16px;box-shadow:var(--up-s);padding:14px}
.frg .in{display:flex;gap:8px;flex-wrap:wrap;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:9px}
.fc{display:inline-flex;align-items:center;gap:5px;background:var(--card);box-shadow:var(--up-s);border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600}
.fc svg{width:13px;height:13px;color:var(--ink3)}
.fr{display:flex;gap:12px;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:10px;margin-top:12px;align-items:center}
.fr .ph{width:70px;height:70px;border-radius:11px;object-fit:cover;flex-shrink:0;background:var(--tint);display:grid;place-items:center;color:var(--ink3)}
.fr .t{flex:1;min-width:0}.fr b{display:block;font-size:15.5px}
.fr .m{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
.fr .sc2{font-size:13px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.bar5{display:flex;gap:3px;margin-top:6px}.bar5 i{width:16px;height:5px;border-radius:2px;background:#d6ccb9}.bar5 i.on{background:var(--navy)}

/* 넣기 */
.sheet{position:absolute;inset:0;background:rgba(31,33,37,.38);z-index:5;display:flex;align-items:flex-end}
.sheet .in{background:var(--panel);border-radius:24px 24px 0 0;padding:16px 18px 26px;width:100%}
.sheet .gr{width:44px;height:5px;border-radius:3px;background:#cfc5b2;margin:0 auto 14px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:16px;padding:14px;margin-top:10px}
.opt .ic{width:46px;height:46px;border-radius:13px;background:var(--tint);box-shadow:var(--in);display:grid;place-items:center;flex-shrink:0;color:var(--navy)}
.opt b{display:block;font-size:16px}.opt small{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.f{font-size:13px;font-weight:700;color:var(--ink3);margin:16px 2px 7px;display:block}
.inp{width:100%;background:var(--tint);box-shadow:var(--in);border:0;border-radius:12px;padding:12px 13px;font-size:15px;color:var(--ink)}
.inp.ph-t{color:#9b9383}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{border-radius:13px;background:var(--tint);box-shadow:var(--in);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--ink2);text-align:center;line-height:1.35;position:relative;overflow:hidden}
.slot b{font-size:13.5px;color:var(--ink)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot em{position:absolute;left:6px;top:6px;font-style:normal;background:var(--navy);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px;z-index:1}
.er{display:grid;grid-template-columns:minmax(0,1fr) 66px 58px;gap:6px;margin-bottom:6px}
.er .inp{padding:10px 11px;font-size:14.5px}
.sr{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.sr .no{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:9px}
.sr .inp{flex:1;font-size:14.5px;line-height:1.45;padding:10px 11px}
.sr .mv{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.sr .mv button{width:28px;height:21px;border:0;border-radius:6px;background:var(--card);box-shadow:var(--up-s);font-size:11px;color:var(--ink2);padding:0}
.hint{font-size:12.5px;color:var(--ink3);margin:6px 2px 0;line-height:1.5}

/* 설정 */
.row{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.warn{background:#f6e3c8;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#5e4520;margin-bottom:12px}
.foot{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:18px;line-height:1.7}
.foot a{color:var(--navy);font-weight:700}

.thumbs div{padding-bottom:14px}
.lvs{display:flex;background:var(--tint);box-shadow:var(--in);border-radius:10px;padding:3px;gap:2px}
.lvs button{border:0;background:none;border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:4px}
.lvs button svg{width:15px;height:15px}
.lvs button.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}
.rows .li{margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{border:0;padding:0;background:var(--tint);border-radius:10px;aspect-ratio:1;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--ink3)}
.grid3 img{width:100%;height:100%;object-fit:cover}
.grid3 span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(31,33,37,.75));color:#fff;font-size:12px;font-weight:600;padding:14px 6px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3 .nm{position:static;background:none;color:var(--ink2);padding:0 6px;text-align:center;white-space:normal;font-size:12.5px}
.pv{position:absolute;inset:0;background:#111;z-index:8;display:flex;flex-direction:column;color:#fff}
.pv .pt{display:flex;align-items:center;gap:10px;padding:12px 14px}
.pv .pt b{flex:1;font-size:15px}.pv .pt small{color:#bbb;font-size:12.5px;font-weight:500;display:block}
.pv .pb{flex:1;min-height:0;overflow:auto;display:grid;place-items:center}
.pv .pb img{max-width:100%;transition:transform .2s;transform-origin:center}
.pv .pb .ppr{width:80%;aspect-ratio:3/4;background:#f3eee3;color:#5b5547;border-radius:4px;display:grid;place-items:center;font-size:14px;text-align:center;line-height:1.6;transition:transform .2s}
.pv .pf2{display:flex;align-items:center;gap:10px;padding:12px 14px 22px;justify-content:center}
.pv .cb{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center}
.pv .hint2{text-align:center;font-size:12.5px;color:#bbb;padding:0 14px}
.bn2{display:flex;gap:10px;align-items:flex-start;background:#f6e3c8;border-radius:14px;padding:11px 12px;font-size:13.5px;line-height:1.55;color:#5e4520;margin-bottom:10px}
.bn2 .t{flex:1}.bn2 b{color:#3e2c10}
.bn2 button{border:0;background:none;color:#5e4520;font-weight:700;padding:0 2px;font-size:13.5px}
.gsteps{counter-reset:g;list-style:none;padding:0;margin:12px 0 0}
.gsteps li{counter-increment:g;display:flex;gap:12px;align-items:center;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:12px;margin-bottom:9px;font-size:14.5px;line-height:1.5}
.gsteps li:before{content:counter(g);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.gsteps .k{display:inline-flex;align-items:center;gap:4px;box-shadow:inset 0 0 0 1.5px #cfc5b2;border-radius:7px;padding:1px 7px;font-weight:700}
.gsteps .k svg{width:15px;height:15px}
.devs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.devs button{border:0;background:var(--card);box-shadow:var(--up-s);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.devs button.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy);color:var(--ink)}

/* PC 보기 */
.pcwrap{background:var(--paper);border-radius:20px;box-shadow:var(--up);overflow:hidden}
.pcbar{display:flex;align-items:center;gap:22px;padding:16px 26px;box-shadow:0 1px 0 rgba(255,255,255,.7),0 6px 14px -10px rgba(120,100,70,.45)}
.pcbar .lg{width:46px;height:46px;border-radius:14px;background:var(--cat);display:grid;place-items:center;color:#fff;position:relative}
.pcbar .lg i{position:absolute;width:12px;height:12px;right:-3px;bottom:-3px;border-radius:50%;background:var(--amber);border:3px solid var(--paper)}
.pcbar .bn small{display:block;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.05em}.pcbar .bn b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.pcnav{display:flex;gap:6px;background:var(--tint);box-shadow:var(--in);padding:5px;border-radius:14px;margin-left:16px}
.pcnav button{border:0;background:none;padding:9px 16px;border-radius:10px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center}
.pcnav button.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}
.pcbar .sp{flex:1}
.pcl{display:grid;grid-template-columns:400px minmax(0,1fr);gap:26px;padding:24px 26px 30px;align-items:start}
.pcp{background:var(--panel);border-radius:20px;box-shadow:var(--up);padding:18px}
.li{display:flex;gap:12px;align-items:center;border:0;background:var(--card);box-shadow:var(--up-s);border-radius:14px;padding:9px;width:100%;text-align:left;margin-top:10px}
.li.on{background:var(--press-bg);box-shadow:var(--press),0 0 0 2px var(--navy)}
.li img,.li .no{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--tint);display:grid;place-items:center;color:var(--ink3)}
.li b{display:block;font-size:15px}.li small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.mat{background:var(--tint);box-shadow:var(--in);border-radius:22px;padding:22px}
.paper{background:#fffdf8;border-radius:4px;box-shadow:var(--sh-paper);padding:34px 40px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px}
.paper .ttl{margin-top:0}
.paper .side img{width:100%;border-radius:8px;display:block}
.pcact{display:flex;gap:10px;margin-top:16px}

/* ── 실제 앱 ── */
body{margin:0;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.vt{display:flex;background:var(--tint);box-shadow:var(--in);padding:5px;border-radius:14px;gap:4px}
.vt button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--ink2)}
.vt button.on{background:var(--card);box-shadow:var(--up-s);color:var(--ink)}

function linkPrev(e) {
  const u = fixUrl(e.url); if (!e.url.trim()) return `<p class="hint">유튜브 · 블로그 · 뉴스 · 쇼핑몰 주소를 넣어요. 휴대폰은 그 앱에서 <b>공유 → 스크랩 노트</b>를 누르면 여기로 바로 와요.</p>`;
  if (!u) return `<p class="hint" style="color:var(--red)">주소 모양이 아니에요. https:// 로 시작하는 주소를 넣어 주세요.</p>`;
  const y = ytParse(u);
  if (y) return `<div class="lprev yt"><img src="${esc(ytThumb(y.id))}" alt="" referrerpolicy="no-referrer"><div class="t"><b>유튜브 ${y.shorts ? "쇼츠" : "영상"}</b><small>${e._fetching ? "제목 가져오는 중…" : "열 때 아래 시각부터 재생돼요(선택)"}</small>
    <div class="ytst"><span>시작</span><input class="inp num" data-ef="startTxt" id="estart" value="${esc(e.startTxt != null ? e.startTxt : e.start ? ytTime(e.start) : "")}" placeholder="분:초 (예: 3:20)" inputmode="numeric"><span>부터</span></div></div></div>`;
  return `<div class="lprev">${letterTile({ url: u, title: e.title }, "no")}<div class="t"><b>${esc(host(u))}</b><small>${e._sug && !e.cat ? `추천 분류: ${esc(e._sug.cat)}` : "링크"}</small></div></div>`;
}

  const P = () => Object.keys(A.picked).filter(k => A.picked[k]).map(RR).filter(Boolean);

});

document.addEventListener("input", e => {

document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;

  if (d.agrp != null) { S.al.grp = t.checked; aSave(); const R = $("#ares"); if (R) R.innerHTML = aResHtml(); return; }

});
document.addEventListener("keydown", e => {

});

/* 붙여넣기: 담기 화면(사진 칸) · 목록 화면(Ctrl+V = 바로 담기) */
async function pastePhotos(blobs) {
  const E = S.edit; if (!E || !blobs.length) return false; const busy = $("#busy"); busy && busy.classList.add("on");
  try { for (const b of blobs) { const id = await importFile(b); E.photos.push({ id }); (E._added = E._added || []).push(id); E._dirty = true; } }
  catch (er) { toast(er.message); } busy && busy.classList.remove("on"); if (E.mode !== "photo" && !E.url && !E.text) E.mode = "photo"; render(); toast(`사진 ${blobs.length}장을 붙였어요.`); return true;
}
document.addEventListener("paste", async e => {
  const cd = e.clipboardData; if (!cd || S.sheet) return;
  const fs = [...(cd.items || [])].filter(i => i.kind === "file" && /^image\//.test(i.type)).map(i => i.getAsFile()).filter(Boolean);
  const inField = e.target.closest && e.target.closest("input,textarea");
  if (S.scr === "edit" && S.edit) { if (fs.length) { e.preventDefault(); await pastePhotos(fs); } return; }
  if (inField || S.scr !== "list" && S.scr !== "detail") return;
  if (fs.length) { e.preventDefault(); S.edit = newItem("photo"); S.edit._added = []; go("edit"); await pastePhotos(fs); return; }
  const t = cd.getData("text/plain"); if (!t || !t.trim()) return; e.preventDefault(); const it = fromShared("", t, ""); if (it) startEdit(it);
});
document.addEventListener("click", async e => {
  if (!e.target.closest("[data-phpaste]")) return;

  try { const its = await navigator.clipboard.read(), bl = [];
    for (const it of its) { const ty = it.types.find(t => /^image\//.test(t)); if (ty) bl.push(await it.getType(ty)); }
    if (!bl.length) return toast("복사한 사진이 없어요. 사진을 길게 눌러(또는 오른쪽 클릭) 「복사」한 뒤 다시 눌러 주세요.");
    await pastePhotos(bl);
  } catch (er) { toast("붙여넣기를 허용해 주세요. 주소창 옆에 「허용」이 뜨면 눌러 주세요."); } });

  if (!shared && (CAN_DIR || gdHttp()) && !D.dir && !D.set.gdOn && !D.set.storeAsked) S.sheet = "store";
  try { history.replaceState({ n: 0 }, "", shared ? location.pathname : location.href); } catch (e) {}

    if (lt && lt.split(".").map(Number).reduce((a, n, i) => a || (n !== (VER.split(".").map(Number)[i] || 0) ? (n > (VER.split(".").map(Number)[i] || 0) ? 1 : -1) : 0), 0) > 0) { S.newVer = lt; render(); } } catch (e) {} }
})();
