*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
input,select{width:100%;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(122,75,42,.12)}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.grow{flex:1;min-width:0}.muted{color:var(--ink3);font-size:12px}.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r-btn);background:#fff;border:1px solid var(--line2);font-weight:700;white-space:nowrap}
.btn:hover{background:#f3f4f9}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.p:hover{background:var(--acc2)}.btn.s{padding:5px 10px;font-size:12px;border-radius:7px}
.lnk{color:var(--acc);text-decoration:underline;margin-left:4px;font-size:12px}
.app{max-width:1200px;margin:0 auto;padding:20px 20px 48px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;font-family:var(--font-head);letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;font-family:serif;position:relative;flex-shrink:0;box-shadow:var(--sh)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accbg);color:var(--acc);margin-left:2px;font-family:var(--font)}
.brand .ver{font-size:11px;color:var(--ink3);font-weight:500;font-family:var(--font)}
.actions{margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,440px);gap:18px;align-items:start}
@media(max-width:860px){.lay{grid-template-columns:1fr}}
.sec-h{font-size:15px;font-weight:800;color:var(--ink);margin:2px 0 10px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-family:var(--font-head);letter-spacing:-.2px}.sec-h .muted{font-weight:500;font-family:var(--font);font-size:12.5px}
.seg{display:flex;background:#eceef5;border-radius:9px;padding:3px;gap:2px}.seg button{flex:1;padding:7px;border-radius:7px;font-weight:700;color:var(--ink2)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pairs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.grp{margin-bottom:6px}.grp .gl{font-size:11.5px;color:var(--ink3);margin:6px 0 3px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px}
.chip:hover{background:#f3f4f9}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.dd3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}.sw .t{font-weight:700}.sw .d{font-size:12px;color:var(--ink3)}
.tog{width:40px;height:22px;border-radius:11px;background:#d0d3de;position:relative;flex-shrink:0}.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}.tog.on{background:var(--acc)}.tog.on::after{left:20px}
.note{background:var(--accbg);border:1px solid #e6d6c6;color:#5a3a20;padding:10px 12px;border-radius:9px;font-size:12.5px}.note.w{background:var(--warnbg);border-color:#f4dfb5;color:#7f5008}
.empty{text-align:center;color:var(--ink3);padding:60px 0;background:#fff;border:1px dashed var(--line2);border-radius:var(--r)}
.foot{margin-top:auto;padding:22px 0 8px;text-align:center;font-size:11.5px;color:var(--ink3)}
/* 시트 */
.sheet{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);margin:0 auto;overflow:hidden}
.jb{position:absolute;overflow:hidden}
.jb.guide{outline:1.5px dashed #999;outline-offset:-1px}
.jb .txt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);writing-mode:vertical-rl;text-orientation:upright;display:block;letter-spacing:.02em;line-height:1;white-space:nowrap;color:#000}
.jb .txt.serif{font-family:"Batang","바탕","BatangChe","Nanum Myeongjo","나눔명조","Noto Serif KR","Noto Serif CJK KR","Apple Myungjo","Songti SC","serif"}
.jb .txt.sans{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif}
.jb .txt.kai{font-family:"KaiTi","楷体","STKaiti","Kaiti SC","BiauKai","Batang","바탕","Noto Serif CJK KR",serif}
.jb .txt.b{font-weight:700}
.jb .txt.kor{letter-spacing:0}
.print-only{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  .app>*:not(.print-only){display:none!important}
  .app{padding:0;margin:0;max-width:none;min-height:0;display:block}
  .print-only{display:block;width:210mm;height:297mm;overflow:hidden}
  .print-only .sheet{box-shadow:none;margin:0}
  .jb.guide{outline:0.3mm dashed #666}
}

.tree .t1{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(max-width:600px){.tree .t1{grid-template-columns:repeat(3,1fr)}}
.tcard{padding:12px 6px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-weight:700;font-size:13px;line-height:1.3;transition:transform .1s}
.tcard:hover{transform:translateY(-1px)}
.tcard:hover{background:#f3f4f9}.tcard.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tree .t2{margin-top:10px;padding:10px 12px;background:#fafbfe;border:1px solid var(--line);border-radius:10px}
.tree .t2h{font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.tree .picked{margin-top:8px;font-size:12.5px;color:var(--ink2)}.tree .picked b{color:var(--acc);margin-right:6px}
.advbox{margin-top:8px;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px}

.tabs{display:flex;background:#eeece3;border-radius:12px;padding:4px;gap:3px}.tabs button{padding:9px 18px;border-radius:9px;font-weight:800;color:var(--ink2);font-family:var(--font-head);font-size:14px}.tabs button.on{background:#fff;color:var(--acc);box-shadow:var(--sh)}
.hide{display:none!important}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{padding:8px 8px;border-bottom:1px solid #f0f1f6;vertical-align:top;text-align:left}.tb th{font-size:11.5px;color:var(--ink3);background:#fafbfe}
.tb.res td:first-child{width:44%}.tb tr.past td{color:var(--ink3)}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.big-d{background:var(--accbg);border:1px solid #e6d6c6;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.big-d .t{font-size:12px;color:#5a3a20}.big-d .v{font-size:18px;font-weight:800;color:var(--acc)}.big-d .dd{font-size:13px;font-weight:700;color:#5a3a20;margin-top:2px}
@media(max-width:640px){.top{flex-wrap:wrap}.tabs{order:3;width:100%}}

.date-field{position:relative;display:flex;align-items:center;gap:6px}
.date-field .date-display{cursor:pointer;background:#fff;font-variant-numeric:tabular-nums;font-weight:600;flex:1}
.date-field .date-display.sun{color:#e0554d}.date-field .date-display.sat{color:#2f6fe4}
.date-icon-btn{cursor:pointer;font-size:16px;flex-shrink:0;line-height:1}
/* 양력 날짜칸 전용: 진짜 date input을 위에 포개어 실제 클릭이 그 위에 떨어지게 함 (iframe에서 showPicker 차단 우회) */
.date-field.solar .date-display,.date-field.solar .date-icon-btn{pointer-events:none;position:relative;z-index:1}
.date-field.solar .date-native-top{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;margin:0;cursor:pointer;z-index:2}
.tb.res tbody tr{transition:background .12s;cursor:default}
.tb.res tbody tr:hover td{background:var(--accbg)}
.tb.res tbody tr:hover td:first-child b{color:var(--acc)}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}.foot a:hover{color:var(--acc);border-color:var(--acc)}

.datrow{align-items:center}.datrow .date-field{flex:0 0 auto;width:220px}.datrow .conv{flex:1;font-size:13px;font-weight:600;color:var(--acc);white-space:nowrap}.datrow .btn{flex:0 0 auto}
@media(max-width:480px){.datrow{flex-wrap:wrap}.datrow .date-field{width:100%}}

.lay2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:12px;align-items:start}
@media(max-width:800px){.lay2{grid-template-columns:1fr}}
.rule{padding:9px 0;border-bottom:1px solid #f0f1f6}.rule:last-child{border-bottom:none}
.rule .rk{font-size:14px}.rule .rs{font-size:13px;color:var(--acc);font-weight:600;margin:2px 0}.rule .rd{font-size:12.5px;color:var(--ink2);line-height:1.55}

.lpick{position:absolute;left:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:12px;width:300px}
.lp3{display:grid;grid-template-columns:1.2fr 1fr .9fr;gap:6px}.lp3 select{padding:7px 6px}

.app.embed{padding:4px 4px 10px;min-height:0}
.app.embed .top{margin-bottom:8px}
.app.embed .foot{padding:12px 0 0}

body:has(.app.embed){background:transparent}
.app.embed{padding:0 0 6px}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.tabs button svg{opacity:.75}.tabs button.on svg{opacity:1}
.btn svg{margin-right:1px}
.date-icon-btn{color:var(--acc);display:inline-flex;align-items:center}
.tabs button,.seg button{white-space:nowrap}
.diag{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
@media(max-width:640px){
  .tabs{overflow-x:auto;max-width:100%}
  .tabs button{padding:8px 11px;font-size:13px;gap:5px}
  .seg{overflow-x:auto}
  .seg button{font-size:12.5px;padding:8px 10px}
  .diag svg{min-width:620px}
}
.swipe-hint{display:none;font-size:12px;color:var(--ink3);text-align:center;margin-bottom:6px}
@media(max-width:640px){.swipe-hint{display:block}}

:root{--tint:#efede5;--tint2:#e7e4d9;--hover:#f1efe8;--danger:#b84a3c;--success:#3e8b52}
body{font-size:14.5px}
/* 붓글씨·궁서 */
.jb .txt.brush,.hanja-t.brush,.fp-s.brush{font-family:"BJ-Kai","BJ-Brush","Gungsuh","궁서","GungsuhChe",serif}
.jb .txt.gungsuh,.hanja-t.gungsuh,.fp-s.gungsuh{font-family:"Gungsuh","궁서","GungsuhChe","BJ-Kai",serif}
.fp-s.serif,.hanja-t.serif{font-family:"Batang","바탕","Nanum Myeongjo","Noto Serif CJK KR",serif}
.fp-s.sans,.hanja-t.sans{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif}

/* 중립 톤 정리 — 푸른 회색 제거 */
.seg{background:var(--tint);padding:4px;border-radius:12px}
.seg button{padding:9px;border-radius:9px;color:var(--ink2);font-weight:700}
.seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.btn:hover{background:var(--hover)}
.chip:hover,.tcard:hover{background:var(--hover)}

/* 선택 상태 = 브랜드 네이비 (기능색) */
.tcard.on,.chip.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.tog.on{background:var(--brand-ink)}
input:focus,select:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.btn.p{background:var(--brand-ink);border-color:var(--brand-ink)}.btn.p:hover{background:#343d5c}
.btn.accent{background:var(--brand-accent);border-color:var(--brand-accent);color:#fff}.btn.accent:hover{background:#c9762f}
.btn.w{width:100%;justify-content:center}.btn.big{padding:14px;font-size:15px;font-family:var(--font-head);border-radius:12px}
.lnk{color:var(--brand-ink);text-decoration:none;font-weight:700;border-bottom:1px solid var(--line2)}

/* 단계 카드 */
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:0 2px 10px rgba(30,28,20,.04)}
.step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-h .num,.fold .num{width:28px;height:28px;border-radius:9px;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-size:13px;flex-shrink:0}
.num.ghost{background:var(--tint);color:var(--brand-ink)}
.step h3,.fold h3,.pv-h h3{font-family:var(--font-head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p,.fold summary p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500}
input,select{padding:10px 12px;border-radius:10px;font-size:14px}

/* 대상 선택 트리 */
.tree .t1{gap:8px}
.tcard{padding:13px 6px;border-radius:12px;font-size:13.5px;border-color:var(--line)}
.tree .t2{background:var(--paper);border:none;border-radius:12px;padding:14px 16px;margin-top:12px}
.tree .t2h{font-size:12.5px;color:var(--ink2)}
.chip{padding:7px 14px;font-size:13px;font-weight:600;border-color:var(--line2)}
.tree .picked{font-size:12.5px}.tree .picked b{color:var(--brand-ink)}

/* 접이식 인쇄 설정 */
.fold{padding:0}
.fold summary{list-style:none;display:flex;gap:12px;align-items:center;padding:18px 22px;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold .chev{font-size:18px;color:var(--ink3);transition:transform .15s}
.fold[open] .chev{transform:rotate(180deg)}
.fold-body{padding:0 22px 20px;border-top:1px solid var(--line)}
.fontpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.fp:hover{background:var(--hover)}
.fp.on{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.10)}
.fp-s{font-size:26px;line-height:1.2;color:#000}
.fp b{font-size:13px;font-family:var(--font-head)}.fp small{font-size:11px;color:var(--ink3)}
.fold .sw{margin-top:14px;margin-bottom:0}

/* 미리보기 카드 (sticky) */
.col-r{position:sticky;top:16px}
.preview-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.pv-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.pv-h span{font-size:12px;color:var(--ink3)}
.preview-card .sheet{border:1px solid var(--line);box-shadow:none;border-radius:4px}
.pv-list{list-style:none;margin:14px 0}
.pv-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.pv-list li b{font-size:16px;color:var(--ink);font-weight:400}
.pv-tip{text-align:center;font-size:12px;color:var(--ink3);margin-top:10px}.pv-tip b{color:var(--ink2)}

/* 안내 박스: 중립 + 앰버 라인 */
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-accent);color:var(--ink2);border-radius:10px}
.note.w{border-left-color:var(--brand-accent);background:#fffaf2}
.muted{font-size:12.5px}

@media(max-width:860px){.col-r{position:static}}
@media(max-width:640px){.step{padding:18px}.fold summary{padding:16px 18px}.fold-body{padding:0 18px 18px}.fontpick{grid-template-columns:repeat(2,1fr)}.tree .t1{grid-template-columns:repeat(3,1fr)}}
@media print{.preview-card{display:none}}

.lay>*{min-width:0}
.pv-box{width:100%}
.pv-box .sheet{margin:0 auto}

/* ── 음력 변환 (한국천문연구원 기준 데이터, 1901~2050) ── */
const DAY=86400000; const dstr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pdate=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
function lunarMonths(y){ const t=LUNAR[y]; if(!t) return null; const [leap,len,ny]=t; const out=[]; let i=0; for(let m=1;m<=12;m++){ out.push({m,leap:false,days:len[i++]}); if(leap===m) out.push({m,leap:true,days:len[i++]}); } return {ny:pdate(ny),months:out,leap}; }
function lunarToSolar(y,m,d,isLeap){ const L=lunarMonths(y); if(!L) return null; let off=0; for(const mo of L.months){ if(mo.m===m&&mo.leap===!!isLeap){ if(d>mo.days) return null; return new Date(L.ny.getTime()+(off+d-1)*DAY); } off+=mo.days; } return null; }
function solarToLunar(date){ let y=date.getFullYear(); let L=lunarMonths(y); if(!L||date<L.ny){ y--; L=lunarMonths(y); if(!L) return null; } let off=Math.round((date-L.ny)/DAY); for(const mo of L.months){ if(off<mo.days) return {y,m:mo.m,d:off+1,leap:mo.leap}; off-=mo.days; } return null; }
function hasLeap(y,m){ const L=lunarMonths(y); return !!(L&&L.leap===m); }
function fmtK(d){ return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`; }

function toHanja(s){ s=(s||"").trim().replace(/\s/g,""); if(!s) return ""; if(/^[\u4e00-\u9fff]+$/.test(s)) return s;
  // 본관+성 (예: 경주김) → 본관 한자 + 성 한자
  for(let i=s.length-1;i>=2;i--){ const b=s.slice(0,i), sn=s.slice(i); if(BONGWAN[b]&&SURNAME[sn]) return BONGWAN[b]+SURNAME[sn]; }
  if(SURNAME[s]) return SURNAME[s]; if(BONGWAN[s]) return BONGWAN[s];
  return s; }
function altHanja(s){ s=(s||"").trim().replace(/\s/g,""); for(let i=s.length-1;i>=1;i--){ const b=s.slice(0,i), sn=s.slice(i); if((BONGWAN[b]||i===0)&&SURNAME_ALT[sn]) return SURNAME_ALT[sn].map(x=>(BONGWAN[b]||"")+x); } return SURNAME_ALT[s]?SURNAME_ALT[s]:[]; }

function renderText(form,inp,mode){
  const title=form.g==="m"?(inp.titleM==="__custom"?inp.customM:inp.titleM||"學生"):(inp.titleF==="__custom"?inp.customF:inp.titleF||"孺人");
  const clanH=toHanja(inp.clan)||"○○○", clanK=(inp.clan||"○○○").replace(/\s/g,"");
  const name=inp.name||"○○";
  if(mode==="kor") return form.kor.replace("{K}",clanK).replace("{N}",name);
  let t=form.hanja.replace("{T}",title||"").replace("{C}",clanH).replace("{N}",name);
  if(mode==="dok") t=[...t].map(c=>DOK[c]||c).join("");
  return t;
}

function LunarInput({y,m,d,leap,onChange}){
  const [open,setOpen]=useState(false); const ref=useRef();
  useEffect(()=>{ if(!open) return; const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h); },[open]);
  const years=[]; for(let yy=2050;yy>=1901;yy--) years.push(yy);
  const L=y?lunarMonths(+y):null; const months=L?L.months:Array.from({length:12},(_,i)=>({m:i+1,leap:false,days:30}));
  const cur=months.find(x=>x.m===+m&&x.leap===!!leap); const days=cur?cur.days:30;
  const label=(y&&m&&d)?`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}${leap?"(윤)":""}`:"";
  const set=(k,v)=>{ const n={y:+y||0,m:+m||0,d:+d||0,leap:!!leap,[k]:v}; if(k==="m"){ const [mm,lp]=String(v).split(":"); n.m=+mm; n.leap=lp==="1"; } if(n.y&&!lunarMonths(n.y)) n.y=n.y; const LL=n.y?lunarMonths(n.y):null; if(LL&&n.m){ const mo=LL.months.find(x=>x.m===n.m&&x.leap===n.leap)||LL.months.find(x=>x.m===n.m); if(mo){ n.leap=mo.leap; if(n.d>mo.days) n.d=mo.days; } } onChange(n); };
  return html`<span class="date-field" ref=${ref}>
    <input type="text" class="date-display" readonly value=${label} placeholder="음력 년-월-일" onClick=${()=>setOpen(o=>!o)} />

function Calc(){
  const [c,setC]=useState(()=>({cal:"solar",date:"",ly:"",lm:"",ld:"",leap:false,funeral:3,...load("calc",{})}));
  useEffect(()=>save("calc",c),[c]); const up=(k,v)=>setC(p=>({...p,[k]:v})); const reset=()=>setC(p=>({...p,date:"",ly:"",lm:"",ld:"",leap:false}));
  const today=new Date(); today.setHours(0,0,0,0);
  let base=null, lun=null, err="";
  if(c.cal==="solar"){ if(c.date){ base=pdate(c.date); lun=solarToLunar(base); } }
  else { const y=+c.ly,m=+c.lm,d=+c.ld; if(y&&m&&d){ base=lunarToSolar(y,m,d,c.leap); if(!base) err=LUNAR[y]?"해당 음력 날짜가 없습니다 (윤달·30일 확인)":"1901~2050년만 계산할 수 있습니다"; else lun={y,m,d,leap:c.leap}; } }
  const add=(n)=>new Date(base.getTime()+n*DAY);
  const dday=d=>{ const n=Math.round((d-today)/DAY); return n===0?"오늘":n>0?`D-${n}`:`${-n}일 지남`; };
  const anniv=(n)=>{ // n주기 날짜: 양력 기준이면 같은 월일, 음력 기준이면 같은 음력 월일을 양력으로
    if(c.cal==="solar"||!lun) return new Date(base.getFullYear()+n,base.getMonth(),base.getDate());
    let d=lunarToSolar(lun.y+n,lun.m,lun.d,lun.leap&&hasLeap(lun.y+n,lun.m)); if(!d) d=lunarToSolar(lun.y+n,lun.m,Math.min(lun.d,29),false); return d; };
  const rows=base?[

    ["백일","百日",add(99),"돌아가신 날을 1일로 하여 100일째"],
    ["소상 (1주기)","小祥",anniv(1),"첫 번째 기일"],
    ["대상 (2주기)","大祥",anniv(2),"두 번째 기일 · 3년상을 마침"],
    ["3주기","忌祭祀",anniv(3),"이후 매년 기제사"],
  ]:[];

      :html`<label class="f">음력 기일</label><div class="row datrow"><${LunarInput} y=${c.ly} m=${c.lm} d=${c.ld} leap=${c.leap} onChange=${n=>setC(p=>({...p,ly:n.y||"",lm:n.m||"",ld:n.d||"",leap:n.leap}))} />${base?html`<span class="conv">양력 ${fmtK(base)}</span>`:err?html`<span class="conv" style="color:#a6352e">${err}</span>`:null}${(c.ly||c.lm||c.ld)?html`<button class="btn s" onClick=${reset}>초기화</button>`:null}</div>`}

        <tr><td><b>대상</b> 大祥</td><td>2주기. 두 번째 기일. 전통 3년상을 마치는 제사</td></tr>

          <table class="tb res"><thead><tr><th>구분</th><th>날짜</th><th>D-day</th></tr></thead><tbody>
            ${rows.map(([n,h,d,desc])=>html`<tr class=${d>=today?"":"past"}><td><b>${n}</b> <span class="muted">${h}</span><div class="muted small">${desc}</div></td><td>${fmtK(d)}${c.cal==="solar"&&n.includes("주기")?null:null}</td><td class="mono">${dday(d)}</td></tr>`)}

    </div>
  </div>`;
}

      <div class="muted small" style="margin-top:8px">방향은 <b>제사상 앞에 서서 신위를 바라볼 때</b> 기준입니다. 오른쪽이 동쪽, 왼쪽이 서쪽.</div></div>
    <div class="lay2">
      <div class="panel"><div class="sec-h">상차림 원칙 풀이</div>
        ${RULES.map(([k,h,s,d])=>html`<div class="rule"><div class="rk"><b>${k}</b> <span class="muted">${h}</span></div><div class="rs">${s}</div><div class="rd">${d}</div></div>`)}</div>
      <div class="col">
        <div class="panel"><div class="sec-h">올리지 않는 것</div>${AVOID.map(([k,d])=>html`<div class="rule"><div class="rk"><b>${k}</b></div><div class="rd">${d}</div></div>`)}</div>
        <div class="panel" style="margin-top:12px"><div class="sec-h">알아두면 좋은 것</div>
          <div class="rule"><div class="rd">• <b>설날</b>은 밥 대신 <b>떡국</b>, <b>추석</b>은 <b>송편</b>을 올립니다. 차례는 기제사와 달리 술을 한 번만 올리고(단헌), 축문을 읽지 않는 것이 보통입니다.</div></div>
          <div class="rule"><div class="rd">• 과일은 위·아래를 살짝 깎아 놓고, 홀수로 괴는 것이 관례입니다.</div></div>
          <div class="rule"><div class="rd">• 성균관은 "전을 부치지 않아도 되고, 과일 종류는 정해진 게 없다"고 밝혔습니다. 형식 때문에 가족이 힘들면 줄이는 게 예에 어긋나지 않습니다.</div></div>
          <div class="rule"><div class="rd">• 지방은 <b>지방 출력</b> 탭에서 뽑아 신위 자리에 세우면 됩니다.</div></div>
        </div>
      </div>
    </div>
  </div>`;
}

function App(){
  const Q=new URLSearchParams(location.search); const EMBED=Q.get("embed")==="1";
  const [tab,setTab]=useState(()=>({print:"print",calc:"calc",charye:"charye"}[Q.get("tab")]||"print"));
  useEffect(()=>{ if(!EMBED||window.parent===window) return; const send=()=>{ try{ window.parent.postMessage({blogj:"height",h:document.documentElement.scrollHeight+16},"https://luvbong.tistory.com"); }catch(e){} }; send(); const ro=new ResizeObserver(send); ro.observe(document.body); window.addEventListener("load",send); return ()=>ro.disconnect(); },[tab]);
  const [mode,setMode]=useState(()=>load("mode","hanja"));
  const [sel,setSel]=useState(()=>load("sel",["f","m"]));
  const [inp,setInp]=useState(()=>({titleM:"學生",titleF:"孺人",customM:"",customF:"",clan:"",name:"",...load("inp",{})}));
  const [pr,setPr]=useState(()=>{ const x={...DEF_PRINT,...load("print",{})}; if(x.font==="kai") x.font="brush"; return x; });
  useEffect(()=>save("mode",mode),[mode]); useEffect(()=>save("sel",sel),[sel]); useEffect(()=>save("inp",inp),[inp]); useEffect(()=>save("print",pr),[pr]);
  const toggle=id=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):(s.length>=2?[s[1],id]:[...s,id]));
  const [cat,setCat]=useState(()=>load("cat","parents")); const [adv,setAdv]=useState(false);
  useEffect(()=>save("cat",cat),[cat]);
  const catObj=TREE.find(c=>c.id===cat);
  const sameSel=ids=>ids.length===sel.length&&ids.every(x=>sel.includes(x));
  const pickCat=id=>{ setCat(id); const c=TREE.find(x=>x.id===id); if(c) setSel(c.opts[0][1]); };
  const forms=sel.map(byId).filter(Boolean);
  const slots=forms.length===0?[]:forms.length===1?[forms[0],forms[0]]:forms;
  const needClan=forms.some(f=>f.clan), needName=forms.some(f=>f.name), hasM=forms.some(f=>f.g==="m"), hasF=forms.some(f=>f.g==="f"&&f.clan);
  const alts=needClan?altHanja(inp.clan):[];
  const up=(k,v)=>setInp(p=>({...p,[k]:v})); const upP=(k,v)=>setPr(p=>({...p,[k]:v}));
  const texts=slots.map(f=>renderText(f,inp,mode));
  const doPrint=()=>{ if(!slots.length) return alert("지방 대상을 먼저 선택하세요"); window.print(); };
  // 미리보기 배율: A4 210×297mm
  const prevRef=useRef(); const [scale,setScale]=useState(2.2);
  useEffect(()=>{ const c=()=>{ if(prevRef.current) setScale(Math.min(2.6,(prevRef.current.clientWidth-2)/210)); }; c(); window.addEventListener("resize",c); return ()=>window.removeEventListener("resize",c); },[]);
  const Sheet=({sc})=>{ const W=210,H=297; const totalW=pr.w*2+pr.gap; const left=(W-totalW)/2; const top=(H-pr.h)/2+(+pr.offsetY||0);
    return html`<div class="sheet" style=${{width:W*sc+"px",height:H*sc+"px"}}>
      ${slots.map((f,i)=>{ const t=texts[i]; const n=[...t].length; const fs=Math.min(pr.w*0.62,(pr.h*0.86)/n*0.98)*sc; // mm→px
        return html`<div class="jb ${pr.guide?"guide":""}" style=${{left:(left+i*(pr.w+pr.gap))*sc+"px",top:top*sc+"px",width:pr.w*sc+"px",height:pr.h*sc+"px"}}>
          <div class="txt ${pr.font} ${mode!=="hanja"?"kor":""} ${pr.bold?"b":""}" style=${{fontSize:fs+"px"}}>${t}</div></div>`; })}
    </div>`; };
  return html`<div class="app ${EMBED?"embed":""}">
    <div class="top">
      ${!EMBED?html`<div class="brand"><span class="lg">位<span class="jmini">J</span></span>제사 지방 출력<span class="cat">의례</span><span class="ver">v${APP_VER}</span></div>`:null}
      <div class="tabs ${EMBED&&Q.get("tab")?"hide":""}"><button class=${tab==="print"?"on":""} onClick=${()=>setTab("print")}><${Icon} name="doc" size=${16} /> 지방 출력</button><button class=${tab==="calc"?"on":""} onClick=${()=>setTab("calc")}><${Icon} name="calendar" size=${16} /> 제사 계산기</button><button class=${tab==="charye"?"on":""} onClick=${()=>setTab("charye")}><${Icon} name="table" size=${16} /> 차례상 차리기</button></div>
      
    </div>
    ${tab==="calc"?html`<${Calc} />`:null}
    ${tab==="charye"?html`<${Charye} />`:null}
    <div class="lay ${tab!=="print"?"hide":""}">
      <div class="col-l">
        <section class="step">
          <div class="step-h"><span class="num">1</span><div><h3>표기 방식</h3><p>전통 한자가 가장 일반적입니다</p></div></div>
          <div class="seg">${[["hanja","한자"],["dok","한글 독음"],["kor","우리말"]].map(([k,l])=>html`<button class=${mode===k?"on":""} onClick=${()=>setMode(k)}>${l}</button>`)}</div>
        </section>
        <section class="step">
          <div class="step-h"><span class="num">2</span><div><h3>누구의 제사인가요?</h3><p>관계를 고른 뒤 모실 분을 선택하세요</p></div></div>
          <div class="tree">
            <div class="t1">${TREE.map(c=>html`<button class="tcard ${cat===c.id?"on":""}" onClick=${()=>pickCat(c.id)}>${c.label}</button>`)}</div>
            ${catObj?html`<div class="t2"><div class="t2h">${catObj.label} › 어느 분을 모시나요?</div><div class="chips">${catObj.opts.map(([l,ids])=>html`<button class="chip ${sameSel(ids)?"on":""}" onClick=${()=>setSel(ids)}>${l}</button>`)}</div>
              ${forms.length?html`<div class="picked">선택됨: ${forms.map(f=>html`<b>${f.label}</b>`)}${forms.length===1?html`<span class="muted"> · 같은 지방 2장이 인쇄됩니다</span>`:null}</div>`:null}</div>`
            :html`<div class="muted small" style="margin-top:6px">위에서 관계를 먼저 고르세요.</div>`}
            <button class="lnk" style="margin-top:8px" onClick=${()=>setAdv(!adv)}>${adv?"▲ 직접 조합 닫기":"▼ 직접 조합 (다른 관계 두 분을 함께 인쇄)"}</button>
            ${adv?html`<div class="advbox">${FORMS.map(g=>html`<div class="grp"><div class="gl">${g.grp}</div><div class="chips">${g.items.map(it=>html`<button class="chip ${sel.includes(it.id)?"on":""}" onClick=${()=>toggle(it.id)}>${it.label}</button>`)}</div></div>`)}</div>`:null}
          </div>
        </section>
        <section class="step">
          <div class="step-h"><span class="num">3</span><div><h3>내용 입력</h3><p>직함과 본관 성씨를 확인하세요</p></div></div>
          ${hasM?html`<label class="f">남자 직함 <span class="muted">벼슬·직함이 없으면 학생(學生)</span></label><div class="row"><select value=${inp.titleM==="__custom"?"__custom":inp.titleM} onChange=${e=>up("titleM",e.target.value===""?"__custom":e.target.value)}>${TITLES_M.map(([v,l])=>html`<option value=${v===""?"__custom":v}>${l}</option>`)}</select>${inp.titleM==="__custom"?html`<input placeholder="한자 직접 입력" value=${inp.customM} onInput=${e=>up("customM",e.target.value)} />`:null}</div>`:null}
          ${hasF?html`<label class="f">여자 직함 <span class="muted">보통 유인(孺人)</span></label><div class="row"><select value=${inp.titleF==="__custom"?"__custom":inp.titleF} onChange=${e=>up("titleF",e.target.value===""?"__custom":e.target.value)}>${TITLES_F.map(([v,l])=>html`<option value=${v===""?"__custom":v}>${l}</option>`)}</select>${inp.titleF==="__custom"?html`<input placeholder="한자 직접 입력" value=${inp.customF} onInput=${e=>up("customF",e.target.value)} />`:null}</div>`:null}
          ${needClan?html`<label class="f">본관 성씨 <span class="muted">예: 경주김, 밀양박 (한글 → 한자 자동 변환, 한자 직접 입력 가능)</span></label><input value=${inp.clan} placeholder="경주김" onInput=${e=>up("clan",e.target.value)} />
            ${inp.clan?html`<div class="muted small" style="margin-top:4px">변환: <b>${toHanja(inp.clan)}氏</b>${alts.length>1?html` · 다른 한자: ${alts.map(x=>html`<button class="lnk" onClick=${()=>up("clan",x)}>${x}</button>`)}`:null}</div>`:null}`:null}
          ${needName?html`<label class="f">이름 <span class="muted">한자 또는 한글</span></label><input value=${inp.name} placeholder="○○" onInput=${e=>up("name",e.target.value)} />`:null}
          ${!forms.length?html`<div class="note w">위에서 지방 대상을 선택하세요.</div>`:null}
        </section>
        <details class="step fold" open>
          <summary><span class="num ghost"><${Icon} name="printer" size=${15} /></span><div class="grow"><h3>인쇄 설정</h3><p>${pr.w}×${pr.h}mm · ${({brush:"붓글씨",gungsuh:"궁서",serif:"명조",sans:"고딕"})[pr.font]||"붓글씨"} · 한 번 설정하면 저장됩니다</p></div><span class="chev">⌄</span></summary>
          <div class="fold-body">
          <label class="f">글씨체</label>
          <div class="fontpick">${[["brush","붓글씨","해서·붓 (기본)"],["gungsuh","궁서","윈도우 기본 서체"],["serif","명조","바탕체"],["sans","고딕","깔끔한 현대식"]].map(([k,l,d])=>html`<button class="fp ${pr.font===k?"on":""}" onClick=${()=>upP("font",k)}><span class="fp-s ${k}">顯考</span><b>${l}</b><small>${d}</small></button>`)}</div>
          <div class="dd3">
            <div><label class="f">가로 (mm)</label><input type="number" min="30" max="100" value=${pr.w} onInput=${e=>upP("w",+e.target.value||60)} /></div>
            <div><label class="f">세로 (mm)</label><input type="number" min="100" max="280" value=${pr.h} onInput=${e=>upP("h",+e.target.value||220)} /></div>
            <div><label class="f">두 장 간격 (mm)</label><input type="number" min="0" max="90" value=${pr.gap} onInput=${e=>upP("gap",+e.target.value||0)} /></div>
          </div>
          <div class="dd3">
            <div><label class="f">위아래 이동 (mm)</label><input type="number" min="-60" max="60" value=${pr.offsetY} onInput=${e=>upP("offsetY",+e.target.value||0)} /></div>
            <div><label class="f">굵기</label><select value=${pr.bold?"1":"0"} onChange=${e=>upP("bold",e.target.value==="1")}><option value="0">보통</option><option value="1">굵게</option></select></div>
            <div><label class="f"> </label><button class="btn w" onClick=${()=>setPr({...DEF_PRINT})}>기본값으로</button></div>
          </div>
          <div class="sw"><div class="grow"><div class="t">점선 가이드</div><div class="d">오려낼 선을 함께 인쇄합니다</div></div><button class="tog ${pr.guide?"on":""}" onClick=${()=>upP("guide",!pr.guide)}></button></div>
          </div>
        </details>
      </div>
      <div class="col-r">
        <div class="preview-card">
          <div class="pv-h"><h3>미리보기</h3><span>A4 세로 · 실제 비율</span></div>
          <div class="pv-box" ref=${prevRef}>${slots.length?html`<${Sheet} sc=${scale} />`:html`<div class="empty">대상을 선택하면 지방이 표시됩니다</div>`}</div>
          ${slots.length?html`<ul class="pv-list">${slots.map((f,i)=>html`<li><span>${f.label}</span><b class="hanja-t ${pr.font}">${texts[i]}</b></li>`)}</ul>`:null}
          <button class="btn accent w big" onClick=${doPrint}><${Icon} name="printer" size=${18} /> 인쇄 / PDF 저장</button>
          <p class="pv-tip">인쇄 창에서 <b>A4 · 세로 · 여백 없음 · 배율 100%</b></p>
        </div>
      </div>
    </div>
    <div class="print-only"><${Sheet} sc=${96/25.4} /></div>
    <div class="foot">${EMBED?html`<a href=${location.pathname} target="_blank" rel="noopener">전체 화면으로 열기 ↗</a> · `:null}Copyright © <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a> | All Rights Reserved</div>
  </div>`;
}
render(html`<${App} />`, document.getElementById("root"));

</script></body></html>
