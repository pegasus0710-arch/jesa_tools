:root{--paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--ink:#1f2125;--sub:#5b5547;--sub2:#6f6857;--g:#195455;--gh:#12403f;--gl:#e3ecea;--or:#f56d03;--red:#c23a2b;--hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.22);
 --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);--up-s:0 0 0 1px rgba(90,74,50,.1),0 1px 2px rgba(90,74,50,.06);--in:inset 0 0 0 1px rgba(90,74,50,.1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"BJ","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);box-shadow:0 1px 0 var(--hair)}
.badge{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;flex-shrink:0;position:relative}
.badge svg{width:22px;height:22px}
.badge i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--panel)}
.tname{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.tname small{font-weight:600;font-size:12.5px;color:var(--sub2);margin-left:6px}
.priv{margin-left:auto;font-size:13px;color:var(--sub2);font-weight:600;display:flex;align-items:center;gap:6px}
.priv svg{width:16px;height:16px}
@media (max-width:640px){.priv span{display:none}}
.main{max-width:860px;margin:0 auto;padding:18px 16px 30px}
.tabs{display:flex;background:var(--tint);box-shadow:var(--in);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;padding:12px 10px;border-radius:11px;font-weight:700;font-size:15.5px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button svg{width:20px;height:20px}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
.tabs button.on svg{color:var(--g)}
h2.st{font-size:21px;margin:20px 0 4px;letter-spacing:-.4px}
.lead{color:var(--sub);font-size:15px;margin:0 0 14px;line-height:1.6}
.card{background:var(--card);border-radius:14px;box-shadow:var(--up);padding:18px}
.sec{margin-top:14px}
.drop{border-radius:14px;background:var(--tint);box-shadow:inset 0 0 0 2px var(--hair2);padding:28px 16px;text-align:center;cursor:pointer;transition:box-shadow .15s,background .15s}
.drop.ov{box-shadow:inset 0 0 0 2px var(--g);background:var(--gl)}
.drop svg{width:40px;height:40px;color:var(--g)}
.drop b{display:block;font-size:17px;margin:8px 0 4px}
.drop span{font-size:14px;color:var(--sub)}
.lbl{font-weight:800;font-size:15px;margin:0 0 9px}
.lbl em{font-style:normal;font-weight:600;font-size:13px;color:var(--sub2);margin-left:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);font-weight:600;font-size:14.5px}
.chip:hover{background:var(--card)}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g);font-weight:800;background:var(--card)}
.chip.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:7px;vertical-align:2px}
.note{font-size:13.5px;color:var(--sub2);line-height:1.6;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:800;font-size:15.5px;background:var(--card);box-shadow:var(--up-s);text-decoration:none;color:var(--ink)}
.btn:hover{box-shadow:0 0 0 1px var(--g)}
.btn.p{background:var(--g);color:#fff;box-shadow:0 1px 2px rgba(15,55,56,.25)}
.btn.p:hover{background:var(--gh)}
.btn.s{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--up-s);padding:10px 12px}
.row .th{width:56px;height:56px;border-radius:8px;background:var(--tint);flex-shrink:0;overflow:hidden;display:grid;place-items:center}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .th svg{width:24px;height:24px;color:var(--sub2)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:13px;color:var(--sub2)}
.row .nm span.err{color:var(--red);font-weight:700}
.row .nm span.ok{color:var(--g);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--tint);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .2s}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.sum .t{font-size:14.5px;color:var(--sub);font-weight:600}
.sum .t b{color:var(--ink)}
.why{margin-top:18px;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;color:var(--sub)}
.why b{color:var(--ink)}
.enc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-weight:800;font-size:14px;background:var(--gl);color:var(--g)}
.tag.warn{background:#fbe9e6;color:var(--red)}
.pv{overflow:auto;max-height:360px;border-radius:10px;box-shadow:var(--in);background:#fff}
.pv table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.pv th,.pv td{border:1px solid #ece6da;padding:6px 9px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pv th{background:#f3eee5;position:sticky;top:0;font-weight:700;color:var(--sub)}
.pv td.rn,.pv th.rn{color:var(--sub2);background:#f7f3ec;text-align:right;font-weight:600}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.out{text-align:left;background:var(--card);border-radius:12px;box-shadow:var(--up-s);padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.out:hover{box-shadow:0 0 0 1.5px var(--g)}
.out b{font-size:15.5px;display:flex;align-items:center;gap:8px}
.out b svg{width:18px;height:18px;color:var(--g)}
.out span{font-size:13px;color:var(--sub2);line-height:1.5}
.out.rec{box-shadow:0 0 0 1.5px var(--g),var(--up-s)}
.out.rec b::after{content:"추천";font-size:11.5px;font-weight:800;color:#fff;background:var(--g);border-radius:6px;padding:2px 6px;margin-left:2px}
.foot{text-align:center;font-size:12.5px;color:var(--sub2);padding:6px 16px 20px;line-height:1.7}
.foot a{color:var(--g);font-weight:700;text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
/* 블로그 경유 잠금 — 막힘 화면 */
.bj-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f7f6f2;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bj-gate-in{max-width:520px;text-align:center;background:#fff;border:1px solid #e7e5dc;border-radius:20px;padding:36px 30px;box-shadow:0 10px 30px rgba(32,38,58,.08)}
.bj-gate-mark{width:64px;height:64px;border-radius:18px;background:#20263a;color:#fff;font:italic 800 34px/64px Georgia,serif;margin:0 auto 18px;position:relative}
.bj-gate-mark i{position:absolute;right:9px;bottom:10px;width:11px;height:11px;border-radius:50%;background:#e08a3e}
.bj-gate h1{font-size:21px;color:#20241f;margin:0 0 12px;letter-spacing:-.3px}

<script>
/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev) { embedOK = inFrame; return true; }
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();
</script>
<script>
/* ══════════ 파일 변환 v1.0 · Blog J — HEIC → JPG · CSV 한글 깨짐 ══════════ */
const APP_VER = "1.0";
const LIB = "convert-lib/";   /* HEIC 해석(libheif, LGPL-3.0) — 처음 HEIC를 넣을 때만 불러옴 */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SV = (p, c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c || "currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const G = {
  swap: '<path d="M4 8h13M13.5 4.5L17 8l-3.5 3.5"/><path d="M20 16H7M10.5 12.5L7 16l3.5 3.5"/>',
  photo: '<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l4.5-4 3.5 3 3-2.5 5 4"/>',
  sheet: '<path d="M6 3.5h8.5l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7H18"/><path d="M8.5 11.5h7M8.5 14.5h7M8.5 17.5h4M12 11.5v6"/>',
  up: '<path d="M12 15.5V4.5M7.5 9L12 4.5 16.5 9"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/>',
  down: '<path d="M12 4.5v11M7.5 11l4.5 4.5 4.5-4.5"/><path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); }
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB";
const base = n => n.replace(/\.[^.]+$/, "");
const WDN = ["일", "월", "화", "수", "목", "금", "토"], p2 = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
function saveBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
let LS = {}; try { LS = JSON.parse(localStorage.getItem("bj_conv_v1") || "{}"); } catch (e) {}
const S = { tab: "heic", q: LS.q || "m", size: (LS.size in { orig: 1, w2560: 1, w1920: 1, w1280: 1 }) ? LS.size : "orig", meta: LS.meta || "nogps", out: LS.out || "bom", force: "auto", items: [], csv: null, busy: false };
function save() { try { localStorage.setItem("bj_conv_v1", JSON.stringify({ q: S.q, size: S.size, meta: S.meta, out: S.out })); } catch (e) {} }

/* ══════════ 화면 ══════════ */
const QS = { h: ["높게", .92], m: ["보통", .85], l: ["작게", .75] };
const SIZES = { orig: ["원래 크기", 0], w2560: ["긴 쪽 2560", 2560], w1920: ["긴 쪽 1920", 1920], w1280: ["긴 쪽 1280", 1280] };
const METAS = { all: ["모두 그대로", "찍은 날짜 · 카메라 · 위치(GPS)까지 그대로"], nogps: ["위치만 빼기", "찍은 날짜 · 카메라는 남기고 위치(GPS)는 지워요"], none: ["모두 빼기", "찍은 날짜 · 위치 같은 정보를 모두 지워요"] };
const OUTS = { bom: ["엑셀에서 열 파일", "UTF-8 + BOM — 엑셀에서 더블클릭해도 한글이 안 깨져요"], utf8: ["UTF-8 (BOM 없음)", "구글 시트 · 맥 · 프로그램에 올릴 때"], euckr: ["EUC-KR (CP949)", "옛날 프로그램 · 은행 · 관공서 사이트에 올릴 때"] };
function render() {
  const tabs = [["heic", G.photo, "HEIC → JPG"], ["csv", G.sheet, "CSV 한글 깨짐"]].map(([k, ic, n]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${SV(ic)}${n}</button>`).join("");
  $("#root").innerHTML = `<div class="top"><div class="badge">${SV(G.swap, "#fff")}<i></i></div><div class="tname">파일 변환<small>v${APP_VER}</small></div>
    <div class="priv">${SV(G.lock)}<span>파일은 이 컴퓨터 안에서만 바뀌어요</span></div></div>
    <div class="main"><div class="tabs">${tabs}</div>${S.tab === "heic" ? vHeic() : vCsv()}</div>
    <div class="foot">파일은 어디에도 올라가지 않고 이 브라우저 안에서만 바뀌어요 · 설치 · 가입 없는 무료 도구 <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a>${S.tab === "heic" ? `<br>HEIC 해석: libheif(LGPL-3.0) — <a href="${LIB}LICENSE-libheif.txt" target="_blank" rel="noopener">사용 허락</a>` : ""}</div>`;
  bindDrop();
}
const chipRow = (obj, cur, attr) => `<div class="chips">${Object.entries(obj).map(([k, v]) => `<button class="chip${String(cur) === k ? " on" : ""}" data-${attr}="${k}">${v[0]}</button>`).join("")}</div>`;

function vHeic() {
  const it = S.items, done = it.filter(x => x.out).length, bad = it.filter(x => x.err).length;
  return `<h2 class="st">아이폰 HEIC 사진을 JPG로</h2><p class="lead">여러 장을 한 번에 넣어도 돼요. 바뀐 JPG는 한 장씩 또는 한꺼번에(zip) 받아요.</p>
  <div class="card"><div class="drop" id="drop" data-pick="heic">${SV(G.up)}<b>HEIC 사진 끌어다 놓기</b><span>또는 눌러서 고르기 · .heic · .heif · 여러 장 가능</span></div>
    <input type="file" id="fi" accept=".heic,.heif,image/heic,image/heif" multiple hidden>
    <div class="opts sec">
      <div><div class="lbl">JPG 화질</div>${chipRow(QS, S.q, "q")}</div>
      <div><div class="lbl">크기</div>${chipRow(SIZES, S.size, "size")}</div>
      <div style="grid-column:1/-1"><div class="lbl">찍은 날짜 · 위치 정보</div>${chipRow(METAS, S.meta, "meta")}<p class="note">${METAS[S.meta][1]}.${S.meta === "all" ? " 블로그 · 중고 거래에 올릴 사진이면 「위치만 빼기」를 추천해요." : ""}</p></div>
    </div></div>
  ${it.length ? `<div class="sum"><span class="t"><b>${it.length}장</b> 중 <b>${done}장</b> 바꿈${bad ? ` · <span style="color:var(--red)">${bad}장 실패</span>` : ""}</span>
    <div class="acts"><button class="btn s" data-a="clear">${SV(G.x)} 목록 비우기</button><button class="btn p" data-a="zip"${done ? "" : " disabled"}>${SV(G.down)} ${done > 1 ? `모두 받기 (zip · ${done}장)` : "받기"}</button></div></div>
    <div class="bar${S.busy ? "" : " hide"}"><i id="pb"></i></div>
    <div class="list">${it.map((x, i) => `<div class="row"><div class="th">${x.thumb ? `<img src="${x.thumb}" alt="">` : SV(G.photo)}</div>
      <div class="nm"><b>${esc(x.f.name)}</b><span class="${x.err ? "err" : x.out ? "ok" : ""}">${x.err ? esc(x.err) : x.out ? `${kb(x.f.size)} → JPG ${kb(x.out.size)} · ${x.w}×${x.h}` : x.run ? "바꾸는 중…" : `${kb(x.f.size)} · 기다리는 중`}</span></div>
      ${x.out ? `<button class="btn s" data-dl="${i}">${SV(G.down)} 받기</button>` : ""}</div>`).join("")}</div>` : ""}
  <div class="why"><b>HEIC가 뭔가요?</b> 아이폰이 사진을 작게 저장하는 방식이에요. 윈도우 · 관공서 · 쇼핑몰 사이트에서 안 열리거나 올라가지 않을 때 JPG로 바꾸면 돼요.<br>
  <b>화질 · 크기</b> 「보통 · 원래 크기」면 눈으로 차이가 거의 없어요. 메일 · 카톡으로 보낼 사진이면 「긴 쪽 1920」이 가볍습니다.<br>
  <b>바꾼 사진에서는</b> 사진 방향이 바로잡혀 들어가요. 아이폰의 라이브 포토 움직임 · 깊이 정보는 JPG에 들어가지 않아요.</div>`;
}
function vCsv() {
  const c = S.csv;
  return `<h2 class="st">엑셀에서 한글이 깨지는 CSV 고치기</h2><p class="lead">CSV 파일을 넣으면 글자 방식을 알아내고, 엑셀 · 구글 시트 · 옛 프로그램에 맞는 파일로 다시 저장해요.</p>
  <div class="card"><div class="drop" id="drop" data-pick="csv">${SV(G.up)}<b>CSV · TXT 파일 끌어다 놓기</b><span>또는 눌러서 고르기 · 한 번에 한 파일</span></div>
    <input type="file" id="fi" accept=".csv,.txt,.tsv,text/csv,text/plain" hidden></div>
  ${c ? `<div class="card sec"><div class="enc"><b style="font-size:16px">${esc(c.name)}</b><span class="tag${c.det === "UTF-8 (BOM 없음)" || c.det === "EUC-KR (CP949)" ? " warn" : ""}">${esc(c.det)}</span>
      <span class="note" style="margin:0">${c.rows.length.toLocaleString()}줄 · ${c.cols}칸 · ${kb(c.size)}</span></div>
    <p class="note" style="margin:0 0 10px">${c.why}</p>
    <div class="lbl">미리보기 <em>글자가 이상하면 아래에서 읽는 방식을 바꿔 보세요</em></div>
    <div class="chips" style="margin-bottom:10px">${[["auto", "자동"], ["utf8", "UTF-8로 읽기"], ["euckr", "EUC-KR로 읽기"]].map(([k, n]) => `<button class="chip${S.force === k ? " on" : ""}" data-force="${k}">${n}</button>`).join("")}</div>
    <div class="pv"><table><thead><tr><th class="rn"></th>${Array.from({ length: c.cols }, (_, i) => `<th>${colName(i)}</th>`).join("")}</tr></thead><tbody>${c.rows.slice(0, 50).map((r, i) => `<tr><td class="rn num">${i + 1}</td>${Array.from({ length: c.cols }, (_, k) => `<td>${esc(r[k] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${c.rows.length > 50 ? `<p class="note">앞의 50줄만 보여요. 받는 파일에는 ${c.rows.length.toLocaleString()}줄이 모두 들어가요.</p>` : ""}</div>
  <div class="card sec"><div class="lbl">어떤 파일로 받을까요?</div>
    <div class="outs">${Object.entries(OUTS).map(([k, v]) => `<button class="out${k === "bom" ? " rec" : ""}" data-out="${k}"><b>${SV(G.down)}${v[0]}</b><span>${v[1]}</span></button>`).join("")}</div>
    <p class="note">원래 파일은 그대로 두고, 이름 뒤에 「_엑셀용」 · 「_UTF8」 · 「_EUCKR」을 붙인 새 파일로 받아요.</p></div>` : ""}
  <div class="why"><b>왜 깨지나요?</b> 한글을 저장하는 방식이 두 가지(UTF-8 · EUC-KR)라서예요. 엑셀은 CSV를 열 때 앞머리 표시(BOM)가 없으면 옛 방식으로 읽어서, UTF-8 파일의 한글이 「ê¸°ì」처럼 깨져요.<br>
  <b>반대로</b> 은행 · 관공서에서 받은 EUC-KR 파일을 구글 시트나 맥에서 열면 「����」처럼 깨져요. 이럴 때는 「UTF-8」로 받으면 돼요.</div>`;
}
const colName = i => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCodePoint(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

/* ══════════ 파일 넣기 ══════════ */
function bindDrop() {
  const d = $("#drop"), fi = $("#fi"); if (!d) return;
  d.onclick = () => fi.click();
