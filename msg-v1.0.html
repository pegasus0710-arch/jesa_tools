<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="only light">
<title>문자 · 인사말 만들기 | Blog J</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{--paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--ink:#1f2125;--sub:#5b5547;--sub2:#6f6857;--g:#195455;--gh:#12403f;--gl:#e3ecea;--or:#f56d03;--red:#c23a2b;--hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.22);
 --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);--up-s:0 0 0 1px rgba(90,74,50,.1),0 1px 2px rgba(90,74,50,.06);--in:inset 0 0 0 1px rgba(90,74,50,.1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"SUIT Variable","SUIT","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);box-shadow:0 1px 0 var(--hair);position:sticky;top:0;z-index:20}
.badge{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;flex-shrink:0;position:relative;color:#fff}
.badge svg{width:21px;height:21px}
.badge i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--panel)}
.tname{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.tname small{font-weight:600;font-size:12.5px;color:var(--sub2);margin-left:6px}
.priv{margin-left:auto;font-size:13px;color:var(--sub2);font-weight:600;display:flex;align-items:center;gap:6px}
.priv svg{width:16px;height:16px}
.back{display:none;width:36px;height:36px;border-radius:10px;place-items:center;flex-shrink:0}
.back svg{width:22px;height:22px}
.wrap{max-width:1360px;margin:0 auto;padding:16px;display:grid;grid-template-columns:330px minmax(0,1fr) 380px;gap:16px;align-items:start}
.pane{background:var(--card);border-radius:16px;box-shadow:var(--up);min-width:0}
.pick{padding:14px;position:sticky;top:70px;max-height:calc(100vh - 86px);display:flex;flex-direction:column}
.find{position:relative;margin-bottom:10px}
.find input{width:100%;padding:11px 12px 11px 38px;border-radius:12px;border:0;background:var(--tint);box-shadow:var(--in);font-size:15px;outline:none}
.find input:focus{box-shadow:inset 0 0 0 2px var(--g)}
.find svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--sub2)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat{padding:7px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);font-weight:600;font-size:13.5px;white-space:nowrap}
.cat:hover{background:var(--panel)}
.cat.on{background:var(--g);color:#fff;box-shadow:none;font-weight:800}
.list{overflow:auto;margin:0 -4px;padding:0 4px;flex:1}
.grp{font-size:12.5px;font-weight:800;color:var(--sub2);margin:12px 4px 6px;letter-spacing:.2px}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;border-radius:12px;margin-bottom:2px}
.it:hover{background:var(--panel)}
.it.on{background:var(--gl);box-shadow:inset 0 0 0 1.5px var(--g)}
.it .ic{width:34px;height:34px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex-shrink:0;color:var(--g)}
.it .ic svg{width:19px;height:19px}
.it b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.it span{display:block;font-size:13px;color:var(--sub2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx{min-width:0;flex:1}
.star{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#c8bba5;flex-shrink:0}
.star svg{width:18px;height:18px}
.star.on{color:var(--or)}
.edit{padding:18px 20px}
.edit h2{margin:0;font-size:22px;letter-spacing:-.5px}
.edit .lead{margin:4px 0 14px;color:var(--sub);font-size:14.5px}
.seg{display:flex;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--g);font-weight:800;box-shadow:0 0 0 1px rgba(90,74,50,.12),0 1px 3px rgba(90,74,50,.12)}
.lbl{font-weight:800;font-size:13.5px;color:var(--sub);margin:0 0 6px}
.fs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{min-width:0}
.f.wide{grid-column:1/-1}
.f label{display:block;font-size:13.5px;font-weight:800;color:var(--sub);margin-bottom:5px}
.f label em{font-style:normal;font-weight:600;color:var(--sub2);font-size:12.5px;margin-left:4px}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair2);font-size:15.5px;outline:none;min-height:44px}
.inp:focus{box-shadow:inset 0 0 0 2px var(--g);background:#fff}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub2) 50%),linear-gradient(135deg,var(--sub2) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.dwrap{position:relative}
.dwrap .shown{pointer-events:none}
.dwrap input[type=date],.dwrap input[type=time]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dwrap .shown.empty{color:#a39a88}
.hint{font-size:12.5px;color:var(--sub2);margin-top:4px;line-height:1.5}
.sug{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sug button{font-size:12.5px;padding:4px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);color:var(--sub);font-weight:600}
.sug button:hover{color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.tg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair2);cursor:pointer;user-select:none}
.tg .sw{width:40px;height:24px;border-radius:999px;background:#d6ccbb;position:relative;flex-shrink:0;transition:background .15s}
.tg .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg.on .sw{background:var(--g)}
.tg.on .sw::after{left:19px}
.tg b{font-size:14.5px;font-weight:800}
.tg span{font-size:12.5px;color:var(--sub2)}
.sub3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:8px}
.memo{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--gl);font-size:13.5px;color:var(--gh);line-height:1.6}
.memo b{font-weight:800}
.prev{position:sticky;top:70px;padding:16px}
.phone{background:#e9e1d3;border-radius:20px;padding:14px;box-shadow:var(--in)}
.phead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--sub2);margin-bottom:10px}
.phead i{width:8px;height:8px;border-radius:50%;background:var(--g)}
.bub{background:#fff;border-radius:4px 16px 16px 16px;padding:13px 14px;font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;box-shadow:0 1px 2px rgba(90,74,50,.12);max-height:52vh;overflow:auto;outline:none}
.bub:focus{box-shadow:0 0 0 2px var(--g)}
.bub .ph{color:#b9ae9a}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub2);margin:8px 2px 0}
.meta .k{font-weight:800;color:var(--g)}
.edited{font-size:12.5px;color:var(--or);font-weight:700;margin-top:6px;display:flex;gap:8px;align-items:center}
.edited button{color:var(--g);font-weight:800;text-decoration:underline}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 10px;border-radius:12px;font-weight:800;font-size:15px;box-shadow:var(--up-s);background:var(--card);min-height:46px}
.btn svg{width:18px;height:18px}
.btn:hover{box-shadow:0 0 0 1.5px var(--g)}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--g);color:#fff;box-shadow:none}
.btn.go:hover{background:var(--gh)}
.btn.full{grid-column:1/-1}
.cardbox{margin-top:12px}
.cardbox img{width:100%;border-radius:12px;box-shadow:var(--up-s);display:block}
.foot{text-align:center;font-size:12.5px;color:var(--sub2);padding:20px 16px 40px;line-height:1.7}
.foot a{color:var(--g);font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2125;color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:700;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 20px;text-align:center;color:var(--sub2)}
.mbar{display:none}
@media (max-width:1180px){.wrap{grid-template-columns:300px minmax(0,1fr)}.prev{grid-column:2;position:static}}
@media (max-width:760px){
 .priv span{display:none}
 .wrap{grid-template-columns:1fr;padding:12px 12px 96px;gap:12px}
 .pick{position:static;max-height:none}
 .cats{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 10px;padding:0 14px 2px;scrollbar-width:none}
 .cats::-webkit-scrollbar{display:none}
 body.m-pick .edit,body.m-pick .prev{display:none}
 body.m-edit .pick{display:none}
 body.m-edit .back{display:grid}
 .edit{padding:16px}
 .fs{grid-template-columns:1fr}
 .prev{grid-column:auto;order:1}
 .edit{order:2}
 .sub3{grid-template-columns:1fr 1fr}
 .sub3 [data-k=acc_no]{grid-column:1/-1;order:3}
 .bub{max-height:none}
 .prev .acts [data-act=copy],.prev .acts [data-act=share]{display:none}
 .prev .acts{grid-template-columns:1fr}
 body.m-edit .mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);box-shadow:0 -1px 0 var(--hair),0 -8px 20px -12px rgba(90,74,50,.3);z-index:30}
 .toast{bottom:90px}
}
</style>
</head>
<body class="m-pick">
<div class="top">
  <button class="back" id="back" aria-label="상황 고르기로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg><i></i></div>
  <div class="tname">문자 · 인사말 만들기<small>Blog J</small></div>
  <div class="priv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>적은 내용은 이 기기에만 · 보내지 않아요</span></div>
</div>
<div class="wrap">
  <section class="pane pick" id="pick"></section>
  <section class="pane edit" id="edit"></section>
  <section class="pane prev" id="prev"></section>
</div>
<div class="mbar" id="mbar"></div>
<div class="foot">문장은 Blog J가 직접 쓴 예시예요. 집안 · 모임마다 쓰는 말이 다를 수 있으니 보내기 전에 한 번 읽어 보세요.<br>날짜 · 49재 · 발인 계산은 참고용이에요. · <a href="https://luvbong.tistory.com" target="_blank" rel="noopener">Blog J 무료 도구</a></div>
<div class="toast" id="toast"></div>
<script>/* ── 문자 · 인사말 만들기 — 상황별 문장 (모든 문장은 Blog J가 직접 씀) ──
   gen(v, k): v = 칸 값, k = 말투(0 정중하게 · 1 다정하게 · 2 짧게) */
const CATS = [
  { id: "event", n: "경조사 알림" }, { id: "congrats", n: "축하" }, { id: "condole", n: "위로 · 조문" },
  { id: "thanks", n: "감사 · 답례" }, { id: "season", n: "명절 · 계절 인사" }, { id: "group", n: "모임 · 단체 공지" },
  { id: "sorry", n: "사과 · 거절" }, { id: "life", n: "생활 · 이웃" }, { id: "school", n: "학교 · 학원" },
  { id: "home", n: "집 · 계약" }, { id: "work", n: "일 · 직장" }
];
const BR = "\n";
const P = (k, a, b, c) => [a, b, c][k];
const L = (...a) => a.filter(x => x !== null && x !== undefined && x !== false && x !== "").join("\n");
const W = (s, w) => (s ? w(s) : "");
const TO = (v, def) => (v.to || def || "");
const NM = v => v.from || "";
const TOC = v => (v.to ? v.to + ", " : "");
const TOS = v => (v.to ? v.to + " " : "");
const RELW = r => ({ "부친": "아버지", "모친": "어머니", "조부": "할아버지", "조모": "할머니", "장인": "장인어른", "장모": "장모님", "시부": "시아버지", "시모": "시어머니" }[r] || r);
const JS = (w, a, b) => { const c = (w || "").charCodeAt((w || "").length - 1); return w + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? a : b); };
const SIGN = (v, k) => (v.from ? (k === 2 ? "- " + v.from : "\n" + v.from + " 드림") : "");
/* 11-10: 날짜 계산 도우미(달 더하기 — 없는 날은 그달 마지막 날로) · 오늘 · 평일 수 */
const AM = (s, n) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); if (!m) return ""; const y = +m[1], mo = +m[2] - 1 + n, d = +m[3]; const last = new Date(y, mo + 1, 0).getDate(); const r = new Date(y, mo, Math.min(d, last)); return `${r.getFullYear()}-${String(r.getMonth() + 1).padStart(2, "0")}-${String(r.getDate()).padStart(2, "0")}`; };
const TODAY = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
const DAYS = (a, b) => { const p = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }; return Math.round((p(b) - p(a)) / 864e5); };
const WEEKDAYS = (a, b) => { const n = DAYS(a, b); if (!(n >= 0)) return 0; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(a); let c = 0; for (let i = 0; i <= n; i++) { const w = new Date(+m[1], +m[2] - 1, +m[3] + i).getDay(); if (w && w < 6) c++; } return c; };
const NUM = s => { const n = parseInt(String(s || "").replace(/[^\d]/g, ""), 10); return isNaN(n) ? 0 : n; };
/* 11-10: 학원 · 과외 교습비 반환 계산(학원법 시행령 반환 기준, 한 달 이내 과정) */
const ACADREF = v => { const fee = NUM(v.fee), tot = NUM(v.tot), done = NUM(v.done); if (!fee || !tot || done > tot) return null; let r, lab; if (done === 0) { r = 1; lab = "수업 시작 전 — 낸 돈 전부"; } else if (done / tot < 1 / 3) { r = 2 / 3; lab = "1/3이 지나기 전 — 2/3"; } else if (done / tot < 1 / 2) { r = 1 / 2; lab = "1/2이 지나기 전 — 1/2"; } else { r = 0; lab = "1/2이 지남 — 돌려받지 못함"; } const amt = Math.floor(fee * r); return { fee, tot, done, amt, txt: `${tot}회 중 ${done}회 들음 → ${lab} = ${amt ? MONEY(amt) + "원" : "0원"} (교습비 ${MONEY(fee)}원 기준, 원 단위 버림)` }; };
const SIGN2 = (v, k) => (v.from ? (k === 0 ? "\n" + v.from + " 올림" : k === 1 ? "\n" + v.from + " 드림" : "- " + v.from) : "");

/* 칸 꼴: t 글자 · date 날짜 · time 시각 · sel 고르기 · money 금액 · area 여러 줄 · acc 계좌(켜고 끄기) · map 지도 링크 */
const TPL = [
/* ───────── 경조사 알림 ───────── */
{ id: "obit", cat: "event", t: "부고 알림", d: "빈소 · 발인 · 장지를 한 번에", card: true, f: [
  { k: "chief", l: "상주(보내는 사람)", ph: "홍길동" },
  { k: "rel", l: "고인과의 관계", type: "sel", o: ["부친", "모친", "조부", "조모", "장인", "장모", "시부", "시모", "배우자", "형", "누나", "오빠", "언니", "동생"], def: "부친" },
  { k: "dname", l: "고인 이름", ph: "홍판서" },
  { k: "died", l: "별세한 날", type: "date" },
  { k: "hall", l: "빈소", ph: "○○병원 장례식장 3호실" },
  { k: "fdate", l: "발인 날", type: "date", auto: "died+2", hint: "별세한 날을 넣으면 3일장(+2일)으로 저절로 — 고칠 수 있어요" },
  { k: "ftime", l: "발인 시각", type: "time", def: "07:00" },
  { k: "burial", l: "장지", ph: "○○추모공원", opt: 1 },
  { k: "acc", l: "마음 전하실 곳(계좌)", type: "acc" },
  { k: "map", l: "빈소 지도 링크", type: "map" }],
  gen: (v, k) => L(
    P(k, "[부고]", "[부고] 슬픈 소식을 전합니다", "[부고]"),
    P(k, `${v.chief || "○○○"}의 ${v.rel} ${v.dname || "○○○"}님께서 ${D(v.died)} 별세하셨기에 삼가 알려 드립니다.`,
         `저희 ${RELW(v.rel)}께서 ${D(v.died)} 세상을 떠나셨습니다.\n갑작스러운 소식을 전하게 되어 마음이 무겁습니다.`,
         `${v.chief || "○○○"} ${v.rel} ${v.dname || "○○○"}님 별세(${D(v.died)})`),
    BR,
    W(v.hall, s => `빈소: ${s}`),
    `발인: ${D(v.fdate)}${v.ftime ? " " + TM(v.ftime) : ""}`,
    W(v.burial, s => `장지: ${s}`),
    k !== 2 ? `상주: ${v.chief || "○○○"}` : "",
    ACC(v, "마음 전하실 곳"), MAP(v, "오시는 길"),

function field(t, f, v) {
  const id = "f_" + f.k, val = v[f.k] == null ? "" : v[f.k];
  const lab = `<label for="${id}">${f.l}${f.opt ? "<em>비워도 돼요</em>" : ""}</label>`;
  if (f.type === "sel") return `<div class="f">${lab}<select class="inp" id="${id}" data-k="${f.k}">${f.o.map(o => `<option${o === val ? " selected" : ""}>${o}</option>`).join("")}</select></div>`;
  if (f.type === "date") return `<div class="f">${lab}<div class="dwrap"><div class="inp shown num${val ? "" : " empty"}">${val ? D(val) : "날짜 고르기"}</div><input type="date" id="${id}" data-k="${f.k}" value="${esc(val)}"></div>${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div>`;
  if (f.type === "time") return `<div class="f">${lab}<div class="dwrap"><div class="inp shown num${val ? "" : " empty"}">${val ? TM(val) : "시각 고르기"}</div><input type="time" id="${id}" data-k="${f.k}" value="${esc(val)}" step="600"></div></div>`;
  if (f.type === "money") return `<div class="f">${lab}<input class="inp num" id="${id}" data-k="${f.k}" data-money inputmode="numeric" placeholder="30,000" value="${esc(MONEY(val))}"></div>`;
  if (f.type === "acc") return `<div class="f wide"><div class="tg${v.acc_on ? " on" : ""}" data-tg="acc_on"><span class="sw"></span><span><b>${f.l}</b><br><span>${v.acc_on ? "문자에 넣어요 · 이 기기에 기억" : "켜면 계좌 줄이 들어가요"}</span></span></div>${v.acc_on ? `<div class="sub3"><input class="inp" data-k="acc_bank" placeholder="은행" value="${esc(v.acc_bank || "")}"><input class="inp num" data-k="acc_no" inputmode="numeric" placeholder="계좌 번호" value="${esc(v.acc_no || "")}"><input class="inp" data-k="acc_name" placeholder="예금주" value="${esc(v.acc_name || "")}"></div>` : ""}</div>`;
  if (f.type === "map") return `<div class="f wide">${lab.replace("</label>", "<em>비워도 돼요</em></label>")}<input class="inp" id="${id}" data-k="${f.k}" inputmode="url" placeholder="네이버 · 카카오 · 구글 지도에서 「공유 → 링크 복사」한 주소" value="${esc(val)}"></div>`;
  return `<div class="f${f.wide ? " wide" : ""}">${lab}<input class="inp" id="${id}" data-k="${f.k}" placeholder="${esc(f.ph || "")}" value="${esc(val)}" autocomplete="off">${f.sug ? `<div class="sug">${f.sug.map(s => `<button data-sug="${f.k}">${s}</button>`).join("")}</div>` : ""}</div>`;
}
/* 11-10: 상황마다 알아 두세요 · 계산 — 칸을 칠 때마다 이 부분만 다시 씀(칸은 다시 그리지 않음) */
function memoHtml(t, v) {
  let h = "";
  if (t.memo) { const m = t.memo(v); if (m) h += `<div class="memo num">${m}</div>`; }
  if (t.id === "obit" && v.died) h += `<div class="memo num"><b>함께 보는 날</b> — 삼우제 ${D(addDays(v.fdate || addDays(v.died, 2), 2))} · 49재 ${D(addDays(v.died, 48))}<br>삼우제는 발인 날을 1일째로 센 3일째, 49재는 별세한 날을 1일째로 센 49일째예요(집안마다 다를 수 있어요).</div>`;
  return h.replace(/(\d{4}-\d{2}-\d{2}\([^)]\))/g, '<span style="white-space:nowrap">$1</span>');
}
function drawEdit() {
  const t = tplOf(S.id), v = valsFor(t), cat = CATS.find(c => c.id === t.cat).n;
  let h = `<div class="lbl">${cat}</div><h2>${t.t}</h2><p class="lead">${t.d}</p>`;
  h += `<div class="lbl">말투</div><div class="seg">${["정중하게", "다정하게", "짧게"].map((n, i) => `<button class="${S.tone === i ? "on" : ""}" data-tone="${i}">${n}</button>`).join("")}</div>`;
  h += `<div class="fs">${t.f.map(f => field(t, f, v)).join("")}</div>`;
  h += `<div id="emem">${memoHtml(t, v)}</div>`;
  $("#edit").innerHTML = h;
}

/* ── 오른쪽: 미리보기 · 보내기 ── */
function curText() { const t = tplOf(S.id); return t.gen(valsFor(t), S.tone).replace(/\n{3,}/g, "\n\n").trim(); }
function drawPrev() {
  const t = tplOf(S.id), auto = curText(), txt = S.custom != null ? S.custom : auto, b = bytes(txt);
  const kind = b <= 90 ? "단문(SMS)" : b <= 2000 ? "장문(LMS)" : "너무 길어요";
  let h = `<div class="lbl">미리보기 — 눌러서 직접 고칠 수 있어요</div><div class="phone"><div class="phead"><i></i>보낼 문자</div><div class="bub" id="bub" data-ks="bub" contenteditable="plaintext-only" spellcheck="false">${esc(txt)}</div></div>`;
  h += `<div class="meta num"><span>${[...txt].length.toLocaleString()}자 · ${b.toLocaleString()}바이트</span><span class="k">${kind}</span></div>`;
  if (S.custom != null) h += `<div class="edited">직접 고친 글이에요 <button data-reset>칸 내용으로 되돌리기</button></div>`;
  const acts = `<button class="btn go" data-act="copy">${svg(IC.copy)}복사하기</button><button class="btn" data-act="share">${svg(IC.share)}보내기</button>${t.card ? `<button class="btn full" data-act="card">${svg(IC.img)}카드 이미지로 만들기</button>` : ""}`;
  h += `<div class="acts">${acts}</div>`;
  if (S.card && S.card.id === S.id) h += `<div class="cardbox"><img src="${S.card.url}" alt="카드 이미지 미리보기"><div class="acts"><button class="btn go full" data-act="savecard">${svg(IC.img)}이미지 저장 · 보내기</button></div></div>`;
  $("#prev").innerHTML = h;
  $("#mbar").innerHTML = `<button class="btn go" data-act="copy">${svg(IC.copy)}복사하기</button><button class="btn" data-act="share">${svg(IC.share)}보내기</button>`;
  const bub = $("#bub"); if (bub.contentEditable !== "plaintext-only") bub.contentEditable = "true";
  bub.oninput = () => { S.custom = bub.innerText.replace(/ /g, " "); const bb = bytes(S.custom); $("#prev .meta").innerHTML = `<span>${[...S.custom].length.toLocaleString()}자 · ${bb.toLocaleString()}바이트</span><span class="k">${bb <= 90 ? "단문(SMS)" : bb <= 2000 ? "장문(LMS)" : "너무 길어요"}</span>`; if (!$("#prev .edited")) { const e = document.createElement("div"); e.className = "edited"; e.innerHTML = `직접 고친 글이에요 <button data-reset>칸 내용으로 되돌리기</button>`; $("#prev .meta").after(e); } };
}
/* 11-09 스크롤 지키기(공통 규칙): 화면 일부를 다시 그려도 창 · 안쪽 스크롤 칸([data-ks])의 자리를 그대로 둠 */
const MOB = () => matchMedia("(max-width:760px)").matches;
function keep(fn) { const y = scrollY, m = [...document.querySelectorAll("[data-ks]")].map(e => [e.dataset.ks, e.scrollTop, e.scrollLeft]); fn(); for (const [k, t, l] of m) { const e = document.querySelector(`[data-ks="${k}"]`); if (e) { e.scrollTop = t; e.scrollLeft = l; } } if (Math.abs(scrollY - y) > 1) scrollTo(0, y); }
/* 휴대폰: 목록 → 고치기로 갈 때 목록 자리를 적어 두고, 돌아오면 그 자리로 */
function backToPick() { S.mob = "pick"; render(); requestAnimationFrame(() => scrollTo(0, S.pickY || 0)); }
function render() { document.body.className = S.mob === "edit" ? "m-edit" : "m-pick"; drawPick(); drawEdit(); drawPrev(); }
const refresh = () => { S.custom = null; S.card = null; keep(() => { drawEdit(); drawPrev(); }); };

/* ── 카드 이미지(직접 그림) ── */
async function makeCard() {
  const t = tplOf(S.id), txt = S.custom != null ? S.custom : curText();
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, c = document.createElement("canvas"); const x = c.getContext("2d");
  const F = (w, s) => `${w} ${s}px "SUIT Variable","SUIT","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
  const lines = txt.split("\n"); const title = lines[0].replace(/^\[|\]$/g, ""); const body = lines.slice(1).join("\n").trim();
  x.font = F(500, 40); const wrapL = []; for (const para of body.split("\n")) { if (!para) { wrapL.push(""); continue; } let cur = ""; for (const ch of para) { if (x.measureText(cur + ch).width > W - 220) { wrapL.push(cur); cur = ch; } else cur += ch; } wrapL.push(cur); }
  const H = Math.max(1080, 360 + wrapL.length * 62 + 180); c.width = W; c.height = H;
  const mourn = ["obit", "jae49", "tcondo"].includes(t.id);
  x.fillStyle = "#f0e8db"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#fcf9f4"; x.beginPath(); x.roundRect(60, 60, W - 120, H - 120, 36); x.fill();
  x.strokeStyle = mourn ? "#3a3a3a" : "#195455"; x.lineWidth = 3; x.beginPath(); x.roundRect(84, 84, W - 168, H - 168, 26); x.stroke();
  x.strokeStyle = "rgba(90,74,50,.25)"; x.lineWidth = 1.5; x.beginPath(); x.roundRect(96, 96, W - 192, H - 192, 20); x.stroke();
  /* 머리 그림: 부고 = 국화 선 그림 · 그 밖 = 매듭 선 */
  x.save(); x.translate(W / 2, 190); x.strokeStyle = mourn ? "#3a3a3a" : "#195455"; x.lineWidth = 3; x.lineCap = "round";
  if (mourn) { for (let i = 0; i < 12; i++) { x.save(); x.rotate(i * Math.PI / 6); x.beginPath(); x.ellipse(0, -26, 9, 22, 0, 0, Math.PI * 2); x.stroke(); x.restore(); } x.beginPath(); x.arc(0, 0, 9, 0, Math.PI * 2); x.stroke(); }
  else { x.beginPath(); x.moveTo(-90, 0); x.lineTo(-24, 0); x.moveTo(24, 0); x.lineTo(90, 0); x.stroke(); x.beginPath(); x.arc(0, 0, 18, 0, Math.PI * 2); x.stroke(); x.fillStyle = "#f56d03"; x.beginPath(); x.arc(0, 0, 6, 0, Math.PI * 2); x.fill(); }
  x.restore();
  x.fillStyle = "#1f2125"; x.textAlign = "center"; x.font = F(800, 56); x.fillText(title, W / 2, 300);
  x.textAlign = "left"; let y = 390;
  for (const l of wrapL) { if (!l) { y += 30; continue; } const m = /^([^:：]{1,12})[:：]\s*(.*)$/.exec(l); if (m && !/https?$/.test(m[1])) { x.font = F(800, 38); x.fillStyle = mourn ? "#3a3a3a" : "#195455"; x.fillText(m[1], 130, y); const lw = x.measureText(m[1] + "  ").width; x.font = F(500, 40); x.fillStyle = "#1f2125"; x.fillText(m[2], 130 + lw, y); } else { x.font = F(500, 40); x.fillStyle = "#1f2125"; x.fillText(l, 130, y); } y += 62; }
  x.textAlign = "center"; x.font = F(600, 24); x.fillStyle = "#8a8170"; x.fillText("Blog J 문자 · 인사말 만들기", W / 2, H - 112);
  return new Promise(r => c.toBlob(b => r(b), "image/png"));
}

/* ── 이벤트 ── */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-cat],[data-id],[data-fav],[data-tone],[data-tg],[data-sug],[data-act],[data-reset],#back");
  if (!el) return;
  if (el.dataset.fav) { e.stopPropagation(); const i = S.fav.indexOf(el.dataset.fav); i >= 0 ? S.fav.splice(i, 1) : S.fav.push(el.dataset.fav); ls.set("fav", S.fav); toast(i >= 0 ? "자주 쓰는 것에서 뺐어요" : "자주 쓰는 것에 넣었어요"); return keep(drawPick); }
  if (el.dataset.cat) { S.cat = el.dataset.cat; S.q = ""; ls.set("cat", S.cat); keep(drawPick); const l = $(".list"); if (l) l.scrollTop = 0; return; }
  if (el.dataset.id) { S.id = el.dataset.id; ls.set("last", S.id); S.custom = null; S.card = null;
    if (!MOB()) { S.mob = "edit"; return keep(render); }   /* PC: 목록 자리 그대로 */
    S.pickY = scrollY; S.mob = "edit"; try { history.pushState({ m: "edit" }, ""); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  if (el.id === "back") { history.length > 1 && history.state && history.state.m === "edit" ? history.back() : backToPick(); return; }
  if (el.dataset.tone) { S.tone = +el.dataset.tone; ls.set("tone", S.tone); return refresh(); }
  if (el.dataset.tg) { const t = tplOf(S.id), v = valsFor(t); saveVal(t, el.dataset.tg, !v[el.dataset.tg]); return refresh(); }
  if (el.dataset.sug) { const t = tplOf(S.id); saveVal(t, el.dataset.sug, el.textContent); return refresh(); }
  if (el.hasAttribute("data-reset")) { return refresh(); }
  const act = el.dataset.act, txt = S.custom != null ? S.custom : curText();
  if (act === "copy") { try { await navigator.clipboard.writeText(txt); } catch (er) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove(); } toast("복사했어요 — 카톡 · 문자에 붙여 넣으세요"); }
  if (act === "share") { if (navigator.share) { try { await navigator.share({ text: txt }); } catch (er) {} } else { try { await navigator.clipboard.writeText(txt); } catch (er) {} toast("이 브라우저는 바로 보내기가 안 돼서 복사했어요"); } }
  if (act === "card") { el.disabled = true; const b = await makeCard(); S.card = { id: S.id, blob: b, url: URL.createObjectURL(b) }; keep(drawPrev); const img = $("#prev .cardbox"); img && img.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  if (act === "savecard" && S.card) { const name = `${tplOf(S.id).t.replace(/[^\w가-힣]+/g, "_")}_${ymd(new Date())}.png`; const file = new File([S.card.blob], name, { type: "image/png" }); if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (er) { if (er.name === "AbortError") return; } } const a = document.createElement("a"); a.href = S.card.url; a.download = name; a.click(); toast("이미지를 저장했어요"); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".it")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.k || !el.closest("#edit")) return;
  const t = tplOf(S.id), k = el.dataset.k;
  if (el.hasAttribute("data-money")) { const raw = el.value.replace(/[^\d]/g, ""); const pos = el.value.length - el.selectionStart; el.value = MONEY(raw); const np = Math.max(0, el.value.length - pos); el.setSelectionRange(np, np); saveVal(t, k, raw); }
  else saveVal(t, k, el.value);
  if (el.type === "date" || el.type === "time") { const f = t.f.find(x => x.k === k); if (f && f.auto) saveVal(t, k + "_set", true); return refresh(); }
  S.custom = null; S.card = null; keep(drawPrev);
  const mm = $("#emem"); if (mm) mm.innerHTML = memoHtml(t, valsFor(t));
});
document.addEventListener("change", e => { const el = e.target; if (el.tagName === "SELECT" && el.dataset.k) { saveVal(tplOf(S.id), el.dataset.k, el.value); refresh(); } });
document.addEventListener("click", e => { const i = e.target.closest(".dwrap input"); if (i && i.showPicker) { try { i.showPicker(); } catch (er) {} } });
window.addEventListener("popstate", () => { if (history.state && history.state.m === "edit") { S.mob = "edit"; render(); scrollTo(0, 0); } else backToPick(); });
/* 넓은 화면은 처음부터 칸이 보이고, 휴대폰은 고르기부터 */
S.mob = matchMedia("(max-width:760px)").matches ? "pick" : "edit";
const q0 = new URLSearchParams(location.search).get("s"); if (q0 && TPL.some(t => t.id === q0)) { S.id = q0; S.mob = "edit"; }
render();
</script>
