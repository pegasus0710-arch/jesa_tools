:root{--bg:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f1efe8;--line:#e7e5dc;--line2:#d7d4c8;--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--brand-ink:#20263a;--brand-accent:#e08a3e;--cat:#7a4b2a;--catbg:#f4ebe3;--success:#2e8a58;--danger:#b84a3c;
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.app{max-width:1200px;margin:0 auto;padding:20px 20px 40px;min-height:100vh}
.app.embed{padding:14px 14px 20px;min-height:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--cat);color:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--sh1)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--catbg);color:var(--cat)}
.brand .ver{font-family:var(--font);font-size:11px;color:var(--ink3);font-weight:500}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:18px;align-items:start}
.lay>*{min-width:0}
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh1)}
.step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-h .num{width:28px;height:28px;border-radius:9px;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:13px;flex-shrink:0}
.step h3,.res-h h3{font-family:var(--head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500;color:var(--ink3)}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:15px}
input[type=number]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip:hover{background:var(--hover)}.chip.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand-ink)}
input[type=range]{width:100%;accent-color:var(--brand-ink);margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}
.qv{font-family:var(--head);font-size:15px;color:var(--brand-ink);margin-left:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:10px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-ink);color:var(--ink2);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:12px}
.note.w{border-left-color:var(--brand-accent);background:#fffaf2;color:#6b4a12}
.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--bg);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--ink2);transition:.12s}
.drop:hover,.drop.on{border-color:var(--brand-ink);background:#fff;color:var(--brand-ink)}
.drop b{font-size:15px;color:var(--ink)}.drop span{font-size:12.5px;color:var(--ink3)}
.col-r{position:sticky;top:16px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.lnk{color:var(--ink3);font-size:12.5px;font-weight:700}.lnk:hover{color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0;color:var(--ink3);font-size:13.5px;border:1.5px dashed var(--line2);border-radius:12px;margin-bottom:14px}
.list{list-style:none;max-height:420px;overflow-y:auto;margin:0 -4px 14px;padding:0 4px}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.th{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--tint);flex-shrink:0;border:1px solid var(--line)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta>b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>span{font-size:12px;color:var(--ink3)}.meta .res{color:var(--ink);font-weight:700}.arr{color:var(--ink3);margin:0 2px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:2px}
.tag.g{background:#e7f4ec;color:var(--success)}.tag.n{background:var(--tint);color:var(--ink2)}.tag.e{background:#fbece8;color:var(--danger)}
.acts{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-btn);font-weight:700;border:1px solid transparent;white-space:nowrap}
.btn.s{padding:6px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:#fff;border-color:var(--line2);color:var(--ink2)}.btn.ghost:hover{background:var(--hover)}
.btn.p{background:var(--brand-ink);color:#fff}.btn.p:hover{background:#343d5c}
.btn.accent{background:var(--brand-accent);color:#fff}.btn.accent:hover{background:#c9762f}
.btn:disabled{background:#eceae2;color:var(--ink3);cursor:default}
.btn.w{width:100%}.btn.big{padding:14px;font-size:15px;font-family:var(--head);border-radius:12px}
.sumr{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13.5px;color:var(--ink2)}
.sumr b{color:var(--ink)}.sumr b.g{color:var(--success);font-family:var(--head)}
.priv{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.priv svg{flex-shrink:0;margin-top:1px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92vw;box-shadow:var(--sh);z-index:50}
.foot{margin-top:22px;padding:16px 0 4px;text-align:center;font-size:11.5px;color:var(--ink3)}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}
@media(max-width:1000px){.lay{grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px}.step{padding:18px}.flow li{font-size:11px;padding:6px}.flow li span{width:16px;height:16px}}
@media(max-width:700px){.lay{grid-template-columns:1fr}.col-r{position:static}}
@media(max-width:640px){.app{padding:12px 12px 30px}.step{padding:18px}.seg button{font-size:12.5px;padding:8px 4px}}


/* ── 축문 ── */
.lay{grid-template-columns:minmax(300px,390px) minmax(0,1fr)}
input[type=text],input[type=date],select{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:15px;outline:none;background:#fff;box-sizing:border-box}
.dd2,.dd3{display:grid;gap:8px}.dd2{grid-template-columns:1fr 1fr}.dd3{grid-template-columns:1fr 1fr 1.3fr}
.hint.warn{color:#9a5a17}
.calc{display:grid;gap:4px;background:#faf7f3;border:1px solid #efe4d8;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.calc div{display:flex;gap:10px}.calc span{color:var(--ink3);width:34px;flex-shrink:0}.calc b{color:var(--ink)}
.notice{background:#fffaf2;border-left:4px solid var(--brand-accent);border-radius:8px;padding:10px 12px;font-size:13px;color:#4d3a1f;margin-bottom:12px;line-height:1.55}
.sheets{background:#e9e4dc;border-radius:12px;padding:10px;margin-bottom:14px;overflow:auto;max-height:780px}
.scaler{display:flex;flex-direction:column;gap:10px;align-items:center}
.loading{padding:40px;text-align:center;color:var(--ink3)}
.cpage{background:#fffdf8;box-shadow:0 2px 10px rgba(0,0,0,.14);position:relative;box-sizing:border-box;overflow:hidden;color:#1d1d1b}
.cpage.land{width:297mm;height:210mm;padding:22mm 24mm}.cpage.port{width:210mm;height:297mm;padding:24mm 20mm}
.sheets .cpage{zoom:var(--z,.42)}
.vt{writing-mode:vertical-rl;height:100%;margin-left:auto;font-family:"BJ-Kai","Batang","Noto Serif CJK KR",serif;font-size:13.5mm;line-height:1.7;letter-spacing:1.2mm}
.port .vt{font-size:13mm}
.vt p{margin:0 0 0 2.2mm}.vt span{margin-bottom:3.4mm;display:inline-block}.vt .nm{font-size:.78em}
.ko .vt{font-family:"BJ-Myeongjo","Batang",serif;font-size:10.5mm;letter-spacing:.4mm}
.cpage .pf{position:absolute;left:10mm;bottom:6mm;font-family:"BJ-Myeongjo",sans-serif;font-size:2.6mm;color:#c2bcb1;margin:0}
.read{font-family:"BJ-Myeongjo","Batang",serif}
.read h4{font-size:6mm;margin:0 0 4mm;color:#20263a}
.cpage.read.land{padding:14mm 18mm}.cpage.read.port{padding:18mm 16mm}
.rd p{margin:0 0 2.2mm;display:flex;flex-wrap:wrap;gap:1.2mm 2.4mm}
.pair{display:inline-flex;flex-direction:column;align-items:center;border:0.25mm solid #e7e0d4;border-radius:1.6mm;padding:0.8mm 1.8mm}
.pair b{font-family:"BJ-Kai",serif;font-size:5mm;font-weight:400;line-height:1.25}.pair i{font-style:normal;font-size:3.1mm;color:#7a4b2a;line-height:1.3}
.port .pair b{font-size:4.8mm}
.mn{margin-top:3.5mm;border-top:0.4mm solid #20263a;padding-top:3mm}.mn b{font-size:3.8mm;color:#20263a}.mn p{font-size:3.9mm;line-height:1.75;margin:1.5mm 0 0}
@media(max-width:1000px){.lay{grid-template-columns:minmax(260px,330px) minmax(0,1fr)}}
@media(max-width:700px){.lay{grid-template-columns:1fr}.dd3{grid-template-columns:1fr 1fr}.dd3>div:last-child{grid-column:span 2}}
@media print{
  html,body{background:#fff!important}.app{padding:0!important;max-width:none!important;min-height:0!important}
  .top,.col-l,.notice,.res-card>.btn,.priv,.foot,.bj-vnote{display:none!important}
  .lay{display:block!important}.res-card{border:0!important;box-shadow:none!important;padding:0!important;background:none!important}
  .sheets{background:none!important;padding:0!important;max-height:none!important;overflow:visible!important;margin:0!important}
  .scaler{gap:0!important}.sheets .cpage{zoom:1!important;box-shadow:none!important;page-break-after:always;break-after:page}
  .sheets .cpage:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.rg{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.rgl{flex-shrink:0;width:64px;font-size:12px;font-weight:700;color:var(--ink3);padding-top:8px}.rg .chips{margin:0}
details.adv{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#faf9f5}details.adv summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink2)}
@media(max-width:700px){.rg{flex-direction:column;gap:4px}.rgl{width:auto;padding-top:0}}

.bj-vnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7ee;border:1px solid #f1e3cc;border-left:4px solid #e08a3e;border-radius:10px;padding:9px 12px;margin:10px auto 0;max-width:1200px;font-size:13.5px;color:#4d3a1f;box-sizing:border-box}.bj-vnote .dot{width:8px;height:8px;border-radius:50%;background:#e08a3e;flex-shrink:0}.bj-vnote .t{flex:1;min-width:180px}.bj-vnote b{color:#9a5a17}.bj-vnote a{color:#20263a;font-weight:700;text-decoration:none;border:1px solid #d7d4c8;border-radius:8px;padding:4px 10px;background:#fff;white-space:nowrap}.bj-vnote button{border:0;background:none;font-size:18px;line-height:1;color:#8a8f84;cursor:pointer;padding:0 4px}

function solarToLunar(date){ let y=date.getFullYear(); let L=lunarMonths(y); if(!L||date<L.ny){ y--; L=lunarMonths(y); if(!L) return null; } let off=Math.round((date-L.ny)/DAY); for(const mo of L.months){ if(off<mo.days) return {y,m:mo.m,d:off+1,leap:mo.leap}; off-=mo.days; } return null; }

const iGa = w => { const c = (w || "").trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? ((c - 0xAC00) % 28 ? "이" : "가") : "이(가)"; };

const surHanja = (bw, sn) => { const b = BONGWAN[(bw || "").trim()] || "", s = SURNAME[(sn || "").trim()] || ""; return { b, s }; };

/* 축문 줄(세로 한 줄씩) 만들기: 각 조각은 [한자, 한글] */
function compose(st, dt) {
  const R = REL[st.rel], low = R.kind !== "up", lines = [];
  const yr = yearGZ(dt.ly), mo = MONTH(dt.lm), dy = DAYW(dt.ld), sak = dayGZ(dt.first), il = dayGZ(dt.solar);
  lines.push([["維", "유"], ["歲次", "세차"], [yr.h, yr.k], [(dt.leap ? "閏" : "") + mo[0], (dt.leap ? "윤" : "") + mo[1]], [sak.h + "朔", sak.k + "삭"], [dy[0], dy[1]], [il.h, il.k]]);
  const self = [(st.selfH || R.son[0]).trim(), (st.selfK || R.son[1]).trim()];
  const nameH = (st.nameH || st.nameK || "○○").trim(), nameK = (st.nameK || st.nameH || "○○").trim();
  const greet = R.kind === "up" ? ["敢昭告于", "감소고우"] : R.kind === "wife" ? ["昭告于", "소고우"] : ["告于", "고우"];
  lines.push(R.kind === "low" ? [self, greet] : [self, [nameH, nameK, "nm"], greet]);
  const title = (st.titleH || "學生").trim(), titleK = (st.titleK || "학생").trim();
  const bs = { b: st.bwH || surHanja(st.bw, st.sn).b, s: st.snH || surHanja(st.bw, st.sn).s };
  const dnH = (st.dnH || st.dnK || "○○").trim(), dnK = (st.dnK || st.dnH || "○○").trim();
  const male = () => R.named ? [R.m[0] + (R.cap ? R.cap[0] : title) + dnH, R.m[1] + (R.cap ? R.cap[1] : titleK) + dnK] : [R.m[0] + title + "府君", R.m[1] + titleK + "부군"];
  const female = () => R.named ? [R.f[0] + dnH, R.f[1] + dnK] : [R.f[0] + "孺人" + (bs.b || "○○") + (bs.s || "○") + "氏", R.f[1] + "유인" + (st.bw || "○○") + (st.sn || "○") + "씨"];
  const who = R.pair ? st.who : (hasM(R) ? "kao" : "bi");
  if (who !== "bi") lines.push([male()]);
  if (who !== "kao") lines.push([female()]);
  const day = R.kind === "up" ? ["諱日復臨", "휘일부림"] : ["亡日復至", "망일부지"];
  const dead = who === "both" ? st.dead : who;
  /* 두 분을 함께 모실 때만 기일을 맞은 분을 한 번 더 밝힘 */
  lines.push(who === "both" ? [["歲序遷易", "세서천역"], dead === "kao" ? R.m : R.f, day] : [["歲序遷易", "세서천역"], day]);
  const feel = st.feelH ? [st.feelH.trim(), (st.feelK || st.feelH).trim()] : [R.feel[0], R.feel[1]];
  lines.push(R.chu ? [["追遠感時", "추원감시"], feel] : [feel]);
  lines.push(low ? [["玆以", "자이"], ["淸酌庶羞", "청작서수"], ["伸此奠儀", "신차전의"]] : [["謹以", "근이"], ["淸酌庶羞", "청작서수"], ["恭伸奠獻", "공신전헌"]]);
  lines.push([["尙", "상"], ["饗", "향"]]);
  /* 풀이 */
  const callWho = who === "both" ? R.call[0] + "과 " + R.call[1] : who === "kao" ? R.call[0] : (R.call[1] || R.call[0]);
  const deadCall = dead === "kao" ? R.call[0] : (R.call[1] || R.call[0]);
  const feelK = st.feelH ? "슬픈 마음을 이길 수 없습니다" : R.feel[2];
  const selfKo = st.selfK ? st.selfK.trim() : (R.ko || R.son[1]);   /* 풀이에는 뜻으로(사위·조카 등) */
  const subj = R.kind === "low" ? selfKo : `${selfKo} ${nameK}`;
  const to = R.kind === "up" ? `${callWho}께 고하나이다` : `${callWho}에게 알립니다`;

  const meaning = `${yr.k}년 음력 ${(dt.leap ? "윤" : "") + dt.lm}월 ${dt.ld}일, ${subj}${eunNeun(subj)} ${to}. 해가 바뀌어 ${pass}이 다시 돌아오니${R.chu ? ", 옛일을 생각하며" : ""} ${feelK}. ${end}`;
  const ko = [`${yr.k}년 음력 ${(dt.leap ? "윤" : "") + dt.lm}월 ${dt.ld}일`, `${subj}${eunNeun(subj)}`, `${to}.`, `해가 바뀌어 ${pass}이`, `다시 돌아오니${R.chu ? " 옛일을 생각하며" : ""}`, `${feelK}.`, ...(R.kind !== "up" ? ["맑은 술과 여러 가지 음식을", "차렸으니 흠향하기 바랍니다."] : ["삼가 맑은 술과 여러 가지 음식을", "정성껏 차려 올리오니", "흠향하시옵소서."])];
  return { lines, meaning, ko, yr, sak, il, mo, dy };
}

/* 날짜: 음력 기일 + 해 → 양력 · 간지 */
function resolveDate(st) {
  if (st.mode === "solar") { const [y, m, d] = (st.solar || "").split("-").map(Number); if (!y) return null;
    const s = new Date(y, m - 1, d), L = solarToLunar(s); if (!L) return null; const first = lunarToSolar(L.y, L.m, 1, L.leap); return { solar: s, ly: L.y, lm: L.m, ld: L.d, leap: L.leap, first }; }
  const y = +st.year, m = +st.lm, d = +st.ld; if (!y || !m || !d) return null;
  let leap = !!st.leap && hasLeap(y, m);
  let s = lunarToSolar(y, m, d, leap), note = "";
  if (!s && d === 30) { s = lunarToSolar(y, m, 29, leap); note = `${y}년 음력 ${m}월은 29일까지라 29일로 계산했어요.`; }
  if (st.leap && !hasLeap(y, m)) note = `${y}년에는 윤${m}월이 없어 평달 ${m}월로 계산했어요.`;
  if (!s) return null;
  const L = solarToLunar(s); return { solar: s, ly: L.y, lm: L.m, ld: L.d, leap: L.leap, first: lunarToSolar(L.y, L.m, 1, L.leap), note };
}

            <div><label class="f">한자 <span class="muted">선택</span></label><input type="text" value=${st.nameH} placeholder="洪吉童" onInput=${e => up("nameH", e.target.value)} /></div></div>` : null}
          ${R.named && html`<div class="dd2"><div><label class="f">${R.call[0]} 이름 (한글)</label><input type="text" value=${st.dnK} placeholder="길동" onInput=${e => up("dnK", e.target.value)} /></div>
            <div><label class="f">한자</label><input type="text" value=${st.dnH} placeholder="吉童" onInput=${e => up("dnH", e.target.value)} /></div></div>`}
          ${hasM(R) && !R.cap && (R.pair ? st.who !== "bi" : true) && html`<div class="dd2"><div><label class="f">${R.call[0]} 직함</label><input type="text" value=${st.titleK} onInput=${e => up("titleK", e.target.value)} /></div>
            <div><label class="f">한자</label><input type="text" value=${st.titleH} onInput=${e => up("titleH", e.target.value)} /></div></div>
            <p class="hint">벼슬이 없으면 <b>학생(學生)</b>으로 씁니다.</p>`}
          ${hasF(R) && !R.named && (R.pair ? st.who !== "kao" : true) && html`<div class="dd2"><div><label class="f">${R.call[1] || R.call[0]} 본관</label><input type="text" value=${st.bw} placeholder="김해" onInput=${e => up("bw", e.target.value)} /></div>
            <div><label class="f">성씨</label><input type="text" value=${st.sn} placeholder="김" onInput=${e => up("sn", e.target.value)} /></div></div>
            <p class=${"hint" + ((st.bw && !hz.b && !st.bwH) || (st.sn && !hz.s && !st.snH) ? " warn" : "")}>한자: <b>${(st.bwH || hz.b || "?") + (st.snH || hz.s || "?")}氏</b>
              ${(st.bw && !hz.b) || (st.sn && !hz.s) ? html` — 목록에 없는 본관·성씨예요. 아래에 한자를 직접 넣어 주세요.` : ""}</p>
            ${((st.bw && !hz.b) || (st.sn && !hz.s) || st.bwH || st.snH) && html`<div class="dd2"><div><label class="f">본관 한자</label><input type="text" value=${st.bwH} onInput=${e => up("bwH", e.target.value)} /></div><div><label class="f">성씨 한자</label><input type="text" value=${st.snH} onInput=${e => up("snH", e.target.value)} /></div></div>`}`}
          <details class="adv"><summary>표현 고치기 <span class="muted">집안에서 쓰는 말이 다를 때</span></summary>
            <div class="dd2"><div><label class="f">제주를 나타내는 말</label><input type="text" value=${st.selfH} placeholder=${R.son[0] + " (" + R.son[1] + ")"} onInput=${e => up("selfH", e.target.value)} /></div>
              <div><label class="f">읽는 법</label><input type="text" value=${st.selfK} placeholder=${R.son[1]} onInput=${e => up("selfK", e.target.value)} /></div></div>
            <div class="dd2"><div><label class="f">마음을 나타내는 말</label><input type="text" value=${st.feelH} placeholder=${R.feel[0]} onInput=${e => up("feelH", e.target.value)} /></div>
              <div><label class="f">읽는 법</label><input type="text" value=${st.feelK} placeholder=${R.feel[1]} onInput=${e => up("feelK", e.target.value)} /></div></div>
            <p class="hint">예: 맏이가 아니면 '孝'를 빼고 '子(자)'로 쓰는 집도 있어요. 남편 제사는 '主婦' 대신 '妻(처)'로 쓰기도 합니다.</p>
          </details>
        </${Step}>
        <${Step} n=${3} title="제사 날짜" sub="축문에는 기일의 간지가 들어갑니다 — 자동으로 계산해요">
          <${Seg} value=${st.mode} options=${[["lunar", "음력 기일로"], ["solar", "양력 날짜로"]]} onChange=${v => up("mode", v)} />
          ${st.mode === "lunar" ? html`<div class="dd3"><div><label class="f">음력 월</label><select value=${st.lm} onChange=${e => up("lm", +e.target.value)}>${Array.from({ length: 12 }, (_, i) => html`<option value=${i + 1}>${i + 1}월</option>`)}</select></div>
              <div><label class="f">일</label><select value=${st.ld} onChange=${e => up("ld", +e.target.value)}>${Array.from({ length: 30 }, (_, i) => html`<option value=${i + 1}>${i + 1}일</option>`)}</select></div>
              <div><label class="f">지내는 해</label><select value=${st.year} onChange=${e => up("year", +e.target.value)}>${yrs.map(y => html`<option value=${y}>${y}년</option>`)}</select></div></div>
              <label class="chk"><input type="checkbox" checked=${st.leap} onChange=${e => up("leap", e.target.checked)} /> 윤달에 돌아가셨어요</label>`
            : html`<label class="f">제사 날짜 (기일, 양력)</label><input type="date" value=${st.solar} onInput=${e => up("solar", e.target.value)} />`}
          ${dt ? html`<div class="calc"><div><span>양력</span><b>${fmt(dt.solar)}</b></div><div><span>음력</span><b>${dt.ly}년 ${dt.leap ? "윤" : ""}${dt.lm}월 ${dt.ld}일</b></div>
              ${c && html`<div><span>간지</span><b>${c.yr.k}년 · ${c.sak.k}삭 · ${c.il.k}일</b></div>`}</div>
              ${dt.note && html`<p class="hint warn">${dt.note}</p>`}`
            : html`<p class="hint">${st.mode === "solar" ? "날짜를 골라 주세요." : "날짜를 계산할 수 없어요. 1901~2050년 안에서 골라 주세요."}</p>`}
          <p class="hint">축문 날짜는 <b>돌아가신 날(기일)</b>로 씁니다. 기일 전날 저녁에 지내는 집도 축문 날짜는 기일입니다.</p>
        </${Step}>
        <${Step} n=${4} title="출력 모양" sub="한문 축문 + 읽는 법, 또는 한글 축문">
          <${Seg} value=${st.out} options=${[["hanja", "한문 축문"], ["ko", "한글 축문"]]} onChange=${v => up("out", v)} />
          <label class="f">종이</label><${Seg} value=${st.paper} options=${[["land", "A4 가로"], ["port", "A4 세로"]]} onChange=${v => up("paper", v)} />
          ${st.out !== "ko" && html`<label class="chk"><input type="checkbox" checked=${st.withRead} onChange=${e => up("withRead", e.target.checked)} /> 읽는 법(한글 독음)과 풀이 쪽 함께 인쇄</label>`}
        </${Step}>
      </div>
      <div class="col-r"><div class="res-card">
        <div class="notice"><b>명절 차례에는 축문을 읽지 않아요.</b> 설·추석 차례는 술을 한 번 올리고 축문 없이 지냅니다. 축문은 기제사·시제에 씁니다.</div>
        <div class="sheets"><div class="scaler">${c ? pages.map(p => html`<${Sheet} c=${c} st=${st} page=${p} />`) : html`<p class="loading">날짜를 정하면 축문이 나타나요</p>`}</div></div>
        <button class="btn accent w big" disabled=${!c} onClick=${() => window.print()}>${h(Icon, { name: "printer", size: 18 })} 인쇄 · PDF로 저장</button>
        <p class="priv">${h(Icon, { name: "info", size: 15, color: "#5c6259" })} 축문 표현은 집안마다 조금씩 다를 수 있어요. 집안에서 써 온 방식이 있다면 그쪽을 따르세요. 입력한 내용은 이 기기 브라우저에만 저장됩니다.</p>
      </div></div>
    </div>
    ${!EMBED && html`<div class="foot">Copyright © <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a> | All Rights Reserved</div>`}
  </div>`;
}
render(html`<${App} />`, document.getElementById("root"));

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알려 iframe 높이를 자동으로 맞춤 */
(function(){ if(!EMBED || window.parent===window) return;
  var last=0, t=null;
  function send(){ var r=document.getElementById("root"); if(!r) return;
    var h=Math.ceil(r.getBoundingClientRect().height)+8;
    if(document.querySelector(".edws")) h=Math.max(h,900);   /* 큰 화면 편집 중엔 넉넉하게 */
    if(Math.abs(h-last)<4) return; last=h;
    try{ window.parent.postMessage({blogj:"height",h:h},"https://luvbong.tistory.com"); }catch(e){} }
  function soon(){ clearTimeout(t); t=setTimeout(send,60); }
  if(window.ResizeObserver){ new ResizeObserver(soon).observe(document.getElementById("root")); }
  new MutationObserver(soon).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("load",send); setTimeout(send,300);
})();


window.BJ_TOOL_KEY="chukmun";window.BJ_TOOL_VER=APP_VER;
/* 새 버전 알림: 같은 사이트의 versions.json을 확인해 더 새 버전이 있으면 맨 위에 안내 (없거나 실패하면 아무것도 안 함) */
(function () {
  if (location.protocol === "file:") return;   /* 다운로드판·로컬 파일은 확인하지 않음 */
  var KEY = window.BJ_TOOL_KEY, CUR = window.BJ_TOOL_VER; if (!KEY || !CUR) return;
  var newer = function (a, b) { var x = String(a).split("."), y = String(b).split("."); for (var i = 0; i < 3; i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d) return d > 0; } return false; };
  fetch("versions.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    var v = j && j[KEY]; if (!v || !v.latest || !newer(v.latest, CUR) || !/^https:\/\/luvbong\.tistory\.com\//.test(v.post || "")) return;
    try { if (sessionStorage.getItem("bjvn:" + KEY + v.latest)) return; } catch (e) {}
    var bar = document.createElement("div"); bar.className = "bj-vnote";
    bar.innerHTML = '<span class="dot"></span><span class="t"><b>새 버전 v' + String(v.latest).replace(/[^0-9.]/g, "") + '</b>이 나왔어요' + (v.note ? ' — ' + String(v.note).replace(/[<>&"]/g, "") : "") + '</span><a target="_blank" rel="noopener">새 글에서 쓰기 ›</a><button aria-label="닫기">×</button>';
    bar.querySelector("a").href = v.post;
    bar.querySelector("button").onclick = function () { bar.remove(); try { sessionStorage.setItem("bjvn:" + KEY + v.latest, "1"); } catch (e) {} };
    document.body.insertBefore(bar, document.body.firstChild);
  }).catch(function () {});
})();
