</style>

var TOPIC=[['color','색 · 글꼴',/색 묶음|주 색|강조 색|글꼴|머리 색/],['layout','화면 배치',/본문 너비|사이드바|칸 수|간격|모서리/],['list','글 목록',/목록|보기 방식|제목 보이기|단추/],['post','글 화면',null],['etc','홈 · 바닥',/대표 사진|바닥|홈/]];
var G={};TOPIC.forEach(function(t){G[t[0]]={id:t[0],name:t[1],items:[]};});
C.groups.forEach(function(g){g.items.forEach(function(f){f.from=g.name;var id=null;
  if(g.name==='글 화면')id='post';else if(/^(홈|바닥)$/.test(g.name))id='etc';
  else for(var i=0;i<TOPIC.length&&!id;i++){if(TOPIC[i][2]&&TOPIC[i][2].test(f.label))id=TOPIC[i][0];}
  G[id||'layout'].items.push(f);});});
var openId=null;try{openId=sessionStorage.getItem('bjDemoGrp:'+C.slug);}catch(e){}
var GL=TOPIC.map(function(t){return G[t[0]];}).filter(function(g){return g.items.length;});
if(openId!=='home'&&!GL.some(function(g){return g.id===openId;}))openId='home';
function openGrp(id){openId=openId===id?null:id;try{sessionStorage.setItem('bjDemoGrp:'+C.slug,openId||'');}catch(e){}paintGrp();}
GL.unshift({id:'home',name:'홈 구성',items:[],custom:true});
(function(){var sec=doc.createElement('section');sec.className='grp';sec.setAttribute('data-g','home');
  sec.innerHTML='<h3><button type="button" class="gh" aria-controls="gb-home"><span class="gn">홈 구성</span><span class="gc">2개</span><span class="gd" hidden></span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h3>'+
   '<div class="gb" id="gb-home"><div class="fld" data-hf="top"><div class="ft"><span class="lb" id="lb-hometop"></span></div><button type="button" class="sw" role="switch" aria-labelledby="lb-hometop" id="hTop"><span class="st"></span><i aria-hidden="true"></i></button><span class="ds">홈 맨 위에 놓는 칸</span></div>'+
   '<div class="fld" data-hf="body"><div class="ft"><span class="lb" id="lb-homebody">아래 칸 모양</span></div><div class="seg" role="group" aria-labelledby="lb-homebody" id="hBody"></div>'+
   '<span class="ds">홈은 스킨 편집이 아니라 <b>꾸미기 › 스킨 편집 › 「홈 화면 설정」</b>에서 칸을 추가하며 모양을 고릅니다. 칸은 여러 개 쌓을 수 있고, 칸마다 카테고리 · 글 개수 · 제목을 따로 정합니다.</span></div></div>';
  box.appendChild(sec);$('#lb-hometop').textContent='「'+C.home.top+'」 칸';
  sec.querySelector('.gh').addEventListener('click',function(){openGrp('home');});
  C.home.bodies.forEach(function(x){var b=doc.createElement('button');b.type='button';b.textContent=x[1];b.setAttribute('data-v',x[0]);b.addEventListener('click',function(){setHome('body',x[0]);});$('#hBody').appendChild(b);});
  $('#hTop').addEventListener('click',function(){setHome('top',H.top==='1'?'0':'1');});})();
function setHome(k,v){H[k]=v;page='home.html';paint();markTab();syncURL();load(false);}
function paintHome(){var t=$('#hTop');t.setAttribute('aria-checked',H.top==='1'?'true':'false');t.querySelector('.st').textContent=H.top==='1'?'켜짐':'꺼짐';
  [].forEach.call($('#hBody').children,function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===H.body?'true':'false');});
  var n=(H.top!=='1'?1:0)+(H.body!==C.home.bodies[0][0]?1:0),gd=box.querySelector('[data-g="home"] .gd');gd.hidden=!n;gd.textContent='바꿈 '+n;
  box.querySelector('[data-hf="top"]').classList.toggle('chg',H.top!=='1');box.querySelector('[data-hf="body"]').classList.toggle('chg',H.body!==C.home.bodies[0][0]);}
GL.forEach(function(g){if(g.custom)return;var sec=doc.createElement('section');sec.className='grp';sec.setAttribute('data-g',g.id);
  var h=doc.createElement('h3'),hb=doc.createElement('button');hb.type='button';hb.className='gh';hb.setAttribute('aria-controls','gb-'+g.id);
  hb.innerHTML='<span class="gn"></span><span class="gc"></span><span class="gd" hidden>바꿈</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  hb.querySelector('.gn').textContent=g.name;hb.querySelector('.gc').textContent=g.items.length+'개';hb.addEventListener('click',function(){openGrp(g.id);});h.appendChild(hb);sec.appendChild(h);
  var body=doc.createElement('div');body.className='gb';body.id='gb-'+g.id;
  g.items.forEach(function(f){var d=doc.createElement('div');d.className='fld';d.setAttribute('data-f',f.key);
    var top=doc.createElement('div');top.className='ft';var lb=doc.createElement('span');lb.className='lb';lb.textContent=f.label;lb.id='lb-'+f.key;
    var rs=doc.createElement('button');rs.type='button';rs.className='rs';rs.textContent='처음 값';rs.hidden=true;rs.setAttribute('aria-label',f.label+' 처음 값으로');rs.addEventListener('click',function(){set(f.key,f.default||'');});
    top.appendChild(lb);top.appendChild(rs);d.appendChild(top);
    var ctl;
    if(f.type==='SELECT'&&f.options.length<=5){ctl=doc.createElement('div');ctl.className='seg'+(f.options.length===2?' two':'');ctl.setAttribute('role','group');ctl.setAttribute('aria-labelledby',lb.id);
      f.options.forEach(function(o){var b=doc.createElement('button');b.type='button';b.textContent=o[1];b.setAttribute('data-v',o[0]);b.addEventListener('click',function(){set(f.key,o[0]);});ctl.appendChild(b);});}
    else if(f.type==='SELECT'){ctl=doc.createElement('select');ctl.setAttribute('aria-labelledby',lb.id);
      f.options.forEach(function(o){var op=doc.createElement('option');op.value=o[0];op.textContent=o[1];ctl.appendChild(op);});ctl.addEventListener('change',function(){set(f.key,ctl.value);});}
    else if(f.type==='BOOL'){ctl=doc.createElement('button');ctl.type='button';ctl.className='sw';ctl.setAttribute('role','switch');ctl.setAttribute('aria-labelledby',lb.id);ctl.innerHTML='<span class="st"></span><i aria-hidden="true"></i>';
      ctl.addEventListener('click',function(){set(f.key,S[f.key]==='true'?'':'true');});}
    else {ctl=doc.createElement('label');ctl.className='color';var inp=doc.createElement('input');inp.type='color';inp.setAttribute('aria-labelledby',lb.id);inp.addEventListener('change',function(){set(f.key,inp.value);});ctl.appendChild(inp);
      var t=doc.createElement('span');t.className='cv';ctl.appendChild(t);}
    ctl.setAttribute('data-k',f.key);d.appendChild(ctl);
    var ds=doc.createElement('span');ds.className='ds';ds.textContent=(f.desc?f.desc+' ':'');var fr=doc.createElement('em');fr.textContent='스킨 편집 › '+f.from;ds.appendChild(fr);d.appendChild(ds);
    body.appendChild(d);});
  sec.appendChild(body);box.appendChild(sec);});
function paintGrp(){GL.forEach(function(g){var sec=box.querySelector('[data-g="'+g.id+'"]'),on=g.id===openId;sec.classList.toggle('open',on);sec.querySelector('.gh').setAttribute('aria-expanded',on?'true':'false');sec.querySelector('.gb').hidden=!on;
  if(g.custom)return;var n=g.items.filter(function(f){return (S[f.key]||'')!==(f.default||'');}).length,gd=sec.querySelector('.gd');gd.hidden=!n;gd.textContent='바꿈 '+n;});paintHome();}
function paint(){F.forEach(function(f){var c=box.querySelector('[data-k="'+f.key+'"]');if(!c)return;var v=S[f.key]||'';
  if(c.classList.contains('seg'))[].forEach.call(c.children,function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===v?'true':'false');});
  else if(c.tagName==='SELECT')c.value=v;else if(c.classList.contains('sw')){c.setAttribute('aria-checked',v==='true'?'true':'false');c.querySelector('.st').textContent=v==='true'?'켜짐':'꺼짐';}
  else {var i=c.querySelector('input');if(/^#[0-9a-f]{6}$/i.test(v))i.value=v;c.querySelector('.cv').textContent=v||'';}
  var fd=box.querySelector('[data-f="'+f.key+'"]'),ch=v!==(f.default||'');fd.classList.toggle('chg',ch);fd.querySelector('.rs').hidden=!ch;});paintGrp();}
paint();

/* 미리보기 틀 */
var fr=$('#fr'),vp=$('#vp'),view=$('#view'),keepY=null;
function narrow(){return matchMedia('(max-width:900px)').matches;}
function fit(){var W=view.clientWidth,Hh=view.clientHeight;view.classList.toggle('phone',dev==='phone'&&!narrow());
  if(narrow()){vp.style.cssText='width:'+W+'px;height:'+Hh+'px;transform:none';return;}
  if(dev==='phone'){var h=Math.min(844,Hh-48),s=h<640?(Hh-48)/740:1;h=Math.round(Math.min(844,(Hh-48)/s));
    vp.style.cssText='width:390px;height:'+h+'px;transform:translate('+Math.round((W-390*s)/2)+'px,24px) scale('+s+')';return;}
  var PW=dev==='pc'?1366:1920,s2=Math.min(1,W/PW);vp.style.cssText='width:'+PW+'px;height:'+Math.ceil(Hh/s2)+'px;transform:translate('+Math.max(0,Math.round((W-PW*s2)/2))+'px,0) scale('+s2+')';}
window.addEventListener('resize',fit);
function load(keep){try{keepY=keep&&fr.contentWindow?fr.contentWindow.scrollY:null;}catch(e){keepY=null;}
  window.__bjDemoCfg=cfg();var src='pages/'+realFile();
  if(keep&&fr.getAttribute('src')===src){try{fr.contentWindow.location.reload();return;}catch(e){}}
  fr.setAttribute('src',src);}
fr.addEventListener('load',function(){try{var w=fr.contentWindow,f=w.location.pathname.split('/').pop();
  if(/^home/.test(f)){if(f==='home.html'&&homeFile()!=='home.html'){page='home.html';markTab();syncURL();fr.setAttribute('src','pages/'+homeFile());return;}f='home.html';}
  if(f&&f!==page&&C.pages.some(function(p){return p.file===f;})){page=f;markTab();syncURL();}
  if(keepY){w.scrollTo(0,keepY);keepY=null;}}catch(e){}});
function go(f){page=f;markTab();syncURL();load(false);}
function set(k,v){S[k]=v;paint();syncURL();load(true);}
[].forEach.call(doc.querySelectorAll('.dev button'),function(b){b.addEventListener('click',function(){dev=b.getAttribute('data-dev');markDev();syncURL();fit();});});
function markDev(){[].forEach.call(doc.querySelectorAll('.dev button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-dev')===dev?'true':'false');});}
$('#reset').addEventListener('click',function(){defaults();H.top='1';H.body=C.home.bodies[0][0];paint();markTab();syncURL();load(true);toast('처음 값으로 돌렸어요');});
$('#copy').addEventListener('click',function(){var u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('주소를 복사했어요');},function(){prompt('이 주소를 복사하세요',u);});});
var tm;function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){e.classList.remove('on');},1800);}

/* 휴대폰: 설정 시트 (뒤로 가기 = 시트만 닫기) */
var body=doc.body,pushed=false;
function sheet(on){body.classList.toggle('sheet',on);$('#setBtn').setAttribute('aria-expanded',on?'true':'false');
  if(on){try{history.pushState({bjsheet:1},'');pushed=true;}catch(e){}$('#closeBtn').focus();}}
function closeSheet(){if(!body.classList.contains('sheet'))return;if(pushed){pushed=false;history.back();}else sheet(false);}
$('#setBtn').addEventListener('click',function(){sheet(true);});
$('#closeBtn').addEventListener('click',closeSheet);$('#sheetBg').addEventListener('click',closeSheet);
window.addEventListener('popstate',function(){if(body.classList.contains('sheet')){pushed=false;sheet(false);}});
doc.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});

/* 설정 접기 · 새 창으로 크게 */
var fb=$('#foldBtn');function fold(on){body.classList.toggle('fold',on);fb.setAttribute('aria-pressed',on?'true':'false');fb.textContent=on?'설정 펴기':'설정 접기';try{localStorage.setItem('bjDemoFold',on?'1':'');}catch(e){}fit();}
fb.addEventListener('click',function(){fold(!body.classList.contains('fold'));});
try{if(localStorage.getItem('bjDemoFold')==='1')fold(true);}catch(e){}
$('#newWin').addEventListener('click',function(){var o=cfg(),u=new URLSearchParams();for(var k in o)if(o[k]!=='')u.set(k,o[k]);window.open('pages/'+page+'?'+u.toString(),'_blank','noopener');});
markTab();markDev();fit();load(false);
})();
</script>
</body>
