<!doctype html><html lang="ko"><head><meta charset="utf-8">

<style>:root{--bg:#FAF6EE;--in:#F3EEE3;--desk:#F0EADF;--card:#fff;--line:#CDD3DC;--hair:rgba(20,32,43,.12);--ink:#14202B;--sub:#5F6B7A;--sea:#0C737D;--sea2:#0A5C66;--seal:#EEF6F7;--deep:#0B3D4A;--deeps:#CFE3E6;--sky:#2B5FA0;--sun:#E07A4F;--red:#C23A2B;--up:0 1px 2px rgba(20,32,43,.06),0 0 0 1px rgba(20,32,43,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SUIT,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--sky)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hd{background:var(--deep);color:#fff}
.hd-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;min-height:62px}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo .lg{width:40px;height:40px;border-radius:10px;background:#0C737D;display:grid;place-items:center;flex-shrink:0;position:relative}
.logo .lg svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo .lg i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--sun);border:2px solid var(--deep)}
.logo small{display:block;font-size:11.5px;font-weight:700;color:var(--deeps)}
.logo b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.hd .sp{flex:1}
.hbtn{text-decoration:none;height:38px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}
.step{background:#fff;border-radius:16px;box-shadow:var(--up);overflow:hidden}
.sth{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:left}
.sth .n{width:28px;height:28px;border-radius:50%;background:var(--sea);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.sth b{font-size:16px;font-weight:900;flex:1}
.sth small{font-size:13px;color:var(--sub);font-weight:700;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step:not(.open) .stb{display:none}
.step.open .sth{border-bottom:1px solid var(--hair)}
.stb{padding:14px 16px 16px}
.lab{font-size:13px;font-weight:800;color:var(--sub);margin:12px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lab:first-child{margin-top:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:34px;padding:0 12px;border-radius:9px;background:var(--in);font-size:13.5px;font-weight:700;white-space:nowrap}
.chip:hover{box-shadow:0 0 0 2px var(--sea)}
.chip.on{background:var(--sea);color:#fff}
.seg{display:flex;background:var(--in);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1 0 auto;height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--up)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs.port{grid-template-columns:repeat(4,minmax(0,1fr))}
.th{border-radius:10px;overflow:hidden;position:relative;background:var(--in);aspect-ratio:16/9;box-shadow:var(--up)}
.thumbs.port .th{aspect-ratio:9/19}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.on{box-shadow:0 0 0 3px var(--sea)}
.th:hover{box-shadow:0 0 0 2px var(--sea)}
.sw{width:34px;height:34px;border-radius:9px;box-shadow:var(--up)}
.sw.on{box-shadow:0 0 0 3px var(--sea)}
.pos{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.pos button{height:30px;border-radius:7px;background:var(--in);position:relative}
.pos button i{position:absolute;width:12px;height:8px;border-radius:2px;background:var(--sub);opacity:.5}
.pos button.on{background:var(--sea)}
.pos button.on i{background:#fff;opacity:1}
.mon{display:flex;align-items:center;gap:6px}
.mon button{width:36px;height:36px;border-radius:9px;background:var(--in);display:grid;place-items:center}
.mon b{min-width:120px;text-align:center;font-size:17px;font-weight:900}
.rng{width:100%;accent-color:var(--sea)}
.inp{height:40px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);padding:0 11px;font-size:15px;outline:0;min-width:0;width:100%}
.inp:focus{box-shadow:0 0 0 2px var(--sea)}
.memo{display:grid;grid-template-columns:150px minmax(0,1fr) 32px;gap:6px;margin-bottom:6px}
.dt{position:relative;height:40px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.x{width:32px;height:40px;border-radius:9px;background:var(--in);display:grid;place-items:center;color:var(--sub)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.res button{text-align:left;padding:8px 10px;border-radius:10px;background:var(--in);font-size:13.5px;font-weight:800;line-height:1.3}
.res button small{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
.res button.on{background:var(--sea);color:#fff}
.res button.on small{color:var(--deeps)}
.hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6}
.main{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
.pvc{background:var(--desk);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--hair)}
.pvh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pvh b{font-size:15px;font-weight:900}
.pvh small{font-size:13px;color:var(--sub);font-weight:700}
.stage{display:flex;justify-content:center;align-items:center;min-height:200px}
#pv{display:block;border-radius:6px;box-shadow:0 18px 40px -20px rgba(20,32,43,.55);max-width:100%;background:#ddd}
.stage.port #pv{max-height:72vh;width:auto}
.dlbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:46px;padding:0 18px;border-radius:12px;background:#fff;box-shadow:var(--up);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap}
.btn:hover{box-shadow:0 0 0 2px var(--sea)}
.btn.go{background:var(--sea);color:#fff;box-shadow:none;flex:1}
.btn.go:hover{background:var(--sea2)}
.how{background:#fff;border-radius:14px;box-shadow:var(--up);padding:12px 14px;font-size:13.5px;color:var(--sub);line-height:1.7}
.how b{color:var(--ink)}
#busy{position:fixed;inset:0;background:rgba(11,25,32,.45);z-index:70;display:grid;place-items:center}
#busy[hidden]{display:none}
#busy div{background:#fff;border-radius:16px;padding:22px 26px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ft{max-width:1400px;margin:0 auto;padding:0 20px 30px;font-size:12.5px;color:var(--sub)}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:12px 14px 50px}
  .main{position:static;order:-1}
  .stage.port #pv{max-height:60vh}
}
@media (max-width:600px){
  .hd-in{padding:10px 14px;min-height:56px}
  .logo .lg{width:34px;height:34px}
  .logo b{font-size:17px}
  .logo small{display:none}
  .hbtn .tx{display:none}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .thumbs.port{grid-template-columns:repeat(3,minmax(0,1fr))}
  .memo{grid-template-columns:132px minmax(0,1fr) 32px}
  .btn{height:50px}
}
/* 막힘 화면(블로그 경유 잠금) */
.bj-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#faf6ee;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bj-gate-in{max-width:520px;text-align:center;background:#fff;border:1px solid #e7e5dc;border-radius:20px;padding:36px 30px;box-shadow:0 10px 30px rgba(12,115,125,0.08)}
.bj-gate-mark{width:64px;height:64px;border-radius:18px;background:#0c737d;color:#fff;font:italic 800 34px/64px Georgia,serif;margin:0 auto 18px;position:relative}
.bj-gate-mark i{position:absolute;right:9px;bottom:10px;width:11px;height:11px;border-radius:50%;background:#e07a4f}
.bj-gate h1{font-size:21px;color:#20241f;margin:0 0 12px;letter-spacing:-.3px}
.bj-gate p{font-size:15px;color:#5c6259;line-height:1.7;margin:0}
.bj-gate b{color:#20241f}
.bj-gate-btn{display:inline-block;margin:22px 0 16px;background:#e07a4f;color:#fff;font-weight:700;text-decoration:none;border-radius:12px;padding:13px 26px;font-size:15.5px}
.bj-gate-s{font-size:12.5px!important;color:#5f6b7a!important}
.bj-gate-s a{color:#0c737d;font-weight:700}
</style></head><body>
<main class="wrap"><div class="side" id="side"></div><div class="main" id="main"></div></main><footer class="ft" id="ft"></footer>
<div id="busy" hidden><div>배경화면을 만드는 중…</div></div><div id="toast" role="status" aria-live="polite"></div>
<script>/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev || (() => { try { return localStorage.getItem("bj-owner") === "1"; } catch (e) { return false; } })()) { embedOK = inFrame && (dev || fromBlog()); return true; }   /* 11-10: 주인 시험 모드 — 테스트 허브(jhub.html)에서 이 기기에 켠 경우만 */
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }

function addThemes(D, X) {

  const hanji = (base, fib) => `<rect width="${W}" height="${H}" fill="${base}"/><filter id="hj"><feTurbulence type="fractalNoise" baseFrequency=".012 .06" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .46  0 0 0 0 .4  0 0 0 ${fib} 0"/></filter><rect width="${W}" height="${H}" filter="url(#hj)"/>`;
  const seal = (x, y, t) => `<rect x="${x}" y="${y}" width="34" height="34" rx="3" fill="#b0342a"/><text x="${x + 17}" y="${y + 23}" text-anchor="middle" font-size="15" font-weight="800" fill="#f7e9e2">${t}</text>`;
  /* 먹 붓 줄기: 굵기가 점점 가늘어지는 면 */
  const brush = (pts, w0, w1, c) => { let L = [], Rr = []; for (let i = 0; i < pts.length; i++) { const [x, y] = pts[i], [nx, ny] = pts[Math.min(i + 1, pts.length - 1)], [px, py] = pts[Math.max(i - 1, 0)]; let dx = nx - px, dy = ny - py; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; const w = (w0 + (w1 - w0) * i / (pts.length - 1)) / 2; L.push([x - dy * w, y + dx * w]); Rr.push([x + dy * w, y - dx * w]); } const P = L.concat(Rr.reverse()); return `<path d="M${P.map(p => r2(p[0]) + ' ' + r2(p[1])).join('L')}Z" fill="${c}"/>`; };
  const curve = (x0, y0, x1, y1, bend, n) => { const a = []; for (let i = 0; i <= n; i++) { const t = i / n; a.push([x0 + (x1 - x0) * t + Math.sin(t * Math.PI) * bend * (y1 - y0) / Math.hypot(x1 - x0, y1 - y0 || 1), y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * bend * (x1 - x0) / Math.hypot(x1 - x0, y1 - y0 || 1)]); } return a; };

  <div class="lab">파일 형식</div><div class="seg"><button class="${S.fmt === "png" ? "on" : ""}" data-a="set" data-k="fmt" data-v="png">PNG (선명)</button><button class="${S.fmt === "jpg" ? "on" : ""}" data-a="set" data-k="fmt" data-v="jpg">JPG (작은 용량)</button></div>
  <p class="hint">모니터 크기를 모르면 「지금 이 화면에 맞추기」를 누르세요. 큰 크기로 받아도 그림이 흐려지지 않아요.</p>`;
  return h;
}
function drawMain() {
  $("#main").innerHTML = `<div class="pvc"><div class="pvh"><b>미리보기</b><small class="num" id="pvs">${S.w}×${S.h} · ${S.y}년 ${S.m}월</small></div><div class="stage${port() ? " port" : ""}"><canvas id="pv" aria-label="배경화면 미리보기"></canvas></div></div>
  <div class="dlbar"><button class="btn go" data-a="dl">${svg(IC.dl)}배경화면 받기 (${S.fmt.toUpperCase()})</button>${navigator.canShare ? `<button class="btn" data-a="share">${svg(IC.share)}휴대폰에 저장 · 보내기</button>` : ""}</div>
  <div class="how"><b>배경화면으로 쓰는 법</b><br>윈도우: 받은 그림을 오른쪽 클릭 → 「바탕 화면 배경으로 설정」 · 맥: 그림 오른쪽 클릭 → 「데스크탑 사진 설정」 · 갤럭시: 갤러리에서 그림 → ⋮ → 「배경화면으로 설정」 · 아이폰: 사진 앱 → 공유 → 「배경화면으로 사용」</div>`;
  paintPreview();
}
let pvT = 0, pvN = 0;
function paintPreview() { clearTimeout(pvT); pvT = setTimeout(async () => {
  const n = ++pvN, cv = $("#pv"); if (!cv) return;
  const box = $(".stage"), maxW = Math.max(240, box.clientWidth), k = port() ? Math.min(1, (innerHeight * .7) / S.h, maxW / S.w) : Math.min(1, maxW / S.w), w = Math.round(S.w * k), h = Math.round(S.h * k);
  const off = document.createElement("canvas");
  try { await render(w, h, off, true); } catch (e) { console.warn(e); return; }
  if (n !== pvN) return; cv.width = w; cv.height = h; cv.getContext("2d").drawImage(off, 0, 0); cv.style.width = w + "px";
  const s = $("#pvs"); if (s) s.textContent = `${S.w}×${S.h} · ${S.y}년 ${S.m}월`;
}, 60); }
function fname() { return `${S.y}년${S.m}월_달력배경화면_${S.w}x${S.h}.${S.fmt}`; }
async function makeBlob() {
  $("#busy").hidden = false; await new Promise(r => setTimeout(r, 30));
  try { const cv = document.createElement("canvas"); await render(S.w, S.h, cv); return await new Promise(ok => cv.toBlob(ok, S.fmt === "jpg" ? "image/jpeg" : "image/png", .92)); }
  finally { $("#busy").hidden = true; }
}
function render2() { drawSide(); drawMain(); save(); }

/* ── 누르기 · 입력 ── */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el) return; const a = el.dataset.a, v = el.dataset.v;
  if (a === "step") { S.step = S.step === +v ? -1 : +v; drawSide(); return save(); }
  if (a === "cat") { S.cat = v; if (v === "내 사진" && !PHOTO) { drawSide(); return pickPhoto(); } drawSide(); paintPreview(); return save(); }
  if (a === "scene") { S.scene = v; document.querySelectorAll(".th").forEach(b => b.classList.toggle("on", b.dataset.v === v)); $(".step .sth small").textContent = SC[v][0]; paintPreview(); return save(); }
  if (a === "solid") { S.solid = v; drawSide(); paintPreview(); return save(); }
  if (a === "photo") return pickPhoto();
  if (a === "mon") { let m = S.m + +v, y = S.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } if (y < 2026 || y > 2028) return toast("공휴일 · 음력은 2026~2028년까지 들어 있어요"); S.y = y; S.m = m; render2(); return; }
  if (a === "set") { const k = el.dataset.k; S[k] = /^(wk)$/.test(k) ? +v : v; render2(); return; }
  if (a === "tog") { S[el.dataset.k] = !S[el.dataset.k]; render2(); return; }
  if (a === "addMemo") { const d = `${S.y}-${p2(S.m)}-01`; S.memos.push({ d, t: "" }); render2(); setTimeout(() => { const i = document.querySelectorAll("[data-mt]"); if (i.length) i[i.length - 1].focus(); }, 30); return; }
  if (a === "delMemo") { S.memos.splice(+v, 1); render2(); return; }
  if (a === "res") { S.w = +el.dataset.w; S.h = +el.dataset.h; render2(); return; }
  if (a === "mine") { const dpr = window.devicePixelRatio || 1; S.w = Math.round(screen.width * dpr); S.h = Math.round(screen.height * dpr); render2(); return toast(`${S.w}×${S.h}에 맞췄어요`); }
  if (a === "dl") { const b = await makeBlob(); if (!b) return toast("그림을 만들지 못했어요"); const u = URL.createObjectURL(b), x = document.createElement("a"); x.href = u; x.download = fname(); document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return toast("배경화면을 받았어요"); }
  if (a === "share") { const b = await makeBlob(); if (!b) return; const f = new File([b], fname(), { type: b.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: "달력 배경화면" }); } catch (er) {} } else toast("이 브라우저는 보내기가 안 돼요 — 「배경화면 받기」를 써 주세요"); return; }
});
document.addEventListener("click", e => { const i = e.target.closest(".dt input"); if (i && i.showPicker) { try { i.showPicker(); } catch (er) {} } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.k) { const k = t.dataset.k; if (k === "w" || k === "h") return; S[k] = t.type === "range" ? +t.value : t.value;
    if (k === "size") { const l = t.closest(".stb").querySelector(".num"); if (l && l.textContent.includes("%")) l.textContent = S.size + "%"; }
    paintPreview(); return save(); }
  if (t.dataset.mt != null) { S.memos[+t.dataset.mt].t = t.value; paintPreview(); return save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.k === "w" || t.dataset.k === "h") { const n = Math.round(+String(t.value).replace(/\D/g, "")); if (!(n >= 320 && n <= 8000)) { toast("320 ~ 8000 사이 숫자를 넣어 주세요"); t.value = S[t.dataset.k]; return; } S[t.dataset.k] = n; render2(); return; }
  if (t.dataset.mi != null && t.value) { S.memos[+t.dataset.mi].d = t.value; t.previousElementSibling.textContent = ymdw(t.value); paintPreview(); return save(); }
  if (t.dataset.k === "solid") { S.solid = t.value; drawSide(); paintPreview(); save(); }
});
function pickPhoto() {
  const ip = document.createElement("input"); ip.type = "file"; ip.accept = "image/*";
  ip.onchange = () => { const f = ip.files[0]; if (!f) return; const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { PHOTO = im; S.cat = "내 사진"; if (S.w > S.h !== im.width > im.height) toast(im.width > im.height ? "가로 사진이에요 — PC 크기가 잘 맞아요" : "세로 사진이에요 — 휴대폰 크기가 잘 맞아요"); render2(); };
    im.onerror = () => toast("이 사진은 열 수 없어요 — JPG · PNG로 골라 주세요"); im.src = u; };
  ip.click();
}
let rzT = 0; addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(paintPreview, 200); });

/* ── 시작 ── */
const GATE_ON = false;   /* 대표 글 공개 시각이 정해지면 Date.now() >= Date.parse("…+09:00") 로 */
(async () => {
  if (GATE_ON && !(await BJ_GATE.check(TOOL, "all"))) return;
  document.body.insertAdjacentHTML("afterbegin", `<header class="hd"><div class="hd-in"><div class="logo"><span class="lg">${'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 15l3-3 3 3 2-2 2 2"/></svg>'}<i></i></span><div><small>BLOG J 무료 도구 · 생활</small><b>달력 배경화면 만들기</b></div></div><div class="sp"></div><a class="hbtn" href="https://luvbong.tistory.com/" target="_blank" rel="noopener">${svg(IC.cal)}<span class="tx">Blog J 다른 도구</span></a></div></header>`);
  $("#ft").textContent = `달력 배경화면 만들기 v${APP_VER} · Blog J · 그림은 이 기기에서 만들어져요(업로드 없음) · 공휴일 · 음력 2026~2028년 · ${BUILD}`;
  render2();
  if (document.fonts) { document.fonts.load('700 20px "Gowun Batang"'); document.fonts.load('400 20px "Nanum Pen Script"'); document.fonts.load('400 20px "Jua"'); document.fonts.ready.then(paintPreview); }
})();
</script>
