:root{
--paper:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f3f1ea;--line:#e7e5dc;--line2:#d7d4c8;
--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--navy:#20263a;--amber:#e08a3e;--amber-d:#c9742c;--cat:#1f7f8f;--catbg:#e3f3f5;

:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ── 위 도구 막대: 로고 + 도구 이름 + 눈금 진행 ── */
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.bar-in{max-width:1360px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:flex-end;gap:28px}
.brand{display:flex;align-items:center;gap:11px;padding-bottom:14px;flex-shrink:0;color:#fff;text-align:left}
.btn.home{padding:10px 12px;border-color:var(--line2);background:#fff}.btn.home svg{width:19px;height:19px}
.lg{width:36px;height:36px;border-radius:10px;background:var(--cat);display:grid;place-items:center;position:relative}
.lg svg{width:21px;height:21px}
.lg i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--amber);border:2.5px solid var(--navy)}
.brand b{font-family:var(--head);font-size:18px;letter-spacing:-.3px;display:block;line-height:1.2}
.brand small{font-size:11.5px;color:rgba(255,255,255,.62);display:block}
/* 눈금자 진행 표시 */
.ruler{flex:1;min-width:0;position:relative;height:58px}
.ruler-track{position:absolute;left:0;right:0;top:20px;height:12px;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,
   repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat}
.ruler-done{position:absolute;left:0;top:30px;height:3px;background:#fff;border-radius:2px;transition:width .35s ease}
.ruler-steps{position:absolute;inset:0;display:flex}
.ruler-steps button{flex:1;min-width:0;position:relative;text-align:left;padding:38px 0 0 0;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruler-steps button::before{content:"";position:absolute;left:0;top:14px;width:2px;height:22px;background:rgba(255,255,255,.55)}
.ruler-steps button.done{color:rgba(255,255,255,.88)}
.ruler-steps button.cur{color:#fff}
.ruler-steps button:disabled{cursor:default}
.ruler-steps button span{padding-left:8px}
.ruler-dot{position:absolute;top:24px;width:16px;height:16px;margin-left:-7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(224,138,62,.25);transition:left .35s ease}
.ruler-m{display:none}

/* ── 본문: 왼쪽 작업 패널 + 오른쪽 작업판(미리보기) ── */
.lay{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:460px minmax(0,1fr);gap:22px;padding:22px 20px 40px;align-items:start}
.lay>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.ph{padding:22px 24px 4px}
.ph .k{font-size:12.5px;color:var(--cat);font-weight:800}
.ph h2{font-family:var(--head);font-size:21px;letter-spacing:-.4px;line-height:1.3;margin-top:2px}
.ph p{font-size:13.5px;color:var(--ink2);margin-top:4px}
.pb{padding:16px 24px 8px}
.pf{display:flex;gap:8px;padding:16px 24px 22px;border-top:1px solid var(--line);margin-top:14px;position:sticky;bottom:0;background:#fff;border-radius:0 0 var(--r) var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-btn);font-weight:700;font-size:14px;border:1px solid var(--line2);background:#fff;color:var(--navy);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn.go{background:var(--amber);border-color:var(--amber);color:#fff;flex:1;font-size:15px;padding:12px 16px}
.btn.go:hover{background:var(--amber-d)}
.btn.nv{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.nv:hover{background:#2c3450}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--navy);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* 고르기 카드 */
.pick{display:grid;gap:10px}
.pick.two{grid-template-columns:1fr 1fr}
.pc{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;position:relative;min-width:0}
.pc:hover{border-color:var(--navy)}
.pc.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.pc.on::after{content:"";position:absolute;right:12px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.pc b{font-family:var(--head);font-size:16px;letter-spacing:-.2px}
.pc small{font-size:12.5px;color:var(--ink2);line-height:1.5}
.pc .ic{width:40px;height:40px;border-radius:11px;background:var(--catbg);color:var(--cat);display:grid;place-items:center;flex-shrink:0}
.pc .ic svg{width:22px;height:22px}
.pc.row{flex-direction:row;align-items:center;gap:12px;padding:13px 14px}
.pc.row>div{min-width:0}
.pc.row b{font-size:15px;display:block}

/* 라벨지 목록 */
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px}
.seg button{flex:1;min-width:0;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:12px}
.sh{border:1.5px solid var(--line2);border-radius:12px;background:#fff;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.sh:hover{border-color:var(--navy)}
.sh.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.sh.on::after{content:"";position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.sh svg{width:100%;height:auto;display:block}
.sh b{font-size:13.5px;font-family:var(--head)}
.sh small{font-size:11.5px;color:var(--ink3);line-height:1.35}
.sh .shx{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink3)}
.sh .shx:hover{background:var(--badbg);color:var(--bad)}
.sh .shx svg{width:14px;height:14px}
.sh .rec{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:800;background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px}
.fine{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:10px}
.fine b{color:var(--ink2)}

/* 입력 칸 */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .m{font-weight:500;color:var(--ink3)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:14px;min-width:0}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
textarea.inp{min-height:180px;resize:vertical;line-height:1.6;font-size:13.5px;white-space:pre;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2>*,.g4>*{min-width:0}
.mm{position:relative}.mm .inp{padding-right:34px}.mm em{position:absolute;right:10px;bottom:11px;font-style:normal;font-size:12px;color:var(--ink3);pointer-events:none}
.mm small{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2);margin-top:10px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--navy)}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px 16px;text-align:center;background:var(--paper);color:var(--ink2);font-size:13.5px}
.drop.ov{border-color:var(--navy);background:#eef0f5}
.drop b{display:block;color:var(--ink);font-size:15px;margin:6px 0 2px}
.drop svg{width:28px;height:28px;color:var(--cat)}
.howb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.howb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px 10px;border-radius:12px;background:#fff;border:1px solid var(--line2);box-shadow:0 3px 0 var(--line2),0 4px 10px rgba(30,28,20,.06);color:var(--navy);transition:transform .08s,box-shadow .08s,background .15s;min-width:0}
.howb button:hover{background:var(--hover)}
.howb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.howb button svg{width:22px;height:22px;color:var(--cat)}
.howb button b{font-size:13.5px;font-weight:800;white-space:nowrap}
.howb button small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.howb button.on{background:linear-gradient(180deg,#2c3450,var(--navy));border-color:#151a29;color:#fff;box-shadow:0 3px 0 #0f1320,0 6px 14px rgba(32,38,58,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.howb button.on svg{color:var(--amber)}
.howb button.on small{color:rgba(255,255,255,.7)}
.zipad{display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:rgba(255,255,255,.82);border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:13px;line-height:1.55}
.zipad svg{width:22px;height:22px;color:var(--amber);flex-shrink:0;margin-top:1px}
.zipad b{display:block;color:#fff;font-size:15px;font-family:var(--head);margin-bottom:1px}
.zipad.sm{padding:9px 12px;margin:8px 0 0}.zipad.sm b{font-size:13.5px}
.samp{display:flex;align-items:center;gap:10px;background:var(--catbg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;color:#165e6a}
.samp svg{width:20px;height:20px;flex-shrink:0}
.samp>div{flex:1;min-width:0}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:12px}
.note.w{border-left-color:var(--warn)}.note.b{border-left-color:var(--bad)}.note.o{border-left-color:var(--ok)}
.note b{color:var(--ink)}

/* 열 맞추기 */
.map{display:grid;gap:6px;margin-top:6px}
.map-r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.map-r span{font-size:13px;font-weight:700;color:var(--ink2)}
select.inp.auto{border-color:var(--cat);background:var(--catbg);color:#165e6a;font-weight:700}
.pv td.autoc{color:var(--cat);font-weight:700;background:#f2fafb}.pv td.autoc i{color:var(--ink3);font-weight:400;font-style:normal}
.map-r span i{font-style:normal;color:var(--bad)}
.pv{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;max-height:170px}
.pv table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.pv td,.pv th{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.pv th{background:var(--tint);font-weight:700;color:var(--ink2);position:sticky;top:0}

/* 확인·고치기 표 */
.stat{display:flex;gap:6px;flex-wrap:wrap}
.stat button{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--tint);color:var(--ink2);border:1.5px solid transparent}
.stat button.on{border-color:var(--navy);background:#fff;color:var(--navy)}
.stat i{font-style:normal;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.prog{height:6px;background:var(--tint);border-radius:999px;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.progt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3)}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;border-left:4px solid var(--line2)}
.rw.fail{border-left-color:var(--bad);background:#fffbfa}
.rw.pick{border-left-color:var(--warn);background:#fffdf8}
.rw.ok,.rw.given,.rw.manual{border-left-color:var(--ok)}
.rw.off{opacity:.55}
.rw-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3)}
.rw-h .no{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.rw-h .tg{margin-left:auto;font-weight:800;border-radius:999px;padding:2px 9px;font-size:11.5px}
.tg.ok,.tg.given,.tg.manual{background:var(--okbg);color:var(--ok)}.tg.fail{background:var(--badbg);color:var(--bad)}.tg.pick{background:var(--warnbg);color:#9a5f0b}.tg.wait{background:var(--tint);color:var(--ink3)}
.rw-f{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px;margin-top:8px}
.rw-f .inp{padding:7px 9px;font-size:13px}
.rw-f2{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:6px;margin-top:6px;align-items:center}
.rw-f2 .inp{padding:7px 9px;font-size:13px}
.rw-h .x{width:26px;height:26px;margin:-3px -4px -3px 2px}
.act{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);font-size:12.5px;color:var(--ink3)}
.act span{flex:1 1 100%}
.undo{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.undo .link{color:#fff}
.mdl{position:fixed;inset:0;background:rgba(28,34,50,.55);display:grid;place-items:center;z-index:70;padding:16px}
.mdl-c{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mdl-h{padding:22px 22px 4px}.mdl-h .k{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--cat)}.mdl-h .k svg{width:16px;height:16px}
.mdl-h h3{font-family:var(--head);font-size:20px;letter-spacing:-.3px;margin-top:4px}.mdl-h p{font-size:13.5px;color:var(--ink2);margin-top:2px}
.mdl-b{padding:12px 22px 0}
.mdl-f{display:flex;gap:8px;padding:16px 22px 20px;border-top:1px solid var(--line);margin-top:16px}
.lk .mdl-b{padding-top:16px}
.lk-n{font-size:14px;color:var(--ink2);display:flex;align-items:baseline;gap:6px}
.lk-n b{font-family:var(--head);font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums}
.lk-n span{margin-left:auto;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.lk-bar{height:12px;border-radius:999px;background:var(--tint);overflow:hidden;margin:8px 0 14px}
.lk-bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s;background:repeating-linear-gradient(-45deg,var(--navy) 0 10px,#3a4462 10px 20px);background-size:28px 28px;animation:lkmv 1s linear infinite}
.lk.done .lk-bar i{animation:none;background:var(--ok)}
@keyframes lkmv{to{background-position:28px 0}}
@media (prefers-reduced-motion:reduce){.lk-bar i{animation:none}}
.lk-c{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.lk-c i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.lk-c b{color:var(--ink);font-variant-numeric:tabular-nums}
.chk.sub{margin:0 0 0 14px}
.ex{margin:0 0 4px 14px;background:var(--paper);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink)}
.ex s{color:var(--ink3);text-decoration:none;font-size:12px}
.ex b{color:var(--cat)}
.ex span{display:block;font-size:11.5px;font-weight:800;color:var(--cat);margin-bottom:1px}
.tgr{display:inline-block;font-size:11px;font-weight:800;background:var(--navy);color:#fff;border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:2px;font-family:var(--font)}
.rw .msg{font-size:12.5px;color:var(--bad);margin-top:6px}
.fin{margin-top:7px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.fin span{display:inline-block;font-size:11px;font-weight:800;color:var(--cat);background:var(--catbg);border-radius:999px;padding:0 7px;margin-right:6px}
.fin em{font-style:normal;color:var(--ink3)}
.cands{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.cands button{text-align:left;font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--warnbg);color:var(--ink)}
.cands button:hover{background:#f6e2bd}
.btn.recall{width:100%;margin-top:10px;padding:11px 14px;background:var(--warnbg);border:2px solid var(--amber);color:#8a4f0e;font-size:14.5px;font-weight:800}
.btn.recall:hover{background:#f8e2b8}
.btn.recall em{font-style:normal;font-size:11px;background:var(--amber);color:#fff;border-radius:999px;padding:1px 8px;margin-right:2px}
.btn.recall b{background:#fff;border-radius:999px;padding:0 8px;margin-left:2px;font-variant-numeric:tabular-nums}
.cands button{position:relative}
.cands button.rec{background:#fff;box-shadow:inset 0 0 0 1.5px var(--amber)}
.cands em{font-style:normal;font-size:11px;font-weight:800;background:var(--amber);color:#fff;border-radius:999px;padding:0 7px;margin-right:6px}
.cands small{display:block;color:var(--ink3);font-size:11.5px;margin-top:1px}
.cands b{font-variant-numeric:tabular-nums;margin-right:6px;color:#9a5f0b}
.more{display:block;width:100%;margin-top:10px}
.gen-c{border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;background:#fff}
.gen-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.gen-h b{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.gen-l{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;margin-top:5px}
.gen-l span{font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;text-align:center;padding:4px 0}
.gen-l .inp{padding:8px 10px;font-size:14px}
.gen-r{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr)) 30px;gap:6px;align-items:center}
.gen-r .inp{padding:7px 9px;font-size:13px}
.gen-r .no{font-size:12px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.x:hover{background:var(--badbg);color:var(--bad)}
.x svg{width:15px;height:15px}

/* 꾸미기 */
.og{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#fff}
.og>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;font-weight:800;font-size:14.5px;font-family:var(--head)}
.og>summary::-webkit-details-marker{display:none}
.og>summary small{font-family:var(--font);font-weight:500;color:var(--ink3);font-size:12.5px;margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.og>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:-4px 4px 0 6px;flex-shrink:0;transition:transform .2s}
.og[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.og-b{padding:0 14px 14px}
.lays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ly{border:1.5px solid var(--line2);border-radius:12px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink2);min-width:0;position:relative}
.ly.on{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.ly svg{width:100%;height:auto}
.ly em{position:absolute;right:6px;top:6px;font-style:normal;font-size:10px;background:var(--navy);color:#fff;border-radius:999px;padding:0 6px}
.rng{display:flex;align-items:center;gap:10px}

<body>

<script>
/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev) { embedOK = inFrame; return true; }
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();

function parsePaste(text) {

/* 제목 줄 · 열 자동 맞추기 */
const HEAD = { name: /받는|수령|성명|이름|성함|고객|name/i, addr: /^(?!.*상세).*주소|address/i, detail: /상세|동.?호|나머지/, zip: /우편|zip|post/i, tel: /전화|연락|휴대|핸드폰|tel|phone/i, memo: /메모|비고|참고|memo/i,
  l1: /1줄|첫|이름|내용|line ?1/i, l2: /2줄|둘|line ?2/i, l3: /3줄|셋|line ?3/i };
function looksAddr(c) { let s = 0; if (/(로|길)\s*\d/.test(c)) s += 3; if (/(동|리|가)\s*(산\s*)?\d/.test(c)) s += 2; if (/(시|도|군|구)\s/.test(c)) s += 2; return s + Math.min(c.length, 40) / 40; }
function guessMap() {
  const R = S.raw.rows, F = FIELDS[S.kind], first = R[0] || [];
  const hits = {}; first.forEach((c, i) => F.forEach(([k]) => { if (hits[k] == null && HEAD[k] && HEAD[k].test(c) && c.length <= 12) hits[k] = i; }));
  S.raw.head = Object.keys(hits).length >= (S.kind === "addr" ? 2 : 1) && !looksAddr(first[hits.addr] || "x 1로 1") ? true : Object.keys(hits).length >= 2;
  if (S.kind === "gen" && Object.keys(hits).length === 0) S.raw.head = false;
  const m = {};
  if (S.raw.head) Object.assign(m, hits);
  else {
    const data = R.slice(0, 20), nc = Math.max(...data.map(r => r.length));
    if (S.kind === "addr") {
      const sc = i => data.reduce((a, r) => a + looksAddr(r[i] || ""), 0);
      let best = 0; for (let i = 1; i < nc; i++) if (sc(i) > sc(best)) best = i; m.addr = best;
      for (let i = 0; i < nc; i++) { if (i === best) continue; const col = data.map(r => r[i] || "");
        if (m.zip == null && col.every(v => !v || /^\d{5}$/.test(v))) m.zip = i;
        else if (m.tel == null && col.some(v => /^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(v))) m.tel = i;
        else if (m.name == null && col.every(v => v.length <= 12)) m.name = i;
        else if (m.detail == null && i === best + 1) m.detail = i; }
    } else { for (let i = 0; i < Math.min(3, nc); i++) m["l" + (i + 1)] = i; }

}
