.addb{width:100%;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--up);color:var(--n);font-weight:800;margin-bottom:12px}

.btn:hover{box-shadow:0 0 0 2px var(--n)}

.row:last-child{border:0}

.row.z{color:var(--sub2)}
.row.t{font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:9px}
.row.s{padding-left:14px;font-size:13.5px;color:var(--sub)}

.tip:last-child{border:0}
.tip .d{width:34px;height:34px;border-radius:9px;background:var(--nl);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tip .d svg{width:19px;height:19px;stroke:var(--n);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip p{font-size:14px;line-height:1.4;flex:1;min-width:0}
.tip p small{color:var(--sub2);font-size:12.5px}
.tip b.g{color:var(--blue);font-size:16px;white-space:nowrap}
.tip.info b.g{color:var(--sub2);font-size:13px;font-weight:700}
.note{font-size:12.5px;color:var(--sub2);margin-top:10px}
.cardbar{height:12px;border-radius:6px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;margin:6px 0 4px}
.cardbar i{position:absolute;left:0;top:0;bottom:0;background:var(--n);border-radius:6px}
.cardbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--or)}
.yt-mbar{display:none}
.yt-foot{text-align:center;font-size:12.5px;color:var(--sub2);padding:0 16px 30px}
.yt-foot a{color:var(--n);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* 결과 단계 */
.res-tbl .row span{min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

  .yt-head{height:56px;padding:0 16px}

  .yt-head h1{font-size:17px}
  .yt-rul{display:none}

  .yt-main{grid-template-columns:1fr;padding:12px 12px 110px;gap:14px}
  .yt-panel{padding:18px 16px;min-height:0}
  .yt-panel h2{font-size:21px}
  .yt-res{position:static}
  .yt-res.side{display:none}
  .yt-nav{display:none}
  .yt-mbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--n);color:#fff;padding:10px 14px calc(12px + env(safe-area-inset-bottom));align-items:center;gap:8px;z-index:30}
  .yt-mbar span{font-size:12.5px;color:#c8d0e0;display:block}
  .yt-mbar b{font-size:22px;font-weight:900;white-space:nowrap}
  .yt-mbar .bk{margin-left:auto;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:11px 12px;font-weight:800;font-size:14px}
  .yt-mbar .go{background:#fff;color:var(--n);border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;white-space:nowrap}
  .flow{flex-wrap:wrap}.flow .op{display:none}.fb{flex:1 1 40%}
  .edu{grid-template-columns:118px 1fr 32px}
  .kid .in{width:112px}
}
@media (min-width:900px){.yt-mrul{display:none}}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .yt-head,.yt-panel,.yt-mbar,.yt-mrul,.yt-foot,.noprint,.toast{display:none!important}
  .yt-main{display:block;padding:0}
  .yt-res{position:static;display:flex!important}
  .big,.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .printhead{display:block!important;font-size:18px;font-weight:800;margin-bottom:8px}
}

/* 블로그 경유 잠금 — 막힘 화면 */
.bj-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f7f6f2;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bj-gate-in{max-width:520px;text-align:center;background:#fff;border:1px solid #e7e5dc;border-radius:20px;padding:36px 30px;box-shadow:0 10px 30px rgba(25,84,85,.08)}
.bj-gate-mark{width:64px;height:64px;border-radius:18px;background:#0A1931;color:#fff;font:italic 800 34px/64px Georgia,serif;margin:0 auto 18px;position:relative}
.bj-gate-mark i{position:absolute;right:9px;bottom:10px;width:11px;height:11px;border-radius:50%;background:#f56d03}

.bj-gate p{font-size:15px;color:#5c6259;line-height:1.7;margin:0}
.bj-gate b{color:#20241f}
.bj-gate-btn{display:inline-block;margin:22px 0 16px;background:#f56d03;color:#fff;font-weight:700;text-decoration:none;border-radius:12px;padding:13px 26px;font-size:15.5px}
.bj-gate-s{font-size:12.5px!important;color:#8a8f84!important}
.bj-gate-s a{color:#0A1931;font-weight:700}
</style></head><body><div id="root"></div>
<script>/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev || (() => { try { return localStorage.getItem("bj-owner") === "1"; } catch (e) { return false; } })()) { embedOK = inFrame && (dev || fromBlog()); return true; }   /* 11-10: 주인 시험 모드 — 테스트 허브(jhub.html)에서 이 기기에 켠 경우만 */
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {

function tips(r) {
  const out = [], base = r.diffAll;
  const gain = patch => { const o = Object.assign({}, S, patch); return base - YT.calc(toInput(o), YEAR).diffAll; };
  /* 연금저축 · IRP */
  const ps = Math.min(S.pSavings, 6e6), room = 9e6 - Math.min(ps + S.pIrp, 9e6);
  if (S.salary > 0 && room > 0 && r.decided > 0) {
    const addS = Math.max(0, Math.min(6e6 - ps, room)), addI = room - addS;
    const g = gain({ pSavings: S.pSavings + addS, pIrp: S.pIrp + addI });
    if (g > 0) out.push([IC.up, `${addS ? "연금저축" : "IRP"}${addS && addI ? " · IRP" : ""}에 ${man(room)} 더 넣으면`, `한도 900만원까지 · ${S.salary <= 55e6 ? 15 : 12}% 세액공제${r.decided < room * 0.15 ? " · 낼 세금이 그보다 적어 일부만" : ""}`, "+" + won(g) + "원"]);
  }
  /* 카드 */
  const c = r.card;
  if (S.salary > 0 && c.total > 0 && c.total < c.min) out.push([IC.card, `카드 사용액이 총급여 25%까지 ${man(c.min - c.total)} 남음`, "그 전까지는 카드 공제 0원 — 혜택 많은 신용카드 쓰기", "공제 0원", true]);
  else if (S.credit >= 1e6 && c.basic < c.limitBasic) {
    const mv = Math.min(S.credit, 6e6), g = gain({ credit: S.credit - mv, debit: S.debit + mv });
    if (g > 0) out.push([IC.card, `신용카드 ${man(mv)}을 체크카드로 썼다면`, "체크카드 · 현금영수증은 공제율 30%(신용 15%)", "+" + won(g) + "원"]);
  } else if (c.basic >= c.limitBasic && c.extra < Math.min(c.limitExtra, c.possible - c.limitBasic)) {
    out.push([IC.card, "카드 기본 한도를 다 썼어요", "전통시장 · 대중교통 · 문화체육으로 쓴 만큼은 추가 한도로 더 공제", "추가 한도", true]);
  }
  /* 고향사랑기부 */
  if (r.decided > 0 && S.dnHome < 2e5) {
    const to = S.dnHome < 1e5 ? 1e5 : 2e5, g = gain({ dnHome: to });
    if (g > 0) out.push([IC.heart, `고향사랑기부 ${man(to - S.dnHome)} 더 하면`, to === 1e5 ? "10만원까지는 낸 만큼 거의 그대로(지방세 포함) + 답례품" : "10만~20만원 구간 공제율 40%(2026년부터)", "+" + won(g) + "원"]);
  }
  /* 월세 */
  if (S.salary > 0 && S.salary <= 8e7 && !S.rent) out.push([IC.home, "무주택 세대주가 월세를 낸다면", `연 1,000만원까지 ${S.salary <= 55e6 ? 17 : 15}% 세액공제 — 5단계에서 넣기`, "확인", true]);
  /* 의료비 */
  if (S.medSelf + S.medOther > 0 && r.credits.medical === 0 && !r.credits.standard) out.push([IC.med, `의료비가 총급여 3%(${man(S.salary * 0.03)})를 안 넘었어요`, "그 아래는 공제 0원 · 맞벌이면 소득이 적은 쪽이 받는 게 유리할 수 있어요", "공제 0원", true]);
  return out.slice(0, 4);
}

  <div class="row"><span>근로소득세액공제</span><b class="num">${won(cr.earned)}</b></div>
  ${cr.child + cr.birth ? `<div class="row"><span>자녀 · 출산</span><b class="num">${won(cr.child + cr.birth)}</b></div>` : ""}
  ${cr.marriage ? `<div class="row"><span>혼인</span><b class="num">${won(cr.marriage)}</b></div>` : ""}
  ${cr.pension ? `<div class="row"><span>연금계좌</span><b class="num">${won(cr.pension)}</b></div>` : ""}
  ${sp ? `<div class="row"><span>보험 · 의료 · 교육 · 기부</span><b class="num">${won(sp)}</b></div>` : ""}
  ${cr.rent ? `<div class="row"><span>월세</span><b class="num">${won(cr.rent)}</b></div>` : ""}
  ${cr.standard ? `<div class="row"><span>표준세액공제</span><b class="num">${won(cr.standard)}</b></div>` : ""}
  </div>`;
}
function tipsCard(r) {
  const t = S.salary ? tips(r) : [];
  return `<div class="card"><h3>더 돌려받는 방법</h3>${t.length ? t.map(([ic, a, b, g, info]) => `<div class="tip${info ? " info" : ""}"><div class="d">${ic}</div><p>${esc(a)}<br><small>${esc(b)}</small></p><b class="g num">${esc(g)}</b></div>`).join("") : `<p class="hint">값을 넣으면 연금저축 · 카드 · 기부로 환급을 늘리는 방법을 계산해 보여 드려요.</p>`}
  <p class="note">2026년 귀속(2027년 1월 연말정산) 기준 · 국세청 연말정산 안내의 계산식으로 계산 · 정확한 금액은 회사 연말정산 · 홈택스에서</p></div>`;
}
function stepRes(r) {
  const cr = r.credits, c = r.card;
  const L = (a, b, cls) => `<div class="row${cls ? " " + cls : ""}"><span>${a}</span><b class="num">${b}</b></div>`;
  return `<div class="yt-k">6 / 6 단계</div><h2>결과</h2><p class="yt-lead">원천징수영수증과 같은 순서로 계산 과정을 모두 보여 드려요.</p>
  <div class="res-tbl">
  ${L("총급여", won(r.salary))}${L("− 근로소득공제", won(r.earnedDed), "s")}${L("근로소득금액", won(r.earnedIncome))}
  ${L("− 인적공제", won(r.personal), "s")}${L("− 국민연금", won(r.pensionIns), "s")}${L("− 건강 · 고용보험", won(r.healthIns), "s")}
  ${r.housingLease + r.mortgage ? L("− 주택 대출", won(r.housingLease + r.mortgage), "s") : ""}${r.housingSaving ? L("− 주택청약저축", won(r.housingSaving), "s") : ""}
  ${L(`− 신용카드 등 <small class="hint">(25% 넘은 ${man(c.over)} · 한도 ${man(c.limitBasic)}${c.extra ? " + 추가 " + man(c.extra) : ""})</small>`, won(c.deduct), "s")}
  ${r.otherDed ? L("− 그 밖의 소득공제", won(r.otherDed), "s") : ""}${r.overCap ? L("+ 소득공제 종합한도(2,500만원) 넘은 금액", won(r.overCap), "s") : ""}
  ${L("과세표준", won(r.taxBase), "t")}${L("산출세액", won(r.tax))}
  ${L("− 근로소득세액공제", won(cr.earned), "s")}${cr.child ? L(`− 자녀세액공제(${kidInfo().credit}명)`, won(cr.child), "s") : ""}${cr.birth ? L("− 출산 · 입양", won(cr.birth), "s") : ""}${cr.marriage ? L("− 혼인세액공제", won(cr.marriage), "s") : ""}
  ${cr.pension ? L(`− 연금계좌(${Math.round(r.pensionRate * 100)}%)`, won(cr.pension), "s") : ""}${cr.insurance ? L("− 보험료", won(cr.insurance), "s") : ""}${cr.medical ? L("− 의료비", won(cr.medical), "s") : ""}${cr.edu ? L("− 교육비", won(cr.edu), "s") : ""}${cr.donation ? L("− 기부금", won(cr.donation), "s") : ""}${cr.rent ? L("− 월세", won(cr.rent), "s") : ""}${cr.standard ? L("− 표준세액공제", won(cr.standard), "s") : ""}
  ${L("결정세액(소득세)", won(r.decided), "t")}${L("− 이미 낸 소득세", won(r.paid), "s")}${L(r.diff <= 0 ? "소득세 돌려받음" : "소득세 더 냄", won(Math.abs(r.diff)))}
  ${L("지방소득세(결정세액 10%) − 이미 낸 지방소득세", (r.local - r.paidLocal === 0 ? "" : r.local - r.paidLocal < 0 ? "−" : "+") + won(Math.abs(r.local - r.paidLocal)))}
  ${L(r.diffAll <= 0 ? "모두 돌려받음" : "모두 더 냄", won(Math.abs(r.diffAll)) + "원", "t")}
  </div>
  <div class="box" style="margin-top:14px">계산에 넣지 않은 것: 중소기업 취업자 감면 · 외국납부세액 · 기부금 이월 · 세액공제 순서에 따른 차이. 이런 것이 있으면 실제 금액과 다를 수 있어요.</div>
  <div class="chips noprint" style="margin-top:4px"><button class="btn sm" data-print>인쇄 · PDF로 저장</button><button class="btn sm" data-reset>처음부터 다시</button></div>`;
}

/* ── 그리기 ── */
function stepHtml(r) { return [stepPay, stepFam, stepCard, stepSpend, stepSave, () => stepRes(r)][S.step](); }
function render(keepFocus) {
  const r = calcS();
  const isRes = S.step === 5;
  const rul = STEPS.map(([k, n], i) => `<button class="${i < S.step ? "done" : i === S.step ? "on" : ""}" data-go="${i}"><b></b>${n}</button>`).join("");
  const mrul = STEPS.map((x, i) => `<i class="${i <= S.step ? "d" : ""}"></i>`).join("");
  const nav = `<div class="yt-nav">${S.step ? `<button class="btn" data-prev>‹ 이전</button>` : ""}${isRes ? `<button class="btn pr" data-go="0">처음 단계로</button>` : `<button class="btn pr" data-next>다음: ${STEPS[S.step + 1][1]} ›</button>`}</div>`;
  $("#root").innerHTML = `<header class="yt-head"><div class="yt-ic">${IC.calc}<i></i></div><h1>연말정산 계산기</h1><small>Blog J</small><span class="yt-yr">2026년 귀속 · 2027년 1월 정산</span><nav class="yt-rul" aria-label="단계">${rul}</nav></header>
  <div class="yt-mrul">${mrul}</div>
  <div class="yt-main"><section class="yt-panel" id="panel">${stepHtml(r)}${nav}</section>
  <aside class="yt-res${isRes ? "" : " side"}" id="res">${resultCard(r)}<div class="grid2">${summary(r)}${tipsCard(r)}</div></aside></div>
  <div class="yt-mbar"><div><span>예상 · ${!S.salary ? "총급여를 넣어요" : r.diffAll <= 0 ? "돌려받아요" : "더 내요"}</span><b class="num" id="mb">${won(Math.abs(r.diffAll))}원</b></div>${S.step ? `<button class="bk" data-prev>‹</button>` : `<span style="margin-left:auto"></span>`}${isRes ? `<button class="go" data-print>인쇄</button>` : `<button class="go" data-next>다음 ›</button>`}</div>
  <p class="yt-foot">입력한 금액은 이 기기 브라우저에만 저장되고 어디로도 보내지 않아요 · 연말정산 계산기 v${APP_VER}(${BUILD} 판) · 만든 곳 <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a></p>`;
  if (keepFocus) { const el = document.getElementById(keepFocus.id) || (keepFocus.sel && document.querySelector(keepFocus.sel)); if (el) { el.focus(); try { el.setSelectionRange(keepFocus.pos, keepFocus.pos); } catch (e) {} } }
}
/* 입력할 때는 오른쪽 결과만 다시 그림(입력 칸은 그대로) */
function refreshResult() {
  const r = calcS();
  const res = $("#res"); if (res) res.innerHTML = `${resultCard(r)}<div class="grid2">${summary(r)}${tipsCard(r)}</div>`;
  const mb = $("#mb"); if (mb) { mb.textContent = won(Math.abs(r.diffAll)) + "원"; const sp = mb.previousElementSibling; if (sp) sp.textContent = "예상 · " + (!S.salary ? "총급여를 넣어요" : r.diffAll <= 0 ? "돌려받아요" : "더 내요"); }
}
function go(i, push) {
  S.step = Math.max(0, Math.min(5, i)); save(); render(); window.scrollTo(0, 0);
  if (push !== false) try { history.pushState({ yt: S.step }, "", location.href); } catch (e) {}
}
window.addEventListener("popstate", e => { const st = e.state && typeof e.state.yt === "number" ? e.state.yt : 0; S.step = st; save(); render(); window.scrollTo(0, 0); });

/* 금액 칸: 치는 대로 천 단위 쉼표 · 커서 위치 유지 */
function fmtMoney(el) {
  const raw = el.value, pos = el.selectionStart || 0;
  const digitsBefore = raw.slice(0, pos).replace(/\D/g, "").length;
  let d = raw.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 13);
  const v = d ? +d : 0; el.value = d ? (+d).toLocaleString("ko-KR") : "";
  let p = 0, seen = 0; while (p < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[p])) seen++; p++; }
  try { el.setSelectionRange(p, p); } catch (e) {}
  return v;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.m) { S[t.dataset.m] = fmtMoney(t); save(); refreshResult(); if (S.step === 2) cardBoxSoon(); return; }
  if (t.dataset.c) { const v = Math.min(20, +t.value.replace(/\D/g, "") || 0); t.value = v || ""; S[t.dataset.c] = v; save(); refreshResult(); return; }
  if (t.dataset.kid != null) { t.value = t.value.replace(/\D/g, "").slice(0, 4); S.kids[+t.dataset.kid].y = t.value; save(); refreshResult(); if (t.value.length === 4) { const id = { sel: `[data-kid="${t.dataset.kid}"]`, pos: 4 }; render(id); } return; }
  if (t.dataset.ea != null) { S.eduKids[+t.dataset.ea].a = fmtMoney(t); save(); refreshResult(); return; }
});
let cbT = null;
function cardBoxSoon() { clearTimeout(cbT); cbT = setTimeout(() => { const a = document.activeElement; const k = { id: a && a.id, pos: a && a.selectionStart }; render(k); }, 700); }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.et != null) { S.eduKids[+t.dataset.et].t = t.value; save(); refreshResult(); }
  if (t.dataset.sel) { S[t.dataset.sel] = +t.value; save(); refreshResult(); }
});
document.addEventListener("focusin", e => { const t = e.target; if (t.matches && t.matches("input.amt") && window.innerWidth < 900) setTimeout(() => t.scrollIntoView({ block: "center", behavior: "smooth" }), 250); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { const ins = [...document.querySelectorAll("#panel input")]; const i = ins.indexOf(e.target); if (i >= 0 && i < ins.length - 1) ins[i + 1].focus(); else e.target.blur(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go != null) return go(+b.dataset.go);
  if (b.hasAttribute("data-next")) return go(S.step + 1);
  if (b.hasAttribute("data-prev")) return history.state && typeof history.state.yt === "number" && history.state.yt === S.step && S.step > 0 ? history.back() : go(S.step - 1);
  if (b.dataset.ch) { S[b.dataset.ch] = JSON.parse(b.dataset.v); if (b.dataset.ch === "single" && S.single) S.woman = false; if (b.dataset.ch === "woman" && S.woman) S.single = false; save(); return render(); }
  if (b.dataset.more) { S[b.dataset.more] = !S[b.dataset.more]; save(); return render(); }
  if (b.hasAttribute("data-kadd")) { S.kids.push({ y: "" }); save(); render({ sel: `[data-kid="${S.kids.length - 1}"]`, pos: 0 }); return; }
  if (b.dataset.kdel != null) { S.kids.splice(+b.dataset.kdel, 1); save(); return render(); }
  if (b.hasAttribute("data-eadd")) { S.eduKids.push({ t: "school", a: 0 }); save(); render({ sel: `[data-ea="${S.eduKids.length - 1}"]`, pos: 0 }); return; }
  if (b.dataset.edel != null) { S.eduKids.splice(+b.dataset.edel, 1); save(); return render(); }
  if (b.hasAttribute("data-print")) { if (S.step !== 5) go(5); setTimeout(() => window.print(), 120); return; }
  if (b.hasAttribute("data-reset")) { if (!confirmReset()) return; S = BLANK(); try { localStorage.removeItem(LSK); } catch (er) {} go(0); toast("입력한 값을 모두 지웠어요"); }
});
let rsT = 0;
function confirmReset() { const n = Date.now(); if (n - rsT < 4000) return true; rsT = n; toast("한 번 더 누르면 입력한 값을 모두 지워요"); return false; }
function toast(t) { const o = document.querySelector(".toast"); if (o) o.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* 시작 — 블로그 경유 잠금(대표 글 공개 시각부터) */
const GATE_ON = false;   /* 대표 글 날짜가 정해지면 Date.now() >= Date.parse("…") 로 */
(async () => {
  const T = new URLSearchParams(location.search).get("tab") || "all";
  if (GATE_ON && !(await BJ_GATE.check(TOOL, T))) return;
  try { history.replaceState({ yt: S.step }, "", location.href); } catch (e) {}
  render();
})();

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알림 */
(function () { if (!EMBED || window.parent === window) return;
  let last = 0, t = null;
  function send() { const r = document.getElementById("root"); if (!r) return; const h = Math.ceil(r.getBoundingClientRect().height) + 8; if (Math.abs(h - last) < 4) return; last = h; try { window.parent.postMessage({ blogj: "height", h }, "https://luvbong.tistory.com"); } catch (e) {} }
  function soon() { clearTimeout(t); t = setTimeout(send, 60); }
  if (window.ResizeObserver) new ResizeObserver(soon).observe(document.getElementById("root"));
  window.addEventListener("load", send); setTimeout(send, 300);
})();
</script>
</body></html>
