<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b3d4a">
<title>테스트 허브 | Blog J</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/hub/jhub-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/hub/jhub-64.png">
<link rel="apple-touch-icon" href="icons/hub/jhub-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{--bg:#faf6ee;--in:#f3eee3;--card:#fff;--ink:#14202b;--sub:#5f6b7a;--sea:#0c737d;--seah:#0a5c66;--seal:#eef6f7;--deep:#0b3d4a;--sky:#2b5fa0;--sun:#e07a4f;--sunt:#b4532a;--hair:rgba(20,32,43,.12);--hair2:rgba(20,32,43,.2)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:SUIT,"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
/* 머리띠 */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding:12px 16px 14px;box-shadow:0 2px 10px rgba(11,61,74,.25)}
.top-in{max-width:1680px;margin:0 auto}
.tr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:block}
.tt{font-weight:900;font-size:19px;letter-spacing:-.3px}
.tt small{font-weight:600;font-size:12.5px;color:#cfe3e6;margin-left:8px;letter-spacing:0}
.sp{flex:1}
.owner{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13.5px;font-weight:800;color:#fff}
.owner .dot{width:9px;height:9px;border-radius:50%;background:#9aa6ad}
.owner.on{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px #7fd0d6}
.owner.on .dot{background:#6fe0a0}
.qw{position:relative;margin-top:12px}
.qw svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round}
.q{width:100%;padding:14px 16px 14px 46px;border-radius:12px;border:0;background:#fff;font:inherit;font-size:16px;outline:none;color:var(--ink)}
.q:focus{box-shadow:0 0 0 3px rgba(127,208,214,.6)}
/* 몸통 */
.body{max-width:1680px;margin:0 auto;padding:16px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1900px){.body,.top-in,.foot{max-width:1880px}.body{grid-template-columns:420px minmax(0,1fr)}}
.side{position:sticky;top:calc(var(--toph,128px) + 12px);max-height:calc(100vh - var(--toph,128px) - 24px);overflow:auto;background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--hair);padding:8px}
.grp{border-top:1px solid var(--hair)}
.grp:first-child{border-top:0}
.gh{width:100%;display:flex;align-items:center;gap:8px;padding:11px 10px;font-size:13px;font-weight:900;color:var(--sub);text-align:left;border-radius:10px}
.gh:hover{background:var(--in)}
.gh .ar{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s;flex-shrink:0}
.grp.shut .gh .ar{transform:rotate(-90deg)}
.gh .cn{margin-left:auto;font-size:12.5px;font-weight:700}
.gh.dev{color:var(--sunt)}
.grp.shut .gl{display:none}
.it{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-align:left;min-width:0}
.it:hover{background:var(--in)}
.it.on{background:var(--sea);color:#fff}
.it.on .iv,.it.on .ip{color:#d6eef0}
.ii{width:30px;height:30px;border-radius:8px;flex-shrink:0;object-fit:cover;background:var(--deep)}
.il{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;background:#8b97a3}
.it.on .il{background:rgba(255,255,255,.25)}
.in{flex:1;min-width:0;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv{font-size:12.5px;color:var(--sub);font-weight:700}
.ip{font-size:12.5px;color:var(--sub);font-weight:700;min-width:26px;text-align:right}
.it .tdo{width:7px;height:7px;border-radius:50%;background:var(--sun);flex-shrink:0}
.gh.fav{color:#b4532a}
.gh .gc{width:11px;height:11px;border-radius:3px;flex-shrink:0;box-shadow:inset 0 0 0 1.5px #0B3D4A}
.fs{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;flex-shrink:0;color:#a7b0b9}
.fs svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.fs:hover{background:rgba(20,32,43,.08);color:#e07a4f}
.fs.on{color:#e07a4f}.fs.on svg{fill:currentColor}
.it.on .fs{color:#d6eef0}.it.on .fs.on{color:#ffd2bd}
.hfs{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13.5px;font-weight:800;box-shadow:0 0 0 1px var(--hair2);color:var(--sub);white-space:nowrap}
.hfs svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.hfs.on{color:#b4532a;box-shadow:0 0 0 1.5px #e07a4f;background:#fdf1ea}.hfs.on svg{fill:#e07a4f;stroke:#e07a4f}
.side .none{padding:20px;color:var(--sub);font-size:14px;text-align:center}
/* 메인 카드 */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--hair);padding:20px 22px;min-width:0}
.hd{display:flex;gap:16px;align-items:flex-start}
.hd .big{width:64px;height:64px;border-radius:16px;flex-shrink:0;object-fit:cover;background:var(--deep)}
.hd .bigl{width:64px;height:64px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:26px;color:#fff;background:#8b97a3}
.hd h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ver{font-size:13px;font-weight:800;color:var(--sea);background:var(--seal);border-radius:7px;padding:3px 9px}
.tag{font-size:12.5px;font-weight:800;border-radius:7px;padding:3px 9px;background:var(--in);color:var(--sub)}
.tag.soon{background:#fff3dc;color:#8a4a0e}
.tag.dev{background:#fbe9e1;color:var(--sunt)}
.tag.pub{background:#e4f2e8;color:#1e6b3a}
.desc{margin:8px 0 0;font-size:15.5px;line-height:1.65;color:#2a3540}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns a{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:10px;font-size:14px;font-weight:800;text-decoration:none;background:#fff;box-shadow:0 0 0 1px var(--hair2)}
.btns a:hover{box-shadow:0 0 0 1.5px var(--sea);color:var(--sea)}
.btns a.pri{background:var(--sea);color:#fff;box-shadow:none}
.btns a.pri:hover{background:var(--seah);color:#fff}
.btns a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gate{font-size:12.5px;color:var(--sunt);margin-top:8px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.ct{margin:0 0 12px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.ct span{font-size:12.5px;font-weight:700;color:var(--sub)}
.ct .tl{color:var(--sunt)}
.info{width:100%;border-collapse:collapse;font-size:14px}
.info th{width:108px;text-align:left;font-weight:800;color:var(--sub);padding:8px 10px 8px 0;vertical-align:top;font-size:13.5px}
.info td{padding:8px 0;border-top:0;line-height:1.55;word-break:break-word}
.info tr+tr th,.info tr+tr td{border-top:1px solid var(--hair)}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.feat li{position:relative;padding-left:16px;font-size:14px;line-height:1.55}
.feat li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;background:var(--sea)}
.todos{display:flex;flex-wrap:wrap;gap:6px}
.todo{padding:6px 10px;border-radius:8px;font-size:13.5px;font-weight:700;color:#8a4a0e;background:#fff3dc;box-shadow:inset 0 0 0 1px #f0cf95}
.memo{font-size:14px;line-height:1.65;color:#2a3540;padding-left:12px;border-left:3px solid var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{padding:7px 11px;border-radius:9px;font-size:13.5px;font-weight:700;text-decoration:none;background:var(--in)}
.chips a:hover{background:var(--seal);color:var(--sea)}
/* 글 목록 */
.pl{border-top:1px solid var(--hair)}
.pr{display:grid;grid-template-columns:52px minmax(0,1fr) 62px 128px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--hair);text-decoration:none;font-size:14px}
.pr:hover{background:var(--seal)}
.pr .pn{font-weight:900;color:var(--sea)}
.pr .pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pr .pt b{font-size:11.5px;font-weight:800;color:#fff;background:var(--sea);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.ps{font-size:12.5px;font-weight:800;text-align:center;border-radius:6px;padding:2px 0}
.ps.P{color:#1e6b3a;background:#e4f2e8}
.ps.R{color:#8a4a0e;background:#fff3dc}
.pd{font-size:13px;color:var(--sub);text-align:right}
.empty{color:var(--sub);font-size:14px;padding:6px 0}
.foot{max-width:1680px;margin:0 auto;padding:0 16px 40px;font-size:12.5px;color:var(--sub);text-align:center;line-height:1.7}
.mtog{display:none}
@media (max-width:1100px) and (min-width:901px){.body{grid-template-columns:300px minmax(0,1fr)}}
@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .gl{display:grid;grid-template-columns:1fr 1fr;gap:2px 4px;padding-bottom:6px}
  .it{padding:6px 8px;gap:8px}.ii,.il{width:26px;height:26px}.in{font-size:13.5px}.iv,.ip{display:none}
  .cols{grid-template-columns:1fr}
}
@media (max-width:560px){
  .tt small{display:block;margin:2px 0 0}
  .owner{padding:7px 10px;font-size:12.5px}
  .card{padding:16px}
  .hd .big,.hd .bigl{width:52px;height:52px}
  .hd h1{font-size:20px}
  .pr{grid-template-columns:44px minmax(0,1fr) 54px;row-gap:2px}
  .pr .pd{grid-column:2/4;text-align:left;font-size:12.5px}
}
</style>
</head>

const icon = (a, big) => a.ic ? `<img class="${big ? "big" : "ii"}" src="${esc(U(a.ic))}" alt="" loading="lazy">` : `<span class="${big ? "bigl" : "il"}">${esc(a.n.trim()[0])}</span>`;

  }
