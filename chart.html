:root{--bg:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f1efe8;--line:#e7e5dc;--line2:#d7d4c8;--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--brand-ink:#20263a;--brand-accent:#e08a3e;--cat:#1f7f8f;--catbg:#e3f3f5;--success:#2e8a58;--danger:#b84a3c;
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
#root{padding:1px 0}
.app{max-width:1280px;margin:0 auto;padding:20px 20px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--cat);color:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--sh1)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--catbg);color:var(--cat)}
.brand .ver{font-family:var(--font);font-size:11px;color:var(--ink3);font-weight:500}
.lay{display:grid;grid-template-columns:420px minmax(0,1fr);gap:18px;align-items:start}
.lay>*{min-width:0}
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh1)}
.step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-h .num{width:28px;height:28px;border-radius:9px;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:13px;flex-shrink:0}
.step h3{font-family:var(--head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500;color:var(--ink3)}
.inp,select.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:14px}
.inp:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.dd2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dd2>*{min-width:0}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.types button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:12px;font-weight:700;color:var(--ink2)}
.types button:hover{background:var(--hover)}
.types button.on{border-color:var(--brand-ink);background:var(--brand-ink);color:#fff}
.types.big{grid-template-columns:1fr 1fr;gap:8px}
.types.big button{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding:14px;font-size:14px;border-radius:14px}
.types.big button>svg{flex-shrink:0}
.types.big button b{display:block;font-family:var(--head);font-size:15px;font-weight:800}
.types.big button span{display:block;font-size:12.5px;font-weight:500;color:var(--ink3);margin-top:2px;line-height:1.35}
.types.big button.on span{color:#cfd3e0}
.types.big .tx{min-width:0}
.types.big button:last-child{grid-column:1/-1}
.wz{display:flex;align-items:center;gap:6px;margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--sh1);width:fit-content;max-width:100%}
.wz-b{flex:1 1 auto;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:999px;border:0;background:none;font-size:13.5px;font-weight:700;color:var(--ink3);min-width:0}
.wz-b .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--ink3);font-family:var(--head);font-size:12.5px;flex-shrink:0}
.wz-b.on{background:var(--brand-ink);color:#fff}.wz-b.on .num{background:var(--brand-accent);color:#fff}
.wz-b.done{color:var(--ink)}.wz-b.done .num{background:var(--brand-ink);color:#fff}
.wz-b:hover:not(.on){background:var(--hover)}
.wz-sep{width:14px;height:2px;background:var(--line2);flex-shrink:0}
.wz-nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wz-nav .btn{min-width:110px}
.og{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.og>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px}
.og>summary::-webkit-details-marker{display:none}
.og>summary:hover{background:var(--hover)}
.og>summary b{font-family:var(--head);font-size:14.5px;font-weight:800;flex-shrink:0}
.og>summary span{font-size:12.5px;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    if (S.pieLabel !== "none" && pc >= (S.pieLabel === "out" ? 2 : 5)) {

/* 새 버전 알림 */
(function () {
  if (location.protocol === "file:") return;
  var KEY = window.BJ_TOOL_KEY, CUR = window.BJ_TOOL_VER; if (!KEY || !CUR) return;
  var newer = function (a, b) { var x = String(a).split("."), y = String(b).split("."); for (var i = 0; i < 3; i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d) return d > 0; } return false; };
  fetch("versions.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    var v = j && j[KEY]; if (!v || !v.latest || !newer(v.latest, CUR) || !/^https:\/\/luvbong\.tistory\.com\//.test(v.post || "")) return;
    try { if (sessionStorage.getItem("bjvn:" + KEY + v.latest)) return; } catch (e) {}
    var bar = document.createElement("div"); bar.className = "bj-vnote";
    bar.innerHTML = '<span class="dot"></span><span class="t"><b>새 버전 v' + String(v.latest).replace(/[^0-9.]/g, "") + '</b>이 나왔어요' + (v.note ? ' — ' + String(v.note).replace(/[<>&"]/g, "") : "") + '</span><a target="_top" rel="noopener">새 버전 보기 ›</a><button aria-label="닫기">×</button>';
    bar.querySelector("a").href = v.post;
    bar.querySelector("button").onclick = function () { bar.remove(); try { sessionStorage.setItem("bjvn:" + KEY + v.latest, "1"); } catch (e) {} };
    document.body.insertBefore(bar, document.body.firstChild);
  }).catch(function () {});
})();
</script></body></html>
