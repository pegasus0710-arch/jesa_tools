:root{--bg:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f1efe8;--line:#e7e5dc;--line2:#d7d4c8;--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--brand-ink:#20263a;--brand-accent:#e08a3e;--cat:#6b4fa0;--catbg:#efe9f7;--success:#2e8a58;--danger:#b84a3c;
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.app{max-width:1200px;margin:0 auto;padding:20px 20px 40px;min-height:100vh}
.app.embed{padding:14px 14px 20px;min-height:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--cat);color:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--sh1)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--catbg);color:var(--cat)}
.brand .ver{font-family:var(--font);font-size:11px;color:var(--ink3);font-weight:500}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:18px;align-items:start}
.lay>*{min-width:0}
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh1)}
.step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-h .num{width:28px;height:28px;border-radius:9px;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:13px;flex-shrink:0}
.step h3,.res-h h3{font-family:var(--head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500;color:var(--ink3)}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:15px}
input[type=number]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip:hover{background:var(--hover)}.chip.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand-ink)}
input[type=range]{width:100%;accent-color:var(--brand-ink);margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}
.qv{font-family:var(--head);font-size:15px;color:var(--brand-ink);margin-left:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:10px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-ink);color:var(--ink2);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:12px}
.note.w{border-left-color:var(--brand-accent);background:#fffaf2;color:#6b4a12}
.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--bg);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--ink2);transition:.12s}
.drop:hover,.drop.on{border-color:var(--brand-ink);background:#fff;color:var(--brand-ink)}
.drop b{font-size:15px;color:var(--ink)}.drop span{font-size:12.5px;color:var(--ink3)}
.col-r{position:sticky;top:16px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.lnk{color:var(--ink3);font-size:12.5px;font-weight:700}.lnk:hover{color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0;color:var(--ink3);font-size:13.5px;border:1.5px dashed var(--line2);border-radius:12px;margin-bottom:14px}
.list{list-style:none;max-height:420px;overflow-y:auto;margin:0 -4px 14px;padding:0 4px}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.th{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--tint);flex-shrink:0;border:1px solid var(--line)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta>b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>span{font-size:12px;color:var(--ink3)}.meta .res{color:var(--ink);font-weight:700}.arr{color:var(--ink3);margin:0 2px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:2px}
.tag.g{background:#e7f4ec;color:var(--success)}.tag.n{background:var(--tint);color:var(--ink2)}.tag.e{background:#fbece8;color:var(--danger)}
.acts{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-btn);font-weight:700;border:1px solid transparent;white-space:nowrap}
.btn.s{padding:6px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:#fff;border-color:var(--line2);color:var(--ink2)}.btn.ghost:hover{background:var(--hover)}
.btn.p{background:var(--brand-ink);color:#fff}.btn.p:hover{background:#343d5c}
.btn.accent{background:var(--brand-accent);color:#fff}.btn.accent:hover{background:#c9762f}
.btn:disabled{background:#eceae2;color:var(--ink3);cursor:default}
.btn.w{width:100%}.btn.big{padding:14px;font-size:15px;font-family:var(--head);border-radius:12px}
.sumr{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13.5px;color:var(--ink2)}
.sumr b{color:var(--ink)}.sumr b.g{color:var(--success);font-family:var(--head)}
.priv{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.priv svg{flex-shrink:0;margin-top:1px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92vw;box-shadow:var(--sh);z-index:50}
.foot{margin-top:22px;padding:16px 0 4px;text-align:center;font-size:11.5px;color:var(--ink3)}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}
@media(max-width:1000px){.lay{grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px}.step{padding:18px}.flow li{font-size:11px;padding:6px}.flow li span{width:16px;height:16px}}
@media(max-width:700px){.lay{grid-template-columns:1fr}.col-r{position:static}}
@media(max-width:640px){.app{padding:12px 12px 30px}.step{padding:18px}.seg button{font-size:12.5px;padding:8px 4px}}

/* ── 쓰기 연습장 ── */
.lay{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:15px;resize:vertical;outline:none;line-height:1.6}
textarea:focus,input[type=text]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:15px;outline:none}
.seg button.dis{opacity:.45;cursor:not-allowed;font-weight:600}
.col-r{position:sticky;top:12px}
.pv-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pv-tools .btn{padding:8px 12px;font-size:13px}
.numin{display:flex;gap:4px;margin-left:auto}.numin input{width:110px;padding:7px 10px;font-size:13px}
.pv-meta{font-size:12.5px;color:var(--ink3);margin:10px 0}.pv-meta b{color:var(--ink)}
.sheets{background:#e9e7df;border-radius:12px;padding:8px;max-height:72vh;overflow:auto;margin-bottom:14px}
.scaler{transform-origin:top left;width:210mm}
.loading{padding:40px;text-align:center;color:var(--ink3);font-size:14px;width:180mm}
.page{width:210mm;height:297mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);margin-bottom:16px;padding:11mm 12mm 10mm;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;color:#20241f;font-family:"BJ-NanumGothic","Pretendard",sans-serif}
.ph{height:21mm;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:0.5mm solid #20263a;padding-bottom:2mm;box-sizing:border-box;flex-shrink:0}
.pt{display:flex;flex-direction:column;gap:1.2mm}.pt b{font-size:7.2mm;letter-spacing:-.2mm}.pt span{font-size:3.1mm;color:#8a8f84}
.pn{display:flex;align-items:flex-end;gap:2mm;font-size:3.6mm;color:#5c6259;padding-top:4mm}.pn i{display:inline-block;width:32mm;border-bottom:0.3mm solid #8a8f84;height:5mm}.pn i.d{width:26mm}
.pb{flex:1;padding-top:4mm;overflow:hidden}
.pf{height:7mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:2.9mm;color:#a0a39a;flex-shrink:0}
.kb{position:relative}.qn{position:absolute;left:-7mm;top:0.5mm;width:5.5mm;text-align:right;font-size:3.4mm;font-weight:700;color:#5c6259}
.krow{display:flex;justify-content:center}
.kc{border:0.25mm solid #b9bfd3;margin-left:-0.25mm;position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex-shrink:0}
.kc.x::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:0.2mm dashed #d7dbe7}
.kc.x::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:0.2mm dashed #d7dbe7}
.kc span{position:relative;z-index:1;line-height:1}
.eb{position:relative}.elab{font-size:3.6mm;color:#5c6259;display:flex;align-items:flex-end;gap:1.5mm}.elab b{color:#20241f}
.ans h4{font-size:6mm;margin-bottom:5mm}.ans ol{columns:2;column-gap:12mm;padding-left:7mm;font-size:4.4mm;line-height:1.9}.ans li span{color:#8a8f84;font-size:3.6mm}
@media(max-width:1000px){.lay{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}}
@media(max-width:700px){.lay{grid-template-columns:1fr}.col-r{position:static}}
.app.embed .sheets{max-height:780px}
@media(max-width:700px){.app.embed .sheets{max-height:520px}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  .app{padding:0!important;max-width:none!important;min-height:0!important}
  .top,.col-l,.pv-tools,.pv-meta,.res-card>.btn,.priv,.foot,.toast{display:none!important}
  .lay{display:block!important}.col-r{position:static!important}
  .res-card{border:0!important;box-shadow:none!important;padding:0!important;background:none!important}
  .sheets{background:none!important;padding:0!important;max-height:none!important;overflow:visible!important;margin:0!important;border-radius:0!important}
  .scaler{transform:none!important;height:auto!important}
  .page{box-shadow:none!important;margin:0!important;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function koRows(item, kind, o) {

    if (row.length && row.length + need > cols) { while (row.length < cols) row.push(null); rows.push(row); row = []; }

/* 영어 4줄: 낱말·문장을 줄 배열로 */
function enRows(item, kind, o) {

  }

          <label class="chk"><input type="checkbox" checked=${s.test} onChange=${e => up("test", e.target.checked)} /> 시험지 모드 <span class="muted">${kind === "glyph" ? "흐린 글씨 없이 보고 쓰기" : s.lang === "en" ? "한글 뜻만 보고 쓰기" : "받아쓰기(빈칸)"}</span></label>
          ${s.test && kind !== "glyph" && html`<label class="chk"><input type="checkbox" checked=${s.answer} onChange=${e => up("answer", e.target.checked)} /> 마지막 쪽에 정답지</label>`}
        </${Step}>
      </div>
      <div class="col-r"><div class="res-card">
        <div class="pv-tools">
          <button class="btn ghost" disabled=${s.useCustom} onClick=${next}>${h(Icon, { name: "repeat", size: 16 })} 다른 연습장</button>
          <button class="btn ghost" onClick=${today}>${h(Icon, { name: "calendar", size: 16 })} 오늘의 연습장</button>
          <div class="numin"><input type="text" inputmode="numeric" placeholder=${"번호 " + (s.useCustom ? "37-2" : no)} value=${numIn} onInput=${e => setNumIn(e.target.value)} onKeyDown=${e => e.key === "Enter" && goNum()} /><button class="btn s ghost" onClick=${goNum}>불러오기</button></div>
        </div>
        <p class="pv-meta"><b>연습장 ${no}</b> · ${total}쪽 · 같은 번호를 넣으면 같은 연습장이 다시 나와요</p>
        <div class="sheets" ref=${wrap}><div class="scaler" style=${{ transform: `scale(${scale})`, height: (total * (PAGE_H * 3.7795 + 16)) * scale + "px" }}>
          ${!ready ? html`<p class="loading">글꼴을 불러오는 중…</p>` : !items.length ? html`<p class="loading">${s.useCustom ? "연습할 글을 한 줄에 하나씩 넣어 주세요" : "글감이 없어요"}</p>`
            : [...pages.map((p, i) => html`<${Page} blocks=${p} o=${o} n=${i + 1} total=${total} meta=${meta} />`), showAnswer ? html`<${Page} o=${o} n=${total} total=${total} meta=${meta} answer=${items} />` : null]}
        </div></div>
        <button class="btn accent w big" disabled=${!items.length} onClick=${() => window.print()}>${h(Icon, { name: "printer", size: 18 })} 인쇄 · PDF로 저장</button>
        <p class="priv">${h(Icon, { name: "info", size: 15, color: "#5c6259" })} 인쇄 창에서 <b>대상: PDF로 저장</b>을 고르면 파일로 받을 수 있어요. 여백은 <b>기본값</b>, 배율은 <b>100%</b>로 두세요.</p>
      </div></div>
    </div>
    ${toast && html`<div class="toast">${toast}</div>`}
    ${!EMBED && html`<div class="foot">Copyright © <a href="https://luvbong.tistory.com/" target="_blank" rel="noopener">Blog J</a> | All Rights Reserved</div>`}
  </div>`;
}
render(html`<${App} />`, document.getElementById("root"));


/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알려 iframe 높이를 자동으로 맞춤 */
(function(){ if(!EMBED || window.parent===window) return;
  var last=0, t=null;
  function send(){ var r=document.getElementById("root"); if(!r) return;
    var h=Math.ceil(r.getBoundingClientRect().height)+8;
    if(document.querySelector(".edws")) h=Math.max(h,900);   /* 큰 화면 편집 중엔 넉넉하게 */
    if(Math.abs(h-last)<4) return; last=h;
    try{ window.parent.postMessage({blogj:"height",h:h},"https://luvbong.tistory.com"); }catch(e){} }
  function soon(){ clearTimeout(t); t=setTimeout(send,60); }
  if(window.ResizeObserver){ new ResizeObserver(soon).observe(document.getElementById("root")); }
  new MutationObserver(soon).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("load",send); setTimeout(send,300);
})();

</script></body></html>
