<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엑셀 수식 노트 | Blog J</title>
<meta name="description" content="하고 싶은 일로 엑셀 함수를 찾고, 예시 표에서 직접 바꿔 보고, 내 표 칸 주소로 수식을 만들어 복사하는 무료 앱">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B3D4A">
<link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>@font-face{font-family:"SUIT Variable";src:url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--sand:#FAF6EE;--sand2:#F3EEE3;--proof:#F0EADF;--cloud:#fff;--line:#CDD3DC;--ink:#14202B;--sub:#5F6B7A;--sea:#0C737D;--sea2:#0A5C66;--sealt:#EEF6F7;--deep:#0B3D4A;--deepsub:#CFE3E6;--sky:#2B5FA0;--glow:#E07A4F;--red:#C23A2B;--redlt:#FBECEA;
 --a1:#2B5FA0;--a2:#0C737D;--a3:#6B4FA0;--a4:#9A5B13;--hair:rgba(20,32,43,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"SUIT Variable","SUIT","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:var(--sky)}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
/* 머리띠 */
.top{background:var(--deep);color:#fff;position:sticky;top:0;z-index:40}
.tin{max-width:1440px;margin:0 auto;padding:12px 24px 14px}
.row{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:block}
.ttl{font-size:20px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.ttl small{font-size:12.5px;font-weight:500;color:var(--deepsub);margin-left:8px}
.sp{flex:1}
.hb{display:flex;align-items:center;gap:6px;height:38px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:0 13px;font-size:14px;font-weight:700;white-space:nowrap}
.hb:hover{background:rgba(255,255,255,.22)}
.hb svg{width:18px;height:18px}
.ver{height:38px;background:#fff;color:var(--ink);border-radius:10px;padding:0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ver .vl{color:var(--sub);font-weight:600}.ver .vs{display:none}
.sbox{margin-top:12px;position:relative}
.sbox input{color:var(--ink);caret-color:var(--ink);width:100%;height:52px;border-radius:13px;border:0;background:#fff;padding:0 48px 0 46px;font-size:16.5px;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.sbox input:focus{box-shadow:0 0 0 3px #7fc4cb,0 2px 10px rgba(0,0,0,.18)}
.sbox input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.sbox .mg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--sub)}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}
.sbox .clr:hover{background:var(--sand2)}
.chips{margin-top:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--deepsub)}
.chips button{background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.chips button:hover{background:rgba(255,255,255,.26)}
/* 판 */
.wrap{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:18px;padding:18px 24px 48px;align-items:start}
.pan{background:var(--cloud);border:1px solid var(--line);border-radius:14px;padding:10px}
.left{position:sticky;top:var(--toph,150px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - var(--toph,150px) - 12px)}
.left .pan{overflow:auto}
.left .pan.nav{flex-shrink:0;overflow:visible}
.left .pan.fl{flex:1;min-height:120px}
.nav button{padding:6px 10px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.nav button b{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--sub)}
.nav button:hover{background:var(--sand2)}
.nav button.on{background:var(--sea);color:#fff}
.nav button.on b{color:#d8eef0}
.ico{width:26px;height:26px;border-radius:7px;background:var(--sealt);color:var(--sea);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.ico.err{background:var(--redlt);color:var(--red)}
.ico.star{background:#FDF0E8;color:var(--glow)}
.on .ico{background:rgba(255,255,255,.18);color:#fff}
.hr{height:1px;background:var(--line);margin:8px 6px}
.subh{font-size:12.5px;color:var(--sub);font-weight:700;padding:6px 10px 4px}
.fl button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:14px;width:100%;text-align:left}
.fl button:hover{background:var(--sand2)}
.fl button.on{background:var(--sealt);box-shadow:inset 3px 0 0 var(--sea);font-weight:800;color:var(--sea2)}
.fl button i{font-style:normal;font-size:12px;color:var(--sub);white-space:nowrap}
.fl button i.no{color:var(--red)}
/* 카드 */
.card{background:var(--cloud);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ch{padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.crumb{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:8px}
.tools{display:flex;gap:6px;margin-left:auto}
.tb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:700;background:#fff;white-space:nowrap}
.tb:hover{border-color:var(--sea);color:var(--sea2)}
.tb.on{background:#FDF0E8;border-color:#F2C9B2;color:#A04A22}
.tb svg{width:16px;height:16px}
.fn{display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}
.fn h1{margin:0;font-size:28px;letter-spacing:.2px;line-height:1.2}
.fn .one{font-size:16px;font-weight:600;line-height:1.5}
.badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bd{font-size:12.5px;border-radius:7px;padding:4px 9px;background:var(--sand2);font-weight:700}
.bd.ok{background:var(--sealt);color:var(--sea2)}
.bd.no{background:var(--redlt);color:var(--red)}
.sec{padding:16px 22px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:15.5px}
.syn{font-size:17px;font-weight:700;background:var(--sand2);border-radius:10px;padding:12px 14px;line-height:1.6;word-break:keep-all}
.c1{color:var(--a1)}.c2{color:var(--a2)}.c3{color:var(--a3)}.c4{color:var(--a4)}
.args{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin-top:12px;font-size:14px;line-height:1.5}
.args b{font-weight:800;white-space:nowrap}
.opt{font-size:11.5px;color:var(--sub);font-weight:700;border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px}
.verwarn{margin:12px 0 0;background:var(--redlt);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;color:#7a2a20}
.verwarn b{color:var(--red)}
.verwarn code{background:#fff;border-radius:6px;padding:2px 6px;font-family:inherit;font-weight:700;color:var(--ink);word-break:break-all}
/* 직접 해 보기 */
.try{background:var(--proof);padding:16px 22px 18px;border-bottom:1px solid var(--line)}
.tryh{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tryh h3{margin:0;font-size:15.5px}
.tryh .note{font-size:12.5px;color:var(--sub)}
.fx{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}
.fx:focus-within{border-color:var(--sea);box-shadow:0 0 0 2px rgba(12,115,125,.18)}
.fx .nm{padding:10px 12px;border-right:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--sub);min-width:58px;text-align:center;flex-shrink:0}
.fxe{position:relative;flex:1;min-width:0}
.fxe textarea,.fxe .mir{display:block;width:100%;margin:0;border:0;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.5;font-family:inherit;white-space:pre-wrap;word-break:break-all;letter-spacing:0;font-variant-numeric:tabular-nums}
.fxe textarea{position:absolute;inset:0;background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;overflow:hidden}
.fxe .mir{color:var(--ink);pointer-events:none;min-height:42px}
.fxe .mir .r1{color:var(--a1)}.fxe .mir .r2{color:var(--a2)}.fxe .mir .r3{color:var(--a3)}.fxe .mir .r4{color:var(--a4)}
.fxe .mir .s{color:#9A5B13}
.fxe textarea::selection{background:rgba(43,95,160,.25);color:transparent}
.gridw{overflow:auto;border-radius:6px;-webkit-overflow-scrolling:touch;max-width:100%}
.sheet{border-collapse:collapse;background:#fff;font-size:14px;font-variant-numeric:tabular-nums;table-layout:fixed}
.sheet th{background:#EEF0F2;color:var(--sub);font-weight:700;font-size:12.5px;border:1px solid #D7DCE2;padding:3px 6px;user-select:none}
.sheet th.rh{width:34px}
.sheet th.hl{background:#DCE9EB;color:var(--sea2)}
.sheet td{border:1px solid #DDE1E6;padding:6px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;height:34px;position:relative}
.sheet td.n{text-align:right}
.sheet td.b{text-align:center}
.sheet td.e{color:var(--red);font-weight:700;text-align:center}
.sheet tr.h td{font-weight:800;background:#F7F8F9}
.sheet td.fm{font-weight:800}
.sheet td.sel{outline:2px solid var(--ink);outline-offset:-2px}
.sheet td.res{outline:2px solid #1F6E3C;outline-offset:-2px}
.sheet td.res.sel{outline:2.5px solid #1F6E3C}
.sheet td.spill{background:#F4FAF6}
.sheet td.spb{box-shadow:inset 0 0 0 1px #6FA88A}
.sheet td.g1{background:rgba(43,95,160,.10)}.sheet td.g2{background:rgba(12,115,125,.11)}.sheet td.g3{background:rgba(107,79,160,.11)}.sheet td.g4{background:rgba(154,91,19,.11)}
.trys{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:13px}
.trys>span{color:var(--sub);font-weight:700}
.trys button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;text-align:left;line-height:1.4}
.trys button:hover{border-color:var(--sea)}
.trys button b{color:var(--sea2)}
.why{margin-top:10px;font-size:13.5px;line-height:1.55;background:#fff;border-radius:8px;padding:8px 11px;border-left:3px solid var(--red)}
.why.ok{border-left-color:#1F6E3C}
.why b{color:var(--red)}
.why.ok b{color:#1F6E3C}
.two{display:grid;grid-template-columns:1fr 1fr}
.two>.sec+.sec{border-left:1px solid var(--line)}
.pit{margin:0;padding-left:20px;line-height:1.7;font-size:14px}
.simc{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.simc button{border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-weight:800;font-size:14px;background:#fff}
.simc button:hover{border-color:var(--sea)}
.simc button span{font-weight:600;color:var(--sub);font-size:12.5px;margin-left:5px}
.src{margin-top:12px;font-size:12.5px;color:var(--sub);line-height:1.5}
/* 오른쪽 */
.right{display:flex;flex-direction:column;gap:12px;position:sticky;top:var(--toph,150px)}
.bld h2{margin:4px 4px 2px;font-size:16px}
.bld .d{margin:0 4px 12px;font-size:13px;color:var(--sub)}
.fld{margin:0 4px 11px}
.fld label{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;margin-bottom:5px}
.fld label i{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.fld input,.fld select{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff;font-size:15px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--sea);box-shadow:0 0 0 2px rgba(12,115,125,.15)}
.ck{display:flex;align-items:center;gap:7px;margin:2px 4px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--sea)}
.out{background:var(--proof);border-radius:11px;padding:12px}
.out small{font-size:12.5px;color:var(--sub);font-weight:700}
.out .f{font-size:15.5px;font-weight:800;margin:6px 0 10px;word-break:break-all;line-height:1.5}
.out .f em{font-style:normal;color:#8C95A1}
.go{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:44px;border-radius:10px;background:var(--sea);color:#fff;font-weight:800;font-size:15px}
.go:hover{background:var(--sea2)}
.go.ghost{background:#fff;color:var(--sea2);border:1px solid var(--line)}
.go svg{width:18px;height:18px}
.alt{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.55}
.alt .f{font-weight:800;word-break:break-all;margin:4px 0 6px}
.lnk{color:var(--sky);font-weight:800;font-size:13.5px}
.memo textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.55;resize:vertical;outline:none;background:#fff}
.memo textarea:focus{border-color:var(--sea)}
.memo .h{display:flex;align-items:center;margin:2px 4px 8px;font-size:14.5px;font-weight:800}
.memo .h span{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
.kbd{background:var(--sealt);border-radius:11px;padding:11px 13px;font-size:13.5px;line-height:1.6}
kbd{font:800 12.5px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 6px;background:#fff}
/* 처음 화면 · 목록 */
.home h2,.lst h2{margin:2px 0 12px;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{display:block;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.tile:hover{border-color:var(--sea);box-shadow:0 6px 18px -12px rgba(11,61,74,.45)}
.tile .ico{margin-bottom:9px}
.tile b{display:block;font-size:15.5px}
.tile span{display:block;margin-top:3px;font-size:12.5px;color:var(--sub)}
.errs{display:flex;gap:7px;flex-wrap:wrap}
.errs button{border:1px solid #F0C9C3;background:#fff;color:var(--red);font-weight:800;border-radius:9px;padding:7px 12px;font-size:14px}
.errs button:hover{background:var(--redlt)}
.hsec{background:var(--cloud);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.tasks{display:flex;flex-wrap:wrap;gap:7px}
.tasks button{background:var(--sealt);color:var(--sea2);font-weight:700;border-radius:9px;padding:6px 11px;font-size:13.5px}
.tasks button:hover{background:#DCEDEF}
.res{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
.ri:hover{border-color:var(--sea)}
.ri .t{min-width:0;flex:1}
.ri b{font-size:15.5px}
.ri small{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.45}
.ri mark{background:#FFF1A8;color:inherit;border-radius:3px;padding:0 1px}
.ri .v{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.ri .v.no{color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:28px 10px;line-height:1.7}
/* 수식 풀이 */
.xp textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15.5px;font-weight:700;line-height:1.55;resize:vertical;outline:none;background:#fff;font-family:inherit;word-break:break-all}
.xp textarea:focus{border-color:var(--sea)}
.xtabs{display:flex;background:var(--sand2);border-radius:11px;padding:4px;margin-bottom:14px}
.xtabs button{flex:1;height:38px;border-radius:8px;font-weight:800;color:var(--sub)}
.xtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.st{display:flex;gap:11px;align-items:flex-start}
.st .no{width:28px;height:28px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;margin-top:6px}
.st .bx{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.st .bx code{display:block;font-family:inherit;font-weight:800;font-size:15px;word-break:break-all;line-height:1.5}
.st .bx p{margin:4px 0 0;font-size:14px;line-height:1.6}
.st .bx p.n{font-size:12.5px;color:var(--sub)}
.st .bx a,.st .bx button.fnl{color:var(--sky);font-weight:800;font-size:13px}
.warns{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.wn{background:var(--redlt);color:#7a2a20;border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.55}
.wn.i{background:var(--sealt);color:var(--sea2)}
.xerr{margin-top:12px;background:var(--redlt);color:var(--red);font-weight:700;border-radius:10px;padding:10px 12px;font-size:14px}
.chk{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.chk li{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55}
.chk li input{width:18px;height:18px;margin-top:2px;accent-color:var(--sea);flex-shrink:0}
/* 노트 */
.nt{display:flex;flex-direction:column;gap:8px}
.ni{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.ni .h{display:flex;align-items:center;gap:8px}
.ni .h b{font-size:15.5px}
.ni .h button{margin-left:auto}
.ni p{margin:5px 0 0;font-size:13.5px;color:var(--sub);white-space:pre-wrap;line-height:1.5}
.ni code{display:block;font-family:inherit;font-weight:800;font-size:14.5px;word-break:break-all;margin:5px 0 0}
.ni .acts{display:flex;gap:6px;margin-top:8px}
/* 창 */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(14,22,30,.45);display:grid;place-items:center;padding:16px}
.shbox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.shh{display:flex;align-items:center;margin-bottom:12px}
.shh b{font-size:17px}
.shh .tb{margin-left:auto}
.vers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vers button{border:1px solid var(--line);border-radius:11px;padding:12px;text-align:left;font-weight:800}
.vers button span{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-top:3px}
.vers button.on{border:2px solid var(--sea);background:var(--sealt)}
.small{font-size:13px;color:var(--sub);line-height:1.6}
.isteps{padding-left:20px;line-height:1.8;font-size:14.5px}
.iapp{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.iapp img{border-radius:12px}
.iapp b{display:block;font-size:16px}.iapp span{font-size:13px;color:var(--sub)}
.links{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.links a{font-weight:800}

<script>/* 엑셀 수식 노트 — 계산 엔진 (Blog J 직접 작성, 외부 라이브러리 없음)

const XL = (() => {
  const ERR = { NA: "#N/A", VALUE: "#VALUE!", REF: "#REF!", DIV: "#DIV/0!", NAME: "#NAME?", NUM: "#NUM!", SPILL: "#SPILL!", CALC: "#CALC!", NULL: "#NULL!" };

  class Arr { constructor(rows) { this.rows = rows; } get h() { return this.rows.length; } get w() { return this.rows[0] ? this.rows[0].length : 0; } flat() { return this.rows.flat(); } }

  /* ── 칸 주소 ── */
  const colNum = s => { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };

  const DAY = 86400000, BASE = Date.UTC(1899, 11, 30);

  const ymdw = s => { const t = ymd(s); return `${t.y}-${String(t.m).padStart(2, "0")}-${String(t.d).padStart(2, "0")}(${WD[t.w]})`; };

      if (ch === "'") { const k = s.indexOf("'!", i + 1); if (k > 0) { sheet = s.slice(i + 1, k); j = k + 2; } }
      else { const m = /^([^\s!(),+\-*/^&=<>:;"'{}%]+)!/.exec(s.slice(i)); if (m) { sheet = m[1]; j = i + m[0].length; } }

      let m = /^(\$?[A-Za-z]{1,3}\$?\d+)(?::(\$?[A-Za-z]{1,3}\$?\d+))?(?![A-Za-z0-9_(])/.exec(rest);
      if (m) { push("ref", { sheet, a: m[1], b: m[2] || null }, i, j + m[0].length); i = j + m[0].length; continue; }
      m = /^(\$?[A-Za-z]{1,3}):(\$?[A-Za-z]{1,3})(?![A-Za-z0-9_(])/.exec(rest);
      if (m) { push("ref", { sheet, a: m[1], b: m[2], col: true }, i, j + m[0].length); i = j + m[0].length; continue; }

      if (m) { push("fn", m[1].toUpperCase(), i, i + m[1].length); i += m[0].length; push("(", "(", i - 1, i); continue; }

        else if (rx) hit = typeof v === "string" && rx.test(v);

    : ["주소창 오른쪽의 설치 아이콘(모니터에 아래 화살표)을 누르세요", "없으면 「⋮」 → 「저장 및 공유」 → 「앱 설치」", "「설치」 — 바탕 화면 · 시작 메뉴에 아이콘이 생겨요"];
  openSheet(`<div class="shh"><b>앱으로 설치하기</b><button class="tb" type="button" data-shc="1">닫기</button></div>
  <div class="iapp"><img src="icon-192.png" alt="" width="56" height="56"><div><b>엑셀 수식 노트</b><span>Blog J 무료 앱 · 가입 · 광고 없이 · 인터넷 없어도 열림</span></div></div>
  ${INST.ev ? `<button class="go" type="button" data-inst="1">${IC.dl}지금 설치하기</button>` : ""}
  <ol class="isteps">${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><p class="small">자세한 방법 · 지우는 법: <a href="https://luvbong.tistory.com/790" target="_blank" rel="noopener">앱 설치 · 삭제 방법</a></p>`, "앱으로 설치");
}
function printCat(cat) {
  const L = cat === "err" ? null : F.filter(f => f.cat === cat);
  const p = $("#print");
  p.innerHTML = L ? `<h1>엑셀 수식 노트 — ${esc(CATN[cat].n)}</h1><div class="pm">Blog J · ${esc(todayYmdw())} 인쇄 · 내 엑셀: ${esc(S.ver ? VNAME(S.ver) : "고르지 않음")}</div><table><thead><tr><th style="width:24%">함수</th><th style="width:38%">쓰는 모양</th><th>하는 일 · 주의</th></tr></thead><tbody>${L.map(c => `<tr><td><b>${esc(c.n)}</b><br><small>${esc(vlab(c))}${c.gs ? " · 구글 시트" : ""}</small></td><td class="f">${esc(c.kind === "menu" ? c.x.slice(0, 2).join(" → ") : c.ex.cells[c.ex.f] || "")}</td><td>${esc(c.one)}<br><small>${esc((c.pit || c.tips || [])[0] || "")}</small></td></tr>`).join("")}</tbody></table>`
    : `<h1>엑셀 오류 해결 — 8가지</h1><div class="pm">Blog J · ${esc(todayYmdw())}</div><table><tbody>${ERRS.map(e => `<tr><td style="width:18%"><b>${esc(e.e)}</b><br>${esc(e.n)}</td><td>${esc(e.one)}<br><small>${esc(e.chk.slice(0, 3).join(" / "))}</small></td></tr>`).join("")}</tbody></table>`;
  setTimeout(() => print(), 50);
}

/* ── 이벤트 ── */
document.addEventListener("click", e => {
  const t = e.target.closest("button,td[data-c],[data-shc]"); if (!t) { if (e.target.id === "sheet") closeSheet(); return; }
  const d = t.dataset;
  if (d.shc) return closeSheet();
  if (d.c) { S.sheet.sel = d.c; S.sheet.msg = null; renderTry(); if (!isMobile()) $("#fxin").focus(); return; }
  if (d.go) return go({ view: "fn", id: d.go });
  if (d.cat) { if (d.cat === "err") return go({ view: "err", err: S.err || "na", cat: S.cat }); return go({ view: "cat", cat: d.cat }); }
  if (d.err) return go({ view: "err", err: d.err });
  if (d.view) { if (d.view === "search") { $("#q").focus(); if (S.q) go({ view: "search" }); return; } return go({ view: d.view }); }
  if (d.q) { $("#q").value = d.q; S.q = d.q; return go({ view: "search" }); }
  if (d.back) { history.back(); return; }
  if (d.star) { const n = S.notes[d.star] = S.notes[d.star] || {}; n.star = !n.star; LS.set("notes", S.notes); toast(n.star ? "내 수식 노트에 담았어요" : "노트에서 뺐어요"); return render(); }
  if (d.print) return printCat(d.print);
  if (d.reset) { newSheet(BYID[S.id]); return renderTry(); }
  if (d.tryi !== undefined) { const c = BYID[S.id], tr = c.tries[+d.tryi]; newSheet(c); setCell(tr[0], tr[1]); S.sheet.sel = tr[0].startsWith("=") ? tr[0] : (String(tr[1]).startsWith("=") ? tr[0] : S.sheet.f); renderTry(); S.sheet.msg = `${tr[0]} 칸을 「${tr[1]}」로 → ${tr[2]}`; $("#whyb").innerHTML = whyHTML() + ((v => v && XL.isErr(v) ? `<div class="why"><b>${esc(v.e)}</b> — ${esc(v.why)}</div>` : "")(S.sheet.res[S.sheet.sel])); return; }
  if (d.tsv) return copyText(sheetTSV(), "예시 표를 복사했어요 — 엑셀 A1 칸에 붙여넣으면 수식까지 들어가요");
  if (d.bcopy) { const f = $("#bout").dataset.f; copyText(f); return; }
  if (d.acopy) return copyText(d.acopy);
  if (d.bsave) { const f = $("#bout").dataset.f; S.saved.unshift({ id: S.id, f, at: todayYmdw() }); S.saved = S.saved.slice(0, 100); LS.set("saved", S.saved); toast("내 수식 노트에 저장했어요"); return keep(() => { $("#left").innerHTML = navHTML(); }); }
  if (d.bexp) { S.xsrc = $("#bout").dataset.f; S.xtab = "x"; return go({ view: "explain" }); }
  if (d.scopy) return copyText(S.saved[+d.scopy].f);
  if (d.sexp) { S.xsrc = S.saved[+d.sexp].f; S.xtab = "x"; return go({ view: "explain" }); }
  if (d.sdel) { S.saved.splice(+d.sdel, 1); LS.set("saved", S.saved); return render(); }
  if (d.missclr) { LS.set("miss", []); return render(); }
  if (d.xtab) { S.xtab = d.xtab; return render(); }
  if (d.mtab) { S.mtab = d.mtab; return render(); }
  if (d.ver !== undefined) { S.ver = d.ver || null; LS.set("ver", S.ver); LS.set("verAsked", 1); closeSheet(); toast(S.ver ? `내 엑셀: ${VNAME(S.ver)}` : "버전은 나중에 위 단추에서 고를 수 있어요"); return render(); }
  if (d.vpick || t.id === "verb") return pickVer(false);
  if (t.id === "bhelp") return openHelp();
  if (t.id === "binst") { if (INST.ev) { INST.ev.prompt(); INST.ev.userChoice.finally(() => INST.ev = null); return; } return openInstall(); }
  if (d.inst) { INST.ev && INST.ev.prompt(); return closeSheet(); }
  if (t.id === "qclr") { $("#q").value = ""; S.q = ""; $("#qclr").hidden = true; $("#q").focus(); if (S.view === "search") backStep(); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "fxin") { setCell(S.sheet.sel, t.value); $("#fxmir").innerHTML = mirrorHTML(t.value); clearTimeout(renderTry.t); renderTry.t = setTimeout(() => { keep(() => { $("#gridw").innerHTML = sheetHTML(); }); $("#whyb").innerHTML = whyHTML(); }, 160); return; }
  if (t.id === "q") { S.q = t.value; $("#qclr").hidden = !t.value; clearTimeout(search.t); search.t = setTimeout(() => { if (!S.q.trim()) { if (S.view === "search") backStep(); return; } if (S.view === "search") render(); else go({ view: "search" }); }, 180); return; }
  if (t.dataset.bk !== undefined || t.dataset.babs) return bldUpdate(BYID[S.id]);
  if (t.dataset.memo) { const n = S.notes[t.dataset.memo] = S.notes[t.dataset.memo] || {}; n.memo = t.value; LS.set("notes", S.notes); const m = $("#msaved"); if (m) m.textContent = "저장됨 · 이 기기"; return; }
  if (t.id === "xsrc") { clearTimeout(explainOut.t); explainOut.t = setTimeout(explainOut, 200); }
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset.bk !== undefined || t.dataset.babs) bldUpdate(BYID[S.id]); });
document.addEventListener("keydown", e => {
  if (e.target.id === "fxin" && e.key === "Enter") { e.preventDefault(); /* 엑셀처럼 아래 칸으로 */ const p = XL.parseAddr(S.sheet.sel); S.sheet.sel = XL.addr(p.r + 1, p.c); renderTry(); }
  if (e.target.id === "q" && e.key === "Enter") { e.preventDefault(); const r = search(S.q); if (r.fns.length && norm(r.fns[0].n) === norm(S.q)) go({ view: "fn", id: r.fns[0].id }); }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
});
const setToph = () => document.documentElement.style.setProperty("--toph", ($(".top").offsetHeight + 14) + "px");
addEventListener("resize", () => { setToph(); });

/* ── 시작 ── */
(function start() {
  setToph();
  const P = new URLSearchParams(location.search);
  const f = P.get("f"), q = P.get("q"), er = P.get("err");
  if (f && BYID[f.toLowerCase()]) { S.view = "fn"; S.id = f.toLowerCase(); if (BYID[S.id].ex) newSheet(BYID[S.id]); S.cat = BYID[S.id].cat; }
  else if (er && ERRID[er]) { S.view = "err"; S.err = er; }
  else if (q) { S.q = q; $("#q").value = q; $("#qclr").hidden = false; S.view = "search"; }
  else if (P.get("x")) { S.view = "explain"; }
  render(true);
  if (!INST.standalone) $("#binst").hidden = false;
  if (P.get("install") === "1") setTimeout(openInstall, 300);
  else if (!S.ver && !LS.get("verAsked", 0)) setTimeout(() => pickVer(true), 400);
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
<script>/* Blog J 공통 — 휴대폰 · PC 뒤로 가기 v2 (11-13 제이: 뒤로 가기로 앱이 바로 꺼지지 않게 · 이전 화면으로 · 닫기 전에 꼭 확인)
   한 번 누를 때마다 한 단계씩: 떠 있는 창 닫기 → 앱의 이전 화면(views) → 앱이 정한 단계(hook) → 맨 처음이면 「○○ 앱을 닫을까요?」 확인 창.
   확인 창에서 「닫기」를 누를 때만 앱이 닫힘(뒤로 한 번 더 누르면 확인 창만 닫힘).
   쓰는 법: BJBACK.init({ ov: [창 선택자...], views: { get: () => 지금 화면, set: v => 그 화면으로 }, hook: () => true(처리함)/false }) */
(function () {
  if (window.bjAskExit) return;
  const name = () => (document.title.split("|")[0] || "").trim() || "이";
  window.bjAskOpen = () => !!document.getElementById("bjAsk");
  window.bjAskClose = () => { const o = document.getElementById("bjAsk"); if (o) o.remove(); };
  window.bjAskExit = function (o) {
    o = o || {}; if (window.bjAskOpen()) return;
    const w = document.createElement("div"); w.id = "bjAsk"; w.setAttribute("role", "alertdialog"); w.setAttribute("aria-modal", "true");
    w.style.cssText = "position:fixed;inset:0;z-index:2147483600;background:rgba(11,25,32,.5);display:flex;align-items:center;justify-content:center;padding:20px;font-family:SUIT,Pretendard,'Malgun Gothic',system-ui,sans-serif";
    w.innerHTML = '<div style="background:#fff;color:#14202B;border-radius:18px;padding:22px 22px 18px;width:min(360px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)">'
      + '<b style="display:block;font-size:18px;font-weight:900;letter-spacing:-.02em;margin-bottom:8px"></b>'
      + '<p style="margin:0 0 18px;font-size:14.5px;line-height:1.6;color:#5F6B7A">다시 열면 이어서 쓸 수 있어요.</p>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" data-k="stay" style="height:44px;padding:0 16px;border-radius:11px;border:0;background:#fff;box-shadow:0 0 0 1px #CDD3DC;font:inherit;font-weight:800;font-size:15px;color:#14202B;cursor:pointer">계속 쓰기</button>'
      + '<button type="button" data-k="leave" style="height:44px;padding:0 18px;border-radius:11px;border:0;background:#0C737D;color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer">닫기</button></div></div>';
    w.querySelector("b").textContent = name() + " 앱을 닫을까요?";
    w.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b && e.target !== w) return; window.bjAskClose(); if (b && b.dataset.k === "leave") { if (o.leave) o.leave(); } else if (o.stay) o.stay(); });
    w.addEventListener("keydown", e => { if (e.key === "Escape") { window.bjAskClose(); if (o.stay) o.stay(); } });
    document.body.appendChild(w); setTimeout(() => { const b = w.querySelector('[data-k="stay"]'); if (b) b.focus(); }, 30);
  };
})();
(function () {
  const C = { ov: [".bkx-ov", ".fpx-ov"], btn: { ".ippg": "[data-ipclose],.ipx" }, hook: null, views: null };
  let armed = false, busy = false; const VS = [];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function arm() { window.__bjExit = false; if (history.state && history.state.bjg) { armed = true; return; } try { history.pushState(Object.assign({}, history.state || {}, { bjg: 1 }), ""); armed = true; } catch (e) {} }
  const vis = e => e && e.isConnected && e.getClientRects().length > 0 && getComputedStyle(e).visibility !== "hidden";
  function topOv() { const sel = C.ov.concat(Object.keys(C.btn)).join(","); if (!sel) return null; const L = [...document.querySelectorAll(sel)].filter(vis); return L[L.length - 1] || null; }
  async function closeOv(o) {
    for (const k in C.btn) if (o.matches(k)) { const b = o.querySelector(C.btn[k]); if (b) { b.click(); await wait(60); if (!vis(o)) return; } }
    o.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true })); await wait(80); if (!vis(o)) return;
    o.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true })); await wait(80);
  }
  /* 이전 화면 기억: 화면(views.get())이 바뀔 때마다 적어 둠 → 뒤로 가기 = 바로 앞 화면 */
  function track() { if (!C.views) return; let v; try { v = C.views.get(); } catch (e) { return; } const k = JSON.stringify(v); if (k === undefined) return; if (!VS.length || VS[VS.length - 1].k !== k) { const at = VS.findIndex(x => x.k === k); if (at >= 0) VS.splice(at + 1); else VS.push({ k, v }); if (VS.length > 40) VS.shift(); } }
  function say(m) { let t = document.getElementById("bjbToast"); if (!t) { t = document.createElement("div"); t.id = "bjbToast"; t.setAttribute("role", "status"); t.style.cssText = "position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2147483000;background:rgba(20,32,43,0.92);color:#fff;font:600 14.5px/1.4 SUIT,Pretendard,system-ui,sans-serif;padding:11px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center;pointer-events:none;transition:opacity .2s;opacity:0"; document.body.appendChild(t); }
    t.textContent = m; t.style.opacity = "1"; clearTimeout(say.t); say.t = setTimeout(() => { t.style.opacity = "0"; }, 2400); }
  function ask() { arm(); window.bjAskExit({ stay: () => arm(), leave: () => { window.__bjExit = true; history.back(); } }); }
  window.addEventListener("popstate", async () => {
    armed = false; if (window.__bjExit) { history.back(); return; } if (busy) return; busy = true;
    try {
      if (window.bjAskOpen()) { window.bjAskClose(); arm(); return; }
      const o = topOv(); if (o) { await closeOv(o); arm(); return; }
      track();
      if (C.views && VS.length > 1) { VS.pop(); const p = VS[VS.length - 1]; try { C.views.set(p.v); } catch (e) {} window.scrollTo(0, 0); arm(); return; }
      let done = false; if (C.hook) { try { done = !!(await C.hook()); } catch (e) { done = false; } }
      if (done) { track(); arm(); return; }
      ask();
    } finally { busy = false; }
  });
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { if (!armed) arm(); }, true));
  setInterval(track, 400);
  window.BJBACK = { init(o) { if (o) { if (o.ov) C.ov = C.ov.concat(o.ov); if (o.btn) Object.assign(C.btn, o.btn); if (o.hook) C.hook = o.hook; if (o.views) { C.views = o.views; VS.length = 0; track(); } } }, arm, say, ask };
})();

</script>
