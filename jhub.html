<style>
:root{--bg:#faf6ee;--panel:#ffffff;--card:#ffffff;--in:#f3eee3;--ink:#14202b;--sub:#5f6b7a;--sub2:#5f6b7a;--g:#0c737d;--gh:#0a5c66;--gl:#e3ece9;--or:#e07a4f;--hair:rgba(20,32,43,0.18);--up:3px 4px 9px rgba(20,32,43,0.129),-3px -3px 8px rgba(255,255,255,.88)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:SUIT,"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:10;background:var(--panel);box-shadow:0 1px 0 var(--hair);padding:12px 16px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{width:36px;height:36px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:19px;position:relative;flex-shrink:0}
.badge i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--panel)}
.tt{font-weight:900;font-size:18px;letter-spacing:-.3px}
.tt small{display:block;font-weight:600;font-size:12.5px;color:var(--sub2);letter-spacing:0}
.sp{flex:1}
.q{flex:1 1 220px;max-width:360px;padding:10px 12px;border-radius:11px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);font:inherit;font-size:15px;outline:none;min-height:42px}
.q:focus{box-shadow:inset 0 0 0 2px var(--g);background:#fff}
.owner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--hair);font-size:13.5px;font-weight:800;color:var(--sub)}
.owner .dot{width:9px;height:9px;border-radius:50%;background:#9a9384}
.owner.on{color:var(--g);box-shadow:0 0 0 1.5px var(--g)}
.owner.on .dot{background:#2f7d4f}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.note{font-size:13.5px;color:var(--sub);line-height:1.65;margin:2px 0 16px;padding-left:12px;border-left:3px solid var(--or)}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.2px}
.sec span{font-size:12.5px;color:var(--sub2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--up);padding:14px 14px 12px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch b{font-size:16px;font-weight:900;letter-spacing:-.3px}
.ver{font-size:12.5px;font-weight:800;color:var(--g);background:var(--gl);border-radius:999px;padding:2px 8px}
.st{font-size:12.5px;font-weight:700;color:var(--sub2);margin-left:auto;white-space:nowrap}
.st.soon{color:#a0520c}
.st.dev{color:#7a4b2a}
.ty{font-size:12.5px;color:var(--sub2);margin:4px 0 10px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;font-size:13.5px;font-weight:800;text-decoration:none;background:var(--panel);box-shadow:0 0 0 1px var(--hair)}
.links a:hover{box-shadow:0 0 0 1.5px var(--g);color:var(--g)}
.links a.main{background:var(--g);color:#fff;box-shadow:none}
.links a.main:hover{background:var(--gh);color:#fff}
.links a.post{color:var(--sub)}
.old{margin-top:10px;padding-top:9px;border-top:1px dashed var(--hair)}
.old .lb{font-size:12.5px;font-weight:800;color:var(--sub2);margin-bottom:6px}
.old a{font-weight:700}
.gate{font-size:12.5px;color:#a0520c;margin-top:8px}
.foot{font-size:12.5px;color:var(--sub2);text-align:center;margin-top:30px;line-height:1.7}
.none{color:var(--sub2);padding:30px;text-align:center}
@media (max-width:560px){.grid{grid-template-columns:1fr}.q{max-width:none;order:3;flex-basis:100%}.tt{font-size:17px}}

/* 가로 배치(11-11): 한 앱 = 한 줄 — 왼쪽 이름 · 상태, 오른쪽 단추 */
.grid{display:flex;flex-direction:column;gap:0;background:var(--card);border-radius:14px;box-shadow:var(--up);overflow:hidden}
.card{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start;border-radius:0;box-shadow:none;padding:12px 16px;border-top:1px solid var(--hair)}
.card:first-child{border-top:0}
.card:hover{background:#fbfaf6}
.cl{min-width:0}.cr{min-width:0}
.cl .ch{flex-wrap:wrap}
.cl .st{margin-left:0;white-space:normal}
.cl .ty{margin:3px 0 0}
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.cr .old{margin:0;padding:0 0 0 14px;border-top:0;border-left:1px dashed var(--hair);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cr .old .lb{margin:0}
.cr .gate{margin:0;flex-basis:100%}
.card{padding:10px 16px}
.cl .ty{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:760px){.card{grid-template-columns:1fr;gap:8px}.cr .old{padding-left:0;border-left:0}}

/* 표 배치(11-11): 엑셀처럼 한 앱 = 한 행 */
.xt{overflow-x:auto;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--hair)}
.xt table{width:100%;min-width:980px;border-collapse:collapse;font-size:13.5px}
.xt th{position:sticky;top:0;background:#f3eee3;text-align:left;font-size:12.5px;font-weight:800;color:var(--sub);padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
.xt td{padding:8px 10px;border-top:1px solid rgba(20,32,43,.1);vertical-align:top}
.xt tr:nth-child(even) td{background:#fcfaf6}
.xt tr:hover td{background:#eef6f7}
.xt td.nm{width:190px}.xt td.nm b{font-size:14.5px;font-weight:900}
.xt td + td{border-left:1px solid rgba(20,32,43,.07)}
.xt .ty{font-size:12.5px;color:var(--sub2);margin:2px 0 0}
.xt .st{margin:0;white-space:nowrap}
.xt .links{gap:4px}.xt .links a{padding:5px 9px;font-size:12.5px;border-radius:8px}
.xt .links.sm{margin-top:4px}.xt .links.sm a{padding:3px 7px;font-weight:700;color:var(--sub)}
.xt .dash{color:var(--sub2)}
.gate{margin:6px 2px 0}
.st.idea{display:inline-block;padding:3px 8px;border-radius:6px;background:#f3eee3;color:#8a4a16;font-weight:800;box-shadow:inset 0 0 0 1px #e2c9a8}
.xt td.num{white-space:nowrap}
</style>
<style id="bjsea">/* ── Blog J 모래 · 바다 · 하늘 · 구름 (2026-11-10) — 공통 머리띠 색 ── */
:root{--sea-band:#0b3d4a;--sea-band-t:#ffffff;--sea-band-s:#cfe3e6;--sea:#0c737d;--sunset:#e07a4f}
/* 머리띠(깊은 바다) — 앱 이름은 흰색 · 보조 글자는 옅은 하늘. 머리 안 단추 · 칸은 원래 색 그대로 */
.top{background:var(--sea-band)!important;border-bottom:0!important}
.top .brand,.top .brand b,.top .brand strong,.top .bt b,.top .bn b,.top h1,.top .tname,.top .tt,.top .tt b,.top .ttl b{color:#fff!important}
.top .brand small,.top .bt small,.top .bn small,.top .tname small,.top .tt small,.top .ttl small,.top .brand .ver,.top .ver{color:var(--sea-band-s)!important}
.top .brand .cat,.top .cat{background:rgba(255,255,255,.14)!important;color:#fff!important;box-shadow:none!important}
.top .lg,.top .badge{box-shadow:0 0 0 1.5px rgba(255,255,255,.25)!important}
.top .lg i,.top .badge i{border-color:var(--sea-band)!important}
</style></head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const U = h => /^https?:/.test(h) ? h : B + h;
const A = (l, cls) => `<a class="${cls || ""}" href="${esc(U(l[1]))}" target="_blank" rel="noopener">${esc(l[0])}</a>`;

function draw() {
  const q = document.getElementById("q").value.trim().toLowerCase(); let h = "";
  for (const g of Object.keys(SEC)) {
    const items = APPS.filter(a => a.g === g && (!q || (a.n + " " + a.v + " " + (a.note || "") + " " + (a.plan || "") + " " + (a.g === "idea" ? "미개발" : "") + " " + a.links.concat(a.old || []).map(l => l.join(" ")).join(" ")).toLowerCase().includes(q)));

    h += `<div class="sec"><h2>${SEC[g][0]}</h2><span>${SEC[g][1]}</span></div>`;

    if (g === "etc") { h += `<div class="xt"><table><tbody>${items.map(a => `<tr><td class="nm">${esc(a.n)}</td><td colspan="5"><div class="links">${a.links.map(l => A(l)).join("")}</div></td></tr>`).join("")}</tbody></table></div>`; continue; }
    h += `<div class="xt"><table><thead><tr><th class="nm">앱</th><th>버전</th><th>공개</th><th>열기</th><th>블로그 글</th><th>지난 버전 · 다운로드 · 메모</th></tr></thead><tbody>`;
    for (const a of items) {
      const web = a.g === "web" && a.post;
      const open = web ? `<div class="links">${A(["블로그 글에서 열기", P(a.post)], "main")}</div><div class="links sm">${a.links.map(l => A(l)).join("")}</div>`
                       : `<div class="links">${a.links.map((l, i) => A(l, i === 0 ? "main" : "")).join("")}</div>`;
      const posts = (a.post ? [A(["" + a.post, P(a.post)], "post")] : []).concat((a.posts || []).map(([t, n]) => A([t, P(n)], "post")));
      const extra = (a.old || []).map(l => A(l)).join("");
      h += `<tr><td class="nm"><b>${esc(a.n)}</b><div class="ty">${a.g === "app" ? "설치형" : a.g === "web" ? "블로그 실행형" : "개발 중"}</div></td>

        <td>${extra ? `<div class="links">${extra}</div>` : ""}${a.note ? `<div class="ty">${esc(a.note)}</div>` : ""}${!extra && !a.note ? '<span class="dash">—</span>' : ""}</td></tr>`;
    }
    h += `</tbody></table></div>`;
    if (g === "web" && !owner()) h += `<div class="gate">작은 단추(바로 열기)는 시험 모드가 꺼져 있으면 막힘 화면이 나와요 — 「블로그 글에서 열기」의 실행 카드로 여세요</div>`;
  }
  document.getElementById("list").innerHTML = h || `<div class="none">찾는 앱이 없어요</div>`;
