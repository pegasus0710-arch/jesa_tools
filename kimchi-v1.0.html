:root{
--paper:#ece6da;--panel:#f1ebe1;--tint:#e7e0d2;--hover:#f7f2e9;--card:#f4efe6;--tray:#e2dacb;--press-bg:#e6dfd1;
--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;--navy:#20263a;--amber:#e08a3e;--red:#c23a2b;--cat:#1f7f8f;--ok:#3e8b52;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--up-l:12px 14px 30px rgba(140,118,85,.45),-8px -8px 20px rgba(255,255,255,.85);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--sh-paper:12px 14px 28px rgba(120,100,70,.38),-5px -5px 12px rgba(255,255,255,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"BJ",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.01em;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 머리 */
.bar{background:var(--paper);box-shadow:0 1px 0 rgba(255,255,255,.7),0 6px 14px -10px rgba(120,100,70,.45)}
.bar-in{max-width:1440px;margin:0 auto;padding:18px 40px 16px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:16px;width:500px;flex-shrink:0;min-width:0}
.lg{width:54px;height:54px;border-radius:16px;background:var(--cat);display:grid;place-items:center;position:relative;flex-shrink:0;box-shadow:4px 6px 12px rgba(20,80,90,.36),-3px -3px 8px rgba(255,255,255,.85),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.lg svg{width:28px;height:28px;color:#fff}
.lg i{position:absolute;width:14px;height:14px;right:-4px;bottom:-4px;border-radius:50%;background:var(--amber);border:3px solid var(--paper)}
.brand small{display:block;color:var(--ink3);font-size:12.5px;letter-spacing:.06em;font-weight:600}
.brand b{display:block;font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.ruler{position:relative;flex:1;min-width:0;height:54px}
.ruler::before{content:"";position:absolute;inset:-6px -22px;border-radius:16px;background:var(--tint);box-shadow:var(--in)}
.rt{position:absolute;left:0;right:0;top:6px;height:10px;background:repeating-linear-gradient(90deg,rgba(31,33,37,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,repeating-linear-gradient(90deg,rgba(31,33,37,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat}
.rd{position:absolute;left:0;top:16px;height:3px;background:var(--amber);border-radius:2px;transition:width .3s}
.rdot{position:absolute;top:10px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--amber);box-shadow:2px 3px 5px rgba(120,70,20,.45),inset 2px 2px 3px rgba(255,255,255,.45);transition:left .3s}
.rs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.rs button{background:none;border:0;text-align:left;padding:26px 0 0;color:var(--ink3);font-size:14px;font-weight:600;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs button::before{content:"";position:absolute;left:0;top:2px;width:1px;height:20px;background:rgba(31,33,37,.35)}
.rs button .n{font-variant-numeric:tabular-nums;margin-right:6px;font-size:12.5px}
.rs button.done{color:var(--ink2)}.rs button.cur{color:var(--ink)}
.rs button:disabled{cursor:default}
.rm{display:none}

/* 본문 */
.lay{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:500px minmax(0,1fr);gap:32px;padding:26px 40px 44px;align-items:start}
.panel{background:var(--panel);border-radius:20px;box-shadow:var(--up);min-width:0}
.ph{padding:28px 28px 4px}
.ph .k{color:var(--ink3);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ph h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:6px 0 0;line-height:1.3}
.ph p{font-size:15px;line-height:1.55;margin:6px 0 0;color:var(--ink2)}
.pb{padding:20px 28px 10px}
.pf{display:flex;gap:12px;align-items:center;padding:18px 28px 24px;box-shadow:0 -1px 0 rgba(160,140,108,.18)}
.pf .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:0;font-size:15px;font-weight:600;padding:12px 18px;min-height:46px;border-radius:12px;box-shadow:var(--up-s);transition:box-shadow .12s,background .15s;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn:active{box-shadow:var(--press)}
.btn svg{width:18px;height:18px;flex-shrink:0}

    <details class="paste"><summary>글로 한 번에 넣기 (붙여넣기)</summary>
      <p class="hint" style="margin-top:6px">한 줄에 재료 하나씩 — <b>고춧가루 900g</b> · <b>새우젓 1컵</b> · <b>마늘 400g</b> · <b>설탕 약간</b>처럼 적힌 글을 붙여 넣고 「읽어서 넣기」를 누르세요. 영상 설명란 · 메모를 그대로 붙여도 돼요.</p>
      <textarea class="inp" id="e_paste" rows="5" placeholder="고춧가루 900g&#10;멸치액젓 1컵&#10;다진 마늘 400g&#10;생강 100g"></textarea>
      <button class="btn sm" data-parse style="margin-top:8px">읽어서 넣기</button></details>
    <label class="f">담그는 순서 <span class="lt">(한 줄에 한 단계 — 양념표 아래에 번호를 붙여 보여 줘요)</span></label><textarea class="inp" id="e_how" rows="5" placeholder="배추를 소금물에 8시간 절여요&#10;헹궈서 물기를 빼요&#10;양념을 섞어 배춧잎 사이에 발라요">${esc(m.how || "")}</textarea>
    <label class="f">메모 <span class="lt">(양념표 아래에 같이 나와요)</span></label><input class="inp" id="e_tip" value="${esc(m.tip || "")}" placeholder="예: 찹쌀풀은 하루 전에 쒀서 식혀 두기">
  </div>
  <div class="pf"><button class="btn" data-ecancel>${IC.back} 취소</button><span class="sp"></span><button class="btn go" data-esave>저장하고 계산하기 ${IC.next}</button></div>`;
}
function readEditor() {
  const m = S.edit; m.name = $("#e_name").value.trim(); m.note = $("#e_note").value.trim(); m.main = $("#e_main").value.trim(); m.base = $("#e_base").value.trim(); m.bu = $("#e_bu").value; m.tip = $("#e_tip").value.trim(); m.how = $("#e_how").value.trim();
  m.ing = [...document.querySelectorAll("#erows .er")].map(r => { const f = [...r.querySelectorAll("[data-f]")].map(x => x.value.trim()); return [f[0], f[1].replace(/,/g, ""), f[2], f[3], ""]; });
}
const UNIT_RE = "kg|g|mL|ml|L|l|컵|큰술|작은술|숟가락|스푼|개|통|톨|쪽|단|대|장|포기|약간";
function parseLines(txt) {
  const out = [];
  txt.split(/\n/).map(l => l.replace(/^[\s\-•·*▶□]+/, "").replace(/^[0-9]+[.)]\s+/, "").trim()).filter(Boolean).forEach(l => {
    const m = l.match(new RegExp("^(.+?)[\\s:：]*([0-9]+(?:\\.[0-9]+)?(?:/[0-9]+)?|[½¼¾])?\\s*(" + UNIT_RE + ")?\\s*(\\(.*\\))?$"));
    if (!m) return;
    let [, n, q, u] = m; n = n.replace(/[:：]$/, "").trim(); if (!n) return;
    if (q) q = q === "½" ? 0.5 : q === "¼" ? 0.25 : q === "¾" ? 0.75 : q.includes("/") ? (+q.split("/")[0] / +q.split("/")[1]) : +q;
    u = (u || (q ? "g" : "약간")).replace(/^ml$/, "mL").replace(/^l$/, "L").replace(/^(숟가락|스푼)$/, "큰술");
    const t = /고춧가루|고추가루/.test(n) ? "r" : /젓|액젓|까나리/.test(n) ? "j" : /소금물|절임|절이/.test(n) ? "b" : /^물|육수|국물/.test(n) ? "w" : /무|파|미나리|갓|당근|배|밤|굴|양파|부추/.test(n) ? "v" : "s";
    out.push([n, q == null || q === "" ? "" : String(Math.round(q * 100) / 100), u, t, ""]);
  });
  return out;
}

/* ── 이벤트 ── */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go != null) { if (S.edit) return; const i = +d.go; if (i <= S.step || i === S.step + 1) { S.step = i; if (i === 3) S.view = "one"; render(true); } return; }
  if (d.exp != null) { const blob = new Blob([JSON.stringify({ kind: "bj-kimchi-my", v: 1, saved: new Date().toISOString().slice(0, 10), my: S.my }, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "내김치레시피_" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast("내 레시피를 파일로 보관했어요. 다른 PC · 브라우저에서 「파일 불러오기」로 넣을 수 있어요."); return; }
  if (d.new != null) { S.edit = blankMy(); render(true); return; }
  if (d.edit) { const m = S.my.find(x => x.id === d.edit); if (m) { S.edit = JSON.parse(JSON.stringify(m)); S.edit.saved = true; render(true); } return; }
  if (d.del) { const m = S.my.find(x => x.id === d.del); if (m && confirm(`「${m.name || "내 레시피"}」를 지울까요?`)) { S.my = S.my.filter(x => x.id !== d.del); S.cart = S.cart.filter(c => c.k !== d.del); S.k = "baechu"; save(); render(); toast("지웠어요."); } return; }
  if (d.addr != null) { readEditor(); S.edit.ing.push(["", "", "g", "s", ""]); drawEditor(); const r = document.querySelectorAll("#erows .en"); r[r.length - 1].focus(); return; }
  if (d.rmr != null) { readEditor(); S.edit.ing.splice(+d.rmr, 1); if (!S.edit.ing.length) S.edit.ing.push(["", "", "g", "s", ""]); drawEditor(); return; }
  if (d.parse != null) { readEditor(); const add = parseLines($("#e_paste").value); if (!add.length) { toast("읽을 줄이 없어요. 「고춧가루 900g」처럼 한 줄에 하나씩 넣어 주세요."); return; } S.edit.ing = S.edit.ing.filter(r => r[0] && (r[1] !== "" || r[2] === "약간")).concat(add); drawEditor(); toast(`${add.length}줄을 읽었어요. 양 · 단위 · 종류를 확인해 주세요.`); return; }
  if (d.ecancel != null) { S.edit = null; render(true); return; }
  if (d.esave != null) { readEditor(); const m = S.edit; if (!m.name) { toast("레시피 이름을 넣어 주세요."); $("#e_name").focus(); return; } if (!(+m.base > 0)) { toast("기준 양을 숫자로 넣어 주세요."); $("#e_base").focus(); return; }
    m.ing = m.ing.filter(r => r[0]); if (!m.ing.length) { toast("재료를 한 줄 이상 넣어 주세요."); return; }
    const bad = m.ing.find(r => r[2] !== "약간" && r[1] !== "" && !(+r[1] >= 0)); if (bad) { toast(`「${bad[0]}」의 양을 숫자로 넣어 주세요.`); return; }
    delete m.saved; const i = S.my.findIndex(x => x.id === m.id); if (i >= 0) S.my[i] = m; else S.my.push(m);
    S.k = m.id; S.cat = "my"; S.amt[m.id] = +m.base; S.edit = null; S.hot = 1; S.salty = 1; S.extra = false; S.step = 1; S.view = "one"; save(); render(true); toast("내 레시피를 저장했어요. 이제 양만 넣으면 돼요."); return; }
  if (d.cat) { S.cat = d.cat; const f = ALL().find(x => x.c === d.cat); if (f && KR(S.k).c !== d.cat) S.k = f.id; render(); return; }
  if (d.k) { S.k = d.k; S.hot = 1; S.salty = 1; S.extra = false; S.view = "one"; render(); return; }
  if (d.nx != null) { if (S.step === 1 && !readAmt()) return; S.step = Math.min(3, S.step + 1); render(true); return; }
  if (d.pv != null) { S.step = Math.max(0, S.step - 1); render(true); return; }
  if (d.home != null) { S.step = 0; render(true); return; }
  if (d.u) { const k = KR(S.k), old = unitOf(k); if (old !== d.u) { const a = amtOf(k); S.unit.baechu = d.u; S.amt.baechu = d.u === "포기" ? Math.max(1, Math.round(a / KG_PER_HEAD)) : Math.round(a * KG_PER_HEAD); save(); } render(); return; }
  if (d.st) { const k = KR(S.k), u = unitOf(k), stp = u === "포기" ? 1 : k.step; let a = amtOf(k) + (+d.st) * stp; a = Math.max(stp, Math.round(a * 100) / 100); S.amt[k.id] = a; save(); render(); return; }
  if (d.q) { S.amt[S.k] = +d.q; save(); render(); return; }
  if (d.hot) { S.hot = +d.hot; render(); return; }
  if (d.sal) { S.salty = +d.sal; render(); return; }
  if (d.v) { S.view = d.v; drawMat(); return; }
  if (d.add != null) { S.cart.push(curOpt()); save(); S.view = "cart"; render(); toast(`${KR(S.k).name}을 장보기에 담았어요 — 다른 김치도 고를 수 있어요.`); return; }
  if (d.rm != null) { S.cart.splice(+d.rm, 1); save(); render(); return; }
  if (d.print != null) { window.print(); return; }
  if (d.png != null) { savePng(); return; }
  if (d.copy != null) { const t = sheetText(); (navigator.clipboard && window.isSecureContext ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("글로 복사했어요. 카톡 · 메모에 붙여 넣으세요."), () => { const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); toast("글로 복사했어요."); } catch (e) { toast("복사하지 못했어요."); } a.remove(); }); return; }
});
function readAmt() { const el = $("#amt"); if (!el) return true; const v = parseFloat(String(el.value).replace(/[^\d.]/g, "")); if (!(v > 0)) { toast("양을 숫자로 넣어 주세요."); el.focus(); return false; } S.amt[S.k] = Math.round(v * 100) / 100; save(); return true; }
document.addEventListener("change", e => {
  if (e.target.id !== "imp" || !e.target.files[0]) return;
  const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); const list = (o && o.kind === "bj-kimchi-my" && Array.isArray(o.my)) ? o.my : null; if (!list) throw 0;
    let n = 0; list.forEach(m => { if (!m || !m.name || !Array.isArray(m.ing)) return; const i = S.my.findIndex(x => x.id === m.id); if (i >= 0) S.my[i] = m; else S.my.push(m); n++; });
    save(); render(); toast(`내 레시피 ${n}개를 불러왔어요.`); } catch (err) { toast("Blog J 김치 양념 계산기에서 보관한 파일이 아니에요."); } };
  r.readAsText(e.target.files[0]); e.target.value = "";
});
document.addEventListener("input", e => {
  if (e.target.id === "amt") { const v = parseFloat(String(e.target.value).replace(/[^\d.]/g, "")); if (v > 0) { S.amt[S.k] = Math.round(v * 100) / 100; save(); drawMat(); document.querySelectorAll("[data-q]").forEach(b => b.classList.toggle("on", +b.dataset.q === S.amt[S.k])); } }
  if (e.target.id === "extra") { S.extra = e.target.checked; drawMat(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "amt") { if (readAmt()) { S.step = 2; render(true); } } });
(async () => { const T = new URLSearchParams(location.search).get("tab") || "all"; if (!(await BJ_GATE.check("kimchi", T))) { const b = document.querySelector(".bar"); if (b) b.remove(); return; } render(); })();
</script></body></html>
