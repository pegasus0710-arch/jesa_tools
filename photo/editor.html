<style>

:root{--bg:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f1efe8;--line:#e7e5dc;--line2:#d7d4c8;--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--brand-ink:#20263a;--brand-accent:#e08a3e;--cat:#1f7f8f;--catbg:#e3f3f5;--success:#2e8a58;--danger:#b84a3c;
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh:0 10px 30px rgba(30,28,20,.09);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
.app{max-width:1200px;margin:0 auto;padding:20px 20px 40px;min-height:100vh}
.app.embed{padding:14px 14px 20px;min-height:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-.4px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--cat);color:#fff;display:grid;place-items:center;position:relative;box-shadow:var(--sh1)}
.brand .lg .jmini{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:6px;background:var(--brand-ink);color:#fff;font-size:9px;font-weight:900;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;border:2px solid var(--bg)}
.brand .cat{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--catbg);color:var(--cat)}
.brand .ver{font-family:var(--font);font-size:11px;color:var(--ink3);font-weight:500}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:18px;align-items:start}
.lay>*{min-width:0}
.col-l{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh1)}
.step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step-h .num{width:28px;height:28px;border-radius:9px;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:13px;flex-shrink:0}
.step h3,.res-h h3{font-family:var(--head);font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.step-h p{font-size:12.5px;color:var(--ink3);margin-top:2px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .muted{font-weight:500;color:var(--ink3)}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:15px}
input[type=number]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip:hover{background:var(--hover)}.chip.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand-ink)}
input[type=range]{width:100%;accent-color:var(--brand-ink);margin-top:4px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}
.qv{font-family:var(--head);font-size:15px;color:var(--brand-ink);margin-left:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:10px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-ink);color:var(--ink2);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:12px}
.note.w{border-left-color:var(--brand-accent);background:#fffaf2;color:#6b4a12}
.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--bg);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--ink2);transition:.12s}
.drop:hover,.drop.on{border-color:var(--brand-ink);background:#fff;color:var(--brand-ink)}
.drop b{font-size:15px;color:var(--ink)}.drop span{font-size:12.5px;color:var(--ink3)}
.col-r{position:sticky;top:16px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.lnk{color:var(--ink3);font-size:12.5px;font-weight:700}.lnk:hover{color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0;color:var(--ink3);font-size:13.5px;border:1.5px dashed var(--line2);border-radius:12px;margin-bottom:14px}
.list{list-style:none;max-height:420px;overflow-y:auto;margin:0 -4px 14px;padding:0 4px}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.th{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--tint);flex-shrink:0;border:1px solid var(--line)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta>b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>span{font-size:12px;color:var(--ink3)}.meta .res{color:var(--ink);font-weight:700}.arr{color:var(--ink3);margin:0 2px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:2px}
.tag.g{background:#e7f4ec;color:var(--success)}.tag.n{background:var(--tint);color:var(--ink2)}.tag.e{background:#fbece8;color:var(--danger)}
.acts{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-btn);font-weight:700;border:1px solid transparent;white-space:nowrap}
.btn.s{padding:6px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:#fff;border-color:var(--line2);color:var(--ink2)}.btn.ghost:hover{background:var(--hover)}
.btn.p{background:var(--brand-ink);color:#fff}.btn.p:hover{background:#343d5c}
.btn.accent{background:var(--brand-accent);color:#fff}.btn.accent:hover{background:#c9762f}
.btn:disabled{background:#eceae2;color:var(--ink3);cursor:default}
.btn.w{width:100%}.btn.big{padding:14px;font-size:15px;font-family:var(--head);border-radius:12px}
.sumr{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:13.5px;color:var(--ink2)}
.sumr b{color:var(--ink)}.sumr b.g{color:var(--success);font-family:var(--head)}
.priv{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.priv svg{flex-shrink:0;margin-top:1px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92vw;box-shadow:var(--sh);z-index:50}
.foot{margin-top:22px;padding:16px 0 4px;text-align:center;font-size:11.5px;color:var(--ink3)}
.foot a{color:var(--ink2);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line2)}
@media(max-width:1000px){.lay{grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px}.step{padding:18px}.flow li{font-size:11px;padding:6px}.flow li span{width:16px;height:16px}}
@media(max-width:700px){.lay{grid-template-columns:1fr}.col-r{position:static}}
@media(max-width:640px){.app{padding:12px 12px 30px}.step{padding:18px}.seg button{font-size:12.5px;padding:8px 4px}}
/* ── v1.0 추가: 자르기·규격·워터마크·편집·비교 ── */
.dd2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:15px}
input[type=text]:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
.hint b{color:var(--ink2)}.hint svg,.note svg{vertical-align:-2px}.hint.c{text-align:center;margin-top:8px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.pr{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.pr:hover{background:var(--hover)}.pr.on{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(32,38,58,.10)}
.pr b{font-family:var(--head);font-size:14px}.pr span{font-size:12.5px;color:var(--ink3)}
.sw{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:12px}
.sw span{flex:1;display:flex;flex-direction:column}.sw b{font-size:14px}.sw small{font-size:12.5px;color:var(--ink3)}
.sw input{display:none}.sw i{width:42px;height:24px;border-radius:999px;background:#d7d4c8;position:relative;flex-shrink:0;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw input:checked+i{background:var(--brand-ink)}.sw input:checked+i::after{left:21px}
.wmb{display:flex;flex-direction:column}
.sw-c{display:inline-flex;align-items:center;gap:6px}.sw-c i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line2);display:inline-block}
.posg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:240px}
.posg button{height:34px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink2);font-weight:700}
.posg button.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.posg .tile{grid-column:1/-1;font-size:12.5px}
.btn.act{border-color:var(--brand-ink);color:var(--brand-ink);box-shadow:0 0 0 2px rgba(32,38,58,.12)}
.ov{position:fixed;inset:0;background:rgba(24,22,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.md{background:#fff;border-radius:18px;width:100%;max-width:620px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(30,28,20,.22)}
.md.wide{max-width:760px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}.mh h3{font-family:var(--head);font-size:17px;display:flex;align-items:center;gap:8px}
.mh .x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink3)}.mh .x:hover{background:var(--hover)}
.mb{padding:6px 20px 16px}.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.edw{display:flex;justify-content:center;background:var(--tint);border-radius:12px;padding:10px}
.edc{position:relative;overflow:hidden;touch-action:none}.edc canvas{display:block}
.cbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(20,22,30,.5);cursor:move;touch-action:none}
.cbox .g1,.cbox .g2{position:absolute;inset:0;pointer-events:none}
.cbox .g1{border-left:1px solid rgba(255,255,255,.45);border-right:1px solid rgba(255,255,255,.45);left:33.3%;right:33.3%}
.cbox .g2{border-top:1px solid rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.45);top:33.3%;bottom:33.3%}
.edt{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.edt .btn{flex:1;min-width:110px}
.cmp{position:relative;background:var(--tint);border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmp .after{position:absolute;inset:0}.cmp .bar{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);transform:translateX(-1px)}
.cmp .lb{position:absolute;top:10px;font-size:12px;font-weight:700;color:#fff;background:rgba(32,38,58,.8);border-radius:7px;padding:3px 8px}.cmp .lb.l{left:10px}.cmp .lb.r{right:10px}
.thb{position:relative;flex-shrink:0;padding:0;border-radius:9px}.thb .eye{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:6px;background:rgba(32,38,58,.8);display:grid;place-items:center}
.est{display:flex;gap:7px;align-items:center;background:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink2);margin-bottom:12px}.est b{color:var(--ink)}.est small{color:var(--ink3)}
@media(max-width:640px){.presets{grid-template-columns:1fr 1fr}.md{border-radius:16px}.mb{padding:6px 14px 14px}}
/* ── 단계 안내 · 실시간 미리보기 ── */
.flow{display:flex;list-style:none;gap:6px;margin-bottom:8px}
.flow li{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink3);background:var(--bg);border-radius:9px;padding:7px 8px;white-space:nowrap}
.flow li span{width:18px;height:18px;border-radius:6px;background:var(--line2);color:#fff;display:grid;place-items:center;font-size:11px;flex-shrink:0}
.flow li.on{color:var(--brand-ink);background:#ebedf3}.flow li.on span{background:var(--brand-ink)}
.flow li.ok{color:var(--success)}.flow li.ok span{background:var(--success)}
.guide{font-size:13px;color:var(--ink2);margin:0 2px 14px;line-height:1.55}
.pv{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:16px;background:#fff}
.pv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.pv-top b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.sm{padding:3px;flex-wrap:nowrap;flex-shrink:0}.seg.sm button{padding:5px 11px;font-size:12px;flex:none}
.pv-box{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;display:grid;place-items:center;
  background-color:#eeece5;background-image:linear-gradient(45deg,#e4e1d8 25%,transparent 25%),linear-gradient(-45deg,#e4e1d8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4e1d8 75%),linear-gradient(-45deg,transparent 75%,#e4e1d8 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.pv-box img{max-width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pv-load{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#fff;background:rgba(32,38,58,.8);border-radius:8px;padding:4px 10px}
.pv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;color:var(--ink3);margin-top:8px}.pv-meta b{color:var(--ink)}.pv-meta b.g{color:var(--success)}
.pv-note{font-size:12px;color:#6b4a12;background:#fffaf2;border-radius:8px;padding:6px 9px;margin-top:6px}
.list li{cursor:pointer;border-radius:10px;padding:9px 6px;margin:0 -6px}.list li:hover{background:#faf9f5}.list li.sel{background:#ebedf3}

@media(max-width:1000px){.seg button{font-size:12.5px;padding:8px 3px}}
.mob-run{display:none}
@media(max-width:700px){
  .lay{display:flex;flex-direction:column}
  .col-l{display:contents}
  .col-l>.step:first-child{order:1}
  .col-r{order:2}
  .col-l>.step:not(:first-child){order:3}
  .mob-run{display:flex;order:4}
}
/* 미리보기 안 위치 조정 */
.pad{display:flex;flex-direction:column;align-items:center;background:var(--tint);border-radius:10px;padding:10px}
.pad{min-width:0;width:100%}.pad-in{position:relative;overflow:hidden;touch-action:none;max-width:100%}.pad-in canvas{display:block;width:100%;height:auto}
.pad .cbox{cursor:grab}.pad .cbox:active{cursor:grabbing}
.cbox .hand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(32,38,58,.75);border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none}
.pad-ctl{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.pad-ctl label{white-space:nowrap}.pad-ctl input{flex:1;min-width:60px}.pad-ctl b{color:var(--brand-ink)}
.pad-tip{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.5}.pad-tip svg{vertical-align:-2px}

.col-r{min-width:0}.res-card{min-width:0}
@media(max-width:420px){.flow li{white-space:normal;line-height:1.25}}
.pv-top b{min-width:0;flex:1}
@media(max-width:420px){.res-card{padding:14px}.flow{gap:4px}.flow li{padding:6px 5px;gap:4px}}
/* 편집 창 안내 */
.ed-guide{list-style:none;display:flex;flex-direction:column;gap:5px;background:#ebedf3;border-radius:12px;padding:10px 12px;margin-bottom:12px}

.hand-bar{max-width:1200px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hand-bar>span{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-accent);border-radius:10px;padding:8px 12px}

@media(max-width:640px){.hand-bar{padding:10px 12px 0}.hand-bar .btn{width:100%;justify-content:center}.hand-bar>span{width:100%}.hand-b{grid-template-columns:1fr 1fr}}
.hand-bar em{font-style:normal}
.hand-bar.k{max-width:1120px}.hand-bar.e{padding:12px 14px 0}
@media(max-width:640px){.app .top{gap:8px}.app .top .brand{font-size:17px;gap:9px;white-space:nowrap;min-width:0}.app .top .brand .cat,.app .top .brand .ver{display:none}.app .top .backb{padding:6px 8px;flex-shrink:0}}
/* 콜라주 칸 확대 */
.cl-cvw{position:relative;display:inline-block;max-width:100%}
.cl-zm{position:absolute;transform:translate(-50%,calc(-100% - 8px));display:flex;align-items:center;gap:2px;background:rgba(20,24,34,.82);border-radius:999px;padding:3px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}
.cl-zm button{width:30px;height:30px;border-radius:999px;color:#fff;font-size:19px;font-weight:700;line-height:1;display:grid;place-items:center}.cl-zm button:hover:not(:disabled){background:rgba(255,255,255,.15)}.cl-zm button:disabled{opacity:.35}
.cl-zm b{font-size:12.5px;min-width:38px;text-align:center}
/* 필터 겹치기 · 필터 없음 (10-17) */
.fnone{margin:12px 0 0}
.fstack{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--hover);display:flex;flex-direction:column;gap:8px}
.fs-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.fs-l>b{font-size:13px;margin-right:2px}
.fs-c{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line2);font-size:12.5px;font-weight:700}
.fs-c button{width:20px;height:20px;border-radius:50%;border:0;background:transparent;color:var(--ink3);font-size:15px;line-height:1;cursor:pointer}.fs-c button:hover{background:var(--line);color:var(--ink)}
.fs-c.now{border-style:dashed;padding-right:10px}.fs-c.now small{font-weight:400;color:var(--ink3)}
.fs-b{display:flex;flex-wrap:wrap;gap:6px}

/* ══════════ 디자인 3.0 "입체 교정지" — 이미지 편집기 v2.0 (재질 · 색 · 부품만, 배치는 그대로) ══════════ */
:root{--bg:#ece6da;--panel:#f1ebe1;--tint:#e7e0d2;--hover:#f7f2e9;--line:#ddd5c5;--line2:#cfc6b3;--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;
--card:#f4efe6;--in-bg:#e7e0d2;--pr-bg:#e6dfd1;--tray:#e2dacb;--amber:#e08a3e;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-m:6px 7px 16px rgba(160,140,108,.38),-5px -5px 12px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--sh1:var(--up-s);--sh:var(--up-m)}
html,body{background:var(--bg)}
body{color:var(--ink);letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}

/* 머리: 분야색 배지(위 빛 · 아래 눌린 테두리 · 앰버 점) */
.brand .lg{box-shadow:3px 5px 10px rgba(20,90,100,.35),-3px -3px 8px rgba(255,255,255,.85),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.brand .lg .jmini{background:var(--amber);border:2px solid var(--bg);color:transparent;width:13px;height:13px;border-radius:50%;right:-4px;bottom:-4px}
.brand .cat{background:var(--in-bg);box-shadow:var(--in);color:var(--cat)}

/* 돋움 패널 · 카드 */
.step,.bcard,.res-card,.md,.cw-p,.edws-p{background:var(--panel);border:0;box-shadow:var(--up)}
.hm-c,.pgrid li,.ogrid li,.frc,.tpl,.mp,.hand-c,.pr{background:var(--card);border-color:transparent;box-shadow:var(--up-s)}
.hm-c:hover,.frc:hover,.tpl:hover,.mp:hover,.hand-c:hover,.pr:hover{background:var(--hover);border-color:transparent;box-shadow:var(--up-s),inset 0 0 0 2px var(--brand-ink);transform:translateY(1px)}
.hm-feat{box-shadow:var(--up)}
.hc-ic,.hm-c .ic{background:var(--in-bg);box-shadow:var(--in)}

/* 고르기 카드(필터 · 콜라주 칸): 고르면 눌림 + 남색 테두리 + 앰버 점 */
.fcard,.cgrid li{background:var(--card);border-color:transparent;box-shadow:var(--up-s);position:relative}
.fcard:hover,.cgrid li:hover{border-color:var(--brand-ink)}
.fcard.on,.cgrid li.on,.frc.on,.tpl.on,.pr.on{background:var(--pr-bg);border-color:var(--brand-ink);box-shadow:var(--press),0 0 0 0 transparent}
.fcard.on::after,.cgrid li.on::after,.frc.on::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);z-index:2}

/* 들어감: 입력칸 · 나눔 버튼 홈 · 요약 · 접는 상자 · 안내 */
input[type=text],input[type=number],.sel,textarea{background:var(--in-bg);border-color:transparent;box-shadow:var(--in)}
input[type=text]:focus,input[type=number]:focus,.sel:focus,textarea:focus{box-shadow:var(--in),inset 0 0 0 2px var(--brand-ink)}
.seg,.scope{background:var(--in-bg);box-shadow:var(--in)}
.seg button.on,.scope button.on{background:var(--card);box-shadow:2px 3px 7px rgba(160,140,108,.4),-2px -2px 6px rgba(255,255,255,.9)}
details.fine,details.cl-sec,.efx,.pbox,.resb,.hand,.fstack{background:var(--in-bg);border-color:transparent;box-shadow:var(--in)}
.note{background:var(--in-bg);border:0;box-shadow:var(--in);border-left:0}
.pv,.hist,.slist,.ed-info span{background:var(--tray);border-color:transparent;box-shadow:var(--in)}
.sw{background:var(--card);border-color:transparent;box-shadow:var(--up-s)}
.sw i{background:var(--in-bg);box-shadow:var(--in)}
.sw input:checked+i{background:var(--brand-ink);box-shadow:var(--press)}

/* 칩 → 들어간 홈 안 버튼(알약 대신 10px 모서리) */
.chip,.fcat button{border-radius:10px;background:var(--card);border-color:transparent;box-shadow:var(--up-s);color:var(--ink2)}
.chip:hover,.fcat button:hover{background:var(--hover);box-shadow:var(--up-s),inset 0 0 0 2px var(--brand-ink)}
.chip.on,.fcat button.on{background:var(--pr-bg);color:var(--brand-ink);border-color:transparent;box-shadow:var(--press),inset 0 0 0 2px var(--brand-ink)}
.fcat{background:var(--in-bg);box-shadow:var(--in);padding:6px;border-radius:12px}
.fs-c{border-radius:10px;background:var(--card);border-color:transparent;box-shadow:var(--up-s)}
.fs-c.now{box-shadow:inset 0 0 0 1.5px var(--line2);background:transparent}

/* 버튼: 보조 = 돋움, 남색 = 보조 실행, 앰버 = 주 버튼(한 곳) */
.btn.ghost{background:var(--card);border-color:transparent;box-shadow:var(--up-s);color:var(--ink2)}
.btn.ghost:hover{background:var(--hover);box-shadow:var(--up-s),inset 0 0 0 2px var(--brand-ink);color:var(--ink)}
.btn.p{box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85)}
.btn.accent{box-shadow:4px 6px 14px rgba(170,110,55,.45),-3px -3px 8px rgba(255,255,255,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active:not(:disabled){box-shadow:var(--press)}
.btn:disabled{background:var(--in-bg);box-shadow:none;color:var(--ink3)}
.posg button{background:var(--card);border-color:transparent;box-shadow:var(--up-s)}

/* 진행 표시 — 3.0 눈금자 + C안(앰버 선 · 구슬), 라벨 · 지방 · 축문과 같은 모양 */
.ruler{background:var(--in-bg);box-shadow:var(--in);border-radius:16px;padding:10px 20px;position:relative;margin-bottom:18px}
.ruler::before{content:"";position:absolute;left:20px;right:20px;top:10px;height:10px;background:repeating-linear-gradient(90deg,rgba(31,33,37,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,repeating-linear-gradient(90deg,rgba(31,33,37,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat;pointer-events:none}
.ruler ol{list-style:none;display:grid;gap:8px;margin:0;padding:0}
.ruler li{position:relative}
.ruler button{position:relative;display:block;width:100%;text-align:left;padding:22px 10px 4px;border-radius:10px;font-size:14.5px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;cursor:pointer}
.ruler button:disabled{cursor:default}
.ruler button .rn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;margin-right:7px}
.ruler button.done{color:var(--ink2)}
.ruler button.cur{color:var(--ink);font-weight:800}
.ruler button:hover:not(:disabled){color:var(--ink);background:rgba(244,239,230,.7);box-shadow:inset 0 0 0 2px var(--brand-ink)}
.ruler .bead{position:absolute;left:10px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--amber);box-shadow:2px 3px 5px rgba(120,70,20,.45),inset 2px 2px 3px rgba(255,255,255,.45);z-index:2}
.ruler li:has(>button.done)::after,.ruler li:has(>button.cur)::after{content:"";position:absolute;left:0;top:9px;height:3px;background:var(--amber);pointer-events:none;z-index:1}
.ruler li:has(>button.done)::after{right:-8px}
.ruler li:has(>button.cur)::after{width:17px}
@media (max-width:640px){.ruler{padding:8px 10px}.ruler::before{left:10px;right:10px}.ruler ol{gap:2px}.ruler button{padding:20px 2px 4px;font-size:12.5px;text-align:center}.ruler button .rn{display:block;margin:0}.ruler .bead{left:calc(50% - 7px)}.ruler li:has(>button.done)::after{right:-2px}.ruler li:has(>button.cur)::after{width:50%}}
.bnav{border-top-color:var(--line)}

/* 결과 · 사진 칸 · 떠 있는 창 */
.toast{box-shadow:0 10px 26px rgba(32,38,58,.35)}
.dropov>div{background:var(--panel)}
.drop{background:var(--in-bg);box-shadow:var(--in);border-color:var(--line2)}
.drop:hover,.drop.on{background:var(--hover)}
.th{border-color:transparent}
/* 필터 크게 보며 고르기 — 사진(비교 막대) 왼쪽 · 메뉴 오른쪽(작은 화면과 같은 자리) */
.bigf{position:fixed;inset:0;z-index:4000;background:#15171d;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
.bigf-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.bigf-top>b{display:flex;align-items:center;gap:7px;font-size:15px}
.bigf-n{flex:1;min-width:0;color:#cfd5e6;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigf-top .btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.bigf-top .btn.ghost:hover{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 2px #fff}
.bigf-top .btn.p{background:var(--amber);box-shadow:none}
.bigf-stage{position:relative;min-height:0;min-width:0;padding:4px 60px 16px}
.bigf-stage .spv{aspect-ratio:auto;width:100%;height:100%;background:transparent;border-radius:6px}
.bigf-busy,.bigf-tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;background:rgba(32,38,58,.9);padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700}
.bigf-tag{top:auto;bottom:24px;background:var(--amber)}
.bigf-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:72px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;z-index:6}
.bigf-nav.l{left:8px}.bigf-nav.r{right:8px}.bigf-nav:disabled{opacity:.25;cursor:default}
.bigf-bar{background:var(--panel);color:var(--ink);padding:14px 16px 18px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.bigf-cards .fcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.bigf-cards .fcard small{display:none}
.bigf-bar .fstack{margin-top:0}
.bigf-hint{font-size:12.5px;color:var(--ink3);margin:0;line-height:1.5}
@media (max-width:760px){.bigf{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}.bigf-bar{max-height:48vh}.bigf-stage{padding:4px 8px 8px}.bigf-nav{display:none}.bigf-cards .fcards{display:flex;overflow-x:auto}.bigf-cards .fcard{flex:0 0 118px}}
.spv-big{position:absolute;right:12px;bottom:12px;z-index:5;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;border:0;background:rgba(32,38,58,.88);color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.spv-big:hover{background:var(--brand-ink);box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 0 0 2px #fff}
@media (max-width:640px){.spv-big{right:8px;bottom:8px;padding:7px 10px;font-size:12.5px}}
/* 5단계 가리기 */
.mk-lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;margin-top:14px}
.mk-stage{background:#1d2130;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:320px}
.mk-wrap{position:relative;touch-action:none;cursor:crosshair;user-select:none}
.mk-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk-load{color:#cfd5e6;font-size:14px}
.mk-b{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);cursor:move;box-sizing:border-box}
.mk-b.oval{border-radius:50%}
.mk-b.face{border-color:#ffd27a}
.mk-b.on{border:2.5px solid var(--amber);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 4px rgba(224,138,62,.35)}
.mk-b.draw{border:2px solid var(--amber);background:rgba(224,138,62,.18)}
.mk-h{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #fff;cursor:nwse-resize}
.mk-pen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);background:rgba(194,58,43,.92);color:#fff;font-weight:800;font-size:16px;padding:9px 16px;border-radius:10px;pointer-events:none;white-space:nowrap}
.mk-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.mk-box{background:var(--in-bg);box-shadow:var(--in);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mk-t{display:flex;align-items:center;gap:6px;font-size:14px}
.mk-row{display:flex;gap:6px;flex-wrap:wrap}
.mk-off{display:flex;gap:7px;align-items:flex-start;margin:0;padding:9px 11px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 2px var(--danger);font-size:13px;line-height:1.5;color:var(--ink2)}
.mk-off svg{color:var(--danger);flex-shrink:0;margin-top:2px}
.mk-warn{display:flex;gap:6px;align-items:flex-start;margin:0;font-size:12.5px;color:#9a4a1a;line-height:1.45}
.mk-box .f{margin:2px 0 0}
.mk-del{align-self:flex-start;margin-top:4px}
.mk-sum>span{font-size:13.5px;color:var(--ink2)}
.mk-exif{display:flex;gap:6px;align-items:center;margin:0}
.mk-lay .fx-strip{margin-top:12px}
@media (max-width:900px){.mk-lay{grid-template-columns:1fr}}
.bigf-mode{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7;display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(20,22,30,.82);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bigf-mode button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:0;background:transparent;color:#cfd5e6;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.bigf-mode button:hover{color:#fff;background:rgba(255,255,255,.08)}
.bigf-mode button.on{background:#f4efe6;color:#1f2125}
.bigf-mode button.on.hold{background:var(--amber);color:#fff}
.bigf-one{position:absolute;inset:4px 60px 16px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;user-select:none}
.bigf-one img{max-width:100%;max-height:100%;object-fit:contain}
.bigf .spv-l{top:58px}
@media (max-width:760px){.bigf-one{inset:4px 8px 8px}.bigf-mode button{padding:7px 10px;font-size:12.5px}}
.mk-th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mk-trash{width:40px;height:40px;border-radius:11px;border:0;background:var(--card);box-shadow:var(--up-s);color:var(--danger);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mk-trash:hover{box-shadow:var(--up-s),inset 0 0 0 2px var(--danger)}
.mk-lab{font-size:12.5px;font-weight:800;color:var(--ink3);letter-spacing:.02em}
.mk-add{min-height:46px;font-size:15px}
.mk-steps{margin:2px 0 0;padding-left:20px;font-size:13px;line-height:1.55;color:var(--ink2)}
.mk-steps li+li{margin-top:3px}
.mk-note{display:flex;gap:6px;align-items:flex-start;margin:0;font-size:12.5px;line-height:1.5;color:var(--ink2)}.mk-note svg{flex-shrink:0;margin-top:2px;color:var(--brand-ink)}
/* 크게 확대: 확대·축소 · 미니맵 */
.zv{user-select:none}
.zv-b{display:block;overflow:hidden;cursor:default}
.zv-b.can{cursor:grab}.zv-b.can:active{cursor:grabbing}
.zv-img{position:absolute;left:0;top:0;max-width:none;image-rendering:auto;pointer-events:none}
.zv-z{display:flex;align-items:center;gap:3px;margin-left:auto;padding:3px;border-radius:10px;background:rgba(255,255,255,.08)}
.zv-z button{min-width:34px;height:32px;padding:0 9px;border:0;border-radius:8px;background:transparent;color:#e6e9f2;font-weight:700;font-size:13.5px;cursor:pointer}
.zv-z button:hover{background:rgba(255,255,255,.14)}
.zv-z button.pct{min-width:58px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff}

.zv-z button.fit{margin-left:6px}
.zv-mini{position:absolute;right:16px;bottom:16px;z-index:3;border:2px solid rgba(255,255,255,.85);border-radius:6px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer;background:#000}
.zv-mini img{width:100%;height:100%;display:block;pointer-events:none}
.zv-mini i{position:absolute;border:2px solid var(--amber);background:rgba(224,138,62,.18);box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
@media (max-width:640px){.zv-z button.fit,.zv-z button:nth-child(5),.zv-z button:nth-child(6){display:none}.zv-mini{right:8px;bottom:8px}}
/* 6단계: px 조절 · 로고 크기 손잡이 */
.pxr{display:flex;align-items:center;gap:10px}
.pxr input[type=range]{flex:1;min-width:0}
.pxn{display:flex;align-items:center;gap:4px;flex-shrink:0}
.pxn input{width:78px;padding:7px 8px;text-align:right}
.pxn i{font-style:normal;font-size:12.5px;color:var(--ink3);font-family:ui-monospace,Menlo,Consolas,monospace}
.frv-w{position:relative;max-width:100%;max-height:100%}
.frv .frv-w img{position:absolute;inset:0;width:100%;height:100%}
.wm-box{position:absolute;border:1.5px dashed rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none}
.wm-h{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--amber);border:2px solid #fff;cursor:nwse-resize;pointer-events:auto;touch-action:none}
.swc-a{width:auto!important;padding:0 10px;border-radius:999px!important;font-size:12.5px;font-weight:700;background:var(--card)!important;color:var(--ink2)}
/* 눈금자: 마우스를 올리면 글자만 바뀜(칸 테두리 없음) */
.ruler button:hover:not(:disabled){background:none;box-shadow:none;color:var(--ink)}
.ruler button:hover:not(:disabled) .rn{color:var(--amber)}
.ruler button:not(:disabled):not(.cur):hover{text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:2px;text-underline-offset:5px}
.fr-blur{background:radial-gradient(circle at 30% 30%,#a8c6dd,#7e9a74 70%)!important}
.fr-blur i{box-shadow:0 3px 6px rgba(0,0,0,.35)}
.fr-tape{background:#f1ece0!important}
.fr-tape i{box-shadow:0 0 0 2px #fff,0 3px 5px rgba(0,0,0,.25)}
.fr-tape::before,.fr-tape::after{content:"";position:absolute;top:4px;width:13px;height:5px;background:rgba(230,210,150,.95);z-index:1}
.fr-tape::before{left:6px;transform:rotate(-35deg)}.fr-tape::after{right:6px;transform:rotate(35deg)}
.fr-solid i{outline:3px solid #fff;box-shadow:0 0 0 4px #20241f}
/* 보조 글씨 최소 12.5px (Blog J 규격) — 작은 꼬리표만 12px */
.hf-new,.bh h2 small,.res-h h3 small,.pg-m span,.spv-l,.fcard small,.og-m span,.og-e,.efx-h small,.frc b,.clipn,.scope button small,.mp-a small,.fgrp{font-size:12.5px}
.own,.cl-ph li>span,.bflow li em{font-size:12px}
@media (max-width:640px){.bflow li{font-size:12px}}
.nav-why{font-size:12.5px;color:var(--muted,#6b6f78);margin-right:10px;align-self:center}
.bigf-own{font-style:normal;font-weight:700;color:#20263a;background:#f4efe6;border-radius:6px;padding:1px 7px;margin-left:6px;font-size:12.5px}
.bigf-bar .scope{margin-bottom:0}.bigf-bar .scope-n{margin:-4px 0 0}
/* 그룹 보정 (2026-10-19) */
.scope.s3 button{padding:9px 4px}.scope button:disabled{opacity:.45;cursor:default}
.gchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 12px}
.gchips>span{font-size:12.5px;font-weight:700;color:#6f6857;margin-right:2px}
.gchips button{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:#f4efe6;color:#1f2125;border:1px solid #d9d0bf}
.gchips button small{font-weight:500;color:#6f6857;margin-left:2px}
.gchips button.on{border:2px solid #20263a;padding:4px 9px}
.gchips .gadd{background:transparent;border:1px dashed #b9ae98;color:#20263a}
.own.g{background:#20263a}
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#fff3a3;border-radius:10px;padding:9px 12px;margin-top:8px;font-size:13.5px;color:#1f2125}
.gbar>span{color:#5b5547}.gbar-b{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.fx-strip.gpick button{opacity:.6}.fx-strip.gpick button.chk{opacity:1;border-color:#20263a}
.gck{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.9);border:2px solid #20263a;display:grid;place-items:center}
.chk .gck{background:#20263a}


/* ══════════ 3.0 마무리 (2026-10-18) — 처음 화면 · v1.0 기능 화면 6개 · 콜라주 · 공통 부품 ══════════ */
:root{--success:#20263a}
/* 알약 칩 → 모서리 8px 꼬리표 */
.chip,.fcat button,.hf-chips em,.hf-new,.bh h2 small,.sum4 span,.ed-info span,.cl-meta>*,.fs-c,.brand .cat,.cw-n,.swc-a{border-radius:8px!important}
/* 처음 화면: 큰 네이비 카드 — 앰버는 「시작하기」 한 곳만 */
.hf-new{background:transparent;color:#f3d7bd;box-shadow:inset 0 0 0 1.5px rgba(243,215,189,.55);font-size:12.5px}
.hf-chips em{background:rgba(255,255,255,.08);color:#e4e8f2;font-size:12.5px}
.hm-feat:hover{box-shadow:var(--up),inset 0 0 0 2px #f4efe6;transform:translateY(1px)}
/* v1.0 화면 오른쪽 위 진행 표시: 초록 체크 → 남색 (지난 단계는 남색 칸, 지금 단계는 눌림 + 남색 테두리) */
.flow li{background:var(--in-bg);box-shadow:var(--in);font-size:12.5px}
.flow li.on{background:var(--pr-bg);color:var(--ink);box-shadow:var(--press),inset 0 0 0 2px var(--brand-ink)}
.flow li.on span{background:var(--brand-ink)}
.flow li.ok{color:var(--brand-ink)}
.flow li.ok span{background:var(--brand-ink)}
/* 사진 목록: 고른 줄 — 입력칸(.sel) 모양이 섞여 폭이 어긋나던 것 바로잡음 */
.list li.sel{width:auto;padding:9px 6px;border:0;border-bottom:1px solid transparent;border-radius:12px;background:var(--pr-bg);box-shadow:var(--press),inset 0 0 0 2px var(--brand-ink);font-size:inherit;position:relative}
.list li.sel::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:3px solid var(--panel)}
.list li:hover{background:var(--hover)}
/* 흰 상자 + 왼쪽 색선(폐기) → 들어간 안내 상자 */
.note,.note.w,.cmp-tip,.hand-bar>span,.resume{background:var(--in-bg);border:0;border-left:0;box-shadow:var(--in);color:var(--ink2)}
.note.w{box-shadow:var(--in),inset 0 0 0 2px var(--amber);color:#6b4a12}
.resume{border-radius:12px}
/* 콜라주 추천 배치 그림: 파랑 회색 → 먹 계열, 고른 것만 남색 + 앰버 점 */
.tpl svg rect{fill:#cfc6b3}.tpl.fit svg rect{fill:#8d8574}.tpl.on svg rect{fill:var(--brand-ink)}
.tpl{position:relative}.tpl.on::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:3px solid var(--panel);z-index:2}
.tpl small{font-size:12.5px;color:var(--ink2)}
.cl-cell{border:0;background:var(--in-bg);box-shadow:var(--in),inset 0 0 0 2px var(--brand-ink)}
/* 「이어서 작업하기」 고른 칸: 앰버 글자 → 눌림 + 남색 */
.hand-c.on{background:var(--pr-bg);color:var(--ink);box-shadow:var(--press),inset 0 0 0 2px var(--brand-ink)}
/* 작은 글자 12.5px 아래로 내려가지 않게 */
.brand .cat,.own,.pv-box .zm,.cbx .hand,.ed-guide li span{font-size:12.5px}
/* 앞쪽 단계 번호: 남색 칸 + 위 빛 (돋움) */
.step-h .num{border-radius:9px;box-shadow:2px 3px 6px rgba(32,38,58,.3),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.25)}
/* 휴대폰: 크기 방식 6칸 · 형식 4칸이 잘리지 않게 두 줄로 */
@media (max-width:640px){
  .seg{flex-wrap:wrap}
  .seg button{flex:1 1 calc(33.33% - 6px);min-width:0}
}
/* 초록 꼬리표(줄인 비율 · 편집 표시) → 들어간 칸 + 남색 글자 */
.tag.g{background:var(--in-bg);box-shadow:var(--in);color:var(--brand-ink);border-radius:8px}
.tag{font-size:12.5px}
/* 워터마크 위치 칸: 고른 칸 = 눌림 + 남색 테두리 (네이비 칠 → 3.0 고르기 방식) */
.posg button.on{background:var(--pr-bg);color:var(--brand-ink);border-color:transparent;box-shadow:var(--press),inset 0 0 0 2px var(--brand-ink)}
#ph-bar{position:sticky;top:0;z-index:50;background:#20263a;color:#fff;font-size:14px;font-weight:600;padding:9px 16px;text-align:center}#ph-note{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:#20263a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .3s;max-width:calc(100vw - 32px)}#ph-note.bad{background:#b84a3c}</style></head><body><div id="root"></div>

            ${cur.mode === "blur" || cur.mode === "mosaic" ? html`<label class="f">세기 <b class="qv">${cur.k}</b></label><input type="range" min="1" max="10" value=${cur.k} onInput=${e => upd(cur.id, { k: +e.target.value })} />
              ${cur.mode === "blur" && cur.k < 5 ? html`<p class="mk-warn">${h(Icon, { name: "alert", size: 14 })} 흐림이 약하면 글자 · 번호를 알아볼 수 있어요. 번호는 「완전히 가림」을 권해요.</p>` : null}`
              : html`<label class="f">색</label><div class="seg">${MASK_COLORS.map(([k, l]) => html`<button class=${cur.color === k ? "on" : ""} onClick=${() => upd(cur.id, { color: k })}>${l}</button>`)}</div>`}
            ${cur.mode === "label" ? html`<label class="f">띠 글자</label><input type="text" maxLength="12" value=${cur.text} placeholder="가림" onInput=${e => upd(cur.id, { text: e.target.value })} />` : null}
          </div>`
          : html`<div class="mk-box"><span class="mk-lab">손으로 가리기</span>
              <button class="btn p mk-add" onClick=${addBox}>${h(Icon, { name: "plus", size: 17, color: "#fff" })} 가릴 상자 넣기</button>
              <ol class="mk-steps"><li>상자가 사진 가운데에 생겨요. <b>상자를 끌어 가릴 곳으로 옮기고</b>, 오른쪽 아래 <b>주황 점</b>을 끌어 크기를 맞춰요.</li><li>사진 위를 <b>직접 끌어서</b> 그려도 돼요.</li><li>상자를 누르면 흐리게 · 모자이크 · 완전히 가림 · 글자 띠로 바꿀 수 있어요.</li></ol>
              <p class="mk-note">${h(Icon, { name: "info", size: 14 })}<span>점선 테두리는 고를 때만 보이는 표시예요. <b>저장한 사진에는 테두리가 그려지지 않아요.</b></span></p></div>`}
        <div class="mk-box mk-sum"><span>가린 부분 <b>${masks.length}개</b> · 전체 가린 부분 <b>${total}개</b></span>
          <div class="mk-row">${cur ? html`<button class="btn s ghost" onClick=${addBox}>${h(Icon, { name: "plus", size: 14 })} 상자 더 넣기</button>` : null}${masks.length && ready.length > 1 ? html`<button class="btn s ghost" onClick=${copyAll}>${h(Icon, { name: "repeat", size: 14 })} 다른 사진에도 같은 자리</button>` : null}${masks.length ? html`<button class="btn s ghost" onClick=${() => { if (confirm("이 사진의 가린 곳 " + masks.length + "개를 모두 삭제할까요?")) { setM([]); setAct(null); } }}>${h(Icon, { name: "trash", size: 14 })} 모두 삭제</button>` : null}</div></div>
        <p class="hint mk-exif">${h(Icon, { name: "shield", size: 14, color: "#20263a" })} 저장한 사진에서는 찍은 위치(GPS) · 기기 정보도 자동으로 빠져요.</p>
      </div>
    </div>
    ${nav}
  </section>`;
}

/* ══════════ 사진 뷰어에서 열렸을 때 (내 PC용 두 파일 연결) ══════════
   사진 뷰어가 브라우저 저장소(IndexedDB "bj-handoff")에 사진 · 폴더를 넣고 이 파일을 엶 → 여기서 꺼내 씀.
   저장(내려받기)은 그 사진 폴더 안 「편집본」 폴더에 바로 씀. 안 되면 평소처럼 내려받기. */
const PHOTO_LINK = { dh: null, where: "", sub: "편집본" };
const HO_DB = { open() { return this.p || (this.p = new Promise((res, rej) => { const q = indexedDB.open("bj-handoff", 1); q.onupgradeneeded = () => q.result.createObjectStore("h"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); },
  async get(k) { const db = await this.open(); return new Promise(r => { const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); },
  async put(k, v) { const db = await this.open(); return new Promise(r => { const t = db.transaction("h", "readwrite"); t.objectStore("h").put(v, k); t.oncomplete = r; t.onerror = r; }); },
  async del(k) { const db = await this.open(); return new Promise(r => { const t = db.transaction("h", "readwrite"); t.objectStore("h").delete(k); t.oncomplete = r; t.onerror = r; }); } };
const downloadBlob0 = downloadBlob, PH_SAVED = new WeakSet();
function phNote(t, bad) { let el = document.getElementById("ph-note"); if (!el) { el = document.createElement("div"); el.id = "ph-note"; document.body.appendChild(el); }
  el.textContent = t; el.className = bad ? "bad" : ""; el.style.opacity = "1"; clearTimeout(phNote.t); phNote.t = setTimeout(() => { el.style.opacity = "0"; }, 4200); }
async function phFree(dh, name) { const dot = name.lastIndexOf("."), a = dot > 0 ? name.slice(0, dot) : name, b = dot > 0 ? name.slice(dot) : ""; let nm = name, i = 1;
  for (;;) { try { await dh.getFileHandle(nm); i++; nm = `${a} (${i})${b}`; } catch (e) { return nm; } } }
/* 사진 폴더의 「편집본」에 여러 장을 한 번에 씀 (만들기 · 변환하기를 누르면 바로) */
async function phSaveList(list) { let n = 0;
  try { const dh = PHOTO_LINK.dh; let p = await dh.queryPermission({ mode: "readwrite" }); if (p !== "granted") p = await dh.requestPermission({ mode: "readwrite" }); if (p !== "granted") throw new Error("perm");
    const sd = await dh.getDirectoryHandle(PHOTO_LINK.sub, { create: true });
    for (const en of list) { const nm = await phFree(sd, en.name), fh = await sd.getFileHandle(nm, { create: true }), w = await fh.createWritable(); await w.write(en.blob); await w.close(); PH_SAVED.add(en.blob); n++; }
    await HO_DB.put("saved", { at: Date.now(), where: PHOTO_LINK.where, n });
    phNote(`사진 폴더 「${PHOTO_LINK.where ? PHOTO_LINK.where.split("/").pop() + " / " : ""}${PHOTO_LINK.sub}」에 ${n}장 저장했어요. 사진 뷰어 목록에도 바로 나와요.`);
  } catch (e) { console.warn(e);
    const rest = list.slice(n); rest.forEach(en => { PH_SAVED.add(en.blob); downloadBlob0(en.blob, en.name); });
    phNote(n ? `${n}장은 사진 폴더에 저장했고, 나머지 ${rest.length}장은 내려받았어요.` : "사진 폴더에 저장하지 못해 평소처럼 내려받았어요. (폴더 수정 허락이 필요해요)", true); } }
const phSave = (blob, name) => phSaveList([{ name, blob }]);
var onMade = null;   /* 사진 뷰어에서 받은 작업일 때만 「편집본」 저장으로 바뀜 */
/* zip은 진짜 압축 파일로: 저장할 곳을 묻고(크롬 · 엣지) 그 자리에 저장 */
async function phZip(blob, name) {
  if (window.showSaveFilePicker) { try { const fh = await showSaveFilePicker({ suggestedName: name, types: [{ description: "압축 파일", accept: { "application/zip": [".zip"] } }] }); const w = await fh.createWritable(); await w.write(blob); await w.close(); phNote(`압축 파일 「${fh.name}」을 저장했어요.`); return; }
    catch (e) { if (e && e.name === "AbortError") return; console.warn(e); } }
  downloadBlob0(blob, name); }
/* 폴더 수정 허락은 버튼을 누른 그 순간에만 물을 수 있음 → 저장 · 내려받기 버튼을 누를 때 미리 받아 둠 (오래 걸리는 묶음 저장에서도 실패하지 않게) */
document.addEventListener("click", e => { const b = PHOTO_LINK.dh && e.target.closest && e.target.closest("button"); if (!b || !/저장|내려받|변환/.test(b.textContent || "")) return;
  const dh = PHOTO_LINK.dh; dh.queryPermission({ mode: "readwrite" }).then(p => { if (p !== "granted") dh.requestPermission({ mode: "readwrite" }).catch(() => {}); }).catch(() => {}); }, true);
downloadBlob = function (blob, name) { if (!PHOTO_LINK.dh || /\.json$/i.test(name)) return downloadBlob0(blob, name);
  if (/\.zip$/i.test(name)) return phZip(blob, name);   /* 압축 파일은 저장할 곳을 물어서 */
  if (PH_SAVED.has(blob)) return downloadBlob0(blob, name);   /* 이미 「편집본」에 들어간 사진을 다시 누르면 평소처럼 내려받기 */
  phSave(blob, name); };
(async () => {
  if (/[?&]from=photo\b/.test(location.search)) { try { const job = await HO_DB.get("job");
    if (job && Date.now() - job.at < 60000 && job.files && job.files.length) { await HO_DB.del("job"); await HO_DB.put("ack", { id: job.id, at: Date.now() });
      const to = KEEP.includes(job.to) ? job.to : "blog"; setModeGlobals(to); INBOX = { to, files: job.files }; PHOTO_LINK.dh = job.dh || null; PHOTO_LINK.where = job.where || ""; if (PHOTO_LINK.dh) onMade = list => phSaveList(list);
      if (PHOTO_LINK.dh) { const bar = document.createElement("div"); bar.id = "ph-bar"; bar.textContent = `사진 뷰어에서 ${job.files.length}장을 받았어요 · 「저장하기」 · 「변환하기」를 누르면 사진 폴더의 「${PHOTO_LINK.where ? PHOTO_LINK.where.split("/").pop() + " / " : ""}편집본」에 바로 저장돼요`; document.body.prepend(bar); } } } catch (e) { console.warn(e); } }
  render(html`<${Root} />`, document.getElementById("root"));
})();

</script></body></html>
