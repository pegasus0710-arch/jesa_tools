<style>

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SUIT,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

button{cursor:pointer;border:0;background:none}

.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hd{background:var(--deep);color:#fff;position:sticky;top:0;z-index:30}
.hd-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{width:38px;height:38px;border-radius:10px;flex-shrink:0}
.logo small{display:block;font-size:11.5px;font-weight:700;color:var(--deeps)}
.logo b{display:block;font-size:18px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.hd .sp{flex:1}
.gdot{width:9px;height:9px;border-radius:50%;background:#9AA3AE;display:inline-block;flex-shrink:0}

.nav{display:flex;gap:4px}
.nav button{height:38px;padding:0 13px;border-radius:10px;color:var(--deeps);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 40px}
.btn{height:42px;padding:0 15px;border-radius:11px;background:#fff;box-shadow:var(--up);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14.5px;white-space:nowrap}
.btn:hover{box-shadow:0 0 0 2px var(--sea)}

.opt{display:flex;flex-direction:column;gap:12px}

.sc{background:#fff;border-radius:16px;box-shadow:var(--up);padding:16px}
.sh2{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;margin-bottom:8px}
.sc p{font-size:13.5px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.stc{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--sub);background:var(--in);padding:2px 8px;border-radius:6px}
.stc.ok{background:#E3F2EA;color:#1f7a4a}
.qrw{display:flex;gap:12px;align-items:center}
.qr{width:120px;flex-shrink:0;background:#fff}

.links{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
select.inp{appearance:auto}
/* 시트 · 알림 */

.shbox{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.edh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

#busy[hidden]{display:none}

#busy .bar{background:var(--in);margin:12px 0}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#syband{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#fffdf7;border:1px solid #d9cfbd;font-weight:700;font-size:13.5px}
#syband button{font-weight:900;color:var(--sea)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -1px 0 var(--hair);display:none;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabs button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:var(--sub)}

.tabs svg{width:22px;height:22px}
.iapp{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.iapp img{border-radius:12px}
.iapp b{display:block;font-size:16px}.iapp span{font-size:13px;color:var(--sub)}
.isteps{padding-left:20px;margin:10px 0;line-height:1.9}
@media (min-width:901px){body{padding-bottom:0}.selbar{bottom:12px}#toast{bottom:24px}#syband{bottom:16px}}
@media (max-width:900px){
  .nav{display:none}.tabs{display:grid}
  .pv{grid-template-columns:minmax(0,1fr)}
  .kp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:14px 14px 30px}
}
@media (max-width:600px){
  .logo small{display:none}
  .it{grid-template-columns:22px minmax(0,1fr) 34px 34px}
  .it .en2{grid-column:2/3}

  .chs{grid-template-columns:minmax(0,1fr)}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Blog J 공통 동기화 핵심(bj-sync-core.js) — 2026-11-08 점검안 · 서버 없음
   ───────────────────────────────────────────────────────────────────────────
   목적(제이 불편 3가지):
     ① 쓰다 보면 구글이 끊긴 것처럼 보이고 처음 화면이 다시 나옴
     ② PC · 휴대폰이 바로 맞춰지지 않음
     ③ PC 폴더를 연결해도 저절로 저장이 잘 안 됨
   원칙:
     · 「연결됨」은 저장된 표시(앱의 gdOn)로 정한다 — 토큰(1시간짜리) 유무로 정하지 않는다.
       토큰이 없으면 「쉬는 중」일 뿐, 처음 화면 · 설정 화면을 다시 띄우지 않는다.
     · 토큰은 모든 Blog J 앱이 같은 주소(origin)라서 localStorage 「bj-gd-token」 하나를 같이 쓴다
       (클라이언트 ID · 권한(drive.file)이 같아서 한 앱에서 받은 토큰을 다른 앱도 쓸 수 있음).
     · 토큰 다시 받기는 브라우저가 「사용자가 누른 순간」에만 구글 창(잠깐 열렸다 닫힘)을 허락한다.
       → 화면을 누를 때(pointerdown/keydown) 조용히(prompt:'none' + login_hint) 다시 받는다.
       → 누름 없이(백그라운드 · 401) 구글 창을 열지 않는다(열면 팝업 차단 → 오류만 남음).
     · 고친 것은 「올릴 것 있음」 표시를 localStorage에 남겨(앱을 닫아도 남음) 연결이 돌아오면 올린다.
     · 열려 있고 화면이 보이는 동안: 다시 볼 때 · 창에 들어올 때 · 인터넷이 돌아올 때 + 90초마다
       드라이브 파일의 수정 시각만 가볍게 확인 → 바뀌었으면 맞추기(받기+합치기+올리기).
     · PC 폴더: 권한이 'prompt'가 되면(브라우저를 다시 열면 흔함) 조용히 실패하지 않고
       작은 띠 「PC 폴더 다시 연결」 → 누르면 그 누름으로 허용을 받고 밀린 것을 한꺼번에 씀.
   서버 없이 안 되는 것(정직하게):
     · 새로 고침 토큰(refresh token)이 없다 → 1시간마다 토큰이 끝나고, 다시 받으려면 「누름」이 한 번 필요.
       (구글 로그인 · 앱 허용이 살아 있으면 창이 잠깐 깜빡이고 끝, 로그아웃 · 쿠키 삭제 · 여러 계정이면 계정 고르기 창)
     · 앱이 닫혀 있을 때(또는 휴대폰이 앱을 얼려 둔 동안) 동기화는 불가 — 다음에 열고 한 번 누를 때 맞춤.
     · 사파리 · 일부 브라우저는 prompt:'none' 창을 막거나 서드파티 쿠키 때문에 실패할 수 있음 → 띠 단추로.
     · 드라이브 v3에는 「바뀌지 않았을 때만 덮어쓰기」 조건 저장이 공식적으로 없다 →
       올리기 바로 전에 수정 시각을 한 번 더 보고 바뀌었으면 한 번 더 합친 뒤 올림(beforePush 훅).
   쓰는 법: 맨 아래 「앱에 붙이기」 + sync_plan/integration_checklist.md
   ═══════════════════════════════════════════════════════════════════════════ */

/* 붙여넣기: 「한글[탭]영어」 · 「한글 | 영어」 · 한 줄씩 번갈아 */
function parsePaste(txt) {
  const L = txt.replace(/\r/g, "").split("\n").map(s => s.trim()).filter(Boolean), out = [];
  const hasKo = s => /[가-힣]/.test(s);
  let pend = null;
  for (const s of L) {
    let p = null;
    if (s.includes("\t")) p = s.split("\t").map(x => x.trim()).filter(Boolean);
    else if (/\s\|\s|\s\/\/\s/.test(s)) p = s.split(/\s\|\s|\s\/\/\s/).map(x => x.trim());
    if (p && p.length >= 2) { let [a, b] = p; if (!hasKo(a) && hasKo(b)) [a, b] = [b, a]; out.push([a.replace(/^\d+[.)]\s*/, ""), b]); pend = null; continue; }
    const t = s.replace(/^\d+[.)]\s*/, "");
    if (hasKo(t)) { pend = t; } else if (pend) { out.push([pend, t]); pend = null; }
  }
  return out;
}

/* ═══════════ 재생 ═══════════ */
/* 단계(step): {t:"say", lang:"ko"|"en", text, rate, ph} | {t:"gap", ms|auto, ph}
   ph(화면 표시 단계): ko · think · en1..3 · next */
const P = { queue: [], qi: 0, playing: false, ch: null, tok: 0, phase: "", rep: 0, startAt: 0, mode: "", list: [], li: 0, built: null, testWait: false, lastDur: 0 };
function thinkMs(text, lang) {
  if (SET.think !== "auto") return (+SET.think) * 1000;
  const w = lang === "en" ? text.split(/\s+/).filter(Boolean).length : Math.ceil(text.replace(/\s/g, "").length / 2.6);
  return Math.round(clamp(2 + 0.45 * w, 3, 10) * SET.thinkF * 1000);
}
function rates(n) { if (!SET.faster || n < 2) return Array(n).fill(1); return n === 2 ? [0.9, 1.08] : n === 3 ? [0.85, 1, 1.12] : [0.82, 0.92, 1.02, 1.12].slice(0, n); }
function stepsFor(it, mode) {
  const S = [], sp = SET.speed, R = rates(SET.reps);
  if (mode === "k2e") { S.push({ t: "say", lang: "ko", text: it.ko, rate: sp, ph: "ko" }, { t: "gap", ms: thinkMs(it.en, "en"), ph: "think" }); R.forEach((r, i) => S.push({ t: "say", lang: "en", text: it.en, rate: sp * r, ph: "en" + (i + 1) }, { t: "gap", auto: 1, ph: "en" + (i + 1) })); }
  else if (mode === "test") { S.push({ t: "say", lang: "ko", text: it.ko, rate: sp, ph: "ko" }, { t: "gap", ms: thinkMs(it.en, "en"), ph: "think" }, { t: "say", lang: "en", text: it.en, rate: sp, ph: "en1" }, { t: "gap", ms: 2200, ph: "judge" }); }
  else if (mode === "listen") { S.push({ t: "say", lang: "ko", text: it.ko, rate: sp, ph: "ko" }, { t: "gap", ms: 700, ph: "ko" }); R.forEach((r, i) => S.push({ t: "say", lang: "en", text: it.en, rate: sp * r, ph: "en" + (i + 1) }, { t: "gap", ms: 900, ph: "en" + (i + 1) })); }
  else if (mode === "e2k") { S.push({ t: "say", lang: "en", text: it.en, rate: sp, ph: "en1" }, { t: "gap", ms: thinkMs(it.ko, "ko"), ph: "think" }, { t: "say", lang: "ko", text: it.ko, rate: sp, ph: "ko" }, { t: "gap", ms: 600, ph: "ko" }, { t: "say", lang: "en", text: it.en, rate: sp, ph: "en2" }, { t: "gap", auto: 1, ph: "en2" }); }
  S.push({ t: "gap", ms: 1100, ph: "next" });
  return S;
}
const MODES = [["k2e", "한→영 말하기"], ["test", "시험"], ["listen", "듣기만"], ["e2k", "영→한"]];
const PHN = { ko: "한글", think: "생각", en1: "영어 1", en2: "영어 2", en3: "영어 3", en4: "영어 4", judge: "맞혔나요?", next: "다음" };
function phaseList(mode) { if (mode === "k2e") return ["ko", "think", ...rates(SET.reps).map((r, i) => "en" + (i + 1))]; if (mode === "test") return ["ko", "think", "en1", "judge"]; if (mode === "listen") return ["ko", ...rates(SET.reps).map((r, i) => "en" + (i + 1))]; return ["en1", "think", "ko", "en2"]; }

/* 재생 목록 준비 */
function setList(ids) {
  const L = ids.map(chById).filter(c => c && c.items.length);
  if (!L.length) return toast("들을 문장이 없어요");
  stopAll(); P.list = L.map(c => c.id); P.li = 0; loadCh(0); go("play");
}
function loadCh(li) {

  if (!need) { if (b) b.remove(); } else { if (!b) { b = document.createElement("div"); b.id = "syband"; document.body.appendChild(b); } b.innerHTML = `<span>구글 드라이브 쉬는 중${s.pending ? " · 올릴 것 있음" : ""}</span><button type="button" ${GD_RE() ? 'data-a="gd" data-v="connect"' : 'data-bjs-band="gd"'}>다시 연결</button>`; }
}
let SYNC = null;

/* ── 설치 ── */
const INST = { ev: null, standalone: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true };
addEventListener("beforeinstallprompt", e => { e.preventDefault(); INST.ev = e; });
addEventListener("appinstalled", () => { INST.standalone = true; toast("설치했어요 — 홈 화면의 아이콘으로 여세요"); });
function instGo() { if (INST.ev) { INST.ev.prompt(); INST.ev.userChoice.finally(() => { INST.ev = null; }); return; } openInstall(); }
function openInstall() {
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua), sam = /SamsungBrowser/.test(ua), and = /Android/.test(ua);
  const steps = ios ? ["사파리 아래쪽 「공유」 단추를 누르세요", "「홈 화면에 추가」를 누르세요", "오른쪽 위 「추가」"]
    : sam ? ["오른쪽 아래 「≡」 메뉴", "「현재 페이지 추가」 → 「홈 화면」", "「추가」"]
    : and ? ["오른쪽 위 「⋮」 메뉴", "「앱 설치」 또는 「홈 화면에 추가」", "「설치」"]
    : ["주소창 오른쪽의 설치 아이콘을 누르세요", "없으면 「⋮」 → 「저장 및 공유」 → 「앱 설치」", "「설치」"];
  const sh = $("#sheet"); sh.hidden = false;
  sh.innerHTML = `<div class="shbox" role="dialog" aria-modal="true"><div class="edh"><b>앱으로 설치하기</b><button class="btn sm" data-a="close">닫기</button></div>
  <div class="iapp"><img src="icon-192.png" alt="" width="56" height="56"><div><b>영어회화 노트</b><span>Blog J · 가입 없이</span></div></div>
  ${INST.ev ? `<button class="btn go full" data-a="inst">${svg(IC.phone)}지금 설치하기</button>` : ""}
  <ol class="isteps">${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
}
if ("serviceWorker" in navigator && gdHttp()) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ── 누름 처리 ── */
document.addEventListener("click", async e => {
  const nv = e.target.closest("[data-nav]"); if (nv) { if (nv.dataset.nav !== "play" && U.scr === "edit") saveEdit(); go(nv.dataset.nav); return; }
  const sg = e.target.closest(".seg[data-k] button"); if (sg) {
    const k = sg.parentElement.dataset.k, v = sg.dataset.v; SET[k] = /^-?[\d.]+$/.test(v) && k !== "think" ? +v : v; saveSet();
    if (k === "engine") { stopAll(); P.built = null; drawSet(); return; }
    if (U.scr === "play") { const was = P.playing; if (was) stopAll(); if (k === "mode") P.mode = SET.mode; P.built = null; drawPlay(); if (was) playPause(true); } else render();
    return;
  }
  const el = e.target.closest("[data-a]"); if (!el) return; const a = el.dataset.a;
  if (a === "close") { $("#sheet").hidden = true; return; }
  if (a === "newch") { const c = { id: uid(), name: `챕터 ${D.chapters.length + 1}`, at: Date.now(), items: [{ id: uid(), ko: "", en: "", star: false, ok: 0, ng: 0 }], rv: null }; D.chapters.push(c); touch(c); U.edit = c.id; go("edit"); return; }
  if (a === "paste") return openPaste(el.dataset.id || "");
  if (a === "pasteok") {
    const L = parsePaste($("#pTxt").value); if (!L.length) return toast("알아본 문장이 없어요 — 한글 · 영어를 탭이나 「 | 」로 나눠 주세요");
    const items = L.map(([ko, en]) => ({ id: uid(), ko, en, star: false, ok: 0, ng: 0 }));
    let c = el.dataset.id ? D.chapters.find(x => x.id === el.dataset.id) : null;
    if (c) { if (U.scr === "edit") saveEdit(); c.items = c.items.filter(i => i.ko || i.en).concat(items); }
    else { c = { id: uid(), name: ($("#pName").value || "").trim() || `챕터 ${D.chapters.length + 1}`, at: Date.now(), items, rv: null }; D.chapters.push(c); }
    touch(c); $("#sheet").hidden = true; toast(`${items.length}문장 넣었어요`); U.edit = c.id; go("edit"); return;
  }
  if (a === "edit") { U.edit = el.dataset.id; go("edit"); return; }
  if (a === "sel") { const id = el.dataset.id; U.sel.has(id) ? U.sel.delete(id) : U.sel.add(id); drawHome(); return; }
  if (a === "selclr") { U.sel.clear(); drawHome(); return; }
  if (a === "playsel") { const ids = [...D.chapters.map(c => c.id), STAR_ID].filter(id => U.sel.has(id)); U.sel.clear(); setList(ids); return; }
  if (a === "play1") { if (U.scr === "edit") saveEdit(); setList([el.dataset.id]); return; }
  if (a === "playrv") { setList(dueList().map(c => c.id)); return; }
  if (a === "addit") { saveEdit(); const c = chById(U.edit); c.items.push({ id: uid(), ko: "", en: "", star: false, ok: 0, ng: 0 }); touch(c); drawEdit(); const ins = $$("#its .ko2"); ins[ins.length - 1].focus(); return; }
  if (a === "delit") { saveEdit(); const c = chById(U.edit); c.items = c.items.filter(i => i.id !== el.dataset.id); touch(c); drawEdit(); return; }
  if (a === "star") { if (U.scr === "edit") saveEdit(); toggleStar(el.dataset.id); if (U.scr === "edit") drawEdit(); return; }
  if (a === "delch") { const c = chById(U.edit); if (!window.confirm(`「${c.name}」 챕터를 지울까요? (${c.items.length}문장)`)) return; D.chapters = D.chapters.filter(x => x.id !== c.id); D.gone[c.id] = Date.now(); touch(); if (P.ch && P.ch.id === c.id) { stopAll(); P.ch = null; P.list = []; } go("home"); toast("지웠어요"); return; }
  if (a === "pp") return playPause();
  if (a === "next") return jump(1);
  if (a === "prev") return jump(-1);
  if (a === "goq") { const i = +el.dataset.i; if (SET.engine === "azure" && P.built) { jump(i - P.qi); } else { const was = P.playing; stopAll(); P.qi = i; P.phase = ""; paintPlay(); if (was) runDevice(); } return; }
  if (a === "starcur") { const it = curIt(); if (it) { toggleStar(it.id); paintPlay(); toast(findItem(it.id)[1] && findItem(it.id)[1].star ? "☆ 어려운 문장에 넣었어요" : "☆ 뺐어요"); } return; }
  if (a === "judge") return judge(el.dataset.v === "1");
  if (a === "cancel") { B.cancel = true; return; }
  if (a === "vtest") { const ko = el.dataset.v === "ko"; P.tok++; sayDevice(ko ? "안녕하세요. 오늘도 영어 연습을 시작해 볼까요?" : "Hello. Shall we start practicing English today?", ko ? "ko" : "en", 1, P.tok); return; }
  if (a === "aztest") { saveSetInputs(); try { const buf = await azGet("Hello. This is a voice test.", "en", 1); const ab = await decode(buf); const au = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/mpeg" }))); au.play(); toast(`연결됐어요 — ${ab.duration.toFixed(1)}초 음성`); } catch (er) { toast(er.message); } return; }
  if (a === "azclr") { if (!window.confirm("이 기기에 저장한 문장 음성을 모두 지울까요?\n(다음에 들을 때 다시 받아요)")) return; await idbClear(); P.built = null; drawSet(); toast("지웠어요"); return; }
  if (a === "gd") return gdAction(el);
  if (a === "gdoff") { SET.gdOn = false; saveSet(); SYNC.invalidate(); render(); toast("연결을 끊었어요 — 드라이브의 자료는 그대로예요"); return; }
  if (a === "bk") return el.dataset.v === "make" ? backupMake() : backupPick();
  if (a === "inst") return instGo();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.t) { SET[t.dataset.t] = t.checked; saveSet(); if (U.scr === "play") { const was = P.playing; if (["faster", "shuffle"].includes(t.dataset.t)) { if (was) stopAll(); if (t.dataset.t === "shuffle" && P.ch) loadCh(P.li); P.built = null; drawPlay(); if (was) playPause(true); } else paintPlay(); } return; }
  if (t.dataset.s) { SET[t.dataset.s] = t.value.trim(); saveSet(); P.built = null; return; }
  if (U.scr === "edit" && (t.dataset.f || t.id === "chName")) saveEdit();
});
function saveSetInputs() { $$("[data-s]").forEach(i => { SET[i.dataset.s] = i.value.trim(); }); saveSet(); }
function saveEdit() {
  const c = chById(U.edit); if (!c || c.virtual) return;
  let ch = false; const nm = $("#chName"); if (nm && nm.value.trim() && nm.value.trim() !== c.name) { c.name = nm.value.trim(); ch = true; }
  $$("#its .it").forEach(r => { const it = c.items.find(i => i.id === r.dataset.id); if (!it) return; const ko = r.querySelector('[data-f="ko"]').value.trim(), en = r.querySelector('[data-f="en"]').value.trim(); if (ko !== it.ko || en !== it.en) { it.ko = ko; it.en = en; ch = true; } });
  if (ch) { touch(c); if (P.ch && P.ch.id === c.id) P.built = null; }
}
addEventListener("keydown", e => { if (U.scr === "play" && e.code === "Space" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); playPause(); } });
addEventListener("pagehide", () => { if (U.scr === "edit") saveEdit(); logTick(); });

/* ── 시작 ── */
SYNC = BJSync.create({ app: "eng", clientId: GD_CLIENT_ID, scope: GD_SCOPE, isOn: () => !!SET.gdOn && gdHttp(), email: () => SET.gdEmail || knownEmail(),
  sync: why => gdSync({ toast: why === "connect" || why === "manual" }),
  remoteStamp: async () => { const f = await gdFile(); return f ? f.modifiedTime : null; },
  paint: () => paintSync(), band: false, noSilent: () => GD_RE() });
const q0 = new URLSearchParams(location.search);
const gdBackOk = gdBack();
if (q0.get("install") === "1" && !INST.standalone) setTimeout(openInstall, 600);
render(); SYNC.start(); paintSync();
if (gdBackOk) setTimeout(() => { if (U.scr === "set") drawSet(); }, 1500);

</script>
