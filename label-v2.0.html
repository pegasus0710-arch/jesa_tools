:root{
--paper:#f7f6f2;--panel:#fff;--tint:#efede5;--hover:#f3f1ea;--line:#e7e5dc;--line2:#d7d4c8;
--ink:#20241f;--ink2:#5c6259;--ink3:#8a8f84;
--navy:#20263a;--amber:#e08a3e;--amber-d:#c9742c;--cat:#1f7f8f;--catbg:#e3f3f5;
--ok:#2e8a58;--okbg:#e6f3ec;--bad:#b84a3c;--badbg:#f8e9e6;--warn:#d98a1a;--warnbg:#fbf0dc;
--mat:#1c2232;--mat-line:rgba(255,255,255,.055);--mat-line2:rgba(255,255,255,.11);
--r:16px;--r-btn:10px;--sh1:0 2px 10px rgba(30,28,20,.05);--sh2:0 10px 30px rgba(30,28,20,.09);--sh-paper:0 18px 40px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--head:"BJ-Head","Pretendard",var(--font)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:var(--font);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ── 위 도구 막대: 로고 + 도구 이름 + 눈금 진행 ── */
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.bar-in{max-width:1360px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:flex-end;gap:28px}
.brand{display:flex;align-items:center;gap:11px;padding-bottom:14px;flex-shrink:0;color:#fff;text-align:left}
.btn.home{padding:10px 12px;border-color:var(--line2);background:#fff}.btn.home svg{width:19px;height:19px}
.lg{width:36px;height:36px;border-radius:10px;background:var(--cat);display:grid;place-items:center;position:relative}
.lg svg{width:21px;height:21px}
.lg i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--amber);border:2.5px solid var(--navy)}
.brand b{font-family:var(--head);font-size:18px;letter-spacing:-.3px;display:block;line-height:1.2}
.brand small{font-size:11.5px;color:rgba(255,255,255,.62);display:block}
/* 눈금자 진행 표시 */
.ruler{flex:1;min-width:0;position:relative;height:58px}
.ruler-track{position:absolute;left:0;right:0;top:20px;height:12px;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,
   repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat}
.ruler-done{position:absolute;left:0;top:30px;height:3px;background:#fff;border-radius:2px;transition:width .35s ease}
.ruler-steps{position:absolute;inset:0;display:flex}
.ruler-steps button{flex:1;min-width:0;position:relative;text-align:left;padding:38px 0 0 0;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruler-steps button::before{content:"";position:absolute;left:0;top:14px;width:2px;height:22px;background:rgba(255,255,255,.55)}
.ruler-steps button.done{color:rgba(255,255,255,.88)}
.ruler-steps button.cur{color:#fff}
.ruler-steps button:disabled{cursor:default}
.ruler-steps button span{padding-left:8px}
.ruler-dot{position:absolute;top:24px;width:16px;height:16px;margin-left:-7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(224,138,62,.25);transition:left .35s ease}
.ruler-m{display:none}

/* ── 본문: 왼쪽 작업 패널 + 오른쪽 작업판(미리보기) ── */
.lay{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:460px minmax(0,1fr);gap:22px;padding:22px 20px 40px;align-items:start}
.lay>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.ph{padding:22px 24px 4px}
.ph .k{font-size:12.5px;color:var(--cat);font-weight:800}
.ph h2{font-family:var(--head);font-size:21px;letter-spacing:-.4px;line-height:1.3;margin-top:2px}
.ph p{font-size:13.5px;color:var(--ink2);margin-top:4px}
.pb{padding:16px 24px 8px}
.pf{display:flex;gap:8px;padding:16px 24px 22px;border-top:1px solid var(--line);margin-top:14px;position:sticky;bottom:0;background:#fff;border-radius:0 0 var(--r) var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-btn);font-weight:700;font-size:14px;border:1px solid var(--line2);background:#fff;color:var(--navy);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn.go{background:var(--amber);border-color:var(--amber);color:#fff;flex:1;font-size:15px;padding:12px 16px}
.btn.go:hover{background:var(--amber-d)}
.btn.nv{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.nv:hover{background:#2c3450}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--navy);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* 고르기 카드 */
.pick{display:grid;gap:10px}
.pick.two{grid-template-columns:1fr 1fr}
.pc{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;position:relative;min-width:0}
.pc:hover{border-color:var(--navy)}
.pc.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.pc.on::after{content:"";position:absolute;right:12px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.pc b{font-family:var(--head);font-size:16px;letter-spacing:-.2px}
.pc small{font-size:12.5px;color:var(--ink2);line-height:1.5}
.pc .ic{width:40px;height:40px;border-radius:11px;background:var(--catbg);color:var(--cat);display:grid;place-items:center;flex-shrink:0}
.pc .ic svg{width:22px;height:22px}
.pc.row{flex-direction:row;align-items:center;gap:12px;padding:13px 14px}
.pc.row>div{min-width:0}
.pc.row b{font-size:15px;display:block}

/* 라벨지 목록 */
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px;gap:3px}
.seg button{flex:1;min-width:0;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(30,28,20,.08)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:12px}
.sh{border:1.5px solid var(--line2);border-radius:12px;background:#fff;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.sh:hover{border-color:var(--navy)}
.sh.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.sh.on::after{content:"";position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.sh svg{width:100%;height:auto;display:block}
.sh b{font-size:13.5px;font-family:var(--head)}
.sh small{font-size:11.5px;color:var(--ink3);line-height:1.35}
.sh .shx{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink3)}
.sh .shx:hover{background:var(--badbg);color:var(--bad)}
.sh .shx svg{width:14px;height:14px}
.sh .rec{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:800;background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px}
.fine{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:10px}
.fine b{color:var(--ink2)}

/* 입력 칸 */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
label.f .m{font-weight:500;color:var(--ink3)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:14px;min-width:0}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.12)}
textarea.inp{min-height:180px;resize:vertical;line-height:1.6;font-size:13.5px;white-space:pre;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2>*,.g4>*{min-width:0}
.mm{position:relative}.mm .inp{padding-right:34px}.mm em{position:absolute;right:10px;bottom:11px;font-style:normal;font-size:12px;color:var(--ink3);pointer-events:none}
.mm small{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2);margin-top:10px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--navy)}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px 16px;text-align:center;background:var(--paper);color:var(--ink2);font-size:13.5px}
.drop.ov{border-color:var(--navy);background:#eef0f5}
.drop b{display:block;color:var(--ink);font-size:15px;margin:6px 0 2px}
.drop svg{width:28px;height:28px;color:var(--cat)}
.howb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.howb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px 10px;border-radius:12px;background:#fff;border:1px solid var(--line2);box-shadow:0 3px 0 var(--line2),0 4px 10px rgba(30,28,20,.06);color:var(--navy);transition:transform .08s,box-shadow .08s,background .15s;min-width:0}
.howb button:hover{background:var(--hover)}
.howb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.howb button svg{width:22px;height:22px;color:var(--cat)}
.howb button b{font-size:13.5px;font-weight:800;white-space:nowrap}
.howb button small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.howb button.on{background:linear-gradient(180deg,#2c3450,var(--navy));border-color:#151a29;color:#fff;box-shadow:0 3px 0 #0f1320,0 6px 14px rgba(32,38,58,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.howb button.on svg{color:var(--amber)}
.howb button.on small{color:rgba(255,255,255,.7)}
.zipad{display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:rgba(255,255,255,.82);border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:13px;line-height:1.55}
.zipad svg{width:22px;height:22px;color:var(--amber);flex-shrink:0;margin-top:1px}
.zipad b{display:block;color:#fff;font-size:15px;font-family:var(--head);margin-bottom:1px}
.zipad.sm{padding:9px 12px;margin:8px 0 0}.zipad.sm b{font-size:13.5px}
.samp{display:flex;align-items:center;gap:10px;background:var(--catbg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;color:#165e6a}
.samp svg{width:20px;height:20px;flex-shrink:0}
.samp>div{flex:1;min-width:0}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:12px}
.note.w{border-left-color:var(--warn)}.note.b{border-left-color:var(--bad)}.note.o{border-left-color:var(--ok)}
.note b{color:var(--ink)}

/* 열 맞추기 */
.map{display:grid;gap:6px;margin-top:6px}
.map-r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.map-r span{font-size:13px;font-weight:700;color:var(--ink2)}
select.inp.auto{border-color:var(--cat);background:var(--catbg);color:#165e6a;font-weight:700}
.pv td.autoc{color:var(--cat);font-weight:700;background:#f2fafb}.pv td.autoc i{color:var(--ink3);font-weight:400;font-style:normal}
.map-r span i{font-style:normal;color:var(--bad)}
.pv{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;max-height:170px}
.pv table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.pv td,.pv th{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.pv th{background:var(--tint);font-weight:700;color:var(--ink2);position:sticky;top:0}

/* 확인·고치기 표 */
.stat{display:flex;gap:6px;flex-wrap:wrap}
.stat button{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--tint);color:var(--ink2);border:1.5px solid transparent}
.stat button.on{border-color:var(--navy);background:#fff;color:var(--navy)}
.stat i{font-style:normal;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.prog{height:6px;background:var(--tint);border-radius:999px;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.progt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3)}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;border-left:4px solid var(--line2)}
.rw.fail{border-left-color:var(--bad);background:#fffbfa}
.rw.pick{border-left-color:var(--warn);background:#fffdf8}
.rw.ok,.rw.given,.rw.manual{border-left-color:var(--ok)}
.rw.off{opacity:.55}
.rw-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3)}
.rw-h .no{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.rw-h .tg{margin-left:auto;font-weight:800;border-radius:999px;padding:2px 9px;font-size:11.5px}
.tg.ok,.tg.given,.tg.manual{background:var(--okbg);color:var(--ok)}.tg.fail{background:var(--badbg);color:var(--bad)}.tg.pick{background:var(--warnbg);color:#9a5f0b}.tg.wait{background:var(--tint);color:var(--ink3)}
.rw-f{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px;margin-top:8px}
.rw-f .inp{padding:7px 9px;font-size:13px}
.rw-f2{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:6px;margin-top:6px;align-items:center}
.rw-f2 .inp{padding:7px 9px;font-size:13px}
.rw-h .x{width:26px;height:26px;margin:-3px -4px -3px 2px}
.act{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);font-size:12.5px;color:var(--ink3)}
.act span{flex:1 1 100%}
.undo{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.undo .link{color:#fff}
.mdl{position:fixed;inset:0;background:rgba(28,34,50,.55);display:grid;place-items:center;z-index:70;padding:16px}
.mdl-c{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mdl-h{padding:22px 22px 4px}.mdl-h .k{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--cat)}.mdl-h .k svg{width:16px;height:16px}
.mdl-h h3{font-family:var(--head);font-size:20px;letter-spacing:-.3px;margin-top:4px}.mdl-h p{font-size:13.5px;color:var(--ink2);margin-top:2px}
.mdl-b{padding:12px 22px 0}
.mdl-f{display:flex;gap:8px;padding:16px 22px 20px;border-top:1px solid var(--line);margin-top:16px}
.lk .mdl-b{padding-top:16px}
.lk-n{font-size:14px;color:var(--ink2);display:flex;align-items:baseline;gap:6px}
.lk-n b{font-family:var(--head);font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums}
.lk-n span{margin-left:auto;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.lk-bar{height:12px;border-radius:999px;background:var(--tint);overflow:hidden;margin:8px 0 14px}
.lk-bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s;background:repeating-linear-gradient(-45deg,var(--navy) 0 10px,#3a4462 10px 20px);background-size:28px 28px;animation:lkmv 1s linear infinite}
.lk.done .lk-bar i{animation:none;background:var(--ok)}
@keyframes lkmv{to{background-position:28px 0}}
@media (prefers-reduced-motion:reduce){.lk-bar i{animation:none}}
.lk-c{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.lk-c i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.lk-c b{color:var(--ink);font-variant-numeric:tabular-nums}
.chk.sub{margin:0 0 0 14px}
.ex{margin:0 0 4px 14px;background:var(--paper);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink)}
.ex s{color:var(--ink3);text-decoration:none;font-size:12px}
.ex b{color:var(--cat)}
.ex span{display:block;font-size:11.5px;font-weight:800;color:var(--cat);margin-bottom:1px}
.tgr{display:inline-block;font-size:11px;font-weight:800;background:var(--navy);color:#fff;border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:2px;font-family:var(--font)}
.rw .msg{font-size:12.5px;color:var(--bad);margin-top:6px}
.fin{margin-top:7px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.fin span{display:inline-block;font-size:11px;font-weight:800;color:var(--cat);background:var(--catbg);border-radius:999px;padding:0 7px;margin-right:6px}
.fin em{font-style:normal;color:var(--ink3)}
.cands{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.cands button{text-align:left;font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--warnbg);color:var(--ink)}
.cands button:hover{background:#f6e2bd}
.btn.recall{width:100%;margin-top:10px;padding:11px 14px;background:var(--warnbg);border:2px solid var(--amber);color:#8a4f0e;font-size:14.5px;font-weight:800}
.btn.recall:hover{background:#f8e2b8}
.btn.recall em{font-style:normal;font-size:11px;background:var(--amber);color:#fff;border-radius:999px;padding:1px 8px;margin-right:2px}
.btn.recall b{background:#fff;border-radius:999px;padding:0 8px;margin-left:2px;font-variant-numeric:tabular-nums}
.cands button{position:relative}
.cands button.rec{background:#fff;box-shadow:inset 0 0 0 1.5px var(--amber)}
.cands em{font-style:normal;font-size:11px;font-weight:800;background:var(--amber);color:#fff;border-radius:999px;padding:0 7px;margin-right:6px}
.cands small{display:block;color:var(--ink3);font-size:11.5px;margin-top:1px}
.cands b{font-variant-numeric:tabular-nums;margin-right:6px;color:#9a5f0b}
.more{display:block;width:100%;margin-top:10px}
.gen-c{border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;background:#fff}
.gen-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.gen-h b{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.gen-l{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;margin-top:5px}
.gen-l span{font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;text-align:center;padding:4px 0}
.gen-l .inp{padding:8px 10px;font-size:14px}
.gen-r{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr)) 30px;gap:6px;align-items:center}
.gen-r .inp{padding:7px 9px;font-size:13px}
.gen-r .no{font-size:12px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.x:hover{background:var(--badbg);color:var(--bad)}
.x svg{width:15px;height:15px}

/* 꾸미기 */
.og{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#fff}
.og>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;font-weight:800;font-size:14.5px;font-family:var(--head)}
.og>summary::-webkit-details-marker{display:none}
.og>summary small{font-family:var(--font);font-weight:500;color:var(--ink3);font-size:12.5px;margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.og>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:-4px 4px 0 6px;flex-shrink:0;transition:transform .2s}
.og[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.og-b{padding:0 14px 14px}
.lays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ly{border:1.5px solid var(--line2);border-radius:12px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink2);min-width:0;position:relative}
.ly.on{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.1)}
.ly svg{width:100%;height:auto}
.ly em{position:absolute;right:6px;top:6px;font-style:normal;font-size:10px;background:var(--navy);color:#fff;border-radius:999px;padding:0 6px}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;accent-color:var(--navy);min-width:0}
.rng.pt .inp{width:72px;flex:none;padding:6px 8px;text-align:right}.rng.pt em{font-style:normal;font-size:12.5px;color:var(--ink3);margin-left:-4px}
.rng output{font-weight:800;font-size:13px;min-width:52px;text-align:right;color:var(--navy);font-variant-numeric:tabular-nums}

/* 인쇄 단계 */
.startg{display:grid;gap:3px;max-width:300px;background:var(--tint);padding:8px;border-radius:12px;margin-top:6px}
.startg button{border-radius:4px;background:#fff;border:1px solid var(--line2);font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding:0}
.startg button.used{background:repeating-linear-gradient(135deg,#e2dfd4 0 3px,#f1efe8 3px 7px);color:transparent}
.startg button.st{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:800}
.big-n{font-family:var(--head);font-size:30px;letter-spacing:-.5px;color:var(--navy);font-variant-numeric:tabular-nums}
.sumrow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.sumrow div small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.saveb{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;background:var(--paper);border-radius:12px;flex-wrap:wrap}
.saveb span{font-size:12.5px;font-weight:800;color:var(--ink2);margin-right:auto}
.saveb .btn{padding:8px 12px}
.pbtns{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}

/* ── 작업판(커팅 매트) ── */
.mat{position:sticky;top:92px;scroll-margin-top:110px;border-radius:20px;background-color:var(--mat);
  background-image:linear-gradient(var(--mat-line2) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line2) 1px,transparent 1px),linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px;
  padding:16px 20px 22px;min-height:560px;color:#fff;display:flex;flex-direction:column}
.mat-h{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.72);min-height:34px}
.mat-h b{color:#fff;font-weight:800;font-size:14px;white-space:nowrap}
#matS{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-h .sp{flex:1}
.mat-nav{display:flex;align-items:center;gap:4px}
.mat-nav button{width:30px;height:30px;border-radius:8px;color:#fff;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.mat-nav button:disabled{opacity:.3}
.mat-nav button svg{width:16px;height:16px}
.mat-nav span{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:10px;overflow:hidden}
.paperw{position:relative}
.mat-f{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.6);margin-top:12px;justify-content:center}
.mat-f i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* 종이 위 라벨 (화면·인쇄 공통) */
.pg{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;color:#111}
.paperw .pg{box-shadow:var(--sh-paper);transform-origin:0 0;position:absolute;left:0;top:0}
.lbl{position:absolute;overflow:hidden}
.paperw .lbl{outline:.25mm dashed #c9cfdc;outline-offset:-.1mm;border-radius:1.5mm}
.paperw .lbl.used{background:repeating-linear-gradient(135deg,#eceae3 0 1.2mm,#f7f6f2 1.2mm 2.6mm);outline-style:solid}
.paperw .lbl.over{outline:.5mm solid #b84a3c;background:#fff4f2}
.paperw .lbl.miss{outline:.5mm solid #d98a1a}
.lbi{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;line-height:1.32;word-break:keep-all;overflow-wrap:anywhere}
.lbi .snd{font-size:.72em;color:#444;margin-bottom:.35em;flex-shrink:0}
.lbi .a1{flex-shrink:0}
.lbi .mm2{font-size:.82em;color:#333;margin-top:.2em;flex-shrink:0}
.lbi .spc{flex:1 1 0;min-height:.15em}
.lbi .nm{font-weight:700;font-size:1.22em;flex-shrink:0;line-height:1.25}
.lbi .nm small{font-weight:400;font-size:.78em;margin-left:.3em}
.lbi .tel{font-size:.82em;flex-shrink:0}
.lbi .zp{flex-shrink:0;font-size:1.06em;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.lbi .zp small{font-weight:400;letter-spacing:0;margin-right:.3em;font-size:.82em}
.lbi.al-r .nm,.lbi.al-r .zp.r,.lbi .r{text-align:right}
.lbi .ln1,.lbi .ln2,.lbi .ln3{flex-shrink:0}
.lbi.gen.vc{text-align:center}.lbi.gen.vl{text-align:left}
.lbi.gen.row{flex-direction:row;align-items:baseline;justify-content:center;align-content:center;gap:0 .55em;flex-wrap:wrap;text-align:center}
.lbi.gen.row .ln2,.lbi.gen.row .ln3{margin-top:0}
.lbi.gen.tb{justify-content:space-between}.lbi.gen.tb .ln1{text-align:left}.lbi.gen.tb .ln2,.lbi.gen.tb .ln3{text-align:right}
.lbi.gen.lr{display:grid;grid-template-columns:auto minmax(0,1fr);align-content:center;align-items:center;column-gap:.7em}
.lbi.gen.lr .ln1{grid-row:1 / span 2}.lbi.gen.lr .ln2,.lbi.gen.lr .ln3{text-align:right;margin-top:0;grid-column:2}
.lbi.gen.free{display:block}
.lbi .fi{position:absolute;white-space:nowrap;line-height:1.2;transform:translate(-50%,-50%);touch-action:none}
.lbi .fi.ln2,.lbi .fi.ln3{margin-top:0}
.paperw .lbi .fi{cursor:grab;border-radius:.6mm}
.paperw .lbi .fi:hover{outline:.3mm dashed #1f7f8f;outline-offset:.4mm}
.paperw .lbi .fi.drag{outline:.35mm solid #e08a3e;outline-offset:.4mm;cursor:grabbing}
.gd{position:absolute;background:#e08a3e;pointer-events:none;display:none;z-index:2}
.gd.v{top:0;bottom:0;left:50%;width:.3mm}.gd.h{left:0;right:0;top:50%;height:.3mm}
.lays.g3{grid-template-columns:repeat(3,1fr)}
.lbi.gen{justify-content:center}
.lbi.gen.top{justify-content:flex-start}

.lbi .ln2,.lbi .ln3{margin-top:.15em}
.lbi .tx{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lbl .bgi{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pg,.pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paperw .lbi.gen [data-i]{cursor:pointer}
.paperw .lbi.gen [data-i].sel .tx{outline:.7mm solid #e08a3e;outline-offset:.6mm;border-radius:.5mm}
.lines{padding:4px 0 6px;margin-top:10px}
.lines-h{display:flex;align-items:baseline;gap:8px;padding:10px 14px 6px;font-family:var(--head);font-weight:800;font-size:14.5px}
.lines-h small{font-family:var(--font);font-weight:500;font-size:12.5px;color:var(--ink3)}
.ln-card{margin:6px 8px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.ln-card.open{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,38,58,.08)}
.ln-card.dim{opacity:.55}
.lh{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left}
.lh-n{flex-shrink:0;font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;padding:2px 8px}
.ln-card.open .lh-n{background:var(--amber)}
.lh-s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.lh-s i{font-style:normal;color:var(--ink3);font-size:13px}
.lh-m{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh-v{width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:-4px 4px 0;flex-shrink:0;transition:transform .2s}
.ln-card.open .lh-v{transform:rotate(-135deg);margin-top:4px}
.le{padding:0 12px 14px;border-top:1px dashed var(--line2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 4px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:9px 11px 10px;font-weight:800;font-size:13.5px;color:var(--ink3);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--amber)}
.tabs button.dim{opacity:.45}
.tdot{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button,.sw .pick-c{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);position:relative;cursor:pointer;display:block}
.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy)}
.sw button.none{background:linear-gradient(135deg,transparent 45%,#b84a3c 45% 55%,transparent 55%),#fff}
.sw .pick-c{background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c);overflow:hidden}
.sw .pick-c input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.imgrow{display:flex;gap:10px;align-items:flex-start}
.imgrow img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex-shrink:0}

.tst{position:absolute;inset:0;border:.25mm solid #222;border-radius:1mm;font:600 9pt/1 sans-serif;color:#555}
.tst b{position:absolute;left:1.5mm;top:1.5mm;font:inherit}
.tst::before,.tst::after{content:"";position:absolute;left:50%;top:50%;background:#999}
.tst::before{width:6mm;height:.2mm;margin-left:-3mm}.tst::after{height:6mm;width:.2mm;margin-top:-3mm}

#printArea{position:fixed;left:-30000px;top:0;visibility:hidden}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{position:static;visibility:visible;left:auto}
  #printArea .pg{page-break-after:always;break-after:page}
  #printArea .pg:last-child{page-break-after:auto;break-after:auto}
}

  .ph{padding:18px 16px 2px}.pb{padding:14px 16px 6px}.pf{padding:14px 16px 16px}

  #matS{display:none}
  .ruler-m a{color:#fff;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;text-decoration:none;flex-shrink:0}
}

/* ══════════ 디자인 3.0 "입체 교정지" — 겉모습만 바꿈 ══════════ */
:root{
--paper:#ece6da;--panel:#f1ebe1;--tint:#e7e0d2;--hover:#f7f2e9;--line:#ddd5c5;--line2:#cfc6b3;--card:#f4efe6;--tray:#e2dacb;
--ink:#1f2125;--ink2:#5b5547;--ink3:#6f6857;
--up:9px 10px 22px rgba(160,140,108,.42),-7px -7px 18px rgba(255,255,255,.9);
--up-s:3px 4px 9px rgba(160,140,108,.38),-3px -3px 8px rgba(255,255,255,.9);
--up-l:12px 14px 30px rgba(140,118,85,.45),-8px -8px 20px rgba(255,255,255,.85);
--in:inset 3px 3px 8px rgba(160,140,108,.4),inset -3px -3px 8px rgba(255,255,255,.85);
--press:inset 3px 3px 7px rgba(150,128,95,.5),inset -2px -2px 5px rgba(255,255,255,.75);
--sh-paper:12px 14px 28px rgba(120,100,70,.38),-5px -5px 12px rgba(255,255,255,.6);
--r:20px;--r-btn:12px}
body{font-size:15px;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* 머리: 판 위 · 분야색 배지 · 눈금자 홈 */
.bar{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.7),0 6px 14px -10px rgba(120,100,70,.45)}
.bar-in{padding:18px 40px 16px;align-items:center;gap:32px;max-width:1440px}
.brand{color:var(--ink);padding-bottom:0;width:500px;gap:16px}
.brand>div{display:flex;flex-direction:column-reverse}
.lg{width:54px;height:54px;border-radius:16px;box-shadow:4px 6px 12px rgba(20,80,90,.36),-3px -3px 8px rgba(255,255,255,.85),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.lg svg{width:28px;height:28px}
.lg i{width:14px;height:14px;right:-4px;bottom:-4px;border:3px solid var(--paper)}
.brand b{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.brand small{color:var(--ink3);font-size:12.5px;letter-spacing:.06em}
.ruler{height:54px}
.ruler::before{content:"";position:absolute;inset:-6px -22px -6px -22px;border-radius:16px;background:var(--tint);box-shadow:var(--in)}
.ruler>*{z-index:1}
.ruler-track{top:6px;background:repeating-linear-gradient(90deg,rgba(31,33,37,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,repeating-linear-gradient(90deg,rgba(31,33,37,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat}
.ruler-done{top:16px;height:3px;background:var(--amber)}
.ruler-steps button{color:var(--ink3);font-size:14px;padding-top:26px}
.ruler-steps button::before{top:2px;height:20px;background:rgba(31,33,37,.35)}
.ruler-steps button.done{color:var(--ink2)}
.ruler-steps button.cur{color:var(--ink)}
.ruler-dot{top:10px;width:16px;height:16px;box-shadow:2px 3px 5px rgba(120,70,20,.45),inset 2px 2px 3px rgba(255,255,255,.45)}

/* 본문 틀 */
.lay{grid-template-columns:500px minmax(0,1fr);gap:32px;padding:26px 40px 44px;max-width:1440px}
.panel{background:var(--panel);border:0;border-radius:var(--r);box-shadow:var(--up)}
.ph{padding:28px 28px 4px}
.ph .k{color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ph h2{font-size:24px;font-weight:700;letter-spacing:-.03em}
.ph p{font-size:15px;line-height:1.5;margin-top:6px}
.pb{padding:20px 28px 8px}
.pf{background:var(--panel);border-top:0;box-shadow:0 -1px 0 rgba(160,140,108,.18);padding:18px 28px 24px;gap:12px}

/* 버튼: 돋움 → 누르면 눌림 */
.btn{background:var(--card);border:0;color:var(--ink);font-size:15px;padding:12px 18px;min-height:46px;border-radius:12px;box-shadow:var(--up-s);transition:box-shadow .12s,background .15s}
.btn:hover{background:var(--hover)}
.btn:active{box-shadow:var(--press)}
.btn.go{background:var(--amber);color:#fff;font-size:16px;min-height:52px;box-shadow:4px 6px 14px rgba(170,110,55,.45),-3px -3px 8px rgba(255,255,255,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.go:hover{background:#d97f32}
.btn.go:active{box-shadow:inset 3px 3px 7px rgba(110,60,20,.45)}
.btn.nv{background:var(--navy);color:#fff;box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85)}
.btn.nv:hover{background:#2c3450}
.btn.sm{min-height:34px;padding:7px 12px;font-size:13.5px;border-radius:10px;box-shadow:2px 3px 6px rgba(160,140,108,.35),-2px -2px 5px rgba(255,255,255,.9)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--ink2)}
.btn.home{background:var(--card)}
.btn:disabled{opacity:.5;box-shadow:none;background:#e6dfd2}
.link{font-size:14px}

/* 고르기 카드 · 라벨지 · 배치 · 줄 카드 */
.pick{gap:12px}
.pc,.sh,.ly,.ln-card,.og,.gen-c{background:var(--card);border:0;box-shadow:var(--up-s)}
.pc{padding:18px;border-radius:14px}
.pc:hover,.sh:hover{background:var(--hover);border-color:transparent}
.pc.on,.sh.on,.ly.on{background:#e6dfd1;box-shadow:var(--press),0 0 0 2px var(--navy)}
.pc b{font-size:16.5px}.pc small{font-size:13.5px}
.pc .ic{width:44px;height:44px;border-radius:13px;box-shadow:var(--in)}
.sh{padding:12px;border-radius:12px}
.sh small{font-size:12.5px;color:var(--ink3)}
.sh .rec{font-size:12px}
.ly{border-radius:12px;font-size:13px}
.ly em{font-size:11px}
.ln-card.open{box-shadow:var(--up-s),0 0 0 2px var(--navy)}
.og{border-radius:14px}
.og>summary{font-size:15px}
.og>summary small{font-size:13px}
.lines-h{font-size:15px}

/* 나눔 버튼 · 넣는 방법 */
.seg{background:var(--tint);box-shadow:var(--in);padding:5px;border-radius:14px}
.seg button{font-size:14px;padding:9px 6px;border-radius:10px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:2px 3px 7px rgba(160,140,108,.4),-2px -2px 6px rgba(255,255,255,.9)}
.howb{gap:12px}
.howb button{background:var(--card);border:0;box-shadow:var(--up-s);border-radius:14px;padding:13px 6px 12px}
.howb button:active{transform:none;box-shadow:var(--press)}
.howb button b{font-size:14.5px}
.howb button small{font-size:12.5px}
.howb button.on{background:#e6dfd1;color:var(--ink);border:0;box-shadow:var(--press),0 0 0 2px var(--navy)}
.howb button.on svg{color:var(--amber)}
.howb button.on small{color:var(--ink2)}

/* 입력 */
label.f{font-size:14px;color:#3f3b33;margin:18px 0 8px}
label.f .m{font-size:13px}
.inp{background:var(--tint);border:0;border-radius:12px;padding:12px 14px;font-size:15px;box-shadow:var(--in)}
.inp:focus{border:0;box-shadow:var(--in),0 0 0 2px var(--navy)}
textarea.inp{font-size:14.5px}
select.inp.auto{border:0;background:#dcebe9;box-shadow:var(--in),0 0 0 1.5px var(--cat)}
.mm em{bottom:14px;font-size:13px}
.mm small{font-size:12.5px}
.g2,.g4{gap:12px}
.chk{font-size:14.5px;margin-top:12px}
.chk input{width:19px;height:19px}
.drop{background:var(--tint);border:1.5px dashed #bfb39b;box-shadow:var(--in)}
.fine{font-size:13px;color:var(--ink2)}

/* 안내 상자: 흰 카드 + 왼쪽 색선 → 들어간 상자 + 테두리 */
.note{background:var(--tint);border:0;border-radius:12px;box-shadow:var(--in);padding:13px 15px;font-size:14px;color:var(--ink2)}
.note.w{box-shadow:var(--in),0 0 0 1.5px var(--warn)}.note.b{box-shadow:var(--in),0 0 0 1.5px var(--bad)}.note.o{box-shadow:var(--in),0 0 0 1.5px var(--ok)}
.zipad{border-radius:14px;box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85);font-size:14px}
.samp{background:var(--tint);box-shadow:var(--in);color:var(--ink2);font-size:14px;border-radius:12px}
.saveb,.startg{background:var(--tint);box-shadow:var(--in)}
.saveb span{font-size:13.5px}
.startg button{background:var(--card);border:0;box-shadow:1px 2px 3px rgba(160,140,108,.4)}
.startg button.st{box-shadow:var(--press)}

/* 표 · 줄 상태 */
.pv{border:0;box-shadow:var(--in);background:var(--tint);border-radius:12px}
.pv th{background:#ddd5c5}
.pv table{font-size:13px}
.stat button{border-radius:10px;background:var(--card);border:0;box-shadow:var(--up-s);font-size:13.5px;padding:7px 12px}
.stat button.on{background:#e6dfd1;box-shadow:var(--press),0 0 0 2px var(--navy)}
.prog{height:12px;background:var(--tint);box-shadow:var(--in);padding:2px}
.progt{font-size:13px}
.rw{background:var(--card);border:0;border-radius:14px;box-shadow:var(--up-s);padding:12px 14px}
.rw.fail{background:#f8ece6;box-shadow:var(--up-s),0 0 0 1.5px var(--bad)}
.rw.pick{background:#f8efdc;box-shadow:var(--up-s),0 0 0 1.5px var(--warn)}
.rw-h{font-size:13px}
.rw-h .tg{font-size:12px;border-radius:6px}
.tg.ok,.tg.given,.tg.manual{box-shadow:inset 0 0 0 1px rgba(46,138,88,.35)}
.fin{font-size:13px}.fin span{font-size:12px}
.cands button{font-size:13px}
.act{font-size:13px}
.big-n{font-size:30px}
.sumrow div small{font-size:12.5px}

/* 팝업 · 진행 창 */
.mdl{background:rgba(60,52,40,.42)}
.mdl-c,.busy div{background:var(--panel);box-shadow:var(--up-l);border-radius:20px}
.mdl-h h3{font-size:22px;font-weight:700;letter-spacing:-.03em}
.mdl-h p{font-size:14.5px}
.mdl-f{border-top:0}
.lk-bar{background:var(--tint);box-shadow:var(--in)}
.busy{background:rgba(60,52,40,.35)}

/* 교정대 (미리보기) */
.mat{background:var(--tray);background-image:none;color:var(--ink);border-radius:22px;box-shadow:inset 6px 6px 14px rgba(150,128,95,.42),inset -6px -6px 14px rgba(255,255,255,.75);top:112px}
.mat-h{color:var(--ink2);font-size:13.5px}
.mat-h b{color:#3f3b33;font-size:14px;font-weight:700}
.mat-nav button{background:var(--card);color:var(--ink);box-shadow:2px 3px 6px rgba(160,140,108,.38),-2px -2px 5px rgba(255,255,255,.9)}
.mat-nav span{color:var(--ink);font-weight:600}
.mat-f{color:var(--ink2);font-size:12.5px}
.tabs button{font-size:14px}
.toast{font-size:14px}

@media (max-width:1060px){.lay{grid-template-columns:minmax(0,1fr);padding:16px 14px 30px;gap:18px}.mat{top:0}.brand{width:auto}.bar-in{padding:14px 20px}}
@media (max-width:760px){
  .bar-in{padding:12px 16px 12px}
  .brand b{font-size:22px}.lg{width:44px;height:44px;border-radius:13px}.lg svg{width:23px;height:23px}

  if (S.step === 2) { if (S.how === "type" || !S.raw || !S.raw.rows.length) return [];
    const req = FIELDS[S.kind].filter(x => x[2]).every(x => S.map[x[0]] != null); if (!req) return [];
    const R = rowsFromRaw(); return S.kind === "gen" ? R : R; }
  if (S.step === 5 || S.kind === "gen") return labelItems();

}
function scalePaper() {
  const W = $("#paperw"), pg = W && W.firstChild, st = $("#stage"); if (!pg) return;
  const pw = pg.offsetWidth, ph = pg.offsetHeight, aw = st.clientWidth - 8;
  const vh = window.innerWidth > 1060 ? window.innerHeight - 92 - 110 : 9999;
  const k = Math.min(1, aw / pw, vh / ph);
  pg.style.transform = `scale(${k})`; W.style.width = pw * k + "px"; W.style.height = ph * k + "px";
}

/* 인쇄 */
/* 인쇄 · PDF 공통: 인쇄용 쪽을 만들고 글자 맞추기 */
async function preparePages(test, label) {
  const items = test ? [] : labelItems();
  const pp = perPage(), pages = test ? 1 : Math.ceil((items.length + S.start - 1) / pp);
  const busy = document.body.appendChild(Object.assign(document.createElement("div"), { className: "busy", innerHTML: `<div>${label} (${pages}쪽)</div>` }));
  await Promise.all(usedFonts().map(loadWeb)); try { await document.fonts.ready; } catch (e) {}
  if (S.gImg && S.kind === "gen") await new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = S.gImg; });
  await new Promise(r => setTimeout(r, 30));
  const A = $("#printArea"); A.innerHTML = "";
  for (let p = 0; p < pages; p++) A.appendChild(buildPage(items, p, test));
  const imgs = Array.from(A.querySelectorAll("img")); await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  const over = test ? 0 : fitLabels(A);
  if (over) { busy.style.display = "none";
    if (!confirm(`글자가 칸을 넘치는 라벨이 ${over}개 있어요. 그대로 진행할까요?\n(취소하면 꾸미기에서 여백·글자 크기를 바꿀 수 있어요)`)) { busy.remove(); A.innerHTML = ""; return null; }
    busy.style.display = ""; }
  return { A, busy };
}
/* ══════════ PDF로 저장 (인쇄 창 없이 바로) ══════════
   인쇄용과 똑같이 만든 쪽을 250dpi 그림으로 그려 A4 PDF로 묶음 — 글꼴·색·배경 이미지가 그대로 나옴(글자는 그림). */
const PDF_DPI = 250;
function fitRect(iw, ih, bw, bh, fit) {
  if (fit === "fill") return [0, 0, bw, bh];
  const k = fit === "contain" ? Math.min(bw / iw, bh / ih) : Math.max(bw / iw, bh / ih);
  return [(bw - iw * k) / 2, (bh - ih * k) / 2, iw * k, ih * k];
}
const isClear = c => !c || c === "transparent" || /rgba\([^)]*,\s*0\)$/.test(c);
async function drawPage(pg, ctx, W, H) {
  const P = pg.getBoundingClientRect(), k = W / P.width;
  const X = x => (x - P.left) * k, Y = y => (y - P.top) * k;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  for (const lb of pg.querySelectorAll(".lbl")) {
    const r = lb.getBoundingClientRect(), cs = getComputedStyle(lb);
    ctx.save(); ctx.beginPath(); ctx.rect(X(r.left), Y(r.top), r.width * k, r.height * k); ctx.clip();
    if (!isClear(cs.backgroundColor)) { ctx.fillStyle = cs.backgroundColor; ctx.fillRect(X(r.left), Y(r.top), r.width * k, r.height * k); }
    const im = lb.querySelector("img.bgi");
    if (im && im.naturalWidth) { const f = fitRect(im.naturalWidth, im.naturalHeight, r.width * k, r.height * k, getComputedStyle(im).objectFit);
      ctx.globalAlpha = +getComputedStyle(im).opacity; ctx.drawImage(im, X(r.left) + f[0], Y(r.top) + f[1], f[2], f[3]); ctx.globalAlpha = 1; }
    const tst = lb.querySelector(".tst");
    if (tst) { const t = tst.getBoundingClientRect(); ctx.strokeStyle = "#222"; ctx.lineWidth = .25 / 25.4 * PDF_DPI; ctx.strokeRect(X(t.left), Y(t.top), t.width * k, t.height * k); }
    /* 글자 배경(형광펜) */
    lb.querySelectorAll(".tx").forEach(sp => { const c = getComputedStyle(sp); if (isClear(c.backgroundColor)) return;
      const rad = parseFloat(c.borderTopLeftRadius) * k || 0; ctx.fillStyle = c.backgroundColor;
      Array.from(sp.getClientRects()).forEach(q => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(X(q.left), Y(q.top), q.width * k, q.height * k, rad); else ctx.rect(X(q.left), Y(q.top), q.width * k, q.height * k); ctx.fill(); }); });
    /* 글자: 화면에 놓인 자리 그대로 한 글자씩 */
    const tw = document.createTreeWalker(lb, NodeFilter.SHOW_TEXT); let n; const rg = document.createRange();
    while ((n = tw.nextNode())) {
      const t = n.nodeValue; if (!t.trim()) continue;
      const c = getComputedStyle(n.parentElement), fs = parseFloat(c.fontSize) * k;
      ctx.font = `${c.fontStyle} ${c.fontWeight} ${fs}px ${c.fontFamily}`; ctx.fillStyle = c.color; ctx.textBaseline = "alphabetic";
      const m = ctx.measureText("가Hg"), asc = m.fontBoundingBoxAscent || fs * .88, dsc = m.fontBoundingBoxDescent || fs * .24;
      for (let i = 0; i < t.length; i++) { const ch = t[i]; if (/\s/.test(ch)) continue;
        rg.setStart(n, i); rg.setEnd(n, i + 1); const q = rg.getClientRects()[0]; if (!q || !q.width) continue;
        const qh = q.height * k, base = Y(q.top) + (qh - (asc + dsc)) / 2 + asc;
        ctx.fillText(ch, X(q.left), base); }

}
function pdfFromJpegs(jpgs) {
  const te = new TextEncoder(), parts = [], offs = []; let len = 0;
  const put = x => { const b = typeof x === "string" ? te.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (id, body) => { offs[id] = len; put(`${id} 0 obj\n`); body(); put("\nendobj\n"); };
  const n = jpgs.length, W = 595.28, H = 841.89;
  put("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1, () => put("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => put(`<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_, i) => `${3 + i * 3} 0 R`).join(" ")}] >>`));
  jpgs.forEach((j, i) => { const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2, cs = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(pid, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid, () => put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iid, () => { put(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.b.length} >>\nstream\n`); put(j.b); put("\nendstream"); }); });
  const total = 3 + n * 3, xref = len;
  put(`xref\n0 ${total}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, "0") + " 00000 n \n").join(""));
  put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);

}
const today = () => { const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); };
async function savePdf() {
  const items = labelItems(); if (!items.length) { toast("저장할 라벨이 없어요."); return; }
  const r = await preparePages(false, "PDF 만드는 중…"); if (!r) return;
  const { A, busy } = r, pgs = Array.from(A.querySelectorAll(".pg"));
  const W = Math.round(210 / 25.4 * PDF_DPI), H = Math.round(297 / 25.4 * PDF_DPI);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
  const jpgs = [];
  try {
    for (let i = 0; i < pgs.length; i++) {
      busy.firstChild.textContent = `PDF 만드는 중… ${i + 1} / ${pgs.length}쪽`;
      await new Promise(res => setTimeout(res, 0));
      await drawPage(pgs[i], ctx, W, H);
      const b = await new Promise(res => cv.toBlob(res, "image/jpeg", .9));
      jpgs.push({ w: W, h: H, b: new Uint8Array(await b.arrayBuffer()) });
    }
    saveBlob(pdfFromJpegs(jpgs), `${S.kind === "addr" ? "주소라벨" : "라벨"}_${today()}.pdf`);
    toast(`PDF ${pgs.length}쪽을 저장했어요`);
  } catch (e) { console.error(e); toast("PDF를 만들지 못했어요. 인쇄 창에서 PDF로 저장을 골라 주세요."); }
  busy.remove(); A.innerHTML = "";
}
/* 엑셀로 저장: 인쇄될 순서 그대로 라벨 목록 */

    rows = [["번호", "받는 분", "호칭", "라벨 주소", "우편번호", "전화번호", "메모", "처음 넣은 주소", "상세주소"]].concat(items.map((r, i) => [String(i + 1), r.f.name, hon || "", addrLine(r), r.f.zip, r.f.tel, r.f.memo, r.f.addr, r.f.detail])); w = [6, 12, 6, 52, 9, 15, 14, 40, 18]; }

async function doPrint(test) {
  if (!test && !labelItems().length) { toast("인쇄할 라벨이 없어요."); return; }
  const r = await preparePages(test, "인쇄 준비 중…"); if (!r) return;
  r.busy.remove();
  const prevT = document.title; document.title = test ? "라벨 시험 인쇄" : "라벨 인쇄";
  window.print();
  setTimeout(() => { document.title = prevT; }, 500);
}
