:root{--paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--ink:#1f2125;--sub:#5b5547;--sub2:#6f6857;--g:#195455;--gh:#12403f;--gl:#e3ecea;--or:#f56d03;--red:#c23a2b;--hair:rgba(90,74,50,.12);--hair2:rgba(90,74,50,.22);
 --up:0 0 0 1px rgba(90,74,50,.07),0 1px 2px rgba(90,74,50,.05),0 10px 28px -12px rgba(90,74,50,.18);--up-s:0 0 0 1px rgba(90,74,50,.1),0 1px 2px rgba(90,74,50,.06);--in:inset 0 0 0 1px rgba(90,74,50,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"BJ","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#root{min-height:100%;display:flex;flex-direction:column}
/* 머리 */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);box-shadow:0 1px 0 var(--hair)}
.badge{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;flex-shrink:0;position:relative}
.badge svg{width:22px;height:22px}
.badge i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--panel)}
.tname{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.tname small{font-weight:600;font-size:12.5px;color:var(--sub2);margin-left:6px}
.ruler{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.rs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub2);font-weight:600;white-space:nowrap}
.rs b{width:10px;height:10px;border-radius:50%;background:var(--tint);box-shadow:var(--in)}
.rs.done b,.rs.on b{background:var(--or);box-shadow:none}
.rs.on{color:var(--ink);font-weight:800}
.rl{width:28px;height:2px;background:var(--tint);margin:0 6px}
.rl.done{background:var(--or)}
.tb{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card);box-shadow:var(--up-s)}
.ib svg{width:20px;height:20px}
.ib.off{opacity:.45}
.ib:hover{box-shadow:0 0 0 1px var(--g)}
@media (max-width:640px){.ruler .rs span{display:none}.rl{width:16px;margin:0 4px}.tname small{display:none}}
/* 본문 */
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px}
.wrap{width:100%;max-width:720px}
h2.st{font-size:22px;margin:4px 0 4px;letter-spacing:-.4px}
.lead{color:var(--sub);font-size:15px;margin:0 0 16px;line-height:1.6}
.card{background:var(--card);border-radius:14px;box-shadow:var(--up);padding:18px}
.lbl{font-weight:800;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.lbl em{font-style:normal;font-weight:600;font-size:13px;color:var(--sub2)}
.sec{margin-top:18px}
.stepper{display:inline-flex;align-items:center;background:var(--tint);box-shadow:var(--in);border-radius:12px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:9px;font-size:24px;font-weight:700}
.stepper button:hover{background:var(--card)}
.stepper b{min-width:64px;text-align:center;font-size:22px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.nm{display:flex;align-items:center;gap:8px;background:var(--tint);box-shadow:var(--in);border-radius:10px;padding:0 10px}
.nm span{font-size:13px;color:var(--sub2);font-weight:700;width:18px;text-align:right}
.nm input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;font-weight:600;outline:0}
.nm:focus-within{box-shadow:inset 0 0 0 1.5px var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair2);font-weight:600;font-size:15px}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g);font-weight:800;background:var(--card)}
.chip.pk{background:var(--g);color:#fff;box-shadow:none;opacity:1}
.chip.pk b{background:#fff;color:var(--g);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px}
.chip.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:7px;vertical-align:2px}
.pin{margin-top:10px;width:100%;border:0;border-radius:10px;background:var(--tint);box-shadow:var(--in);padding:12px;font-size:16px;outline:0}
.pin:focus{box-shadow:inset 0 0 0 1.5px var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;font-weight:800;font-size:16.5px;background:var(--card);box-shadow:var(--up-s)}
.btn:hover{box-shadow:0 0 0 1px var(--g)}
.btn.p{background:var(--g);color:#fff;box-shadow:0 1px 2px rgba(15,55,56,.25)}
.btn.p:hover{background:var(--gh)}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{min-height:64px;font-size:20px;width:100%}
.btn svg{width:20px;height:20px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn.p{flex:1}
.note{font-size:13.5px;color:var(--sub2);line-height:1.6;margin-top:12px}
/* 게임 고르기 */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gc{text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--up);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:box-shadow .12s}
.gc:hover{box-shadow:0 0 0 1.5px var(--g),var(--up)}
.gc .gi{width:46px;height:46px;border-radius:12px;background:var(--gl);display:grid;place-items:center}
.gc .gi svg{width:28px;height:28px}
.gc b{font-size:17.5px;letter-spacing:-.3px}
.gc p{margin:0;font-size:14px;color:var(--sub);line-height:1.5}
.gc .tg{font-size:12.5px;color:var(--sub2);font-weight:700;margin-top:auto}
.gc.dim{opacity:.55}
/* 놀이 화면 */
.play{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:720px;gap:16px;text-align:center}
.who{font-size:15px;color:var(--sub);font-weight:700}
.who b{display:block;font-size:clamp(34px,9vw,58px);color:var(--ink);letter-spacing:-1px;line-height:1.15;margin-top:4px;word-break:keep-all}
.order{font-size:14px;color:var(--sub2);line-height:1.8}
.order b{color:var(--g)}
.order .cur{color:#fff;background:var(--g);padding:2px 8px;border-radius:6px}
.stage{width:min(78vw,330px);height:min(78vw,330px);display:grid;place-items:center;position:relative}
.ptop{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:720px;margin-bottom:6px}
.ptop .gnm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.ptop .gnm svg{width:22px;height:22px}
.quit{font-size:14px;color:var(--sub2);font-weight:700;padding:8px 10px;border-radius:8px}
.quit:hover{background:var(--card)}
.intro{background:var(--card);border-radius:18px;box-shadow:var(--up);padding:24px 20px;width:100%;max-width:520px;text-align:left}
.intro h3{margin:0 0 10px;font-size:21px;display:flex;align-items:center;gap:10px}
.intro h3 svg{width:30px;height:30px}
.intro .lbl{display:block;line-height:1.5}
.intro .lbl em{margin-left:6px}
.intro .order{margin-bottom:14px}
.intro ol{margin:0 0 14px;padding-left:20px;line-height:1.75;font-size:15.5px}
.hold{height:6px;border-radius:3px;background:var(--tint);overflow:hidden;width:100%;max-width:330px}
.hold i{display:block;height:100%;background:var(--g);width:0}
/* 폭탄 */
.bomb svg{width:100%;height:100%}
.spark{transform-origin:center;animation:sp .35s infinite alternate}
@keyframes sp{from{transform:scale(.8);opacity:.7}to{transform:scale(1.15);opacity:1}}
.shake{animation:sh .12s infinite}
.shake2{animation:sh2 .08s infinite}
.shake2 .spark{animation-duration:.16s}.shake3 .spark{animation-duration:.08s}.shake3 svg{filter:drop-shadow(0 0 18px rgba(245,109,3,.55))}
.shake3{animation:sh3 .05s infinite}

/* 설정 */
.ocard{width:100%;background:#fcf9f4;color:var(--ink);border-radius:22px;padding:20px;box-shadow:0 8px 0 #0c3233;display:flex;flex-direction:column;align-items:center;gap:12px}
.olbl{font-weight:900;font-size:16px}.olbl em{display:block;font-style:normal;font-weight:600;font-size:13px;color:var(--sub2);margin-top:2px}
.onote{margin:0;font-size:13.5px;color:var(--sub2);line-height:1.6}
.chips.cc{justify-content:center}
.bigstep{display:flex;align-items:center;gap:14px}
.bigstep button{width:56px;height:56px;border-radius:16px;background:var(--g);color:#fff;font-size:30px;font-weight:900;box-shadow:0 4px 0 #0c3233}
.bigstep button:active{transform:translateY(3px);box-shadow:0 1px 0 #0c3233}
.bigstep b{min-width:110px;font-size:52px;font-weight:900;color:var(--g);letter-spacing:-2px}
.bigstep b small{font-size:20px;margin-left:2px;letter-spacing:0}
.bigstep.xl b{font-size:72px;min-width:150px}
.obal{width:150px;height:160px}.obal svg{width:100%;height:100%}
.ofan{height:120px;display:flex;align-items:flex-end;justify-content:center;padding-top:10px}
.ofan i{width:56px;height:80px;border-radius:9px;background:var(--g);margin:0 -14px;transform:rotate(var(--r));transform-origin:50% 120%;box-shadow:0 3px 0 #0c3233,inset 0 0 0 3px rgba(255,255,255,.25);animation:popIn .3s both}
/* 준비 끝 */
.s-ready .art{width:min(44vw,170px);height:min(44vw,170px)}
.rord{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.rord span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:4px 10px 4px 4px;border-radius:999px;font-size:15px}
.rord span .av{background:#fcf9f4;color:var(--g);width:28px;height:28px;font-size:13px}
.rord i svg{width:16px;height:16px;opacity:.6}
/* 3 · 2 · 1 */
.cdown{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,40,41,.55);backdrop-filter:blur(2px)}
.cdown b{font-size:min(46vw,260px);font-weight:900;color:#fff;text-shadow:0 10px 0 rgba(0,0,0,.2);animation:cdPop .75s cubic-bezier(.2,1.6,.4,1) both;grid-area:1/1}
.cdown b.st{font-size:min(22vw,130px);color:#fff}
.cdown i{grid-area:1/1;width:min(70vw,380px);height:min(70vw,380px);border-radius:50%;border:8px solid var(--or);animation:ring .75s ease-out both}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0}40%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.1);opacity:0}}
.cdown.out{opacity:0;transition:opacity .25s}
/* 결과 무대 */
body.gm .res{animation:resIn .7s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 10px 0 #0c3233}
body.gm .res .n{animation:zoomIn .7s .25s cubic-bezier(.2,1.8,.4,1) both}
@keyframes resIn{from{opacity:0;transform:translateY(-60px) rotate(-3deg)}to{opacity:1;transform:none}}
body.gm .tally{background:#fcf9f4}
body.gm .foot{color:rgba(255,255,255,.6)}body.gm .foot a{color:#fff}
.racts{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}.racts .btn.p{grid-column:1/-1;min-height:58px;font-size:19px}
body.gm .racts .btn.p{background:#fcf9f4;color:var(--g);box-shadow:0 6px 0 #0c3233}body.gm .racts .btn:not(.p){background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.scn,.gt,.art,.art *,.rcard,.rtx,.gb.go,.cdown b,.cdown i,.slot.in,.pc{animation:none!important}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 블로그 경유 잠금 — 막힘 화면 */
.bj-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f7f6f2;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}

.bj-gate-mark i{position:absolute;right:9px;bottom:10px;width:11px;height:11px;border-radius:50%;background:#e08a3e}
.bj-gate h1{font-size:21px;color:#20241f;margin:0 0 12px;letter-spacing:-.3px}
.bj-gate p{font-size:15px;color:#5c6259;line-height:1.7;margin:0}
.bj-gate b{color:#20241f}
.bj-gate-btn{display:inline-block;margin:22px 0 16px;background:#e08a3e;color:#fff;font-weight:700;text-decoration:none;border-radius:12px;padding:13px 26px;font-size:15.5px}
.bj-gate-s{font-size:12.5px!important;color:#8a8f84!important}
.bj-gate-s a{color:#20263a;font-weight:700}

<script>
/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev || (() => { try { return localStorage.getItem("bj-owner") === "1"; } catch (e) { return false; } })()) { embedOK = inFrame && (dev || fromBlog()); return true; }   /* 11-10: 주인 시험 모드 — 테스트 허브(jhub.html)에서 이 기기에 켠 경우만 */
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();
</script>

        if (n === bomb) { b.classList.add("x"); b.textContent = "펑"; setTimeout(() => { SND.boom(); vib([400, 80, 400]); const bx = document.createElement("div"); bx.className = "boom"; bx.innerHTML = `<b>펑! ${n}</b>`; document.body.appendChild(bx); }, 350); lose(order[cur], "숨은 숫자 " + bomb + " 카드를 뒤집었어요", 1700); return; }
        b.classList.add("ok"); if (n < bomb) { lo = n + 1; last = "UP"; } else { hi = n - 1; last = "DOWN"; }
        setTimeout(() => { SND.safe(); vib(30); done = false; cur = (cur + 1) % order.length; draw(); }, 650); };
    };
    draw(); G_STOP = () => { done = true; };
  },
  /* 5) 10초 맞히기 */
  watch(pl, order) {
    const T = wTarget(), HIDE = Math.min(3, T / 3), res = []; let cur = 0, t0 = 0, run = false, raf, stopped = false;
    const draw = () => {
      pl.innerHTML = `<div class="who">${cur + 1} / ${order.length}번째<b>${esc(order[cur])}</b></div>
        <div class="watch num" id="wv">0.00</div><div class="who" id="wh">${T}.00초에 멈추면 완벽!</div>
        <button class="btn p big" id="wb" style="max-width:420px">시작</button>
        ${res.length ? `<div class="rk">${res.map(r => `<div><span>${esc(r.p)}</span><span class="num">${r.t.toFixed(2)}초</span></div>`).join("")}</div>` : ""}`;
      $("#wb").onclick = () => {
        if (!run) { run = true; t0 = performance.now(); $("#wb").textContent = "멈추기"; SND.safe();
          const loop = now => { if (!run || stopped) return; const s = (now - t0) / 1000; const w = $("#wv"); if (s < HIDE) w.textContent = s.toFixed(2); else { w.textContent = "?.??"; w.classList.add("hid"); $("#wh").textContent = "숫자는 가려졌어요 — 마음속으로 세어요"; } raf = requestAnimationFrame(loop); };
          raf = requestAnimationFrame(loop); }
        else { run = false; cancelAnimationFrame(raf); const s = (performance.now() - t0) / 1000; res.push({ p: order[cur], t: s, d: Math.abs(s - T) }); SND.flip(); vib(30);
          const w = $("#wv"); w.classList.remove("hid"); w.textContent = s.toFixed(2); $("#wh").textContent = `${T}초에서 ${Math.abs(s - T).toFixed(2)}초 ${s >= T ? "넘었어요" : "모자라요"}`;
          const b = $("#wb"); b.disabled = true;
          setTimeout(() => { if (stopped) return; cur++; if (cur < order.length) draw(); else end(); }, 1500); } };
    };
    const end = () => { const s = res.slice().sort((a, b) => b.d - a.d); const L = s[0];
      pl.innerHTML = `<div class="who">결과 — ${T}초에서 가장 먼 사람이 독박</div><div class="rk">${s.map((r, i) => `<div><span class="${i ? "" : "l"}">${esc(r.p)}</span><span class="num ${i ? "" : "l"}">${r.t.toFixed(2)}초 (${r.t >= T ? "+" : "−"}${r.d.toFixed(2)})</span></div>`).join("")}</div>`;
      SND.boom(); vib([300, 60, 300]); lose(L.p, `${L.t.toFixed(2)}초에 멈췄어요 (${T}초에서 ${L.d.toFixed(2)}초 차이)`, 2600); };
    draw(); G_STOP = () => { stopped = true; run = false; cancelAnimationFrame(raf); };
  },
  /* 6) 꽝 카드 */
  cards(pl, order) {
    const CARD_OK = `<div class="ba ok"><span class="fr"></span><svg class="ic" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#e3ecea" stroke="#195455" stroke-width="3.5"/><path d="M15 24.5l6.5 6.5L33.5 18" fill="none" stroke="#195455" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>통과</b><small>휴, 살았다</small><i class="spk"></i></div>`;
    const CARD_X = `<div class="ba x"><svg class="burst" viewBox="0 0 100 100"><path d="M50 4l8 22 22-12-8 23 24 6-22 11 15 19-24-4 1 25-16-19-16 19 1-25-24 4 15-19L4 43l24-6-8-23 22 12z" fill="#f56d03" opacity=".9"/><path d="M50 18l6 15 15-8-5 16 16 4-15 8 10 13-16-3v17L50 67 39 80V63l-16 3 10-13-15-8 16-4-5-16 15 8z" fill="#ffd27a"/></svg><b>꽝!</b></div>`;
    const N = cardN(order.length), bad = RI(0, N - 1), open = new Set(); let cur = 0, done = false;
    const draw = () => {
      pl.innerHTML = `<div class="who">카드를 뒤집을 사람<b>${esc(order[cur])}</b></div>
        <div class="cards${N > 12 ? " many" : ""}">${Array.from({ length: N }, (_, i) => `<div class="cd${open.has(i) ? " fl" : ""}" data-c="${i}"><div class="in"><div class="fa"><span class="fr"></span><b class="q">?</b><em class="no num">${i + 1}</em></div>${i === bad ? CARD_X : CARD_OK}</div></div>`).join("")}</div>${orderLine(order, cur)}`;
      pl.querySelector(".cards").onclick = e => { const c = e.target.closest("[data-c]"); if (!c || done) return; const i = +c.dataset.c; if (open.has(i)) return;
        open.add(i); c.classList.add("fl"); SND.flip(); vib(20);
        if (i === bad) { done = true; setTimeout(() => { SND.boom(); vib([400, 80, 400]); }, 450); lose(order[cur], "꽝 카드를 뒤집었어요", 1700); return; }
        done = true; setTimeout(() => { SND.safe(); done = false; cur = (cur + 1) % order.length; draw(); }, 800); };
    };
    draw(); G_STOP = () => { done = true; };
  },
};

/* ── 누르기 · 입력 ── */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a],[data-pen],[data-g]"); if (!b) return;
  if (b.dataset.pen) { S.pen = b.dataset.pen; save(); render(); if (S.pen === "직접") { const i = $(".pin"); if (i) i.focus(); } return; }
  if (b.dataset.g) { const g = GAMES.find(x => x.id === b.dataset.g); if (g.touch && !TOUCH) { toast("손가락 고르기는 휴대폰 · 태블릿에서 할 수 있어요"); return; } S.game = g; S.loser = null; go(2); return; }
  const a = b.dataset.a;
  if (a === "n-" || a === "n+") { S.n = Math.min(10, Math.max(2, S.n + (a === "n+" ? 1 : -1))); save(); render(); }
  else if (a === "tog") { if (S.pre) { S.game = S.pre; S.pre = null; S.loser = null; go(2); } else go(1); }
  else if (a === "to0") go(0);
  else if (a === "to1") go(1);
  else if (a === "again") { S.loser = null; S.quick = true; go(2); }
  else if (a === "quit") go(1);
  else if (a === "snd") { S.sound = !S.sound; save(); render(); if (S.sound) SND.safe(); }
  else if (a === "vib") { S.vib = !S.vib; save(); render(); vib(60); }
  else if (a === "fs") { const d = document, el = d.documentElement; try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (err) { toast("이 브라우저는 꽉 채우기를 지원하지 않아요"); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.nm != null) { S.names[+t.dataset.nm] = t.value; save(); }
  else if (t.dataset.a === "penc") { S.penC = t.value; save(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.nm != null) { const n = document.querySelector(`[data-nm="${+e.target.dataset.nm + 1}"]`); if (n) n.focus(); else go(1); } });

const GATE_ON = false;   /* 대표 글 공개 시각에 맞춰 Date.now() >= Date.parse(...)로 바꿈 */
(async () => { const T = new URLSearchParams(location.search).get("tab") || "all"; if (GATE_ON && !(await BJ_GATE.check("game", T))) return;
  const g = GAMES.find(x => x.id === T); if (g && !(g.touch && !TOUCH)) S.pre = g; render(); })();
</script></body></html>
