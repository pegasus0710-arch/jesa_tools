.tip{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.tip:last-child{border:0}

.cardbar{height:12px;border-radius:6px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;margin:6px 0 4px}

/* 바뀐 값 표시 */
.dlt{display:inline-block!important;font-size:12px!important;font-weight:800;letter-spacing:0;line-height:1.3;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;white-space:nowrap;animation:dpop .45s ease-out;font-variant-numeric:tabular-nums}

/* 기준 · 한도 표 */
.lim{margin-top:18px;background:var(--card);border-radius:12px;box-shadow:var(--up);padding:12px 14px 10px}
.lim h4{font-size:14.5px;font-weight:800;display:flex;gap:7px;align-items:center;margin-bottom:4px}
.lim h4 svg{width:17px;height:17px;stroke:var(--n);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}

<script>/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */

function cardBoxSoon() { clearTimeout(cbT); cbT = setTimeout(() => { const a = document.activeElement; const k = { id: a && a.id, pos: a && a.selectionStart }; render(k); }, 700); }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.et != null) { S.eduKids[+t.dataset.et].t = t.value; save(); refreshResult(); }
  if (t.dataset.sel) { S[t.dataset.sel] = +t.value; save(); refreshResult(); }
});
document.addEventListener("focusin", e => { const t = e.target; if (t.matches && t.matches("input.amt") && window.innerWidth < 900) setTimeout(() => t.scrollIntoView({ block: "center", behavior: "smooth" }), 250); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { const ins = [...document.querySelectorAll("#panel input")]; const i = ins.indexOf(e.target); if (i >= 0 && i < ins.length - 1) ins[i + 1].focus(); else e.target.blur(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go != null) return go(+b.dataset.go);
  if (b.hasAttribute("data-next")) return go(S.step + 1);
  if (b.hasAttribute("data-prev")) return history.state && typeof history.state.yt === "number" && history.state.yt === S.step && S.step > 0 ? history.back() : go(S.step - 1);
  if (b.dataset.ch) { S[b.dataset.ch] = JSON.parse(b.dataset.v); if (b.dataset.ch === "dual" && S.dual) S.spouse = false; if (b.dataset.ch === "spouse" && S.spouse) S.dual = false; if (b.dataset.ch === "single" && S.single) S.woman = false; if (b.dataset.ch === "woman" && S.woman) S.single = false; save(); return render(); }
  if (b.dataset.more) { S[b.dataset.more] = !S[b.dataset.more]; save(); return render(); }
  if (b.hasAttribute("data-kadd")) { S.kids.push({ y: "" }); save(); render({ sel: `[data-kid="${S.kids.length - 1}"]`, pos: 0 }); return; }
  if (b.dataset.kdel != null) { S.kids.splice(+b.dataset.kdel, 1); save(); return render(); }
  if (b.hasAttribute("data-eadd")) { S.eduKids.push({ t: "school", a: 0 }); save(); render({ sel: `[data-ea="${S.eduKids.length - 1}"]`, pos: 0 }); return; }
  if (b.dataset.edel != null) { S.eduKids.splice(+b.dataset.edel, 1); save(); return render(); }
  if (b.hasAttribute("data-print")) { if (S.step !== 5) go(5); setTimeout(() => window.print(), 120); return; }
  if (b.hasAttribute("data-reset")) { if (!confirmReset()) return; S = BLANK(); try { localStorage.removeItem(LSK); } catch (er) {} go(0); toast("입력한 값을 모두 지웠어요"); }
});
let rsT = 0;
function confirmReset() { const n = Date.now(); if (n - rsT < 4000) return true; rsT = n; toast("한 번 더 누르면 입력한 값을 모두 지워요"); return false; }
function toast(t) { const o = document.querySelector(".toast"); if (o) o.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }


/* ── 바뀐 곳 표시 ── 입력을 시작할 때 값을 기억해 두고, 오른쪽 값마다 그때보다 얼마 바뀌었는지 */
let BASE = null, baseT = 0;
function snap() { const m = {}; document.querySelectorAll("[data-dk]").forEach(e => { m[e.dataset.dk] = +e.dataset.v; }); return m; }
function startBase() { clearTimeout(baseT); if (!BASE) BASE = snap(); }
function endBase(ms) { clearTimeout(baseT); baseT = setTimeout(() => { BASE = null; document.querySelectorAll(".dlt").forEach(x => { x.classList.add("out"); setTimeout(() => x.remove(), 400); }); }, ms); }
function showDeltas() {
  if (!BASE) return;
  document.querySelectorAll("[data-dk]").forEach(el => {
    const k = el.dataset.dk;
    const d = +el.dataset.v - (k in BASE ? BASE[k] : 0); const old = el.querySelector(".dlt"); if (old) old.remove();
    if (Math.abs(d) < 1) return;
    const good = (d > 0) === (el.dataset.gd !== "down");
    const t = k === "refund" || k === "mb" ? (d > 0 ? `+${won(d)}원 ${k === "mb" ? "" : "유리"}` : `−${won(-d)}원 ${k === "mb" ? "" : "불리"}`) : (d > 0 ? "+" : "−") + won(Math.abs(d));
    el.insertAdjacentHTML("beforeend", `<span class="dlt ${good ? "g" : "b"}">${t.trim()}</span>`);
  });
}
document.addEventListener("focusin", e => { if (e.target.closest && e.target.closest("#panel") && e.target.matches("input,select")) { BASE = null; startBase(); } });
document.addEventListener("focusout", e => { if (e.target.closest && e.target.closest("#panel") && e.target.matches("input,select")) endBase(5000); });
document.addEventListener("click", e => { const b = e.target.closest("#panel button, .yt-mbar button"); if (!b || b.dataset.go != null || b.hasAttribute("data-next") || b.hasAttribute("data-prev") || b.hasAttribute("data-more") || b.hasAttribute("data-print") || b.hasAttribute("data-reset")) return; BASE = null; startBase(); endBase(5000); }, true);
/* 시작 — 블로그 경유 잠금(대표 글 공개 시각부터) */
const GATE_ON = false;   /* 대표 글 날짜가 정해지면 Date.now() >= Date.parse("…") 로 */
(async () => {
  const T = new URLSearchParams(location.search).get("tab") || "all";
  if (GATE_ON && !(await BJ_GATE.check(TOOL, T))) return;
  try { history.replaceState({ yt: S.step }, "", location.href); } catch (e) {}
  render();
})();

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알림 */
(function () { if (!EMBED || window.parent === window) return;
  let last = 0, t = null;
  function send() { const r = document.getElementById("root"); if (!r) return; const h = Math.ceil(r.getBoundingClientRect().height) + 8; if (Math.abs(h - last) < 4) return; last = h; try { window.parent.postMessage({ blogj: "height", h }, "https://luvbong.tistory.com"); } catch (e) {} }
  function soon() { clearTimeout(t); t = setTimeout(send, 60); }
  if (window.ResizeObserver) new ResizeObserver(soon).observe(document.getElementById("root"));
  window.addEventListener("load", send); setTimeout(send, 300);
})();
</script>
