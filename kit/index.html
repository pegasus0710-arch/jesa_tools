:root{--paper:#f0e8db;--panel:#f7f2ea;--card:#fcf9f4;--tint:#ece3d5;--press:#f3ece1;--ink:#1f2125;--sub:#5b5547;--sub2:#6f6857;--g:#195455;--gh:#12403f;--or:#f56d03;--work:#0A1931;--rite:#B83D06;
--up:3px 4px 9px rgba(160,140,108,.34),-3px -3px 8px rgba(255,255,255,.88);--upL:9px 10px 22px rgba(160,140,108,.38),-7px -7px 18px rgba(255,255,255,.85);--in:inset 3px 3px 8px rgba(160,140,108,.34),inset -3px -3px 8px rgba(255,255,255,.8);--press3:inset 3px 3px 7px rgba(150,128,95,.42),inset -2px -2px 5px rgba(255,255,255,.72);--hair:0 0 0 1px rgba(90,74,50,.09),0 1px 2px rgba(90,74,50,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"BJ","SUIT","Pretendard","Malgun Gothic",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--g)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid rgba(90,74,50,.12);position:sticky;top:0;background:var(--paper);z-index:5}
.lg{position:relative;flex:none;width:44px;height:44px;border-radius:12px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font:italic 800 24px Georgia,serif;box-shadow:0 0 0 3px var(--paper),2px 3px 6px rgba(20,60,60,.3)}
.lg i{position:absolute;right:5px;bottom:6px;width:8px;height:8px;border-radius:50%;background:var(--or)}
.bt small{display:block;font-size:12.5px;color:var(--sub2);font-weight:500}.bt b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.srch{flex:1 1 300px;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px rgba(90,74,50,.18)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--g),0 0 0 3px rgba(25,84,85,.12)}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.hb{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--card);box-shadow:var(--hair);font-size:14.5px;font-weight:700;color:var(--g);text-decoration:none;cursor:pointer;white-space:nowrap}
.hb:hover{box-shadow:inset 0 0 0 1px var(--g)}
.hb.ico{width:44px;padding:0;justify-content:center;color:var(--ink)}
.hb.fill{background:var(--g);color:#fff}.hb.fill:hover{background:var(--gh);box-shadow:none}
.lay{display:flex;flex-wrap:wrap;gap:24px;padding:24px 28px 40px;align-items:flex-start;max-width:1500px;margin:0 auto}
nav.cat{flex:1 1 200px;max-width:220px;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:18px;background:var(--panel);box-shadow:var(--upL)}
.nb{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-size:14.5px;text-align:left;cursor:pointer}
.nb:hover{box-shadow:inset 0 0 0 1px var(--g)}
.nb.on{background:var(--g);color:#fff;font-weight:700}
.nb .dot{width:8px;height:8px;border-radius:2px;flex:none}

.tile.last .nm{color:var(--g)}
.tile.soon{opacity:.6;cursor:default}.tile.soon:hover{box-shadow:var(--up)}
.ic{position:relative;flex:none;width:44px;height:44px;border-radius:11px;overflow:visible}

.nm{font-size:15.5px;font-weight:700;line-height:1.3}

.empty{padding:16px 18px;border-radius:14px;background:var(--tint);box-shadow:var(--in);font-size:14px;line-height:1.7;color:var(--sub)}

.gbtn:hover{background:var(--gh);color:#fff}

.info b{color:var(--ink)}

@media print{.top{position:static}}

<body>
<div id="root"></div>
<script>
/* ══════════ Blog J 무료 도구 키트 v1.0 ══════════
   tools.json(같은 GitHub Pages)을 읽어 도구를 묶음별로 보여 줌.
   설치형 = 앱 주소를 새 창 · 온라인 = 블로그 글(실행 카드) · 다운로드 = 다운로드 글.
   저장하는 것: 이 기기 브라우저에 「언제 무엇을 열었는지」(자주 쓰는 도구용)만. */
const KIT_VER = "1.0";
const TOOLS_URL = "../tools.json";
const BLOG = "https://luvbong.tistory.com";
const LS = "kit1:";
const ld = (k, d) => { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WK = "일월화수목금토", p2 = n => String(n).padStart(2, "0");
const ymdw = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}(${WK[d.getDay()]})`;
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const Q = new URLSearchParams(location.search);
const GROUPS = [["life", "생활 · 기록", "#195455"], ["work", "돈 · 업무", "#0A1931"], ["rite", "제사 · 의례", "#B83D06"]];
const WORK_NAMES = /자기소개서|견적서|차트|매매|가계부/;
function groupOf(t) { if (t.area === "rite" || t.category === "의례" || /축문|지방|제사/.test(t.name)) return "rite"; if (t.area === "money" || WORK_NAMES.test(t.name)) return "work"; return "life"; }
function howOf(t) { const ty = t.type || []; if (t.app && ty.includes("설치")) return "app"; if (ty.includes("온라인") || t.run) return "web"; return "dl"; }
const TG = { app: "앱", web: "블로그 ↗", dl: "받기 ↗" };
const HOW = { app: "앱 열기", web: "블로그에서 실행 ↗", dl: "받아서 쓰기 ↗", wait: "공개 예정" };
const IC = {
  search: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6f6857" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  ext: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  small: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>',
  big: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
  dl: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>'
};

const S = { data: null, err: false, cat: "all", q: "", use: ld("use", {}), mini: false, forceMini: ld("mini", null) };
function render() {
  if (Q.get("install") === "1" && !STANDALONE) return renderInstall();
  S.mini = S.forceMini === true ? true : S.forceMini === false ? false : innerWidth < 600;
  document.body.classList.toggle("mini", S.mini);
  const root = document.getElementById("root");
  const keepFocus = document.activeElement && document.activeElement.id === "q", pos = keepFocus ? document.activeElement.selectionStart : 0;
  root.innerHTML = topHtml() + `<div class="lay">${navHtml()}<main>${mainHtml()}</main>${asideHtml()}</div>` + footMini();
  if (keepFocus) { const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
}
function topHtml() {
  return `<header class="top"><span class="lg" aria-hidden="true">J<i></i></span><div class="bt"><small>BLOG J · 내 PC에 설치한 앱</small><b>무료 도구 키트</b></div>
    <label class="srch">${IC.search}<input id="q" type="search" placeholder="도구 찾기 — 예: 달력, 라벨, 지방" aria-label="도구 찾기" value="${esc(S.q)}"></label>
    ${window._bip && !STANDALONE ? `<button class="hb fill" data-act="install">${IC.dl}<span class="hide-m">PC에 설치</span></button>` : ""}
    <a class="hb hide-m" href="${BLOG}" target="_blank" rel="noopener">블로그 열기 ${IC.ext}</a>
    <button class="hb ico" data-act="mini" aria-label="${S.mini ? "크게 보기" : "작게 띄우기"}" title="${S.mini ? "크게 보기" : "작게 띄우기"}">${S.mini ? IC.big : IC.small}</button></header>`;
}
function visibleTools() {
  const d = S.data; if (!d) return [];
  return (d.tools || []).filter(t => !t.hide).map(t => ({ ...t, g: groupOf(t), how: howOf(t), wait: t.open && Date.parse(t.open) > Date.now() }));
}
function soonTools() { const d = S.data; if (!d) return []; return (d.soon || []).filter(t => !t.hide).map(t => ({ ...t, g: groupOf(t), how: "wait", wait: true, soon: true })); }
function newest(ts) { const now = Date.now(); return ts.filter(t => t.open && Date.parse(t.open) <= now).sort((a, b) => Date.parse(b.open) - Date.parse(a.open))[0]; }
function isNew(t) { return t.open && !t.wait && Date.now() - Date.parse(t.open) < 14 * 864e5; }
function freq(ts) {
  const u = S.use, sc = t => { const r = u[t.name]; if (!r) return 0; const days = (Date.now() - r.t) / 864e5; return r.n + 6 / (1 + days); };
  return ts.filter(t => !t.wait && u[t.name]).sort((a, b) => sc(b) - sc(a)).slice(0, 4);
}
function lastUsed() { let best = null, bt = 0; for (const [k, v] of Object.entries(S.use)) if (v.t > bt) { bt = v.t; best = k; } return best; }
const norm = s => String(s || "").toLowerCase().replace(/[\s·・,.\-]/g, "");
function match(t) { if (!S.q) return true; const q = norm(S.q); return norm(t.name + (t.desc || "") + (t.short || "")).includes(q); }
function navHtml() {
  const ts = visibleTools(), cnt = g => ts.filter(t => t.g === g).length;
  const b = (id, label, c, dot) => `<button class="nb${S.cat === id ? " on" : ""}" data-cat="${id}">${dot ? `<i class="dot" style="background:${dot}"></i>` : ""}${label}<span class="c">${c}</span></button>`;
  return `<nav class="cat" aria-label="분류">${b("all", "전체", ts.length)}${b("fav", "자주 쓰는 도구", freq(ts).length)}
    ${GROUPS.map(([id, n, c]) => b(id, n, cnt(id), c)).join("")}
    <div style="height:1px;background:rgba(90,74,50,.12);margin:8px 6px"></div>
    <p class="lbl" style="margin:4px 8px 0">쓰는 방식</p>
    <p class="how-g"><b class="a">앱 열기</b> 이 PC에서 바로<br><b class="w">블로그에서 실행</b> 글 속 실행 카드로<br><b>받아서 쓰기</b> 다운로드 글로</p></nav>`;
}
function tileHtml(t, last) {
  const img = t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;fb&quot; style=&quot;background:${(GROUPS.find(g => g[0] === t.g) || GROUPS[0])[2]}&quot;>${esc(t.name.slice(0, 1))}</span>'">`
    : `<span class="fb" style="background:${(GROUPS.find(g => g[0] === t.g) || GROUPS[0])[2]}">${esc(t.name.slice(0, 1))}</span>`;
  const how = t.wait ? (t.soon ? "준비 중" : "공개 예정 " + ymdw(new Date(t.open))) : HOW[t.how];
  const cls = "tile" + (last ? " last" : "") + (t.wait ? " soon" : "");
  const nw = NEWEST && NEWEST === t.name && isNew(t);
  const sub = last && S.use[t.name] ? "마지막으로 쓴 도구" : (nw ? "새로 나옴 · " : "") + (t.short || t.desc || "");
  return `<button class="${cls}" ${t.wait ? 'aria-disabled="true"' : `data-open="${esc(t.name)}"`}><span class="ic">${img}</span>
    <span class="tx"><span class="nm">${esc(t.name)}</span><span class="ds">${esc(sub)}</span><span class="how ${t.wait ? "wait" : t.how}">${how}</span></span><span class="tg ${t.wait ? "wait" : t.how}">${t.wait ? (t.soon ? "준비 중" : ymdw(new Date(t.open))) : TG[t.how]}</span></button>`;
}
let NEWEST = null;
function mainHtml() {
  { const n = S.data && newest(visibleTools()); NEWEST = n ? n.name : null; }
  if (!S.data) return S.err ? `<div class="empty">도구 목록을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 <button class="hb" data-act="reload" style="height:36px;margin-left:6px">다시 불러오기</button></div>` : `<div class="empty">도구 목록을 불러오는 중…</div>`;
  const ts = visibleTools().filter(match), soon = soonTools().filter(match), last = lastUsed();
  const out = [];
  if (S.q) {
    const all = ts.concat(soon);
    return all.length ? `<section><p class="lbl">찾은 도구 ${all.length}개</p><div class="grid">${all.map(t => tileHtml(t, false)).join("")}</div></section>` : `<div class="empty">「${esc(S.q)}」에 맞는 도구가 없어요. <a href="${BLOG}/search/${encodeURIComponent(S.q)}" target="_blank" rel="noopener">블로그에서 찾아보기 ↗</a></div>`;
  }
  if (S.cat === "all" || S.cat === "fav") {
    const f = freq(ts);
    out.push(`<section aria-label="자주 쓰는 도구"><p class="lbl">자주 쓰는 도구</p>${f.length ? `<div class="grid">${f.map(t => tileHtml(t, t.name === last)).join("")}</div>` : `<div class="empty">도구를 한 번 열면 여기에 모여요. 자주 쓰는 순서로 4개까지 보여 줍니다.</div>`}</section>`);
  }
  if (S.cat !== "fav") for (const [id, n, c] of GROUPS) {
    if (S.cat !== "all" && S.cat !== id) continue;
    const list = ts.filter(t => t.g === id).concat(soon.filter(t => t.g === id));
    if (!list.length) continue;
    out.push(`<section aria-label="${n}"><p class="lbl"><i style="background:${c}"></i>${n}</p><div class="grid">${list.map(t => tileHtml(t, false)).join("")}</div></section>`);
  }
  return out.join("");
}
function asideHtml() {
  if (!S.data) return "<aside></aside>";
  const n = newest(visibleTools()), now = Date.now();
  const posts = (S.data.news || []).filter(p => !p.at || Date.parse(p.at) <= now).sort((a, b) => Date.parse(b.at || 0) - Date.parse(a.at || 0)).slice(0, 4);
  return `<aside aria-label="소식">
    ${n ? `<div class="box nw"><p class="lbl" style="margin-bottom:10px">새로 나온 도구</p><b>${esc(n.name)}${n.ver ? " v" + esc(n.ver) : ""}</b><span>${esc(n.desc || n.short || "")}</span><a class="gbtn" href="${esc(n.link)}" target="_blank" rel="noopener" data-blog="${esc(n.name)}">소개 글 보기</a></div>` : ""}
    ${posts.length ? `<div class="box"><p class="lbl" style="margin-bottom:6px">블로그 새 글</p>${posts.map(p => `<a class="post" href="${BLOG}/${esc(p.no)}" target="_blank" rel="noopener"><small>${p.at ? ymdw(new Date(p.at)) : ""}</small>${esc(p.t)}</a>`).join("")}</div>` : ""}
    <div class="info"><b>키트 v${KIT_VER}</b><br>도구 목록은 블로그에 새 도구가 나오면 자동으로 늘어나요.<br>광고 · 가입 · 서버 저장 없음 · <a href="privacy.html" target="_blank" rel="noopener">개인정보 처리방침</a></div></aside>`;
}
function footMini() { return `<div class="foot-m"><span>키트 v${KIT_VER}</span><a href="${BLOG}" target="_blank" rel="noopener">Blog J 블로그 ↗</a></div>`; }
function renderInstall() {
  document.getElementById("root").innerHTML = `<div class="inst"><span class="lg" aria-hidden="true">J<i></i></span><h1>무료 도구 키트 설치</h1>
    <p>Blog J 무료 도구를 PC 창 하나에 모아 둡니다.<br>설치한 앱은 바로 열고, 온라인 도구는 블로그 실행 카드로 이어집니다.</p>
    ${window._bip ? `<button class="hb fill" data-act="install" style="height:48px;padding:0 24px">${IC.dl} 지금 설치</button>` : `<p style="margin:0">주소창 오른쪽의 설치 아이콘(⊕)을 누르거나, 크롬 메뉴 ⋮ → 「전송, 저장, 공유」 → 「페이지를 앱으로 설치」를 누르세요.</p>`}
    <p style="margin-top:18px;font-size:13px">설치 · 삭제 방법: <a href="${BLOG}/790" target="_blank" rel="noopener">Blog J 앱 설치 · 삭제 방법</a> · <a href="./">설치하지 않고 쓰기</a></p></div>`;
}
let toastT; function toast(m) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
function used(name) { const r = S.use[name] || { n: 0, t: 0 }; S.use[name] = { n: r.n + 1, t: Date.now() }; sv("use", S.use); }
function openTool(name) {
  const t = visibleTools().find(x => x.name === name); if (!t || t.wait) return;
  used(name);
  const url = t.how === "app" ? t.app : t.link;
  const w = window.open(url, "_blank", "noopener");
  if (!w && t.how !== "app") location.href = url;
  render();

async function load() {
  try {
    const r = await fetch(TOOLS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0; S.data = await r.json(); sv("tools", S.data); S.err = false;
  } catch (e) { const c = ld("tools", null); if (c) S.data = c; else S.err = true; }
  render();
}
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
document.addEventListener("click", async e => {
  const o = e.target.closest("[data-open]"); if (o) return openTool(o.dataset.open);
  const c = e.target.closest("[data-cat]"); if (c) { S.cat = c.dataset.cat; S.q = ""; render(); return scrollTo(0, 0); }
  const b = e.target.closest("[data-blog]"); if (b) used(b.dataset.blog);
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "reload") return load();
  if (act === "install") { const ev = window._bip; if (!ev) return; ev.prompt(); try { const r = await ev.userChoice; if (r && r.outcome === "accepted") window._bip = null; } catch (er) {} return render(); }
  if (act === "mini") {
    const toMini = !S.mini;
    if (STANDALONE) { try { toMini ? resizeTo(420, 820) : resizeTo(1280, 860); } catch (er) {} }
    S.forceMini = toMini; sv("mini", toMini); render();
    if (!STANDALONE && toMini) toast("설치해서 쓰면 창 크기도 함께 작아져요");
  }
});
window.addEventListener("resize", () => { if (S.forceMini !== null && STANDALONE) { S.forceMini = null; sv("mini", null); } render(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window._bip = e; render(); });
window.addEventListener("appinstalled", () => { window._bip = null; toast("설치했어요. 바탕화면 · 시작 메뉴에서 「도구 키트」를 여세요"); render(); });
if ("serviceWorker" in navigator && /^https:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); load();

</script>
