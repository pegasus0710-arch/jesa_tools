:root{

.top{gap:32px;margin-bottom:22px;align-items:center}
.brand{gap:16px;font-size:inherit;width:500px;flex-shrink:0}

/* 공통 부품 */
.btn{background:var(--card);border:0;color:var(--ink);font-size:15px;font-weight:700;padding:12px 18px;min-height:48px;border-radius:12px;box-shadow:var(--up-s);transition:box-shadow .12s,background .15s,transform .12s}
.btn:hover{background:var(--hover);box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.btn:active{box-shadow:var(--press);transform:translateY(1px)}
.btn.s{min-height:34px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.go{background:var(--amber);color:#fff;font-size:16px;min-height:52px;padding:12px 24px;box-shadow:4px 6px 14px rgba(170,110,55,.45),-3px -3px 8px rgba(255,255,255,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.go:hover{background:#d97f32;box-shadow:2px 3px 7px rgba(170,110,55,.4);outline:2.5px solid var(--navy);outline-offset:3px}
.btn.go:active{background:#c9742c;box-shadow:inset 3px 3px 7px rgba(110,60,20,.5)}
.btn.go:disabled{background:#d8cfbf;color:#8d8574;box-shadow:none;outline:0;cursor:default;transform:none}
.btn.p,.btn.accent{background:var(--navy);color:#fff;box-shadow:4px 5px 12px rgba(40,44,60,.35),-3px -3px 8px rgba(255,255,255,.85)}
.btn.p:hover,.btn.accent:hover{background:#2c3450}
input,select{background:var(--in-bg);border:0;border-radius:12px;padding:12px 14px;font-size:15px;box-shadow:var(--in);min-height:48px}
input:focus,select:focus{border:0;box-shadow:var(--in),0 0 0 2px var(--navy)}
label.f{font-size:14px;font-weight:700;color:#3f3b33;margin:18px 0 8px}
label.f .muted{font-weight:500;font-size:13px}
.seg{background:var(--in-bg);box-shadow:var(--in);padding:5px;border-radius:14px;gap:4px}
.seg button{padding:10px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:15px}
.seg button:hover{background:rgba(244,239,230,.75);color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:2px 3px 7px rgba(160,140,108,.4),-2px -2px 6px rgba(255,255,255,.9)}
.note,.note.w{display:block;background:var(--in-bg);border:0;border-left:0;border-radius:12px;box-shadow:var(--in);padding:14px 16px;font-size:14.5px;line-height:1.55;color:#3f3b33;margin-top:16px}
.note:has(>svg){display:flex;gap:12px;align-items:flex-start}.note>svg{flex-shrink:0;margin-top:2px;color:var(--navy)}
.note.w{box-shadow:var(--in),0 0 0 1.5px #d98a1a}.note.w svg{color:#b5700f}
.note b{color:var(--ink)}
.lnk{color:var(--navy);font-weight:700;border-bottom:1px solid var(--line2);font-size:14px}
.empty{background:transparent;border:0;color:var(--ink3);font-size:15px}
.tog{width:52px;height:28px;border-radius:14px;background:var(--in-bg);box-shadow:var(--in)}
.tog::after{top:3px;left:3px;width:22px;height:22px;background:var(--card);box-shadow:2px 2px 4px rgba(120,100,70,.4)}
.tog.on{background:var(--navy);box-shadow:var(--press)}.tog.on::after{left:27px;background:#fff}
.sw{background:var(--card);border:0;border-radius:14px;box-shadow:var(--up-s);padding:14px 16px;margin-top:18px}
.sw .t{font-size:15px}.sw .d{font-size:13px;color:var(--ink3)}

/* 지방 출력: 작업 패널 + 교정대 */
.lay.wb{display:grid;grid-template-columns:500px minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px 32px;align-items:start}
.ruler{grid-column:1/-1;background:var(--in-bg);box-shadow:var(--in);border-radius:16px;padding:10px 20px 10px;position:relative}
.ruler::before{content:"";position:absolute;left:20px;right:20px;top:10px;height:10px;background:repeating-linear-gradient(90deg,rgba(31,33,37,.28) 0 1px,transparent 1px 10px) left top/100% 6px no-repeat,repeating-linear-gradient(90deg,rgba(31,33,37,.45) 0 1px,transparent 1px 50px) left top/100% 10px no-repeat;pointer-events:none}
.ruler ol{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding:0}
.ruler button{position:relative;display:block;width:100%;text-align:left;padding:22px 10px 4px;border-radius:10px;font-size:14.5px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruler button .rn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;margin-right:7px}
.ruler button.done{color:var(--ink2)}
.ruler button.cur{color:var(--ink);font-weight:800}
.ruler button:hover{color:var(--ink);background:rgba(244,239,230,.7);box-shadow:inset 0 0 0 2px var(--navy)}
.ruler .bead{position:absolute;left:10px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--amber);box-shadow:2px 3px 5px rgba(120,70,20,.45),inset 2px 2px 3px rgba(255,255,255,.45)}
.wp{background:var(--up-bg);border-radius:20px;box-shadow:var(--up);display:flex;flex-direction:column;min-width:0}
.wp-h{padding:28px 28px 4px}
.wp-h h2{font-family:var(--font-head);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.3;margin-top:4px}
.wp-h p{font-size:15px;color:var(--ink2);line-height:1.5;margin-top:6px}
.wp-b{padding:20px 28px 8px}
.wp-f{display:flex;gap:12px;align-items:center;padding:18px 28px 26px;margin-top:8px;box-shadow:0 -1px 0 rgba(160,140,108,.18)}
.wp-f .go{margin-left:auto}
.seg.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.big button{display:flex;flex-direction:column;gap:4px;padding:14px 8px}
.seg.big button b{font-size:15.5px}
.seg.big button small{font-size:12.5px;color:var(--ink3);font-weight:500;font-family:"Batang","Noto Serif KR",serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* 관계 고르기 */
.tree .t1{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--card);box-shadow:var(--up-s);font-size:15.5px;font-weight:600;text-align:left;transition:box-shadow .15s,transform .15s}
.tcard:hover{transform:translateY(1px);background:var(--card);box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.tcard.on,.tcard.on:hover{background:var(--pr-bg);color:var(--navy);font-weight:800;border:0;box-shadow:var(--press),inset 0 0 0 2px var(--navy)}
.tcard.on i{width:9px;height:9px;border-radius:50%;background:var(--amber);flex-shrink:0}
.tree .t2{background:var(--in-bg);box-shadow:var(--in);border-radius:14px;padding:16px 18px;margin-top:20px}
.tree .t2h{font-size:14px;font-weight:700;color:#3f3b33;margin-bottom:10px}
.chips{gap:8px}
.chip{padding:9px 16px;border-radius:10px;border:0;background:var(--card);box-shadow:var(--up-s);font-size:14.5px;font-weight:600}
.chip:hover{background:var(--card);box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.chip.on,.chip.on:hover{background:var(--pr-bg);color:var(--navy);font-weight:800;border:0;box-shadow:var(--press),inset 0 0 0 2px var(--navy)}
.tree .picked{margin-top:12px;font-size:14px;color:var(--ink2)}.tree .picked b{color:var(--navy)}
.tree .lnk{display:inline-block;margin-top:16px}
.advbox{background:var(--in-bg);box-shadow:var(--in);border:0;border-radius:14px;padding:14px 16px;margin-top:12px}
.grp .gl{font-size:13px;color:var(--ink3);margin:8px 0 6px;font-weight:600}
.conv-h{margin-top:8px;font-size:13.5px}.conv-h b{color:var(--navy)}
.row{gap:12px}
.pv-list{margin-top:22px;background:var(--in-bg);box-shadow:var(--in);border-radius:14px;padding:14px 16px}
.pv-lh{font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:4px}
.pv-list ul{list-style:none;margin:0}
.pv-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(160,140,108,.25);font-size:13.5px;color:var(--ink2)}
.pv-list li:last-child{border:0}
.pv-list li b{font-size:18px;color:var(--ink);font-weight:400}
/* 인쇄 설정 */
.fontpick{gap:12px}
.fp{border:0;border-radius:14px;background:var(--card);box-shadow:var(--up-s);padding:14px 6px 12px;gap:3px;transition:box-shadow .15s}
.fp:hover{background:var(--card);box-shadow:var(--up-s),inset 0 0 0 2px var(--navy)}
.fp.on,.fp.on:hover{background:var(--pr-bg);border:0;box-shadow:var(--press),inset 0 0 0 2px var(--navy)}
.fp b{font-size:14px}.fp small{font-size:12.5px;color:var(--ink3)}
.dd3{gap:12px}
.mmf{position:relative}.mmf input{padding-right:46px}.mmf em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--ink3);pointer-events:none}
.btn.w{width:100%}
/* 교정대 */
.tray{position:sticky;top:16px;background:var(--tray);border-radius:22px;box-shadow:inset 6px 6px 14px rgba(150,128,95,.42),inset -6px -6px 14px rgba(255,255,255,.75);display:flex;flex-direction:column;min-width:0;min-height:560px}
.tray-h{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0}
.tray-h b{font-size:14px;font-weight:700;color:#3f3b33}
.tray .pv-box{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0}
.tray-f{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 24px 16px}
.crop{position:relative;padding:0;margin:22px}
.crop i{position:absolute;width:14px;height:14px;pointer-events:none}
.crop .c1{left:-22px;top:-22px;border-right:1px solid #8d8574;border-bottom:1px solid #8d8574;transform:translate(-8px,-8px)}
.crop .c2{right:-22px;top:-22px;border-left:1px solid #8d8574;border-bottom:1px solid #8d8574;transform:translate(8px,-8px)}
.crop .c3{left:-22px;bottom:-22px;border-right:1px solid #8d8574;border-top:1px solid #8d8574;transform:translate(-8px,8px)}
.crop .c4{right:-22px;bottom:-22px;border-left:1px solid #8d8574;border-top:1px solid #8d8574;transform:translate(8px,8px)}
.tray .sheet{background:#fffdf7;border:0;border-radius:2px;box-shadow:var(--paper-sh)}

/* 제사 계산기 · 차례상 */
.panel{background:var(--up-bg);border:0;border-radius:20px;box-shadow:var(--up);padding:24px 26px}
.sec-h{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.sec-h .muted{font-size:13px}
.lay:not(.wb){gap:28px}
.tb{font-size:14px}.tb th{background:var(--in-bg);font-size:13px;color:var(--ink3)}.tb td,.tb th{border-bottom:1px solid rgba(160,140,108,.25);padding:10px 10px}
.tb.res tbody tr:hover td{background:var(--card)}
.big-d{background:var(--in-bg);box-shadow:var(--in);border:0;border-radius:14px;padding:14px 16px}
.big-d .t{font-size:13px;color:var(--ink2)}.big-d .v{font-size:20px;color:var(--navy)}.big-d .dd{font-size:14px;color:var(--ink2)}
.rule{border-bottom:1px solid rgba(160,140,108,.25)}.rule .rs{color:var(--navy)}.rule .rd{font-size:13.5px}
.datrow .conv{color:var(--navy);font-size:14px}
.date-field .date-display{background:var(--in-bg)}
.date-icon-btn{color:var(--navy)}
.lpick{background:var(--up-bg);border:0;border-radius:16px;box-shadow:var(--up)}
.diag{border-radius:16px}
.foot{font-size:12.5px;color:var(--ink3)}

/* 계산기: 결과 자리 = 교정대 */
.t-calc .col-r>.empty{background:var(--tray);border-radius:22px;box-shadow:inset 6px 6px 14px rgba(150,128,95,.42),inset -6px -6px 14px rgba(255,255,255,.75);padding:120px 20px;font-size:15px;color:var(--ink2)}

/* 반응형 */
@media(max-width:1060px){
  .app{padding:16px 16px 32px}
  .top{flex-wrap:wrap;gap:14px}.brand{width:auto}.tabs{margin-left:0;width:100%;overflow-x:auto}.tabs button{flex:1;justify-content:center}
  .lay.wb{grid-template-columns:minmax(0,1fr)}
  .tray{position:static;min-height:0}
}
@media(max-width:640px){
  .brand .lg{width:48px;height:48px;font-size:22px}.brand b{font-size:23px}
  .tabs button{padding:9px 8px;font-size:13.5px}
  .ruler{padding:8px 10px}.ruler::before{left:10px;right:10px}
  .ruler ol{gap:2px}.ruler button{padding:20px 4px 4px;font-size:12.5px;text-align:center}.ruler button .rn{display:block;margin:0}
  .ruler .bead{left:calc(50% - 7px)}
  .wp-h{padding:22px 18px 2px}.wp-h h2{font-size:21px}.wp-b{padding:16px 18px 6px}.wp-f{padding:14px 18px 20px}
  .seg.big button small{display:none}
  .fontpick{grid-template-columns:repeat(2,1fr)}
  .dd3{grid-template-columns:1fr 1fr}
  .panel{padding:20px 18px}
}
@media print{.tray,.ruler,.wp{display:none}}

/* ── 축문 전용 ── */
.app.t-ck .lay.wb{grid-template-columns:500px minmax(0,1fr)}
.brand .lg svg{color:#f3efe4}
.tabs.kindt{display:flex}.tabs.kindt button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 18px;text-align:left}
.tabs.kindt button b{font-size:15px}.tabs.kindt button span{font-size:12.5px;font-weight:500;color:var(--ink3)}
.tabs.kindt button.on span{color:var(--ink2)}
.rg{gap:12px;margin-bottom:12px}.rgl{width:64px;font-size:13px;color:var(--ink3);padding-top:11px}
.chips{gap:8px;margin-top:0}
.hint{font-size:13.5px;color:var(--ink2);margin-top:12px;line-height:1.55}.hint b{color:var(--ink)}
.hint.warn{color:#9a5a17}
.chk{font-size:14.5px;color:#3f3b33;margin-top:16px}.chk input{width:20px;height:20px;min-height:0;box-shadow:none;accent-color:var(--navy)}
.dd2,.dd3{gap:12px}
.calc{background:var(--in-bg);border:0;border-radius:14px;box-shadow:var(--in);padding:14px 16px;margin-top:16px;font-size:14.5px;gap:6px}
.calc span{width:40px;color:var(--ink3)}
.gen{gap:10px;margin-top:16px}.gen input{width:96px}
details.adv{margin-top:18px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--up-s);padding:14px 16px}
details.adv summary{font-size:14.5px}
details.adv[open]{box-shadow:var(--in);background:var(--in-bg)}
.tray .notice{display:flex;gap:10px;align-items:flex-start;margin:14px 20px 0;font-size:14px;line-height:1.55;background:var(--in-bg);border:0;border-left:0;border-radius:12px;box-shadow:var(--in);padding:12px 14px;color:#3f3b33}.tray .notice svg{flex-shrink:0;margin-top:2px;color:var(--navy)}.tray .notice b{color:var(--ink)}
.tray .sheets{background:transparent;border-radius:0;padding:14px 20px;margin:0;max-height:none;overflow:visible;flex:1}
.tray .scaler{gap:18px}
.tray .cpage{box-shadow:var(--paper-sh);border-radius:2px}
.tray .cpage.land{zoom:.56}.tray .cpage.port{zoom:.72}
.loading{color:var(--ink3);font-size:15px;padding:120px 20px}
.app>.priv{max-width:1440px;margin:18px 0 0;font-size:13px;color:var(--ink3);display:flex;gap:8px;align-items:flex-start}
.wp-f .go:disabled{background:#d8cfbf;color:#8d8574;box-shadow:none;outline:0}
@media(max-width:1060px){.app.t-ck .lay.wb{grid-template-columns:minmax(0,1fr)}.tabs.kindt button{align-items:center;text-align:center}}
@media(max-width:640px){.t-ck .seg button{white-space:normal;line-height:1.3;font-size:13.5px;padding:8px 4px}.tray .cpage.land{zoom:.28}.tray .cpage.port{zoom:.4}.tray .sheets{padding:12px 10px}.tabs.kindt button span{display:none}.rg{flex-direction:column;gap:6px}.rgl{padding-top:0}}
@media print{
  .ruler,.wp,.tray-h,.tray-f,.tray .notice,.app>.priv,.tabs{display:none!important}
  .lay.wb{display:block!important}
  .tray{position:static!important;background:none!important;box-shadow:none!important;border-radius:0!important;min-height:0!important;display:block!important}
  .tray .sheets{padding:0!important}
  .tray .cpage{zoom:1!important;box-shadow:none!important;border-radius:0!important}
}

/* 진행 표시 C안(10-17): 주황 점에 주황 선이 붙어 처음부터 지금 단계까지 이어짐 */
.ruler li{position:relative}
.ruler li:has(>button.done)::after,.ruler li:has(>button.cur)::after{content:"";position:absolute;left:0;top:9px;height:3px;border-radius:0;background:var(--amber);pointer-events:none;z-index:1}
.ruler li:has(>button.done)::after{right:-10px}
.ruler li:has(>button.cur)::after{width:17px}

/* ── 달력 출력 전용 ── */
:root{--cat:#1f7f8f;--catbg:#e3f3f5;--font:"BJCal","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--head:"BJCal","Pretendard",sans-serif;--font-head:"BJCal","Pretendard",sans-serif}
body,button,input,select{font-family:var(--font)}
.app.t-cal .lay.wb{grid-template-columns:480px minmax(0,1fr)}
.brand .lg svg{color:#f3efe4}
.cl-kinds{display:grid;gap:12px}
.tcard.cl-kind{height:auto;min-height:64px;padding:12px 18px}
.cl-kind span{display:flex;flex-direction:column;gap:3px}.cl-kind b{font-size:16px}.cl-kind small{font-size:13px;color:var(--ink3);font-weight:500}
.cl-quick{margin-top:12px}
.cl-ann{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cl-ar{display:grid;grid-template-columns:minmax(0,1fr) 82px 78px 78px 40px;gap:6px;align-items:center;width:100%;background:var(--in-bg);box-shadow:var(--in);border-radius:14px;padding:8px}
.cl-ar input,.cl-ar select{min-height:42px;padding:8px 10px;font-size:14.5px;background:var(--card);box-shadow:var(--up-s);min-width:0}
.cl-ar .cl-ad{grid-column:1/-1;font-size:13px;color:var(--ink2);padding:0 4px}
.cl-del{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--card);box-shadow:var(--up-s);color:var(--ink2)}
@media(max-width:520px){.cl-ar{grid-template-columns:1fr 1fr 1fr 40px}.cl-ar input{grid-column:1/-1}}
.cl-sheets{max-height:920px!important;overflow-x:hidden!important;overflow-y:auto!important}
.cl-sheets .scaler{gap:14px}
.cl-sheets .cl-pg{zoom:var(--z,.4);box-shadow:0 2px 10px rgba(0,0,0,.16)}
/* 종이 */
.cl-pg{background:#fff;color:#1f2125;box-sizing:border-box;position:relative;overflow:hidden;font-family:"BJCal","Pretendard","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cl-pg *{box-sizing:border-box}
.cl-pg.land{width:297mm;height:210mm}.cl-pg.port,.cl-pg.desk{width:210mm;height:297mm}
.cl-pg.desk{display:flex;flex-direction:column}
.cl-half{height:147.5mm;flex:none}
.cl-cut{height:2mm;border-top:.3mm dashed #a8a091;position:relative}
.cl-cut span{position:absolute;left:50%;top:-1.6mm;transform:translateX(-50%);background:#fff;padding:0 2mm;font-size:2.2mm;color:#8a8272}
/* 월간 */
.cl-mp{width:100%;height:100%;padding:10mm 12mm 7mm;display:flex;flex-direction:column}
.cl-mp.half{padding:7mm 10mm 5mm}
.cl-hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:6mm;margin-bottom:4mm}
.cl-ttl{display:flex;align-items:flex-end;gap:3mm}
.cl-mn{font-size:24mm;line-height:.78;font-weight:800;letter-spacing:-.04em}
.half .cl-mn{font-size:15mm}
.cl-ttl>div{display:flex;flex-direction:column;gap:.6mm;padding-bottom:.4mm}
.cl-yr{font-size:5.2mm;font-weight:800;line-height:1}.half .cl-yr{font-size:4mm}
.cl-en{font-size:3mm;letter-spacing:.32em;color:#6f6857;font-weight:600}.half .cl-en{font-size:2.5mm}
.cl-motto{font-size:4.4mm;font-weight:600;color:#5b5547;text-align:center;align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half .cl-motto{font-size:3.4mm}
.cl-minis{display:flex;gap:5mm}
.cl-mini{width:33mm}
.cl-mh{display:flex;align-items:baseline;gap:.6mm;margin-bottom:.8mm}
.cl-mh b{font-size:3.6mm;font-weight:800}.cl-mh span{font-size:2.4mm;font-weight:700}.cl-mh small{margin-left:auto;font-size:2.2mm;color:#8a8272}
.cl-mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:2.25mm;line-height:1.5}
.cl-mg .wh{font-weight:700}
.cl-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:.25mm solid var(--lc)}
.cl-wh{text-align:center;font-size:3.3mm;font-weight:800;padding:1.4mm 0;border-top:.6mm solid #1f2125;border-bottom:.35mm solid #1f2125;border-right:.25mm solid var(--lc)}
.half .cl-wh{font-size:2.8mm;padding:1mm 0}
.cl-c{position:relative;border-right:.25mm solid var(--lc);border-bottom:.25mm solid var(--lc);padding:1.3mm 1.6mm;min-height:0;overflow:hidden}
.cl-ct{display:flex;align-items:flex-start;justify-content:space-between;gap:1mm}
.cl-ct b{font-size:5.4mm;font-weight:800;line-height:1}
.half .cl-ct b{font-size:4.2mm}
.cl-lu{font-size:2.4mm;color:#8a8272;white-space:nowrap;padding-top:.3mm}
.half .cl-lu{font-size:2.1mm}
.cl-tx{display:flex;flex-direction:column;gap:.5mm;margin-top:1.2mm}
.cl-tx span{font-size:2.5mm;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half .cl-tx span{font-size:2.15mm}
.cl-tx .h{font-weight:800}.cl-tx .t{color:#6f6857}.cl-tx .e{font-weight:700}
.cl-tx .e::before{content:"";display:inline-block;width:1.3mm;height:1.3mm;border-radius:50%;background:#1f2125;margin-right:.8mm;vertical-align:.25mm}
.cl-son{position:absolute;right:1.4mm;bottom:1mm;font-size:2.1mm;color:#9a9282}
.half .cl-son{font-size:1.8mm}
.cl-memo{margin-top:3mm}
.cl-memo i{display:block;height:7.5mm;border-bottom:.25mm solid var(--lc)}
.cl-ft{display:flex;justify-content:space-between;gap:4mm;margin-top:2mm;font-size:2.3mm;color:#8a8272;white-space:nowrap}
.half .cl-ft{font-size:1.9mm;margin-top:1.4mm}
/* 연간 */
.cl-yp{width:100%;height:100%;padding:12mm 14mm 8mm;display:flex;flex-direction:column}
.cl-yh{display:flex;align-items:baseline;gap:2mm;margin-bottom:6mm;border-bottom:.6mm solid #1f2125;padding-bottom:3mm}
.cl-yh b{font-size:15mm;font-weight:800;line-height:.9;letter-spacing:-.03em}
.cl-yh span{font-size:5mm;font-weight:700}
.cl-yh em{margin-left:auto;font-style:normal;font-size:4.4mm;font-weight:600;color:#5b5547}
.cl-yg{flex:1;min-height:0;display:grid;gap:3mm 8mm;align-content:space-between;overflow:hidden}
.cl-yp.land .cl-mini.big .cl-mg{font-size:2.8mm;line-height:1.62}
.cl-yp.land .cl-mini.big .cl-mh{margin-bottom:.6mm;padding-bottom:.6mm}.cl-yp.land .cl-mini.big .cl-mh b{font-size:5mm}
.cl-yp.land .cl-yh{margin-bottom:4mm}.cl-yp.land .cl-yh b{font-size:12mm}
.cl-yp.land .cl-yg{grid-template-columns:repeat(4,1fr)}
.cl-yp.port .cl-yg{grid-template-columns:repeat(3,1fr)}
.cl-mini.big{width:auto}
.cl-mini.big .cl-mh{border-bottom:.25mm solid var(--lc);padding-bottom:1mm;margin-bottom:1.2mm}
.cl-mini.big .cl-mh b{font-size:6mm}.cl-mini.big .cl-mh span{font-size:3mm}
.cl-mini.big .cl-mh i{margin-left:auto;font-style:normal;font-size:2.2mm;letter-spacing:.2em;color:#8a8272}
.cl-mini.big .cl-mg{font-size:3.1mm;line-height:1.75}
.cl-yp.port .cl-mini.big .cl-mg{font-size:3mm;line-height:1.6}
.cl-yp.port .cl-mini.big .cl-mh b{font-size:5mm}.cl-yp.port .cl-yh b{font-size:12mm}.cl-yp.port .cl-yh{margin-bottom:4mm}
.cl-yl{margin-top:3mm;padding-top:2.5mm;border-top:.25mm solid var(--lc);display:grid;gap:1mm 5mm;font-size:2.55mm;color:#3f3b33}

<script>
/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev) { embedOK = inFrame; return true; }
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();
</script>

/* 그해 기념일(매년) → 양력 날짜 */
function annivDate(a, y) {
  if (!a.m || !a.d) return null;
  if (a.cal === "lunar") { let d = lunarToSolar(y, a.m, a.d, false); if (!d && a.d === 30) d = lunarToSolar(y, a.m, 29, false); return d; }
  const d = new Date(y, a.m - 1, a.d); return d.getMonth() === a.m - 1 ? d : null;
}
/* 한 달의 날짜 정보 */
function dayInfo(d, st, annMap) {
  const k = ymd(d), lu = solarToLunar(d), out = { d, k, hol: null, term: null, lun: null, son: false, ev: [], trad: null };
  if (st.hol && HOL[k]) out.hol = HOL[k];

    if (st.son && (lu.d % 10 === 9 || lu.d % 10 === 0)) out.son = true;
    if (st.trad && !lu.leap) { const t = { "1-15": "정월대보름", "5-5": "단오", "7-7": "칠석" }[lu.m + "-" + lu.d]; if (t) out.trad = t; }

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알려 iframe 높이를 자동으로 맞춤 */
(function(){ if(!EMBED || window.parent===window) return;
  var last=0, t=null;
  function send(){ var r=document.getElementById("root"); if(!r) return;
    var h=Math.ceil(r.getBoundingClientRect().height)+8;
    if(document.querySelector(".edws")) h=Math.max(h,900);   /* 큰 화면 편집 중엔 넉넉하게 */
    if(Math.abs(h-last)<4) return; last=h;
    try{ window.parent.postMessage({blogj:"height",h:h},"https://luvbong.tistory.com"); }catch(e){} }
  function soon(){ clearTimeout(t); t=setTimeout(send,60); }
  if(window.ResizeObserver){ new ResizeObserver(soon).observe(document.getElementById("root")); }
  new MutationObserver(soon).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("load",send); setTimeout(send,300);
})();


window.BJ_TOOL_KEY="calendar";window.BJ_TOOL_VER=APP_VER;
/* 새 버전 알림: 같은 사이트의 versions.json을 확인해 더 새 버전이 있으면 맨 위에 안내 (없거나 실패하면 아무것도 안 함) */
(function () {
  if (location.protocol === "file:") return;   /* 다운로드판·로컬 파일은 확인하지 않음 */
  var KEY = window.BJ_TOOL_KEY, CUR = window.BJ_TOOL_VER; if (!KEY || !CUR) return;
  var newer = function (a, b) { var x = String(a).split("."), y = String(b).split("."); for (var i = 0; i < 3; i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d) return d > 0; } return false; };
  fetch("versions.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    var v = j && j[KEY]; if (!v || !v.latest || !newer(v.latest, CUR) || !/^https:\/\/luvbong\.tistory\.com\//.test(v.post || "")) return;
    try { if (sessionStorage.getItem("bjvn:" + KEY + v.latest)) return; } catch (e) {}
    var bar = document.createElement("div"); bar.className = "bj-vnote";
    bar.innerHTML = '<span class="dot"></span><span class="t"><b>새 버전 v' + String(v.latest).replace(/[^0-9.]/g, "") + '</b>이 나왔어요' + (v.note ? ' — ' + String(v.note).replace(/[<>&"]/g, "") : "") + '</span><a target="_blank" rel="noopener">새 글에서 쓰기 ›</a><button aria-label="닫기">×</button>';
    bar.querySelector("a").href = v.post;
    bar.querySelector("button").onclick = function () { bar.remove(); try { sessionStorage.setItem("bjvn:" + KEY + v.latest, "1"); } catch (e) {} };
    document.body.insertBefore(bar, document.body.firstChild);
  }).catch(function () {});
})();
