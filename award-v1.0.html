<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="only light"><meta name="theme-color" content="#0b3d4a">
<title>상장 만들기 | Blog J</title>
<meta name="description" content="상장 · 표창장 · 감사장 · 수료증 · 임명장 · 위촉장 · 공로패 — 종류와 디자인을 골라 섞고, 여러 명을 한 번에 인쇄 · PDF. 직인 이미지도 함께">
<link rel="icon" href="icons/apps/award.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@500;700;900&family=Gowun+Batang:wght@400;700&family=Song+Myung&family=Nanum+Brush+Script&family=Gowun+Dodum&family=Jua&display=swap">
<style>:root{--paper:#faf6ee;--panel:#ffffff;--card:#ffffff;--tint:#f3eee3;--ink:#14202b;--sub:#5f6b7a;--sub2:#5f6b7a;--n:#0c737d;--nh:#0f3a3b;--nl:#dcebe9;--or:#e07a4f;--red:#c23a2b;--blue:#1f4f9a;--hair:rgba(20,32,43,0.18);--hair2:rgba(20,32,43,0.33);--up:0 0 0 1px rgba(20,32,43,0.105),0 1px 2px rgba(20,32,43,0.075),0 10px 28px -12px rgba(20,32,43,0.27);--in:inset 0 1px 2px rgba(20,32,43,0.21);color-scheme:only light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SUIT,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num,input.amt{font-variant-numeric:tabular-nums}
#root{min-height:100vh}
.yt-head{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--hair);background:var(--paper);position:sticky;top:0;z-index:20}
.yt-ic{width:38px;height:38px;border-radius:10px;background:var(--n);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yt-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.yt-ic i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid var(--paper)}
.yt-head h1{font-size:19px;font-weight:800;white-space:nowrap}
.yt-head small{font-size:13px;color:var(--sub2)}
.yt-yr{font-size:13px;font-weight:700;color:var(--n);background:var(--nl);border-radius:8px;padding:5px 10px;white-space:nowrap}
.yt-rul{margin-left:auto;display:flex;width:min(560px,46vw)}
.yt-rul button{flex:1;text-align:center;font-size:12.5px;color:var(--sub2);position:relative;padding-top:16px;white-space:nowrap}
.yt-rul button:before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:var(--hair2)}
.yt-rul button.done:before,.yt-rul button.on:before{background:var(--or)}
.yt-rul button.on:before{right:50%}
.yt-rul button b{position:absolute;top:0;left:50%;margin-left:-6px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--hair2)}
.yt-rul button.done b,.yt-rul button.on b{background:var(--or);border-color:var(--or)}
.yt-rul button.on b{box-shadow:0 0 0 4px rgba(224,122,79,0.18)}
.yt-rul button.on{color:var(--ink);font-weight:800}
.yt-main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:22px;padding:22px 24px 40px;max-width:1500px;margin:0 auto}
.yt-panel{background:var(--panel);border-radius:16px;box-shadow:var(--up);padding:22px 24px;display:flex;flex-direction:column;min-height:640px;align-self:start}
.yt-k{font-size:13px;color:var(--sub2);font-weight:700}
.yt-panel h2{font-size:24px;font-weight:800;margin:4px 0}
.yt-lead{font-size:14.5px;color:var(--sub);margin-bottom:16px}
.yt-sec{font-size:15.5px;font-weight:800;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:8px}
.yt-sec:first-of-type{border:0;padding-top:0;margin-top:4px}
.f{margin-bottom:14px;min-width:0}
.f>label,.f>.lb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px;font-weight:800;margin-bottom:6px}
.f>label,.f>.lb{flex-wrap:wrap;white-space:nowrap}
.f>label span,.f>.lb span{font-weight:500;color:var(--sub2);font-size:13px;text-align:right;white-space:normal;margin-left:auto}
.in{height:48px;border-radius:12px;background:#fff;box-shadow:var(--in),0 0 0 1px var(--hair2);display:flex;align-items:center;padding:0 14px;gap:6px}
.in:focus-within{box-shadow:0 0 0 2px var(--n)}
.in input{border:0;outline:0;background:none;width:100%;min-width:0;font-size:18px;font-weight:700;text-align:right}
.in input::placeholder{color:#b7ae9e;font-weight:600}
.in em{font-style:normal;font-size:15px;color:var(--sub2);font-weight:600;flex-shrink:0}
.in select{border:0;outline:0;background:none;width:100%;font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--sub2);margin-top:5px}
.hint b{color:var(--n)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--up)}
.chip.on{background:var(--n);color:#fff}
.box{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--sub);box-shadow:var(--in);margin:4px 0 12px}
.box b{color:var(--ink)}
.kid{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;box-shadow:var(--up);padding:8px 10px 8px 12px;margin-bottom:8px}
.kid .in{height:40px;width:130px;flex-shrink:0}
.kid .in input{font-size:16px}
.kid .ag{font-size:14px;color:var(--sub);white-space:nowrap}
.kid .tg{margin-left:auto;font-size:12.5px;font-weight:800;border-radius:7px;padding:3px 8px;background:var(--nl);color:var(--n);white-space:nowrap}
.kid .tg.x{background:var(--tint);color:var(--sub2)}
.kid .del{width:32px;height:32px;border-radius:8px;color:var(--sub2);font-size:20px;line-height:1;flex-shrink:0}
.kid .del:hover{background:var(--tint)}
.addb{width:100%;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--up);color:var(--n);font-weight:800;margin-bottom:12px}
.edu{display:grid;grid-template-columns:150px 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.edu .in{height:44px}
.more{width:100%;text-align:left;font-weight:800;font-size:14.5px;color:var(--n);padding:10px 0;display:flex;align-items:center;gap:6px}
.more i{font-style:normal;transition:transform .15s}
.more.op i{transform:rotate(90deg)}
.yt-nav{margin-top:auto;padding-top:18px;display:flex;gap:10px}
.btn{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;padding:0 20px;background:var(--card);box-shadow:var(--up);white-space:nowrap}
.btn:hover{box-shadow:0 0 0 2px var(--n)}
.btn:active{transform:translateY(1px)}
.btn.pr{background:var(--n);color:#fff;flex:1}
.btn.pr:hover{background:var(--nh);box-shadow:none}
.btn.sm{height:40px;font-size:14px;padding:0 14px}
.yt-res{display:flex;flex-direction:column;gap:16px;min-width:0;position:sticky;top:86px;align-self:start}
.big{background:var(--card);border-radius:16px;box-shadow:var(--up);padding:22px 26px}
.big .k2{font-size:14px;font-weight:800;color:var(--sub)}
.amt-b{font-size:clamp(34px,4.2vw,52px);font-weight:900;letter-spacing:-1.5px;color:var(--blue);margin:2px 0;line-height:1.15;word-break:keep-all}
.amt-b.pay{color:var(--red)}
.amt-b.zero{color:var(--ink)}
.amt-b small{font-size:.46em;font-weight:800;margin-left:4px;letter-spacing:-.3px}
.amt-s{font-size:14px;color:var(--sub2)}
.flow{display:flex;gap:8px;align-items:stretch;margin-top:16px}
.fb{flex:1;background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:var(--in);min-width:0}
.fb span{display:block;font-size:12.5px;color:var(--sub2);font-weight:700}
.fb b{font-size:clamp(15px,1.4vw,19px);font-weight:800}
.op{display:flex;align-items:center;font-size:18px;color:var(--sub2);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--up);padding:18px 20px;min-width:0}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border:0}
.row b{font-weight:800;white-space:nowrap}
.row.z{color:var(--sub2)}
.row.t{font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:9px}
.row.s{padding-left:14px;font-size:13.5px;color:var(--sub)}
.tip{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.tip:last-child{border:0}
.tip .d{width:34px;height:34px;border-radius:9px;background:var(--nl);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tip .d svg{width:19px;height:19px;stroke:var(--n);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip p{font-size:14px;line-height:1.4;flex:1;min-width:0}
.tip p small{color:var(--sub2);font-size:12.5px}
.tip b.g{color:var(--blue);font-size:16px;white-space:nowrap}
.tip.info b.g{color:var(--sub2);font-size:13px;font-weight:700}
.note{font-size:12.5px;color:var(--sub2);margin-top:10px}
.cardbar{height:12px;border-radius:6px;background:var(--tint);box-shadow:var(--in);position:relative;overflow:hidden;margin:6px 0 4px}
.cardbar i{position:absolute;left:0;top:0;bottom:0;background:var(--n);border-radius:6px}
.cardbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--or)}
.yt-mbar{display:none}
.yt-foot{text-align:center;font-size:12.5px;color:var(--sub2);padding:0 16px 30px}
.yt-foot a{color:var(--n);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* 결과 단계 */
.res-tbl .row span{min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:899px){
  .yt-head{height:56px;padding:0 16px}
  .yt-head small,.yt-head .yt-yr{display:none}
  .yt-head h1{font-size:17px}
  .yt-rul{display:none}
  .yt-mrul{display:flex;gap:4px;padding:10px 16px 0}
  .yt-mrul i{flex:1;height:4px;border-radius:2px;background:var(--hair2)}
  .yt-mrul i.d{background:var(--or)}
  .yt-main{grid-template-columns:1fr;padding:12px 12px 110px;gap:14px}
  .yt-panel{padding:18px 16px;min-height:0}
  .yt-panel h2{font-size:21px}
  .yt-res{position:static}
  .yt-res.side{display:none}
  .yt-nav{display:none}
  .yt-mbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--n);color:#fff;padding:10px 14px calc(12px + env(safe-area-inset-bottom));align-items:center;gap:8px;z-index:30}
  .yt-mbar span{font-size:12.5px;color:#eaf4f5;display:block}
  .yt-mbar b{font-size:22px;font-weight:900;white-space:nowrap}
  .yt-mbar .bk{margin-left:auto;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:11px 12px;font-weight:800;font-size:14px}
  .yt-mbar .go{background:#fff;color:var(--n);border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;white-space:nowrap}
  .flow{flex-wrap:wrap}.flow .op{display:none}.fb{flex:1 1 40%}
  .edu{grid-template-columns:118px 1fr 32px}
  .kid .in{width:112px}
}
@media (min-width:900px){.yt-mrul{display:none}}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .yt-head,.yt-panel,.yt-mbar,.yt-mrul,.yt-foot,.noprint,.toast{display:none!important}
  .yt-main{display:block;padding:0}
  .yt-res{position:static;display:flex!important}
  .big,.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .printhead{display:block!important;font-size:18px;font-weight:800;margin-bottom:8px}
}
.printhead{display:none}
/* 블로그 경유 잠금 — 막힘 화면 */
.bj-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#faf6ee;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bj-gate-in{max-width:520px;text-align:center;background:#fff;border:1px solid #e7e5dc;border-radius:20px;padding:36px 30px;box-shadow:0 10px 30px rgba(12,115,125,0.08)}
.bj-gate-mark{width:64px;height:64px;border-radius:18px;background:#0c737d;color:#fff;font:italic 800 34px/64px Georgia,serif;margin:0 auto 18px;position:relative}
.bj-gate-mark i{position:absolute;right:9px;bottom:10px;width:11px;height:11px;border-radius:50%;background:#e07a4f}
.bj-gate h1{font-size:21px;color:#20241f;margin:0 0 12px;letter-spacing:-.3px}
.bj-gate p{font-size:15px;color:#5c6259;line-height:1.7;margin:0}
.bj-gate b{color:#20241f}
.bj-gate-btn{display:inline-block;margin:22px 0 16px;background:#e07a4f;color:#fff;font-weight:700;text-decoration:none;border-radius:12px;padding:13px 26px;font-size:15.5px}
.bj-gate-s{font-size:12.5px!important;color:#5f6b7a!important}
.bj-gate-s a{color:#0c737d;font-weight:700}
/* ── 상장 만들기 전용 ── */
.yt-main{grid-template-columns:minmax(0,560px) minmax(0,1fr)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{text-align:left;background:var(--card);border-radius:12px;box-shadow:var(--up);padding:12px 14px;min-width:0;position:relative}
.tc b{display:block;font-size:16px;font-weight:800}
.tc span{display:block;font-size:13px;color:var(--sub2);margin-top:2px;line-height:1.35}
.tc:hover{box-shadow:0 0 0 2px var(--n)}
.tc.on{box-shadow:0 0 0 2px var(--n);background:#fff}
.tc.on:after{content:"";position:absolute;right:12px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--or)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.dc{background:var(--card);border-radius:12px;box-shadow:var(--up);padding:8px 8px 9px;text-align:center;min-width:0;position:relative}
.dc:hover{box-shadow:0 0 0 2px var(--n)}
.dc.on{box-shadow:0 0 0 2px var(--n);background:#fff}
.dc.on:after{content:"";position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--or);z-index:3}
.dc em{font-style:normal;display:block;font-size:13px;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thw{width:100%;position:relative;overflow:hidden;border-radius:3px;box-shadow:0 4px 10px -6px rgba(60,40,10,.5)}
.thw .sh{position:absolute;left:0;top:0;transform-origin:0 0}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.ec{background:var(--card);border-radius:12px;box-shadow:var(--up);padding:8px 6px 7px;text-align:center;position:relative}
.ec:hover{box-shadow:0 0 0 2px var(--n)}
.ec.on{box-shadow:0 0 0 2px var(--n);background:#fff}
.ec.on:after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--or)}
.ec .ei{width:46px;height:46px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.ec .ei svg{width:46px;height:46px}
.ec .ei.no{font-size:12.5px;color:var(--sub2);border:1.5px dashed var(--hair2);border-radius:10px}
.ec em{font-style:normal;display:block;font-size:12.5px;font-weight:700;margin-top:3px}
.fchip{font-size:16px!important}
.ti{height:46px;border-radius:12px;background:#fff;box-shadow:var(--in),0 0 0 1px var(--hair2);display:flex;align-items:center;padding:0 14px}
.ti:focus-within{box-shadow:0 0 0 2px var(--n)}
.ti input{border:0;outline:0;background:none;width:100%;min-width:0;font-size:16px;font-weight:600}
.ta{width:100%;min-height:150px;border-radius:12px;background:#fff;box-shadow:var(--in),0 0 0 1px var(--hair2);border:0;outline:0;padding:12px 14px;font:inherit;font-size:15.5px;line-height:1.7;resize:vertical}
.ta:focus{box-shadow:0 0 0 2px var(--n)}
.ex{display:block;width:100%;text-align:left;background:var(--card);border-radius:12px;box-shadow:var(--up);padding:10px 12px;margin-bottom:8px;font-size:13.5px;line-height:1.5;color:var(--sub)}
.ex:hover{box-shadow:0 0 0 2px var(--n)}
.ex.on{box-shadow:0 0 0 2px var(--n);background:#fff;color:var(--ink)}
.ex i{font-style:normal;font-weight:800;color:var(--n);margin-right:6px}
.dt{position:relative;height:46px;border-radius:12px;background:#fff;box-shadow:var(--in),0 0 0 1px var(--hair2);display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dt:focus-within{box-shadow:0 0 0 2px var(--n)}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr) 30px;gap:6px;align-items:center;margin-bottom:6px}
.prow .ti{height:40px;padding:0 10px}
.prow .ti input{font-size:14.5px}
.prow .nn{font-size:12.5px;color:var(--sub2);text-align:center;font-variant-numeric:tabular-nums}
.prow .del{width:30px;height:30px;border-radius:8px;color:var(--sub2);font-size:20px;line-height:1}
.prow .del:hover{background:var(--tint)}
.prow.hd{font-size:12.5px;font-weight:800;color:var(--sub2);margin-bottom:4px}
.prow.cur .nn{color:#fff;background:var(--n);border-radius:6px;padding:2px 0}
.bt2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.nud{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nud button{width:40px;height:38px;border-radius:10px;background:var(--card);box-shadow:var(--up);font-weight:800;font-size:15px}
.nud button:hover{box-shadow:0 0 0 2px var(--n)}
.nud span{font-size:14px;font-weight:700;min-width:118px;font-variant-numeric:tabular-nums}
.rng{width:100%;accent-color:var(--n)}
.imgbox{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--up);padding:10px 12px;margin-bottom:10px}
.imgbox .iv{width:74px;height:74px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.imgbox .iv img,.imgbox .iv svg{max-width:68px;max-height:68px}
.imgbox p{font-size:13px;color:var(--sub);flex:1;min-width:0}
/* 미리보기 */
.pv{background:var(--card);border-radius:16px;box-shadow:var(--up);padding:16px 18px}
.pv-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pv-top h3{font-size:15px;font-weight:800}
.pv-top small{font-size:13px;color:var(--sub2)}
.pv-pg{margin-left:auto;display:flex;align-items:center;gap:6px}
.pv-pg button{width:34px;height:34px;border-radius:9px;background:var(--panel);box-shadow:var(--up);font-weight:800}
.pv-pg span{font-size:14px;font-weight:700;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

<script>/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;

    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev || (() => { try { return localStorage.getItem("bj-owner") === "1"; } catch (e) { return false; } })()) { embedOK = inFrame && (dev || fromBlog()); return true; }   /* 11-10: 주인 시험 모드 — 테스트 허브(jhub.html)에서 이 기기에 켠 경우만 */
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();</script>

/* ── 용지 크기 ── */
function dims() {
  const P = PAPERS.find(x => x[0] === S.paper) || PAPERS[0];
  let w = P[0] === "custom" ? Math.max(80, Math.min(600, +S.pw || 210)) : P[2], h = P[0] === "custom" ? Math.max(80, Math.min(600, +S.ph || 297)) : P[3];
  if (w > h) [w, h] = [h, w];
  if (S.orient === "l") [w, h] = [h, w];
  return { w, h, s: Math.min(w, h) / 210, land: w > h };
}

/* ── 글자 직인 자동 만들기 ── */
function sealChars() {
  let t = (S.sealText || "").replace(/\s/g, "");
  if (!t) { t = (S.org || "").replace(/\s/g, "").replace(/(주식회사|\(주\))/g, ""); if (t && !/인$/.test(t)) t = t.slice(0, 8) + "인"; }
  return [...t].slice(0, 9);
}
function autoSeal() {
  const ch = sealChars(); if (!ch.length) return "";
  const n = ch.length, rows = n <= 2 ? n : n <= 4 ? 2 : 3, cols = Math.ceil(n / rows);
  const cw = 80 / cols, rh = 80 / rows, fz = Math.min(cw * 1.02, rh) * .9;
  let t = "";
  ch.forEach((c, i) => { const col = Math.floor(i / rows), row = i % rows; const x = 90 - cw * (col + .5), y = 10 + rh * (row + .5);
    t += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${fz.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="'Nanum Myeongjo',serif" font-weight="800" fill="#c8202c" transform="scale(${(cw / (rh || 1) > 1.1 ? 1 : 1)} 1)">${esc(c)}</text>`; });
  return `<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="3" fill="none" stroke="#c8202c" stroke-width="5"/>${t}</svg>`;
}
function sealHtml() {
  if (S.sealMode === "none") return "";

}

function autofit(sh) {
  const p = sh.querySelector(".p"), d = sh.querySelector(".dte"); if (!p || !d) return;
  const f0 = +p.dataset.fs, gap = parseFloat(getComputedStyle(sh).fontSize) * .9;

/* ── 이미지(직인 · 로고) ── */
function loadImg(file) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = r.result; }; r.onerror = no; r.readAsDataURL(file); }); }
function toCanvas(im, max) { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k)); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return c; }
async function processSeal() {
  if (!S.sealSrc) return;
  const im = new Image(); await new Promise(r => { im.onload = r; im.onerror = r; im.src = S.sealSrc; });
  const c = toCanvas(im, 700), x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height), a = d.data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let i = 0; i < a.length; i += 4) {
    const r = a[i], g = a[i + 1], b = a[i + 2];
    let al = a[i + 3] / 255;
    if (S.sealBg) { const red = r - Math.max(g, b); const lum = .299 * r + .587 * g + .114 * b;
      let k = Math.max(0, Math.min(1, (232 - lum) / 70)); if (red > 40) k = Math.max(k, Math.min(1, (red - 30) / 60)); al *= k; }
    if (S.sealRed) { a[i] = 200; a[i + 1] = 32; a[i + 2] = 44; }
    a[i + 3] = Math.round(al * 255);
    if (a[i + 3] > 30) { const p = i / 4, px = p % c.width, py = (p / c.width) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  }
  x.putImageData(d, 0, 0);
  if (x1 <= x0 || y1 <= y0) { S.sealImg = c.toDataURL("image/png"); return; }
  const m = 4, o = document.createElement("canvas"); o.width = x1 - x0 + 1 + m * 2; o.height = y1 - y0 + 1 + m * 2;
  o.getContext("2d").drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, m, m, x1 - x0 + 1, y1 - y0 + 1);
  S.sealImg = o.toDataURL("image/png");
}
function pick(kind, cam) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = cam ? "image/*" : "image/png,image/jpeg,image/webp,image/gif";

  inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return;
    try { const im = await loadImg(f);
      if (kind === "seal") { S.sealSrc = toCanvas(im, 700).toDataURL("image/png"); S.sealMode = "img"; await processSeal(); toast("직인을 넣었어요"); }
      else { S.logo = toCanvas(im, 500).toDataURL("image/png"); toast("로고를 넣었어요"); }
      save(); render();
    } catch (e) { toast("이미지를 읽지 못했어요 — PNG · JPG 파일인지 확인해 주세요"); } };
  inp.click();
}

/* ── 붙여넣기 ── */
function parsePaste(t) {
  const out = [];
  t.split(/\r?\n/).forEach(line => { const raw = line.trim(); if (!raw) return;
    let c = raw.includes("\t") ? raw.split("\t") : raw.includes(",") ? raw.split(",") : raw.split(/\s{2,}/);
    c = c.map(x => x.trim()); if (c.every(x => !x)) return;
    if (/^(이름|성명)$/.test(c[0]) || c.some(x => /^(이름|성명)$/.test(x)) && out.length === 0) return;
    if (c.length === 1) out.push({ dept: "", name: c[0], aw: "" });
    else if (c.length === 2) out.push({ dept: c[0], name: c[1], aw: "" });
    else out.push({ dept: c[0], name: c[1], aw: c.slice(2).join(" ") });
  });
  return out;
}

  document.body.appendChild(d); setTimeout(() => d.querySelector("textarea").focus(), 50);
  d.addEventListener("click", e => { const b = e.target.closest("[data-pst]"); if (e.target === d) return d.remove(); if (!b) return;
    if (b.dataset.pst === "close") return d.remove();

  const dt = e.target.closest(".dt"); if (dt) { const inp = dt.querySelector("input"); try { inp.showPicker(); e.preventDefault(); } catch (er) {} }
});
document.addEventListener("focusin", e => { const t = e.target; if (t.dataset && t.dataset.pf) { const i = +t.dataset.i; if (S.cur !== i) { S.cur = i; document.querySelectorAll(".prow").forEach((r, j) => r.classList.toggle("cur", j - 1 === i)); renderPreview(); } } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.pf === "aw" || e.key === "Enter" && e.target.dataset && e.target.dataset.pf === "name" && window.innerWidth < 900) { const i = +e.target.dataset.i; if (i === S.people.length - 1) { S.people.push({ dept: "", name: "", aw: "" }); save(); render(); const el = document.querySelector(`[data-pf="name"][data-i="${i + 1}"]`); if (el) el.focus(); } else { const el = document.querySelector(`[data-pf="name"][data-i="${i + 1}"]`); if (el) el.focus(); } } });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.closest(".pop")) return;
  const d = b.dataset;
  if (d.go != null) { if (+d.go >= 2 && !S.kindPicked) { if (S.step !== 1) go(1); return toast("먼저 넣을 내용을 골라 주세요"); } return go(+d.go); }
  if (b.hasAttribute("data-next")) { if (S.step === 0 && !S.desPicked) { S.desPicked = true; toast(`「${(DESK[S.des] || {}).n}」 디자인으로 할게요`); } if (S.step === 1 && !S.kindPicked) return toast("내용을 하나 골라 주세요 — 처음부터 쓰려면 「직접 입력」"); return go(S.step + 1); }
  if (b.hasAttribute("data-prev")) return history.state && typeof history.state.aw === "number" && history.state.aw === S.step && S.step > 0 ? history.back() : go(S.step - 1);
  if (b.hasAttribute("data-pvjump")) { const r = $("#res"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.kind) { applyKind(d.kind); save(); render(); if (window.innerWidth < 900) toast(d.kind === "custom" ? "빈 상장을 준비했어요 — 「다음」에서 직접 써요" : `${KIND[d.kind].n} 내용을 넣었어요 — 「다음」에서 고쳐 써요`); return; }
  if (d.des) { S.des = d.des; S.desPicked = true; save(); return render(); }   /* 방향은 「방향」에서 고른 그대로(패 모양도 자동으로 가로로 바꾸지 않음) */
  if (d.deco) { S.deco = d.deco; S.decoPicked = true; save(); return render(); }
  if (d.dpos) { S.decoPos = d.dpos; save(); return render(); }
  if (d.font) { S.font = d.font; S.decoPicked = true; save(); return render(); }
  if (d.orient) { S.orient = d.orient; S.orientPicked = true; save(); return render(); }
  if (d.awc != null) { S.aw = d.awc; save(); return render(); }
  if (d.tx != null) { S.body = KIND[S.kind].tx[+d.tx]; save(); return render(); }
  if (d.dfmt) { S.dateFmt = d.dfmt; save(); return render(); }
  if (d.tog) { S[d.tog] = !S[d.tog]; if (d.tog === "sealBg" || d.tog === "sealRed") return processSeal().then(() => { save(); render(); }); save(); return render(); }
  if (d.who) { S.who = d.who; save(); return render(); }
  if (b.hasAttribute("data-paste")) return openPaste();
  if (b.hasAttribute("data-padd")) { S.people.push({ dept: "", name: "", aw: "" }); S.cur = S.people.length - 1; save(); render(); const el = document.querySelector(`[data-pf="name"][data-i="${S.cur}"]`); if (el) el.focus(); return; }
  if (d.pdel != null) { S.people.splice(+d.pdel, 1); if (!S.people.length) S.people.push({ dept: "", name: "", aw: "" }); S.sampleP = false; save(); return render(); }
  if (b.hasAttribute("data-pclear")) { if (!confirmTwice("pclear")) return; S.people = [{ dept: "", name: "", aw: "" }]; S.cur = 0; S.sampleP = false; save(); return render(); }
  if (d.pg) { S.cur = (S.cur + +d.pg + S.people.length) % S.people.length; if (S.step === 3) { save(); return render(); } return renderPreview(); }
  if (d.sm) { S.sealMode = d.sm; save(); render(); return; }
  if (d.pick) return pick(d.pick, !!d.cam);
  if (b.hasAttribute("data-logodel")) { S.logo = ""; save(); return render(); }
  if (d.nud) { const v = d.nud;
    if (v === "seal0") { S.sealDx = 0; S.sealDy = 0; } else if (v === "off0") { S.offX = 0; S.offY = 0; }
    else { const [k, n] = v.split(":"); S[k] = Math.max(-40, Math.min(40, (+S[k] || 0) + +n)); }
    const a = $("#sdv"); if (a) a.textContent = `가로 ${S.sealDx} · 세로 ${S.sealDy}`; const o = $("#ofv"); if (o) o.textContent = `가로 ${S.offX} · 세로 ${S.offY}mm`;
    save(); return renderPreview(); }
  if (d.paper) { S.paper = d.paper; save(); return render(); }
  if (d.mode) { S.mode = d.mode; save(); return render(); }
  if (d.print) return doPrint(d.print);
  if (b.hasAttribute("data-reset")) { if (!confirmTwice("reset")) return; const keep = { sealSrc: S.sealSrc, sealImg: S.sealImg, logo: S.logo }; S = Object.assign(BLANK(), { sealSrc: "", sealImg: "", logo: "" }); try { localStorage.removeItem(LSK); } catch (er) {} go(0); toast("입력한 내용을 모두 지웠어요"); }
});
let ctT = 0, ctK = "";
function confirmTwice(k) { const n = Date.now(); if (ctK === k && n - ctT < 4000) return true; ctK = k; ctT = n; toast("한 번 더 누르면 지워요"); return false; }
function toast(t) { const o = document.querySelector(".toast"); if (o) o.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* 시작 — 블로그 경유 잠금(대표 글 공개 시각부터) */
const GATE_ON = false;   /* 대표 글 날짜가 정해지면 Date.now() >= Date.parse("…") 로 */
(async () => {
  const T = new URLSearchParams(location.search).get("tab") || "all";
  if (GATE_ON && !(await BJ_GATE.check(TOOL, T))) return;
  if (KIND[T] && T !== "custom" && !localStorage.getItem(LSK)) applyKind(T);
  try { history.replaceState({ aw: S.step }, "", location.href); } catch (e) {}
  render();
  if (document.fonts) document.fonts.ready.then(() => { renderPreview(); if (S.step === 0) fitThumbs(); });
})();

/* 블로그 글 속(iframe)에서만: 내용 높이를 블로그에 알림 */
(function () { if (!EMBED || window.parent === window) return;
  let last = 0, t = null;
  function send() { const r = document.getElementById("root"); if (!r) return; const h = Math.ceil(r.getBoundingClientRect().height) + 8; if (Math.abs(h - last) < 4) return; last = h; try { window.parent.postMessage({ blogj: "height", h }, "https://luvbong.tistory.com"); } catch (e) {} }
  function soon() { clearTimeout(t); t = setTimeout(send, 60); }
  if (window.ResizeObserver) new ResizeObserver(soon).observe(document.getElementById("root"));
  window.addEventListener("load", send); setTimeout(send, 300);
})();
</script>
</body></html>
