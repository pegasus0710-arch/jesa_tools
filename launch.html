<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로그램 실행 | Blog J</title><meta name="robots" content="noindex"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;}body{padding:2px 12px 26px;}html,body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#20241f}
.lc{border:1px solid #d6d9e0;border-top:5px solid var(--c);border-radius:18px;background:#fff;padding:22px 22px 18px;box-shadow:0 10px 24px rgba(32,38,58,.13);margin:0}
.lc-main{display:flex;gap:22px;align-items:stretch}.lc-info{flex:1;min-width:0}
.lc-head{display:flex;gap:14px;align-items:center}.lc-ic{position:relative;width:58px;height:58px;border-radius:16px;background:var(--c);display:grid;place-items:center;flex-shrink:0}.lc-ic svg{width:30px;height:30px}
.lc-ic i{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#e08a3e;border:3px solid #fff}
.lc-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:var(--ct,#e3f3f5);border-radius:999px;padding:2px 10px}
.lc-head h2{margin:4px 0 0;font-size:24px;letter-spacing:-.6px;font-weight:800}
.lc-desc{margin:14px 0 12px;font-size:14.5px;line-height:1.6;color:#4a4f47}
.lc-chips{display:flex;flex-wrap:wrap;gap:6px}.lc-chips span{font-size:12.5px;font-weight:600;color:#20263a;background:#f2f1ec;border-radius:999px;padding:4px 10px}
.lc-prev{width:250px;flex-shrink:0;background:#eef0f4;border:1px solid #dde0e7;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pv-bar{display:flex;align-items:center;gap:4px;padding:7px 10px;background:#e3e6ec;font-size:11px;color:#5c6259}.pv-bar b{font-size:10px}.pv-bar span{margin-left:6px;font-weight:700}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px;flex:1}
.pv-pg{position:relative;background:#fff;border:1px solid #e1e3e9;border-radius:5px;padding:16px 8px 6px;min-height:58px}.pv-pg em{position:absolute;left:4px;top:3px;font-style:normal;font-size:8px;color:#fff;background:#20263a;border-radius:3px;padding:0 3px}
.pv-pg b{display:block;font-size:9px;color:#20263a;margin-bottom:3px}.pv-pg p{height:3px;background:#dfe2e8;border-radius:2px;margin:3px 0}.pv-pg p.s{width:60%}.pv-pg p.mk{position:absolute;left:8px;right:8px;top:28px;height:8px;background:#111}
.pv-save{margin:0 10px 10px;background:#e08a3e;color:#fff;font-size:11px;font-weight:700;text-align:center;border-radius:7px;padding:6px}
.lc-go{margin-top:18px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;background:linear-gradient(180deg,#e9984f,#dd7f2f);color:#fff;font:inherit;font-size:19px;font-weight:800;letter-spacing:-.3px;padding:17px 18px;cursor:pointer;box-shadow:0 8px 20px rgba(224,138,62,.42),inset 0 -2px 0 rgba(0,0,0,.08);transition:transform .12s,box-shadow .12s}
.lc-go:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(224,138,62,.5)}.lc-go svg{width:22px;height:22px}
.lc-sub{margin:9px 0 0;text-align:center;font-size:12.5px;color:#8a8f84}
.lc-msg{margin-top:18px;border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.6}.lc-msg.ok{background:#e7f4ec;color:#1f6b45}.lc-msg.warn{background:#fff6ea;color:#7a4a12}
.lc-msg a{color:#20263a;font-weight:700}.lc-again{margin-left:6px;border:1px solid currentColor;background:#fff;color:inherit;font:inherit;font-weight:700;border-radius:8px;padding:3px 10px;cursor:pointer}
@media(max-width:560px){.lc{padding:18px 16px 14px}.lc-main{flex-direction:column}.lc-prev{display:none}.lc-head h2{font-size:21px}.lc-go{font-size:18px}}

.lc-two{display:flex;gap:12px;margin-top:18px}.lc-col{flex:1;min-width:0;border:1px solid #e7e5dc;border-radius:14px;padding:14px;background:#faf9f6}
.lc-h{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--c)}.lc-col .lc-go{margin-top:0;font-size:17px;padding:14px}
.lc-dl{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:14px;background:#20263a;color:#fff;font-size:17px;font-weight:800;padding:14px;text-decoration:none;box-shadow:0 8px 18px rgba(32,38,58,.25)}.lc-dl svg{width:20px;height:20px}
.lc-col .lc-sub{margin-top:7px}
@media(max-width:560px){.lc-two{flex-direction:column}}
</style></head>
<body><div id="root"></div><script>/* ══════════ Blog J 블로그 경유 잠금 + 새 창으로 열기 (공통) ══════════
   허용: ① luvbong.tistory.com 글 속 프로그램 창(iframe)  ② 그 창이 "새 창으로 열기"로 연 창
   그 밖(주소 복사·공유 링크·즐겨찾기·직접 입력·다른 사이트에 퍼가기)은 막고 해당 글로 안내.
   서버 없는 브라우저 안 확인이라 일반 사용자의 건너뛰기를 막는 수준(의도적 우회는 못 막음). */
const BJ_BLOG = "https://luvbong.tistory.com";
const BJ_GATE = (() => {
  const S = "bjgate:";                       /* 새 창 안에서만 유지되는 확인 표시(sessionStorage) */
  const tokens = new Map();                  /* 글 속 도구가 발급한 일회용 확인값 */
  const approved = new Set();                /* 확인을 마친 새 창 — 이 창에만 작업을 넘겨줌 */
  let provider = null, handoff = null;       /* 넘겨줄 작업을 만드는 함수 / 새 창이 받은 작업 */
  const inFrame = window.parent !== window;
  const dev = (location.protocol === "file:" || location.hostname === "localhost") && new URLSearchParams(location.search).get("bjdev") === "1";
  const fromBlog = () => { try { const a = location.ancestorOrigins; if (a && a.length) return a[a.length - 1] === BJ_BLOG; } catch (e) {}
    return (document.referrer || "").startsWith(BJ_BLOG + "/"); };
  let embedOK = false;

  /* 글 속 도구: 새 창이 보내는 확인 요청에 답함 */
  window.addEventListener("message", e => {
    const d = e.data; if (!d || d.bjgate !== "verify" || e.origin !== location.origin) return;
    const t = tokens.get(d.t); tokens.delete(d.t);
    const ok = embedOK && t && Date.now() - t.at < 30000 && e.source === t.win;
    if (ok) approved.add(e.source);
    try { e.source.postMessage({ bjgate: ok ? "ok" : "no", t: d.t }, location.origin); } catch (err) {}
  });
  window.addEventListener("message", e => {   /* 새 창이 작업을 달라고 할 때 (확인된 창에만) */
    const d = e.data; if (!d || d.bjhand !== "req" || e.origin !== location.origin || !approved.has(e.source)) return;
    approved.delete(e.source);
    let data = null; try { data = provider ? provider() : null; } catch (err) {}
    try { e.source.postMessage({ bjhand: "data", data }, location.origin); } catch (err) {}
  });

  /* 새 창으로 열기 (글 속 도구에서만) */
  function openWindow(key, params, file) {
    const t = Math.random().toString(36).slice(2) + Date.now().toString(36);
    const q = new URLSearchParams(params || {}); q.delete("embed"); q.set("bjt", t);
    const path = file ? location.pathname.replace(/[^/]*$/, file) : location.pathname;
    const url = path + "?" + q.toString();
    const w = window.open(url, "bj_" + key + "_" + (q.get("tab") || "all"), "popup,width=1320,height=920");
    if (!w) return false;
    tokens.set(t, { at: Date.now(), win: w });
    return true;
  }

  /* 막힘 화면 */
  async function blocked(key, tab, why) {
    const post = BJ_BLOG + "/";     /* 막힘 화면은 늘 블로그 첫 화면으로 (글마다 주소를 적을 필요 없음) */
    const root = document.getElementById("root");
    root.innerHTML = `<div class="bj-gate"><div class="bj-gate-in">
      <div class="bj-gate-mark">J<i></i></div>
      <h1>Blog J 블로그 글에서 열어 주세요</h1>
      <p>이 도구는 <b>Blog J 블로그 글</b>을 통해서만 쓸 수 있어요.<br>글 안의 도구에서 <b>새 창으로 열기</b>를 누르면 광고 없이 도구만 크게 띄워 쓸 수 있습니다.</p>
      <a class="bj-gate-btn" href="${post}" target="_top" rel="noopener">Blog J 이동하기 ›</a>
      <p class="bj-gate-s">${why === "frame" ? "다른 사이트에 넣은 도구는 열리지 않아요." : "주소를 직접 입력하거나, 즐겨찾기·공유받은 링크로는 열리지 않아요."} · 설치·가입 없는 무료 도구 모음 <a href="${BJ_BLOG}/" target="_top" rel="noopener">Blog J</a></p>
    </div></div>`;
    document.title = "Blog J 블로그 글에서 열어 주세요";
    return false;
  }

  /* 시작할 때 확인: true면 도구를 띄움 */
  async function check(key, tab, opts) {
    if (dev) { embedOK = inFrame; return true; }
    /* 예전 글 호환: 블로그 글의 링크를 눌러 들어온 경우 허용 (프로그램 창 → 실행 카드로 바꾸기 전까지만) */
    if (!inFrame && opts && opts.legacyReferrer && (document.referrer || "").startsWith(BJ_BLOG + "/")) return true;
    if (inFrame) { embedOK = fromBlog(); return embedOK ? true : blocked(key, tab, "frame"); }
    try { const v = sessionStorage.getItem(S + key);
      if (v) { if (v !== "1" && v !== (tab || "all")) { const q = new URLSearchParams(location.search); q.set("tab", v); location.replace(location.pathname + "?" + q.toString()); return false; } return true; } } catch (e) {}
    const q = new URLSearchParams(location.search), t = q.get("bjt");
    if (t && window.opener) {
      const ok = await new Promise(res => {
        const on = e => { if (e.origin === location.origin && e.data && e.data.t === t && (e.data.bjgate === "ok" || e.data.bjgate === "no")) { window.removeEventListener("message", on); res(e.data.bjgate === "ok"); } };
        window.addEventListener("message", on);
        try { window.opener.postMessage({ bjgate: "verify", t }, location.origin); } catch (e) { res(false); }
        setTimeout(() => { window.removeEventListener("message", on); res(false); }, 3000);
      });
      if (ok) { try { sessionStorage.setItem(S + key, tab || "all"); } catch (e) {}
        const op = window.opener;
        handoff = await new Promise(res => {
          const on = e => { if (e.origin === location.origin && e.source === op && e.data && e.data.bjhand === "data") { window.removeEventListener("message", on); res(e.data.data || null); } };
          window.addEventListener("message", on);
          try { op.postMessage({ bjhand: "req" }, location.origin); } catch (e) { res(null); }
          setTimeout(() => { window.removeEventListener("message", on); res(null); }, 4000);
        });
        q.delete("bjt"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q.toString() : ""));
        try { window.opener = null; } catch (e) {}
        return true; }
    }
    return blocked(key, tab, "direct");
  }
  return { check, openWindow, embedded: () => { embedOK = inFrame && (dev || fromBlog()); return embedOK; }, inFrame: () => inFrame, setProvider: fn => { provider = fn; }, takeHandoff: () => { const h = handoff; handoff = null; return h; } };
})();

/* ══════════ Blog J 프로그램 실행 카드 (글 속에 넣는 작은 창) ══════════ */
const LQ = new URLSearchParams(location.search);
const TOOLS = {
  jibang: { file: "jibang.html", color: "#7a4b2a", tag: "#f4ebe3", name: "제사 지방 출력", icon: "printer",
    dl: { href: "https://pegasus0710-arch.github.io/jesa_tools/downloads/jesa-jibang-v1.0.zip", file: "jesa-jibang-v1.0.zip", size: "약 270KB" },
    tabs: {
    print: { title: "제사 지방 출력", desc: "관계만 고르면 한자 지방 완성, A4 한 장에 2매 인쇄 — 설치·가입 없이", chips: ["관계 26가지", "한자 · 한글 독음 · 우리말", "본관·성씨 한자 변환", "지방틀 크기 조절"] },
    calc: { title: "제사 날짜 계산기", desc: "음력 기일을 양력으로, 삼우제·49재·소상·대상까지", chips: ["음력 · 양력 · 윤달", "앞으로 10년 기일", "삼우제 · 49재 · 백일"] },
    charye: { title: "차례상 배치도", desc: "전통 · 간소 · 영남식 차례상을 설날·추석별로", chips: ["배치도 3종", "설날 · 추석", "전해 오는 용어 풀이"] } } },
  pdf: { file: "pdf.html", color: "#1f7f8f", tag: "#e3f3f5", name: "PDF 편집 도구", tabs: {
    all: { title: "PDF 편집 도구", desc: "합치기·나누기·용량 줄이기·개인정보 가리기·서명까지 — 서류를 올리지 않고 내 기기 안에서", chips: ["합치기", "나누기", "페이지 추출", "삭제·회전", "JPG 변환", "용량 줄이기", "가리기", "서명·도장", "쪽 번호", "워터마크"] },
    merge: { title: "PDF 합치기", desc: "여러 PDF와 사진을 원하는 순서대로 한 파일로 — 서류를 올리지 않고 내 기기 안에서", chips: ["PDF + 사진 섞기", "끌어서 순서 바꾸기", "파일 이름순 정렬", "A4에 맞추기"] },
    img2pdf: { title: "JPG PDF 변환", desc: "휴대폰으로 찍은 서류 사진 여러 장을 PDF 한 파일로", chips: ["JPG·PNG·WEBP", "A4에 맞추기", "여백 선택", "순서 바꾸기"] },
    compress: { title: "PDF 용량 줄이기", desc: "\"10MB 이하\"처럼 정한 용량에 맞춰 자동으로 줄여요", chips: ["목표 용량 맞추기", "단계 고르기", "원래보다 크면 그대로", "스캔본에 효과 큼"] },
    split: { title: "PDF 나누기", desc: "페이지마다, 또는 N쪽마다 따로 PDF로 저장해요", chips: ["페이지마다 따로", "N쪽마다 나누기", "zip으로 한 번에"] },
    extract: { title: "PDF 페이지 추출", desc: "필요한 쪽만 골라 새 PDF로 저장해요", chips: ["쪽 번호로 고르기 (1-3, 5)", "눌러서 고르기", "선택한 페이지만 저장"] },
    organize: { title: "PDF 페이지 삭제·회전", desc: "필요 없는 쪽은 지우고, 돌아간 쪽은 바로 세우고, 순서도 바꿔요", chips: ["삭제", "회전", "끌어서 순서", "빈 페이지 넣기"] },
    pdf2jpg: { title: "PDF JPG 변환", desc: "PDF의 각 쪽을 JPG·PNG 그림으로 저장해요", chips: ["JPG · PNG", "선명도 3단계", "zip으로 한 번에"] },
    redact: { title: "PDF 개인정보 가리기", desc: "주민등록번호 뒷자리를 가리면 그 글자가 실제로 지워져요", chips: ["네모로 가리기", "검정 · 흰색", "글자 실제 삭제"] },
    sign: { title: "PDF 서명·도장 넣기", desc: "서명을 직접 그리거나 도장 사진을 올려 원하는 자리에", chips: ["서명 그리기", "도장 사진 흰 배경 투명", "모든 쪽 같은 자리"] },
    pagenum: { title: "PDF 쪽 번호 넣기", desc: "제출 서류에 쪽 번호를 원하는 위치·모양으로", chips: ["위치 6곳", "1 · 1/10 · - 1 -", "시작 번호", "표지 건너뛰기"] },
    watermark: { title: "PDF 워터마크 넣기", desc: "\"사본\" · \"제출용\" 같은 표시를 모든 쪽에", chips: ["한글 가능", "가운데 · 반복", "진하기 · 기울기"] } } } };
const TL = TOOLS[LQ.get("tool")] || TOOLS.pdf, TB = TL.tabs[LQ.get("tab")] ? LQ.get("tab") : Object.keys(TL.tabs)[0], C = TL.tabs[TB];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 16h5"/></svg>';
const ICON_PRINT = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';
const ICON_GO = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function render(state) {
  const ok = BJ_GATE.embedded();
  document.getElementById("root").innerHTML = `
  <div class="lc" style="--c:${TL.color};--ct:${TL.tag}">
    <div class="lc-main">
      <div class="lc-info">
        <div class="lc-head"><span class="lc-ic">${TL.icon === "printer" ? ICON_PRINT : ICON_DOC}<i></i></span><div><span class="lc-tag">Blog J 무료 프로그램</span><h2>${esc(C.title)}</h2></div></div>
        <p class="lc-desc">${esc(C.desc)}</p>
        <div class="lc-chips">${C.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>
      </div>
      ${(LQ.get("tool") || "pdf") === "pdf" ? `<div class="lc-prev" aria-hidden="true"><div class="pv-bar"><b style="color:#e2766a">●</b><b style="color:#e3b44f">●</b><b style="color:#62b46e">●</b><span>${esc(C.title)}</span></div>
        <div class="pv-grid">${[["계약서", 0], ["등본", 1], ["신분증", 0], ["", 0]].map(([t, m], i) => `<div class="pv-pg">${t ? `<em>${i + 1}</em><b>${t}</b>` : ""}<p></p><p></p><p class="s"></p>${m ? '<p class="mk"></p>' : ""}</div>`).join("")}</div>
        <div class="pv-save">PDF로 저장</div></div>` : ""}
    </div>
    ${!ok ? `<div class="lc-msg warn">이 프로그램은 <b>Blog J 블로그 글</b>에서 실행할 수 있어요. <a href="https://luvbong.tistory.com/" target="_top" rel="noopener">Blog J 이동하기 ›</a></div>`
      : state === "opened" ? `<div class="lc-msg ok"><b>새 창에서 프로그램이 열렸어요.</b> 창이 보이지 않으면 화면 아래 작업 표시줄을 확인하세요. <button class="lc-again">다시 열기</button></div>`
      : state === "blocked" ? `<div class="lc-msg warn"><b>새 창이 막혔어요.</b> 주소창 오른쪽의 팝업 차단 아이콘을 눌러 <b>항상 허용</b>을 고른 뒤 다시 눌러 주세요. <button class="lc-again">다시 열기</button></div>`
      : TL.dl ? `<div class="lc-two"><div class="lc-col"><p class="lc-h">온라인으로 바로 쓰기</p><button class="lc-go">${ICON_GO}<span>프로그램 실행하기</span></button><p class="lc-sub">새 창에서 열려요 · 설치·가입 없음</p></div>
          <div class="lc-col"><p class="lc-h">내 PC에 받아서 쓰기</p><a class="lc-dl" href="${TL.dl.href}" target="_blank" rel="noopener">${ICON_DL}<span>무료 다운로드</span></a><p class="lc-sub">${esc(TL.dl.file)} · ${esc(TL.dl.size)} · 인터넷 없이 실행</p></div></div>`
      : `<button class="lc-go">${ICON_GO}<span>프로그램 실행하기</span></button><p class="lc-sub">새 창에서 열려요 · 설치·가입·업로드 없음 · 광고 없이 도구만 크게</p>`}
  </div>`;
  const go = () => { const p = { tab: TB }; ["cat", "opt"].forEach(k => { if (LQ.get(k)) p[k] = LQ.get(k); }); render(BJ_GATE.openWindow(LQ.get("tool") || "pdf", p, TL.file) ? "opened" : "blocked"); };
  document.querySelectorAll(".lc-go,.lc-again").forEach(b => b.onclick = go);
  try { parent.postMessage({ blogj: "height", h: document.documentElement.scrollHeight }, "https://luvbong.tistory.com"); } catch (e) {}
}
render("ready");
window.addEventListener("resize", () => { try { parent.postMessage({ blogj: "height", h: document.documentElement.scrollHeight }, "https://luvbong.tistory.com"); } catch (e) {} });
</script></body></html>
